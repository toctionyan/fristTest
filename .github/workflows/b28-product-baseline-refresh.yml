name: B28 Product Baseline Refresh
run-name: Refresh V20.18 token-usage repair product-source baseline

"on":
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.b28-baseline-refresh-trigger]

permissions:
  contents: write

env:
  REPAIR_BRANCH: repair/v20.18-preserve-token-usage-telemetry-20260813

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'repair/v20.18-preserve-token-usage-telemetry-20260813'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact V20.18 repair candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Install locked validation environment
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups

      - name: Prove focused redaction and lifecycle attestation behavior
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          services/agent-service/.venv/bin/python -m pytest -q \
            services/agent-service/tests/runtime/test_b15b2_real_model_lifecycle_attestation_boundary.py

      - name: Refresh only the exact approved protected delta
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          export SOURCE_HEAD="$(git rev-parse HEAD)"
          "${pythonLocation}/bin/python" -B - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.').resolve()
          baseline_path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(baseline_path.read_text(encoding='utf-8'))
          protected_roots = tuple(str(item) for item in payload['protected_roots'])
          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', *protected_roots], cwd=root)
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          current = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          baseline = {str(key): str(value) for key, value in payload['files'].items()}
          approved = {
              'services/agent-service/src/agent_core/observability/redaction.py',
              'services/agent-service/tests/runtime/test_b15b2_real_model_lifecycle_attestation_boundary.py',
          }
          changed = {
              path
              for path in set(current) | set(baseline)
              if current.get(path) != baseline.get(path)
          }
          if changed != approved:
              raise SystemExit('unexpected_product_source_delta:' + ','.join(sorted(changed)))
          if len(current) != int(payload['file_count']):
              raise SystemExit(f"protected_file_count_changed:{payload['file_count']}->{len(current)}")

          payload['generated_from'] = 'git:' + os.environ['SOURCE_HEAD']
          payload['generated_at'] = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace('+00:00', 'Z')
          )
          payload['file_count'] = len(current)
          payload['files'] = dict(sorted(current.items()))
          baseline_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'status': 'PASS',
              'generated_from': payload['generated_from'],
              'approved_paths': sorted(approved),
              'file_count': len(current),
              'redaction_sha256': current['services/agent-service/src/agent_core/observability/redaction.py'],
              'attestation_test_sha256': current['services/agent-service/tests/runtime/test_b15b2_real_model_lifecycle_attestation_boundary.py'],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Validate refreshed control plane
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/profile_runner.py skill-control-plane
          services/agent-service/.venv/bin/python -m pytest -q \
            skill-system/tests/test_product_source_baseline_binding.py

      - name: Publish exact baseline and restore temporary carrier
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          SOURCE_HEAD="$(git rev-parse HEAD)"
          git clean -fdX
          find . -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/b28-product-baseline-refresh.yml
          rm -f .b28-baseline-refresh-trigger

          printf '%s\n' \
            '.b28-baseline-refresh-trigger' \
            '.github/workflows/b28-product-baseline-refresh.yml' \
            'skill-system/registry/product-source-baseline.json' \
            | sort > /tmp/expected-paths.txt
          git diff --name-only "$SOURCE_HEAD" -- | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add .github/workflows/b28-product-baseline-refresh.yml \
            skill-system/registry/product-source-baseline.json
          git add -u .b28-baseline-refresh-trigger
          git diff --cached --check
          git commit -m 'Refresh baseline for V20.18 token-usage redaction repair'
          git push origin HEAD:${REPAIR_BRANCH}
