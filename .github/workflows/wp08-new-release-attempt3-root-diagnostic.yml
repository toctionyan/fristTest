name: wp08-new-release-attempt3-root-diagnostic

on:
  pull_request:
    paths:
      - '.github/workflows/wp08-new-release-attempt3-root-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact Attempt-3 main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 8a8b614903f20f5a030e9d80a0adfacb74785882
          fetch-depth: 1
          persist-credentials: false
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Bootstrap locked uv
        run: python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked agent environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Inspect exact semantic and workflow roots
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "8a8b614903f20f5a030e9d80a0adfacb74785882"
          services/agent-service/.venv/bin/python - <<'PY'
          from pathlib import Path
          import json
          ROOT=Path('.')
          needles=[
            'evaluate_refund_eligibility',
            'CAPABILITY_UNAVAILABLE',
            'verify_workflow_for_final_answer',
            'record_terminal_goal_outcome',
            'target_candidate',
            'semantic_query_then_refund_draft',
            'unsupported_report',
            'completion_capability_absent',
            'blind_inventory_dependency_graph_mismatch',
          ]
          for needle in needles:
            print(f'\n=== SEARCH {needle} ===')
            hits=[]
            for p in ROOT.rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.stat().st_size>2_000_000:
                continue
              try: text=p.read_text(encoding='utf-8')
              except Exception: continue
              for i,line in enumerate(text.splitlines(),1):
                if needle in line:
                  hits.append((str(p),i,line.strip()))
            for row in hits[:80]: print(f'{row[0]}:{row[1]}: {row[2]}')
            print('HIT_COUNT',len(hits))
          print('\n=== REGISTRY REFUND CONTRACTS ===')
          import sys
          sys.path.insert(0, str(ROOT/'services/agent-service/src'))
          from agent_core.composition import get_runtime_registry
          from agent_core.runtime.capability_effects import completion_effects_for_contract, support_effects_for_contract
          reg=get_runtime_registry().capabilities
          for name in sorted(reg.tool_names()):
            if 'refund' not in name.lower() and 'unsupported' not in name.lower():
              continue
            c=reg.contract_for_tool(name)
            print(json.dumps({
              'tool':name,
              'key':getattr(c,'key',None),
              'execution_kind':getattr(c,'execution_kind',None),
              'completion_effects':list(completion_effects_for_contract(c)) if c else [],
              'support_effects':list(support_effects_for_contract(c)) if c else [],
              'goal_completion_types':list(getattr(c,'goal_completion_types',()) or ()) if c else [],
              'planner_rule':getattr(c,'planner_rule',None),
            },ensure_ascii=False,sort_keys=True))
          PY
