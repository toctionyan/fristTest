name: typed-goal-stage4h-control-provider-contract-once

on:
  push:
    branches:
      - feat/typed-goal-graph-foundation-20260814

permissions:
  contents: write
  actions: write

jobs:
  stage4h-control-provider-contract:
    runs-on: ubuntu-24.04
    if: github.repository == 'toctionyan/fristTest'
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: feat/typed-goal-graph-foundation-20260814

      - name: Verify exact Stage4F parent and bootstrap surface
        env:
          BASE_SHA: 346c4690c07f7f26dbc9a940b4349f042e6933b9
          WORKFLOW_PATH: .github/workflows/typed-goal-stage4h-control-provider-contract-once.yml
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          python - <<'PY'
          import os, subprocess
          base = os.environ['BASE_SHA']
          expected = {os.environ['WORKFLOW_PATH']}
          changed = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}..HEAD'], text=True
          ).splitlines()))
          if changed != expected:
              raise SystemExit('unexpected_stage4h_bootstrap_surface:' + ','.join(sorted(changed)))
          print({'status': 'PASS', 'changed': sorted(changed)})
          PY

      - name: Add non-wired trusted control-provider contract
        run: |
          cat > services/agent-service/src/agent_core/runtime/dependency_authority_control.py <<'PY'
          from __future__ import annotations

          """Stage 4H trusted dependency-authority control-provider contract.

          This module deliberately owns no environment or model configuration and is not
          wired into ``AgentService``. It only defines the application-owned provider
          shape that a later, separately authorized production composition may supply to
          the Stage 4F resolver ingress.
          """

          from copy import deepcopy
          from hashlib import sha256
          import json
          from typing import Any, Protocol


          DEPENDENCY_AUTHORITY_CONTROL_SNAPSHOT_VERSION = (
              "typed-dependency-authority-control-snapshot@1"
          )
          DEPENDENCY_AUTHORITY_CONTROL_PROVIDER_AUTHORITY = (
              "external_trusted_dependency_authority_control_provider"
          )


          def _text(value: Any, *, limit: int = 1000) -> str:
              return str(value or "").strip()[:limit]


          def _digest(value: Any) -> str:
              encoded = json.dumps(
                  value,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
                  allow_nan=False,
                  default=str,
              )
              return sha256(encoded.encode("utf-8")).hexdigest()


          def build_dependency_authority_control_snapshot(
              *,
              provider_id: str,
              revision: str,
              signer_id: str,
              signature_scheme: str,
              signed_record_digest: str,
              signature_verified: bool,
              activation_preflight: dict[str, Any] | None = None,
              runtime_activation: dict[str, Any] | None = None,
              evaluation_time: float | None = None,
              rollback_requested: bool = False,
          ) -> dict[str, Any]:
              """Build a sealed provider snapshot without touching runtime configuration."""

              payload: dict[str, Any] = {
                  "version": DEPENDENCY_AUTHORITY_CONTROL_SNAPSHOT_VERSION,
                  "authority": DEPENDENCY_AUTHORITY_CONTROL_PROVIDER_AUTHORITY,
                  "immutable": True,
                  "provider_id": _text(provider_id, limit=500),
                  "revision": _text(revision, limit=500),
                  "signer_id": _text(signer_id, limit=500),
                  "signature_scheme": _text(signature_scheme, limit=200),
                  "signed_record_digest": _text(signed_record_digest, limit=128),
                  "signature_verified": signature_verified is True,
                  "activation_preflight": (
                      deepcopy(activation_preflight)
                      if isinstance(activation_preflight, dict)
                      else None
                  ),
                  "runtime_activation": (
                      deepcopy(runtime_activation)
                      if isinstance(runtime_activation, dict)
                      else None
                  ),
                  "evaluation_time": (
                      float(evaluation_time) if evaluation_time is not None else None
                  ),
                  "rollback_requested": rollback_requested is True,
                  "owns_environment_configuration": False,
                  "owns_model_configuration": False,
                  "creates_permit": False,
                  "dispatches_tools": False,
                  "mutates_business_state": False,
              }
              payload["snapshot_digest"] = _digest(payload)
              return payload


          def dependency_authority_control_snapshot_integrity(
              snapshot: dict[str, Any] | None,
          ) -> dict[str, Any]:
              """Validate provider provenance and the sealed control snapshot."""

              row = deepcopy(snapshot) if isinstance(snapshot, dict) else {}
              errors: list[str] = []
              if row.get("version") != DEPENDENCY_AUTHORITY_CONTROL_SNAPSHOT_VERSION:
                  errors.append("CONTROL_SNAPSHOT_VERSION_INVALID")
              if row.get("authority") != DEPENDENCY_AUTHORITY_CONTROL_PROVIDER_AUTHORITY:
                  errors.append("CONTROL_SNAPSHOT_AUTHORITY_INVALID")
              if row.get("immutable") is not True:
                  errors.append("CONTROL_SNAPSHOT_IMMUTABLE_REQUIRED")
              if not _text(row.get("provider_id"), limit=500):
                  errors.append("CONTROL_PROVIDER_ID_REQUIRED")
              if not _text(row.get("revision"), limit=500):
                  errors.append("CONTROL_PROVIDER_REVISION_REQUIRED")
              if not _text(row.get("signer_id"), limit=500):
                  errors.append("CONTROL_PROVIDER_SIGNER_REQUIRED")
              if not _text(row.get("signature_scheme"), limit=200):
                  errors.append("CONTROL_PROVIDER_SIGNATURE_SCHEME_REQUIRED")
              if not _text(row.get("signed_record_digest"), limit=128):
                  errors.append("CONTROL_PROVIDER_SIGNED_RECORD_DIGEST_REQUIRED")
              if row.get("signature_verified") is not True:
                  errors.append("CONTROL_PROVIDER_SIGNATURE_VERIFICATION_REQUIRED")
              if row.get("owns_environment_configuration") is not False:
                  errors.append("CONTROL_PROVIDER_ENVIRONMENT_OWNERSHIP_FORBIDDEN")
              if row.get("owns_model_configuration") is not False:
                  errors.append("CONTROL_PROVIDER_MODEL_OWNERSHIP_FORBIDDEN")
              for field in ("creates_permit", "dispatches_tools", "mutates_business_state"):
                  if bool(row.get(field)):
                      errors.append(f"CONTROL_PROVIDER_{field.upper()}_MUST_BE_FALSE")

              has_preflight = isinstance(row.get("activation_preflight"), dict)
              has_activation = isinstance(row.get("runtime_activation"), dict)
              if has_preflight or has_activation:
                  try:
                      evaluation_time = float(row.get("evaluation_time"))
                  except (TypeError, ValueError):
                      evaluation_time = 0.0
                  if evaluation_time <= 0:
                      errors.append("CONTROL_PROVIDER_EVALUATION_TIME_REQUIRED")

              stored = _text(row.get("snapshot_digest"), limit=128)
              if not stored:
                  errors.append("CONTROL_SNAPSHOT_DIGEST_REQUIRED")
              else:
                  payload = deepcopy(row)
                  payload.pop("snapshot_digest", None)
                  if stored != _digest(payload):
                      errors.append("CONTROL_SNAPSHOT_DIGEST_INVALID")
              return {
                  "ok": not errors,
                  "errors": sorted(set(errors)),
                  "snapshot_digest": stored or None,
              }


          class DependencyAuthorityControlProvider(Protocol):
              """Application-owned provider interface; storage/transport is external."""

              def resolve(self) -> dict[str, Any] | None: ...


          class DisabledDependencyAuthorityControlProvider:
              """Explicit fail-closed provider used until production wiring is authorized."""

              def resolve(self) -> None:
                  return None


          class StaticVerifiedDependencyAuthorityControlProvider:
              """Reference provider for tests and deterministic replay, not a trust root."""

              def __init__(self, snapshot: dict[str, Any]) -> None:
                  self._snapshot = deepcopy(snapshot)

              def resolve(self) -> dict[str, Any] | None:
                  integrity = dependency_authority_control_snapshot_integrity(self._snapshot)
                  if not integrity.get("ok"):
                      return None
                  row = deepcopy(self._snapshot)
                  return {
                      "activation_preflight": deepcopy(row.get("activation_preflight")),
                      "runtime_activation": deepcopy(row.get("runtime_activation")),
                      "evaluation_time": row.get("evaluation_time"),
                      "rollback_requested": row.get("rollback_requested") is True,
                  }


          def dependency_authority_control_resolver(
              provider: DependencyAuthorityControlProvider,
          ):
              """Adapt an application-owned provider to the Stage 4F zero-arg seam."""

              return provider.resolve


          __all__ = [
              "DEPENDENCY_AUTHORITY_CONTROL_PROVIDER_AUTHORITY",
              "DEPENDENCY_AUTHORITY_CONTROL_SNAPSHOT_VERSION",
              "DependencyAuthorityControlProvider",
              "DisabledDependencyAuthorityControlProvider",
              "StaticVerifiedDependencyAuthorityControlProvider",
              "build_dependency_authority_control_snapshot",
              "dependency_authority_control_resolver",
              "dependency_authority_control_snapshot_integrity",
          ]
          PY

          cat > services/agent-service/tests/runtime/test_typed_goal_dependency_control_provider_contract.py <<'PY'
          from __future__ import annotations

          import inspect
          import json
          import os

          import agent_core.runtime.dependency_authority_control as control
          from agent_core.runtime.dependency_authority_control import (
              DisabledDependencyAuthorityControlProvider,
              StaticVerifiedDependencyAuthorityControlProvider,
              build_dependency_authority_control_snapshot,
              dependency_authority_control_resolver,
              dependency_authority_control_snapshot_integrity,
          )
          from app.services.agent_service import AgentService


          def _snapshot(**overrides):
              values = {
                  "provider_id": "governance-control-plane",
                  "revision": "rev-0001",
                  "signer_id": "release-governance",
                  "signature_scheme": "external-verifier-v1",
                  "signed_record_digest": "a" * 64,
                  "signature_verified": True,
                  "activation_preflight": {"preflight_digest": "b" * 64},
                  "runtime_activation": {"activation_digest": "c" * 64},
                  "evaluation_time": 1000.0,
                  "rollback_requested": False,
              }
              values.update(overrides)
              return build_dependency_authority_control_snapshot(**values)


          def test_stage4h_contract_does_not_own_main_environment_or_model_configuration() -> None:
              source = inspect.getsource(control)
              assert "os.getenv" not in source
              assert "agent_core.config" not in source
              assert "OPENAI_API_KEY" not in source
              assert "OPENAI_MODEL" not in source
              snapshot = _snapshot()
              assert snapshot["owns_environment_configuration"] is False
              assert snapshot["owns_model_configuration"] is False
              assert "dependency_authority_control_resolver=" not in inspect.getsource(
                  AgentService.__init__
              )


          def test_disabled_provider_is_explicitly_fail_closed() -> None:
              provider = DisabledDependencyAuthorityControlProvider()
              assert provider.resolve() is None
              assert dependency_authority_control_resolver(provider)() is None


          def test_verified_snapshot_resolves_only_stage4f_control_fields() -> None:
              snapshot = _snapshot()
              resolved = StaticVerifiedDependencyAuthorityControlProvider(snapshot).resolve()
              assert resolved == {
                  "activation_preflight": {"preflight_digest": "b" * 64},
                  "runtime_activation": {"activation_digest": "c" * 64},
                  "evaluation_time": 1000.0,
                  "rollback_requested": False,
              }
              assert "provider_id" not in resolved
              assert "signed_record_digest" not in resolved
              assert "signature_verified" not in resolved


          def test_signature_verification_is_required_even_with_a_valid_snapshot_digest() -> None:
              snapshot = _snapshot(signature_verified=False)
              integrity = dependency_authority_control_snapshot_integrity(snapshot)
              assert integrity["ok"] is False
              assert "CONTROL_PROVIDER_SIGNATURE_VERIFICATION_REQUIRED" in integrity["errors"]
              assert StaticVerifiedDependencyAuthorityControlProvider(snapshot).resolve() is None


          def test_tampering_provider_identity_fails_closed() -> None:
              snapshot = _snapshot()
              snapshot["provider_id"] = "attacker"
              integrity = dependency_authority_control_snapshot_integrity(snapshot)
              assert integrity["ok"] is False
              assert "CONTROL_SNAPSHOT_DIGEST_INVALID" in integrity["errors"]
              assert StaticVerifiedDependencyAuthorityControlProvider(snapshot).resolve() is None


          def test_activation_records_require_deterministic_evaluation_time() -> None:
              snapshot = _snapshot(evaluation_time=None)
              integrity = dependency_authority_control_snapshot_integrity(snapshot)
              assert integrity["ok"] is False
              assert "CONTROL_PROVIDER_EVALUATION_TIME_REQUIRED" in integrity["errors"]


          def test_rollback_channel_can_exist_without_activation_records() -> None:
              snapshot = _snapshot(
                  activation_preflight=None,
                  runtime_activation=None,
                  evaluation_time=None,
                  rollback_requested=True,
              )
              integrity = dependency_authority_control_snapshot_integrity(snapshot)
              assert integrity["ok"] is True
              resolved = StaticVerifiedDependencyAuthorityControlProvider(snapshot).resolve()
              assert resolved == {
                  "activation_preflight": None,
                  "runtime_activation": None,
                  "evaluation_time": None,
                  "rollback_requested": True,
              }


          def test_json_roundtrip_preserves_worker_restart_resolution() -> None:
              snapshot = _snapshot()
              restored = json.loads(json.dumps(snapshot, sort_keys=True))
              first = StaticVerifiedDependencyAuthorityControlProvider(snapshot).resolve()
              second = StaticVerifiedDependencyAuthorityControlProvider(restored).resolve()
              assert first == second
              assert dependency_authority_control_snapshot_integrity(restored)["ok"] is True


          def test_model_environment_changes_do_not_change_control_resolution(monkeypatch) -> None:
              provider = StaticVerifiedDependencyAuthorityControlProvider(_snapshot())
              before = provider.resolve()
              monkeypatch.setenv("OPENAI_API_KEY", "different-key")
              monkeypatch.setenv("OPENAI_MODEL", "different-model")
              monkeypatch.setenv("OPENAI_API_BASE", "https://example.invalid")
              after = provider.resolve()
              assert before == after
              assert os.environ["OPENAI_MODEL"] == "different-model"
          PY

          python -m compileall -q \
            services/agent-service/src/agent_core/runtime/dependency_authority_control.py \
            services/agent-service/tests/runtime/test_typed_goal_dependency_control_provider_contract.py
          git diff --check

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Bootstrap locked Python environment
        run: |
          "${pythonLocation}/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups

      - name: Verify Stage4H contract and preserved Stage4E/F boundary
        run: |
          cd services/agent-service
          PYTHONPATH=src:. .venv/bin/python -B -m pytest -q \
            tests/runtime/test_typed_goal_dependency_control_provider_contract.py \
            tests/runtime/test_typed_goal_dependency_activation_ingress.py \
            tests/runtime/test_typed_goal_dependency_runtime_authority.py \
            tests/runtime/test_pretool_execution_policy.py

      - name: Freeze Stage4H protected source SHA
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/agent-service/src/agent_core/runtime/dependency_authority_control.py \
            services/agent-service/tests/runtime/test_typed_goal_dependency_control_provider_contract.py
          git diff --cached --check
          git commit -m "Add non-wired dependency authority control provider contract"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh protected baseline for Stage4H source
        env:
          BASE_SHA: 346c4690c07f7f26dbc9a940b4349f042e6933b9
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          baseline_path = root / 'skill-system/registry/product-source-baseline.json'
          source_sha = os.environ['SOURCE_SHA'].strip()
          base_sha = os.environ['BASE_SHA'].strip()
          if len(source_sha) != 40:
              raise SystemExit('source_sha_identity_missing')
          subprocess.run(['git', 'merge-base', '--is-ancestor', base_sha, source_sha], check=True)
          if subprocess.run(
              ['git', 'diff', '--quiet', f'{source_sha}..HEAD', '--', 'services', 'web', 'contracts'],
              check=False,
          ).returncode != 0:
              raise SystemExit('protected_sources_changed_after_stage4h_source_sha')

          expected_added = {
              'services/agent-service/src/agent_core/runtime/dependency_authority_control.py',
              'services/agent-service/tests/runtime/test_typed_goal_dependency_control_provider_contract.py',
          }
          actual = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base_sha}..{source_sha}', '--', 'services', 'web', 'contracts'],
              text=True,
          ).splitlines()))
          if actual != expected_added:
              raise SystemExit('unexpected_stage4h_protected_surface:' + ','.join(sorted(actual)))

          payload = json.loads(baseline_path.read_text(encoding='utf-8'))
          previous = {str(k): str(v) for k, v in (payload.get('files') or {}).items()}
          if int(payload.get('file_count') or 0) != 594 or len(previous) != 594:
              raise SystemExit(f"unexpected_previous_baseline:{payload.get('file_count')}/{len(previous)}")
          protected_roots = tuple(str(v) for v in payload.get('protected_roots') or ())
          if protected_roots != ('services', 'web', 'contracts'):
              raise SystemExit(f'unexpected_protected_roots:{protected_roots!r}')

          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', *protected_roots])
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          current = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          if len(current) != 596:
              raise SystemExit(f'unexpected_protected_file_count:{len(current)}')
          changed = {p for p in set(current) & set(previous) if current[p] != previous[p]}
          added = set(current) - set(previous)
          removed = set(previous) - set(current)
          if changed:
              raise SystemExit('unexpected_changed_existing:' + ','.join(sorted(changed)))
          if added != expected_added:
              raise SystemExit('unexpected_added_paths:' + ','.join(sorted(added)))
          if removed:
              raise SystemExit('unexpected_removed_paths:' + ','.join(sorted(removed)))

          payload['file_count'] = len(current)
          payload['files'] = dict(sorted(current.items()))
          payload['generated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          payload['generated_from'] = 'git:' + source_sha
          baseline_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'status': 'PASS',
              'generated_from': payload['generated_from'],
              'added': sorted(added),
              'file_count': len(current),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Verify baseline and Skill control plane before push
        run: |
          python skill-system/tests/test_product_source_baseline_binding.py
          services/agent-service/.venv/bin/python -B skill-system/controller/profile_runner.py skill-control-plane
          cd services/agent-service
          PYTHONPATH=src:. .venv/bin/python -B -m pytest -q \
            tests/runtime/test_typed_goal_dependency_control_provider_contract.py \
            tests/runtime/test_typed_goal_dependency_activation_ingress.py \
            tests/runtime/test_typed_goal_dependency_runtime_authority.py \
            tests/runtime/test_typed_goal_dependency_activation_preflight.py \
            tests/runtime/test_typed_goal_dependency_handoff_simulation.py \
            tests/runtime/test_typed_goal_dependency_cutover_gate.py \
            tests/runtime/test_typed_goal_dependency_authority_shadow.py \
            tests/runtime/test_pretool_execution_policy.py

      - name: Commit baseline, remove bootstrap workflow, and push
        run: |
          set -euo pipefail
          git rm .github/workflows/typed-goal-stage4h-control-provider-contract-once.yml
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m "Refresh Stage4H protected baseline"
          git push origin HEAD:feat/typed-goal-graph-foundation-20260814
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch final exact-SHA verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in quality.yml skill-self-validation.yml; do
            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d '{"ref":"feat/typed-goal-graph-foundation-20260814"}'
          done
          echo "Stage4H final SHA: ${FINAL_SHA}"
