name: One-shot Anti-Stall B4 slimming

on:
  push:
    branches:
      - quality-loop-resumable-checkpoint-20260810

permissions:
  contents: write

jobs:
  slim:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Slim Anti-Stall ownership and active APIs
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('skill-system/controller/task_harness.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
              (
                  '        machine = AtomicFallbackStateMachine(policy=AtomicToolPolicy(max_remote_calls=2))\n'
                  '        machine.begin_cache_lookup()\n'
                  '        machine.cache_miss(request.source)\n',
                  '        machine = AtomicFallbackStateMachine(policy=AtomicToolPolicy(max_remote_calls=2))\n'
                  '        machine.begin(request.source)\n',
              ),
              ('        if machine.state != "CACHE_STORE" or content is None:\n',
               '        if machine.state != "SUCCEEDED" or content is None:\n'),
              ('        machine.cache_stored()\n        machine.analysis_completed()\n', ''),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact task_harness replacement count={count}: {old!r}')
              text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY

          git rm \
            services/agent-service/tests/runtime/test_anti_stall_process_control.py \
            services/agent-service/tests/runtime/test_anti_stall_task_harness.py \
            services/agent-service/tests/runtime/test_bounded_remote_read_batch.py \
            services/agent-service/tests/runtime/test_fallback_state_machine.py \
            services/agent-service/tests/runtime/test_task_anti_stall_policy.py \
            services/agent-service/tests/runtime/test_working_set_manifest.py \
            services/agent-service/tests/runtime/test_working_set_snapshot_cache.py

          git show f60e8092caf72487e52966f53be598935dcaeead:skill-system/registry/product-source-baseline.json \
            > skill-system/registry/product-source-baseline.json

          python3 -m py_compile \
            skill-system/controller/anti_stall.py \
            skill-system/controller/working_set.py \
            skill-system/controller/snapshot_cache.py \
            skill-system/controller/bounded_batch.py \
            skill-system/controller/fallback_state.py \
            skill-system/controller/task_harness.py
          python3 skill-system/tests/test_anti_stall_controller.py
          python3 skill-system/tests/test_anti_stall_workflow_default.py

      - name: Commit slimmed B4 result and remove carrier
        run: |
          set -euo pipefail
          git rm .github/workflows/anti-stall-b4-slim-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Slim Anti-Stall controller boundaries before merge'
          git push
