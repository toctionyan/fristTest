name: tmp-parameterized-permit-diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/tmp-parameterized-permit-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'diagnostic/parameterized-permit-20260815'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 37d7c877b05db9c5ad475d77ee7b03487ef661e6
          fetch-depth: 1
          persist-credentials: false

      - name: Assert exact repair candidate
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "37d7c877b05db9c5ad475d77ee7b03487ef661e6"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Install exact Python environment
        working-directory: services/agent-service
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check uv==0.11.29
          uv sync --frozen

      - name: Verify deterministic permit tests remain isolated in protected model profile
        working-directory: services/agent-service
        env:
          PYTHONPATH: .:src
          APP_PROFILE: preprod
          CAPABILITY_SEMANTIC_VERIFIER_MODE: model
          OPENAI_API_KEY: ''
        run: |
          set -euo pipefail
          uv run pytest -q -s \
            tests/context/test_parameterized_capability_alignment.py::test_parameterized_permit_rejects_missing_constraint_binding \
            tests/context/test_parameterized_capability_alignment.py::test_parameterized_permit_normalizes_unique_constraint_leaf_alias \
            tests/context/test_parameterized_capability_alignment.py::test_filtered_logistics_uses_backend_parameter_and_presents_only_matches
