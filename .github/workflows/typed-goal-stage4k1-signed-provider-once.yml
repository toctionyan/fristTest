name: typed-goal-stage4k1-signed-provider-once

on:
  push:
    branches:
      - feat/typed-goal-graph-foundation-20260814

permissions:
  contents: write

jobs:
  stage4k1-signed-provider:
    runs-on: ubuntu-24.04
    if: github.repository == 'toctionyan/fristTest'
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: feat/typed-goal-graph-foundation-20260814

      - name: Verify exact Stage4K1 source and bootstrap surface
        env:
          SOURCE_SHA: bf1c581ab2628760e8d737c91b0f6f9e7fb0a11c
          WORKFLOW_PATH: .github/workflows/typed-goal-stage4k1-signed-provider-once.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          changed="$(git diff --name-only "$SOURCE_SHA"..HEAD)"
          test "$changed" = "$WORKFLOW_PATH"
          git diff --check "$SOURCE_SHA"..HEAD

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Bootstrap locked Agent environment
        run: |
          "${pythonLocation}/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups

      - name: Validate Stage4K1 signed provider boundary
        run: |
          set -euo pipefail
          python -m compileall -q \
            services/agent-service/src/agent_core/runtime/dependency_authority_signed_provider.py \
            services/agent-service/tests/runtime/test_typed_goal_dependency_signed_provider.py
          cd services/agent-service
          PYTHONPATH=src:. .venv/bin/python -B -m pytest -q \
            tests/runtime/test_typed_goal_dependency_signed_provider.py \
            tests/runtime/test_typed_goal_dependency_control_provider_contract.py \
            tests/runtime/test_typed_goal_dependency_activation_ingress.py \
            tests/runtime/test_typed_goal_dependency_runtime_authority.py \
            tests/runtime/test_pretool_execution_policy.py

      - name: Refresh protected source baseline from exact Stage4K1 source
        env:
          SOURCE_SHA: bf1c581ab2628760e8d737c91b0f6f9e7fb0a11c
        run: |
          set -euo pipefail
          python -B scripts/refresh_product_source_baseline.py \
            --workspace . \
            --generated-from-sha "$SOURCE_SHA"
          git diff --check
          git diff -- skill-system/registry/product-source-baseline.json | head -200

      - name: Commit baseline and remove one-shot workflow
        env:
          WORKFLOW_PATH: .github/workflows/typed-goal-stage4k1-signed-provider-once.yml
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skill-system/registry/product-source-baseline.json
          git rm "$WORKFLOW_PATH"
          git diff --cached --check
          git commit -m "Refresh Stage4K1 protected baseline"
          git push origin HEAD:feat/typed-goal-graph-foundation-20260814
