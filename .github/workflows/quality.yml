name: quality

"on":
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  apply-semantic-failure-evidence:
    if: github.head_ref == 'agent/semantic-failure-evidence'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Apply bounded semantic diagnostics
        run: python -B .github/scripts/apply_semantic_failure_evidence.py
      - name: Install locked test environment
        run: |
          python -m pip install --disable-pip-version-check uv
          cd services/agent-service && uv sync --locked --all-groups
      - name: Run focused semantic and bundle regressions
        run: >-
          services/agent-service/.venv/bin/python -B -m pytest -q
          services/agent-service/tests/runtime/test_semantic_failure_evidence.py
          services/agent-service/tests/runtime/test_b15b1_real_model_semantic_identity_boundary.py
          services/agent-service/tests/runtime/test_b15c3_real_model_release_bundle_authority.py
          services/agent-service/tests/runtime/test_production_component_failure_evidence.py
      - name: Restore authoritative workflows and commit repair
        shell: bash
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- .github/workflows/quality.yml
          git checkout origin/main -- .github/workflows/temporary-auto-release-after-real-model-repair.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve bounded semantic certification failure evidence"
          git push origin HEAD:${GITHUB_HEAD_REF}
