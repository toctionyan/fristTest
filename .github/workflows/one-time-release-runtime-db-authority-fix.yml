name: one-time-release-runtime-db-authority-fix

"on":
  push:
    branches:
      - agent/fix-release-runtime-db-authority

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Apply exact runtime database authority fix
        run: python -B .github/scripts/apply_release_runtime_db_authority.py
      - name: Install focused test dependencies
        run: python -m pip install --disable-pip-version-check pytest python-dotenv
      - name: Run focused regression tests
        run: >-
          python -m pytest -q
          services/agent-service/tests/runtime/test_release_runtime_database_authority.py
      - name: Compile modified Python files
        run: >-
          python -m py_compile
          services/agent-service/src/agent_core/config.py
          scripts/verify_full_lifecycle_canary.py
          services/agent-service/tests/runtime/test_release_runtime_database_authority.py
      - name: Remove one-time applicator and commit result
        shell: bash
        run: |
          rm -f .github/scripts/apply_release_runtime_db_authority.py
          rm -f .github/workflows/one-time-release-runtime-db-authority-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agent-service/src/agent_core/config.py \
            scripts/verify_full_lifecycle_canary.py \
            services/agent-service/tests/runtime/test_release_runtime_database_authority.py \
            .github/scripts/apply_release_runtime_db_authority.py \
            .github/workflows/one-time-release-runtime-db-authority-fix.yml
          git commit -m "Fix release runtime database authority"
          git push origin HEAD:${GITHUB_REF_NAME}
