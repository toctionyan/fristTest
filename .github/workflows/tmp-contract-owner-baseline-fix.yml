name: temporary-contract-owner-baseline-fix

on:
  push:
    branches:
      - architecture/v20.18-contract-owner-repair-rule-oracle-20260812

permissions:
  contents: write

concurrency:
  group: temporary-contract-owner-baseline-fix
  cancel-in-progress: false

jobs:
  repair-baseline:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: architecture/v20.18-contract-owner-repair-rule-oracle-20260812
          fetch-depth: 0

      - name: Recompute protected baseline from committed bytes
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          relative = "services/agent-service/tests/runtime/test_goal_coverage_runtime.py"
          baseline_path = root / "skill-system/registry/product-source-baseline.json"
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))

          actual_sha = hashlib.sha256((root / relative).read_bytes()).hexdigest()
          baseline["files"][relative] = actual_sha
          committed_head = subprocess.check_output(
              ["git", "rev-parse", "HEAD"], cwd=root, text=True
          ).strip()
          baseline["generated_from"] = f"git:{committed_head}"
          baseline["generated_at"] = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          baseline_path.write_text(
              json.dumps(baseline, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(f"recomputed {relative}: {actual_sha}")
          print(f"baseline authority: git:{committed_head}")
          PY

          git rm -- .github/workflows/tmp-contract-owner-baseline-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m "Correct protected baseline after commentary restore"
          git push origin HEAD:architecture/v20.18-contract-owner-repair-rule-oracle-20260812
