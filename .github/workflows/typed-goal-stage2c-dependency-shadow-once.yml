name: Typed Goal Stage2C Dependency Shadow Once

"on":
  push:
    branches:
      - feat/typed-goal-graph-foundation-20260814
    paths:
      - .github/workflows/typed-goal-stage2c-dependency-shadow-once.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: typed-goal-stage2c-dependency-shadow-once
  cancel-in-progress: false

env:
  TARGET_BRANCH: feat/typed-goal-graph-foundation-20260814
  EXPECTED_PARENT_HEAD: ad664a44accde7dfd3383ee92c8550dd8bb7f775

jobs:
  audit:
    if: >-
      github.repository == 'toctionyan/fristTest' &&
      github.ref_name == 'feat/typed-goal-graph-foundation-20260814'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact feature branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: feat/typed-goal-graph-foundation-20260814
          fetch-depth: 2
          persist-credentials: true

      - name: Verify one-shot parent identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT_HEAD"
          test "$(git rev-parse --abbrev-ref HEAD)" = "$TARGET_BRANCH"

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Bootstrap locked uv
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Install locked Agent validation environment
        shell: bash
        run: |
          set -euo pipefail
          cd services/agent-service
          uv sync --locked --all-groups

      - name: Add audit-only typed dependency authority shadow
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B - <<'PY'
          from __future__ import annotations

          from pathlib import Path

          root = Path('.').resolve()
          policy_path = root / 'services/agent-service/src/agent_core/lifecycle/pretool_execution_policy.py'
          text = policy_path.read_text(encoding='utf-8')

          def replace_once(source: str, old: str, new: str, label: str) -> str:
              count = source.count(old)
              if count != 1:
                  raise SystemExit(f'{label}:expected_exactly_one_match:{count}')
              return source.replace(old, new, 1)

          text = replace_once(
              text,
              'PRETOOL_EXECUTION_POLICY_VERSION = "pretool-execution-policy@1"\n_PROGRESS_STEP_STATES = {"SUCCEEDED"}\n',
              'PRETOOL_EXECUTION_POLICY_VERSION = "pretool-execution-policy@1"\n'
              'TYPED_DEPENDENCY_AUTHORITY_SHADOW_VERSION = "typed-dependency-authority-shadow@1"\n'
              '_PROGRESS_STEP_STATES = {"SUCCEEDED"}\n',
              'version_constant',
          )

          helper = r'''
def _typed_dependency_authority_shadow(
    *,
    plan: dict[str, Any],
    global_coverage: dict[str, Any],
    completed_goal_ids: set[str],
) -> dict[str, Any] | None:
    """Audit legacy dependency blocking against verified Goal Graph dataflow.

    This is migration evidence only.  The current provider frontier continues to
    use ``depends_on_goal_ids`` until a later explicit authority cutover.
    """

    typed = (
        global_coverage.get("typed_goal_capability_shadow")
        if isinstance(global_coverage.get("typed_goal_capability_shadow"), dict)
        else None
    )
    if typed is None:
        return None

    evidence_errors: list[str] = []
    stored_typed_digest = str(typed.get("coverage_digest") or "")
    if not stored_typed_digest:
        evidence_errors.append("TYPED_DEPENDENCY_SHADOW_COVERAGE_DIGEST_REQUIRED")
    else:
        typed_payload = deepcopy(typed)
        typed_payload.pop("coverage_digest", None)
        if stored_typed_digest != _digest(typed_payload):
            evidence_errors.append("TYPED_DEPENDENCY_SHADOW_COVERAGE_DIGEST_INVALID")

    legacy_dependencies = {
        str(row.get("goal_id") or ""): sorted(
            {
                str(value)
                for value in list(row.get("depends_on_goal_ids") or [])
                if str(value)
            }
        )
        for row in list(plan.get("goal_plans") or [])
        if isinstance(row, dict) and str(row.get("goal_id") or "")
    }
    typed_dependencies = {
        str(goal_id): sorted(
            {
                str(value)
                for value in list(values or [])
                if str(value)
            }
        )
        for goal_id, values in dict(typed.get("derived_dependencies") or {}).items()
        if str(goal_id)
    }
    dataflow_status = str(typed.get("dataflow_status") or "")
    dataflow_closed = dataflow_status == "GOAL_GRAPH_DATAFLOW_CLOSED"

    comparisons: list[dict[str, Any]] = []
    divergence_codes: set[str] = set()
    for goal_id in sorted(set(legacy_dependencies) | set(typed_dependencies)):
        legacy = set(legacy_dependencies.get(goal_id, []))
        verified = set(typed_dependencies.get(goal_id, []))
        legacy_only = sorted(legacy - verified)
        typed_only = sorted(verified - legacy)
        codes: list[str] = []
        if legacy_only:
            codes.append("LEGACY_DEPENDENCY_NOT_VERIFIED_BY_DATAFLOW")
        if typed_only:
            codes.append("VERIFIED_DATAFLOW_DEPENDENCY_MISSING_FROM_LEGACY")
        divergence_codes.update(codes)
        legacy_missing = sorted(legacy - completed_goal_ids)
        typed_missing = sorted(verified - completed_goal_ids)
        comparisons.append(
            {
                "goal_id": goal_id,
                "legacy_dependency_goal_ids": sorted(legacy),
                "typed_derived_dependency_goal_ids": sorted(verified),
                "legacy_only_dependency_goal_ids": legacy_only,
                "typed_only_dependency_goal_ids": typed_only,
                "legacy_missing_dependency_goal_ids": legacy_missing,
                "typed_missing_dependency_goal_ids": typed_missing if dataflow_closed else [],
                "current_legacy_would_block": bool(legacy_missing),
                "typed_would_block": bool(typed_missing) if dataflow_closed else None,
                "codes": codes or ["DEPENDENCY_SET_MATCHED"],
            }
        )

    if evidence_errors:
        status = "EVIDENCE_INVALID"
    elif not dataflow_closed:
        status = "NOT_READY_DATAFLOW_OPEN"
    elif divergence_codes:
        status = "DIVERGED"
    else:
        status = "MATCHED"

    payload = {
        "version": TYPED_DEPENDENCY_AUTHORITY_SHADOW_VERSION,
        "authority": "audit_only_current_dependency_enforcement_unchanged",
        "status": status,
        "current_dependency_authority": "legacy_declared_goal_dependencies",
        "candidate_dependency_authority": "verified_dataflow_edges_only",
        "typed_coverage_status": typed.get("coverage_status"),
        "typed_dataflow_status": dataflow_status or None,
        "typed_coverage_digest": stored_typed_digest or None,
        "typed_graph_id": typed.get("graph_id"),
        "typed_graph_digest": typed.get("graph_digest"),
        "evidence_errors": evidence_errors,
        "comparisons": comparisons,
        "divergence_codes": sorted(divergence_codes),
        "cutover_eligible": bool(
            not evidence_errors and dataflow_closed and not divergence_codes
        ),
        "cutover_performed": False,
        "changes_current_dependency_blocking": False,
        "changes_allowed_capability_tools": False,
        "blocks_execution": False,
        "creates_permit": False,
        "mutates_semantics": False,
        "mutates_business_state": False,
    }
    payload["shadow_digest"] = _digest(payload)
    return payload
'''
          text = replace_once(
              text,
              '\n\ndef build_pretool_execution_policy(\n',
              '\n\n' + helper.strip('\n') + '\n\n\ndef build_pretool_execution_policy(\n',
              'helper_insertion',
          )
          text = replace_once(
              text,
              '\n    if evidence_errors:\n',
              '\n    dependency_authority_shadow = _typed_dependency_authority_shadow(\n'
              '        plan=plan,\n'
              '        global_coverage=global_coverage,\n'
              '        completed_goal_ids=completed_goal_ids,\n'
              '    )\n\n'
              '    if evidence_errors:\n',
              'shadow_build',
          )
          text = replace_once(
              text,
              '    payload["policy_digest"] = _digest(payload)\n    return payload\n',
              '    if dependency_authority_shadow is not None:\n'
              '        payload["typed_dependency_authority_shadow"] = dependency_authority_shadow\n'
              '    payload["policy_digest"] = _digest(payload)\n'
              '    return payload\n',
              'payload_attachment',
          )
          text = replace_once(
              text,
              '__all__ = [\n    "PRETOOL_EXECUTION_POLICY_VERSION",\n',
              '__all__ = [\n'
              '    "PRETOOL_EXECUTION_POLICY_VERSION",\n'
              '    "TYPED_DEPENDENCY_AUTHORITY_SHADOW_VERSION",\n',
              'exports',
          )
          policy_path.write_text(text, encoding='utf-8')

          test_path = root / 'services/agent-service/tests/runtime/test_typed_goal_dependency_authority_shadow.py'
          if test_path.exists():
              raise SystemExit('typed_dependency_shadow_test_already_exists')
          test_path.write_text(r'''from __future__ import annotations

from copy import deepcopy

from agent_core.goal_graph.contracts import (
    make_verified_artifact_ref,
    make_verified_dataflow_edge,
    with_verified_dataflow_edge,
)
from agent_core.lifecycle.goal_capability_coverage import build_goal_capability_coverage
from agent_core.lifecycle.pretool_execution_policy import (
    build_pretool_execution_policy,
    execution_policy_prompt_projection,
)
from agent_core.lifecycle.pretool_planner import build_pretool_shadow_plan
from tests.runtime.test_pretool_execution_policy import _contract, _goal, _registry


_SCOPE = {
    "current_tenant_id": "tenant-1",
    "current_user_id": "u001",
    "current_thread_id": "web-u001-stage2c",
}


def _state(contract: dict, **extra) -> dict:
    return {
        "frozen_semantic_contract": contract,
        **_SCOPE,
        **extra,
    }


def test_dependency_shadow_marks_matching_closed_graph_as_cutover_candidate_only() -> None:
    contract = _contract([
        _goal("details", domain="order", operation="query_details")
    ])
    policy = build_pretool_execution_policy(
        state=_state(contract),
        capability_registry=_registry(),
    )

    shadow = policy["typed_dependency_authority_shadow"]
    assert shadow["status"] == "MATCHED"
    assert shadow["typed_dataflow_status"] == "GOAL_GRAPH_DATAFLOW_CLOSED"
    assert shadow["cutover_eligible"] is True
    assert shadow["cutover_performed"] is False
    assert shadow["current_dependency_authority"] == "legacy_declared_goal_dependencies"
    assert shadow["candidate_dependency_authority"] == "verified_dataflow_edges_only"
    assert shadow["changes_current_dependency_blocking"] is False
    assert shadow["changes_allowed_capability_tools"] is False
    assert shadow["blocks_execution"] is False
    assert shadow["creates_permit"] is False
    assert policy["allowed_capability_tools"] == ["get_order_details"]


def test_unverified_legacy_dependency_stays_blocked_by_current_policy_but_shadow_is_not_ready() -> None:
    contract = _contract([
        _goal("refund", domain="refund", operation="create"),
        _goal("invoice", domain="invoice", operation="create", depends_on=("refund",)),
    ])
    policy = build_pretool_execution_policy(
        state=_state(contract, goal_records=[]),
        capability_registry=_registry(),
    )
    by_goal = {row["goal_id"]: row for row in policy["goal_policies"]}

    assert by_goal["invoice"]["status"] == "BLOCKED_BY_GOAL_DEPENDENCY"
    assert "prepare_invoice" not in policy["allowed_capability_tools"]
    shadow = policy["typed_dependency_authority_shadow"]
    assert shadow["status"] == "NOT_READY_DATAFLOW_OPEN"
    assert shadow["typed_dataflow_status"] == "GOAL_GRAPH_DATAFLOW_OPEN"
    assert shadow["cutover_eligible"] is False
    invoice = next(row for row in shadow["comparisons"] if row["goal_id"] == "invoice")
    assert invoice["legacy_dependency_goal_ids"] == ["refund"]
    assert invoice["typed_derived_dependency_goal_ids"] == []
    assert invoice["current_legacy_would_block"] is True
    assert invoice["typed_would_block"] is None
    assert "LEGACY_DEPENDENCY_NOT_VERIFIED_BY_DATAFLOW" in invoice["codes"]
    assert shadow["changes_current_dependency_blocking"] is False


def test_verified_dataflow_dependency_missing_from_legacy_is_visible_without_changing_frontier() -> None:
    contract = _contract([
        _goal("details", domain="order", operation="query_details"),
        {
            **_goal("invoice", domain="invoice", operation="create"),
            "target_candidate": {"order_id": "10002"},
        },
    ])
    registry = _registry()
    state = _state(contract, goal_records=[])
    plan = build_pretool_shadow_plan(state=state, capability_registry=registry)
    graph = deepcopy(plan["typed_goal_graph"])
    by_goal = {row["goal_id"]: row for row in graph["goals"]}
    producer = by_goal["details"]
    consumer = by_goal["invoice"]
    source = graph["source_semantic_contract"]
    artifact = make_verified_artifact_ref(
        artifact_ref="order:10002",
        type_name="ResolvedOrderBinding",
        resource_type="order",
        cardinality="exactly_one",
        producer_goal_id="details",
        scope=graph["scope"],
        semantic_contract_id=source["semantic_contract_id"],
        semantic_digest=source["semantic_digest"],
        source_ref_id="test:verified-order-binding",
        proof_digest="a" * 64,
        authority="authoritative",
    )
    edge = make_verified_dataflow_edge(
        graph=graph,
        producer_goal_id="details",
        producer_port_id=producer["output_ports"][0]["port_id"],
        consumer_goal_id="invoice",
        consumer_port_id=consumer["input_ports"][0]["port_id"],
        artifact_ref=artifact,
        verification_proof_digest="b" * 64,
    )
    graph = with_verified_dataflow_edge(graph, edge)
    coverage = build_goal_capability_coverage(
        goals=contract["goals"],
        goal_plans=plan["goal_plans"],
        capability_registry=registry,
        typed_goal_graph=graph,
        frozen_contract=contract,
    )
    plan["typed_goal_graph"] = graph
    plan["global_goal_capability_coverage"] = coverage

    baseline = build_pretool_execution_policy(
        state=state,
        capability_registry=registry,
    )
    policy = build_pretool_execution_policy(
        state=state,
        capability_registry=registry,
        shadow_plan=plan,
    )

    assert policy["allowed_capability_tools"] == baseline["allowed_capability_tools"]
    by_policy_goal = {row["goal_id"]: row for row in policy["goal_policies"]}
    assert by_policy_goal["invoice"]["status"] != "BLOCKED_BY_GOAL_DEPENDENCY"
    shadow = policy["typed_dependency_authority_shadow"]
    assert shadow["status"] == "DIVERGED"
    assert shadow["typed_dataflow_status"] == "GOAL_GRAPH_DATAFLOW_CLOSED"
    assert shadow["cutover_eligible"] is False
    invoice = next(row for row in shadow["comparisons"] if row["goal_id"] == "invoice")
    assert invoice["legacy_dependency_goal_ids"] == []
    assert invoice["typed_derived_dependency_goal_ids"] == ["details"]
    assert invoice["current_legacy_would_block"] is False
    assert invoice["typed_would_block"] is True
    assert "VERIFIED_DATAFLOW_DEPENDENCY_MISSING_FROM_LEGACY" in invoice["codes"]
    assert shadow["changes_current_dependency_blocking"] is False
    assert shadow["changes_allowed_capability_tools"] is False


def test_dependency_shadow_is_not_exposed_to_model_prompt_projection() -> None:
    contract = _contract([
        _goal("details", domain="order", operation="query_details")
    ])
    policy = build_pretool_execution_policy(
        state=_state(contract),
        capability_registry=_registry(),
    )
    projection = execution_policy_prompt_projection(policy)

    assert "typed_dependency_authority_shadow" in policy
    assert "typed_dependency_authority_shadow" not in projection
    assert "typed_graph" not in projection
''', encoding='utf-8')
          PY

      - name: Run targeted Stage2C tests
        shell: bash
        run: |
          set -euo pipefail
          git add \
            services/agent-service/src/agent_core/lifecycle/pretool_execution_policy.py \
            services/agent-service/tests/runtime/test_typed_goal_dependency_authority_shadow.py
          git diff --cached --check
          cd services/agent-service
          PYTHONPATH=src .venv/bin/python -m pytest -q \
            tests/runtime/test_typed_goal_dependency_authority_shadow.py \
            tests/runtime/test_pretool_execution_policy.py \
            tests/runtime/test_typed_goal_coverage_shadow_integration.py

      - name: Commit Stage2C code locally
        id: code_commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git commit -m 'Add typed dependency authority shadow audit'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Refresh exact protected product-source baseline
        shell: bash
        env:
          CODE_COMMIT: ${{ steps.code_commit.outputs.sha }}
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.').resolve()
          baseline_path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(baseline_path.read_text(encoding='utf-8'))
          previous = {str(k): str(v) for k, v in (payload.get('files') or {}).items()}
          if int(payload.get('file_count') or 0) != 582 or len(previous) != 582:
              raise SystemExit(f"unexpected_previous_baseline:{payload.get('file_count')}/{len(previous)}")
          protected_roots = tuple(str(v) for v in payload.get('protected_roots') or ())
          if protected_roots != ('services', 'web', 'contracts'):
              raise SystemExit(f'unexpected_protected_roots:{protected_roots!r}')
          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', *protected_roots], cwd=root)
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          current = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          if len(current) != 583:
              raise SystemExit(f'unexpected_protected_file_count:{len(current)}')
          changed = {
              path for path in set(current) & set(previous)
              if current[path] != previous[path]
          }
          added = set(current) - set(previous)
          removed = set(previous) - set(current)
          expected_changed = {
              'services/agent-service/src/agent_core/lifecycle/pretool_execution_policy.py',
          }
          expected_added = {
              'services/agent-service/tests/runtime/test_typed_goal_dependency_authority_shadow.py',
          }
          if changed != expected_changed:
              raise SystemExit('unexpected_changed_existing:' + ','.join(sorted(changed)))
          if added != expected_added:
              raise SystemExit('unexpected_added:' + ','.join(sorted(added)))
          if removed:
              raise SystemExit('unexpected_removed:' + ','.join(sorted(removed)))
          code_commit = str(os.environ.get('CODE_COMMIT') or '').strip()
          if len(code_commit) != 40:
              raise SystemExit('code_commit_identity_missing')
          payload['file_count'] = len(current)
          payload['files'] = dict(sorted(current.items()))
          payload['generated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          payload['generated_from'] = 'git:' + code_commit
          baseline_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'status': 'PASS',
              'file_count': len(current),
              'generated_from': payload['generated_from'],
              'changed': sorted(changed),
              'added': sorted(added),
              'removed': sorted(removed),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Remove helper and validate Skill control plane
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/typed-goal-stage2c-dependency-shadow-once.yml
          git add \
            skill-system/registry/product-source-baseline.json \
            .github/workflows/typed-goal-stage2c-dependency-shadow-once.yml
          git diff --cached --check
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/profile_runner.py skill-control-plane

      - name: Publish exact Stage2C audit
        shell: bash
        run: |
          set -euo pipefail
          git commit -m 'Refresh typed goal Stage2C protected baseline'
          git push origin HEAD:"$TARGET_BRANCH"
          echo "FINAL_HEAD=$(git rev-parse HEAD)"

      - name: Dispatch formal final-head gates
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          sleep 3
          gh workflow run quality.yml --ref "$TARGET_BRANCH"
          gh workflow run skill-self-validation.yml --ref "$TARGET_BRANCH"
