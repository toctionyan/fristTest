name: Temporary Stage 8 Fixture Closure

"on":
  push:
    branches: [fix/proof-authority-lifecycle-20260816]

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: execute Stage 8 fixture closure' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Repair stale transaction test fixtures only
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, *, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          runtime_path = 'services/agent-service/tests/architecture/test_runtime_foundations.py'
          replace_once(
              runtime_path,
              '        projection={"label": "订单 10001 退款"},\n',
              '        projection={"label": "订单 10001 退款", "confirmation_id": "confirm-1", "confirmation_version": 1},\n',
              label='runtime canonical draft projection',
          )
          old_loop = '''    for attempt_id in ("attempt:1", "attempt:2"):\n        store.start_attempt(\n            attempt_id=attempt_id,\n            tenant_id="t1",\n            user_id="u1",\n            thread_id="thread-1",\n            draft_id="offer:1",\n            draft_revision=2,\n            grant_id="grant:1",\n            action_id="create_refund",\n            command_digest="digest-1",\n            idempotency_key=f"idem:{attempt_id}",\n            canonical_payload={"order_id": "10001"},\n        )\n        store.record_receipt(\n            receipt_id=f"receipt:{attempt_id}",\n            tenant_id="t1",\n            user_id="u1",\n            thread_id="thread-1",\n            draft_id="offer:1",\n            attempt_id=attempt_id,\n            receipt_handle=f"handle:{attempt_id}",\n            receipt_state="SUCCESS",\n            business_result={"success": True, "attempt": attempt_id},\n        )\n\n    attempts = store.list_attempts_for_draft(scope=scope, draft_id="offer:1")\n    assert {item["attempt_id"] for item in attempts} == {"attempt:1", "attempt:2"}\n    assert store.get_receipt_for_attempt(scope=scope, attempt_id="attempt:1")["receipt_id"] == "receipt:attempt:1"\n    assert store.get_latest_receipt_for_draft(scope=scope, draft_id="offer:1")["receipt_id"] == "receipt:attempt:2"\n'''
          new_loop = '''    grant = store.issue_grant(\n        grant_id="grant:1",\n        tenant_id="t1",\n        user_id="u1",\n        thread_id="thread-1",\n        draft_id="offer:1",\n        draft_revision=2,\n        command_digest="digest-1",\n        confirmation_id="confirm-1",\n        client_request_id="client:1",\n        actor_id="u1",\n        actor_role="customer",\n    )\n    assert grant["state"] == "ISSUED"\n    started = store.reserve_grant_and_start_attempt(\n        grant_id="grant:1",\n        attempt_id="attempt:1",\n        tenant_id="t1",\n        user_id="u1",\n        thread_id="thread-1",\n        draft_id="offer:1",\n        draft_revision=2,\n        action_id="create_refund",\n        command_digest="digest-1",\n        idempotency_key="idem:attempt:1",\n        canonical_payload={"order_id": "10001"},\n    )\n    assert started["reserved"] is True and started["created"] is True\n    receipt = store.record_receipt(\n        receipt_id="receipt:attempt:1",\n        tenant_id="t1",\n        user_id="u1",\n        thread_id="thread-1",\n        draft_id="offer:1",\n        attempt_id="attempt:1",\n        receipt_handle="handle:attempt:1",\n        receipt_state="SUCCESS",\n        business_result={"success": True, "attempt": "attempt:1"},\n    )\n    duplicate = store.record_receipt(\n        receipt_id="receipt:duplicate",\n        tenant_id="t1",\n        user_id="u1",\n        thread_id="thread-1",\n        draft_id="offer:1",\n        attempt_id="attempt:1",\n        receipt_handle="handle:attempt:1",\n        receipt_state="SUCCESS",\n        business_result={"success": True, "attempt": "attempt:1"},\n    )\n\n    attempts = store.list_attempts_for_draft(scope=scope, draft_id="offer:1")\n    assert [item["attempt_id"] for item in attempts] == ["attempt:1"]\n    assert receipt["receipt_id"] == "receipt:attempt:1"\n    assert duplicate["receipt_id"] == "receipt:attempt:1"\n    assert store.get_receipt_for_attempt(scope=scope, attempt_id="attempt:1")["receipt_id"] == "receipt:attempt:1"\n    assert store.get_latest_receipt_for_draft(scope=scope, draft_id="offer:1")["receipt_id"] == "receipt:attempt:1"\n'''
          replace_once(runtime_path, old_loop, new_loop, label='runtime receipt cardinality fixture')

          sqlalchemy_path = 'services/agent-service/tests/architecture/test_sqlalchemy_transaction_repository.py'
          replace_once(
              sqlalchemy_path,
              '            draft_state="READY",\n',
              '            draft_state="AWAITING_AUTHORIZATION",\n',
              label='sqlalchemy canonical draft state',
          )
          replace_once(
              sqlalchemy_path,
              '            projection={"label": "取消订单"},\n',
              '            projection={"label": "取消订单", "confirmation_id": "confirmation-1", "confirmation_version": 1},\n',
              label='sqlalchemy canonical draft projection',
          )
          replace_once(
              sqlalchemy_path,
              '        assert draft["projection"] == {"label": "取消订单"}\n\n        receipt = provider.transactions.record_receipt(\n',
              '''        assert draft["projection"] == {\n            "label": "取消订单",\n            "confirmation_id": "confirmation-1",\n            "confirmation_version": 1,\n        }\n\n        grant = provider.transactions.issue_grant(\n            grant_id="grant-1",\n            tenant_id="tenant-a",\n            user_id="u001",\n            thread_id="thread-1",\n            draft_id="draft-1",\n            draft_revision=1,\n            command_digest="digest",\n            confirmation_id="confirmation-1",\n            client_request_id="client-1",\n            actor_id="u001",\n            actor_role="customer",\n        )\n        assert grant["state"] == "ISSUED"\n        started = provider.transactions.reserve_grant_and_start_attempt(\n            grant_id="grant-1",\n            attempt_id="attempt-1",\n            tenant_id="tenant-a",\n            user_id="u001",\n            thread_id="thread-1",\n            draft_id="draft-1",\n            draft_revision=1,\n            action_id="cancel_order",\n            command_digest="digest",\n            idempotency_key="idem-1",\n            canonical_payload={"order_id": "order-1"},\n            business_command_envelope={"command_id": "command-1"},\n        )\n        assert started["reserved"] is True and started["created"] is True\n\n        receipt = provider.transactions.record_receipt(\n''',
              label='sqlalchemy authoritative receipt fixture',
          )
          PY
          git diff --check
          git diff -- services/agent-service/tests/architecture/test_runtime_foundations.py services/agent-service/tests/architecture/test_sqlalchemy_transaction_repository.py
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Run focused authority-chain regressions
        working-directory: services/agent-service
        env:
          PYTHONPATH: src
          APP_PROFILE: local
        run: |
          set -euo pipefail
          .venv/bin/python -B -m pytest \
            tests/architecture/test_runtime_foundations.py::test_scope_first_repository_and_receipt_cardinality \
            tests/architecture/test_sqlalchemy_transaction_repository.py::test_sqlalchemy_repository_serializes_domain_payloads_into_declared_columns \
            tests/transactions/test_transaction_storage.py \
            tests/transactions/test_stage8_transaction_authority_adversarial.py \
            -m 'not integration' -q
      - name: Commit fixture repair and remove executor
        run: |
          set -euo pipefail
          rm .github/workflows/stage8-fixture-closure.yml
          cat > /tmp/expected <<'EOF'
          .github/workflows/stage8-fixture-closure.yml
          services/agent-service/tests/architecture/test_runtime_foundations.py
          services/agent-service/tests/architecture/test_sqlalchemy_transaction_repository.py
          EOF
          sort -o /tmp/expected /tmp/expected
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/stage8-fixture-closure.yml \
            services/agent-service/tests/architecture/test_runtime_foundations.py \
            services/agent-service/tests/architecture/test_sqlalchemy_transaction_repository.py
          git diff --cached --check
          git commit -m 'test: bind receipt fixtures to authoritative transaction chain'
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh protected product-source baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('.').resolve()
          path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          roots = tuple(str(value) for value in payload['protected_roots'])
          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', *roots], cwd=root)
          tracked = sorted(item.decode() for item in raw.split(b'\0') if item)
          payload['generated_from'] = 'git:' + os.environ['SOURCE_SHA']
          payload['generated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          payload['file_count'] = len(tracked)
          payload['files'] = {p: hashlib.sha256((root / p).read_bytes()).hexdigest() for p in tracked}
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print({'generated_from': payload['generated_from'], 'file_count': len(tracked)})
          PY
          python -m unittest skill-system/tests/test_product_source_baseline_binding.py
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = 'skill-system/registry/product-source-baseline.json'
      - name: Publish fixture closure and baseline
        run: |
          set -euo pipefail
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m 'chore: refresh Stage 8 fixture-closure baseline'
          git push origin HEAD:fix/proof-authority-lifecycle-20260816
