name: C2 architecture boundary repair once

on:
  push:
    branches:
      - strong-context-scope-repair-20260810

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[c2-arch-done]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Apply architecture-boundary patch
        run: python -B scripts/apply_c2_architecture_boundary_once.py
      - name: Compile repaired files
        run: |
          python -B -m py_compile \
            services/agent-service/src/agent_core/runtime/capability_gate.py \
            skill-system/tests/test_c2_strong_context_scope_repair.py
      - name: Validate C2 and architecture debt
        run: |
          python -B -m unittest discover -s skill-system/tests -p 'test_c2_strong_context_scope_repair.py'
          python -B -m unittest discover -s skill-system/tests -p 'test_architecture_cycle_debt.py'
      - name: Validate full Skill tests
        run: python -B -m unittest discover -s skill-system/tests -p 'test_*.py'
      - name: Commit architecture-clean C2 repair
        run: |
          rm scripts/apply_c2_architecture_boundary_once.py
          rm .github/workflows/c2-architecture-boundary-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m '[c2-arch-done] Keep condition scope proof out of lifecycle dependency'
          git push origin HEAD:strong-context-scope-repair-20260810
