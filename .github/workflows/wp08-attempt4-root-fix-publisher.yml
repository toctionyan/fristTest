name: wp08-attempt4-root-fix-publisher

on:
  push:
    branches:
      - agent/wp08-attempt4-root-fixes-20260810

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Apply Attempt 4 root fixes and regressions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement, found {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # 1) Exact historical member identity is the referent. Multiple visible
          # parents containing that same member are provenance aliases, not
          # alternate semantic targets.
          replace_once(
              'services/agent-service/src/agent_core/context/reference_resolution.py',
              '''    equivalent_groups: dict[tuple[str, tuple[str, ...]], list[dict[str, Any]]] = {}\n    for row in cardinality_filtered:\n        equivalent_groups.setdefault(visible_result_scope_key(row), []).append(row)\n    distinct_candidate_groups = list(equivalent_groups.values())\n''',
              '''    equivalent_groups: dict[tuple[str, tuple[str, ...]], list[dict[str, Any]]] = {}\n    if reference_type == "explicit_visible_member" and cardinality_filtered:\n        # The model has proposed one exact, already-visible member handle.  Its\n        # containing ResultRefs are visibility/provenance aliases, not distinct\n        # business targets.  Collapse only this explicit-member relation; all\n        # temporal/result/ordinal relations keep normal parent-scope ambiguity.\n        distinct_candidate_groups = [list(cardinality_filtered)]\n    else:\n        for row in cardinality_filtered:\n            equivalent_groups.setdefault(visible_result_scope_key(row), []).append(row)\n        distinct_candidate_groups = list(equivalent_groups.values())\n''',
          )
          replace_once(
              'services/agent-service/src/agent_core/context/reference_resolution.py',
              '''        "equivalent_candidate_scope_count": len(distinct_candidate_groups),\n        "equivalent_aliases_collapsed": sum(max(0, len(group) - 1) for group in distinct_candidate_groups),\n        "selection_policy": "typed_relation_then_semantic_scope_equivalence_then_runtime_validation_no_fallback",\n''',
              '''        "equivalent_candidate_scope_count": len(distinct_candidate_groups),\n        "equivalent_aliases_collapsed": sum(max(0, len(group) - 1) for group in distinct_candidate_groups),\n        "selection_policy": (\n            "explicit_member_identity_then_visible_parent_provenance_no_fallback"\n            if reference_type == "explicit_visible_member"\n            else "typed_relation_then_semantic_scope_equivalence_then_runtime_validation_no_fallback"\n        ),\n''',
          )
          replace_once(
              'services/agent-service/src/agent_core/context/reference_resolution.py',
              '''            (\n                "expected_cardinality belongs to the historical referent, not the Goal output. "\n                "Use single only when the user is pointing at one prior visible object/member; use "\n                "collection when the user is pointing at a visible set that will be filtered, sorted "\n                "or compared. A UNIQUE single proof exposes the verified member handle; Runtime does "\n                "not choose a member from a multi-member collection."\n            ),\n''',
              '''            (\n                "expected_cardinality belongs to the historical referent, not the Goal output. "\n                "Use single only when the user is pointing at one prior visible object/member; use "\n                "collection when the user is pointing at a visible set that will be filtered, sorted "\n                "or compared. A UNIQUE single proof exposes the verified member handle; Runtime does "\n                "not choose a member from a multi-member collection."\n            ),\n            (\n                "When an explicit historical label resolves to one exact visible member_handle, propose "\n                "explicit_visible_member. If that same member is present under several visible parent "\n                "ResultRefs, those parents are provenance aliases rather than member ambiguity; do not "\n                "invent source_result_ref merely to break the alias tie. Distinct member handles remain "\n                "ambiguous and require clarification."\n            ),\n''',
          )

          # 2) Semantic dependency precedence. Ordinary zero-anaphora ellipsis is
          # independent, but an explicit anaphoric result reference to a not-yet-
          # produced current-turn result takes precedence and is a true dependency.
          replace_once(
              'services/agent-service/src/agent_core/lifecycle/goal_granularity.py',
              '''        "If a business object, descriptor or scope is already stated literally anywhere in the same USER_TEXT and the later outcome merely omits repeating it, that is same-turn ellipsis, not a dependency on the earlier result.",\n''',
              '''        "If a business object, descriptor or scope is already stated literally anywhere in the same USER_TEXT and the later outcome merely omits repeating it, that zero-anaphora omission is same-turn ellipsis, not a dependency on the earlier result. This ellipsis rule applies only when the later outcome contains no explicit expression that denotes the earlier current-turn result.",\n''',
          )
          replace_once(
              'services/agent-service/src/agent_core/lifecycle/goal_granularity.py',
              '''        "A later outcome that literally refers to the not-yet-produced earlier result with it/this/that/其中/这个/该结果, or a condition/value that explicitly consumes that result, may retain an edge when basis_span identifies that reference inside the dependent outcome.",\n''',
              '''        "When a later outcome explicitly refers to the not-yet-produced earlier current-turn result (for example with an anaphoric it/this/that/其中/这个/该结果) or explicitly consumes that result in a condition/value, retain the dependency when basis_span identifies that reference inside the dependent outcome. This explicit result-reference rule takes precedence over ordinary same-turn zero-anaphora ellipsis.",\n''',
          )
          replace_once(
              'services/agent-service/src/agent_core/lifecycle/goal_granularity.py',
              '''            "When a later outcome omits its target but an earlier phrase in the same USER_TEXT already names the reusable business object or scope, inherit that stated scope as ellipsis; that is not a dependency on the earlier Goal result by itself.",\n''',
              '''            "When a later outcome genuinely omits its repeated target and an earlier phrase in the same USER_TEXT already names the reusable business object or scope, inherit that stated scope as zero-anaphora ellipsis; that is not a dependency on the earlier Goal result by itself. Do not apply this rule when the later outcome contains an explicit anaphoric expression denoting the earlier current-turn result.",\n''',
          )
          replace_once(
              'services/agent-service/src/agent_core/lifecycle/goal_granularity.py',
              '''            "A later outcome that refers to the not-yet-produced earlier result or is explicitly conditional on that result may require an edge; the independent dependency audit certifies the basis.",\n''',
              '''            "A later outcome with an explicit anaphoric reference to the not-yet-produced earlier current-turn result, or one explicitly conditional on that result, requires a result dependency when the independent dependency audit certifies a literal basis inside that later outcome; this explicit reference takes precedence over the ordinary zero-anaphora ellipsis rule.",\n''',
          )

          replace_once(
              'services/agent-service/src/agent_core/lifecycle/goal_planning.py',
              '''            "a later goal that refers to the not-yet-produced earlier result with it/this/that/其中/这个/该结果, or is explicitly conditional on that result, must declare depends_on that earlier goal",\n''',
              '''            "a later goal with an explicit anaphoric expression that denotes the not-yet-produced earlier current-turn result (for example it/this/that/其中/这个/该结果), or one explicitly conditional on that result, must declare depends_on that earlier goal; this explicit result-reference rule takes precedence over ordinary same-turn zero-anaphora ellipsis",\n''',
          )
          replace_once(
              'services/agent-service/src/agent_core/lifecycle/goal_planning.py',
              '''            "when a later outcome omits its target but an earlier phrase in the same current user turn already names the reusable business object or scope, inherit that stated scope as ellipsis; that shared scope is not a dependency on the earlier Goal result by itself",\n''',
              '''            "when a later outcome genuinely omits its repeated target but an earlier phrase in the same current user turn already names the reusable business object or scope, inherit that stated scope as zero-anaphora ellipsis; that shared scope is not a dependency on the earlier Goal result by itself, but this rule does not apply when the later outcome explicitly refers to the earlier current-turn result",\n''',
          )

          replace_once(
              'services/agent-service/src/agent_core/lifecycle/protocol.py',
              '''            "同一当前轮内只有真实结果依赖才填写 depends_on：后一个 Goal 的目标、输入、条件或可完成含义必须使用前一个 Goal 的结果时才依赖；并列、再/然后/另外、共享对象或共享主题本身不构成依赖。同一原话前文已明确对象或范围、后文只省略重复对象时继承该已明示范围，不依赖前一个 Goal 的执行结果。即使执行时需要先查一次把这个已明示对象解析成订单号/ID/artifact handle，这也只是执行支持数据流，不是 Goal 语义依赖。不得为尚未执行的当前轮 Goal 的未来结果创建 reference_expression。"\n''',
              '''            "同一当前轮内只有真实结果依赖才填写 depends_on：后一个 Goal 的目标、输入、条件或可完成含义必须使用前一个 Goal 的结果时才依赖；并列、再/然后/另外、共享对象或共享主题本身不构成依赖。同一原话前文已明确对象或范围、后文真正省略重复对象（零指代）时继承该已明示范围，不依赖前一个 Goal 的执行结果；但后文若出现显式指代表达并指向前一个 Goal 尚未产生的本轮结果，这不是“仅省略重复对象”，真实结果依赖优先，必须 depends_on 前一个 Goal。即使执行时需要先查一次把已明示对象解析成订单号/ID/artifact handle，这也只是执行支持数据流，不是 Goal 语义依赖。不得为尚未执行的当前轮 Goal 的未来结果创建 reference_expression。"\n''',
          )
          replace_once(
              'services/agent-service/src/agent_core/lifecycle/protocol.py',
              '''                                    "同一原话前文已明确业务对象或范围而后文只省略重复对象时，应继承该明示范围；这不是对前一个 Goal 执行结果的依赖。执行时若仍需一次读取把该描述解析成稳定 ID/artifact handle，那只是支持步骤，不能反向制造 depends_on。"\n                                    "若后一个 Goal 用它/这个/其中某项等指向本轮前一个 Goal 尚未产生的结果，或其条件显式依赖前一个结果，则应填写依赖。"\n''',
              '''                                    "同一原话前文已明确业务对象或范围而后文真正省略重复对象（零指代）时，应继承该明示范围；这不是对前一个 Goal 执行结果的依赖。执行时若仍需一次读取把该描述解析成稳定 ID/artifact handle，那只是支持步骤，不能反向制造 depends_on。"\n                                    "若后一个 Goal 用显式指代表达（例如它/这个/其中某项）指向本轮前一个 Goal 尚未产生的结果，或其条件显式依赖前一个结果，则应填写依赖；这种显式结果指代不是普通零指代省略，并且优先于上一条省略规则。"\n''',
          )
          replace_once(
              'services/agent-service/src/agent_core/lifecycle/protocol.py',
              '''                "member_handle": {"type": "string"},\n                "source_result_ref": {"type": "string"},\n''',
              '''                "member_handle": {"type": "string", "description": "精确的历史可见成员身份；同一成员出现在多个父 ResultRef 时仍是同一语义目标。"},\n                "source_result_ref": {"type": "string", "description": "可选的精确父结果限定；只有用户语义确实限定该父结果时填写，不得仅为消除同成员的父别名而编造。"},\n''',
          )

          replace_once(
              'services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py',
              '''同一用户原话中前文已明确业务对象或范围、后文只是省略重复对象时，应继承这个已明示范围作为省略语义，不得因此依赖前一个 Goal 的执行结果；即使后续执行需要先做一次读取把这个已明示对象解析成稳定 ID/artifact handle，那也是执行支持数据流，不是 Goal 语义依赖。若后一个 Goal 用它/这个/其中某项等指向本轮前一个 Goal 尚未产生的结果，或条件显式依赖前一个结果，则应声明 depends_on。''',
              '''同一用户原话中前文已明确业务对象或范围、后文真正省略重复对象（零指代）时，应继承这个已明示范围作为省略语义，不得因此依赖前一个 Goal 的执行结果；即使后续执行需要先做一次读取把这个已明示对象解析成稳定 ID/artifact handle，那也是执行支持数据流，不是 Goal 语义依赖。若后一个 Goal 使用显式指代表达（例如它/这个/其中某项）指向本轮前一个 Goal 尚未产生的结果，或条件显式依赖前一个结果，则应声明 depends_on；这种显式结果指代不是普通零指代省略，并且优先于上一条省略规则。''',
          )
          replace_once(
              'services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py',
              '''用户明确按标签回到或纠正一个旧结果时，选择旧 ResultRef，并填写 context_binding={reference_kind:explicit_return, source_span:本轮逐字出现的旧结果成员标签片段}；source_span 应复制商品名/订单号等标签片段，不能填普通代词。''',
              '''用户明确按标签回到或纠正一个旧结果时，如果该标签在历史可见结果中只对应一个精确 member_handle，即使这个同一成员同时出现在多个父 ResultRef 下，这些父结果也只是同一成员的展示/证明别名；统一语义声明应使用 reference_expression.reference_type=explicit_visible_member 并填写该精确 member_handle，不得仅为父别名消歧而随意填写 source_result_ref。只有标签实际对应不同 member_handle 时才属于成员歧义并需要澄清。业务执行阶段仍选择与冻结 resolved_reference 一致的旧 ResultRef/成员，并填写 context_binding={reference_kind:explicit_return, source_span:本轮逐字出现的旧结果成员标签片段}；source_span 应复制商品名/订单号等标签片段，不能填普通代词。''',
          )

          replace_once(
              'services/agent-service/scripts/verify_preprod_conversation_smoke.py',
              '''            "同一当前轮中后续目标依赖前一目标时只用 depends_on；reference_expression 只用于已经在更早轮次向客户展示的历史结果，"\n            "不能引用本轮尚未执行目标的未来结果。"\n''',
              '''            "同一当前轮中后续目标依赖前一目标时只用 depends_on；前文已明示对象而后文真正省略重复对象（零指代）只是共享范围，不产生依赖；但后文若用显式指代表达指向前一个 Goal 尚未产生的本轮结果，则这不是普通省略，真实结果依赖优先，必须 depends_on 前一个 Goal。reference_expression 只用于已经在更早轮次向客户展示的历史结果，"\n            "不能引用本轮尚未执行目标的未来结果。"\n''',
          )

          test_path = Path('services/agent-service/tests/runtime/test_wp08_attempt4_release_repairs.py')
          if test_path.exists():
              raise SystemExit(f'{test_path}: unexpected pre-existing file')
          test_path.write_text(r'''from __future__ import annotations

import inspect

from agent_core.context.reference_resolution import (
    normalize_reference_expression,
    reference_resolution_prompt_contract,
    resolve_reference_expression,
)
from agent_core.lifecycle import protocol
from agent_core.lifecycle.goal_granularity import _run_dependency_basis_audit
from agent_core.lifecycle.goal_planning import ModelGoalAlignmentVerifier


def _visible_aliases() -> list[dict]:
    return [
        {
            "result_ref": "view:all-orders",
            "source_turn": 2,
            "shape": "collection",
            "member_handles": ["order:1", "order:2"],
            "canonical_order": ["order:1", "order:2"],
            "resource_types": ["order"],
            "discourse_recency_rank": 3,
        },
        {
            "result_ref": "view:earphones-only",
            "source_turn": 5,
            "shape": "one",
            "member_handles": ["order:1"],
            "canonical_order": ["order:1"],
            "resource_types": ["order"],
            "discourse_recency_rank": 2,
        },
        {
            "result_ref": "eligibility:earphones",
            "source_turn": 6,
            "shape": "collection",
            "member_handles": ["order:1"],
            "canonical_order": ["order:1"],
            "resource_types": ["order"],
            "discourse_recency_rank": 1,
        },
    ]


def test_explicit_visible_member_collapses_parent_aliases_by_exact_member_identity() -> None:
    text = "回到刚才的蓝牙耳机，它是哪一个订单？"
    expression = normalize_reference_expression(
        {
            "reference_type": "explicit_visible_member",
            "member_handle": "order:1",
            "object_type": "order",
            "expected_cardinality": "single",
            "evidence_span": "蓝牙耳机",
        },
        user_text=text,
    )
    proof = resolve_reference_expression(expression, visible_result_refs=_visible_aliases())
    assert proof["resolution_status"] == "UNIQUE"
    assert proof["resolved_member_handles"] == ["order:1"]
    assert proof["resolved_result_ref"] == "view:earphones-only"
    assert proof["equivalent_candidate_scope_count"] == 1
    assert proof["equivalent_aliases_collapsed"] == 2
    assert proof["selection_policy"] == "explicit_member_identity_then_visible_parent_provenance_no_fallback"
    assert proof["auto_substitution_used"] is False


def test_explicit_visible_member_source_parent_is_exact_and_never_falls_back() -> None:
    text = "回到刚才的蓝牙耳机"
    expression = normalize_reference_expression(
        {
            "reference_type": "explicit_visible_member",
            "member_handle": "order:1",
            "source_result_ref": "view:unrelated",
            "object_type": "order",
            "expected_cardinality": "single",
            "evidence_span": "蓝牙耳机",
        },
        user_text=text,
    )
    proof = resolve_reference_expression(expression, visible_result_refs=_visible_aliases())
    assert proof["resolution_status"] == "NOT_FOUND"
    assert proof["resolved_result_ref"] is None
    assert proof["resolved_member_handles"] == []
    assert proof["auto_substitution_used"] is False


def test_temporal_reference_keeps_distinct_parent_scope_ambiguity() -> None:
    text = "刚才那些订单"
    expression = normalize_reference_expression(
        {
            "reference_type": "temporal_visible_result",
            "temporal_relation": "latest",
            "object_type": "order",
            "expected_cardinality": "collection",
            "evidence_span": text,
        },
        user_text=text,
    )
    refs = [
        {
            "result_ref": "view:a",
            "source_turn": 9,
            "shape": "collection",
            "member_handles": ["order:1"],
            "canonical_order": ["order:1"],
            "resource_types": ["order"],
        },
        {
            "result_ref": "view:b",
            "source_turn": 9,
            "shape": "collection",
            "member_handles": ["order:2"],
            "canonical_order": ["order:2"],
            "resource_types": ["order"],
        },
    ]
    proof = resolve_reference_expression(expression, visible_result_refs=refs)
    assert proof["resolution_status"] == "AMBIGUOUS"
    assert proof["resolved_result_ref"] is None


def test_semantic_dependency_contract_explicit_result_reference_precedes_zero_anaphora_ellipsis() -> None:
    schema_text = str(protocol.DECLARE_TURN_GOALS_SCHEMA)
    alignment_source = inspect.getsource(ModelGoalAlignmentVerifier.verify)
    dependency_source = inspect.getsource(_run_dependency_basis_audit)
    assert "显式结果指代不是普通零指代省略" in schema_text
    assert "takes precedence over ordinary same-turn zero-anaphora ellipsis" in alignment_source
    assert "takes precedence over ordinary same-turn zero-anaphora ellipsis" in dependency_source


def test_reference_prompt_contract_documents_exact_member_alias_semantics() -> None:
    rules = " ".join(reference_resolution_prompt_contract()["rules"])
    assert "explicit_visible_member" in rules
    assert "provenance aliases rather than member ambiguity" in rules
    assert "Distinct member handles remain ambiguous" in rules
''', encoding='utf-8')
          PY

      - name: Run focused Attempt 4 regression gates
        shell: bash
        run: |
          set -euo pipefail
          cd services/agent-service
          .venv/bin/python -B -m pytest -q \
            tests/runtime/test_wp08_attempt4_release_repairs.py \
            tests/context/test_reference_resolution_contract.py \
            tests/runtime/test_goal_granularity_and_conditions.py
          cd ../..
          services/agent-service/.venv/bin/python -B -m unittest \
            skill-system.tests.test_wp08_new_release_attempt3_root_fixes
          services/agent-service/.venv/bin/python -B -m pytest -q \
            services/agent-service/tests/context/test_semantic_goal_coverage_suite_execution.py \
            services/agent-service/tests/runtime/test_semantic_reference_binding.py

      - name: Commit verified product repair
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/agent-service/src/agent_core/context/reference_resolution.py \
            services/agent-service/src/agent_core/lifecycle/goal_granularity.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/lifecycle/protocol.py \
            services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py \
            services/agent-service/scripts/verify_preprod_conversation_smoke.py \
            services/agent-service/tests/runtime/test_wp08_attempt4_release_repairs.py
          git commit -m 'fix: close Attempt 4 dependency and historical member alias boundaries'

      - name: Regenerate protected product baseline and remove publisher
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.').resolve()
          path = root / 'skill-system/registry/product-source-baseline.json'
          previous = json.loads(path.read_text(encoding='utf-8'))
          roots = ['services', 'web', 'contracts']
          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', *roots], cwd=root)
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          files = {rel: hashlib.sha256((root / rel).read_bytes()).hexdigest() for rel in tracked}
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()
          payload = {
              'schema_version': int(previous.get('schema_version') or 2),
