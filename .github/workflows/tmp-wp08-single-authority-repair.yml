name: tmp-wp08-single-authority-repair

on:
  push:
    branches:
      - fix/wp08-single-authority-cutover-20260813

permissions:
  contents: write

jobs:
  repair-validate-publish:
    if: github.ref == 'refs/heads/fix/wp08-single-authority-cutover-20260813'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/wp08-single-authority-cutover-20260813
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Apply authority repair
        run: python .github/tmp/wp08_single_authority_repair.py
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Run focused authority regressions
        run: >-
          cd services/agent-service && PYTHONPATH=src .venv/bin/python -m pytest
          tests/runtime/test_wp08_attempt3_single_authority_repairs.py
          tests/runtime/test_semantic_reference_binding.py
          tests/runtime/test_semantic_output_coverage.py
          tests/runtime/test_deterministic_target_compiler.py
          tests/runtime/test_execution_target_authority_cutover.py -q
      - name: Refresh exact protected source baseline
        run: python .github/tmp/wp08_refresh_authority_baseline.py
      - name: Validate Skill control plane against refreshed baseline
        run: services/agent-service/.venv/bin/python -B skill-system/controller/profile_runner.py skill-control-plane
      - name: Publish validated repair and remove carrier
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-wp08-single-authority-repair.yml
          git rm .github/tmp/wp08_single_authority_repair.py
          git rm .github/tmp/wp08_refresh_authority_baseline.py
          git add services/agent-service/src/agent_core/lifecycle/protocol.py
          git add services/agent-service/src/agent_core/lifecycle/goal_planning.py
          git add services/agent-service/src/agent_core/runtime/capability_gate.py
          git add services/agent-service/src/agent_core/runtime/semantic_capability_verifier.py
          git add services/agent-service/tests/runtime/test_wp08_attempt3_single_authority_repairs.py
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m "Make semantic output and target contracts single authority"
          git push origin HEAD:fix/wp08-single-authority-cutover-20260813
