name: wp08-attempt6-replay-missed-repair-merge-once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: read

jobs:
  replay-and-reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt6-replay-missed-repair-merge-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_MAIN_SHA: 8ee0938cd1f4f14399fb761c587fe9c080f195d1
      REPAIR_PR_NUMBER: '394'
      RELEASE_ISSUE_NUMBER: '335'
      RELEASE_RUN_ID: wp08-release-31340813528
      PARENT_WP08_RUN_ID: '31359759058'
      EXPECTED_ATTEMPT: '7'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact authoritative main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Rebuild exact missed merged-PR event from GitHub authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          from pathlib import Path
          from urllib import request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          pr_number = int(os.environ['REPAIR_PR_NUMBER'])
          expected_sha = os.environ['EXPECTED_MAIN_SHA']
          release_id = os.environ['RELEASE_RUN_ID']
          parent_run = os.environ['PARENT_WP08_RUN_ID']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          req = request.Request(
              f'https://api.github.com/repos/{repo}/pulls/{pr_number}',
              headers=headers,
          )
          with request.urlopen(req, timeout=30) as response:
              pr = json.load(response)
          if pr.get('merged') is not True:
              raise SystemExit('repair PR is not merged')
          if str(pr.get('merge_commit_sha') or '') != expected_sha:
              raise SystemExit('repair PR merge SHA is not exact authoritative main')
          if str((pr.get('base') or {}).get('ref') or '') != 'main':
              raise SystemExit('repair PR base is not main')
          body = str(pr.get('body') or '')
          required = (
              f'WP08-Release-Run-ID: {release_id}',
              f'WP08-Parent-Run-ID: {parent_run}',
          )
          missing = [marker for marker in required if marker not in body]
          if missing:
              raise SystemExit('repair PR is missing durable release markers: ' + repr(missing))
          event_path = Path('/tmp/wp08-repair-pr-event.json')
          event_path.write_text(json.dumps({'pull_request': pr}, ensure_ascii=False), encoding='utf-8')
          print(json.dumps({
              'status': 'verified',
              'repair_pr': pr_number,
              'merge_commit_sha': expected_sha,
              'event_path': str(event_path),
          }, sort_keys=True))
          PY

      - name: Replay missed repair merge through repository coordinator
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python -B scripts/wp08_release_coordinator.py \
            --mode pull-request \
            --event-path /tmp/wp08-repair-pr-event.json

      - name: Reconcile exact-main Quality through official recovery controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python - <<'PY'
          from __future__ import annotations
          import json
          import os
          import subprocess
          import time
          from urllib import request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          issue_number = int(os.environ['RELEASE_ISSUE_NUMBER'])
          expected_sha = os.environ['EXPECTED_MAIN_SHA']
          expected_attempt = int(os.environ['EXPECTED_ATTEMPT'])
          parent_run = int(os.environ['PARENT_WP08_RUN_ID'])
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def read_state() -> dict:
              req = request.Request(
                  f'https://api.github.com/repos/{repo}/issues/{issue_number}',
                  headers=headers,
              )
              with request.urlopen(req, timeout=30) as response:
                  issue = json.load(response)
              body = str(issue.get('body') or '')
              text = body.split('<!-- WP08_RELEASE_RUN_STATE_BEGIN -->', 1)[1].split('<!-- WP08_RELEASE_RUN_STATE_END -->', 1)[0]
              payload = text.split('```json', 1)[1].split('```', 1)[0]
              return json.loads(payload)

          deadline = time.time() + 12 * 60
          last = None
          while time.time() < deadline:
              state = read_state()
              last = {
                  'status': str(state.get('status') or ''),
                  'attempt': int(state.get('attempt') or 0),
                  'candidate_sha': str(state.get('current_candidate_sha') or ''),
                  'current_wp08_run_id': int(state.get('current_wp08_run_id') or 0),
              }
              print(json.dumps(last, sort_keys=True), flush=True)
              if last['candidate_sha'] != expected_sha:
                  raise SystemExit('ReleaseRun candidate is not exact repaired main')
              if last['status'] == 'CERTIFYING':
                  if last['attempt'] != expected_attempt:
                      raise SystemExit('ReleaseRun CERTIFYING on unexpected attempt')
                  if last['current_wp08_run_id'] <= 0 or last['current_wp08_run_id'] == parent_run:
                      raise SystemExit('next attempt did not receive a fresh WP-08 run id')
                  break
              if last['status'] == 'MAIN_QUALITY_FAILED':
                  raise SystemExit('exact-main Quality failed; fail closed before next attempt')
              if last['status'] != 'WAITING_FOR_REPAIR_CI':
                  raise SystemExit('unexpected ReleaseRun state after merge replay: ' + last['status'])
              subprocess.run(
                  ['python', '-B', 'scripts/wp08_release_recovery.py', '--mode', 'reconcile'],
                  check=True,
              )
              time.sleep(15)
          else:
              raise SystemExit('timed out waiting for exact-main Quality/reconciliation: ' + json.dumps(last, sort_keys=True))

          state = read_state()
          history = list(state.get('history') or [])
          current_run = int(state.get('current_wp08_run_id') or 0)
          if not any(
              isinstance(row, dict)
              and row.get('event') == 'repair_merged'
              and int(row.get('pr_number') or 0) == int(os.environ['REPAIR_PR_NUMBER'])
              and int(row.get('parent_wp08_run_id') or 0) == parent_run
              and str(row.get('candidate_sha') or '') == expected_sha
              for row in history
          ):
              raise SystemExit('durable repair_merged history row is missing')
          if not any(
              isinstance(row, dict)
              and row.get('event') == 'wp08_dispatched'
              and int(row.get('attempt') or 0) == expected_attempt
              and str(row.get('candidate_sha') or '') == expected_sha
              and int(row.get('wp08_run_id') or 0) == current_run
              for row in history
          ):
              raise SystemExit('durable next-attempt dispatch history row is missing')
          if state.get('production_closed') is not False:
              raise SystemExit('production_closed changed unexpectedly')
          print(json.dumps({
              'status': 'PASS',
              'issue': issue_number,
              'release_state': state.get('status'),
              'attempt': state.get('attempt'),
              'candidate_sha': expected_sha,
              'wp08_run_id': current_run,
              'production_closed': state.get('production_closed'),
          }, sort_keys=True))
          PY
