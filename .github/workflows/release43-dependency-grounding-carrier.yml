name: release43-dependency-grounding-carrier

"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release43-dependency-grounding-carrier.yml
      - scripts/tmp_release43_dependency_grounding_repair.py

permissions:
  contents: write

concurrency:
  group: release43-dependency-grounding-carrier-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: false

jobs:
  validate-and-publish-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout carrier controls
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Release 43 source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fb3bdfceb02f265ee0e2eaa670cc4c7445b76e3e
          path: source
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Verify exact source identity
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "fb3bdfceb02f265ee0e2eaa670cc4c7445b76e3e"
          test -z "$(git -C source status --porcelain)"

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r source/deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Install locked Python validation environments
        run: |
          set -euo pipefail
          cd source/services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups

      - name: Apply bounded Release 43 dependency-grounding repair
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B \
            control/scripts/tmp_release43_dependency_grounding_repair.py \
            patch --workspace source

      - name: Verify exact pre-baseline repair scope
        run: |
          set -euo pipefail
          git -C source diff --check
          EXPECTED=$(printf '%s\n' \
            .github/release-trigger \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py | sort)
          ACTUAL=$({ git -C source diff --name-only; git -C source ls-files --others --exclude-standard; } | sort -u)
          test "$ACTUAL" = "$EXPECTED"

      - name: Run focused dependency and semantic regressions
        env:
          PYTHONPATH: source/services/agent-service/src
        run: >-
          source/services/agent-service/.venv/bin/python -B -m pytest -q
          source/services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py
          source/services/agent-service/tests/runtime/test_wp08_attempt6_alignment_normalization.py
          source/skill-system/tests/test_semantic_dependency_repair_feedback.py
          source/services/agent-service/tests/runtime/test_requested_output_exactness_redeclaration_feedback.py

      - name: Run complete standard Python suites
        run: >-
          source/services/agent-service/.venv/bin/python -B
          source/scripts/run_python_test_suites.py source --mode standard
          --junit-dir "${RUNNER_TEMP}/release43-standard/junit"
          --coverage-dir "${RUNNER_TEMP}/release43-standard/coverage"

      - name: Verify architecture convergence
        run: >-
          source/services/agent-service/.venv/bin/python -B
          source/scripts/verify_architecture.py

      - name: Commit product repair and regressions
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            .github/release-trigger \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py
          git diff --cached --check
          git commit -m 'Keep machine-grounded dependency mismatch repairable'
          git rev-parse HEAD > ../product-sha.txt

      - name: Refresh protected baseline for exact source changes
        run: |
          set -euo pipefail
          PRODUCT_SHA=$(cat product-sha.txt)
          "${pythonLocation}/bin/python" -B \
            control/scripts/tmp_release43_dependency_grounding_repair.py \
            baseline --workspace source --product-sha "$PRODUCT_SHA"

      - name: Run complete Skill control plane
        run: >-
          source/services/agent-service/.venv/bin/python -B
          source/skill-system/controller/profile_runner.py skill-control-plane

      - name: Bind baseline and publish formal repair branch
        working-directory: source
        env:
          FORMAL_BRANCH: fix/semantic-dependency-mismatch-repairable-20260815
        run: |
          set -euo pipefail
          git add skill-system/registry/product-source-baseline.json
          test "$(git diff --cached --name-only)" = "skill-system/registry/product-source-baseline.json"
          git diff --cached --check
          git commit -m 'Bind dependency-grounding repair to protected source baseline'
          test -z "$(git status --porcelain)"
          FINAL=$(git diff --name-only fb3bdfceb02f265ee0e2eaa670cc4c7445b76e3e..HEAD | sort)
          EXPECTED=$(printf '%s\n' \
            .github/release-trigger \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py \
            skill-system/registry/product-source-baseline.json | sort)
          test "$FINAL" = "$EXPECTED"
          git push origin "HEAD:refs/heads/${FORMAL_BRANCH}"
