name: Dispatch Production 509998a

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/dispatch-production-509998a.yml

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EXPECTED_MAIN_SHA: 509998a89d419ef41886f151f2571ea107cacb58
    steps:
      - name: Dispatch exact protected main production certification
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected_sha = os.environ["EXPECTED_MAIN_SHA"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "bounded-pr-production-dispatch",
          }

          def request(method: str, url: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  return exc.code, body

          def comment(body: str) -> None:
              status, response = request(
                  "POST",
                  f"{api}/issues/7/comments",
                  {"body": body},
              )
              if status != 201:
                  print(f"warning: failed to comment: HTTP {status}: {response}")

          status, ref_payload = request("GET", f"{api}/git/ref/heads/main")
          if status != 200 or not isinstance(ref_payload, dict):
              comment(f"BOUNDED_PRODUCTION_DISPATCH_FAILED expected_main_sha=`{expected_sha}` reason=main_ref_unavailable")
              raise SystemExit(f"failed to resolve main ref: HTTP {status}")
          current_main = str(((ref_payload.get("object") or {}).get("sha") or ""))
          if current_main != expected_sha:
              comment(
                  "BOUNDED_PRODUCTION_DISPATCH_REJECTED\n\n"
                  f"- expected_main_sha: `{expected_sha}`\n"
                  f"- current_main_sha: `{current_main}`\n"
                  "- reason: main moved before dispatch"
              )
              raise SystemExit("main moved before dispatch")

          status, body = request(
              "POST",
              f"{api}/actions/workflows/release.yml/dispatches",
              {
                  "ref": "main",
                  "inputs": {
                      "provider": "deepseek",
                      "model": "deepseek-v4-flash",
                      "embedding_model": "text-embedding-v4",
                      "embedding_dimension": "1024",
                  },
              },
          )
          if status != 204:
              comment(
                  "BOUNDED_PRODUCTION_DISPATCH_FAILED\n\n"
                  f"- main_sha: `{current_main}`\n"
                  f"- workflow_dispatch_http_status: `{status}`"
              )
              raise SystemExit(f"dispatch failed: HTTP {status}: {body}")

          run = None
          for _ in range(90):
              query = urllib.parse.urlencode({
                  "event": "workflow_dispatch",
                  "branch": "main",
                  "per_page": 20,
              })
              status, payload = request(
                  "GET",
                  f"{api}/actions/workflows/release.yml/runs?{query}",
              )
              if status == 200 and isinstance(payload, dict):
                  for candidate in payload.get("workflow_runs") or []:
                      if str(candidate.get("head_sha") or "") == current_main:
                          run = candidate
                          break
              if run is not None:
                  break
              time.sleep(2)

          if run is None:
              comment(
                  "BOUNDED_PRODUCTION_DISPATCH_PENDING\n\n"
                  f"- main_sha: `{current_main}`\n"
                  "- dispatch accepted, matching Run ID not observed before timeout"
              )
              raise SystemExit("dispatch accepted but run was not observed")

          run_id = int(run["id"])
          run_url = str(run.get("html_url") or f"https://github.com/{repo}/actions/runs/{run_id}")
          comment(
              "BOUNDED_PRODUCTION_DISPATCH_SUCCESS\n\n"
              f"- certified_main_sha: `{current_main}`\n"
              f"- production_run_id: `{run_id}`\n"
              f"- run: {run_url}"
          )
          print(json.dumps({
              "status": "DISPATCHED",
              "main_sha": current_main,
              "run_id": run_id,
              "run_url": run_url,
          }))
          PY
