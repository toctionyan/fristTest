name: One-shot semantic dependency repair

on:
  push:
    branches:
      - repair-semantic-dependency-20260810

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  repair:
    if: github.event.head_commit.message != 'Repair semantic dependency redeclaration feedback'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Apply grounded semantic dependency repair
        run: |
          python -B - <<'PY'
          from pathlib import Path

          goal_path = Path('services/agent-service/src/agent_core/lifecycle/goal_planning.py')
          text = goal_path.read_text(encoding='utf-8')
          helper_anchor = '\n\ndef _granularity_repair_feedback(granularity: Any) -> dict[str, Any]:\n'
          if helper_anchor not in text:
              raise SystemExit('granularity helper anchor not found')
          if 'def _alignment_repair_feedback(' in text:
              raise SystemExit('alignment repair helper already exists')
          helper = '''\n\ndef _alignment_repair_feedback(alignment: GoalAlignmentVerdict) -> dict[str, Any]:
    """Expose only machine-grounded independent dependency repair evidence.

    Runtime never rewrites the candidate graph.  The feedback is emitted only
    when the independent verifier completed its dependency proof and proved the
    candidate graph different.  A later Planner call may redeclare against this
    bounded evidence; requested effects and Goal inventory remain model-owned.
    """
    if (
        alignment.verdict != "incomplete"
        or alignment.reason_code != "goal_alignment_dependency_graph_mismatch"
        or not alignment.independent
    ):
        return {}
    details = alignment.details if isinstance(alignment.details, dict) else {}
    if not (
        details.get("dependency_authority") == "independent_goal_alignment"
        and details.get("dependency_proof_complete") is True
        and details.get("dependency_graph_match") is False
    ):
        return {}

    verified_edges: list[dict[str, str]] = []
    for raw in list(details.get("dependency_edges") or []):
        if not isinstance(raw, dict):
            return {}
        dependent = _clean_text(raw.get("dependent_goal_id"), limit=80)
        prerequisite = _clean_text(raw.get("requires_result_of_goal_id"), limit=80)
        basis_kind = _clean_text(raw.get("basis_kind"), limit=80).lower()
        basis_span = _clean_text(raw.get("basis_span"), limit=240)
        if (
            not dependent
            or not prerequisite
            or basis_kind not in _ALLOWED_ALIGNMENT_DEPENDENCY_BASIS_KINDS
            or not basis_span
        ):
            return {}
        verified_edges.append({
            "dependent_goal_id": dependent,
            "requires_result_of_goal_id": prerequisite,
            "basis_kind": basis_kind,
            "basis_span": basis_span,
        })

    declared_edges: list[dict[str, str]] = []
    for raw in list(details.get("declared_dependency_edges") or []):
        if not isinstance(raw, dict):
            return {}
        dependent = _clean_text(raw.get("dependent_goal_id"), limit=80)
        prerequisite = _clean_text(raw.get("requires_result_of_goal_id"), limit=80)
        if not dependent or not prerequisite:
            return {}
        declared_edges.append({
            "dependent_goal_id": dependent,
            "requires_result_of_goal_id": prerequisite,
        })

    return {
        "independent_verifier_feedback": {
            "authority": "independent_goal_alignment",
            "required_action": "redeclaration_preserving_grounded_dependency_graph",
            "dependency_edges": verified_edges,
            "candidate_declared_dependency_edges": declared_edges,
            "constraints": [
                "change_only_the_dependency_relation_proved_by_this_feedback",
                "preserve_goal_inventory_requested_effects_and_literal_evidence_spans",
                "do_not_infer_tool_order_or_capability_prerequisites_as_goal_dependencies",
                "an_empty_verified_dependency_graph_requires_removing_unproved_candidate_edges",
                "runtime_does_not_auto_rewrite_the_candidate",
            ],
        }
    }
'''
          text = text.replace(helper_anchor, helper + helper_anchor, 1)

          old_alignment = '            "data": {"alignment_proof": alignment.as_dict(), **_goal_declaration_repair_context(user_text)},\n'
          new_alignment = '''            "data": {
                "alignment_proof": alignment.as_dict(),
                **_alignment_repair_feedback(alignment),
                **_goal_declaration_repair_context(user_text),
            },
'''
          if text.count(old_alignment) != 1:
              raise SystemExit(f'alignment rejection anchor count={text.count(old_alignment)}')
          text = text.replace(old_alignment, new_alignment, 1)
          goal_path.write_text(text, encoding='utf-8')

          dialogue_path = Path('services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py')
          dialogue = dialogue_path.read_text(encoding='utf-8')
          old_rule = 'goal_type 只在旧能力合同确实需要时作为兼容提示，不是正式语义。'
          new_rule = old_rule + '若上一轮 declare_turn_goals 返回 independent_verifier_feedback，只按其中机器证明的 dependency_edges 修正 depends_on；空 dependency_edges 表示删除未被证明的候选依赖。不得借此新增/删除 Goal、改写 requested_effect、修改字面 evidence_span，Runtime 也不会替你自动改图。'
          if dialogue.count(old_rule) != 1:
              raise SystemExit(f'planning rule anchor count={dialogue.count(old_rule)}')
          dialogue = dialogue.replace(old_rule, new_rule, 1)
          dialogue_path.write_text(dialogue, encoding='utf-8')

          test_path = Path('services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py')
          tests = test_path.read_text(encoding='utf-8')
          old_import = '''from agent_core.lifecycle.goal_planning import (
    ModelGoalAlignmentVerifier,
    _model_alignment_dependency_proof,
)
'''
          new_import = '''from agent_core.lifecycle.goal_planning import (
    GoalAlignmentVerdict,
    ModelGoalAlignmentVerifier,
    _model_alignment_dependency_proof,
    validate_goal_declaration,
)
'''
          if tests.count(old_import) != 1:
              raise SystemExit(f'test import anchor count={tests.count(old_import)}')
          tests = tests.replace(old_import, new_import, 1)
          marker = 'def test_missing_true_dependency_returns_grounded_redeclaration_feedback() -> None:'
          if marker in tests:
              raise SystemExit('repair tests already exist')
          tests += r'''


def _declared_goal(goal_id: str, span: str, depends_on: list[str]) -> dict:
    operation = "order.list" if goal_id == "g1" else "refund.assess_eligibility"
    cardinality = "collection" if goal_id == "g1" else "single"
    return {
        "goal_id": goal_id,
        "description": span,
        "evidence_span": span,
        "requested_effect": {
            "domain": "ecommerce",
            "operation": operation,
            "object_type": "order",
            "raw_description": span,
        },
        "expected_result_cardinality": cardinality,
        "required": True,
        "depends_on": list(depends_on),
    }


class _InjectedAlignmentVerifier:
    def __init__(self, verdict: GoalAlignmentVerdict):
        self.verdict = verdict

    def verify(self, *, user_text: str, goals: list[dict], known_tools: set[str]):
        del user_text, goals, known_tools
        return self.verdict


def _validate_with_dependency_verdict(text: str, goals: list[dict], verdict: GoalAlignmentVerdict):
    return validate_goal_declaration(
        state={
            "current_user_input": text,
            "turn_index": 1,
            "goal_records": [],
            "artifact_ledger": [],
            "goal_alignment_verifier": _InjectedAlignmentVerifier(verdict),
        },
        args={"summary": text, "goals": goals},
        capability_registry=None,
    )


def test_missing_true_dependency_returns_grounded_redeclaration_feedback() -> None:
    text = "查一下键盘订单，再看看它能不能退款"
    candidate = [
        _declared_goal("g1", "查一下键盘订单", []),
        _declared_goal("g2", "再看看它能不能退款", []),
    ]
    proof_goals = [_goal("g1", "查一下键盘订单", []), _goal("g2", "再看看它能不能退款", [])]
    edge = {
        "dependent_goal_id": "g2",
        "requires_result_of_goal_id": "g1",
        "basis_kind": "result_reference",
        "basis_span": "它",
    }
    details, error = _model_alignment_dependency_proof(
        user_text=text,
        goals=proof_goals,
        values=[edge],
    )
    assert error == "goal_alignment_dependency_graph_mismatch"
    verdict = GoalAlignmentVerdict(
        "incomplete",
        ("查一下键盘订单", "再看看它能不能退款"),
        (),
        "goal_alignment_dependency_graph_mismatch",
        "injected",
        True,
        details,
    )

    result, plan = _validate_with_dependency_verdict(text, candidate, verdict)

    assert plan is None
    assert result["code"] == "GOAL_DECLARATION_INCOMPLETE"
    feedback = result["data"]["independent_verifier_feedback"]
    assert feedback["authority"] == "independent_goal_alignment"
    assert feedback["required_action"] == "redeclaration_preserving_grounded_dependency_graph"
    assert feedback["dependency_edges"] == [edge]
    assert feedback["candidate_declared_dependency_edges"] == []
    assert candidate[1]["depends_on"] == []


def test_false_declared_dependency_returns_empty_verified_graph_without_blanket_dependency() -> None:
    text = "查一下鼠标订单，然后帮我申请退款"
    candidate = [
        _declared_goal("g1", "查一下鼠标订单", []),
        _declared_goal("g2", "帮我申请退款", ["g1"]),
    ]
    proof_goals = [_goal("g1", "查一下鼠标订单", []), _goal("g2", "帮我申请退款", ["g1"])]
    details, error = _model_alignment_dependency_proof(
        user_text=text,
        goals=proof_goals,
        values=[],
    )
    assert error == "goal_alignment_dependency_graph_mismatch"
    verdict = GoalAlignmentVerdict(
        "incomplete",
        ("查一下鼠标订单", "帮我申请退款"),
        (),
        "goal_alignment_dependency_graph_mismatch",
        "injected",
        True,
        details,
    )

    result, plan = _validate_with_dependency_verdict(text, candidate, verdict)

    assert plan is None
    assert result["code"] == "GOAL_DECLARATION_INCOMPLETE"
    feedback = result["data"]["independent_verifier_feedback"]
    assert feedback["dependency_edges"] == []
    assert feedback["candidate_declared_dependency_edges"] == [
        {"dependent_goal_id": "g2", "requires_result_of_goal_id": "g1"}
    ]
    assert candidate[1]["depends_on"] == ["g1"]


def test_dependency_feedback_fails_closed_without_complete_independent_proof() -> None:
    text = "查一下键盘订单，再看看它能不能退款"
    candidate = [
        _declared_goal("g1", "查一下键盘订单", []),
        _declared_goal("g2", "再看看它能不能退款", []),
    ]
    verdict = GoalAlignmentVerdict(
        "incomplete",
        ("查一下键盘订单", "再看看它能不能退款"),
        (),
        "goal_alignment_dependency_graph_mismatch",
        "injected",
        True,
        {
            "dependency_authority": "independent_goal_alignment",
            "dependency_proof_complete": False,
            "dependency_graph_match": False,
            "dependency_edges": [],
            "declared_dependency_edges": [],
        },
    )

    result, plan = _validate_with_dependency_verdict(text, candidate, verdict)

    assert plan is None
    assert result["code"] == "GOAL_ALIGNMENT_UNVERIFIED"
    assert "independent_verifier_feedback" not in result["data"]
'''
          test_path.write_text(tests, encoding='utf-8')
          PY
      - name: Regenerate protected source baseline
        run: |
          python -B - <<'PY'
          import datetime
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          roots = [str(value) for value in payload.get('protected_roots') or ()]
          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', *roots], cwd=root)
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          files = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          payload['generated_from'] = 'git:' + subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], cwd=root, text=True
          ).strip()
          payload['generated_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          payload['file_count'] = len(files)
          payload['files'] = files
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
      - name: Install locked test environment
        run: |
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups
      - name: Run focused semantic dependency regressions
        run: |
          services/agent-service/.venv/bin/python -B -m pytest -q \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py \
            services/agent-service/tests/runtime/test_wp08_attempt6_alignment_normalization.py \
            services/agent-service/tests/runtime/test_goal_granularity_and_conditions.py \
            services/agent-service/tests/runtime/test_unified_semantic_planning_contract.py
          services/agent-service/.venv/bin/python -B -m unittest discover -s skill-system/tests -p 'test_product_source_baseline_binding.py'
      - name: Commit repair and remove carrier
        run: |
          rm .github/workflows/repair-semantic-dependency-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/agent-service/src/agent_core/lifecycle/goal_planning.py \
                  services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py \
                  services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py \
                  skill-system/registry/product-source-baseline.json \
                  .github/workflows/repair-semantic-dependency-once.yml
          git commit -m 'Repair semantic dependency redeclaration feedback'
          git push origin HEAD:repair-semantic-dependency-20260810
