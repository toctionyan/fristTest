name: Release55 Governed Closure

on:
  push:
    branches:
      - repair/release55-dependency-output-role-overlap-20260816
    paths:
      - .github/release55-governed-closure.trigger

permissions:
  contents: write

jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact preclosure candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Bootstrap locked Agent environment
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups

      - name: Retire closure carrier from governed worktree
        run: |
          set -euo pipefail
          git rm .github/workflows/release55-governed-closure.yml \
                 .github/release55-governed-closure.trigger

      - name: Reproduce current-trust Release 55 RED baseline then restore candidate
        env:
          BASE_SHA: b1ab036566f17d7ea52acafd23523d1420460bae
        run: |
          set -uo pipefail
          change='repair-release55-dependency-output-role-overlap'
          case="governance/repair-cases/${change}"
          target="governance/targets/${change}.md"
          baseline='.quality/release55-contract-baseline'
          baseline_state='.quality/release55-contract-baseline-state'
          source='services/agent-service/src/agent_core/lifecycle/goal_planning.py'
          test_file='services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py'

          git checkout "$BASE_SHA" -- "$source"
          rm -f "$test_file"
          rm -rf "$baseline" "$baseline_state"
          export PYTHONPATH="$GITHUB_WORKSPACE/services/agent-service/src:$GITHUB_WORKSPACE/services/agent-service"

          set +e
          services/agent-service/.venv/bin/python -B scripts/quality_loop.py \
            --workspace-root . \
            --mode quick \
            --target "$target" \
            --policy "$case/quality-input/focused-policy.json" \
            --evidence-dir "$baseline" \
            --state-dir "$baseline_state" \
            --baseline \
            2>&1 | tee "${RUNNER_TEMP}/release55-closure-baseline.log"
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0

          services/agent-service/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('.quality/release55-contract-baseline/run-summary.json').read_text())
          assert summary['run_kind'] == 'baseline', summary
          assert summary['decision'] == 'FAIL', summary
          assert summary['loop_status'] == 'BASELINE_RECORDED', summary
          assert summary['claim_results'][0]['id'] == 'RELEASE55.DEPENDENCY_OUTPUT_ROLE_OVERLAP', summary
          assert summary['claim_results'][0]['status'] == 'FAILED', summary
          gate = summary['results'][0]
          assert gate['id'] == 'release55-role-overlap-counterexample' and gate['status'] == 'FAIL', gate
          combined = str(gate.get('stdout') or '') + str(gate.get('stderr') or '')
          assert 'goal_alignment_dependency_basis_is_requested_output:0' in combined, combined
          assert 'ModuleNotFoundError' not in combined, combined
          PY

          git checkout "$GITHUB_SHA" -- "$source" "$test_file"

      - name: Produce current-trust focused GREEN verification
        run: |
          set -euo pipefail
          change='repair-release55-dependency-output-role-overlap'
          case="governance/repair-cases/${change}"
          target="governance/targets/${change}.md"
          verification='.quality/release55-contract-verification'
          state='.quality/release55-contract-verification-state'
          rm -rf "$verification" "$state"
          export PYTHONPATH="$GITHUB_WORKSPACE/services/agent-service/src:$GITHUB_WORKSPACE/services/agent-service"

          services/agent-service/.venv/bin/python -B -m pytest -q \
            services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py \
            services/agent-service/tests/runtime/test_wp08_attempt7_final_authority_and_retry.py \
            services/agent-service/tests/runtime/test_dependency_obligation_evidence_pipeline.py \
            services/agent-service/tests/runtime/test_dependency_alignment_authority.py \
            services/agent-service/tests/runtime/test_dependency_proof_authority.py \
            services/agent-service/tests/runtime/test_release47_dependency_repair_projection.py \
            services/agent-service/tests/runtime/test_release52_dependency_independence_adjudication.py \
            services/agent-service/tests/runtime/test_release53_blind_semantic_grounding_adjudication.py \
            skill-system/tests/test_semantic_dependency_repair_feedback.py \
            2>&1 | tee "${RUNNER_TEMP}/release55-closure-focused-tests.log"

          services/agent-service/.venv/bin/python -B scripts/quality_loop.py \
            --workspace-root . \
            --mode quick \
            --target "$target" \
            --policy "$case/quality-input/focused-policy.json" \
            --baseline-evidence '.quality/release55-contract-baseline' \
            --evidence-dir "$verification" \
            --state-dir "$state" \
            2>&1 | tee "${RUNNER_TEMP}/release55-closure-verification.log"

          services/agent-service/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          summary = json.loads(Path('.quality/release55-contract-verification/run-summary.json').read_text())
          assert summary['run_kind'] == 'verification', summary
          assert summary['decision'] == 'PASS', summary
          assert summary['loop_status'] == 'CONVERGED', summary
          assert summary['completion_eligible'] is True, summary
          assert summary['claim_results'][0]['id'] == 'RELEASE55.DEPENDENCY_OUTPUT_ROLE_OVERLAP', summary
          assert summary['claim_results'][0]['status'] == 'VERIFIED', summary
          gate = summary['results'][0]
          assert gate['id'] == 'release55-role-overlap-counterexample' and gate['status'] == 'PASS', gate
          observed = gate.get('metadata', {}).get('structured_assessment') or {}
          assert observed.get('error') == 'goal_alignment_dependency_graph_mismatch', observed
          edges = observed.get('details', {}).get('dependency_edges') or observed.get('dependency_edges') or []
          assert len(edges) == 1, observed
          assert edges[0].get('basis_span') == '它', observed
          assert edges[0].get('dependent_goal_id') == 'g2', observed
          assert edges[0].get('requires_result_of_goal_id') == 'g1', observed
          PY

          services/agent-service/.venv/bin/python -B \
            skill-system/controller/product_quality_bridge.py record \
            --evidence '.quality/release55-contract-verification' \
            --mode quick

      - name: Run repository-native diff review and independent review attestations
        run: |
          set -euo pipefail
          evidence='governance/repair-cases/repair-release55-dependency-output-role-overlap/clean-verification-record.json'
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/repair_governance_cli.py diff-review --decision PASS
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/change_contract_cli.py attest-review \
            --role scope-planner --decision PASS --evidence "$evidence"
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/change_contract_cli.py attest-review \
            --role adversarial-reviewer --decision PASS --evidence "$evidence"

      - name: Create repository-native closure matrix
        run: |
          set -euo pipefail
          case='governance/repair-cases/repair-release55-dependency-output-role-overlap'
          clean="$case/clean-verification-record.json"
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/repair_governance_cli.py closure-record \
            --result CONVERGED \
            --loop-outcome CONVERGED \
            --evidence "original_failure=$case/evidence/release55-protected-failure.md" \
            --evidence "focused_tests=$clean" \
            --evidence "counterexamples=services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py" \
            --evidence "regression=services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py" \
            --evidence "negative_paths=services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py" \
            --evidence "runtime_trace=$clean" \
            --evidence "authority_boundary=$clean" \
            --evidence "diff_review=$case/diff-review.json"

      - name: Verify and close Change Contract
        run: |
          set -euo pipefail
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/repair_governance_cli.py validate \
            --stage verification --result CONVERGED
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/change_contract_cli.py verify --result CONVERGED \
            2>&1 | tee "${RUNNER_TEMP}/release55-contract-verify.log"
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/change_contract_cli.py close --result CONVERGED \
            2>&1 | tee "${RUNNER_TEMP}/release55-contract-close.log"
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/repair_governance_cli.py validate \
            --stage verification --result CONVERGED

      - name: Freeze closure evidence
        if: always()
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/release55-governed-closure"
          case='governance/repair-cases/repair-release55-dependency-output-role-overlap'
          rm -rf "$out"
          mkdir -p "$out"
          cp "${RUNNER_TEMP}/release55-closure-baseline.log" "$out/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/release55-closure-focused-tests.log" "$out/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/release55-closure-verification.log" "$out/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/release55-contract-verify.log" "$out/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/release55-contract-close.log" "$out/" 2>/dev/null || true
          cp "$case/diff-review.json" "$out/" 2>/dev/null || true
          cp "$case/closure-matrix.json" "$out/" 2>/dev/null || true
          cp governance/active-change.json "$out/active-change.json" 2>/dev/null || true
          cp -R .quality/release55-contract-baseline "$out/current-trust-baseline" 2>/dev/null || true
          cp -R .quality/release55-contract-verification "$out/current-trust-verification" 2>/dev/null || true
          cp -R .quality/product-control-plane "$out/product-control-plane" 2>/dev/null || true
          git status --short > "$out/worktree-status.txt"
          git diff --check > "$out/diff-check.txt"

      - name: Upload governed closure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release55-governed-closure
          path: ${{ runner.temp }}/release55-governed-closure
          if-no-files-found: error
          retention-days: 30

      - name: Publish closure records and retire carrier
        run: |
          set -euo pipefail
          case='governance/repair-cases/repair-release55-dependency-output-role-overlap'
          test "$(services/agent-service/.venv/bin/python - <<'PY'
          import json
          print(json.load(open('governance/active-change.json'))['status'])
          PY
          )" = 'closed'
          test "$(services/agent-service/.venv/bin/python - <<'PY'
          import json
          print(json.load(open('governance/active-change.json'))['result'])
          PY
          )" = 'CONVERGED'
          git diff --check
          git add governance/active-change.json "$case/diff-review.json" "$case/closure-matrix.json"
          git add -u -- .github/workflows/release55-governed-closure.yml .github/release55-governed-closure.trigger
          staged="$(git diff --cached --name-only)"
          printf '%s\n' "$staged"
          test -n "$staged"
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git commit -m 'Close Release 55 dependency output-role repair'
          git push origin HEAD:repair/release55-dependency-output-role-overlap-20260816
