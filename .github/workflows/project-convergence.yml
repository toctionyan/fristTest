name: project-convergence

on:
  workflow_run:
    workflows:
      - quality
    types: [completed]
  workflow_dispatch:
    inputs:
      quality_run_id:
        description: Exact completed Quality run ID to assess
        required: true
        type: string
      quality_run_attempt:
        description: Exact Quality run attempt
        required: false
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: project-convergence-${{ github.event.workflow_run.id || inputs.quality_run_id }}-${{ github.event.workflow_run.run_attempt || inputs.quality_run_attempt }}
  cancel-in-progress: false

jobs:
  assess:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted project convergence control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Resolve exact Quality attempt and cumulative assessment artifacts
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          DISPATCH_RUN_ID: ${{ inputs.quality_run_id }}
          DISPATCH_RUN_ATTEMPT: ${{ inputs.quality_run_attempt }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            quality_run_id="${EVENT_RUN_ID}"
            quality_run_attempt="${EVENT_RUN_ATTEMPT}"
          else
            quality_run_id="${DISPATCH_RUN_ID}"
            quality_run_attempt="${DISPATCH_RUN_ATTEMPT}"
          fi
          [[ "${quality_run_id}" =~ ^[1-9][0-9]*$ ]]
          [[ "${quality_run_attempt}" =~ ^[1-9][0-9]*$ ]]

          mkdir -p incoming
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${quality_run_id}" > incoming/run.json
          jq -e --arg attempt "${quality_run_attempt}" '
            .name == "quality"
            and .path == ".github/workflows/quality.yml"
            and .status == "completed"
            and ((.run_attempt | tostring) == $attempt)
          ' incoming/run.json >/dev/null
          run_started_at=$(jq -r '.run_started_at // empty' incoming/run.json)
          source_event=$(jq -r '.event // empty' incoming/run.json)
          source_head_sha=$(jq -r '.head_sha // empty' incoming/run.json)
          [[ -n "${run_started_at}" ]]
          [[ "${source_head_sha}" =~ ^[0-9a-f]{40}$ ]]

          source_base_sha=""
          source_pr_head_sha=""
          if [[ "${source_event}" == "pull_request" ]]; then
            jq -e '(.pull_requests | type == "array") and (.pull_requests | length == 1)' incoming/run.json >/dev/null
            source_base_sha=$(jq -r '.pull_requests[0].base.sha // empty' incoming/run.json)
            source_pr_head_sha=$(jq -r '.pull_requests[0].head.sha // empty' incoming/run.json)
            [[ "${source_base_sha}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${source_pr_head_sha}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${source_head_sha}" == "${source_pr_head_sha}" ]]
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${quality_run_id}/attempts/${quality_run_attempt}/jobs?per_page=100" \
            > incoming/jobs.json
          quick_conclusion=$(jq -r '[.jobs[] | select(.name == "quality-quick")][0].conclusion // "missing"' incoming/jobs.json)
          [[ "${quick_conclusion}" != "missing" && "${quick_conclusion}" != "skipped" ]]
          integration_conclusion=$(jq -r '[.jobs[] | select(.name == "quality-integration")][0].conclusion // "missing"' incoming/jobs.json)
          if [[ "${integration_conclusion}" != "missing" && "${integration_conclusion}" != "skipped" ]]; then
            expected_profile="project-integration"
          else
            expected_profile="project-quick"
          fi

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${quality_run_id}/artifacts?per_page=100" \
            > incoming/artifacts.json
          select_artifact() {
            local name="$1"
            jq -r --arg started "${run_started_at}" --arg name "${name}" '[.artifacts[]
              | select(.expired == false)
              | select(.name == $name)
              | select(.created_at >= $started)]
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty' incoming/artifacts.json
          }

          quick_artifact_id=$(select_artifact "quality-quick-evidence")
          [[ "${quick_artifact_id}" =~ ^[1-9][0-9]*$ ]]
          integration_artifact_id=""
          if [[ "${expected_profile}" == "project-integration" ]]; then
            integration_artifact_id=$(select_artifact "quality-integration-evidence")
            [[ "${integration_artifact_id}" =~ ^[1-9][0-9]*$ ]]
          fi

          echo "quality_run_id=${quality_run_id}" >> "$GITHUB_OUTPUT"
          echo "quality_run_attempt=${quality_run_attempt}" >> "$GITHUB_OUTPUT"
          echo "source_event=${source_event}" >> "$GITHUB_OUTPUT"
          echo "source_head_sha=${source_head_sha}" >> "$GITHUB_OUTPUT"
          echo "source_base_sha=${source_base_sha}" >> "$GITHUB_OUTPUT"
          echo "source_pr_head_sha=${source_pr_head_sha}" >> "$GITHUB_OUTPUT"
          echo "quick_artifact_id=${quick_artifact_id}" >> "$GITHUB_OUTPUT"
          echo "integration_artifact_id=${integration_artifact_id}" >> "$GITHUB_OUTPUT"
          echo "expected_profile=${expected_profile}" >> "$GITHUB_OUTPUT"

      - name: Download exact Quick evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.quick_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p incoming/quality/quick
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > incoming/quick.zip
          unzip -q incoming/quick.zip -d incoming/quality/quick

      - name: Download exact Integration evidence artifact
        if: steps.source.outputs.integration_artifact_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.source.outputs.integration_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p incoming/quality/integration
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" > incoming/integration.zip
          unzip -q incoming/integration.zip -d incoming/quality/integration

      - name: Bind convergence to the exact tested Quality snapshot
        id: tested-ref
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_EVENT: ${{ steps.source.outputs.source_event }}
          SOURCE_HEAD_SHA: ${{ steps.source.outputs.source_head_sha }}
          SOURCE_BASE_SHA: ${{ steps.source.outputs.source_base_sha }}
          SOURCE_PR_HEAD_SHA: ${{ steps.source.outputs.source_pr_head_sha }}
        run: |
          set -euo pipefail
          quick_summary=$(find incoming/quality/quick -type f -name run-summary.json -print -quit 2>/dev/null || true)
          [[ -n "${quick_summary}" ]]
          tested_ref=$(jq -r '.target_identity.change_ref // empty' "${quick_summary}")
          [[ "${tested_ref}" =~ ^[0-9a-f]{40}$ ]]

          if [[ "${SOURCE_EVENT}" == "pull_request" ]]; then
            [[ "${SOURCE_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${SOURCE_PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
            [[ "${SOURCE_HEAD_SHA}" == "${SOURCE_PR_HEAD_SHA}" ]]
            gh api "repos/${GITHUB_REPOSITORY}/git/commits/${tested_ref}" > incoming/tested-commit.json
            jq -e --arg base "${SOURCE_BASE_SHA}" --arg head "${SOURCE_PR_HEAD_SHA}" '
              (.parents | type == "array")
              and (.parents | length == 2)
              and (.parents[0].sha == $base)
              and (.parents[1].sha == $head)
            ' incoming/tested-commit.json >/dev/null
          else
            [[ "${tested_ref}" == "${SOURCE_HEAD_SHA}" ]]
          fi

          echo "expected_ref=${tested_ref}" >> "$GITHUB_OUTPUT"

      - name: Assess cumulative project requirements without source mutation
        env:
          EXPECTED_PROFILE: ${{ steps.source.outputs.expected_profile }}
          EXPECTED_REF: ${{ steps.tested-ref.outputs.expected_ref }}
        run: |
          set -euo pipefail
          quick_summary=$(find incoming/quality/quick -type f -name run-summary.json -print -quit 2>/dev/null || true)
          requirements=$(find incoming/quality/quick -type f -name requirement-catalog.json -print -quit 2>/dev/null || true)
          [[ -n "${quick_summary}" && -n "${requirements}" ]]
          [[ "$(jq -r '.requirement_profile // empty' "${quick_summary}")" == "project-quick" ]]
          [[ "${EXPECTED_REF}" =~ ^[0-9a-f]{40}$ ]]

          args=(
            --summary "${quick_summary}"
            --requirements "${requirements}"
            --profile "${EXPECTED_PROFILE}"
            --expected-ref "${EXPECTED_REF}"
            --output-dir project-convergence-evidence
            --enforce
          )
          if [[ "${EXPECTED_PROFILE}" == "project-integration" ]]; then
            integration_summary=$(find incoming/quality/integration -type f -name run-summary.json -print -quit 2>/dev/null || true)
            integration_requirements=$(find incoming/quality/integration -type f -name requirement-catalog.json -print -quit 2>/dev/null || true)
            [[ -n "${integration_summary}" && -n "${integration_requirements}" ]]
            [[ "$(jq -r '.requirement_profile // empty' "${integration_summary}")" == "project-integration" ]]
            cmp -s "${requirements}" "${integration_requirements}"
            args+=(--summary "${integration_summary}")
          fi

          mkdir -p project-convergence-evidence
          "${pythonLocation}/bin/python" -B control/scripts/project_convergence_controller.py "${args[@]}"

      - name: Upload project convergence evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: project-convergence-${{ steps.source.outputs.quality_run_id }}-${{ steps.source.outputs.quality_run_attempt }}
          path: project-convergence-evidence
          retention-days: 30
          if-no-files-found: warn
