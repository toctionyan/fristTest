name: wp08-attempt4-formal-quick-fix-carrier

"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wp08-attempt4-formal-quick-fix-carrier.yml
      - scripts/tmp_wp08_attempt4_formal_quick_fix.py

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout carrier controls
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout exact red formal head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: e6f3bd83a35a51f565654f863feb680fd799b62b
          path: source
          fetch-depth: 0
          clean: true
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r source/deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked environments
        run: |
          cd source/services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups
          cd ../agent-service/frontend && npm ci --ignore-scripts=false
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Apply exact quick-suite compatibility correction
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B control/scripts/tmp_wp08_attempt4_formal_quick_fix.py source
          git -C source diff --check
          EXPECTED=$(printf '%s\n' \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py \
            skill-system/registry/product-source-baseline.json | sort)
          ACTUAL=$(git -C source diff --name-only | sort)
          test "$ACTUAL" = "$EXPECTED"
      - name: Run exact previously failing tests and preserved focused regressions
        run: >-
          source/services/agent-service/.venv/bin/python -B -m pytest -q
          source/services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py
          source/skill-system/tests/test_wp08_attempt4_dependency_reference_repair.py
          source/services/agent-service/tests/runtime/test_wp08_attempt7_final_authority_and_retry.py
          source/skill-system/tests/test_wp08_attempt3_verifier_stability_repair.py
          source/skill-system/tests/test_wp08_attempt2_semantic_boundary_repair.py
      - name: Commit corrected formal candidate
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m 'Align dependency authority regressions with adversarial audit'
      - name: Run complete Skill control plane
        run: source/services/agent-service/.venv/bin/python -B source/skill-system/controller/profile_runner.py skill-control-plane
      - name: Run exact standard quick quality gate
        working-directory: source
        env:
          QUALITY_EVIDENCE_DIR: ${{ runner.temp }}/quality-evidence/quick
          QUALITY_TARGET: ${{ github.workspace }}/source/.quality/targets/attempt4-formal-quick.md
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B scripts/create_ci_quality_target.py \
            --output "$QUALITY_TARGET" --ref "$(git rev-parse HEAD)" --workflow quality-quick \
            --claims-source governance/claims/v20.6.2-project-quick-certification.json
          services/agent-service/.venv/bin/python -B scripts/quality_loop.py --mode quick --target "$QUALITY_TARGET"
      - name: Publish corrected formal branch
        working-directory: source
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:refs/heads/wp08-release-31474689970-attempt4-repair
