name: temporary-release52-dependency-repair

on:
  push:
    branches:
      - fix/release52-dependency-independence-adjudication-20260815
    paths:
      - .github/workflows/temporary-release52-dependency-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/release52-dependency-independence-adjudication-20260815
          fetch-depth: 0

      - name: Apply bounded source and regression patch
        run: python .github/temporary_release52_dependency_patch.py

      - name: Compile and diff-check patch
        run: |
          python -m py_compile services/agent-service/src/agent_core/lifecycle/goal_planning.py
          python -m py_compile services/agent-service/tests/runtime/test_release52_dependency_independence_adjudication.py
          git diff --check

      - name: Commit source and regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agent-service/src/agent_core/lifecycle/goal_planning.py
          git add services/agent-service/tests/runtime/test_release52_dependency_independence_adjudication.py
          if git diff --cached --quiet; then exit 1; fi
          git commit -m "fix(semantic): adversarially certify dependency absence"

      - name: Refresh protected source baseline
        run: |
          SOURCE_SHA="$(git rev-parse HEAD)"
          python scripts/refresh_product_source_baseline.py --workspace . --generated-from-sha "$SOURCE_SHA"

      - name: Remove temporary carrier and publish repair
        run: |
          git rm .github/workflows/temporary-release52-dependency-repair.yml
          git rm .github/temporary_release52_dependency_patch.py
          git add skill-system/registry/product-source-baseline.json
          git diff --check
          git commit -m "chore: bind Release #52 dependency repair baseline"
          git push origin HEAD:fix/release52-dependency-independence-adjudication-20260815
