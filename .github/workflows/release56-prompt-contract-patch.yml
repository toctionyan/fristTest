name: release56-prompt-contract-patch

on:
  push:
    branches:
      - repair/release56-dependency-verifier-nested-basis-contract-20260816
    paths:
      - .github/release56-prompt-contract-patch-trigger

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: repair/release56-dependency-verifier-nested-basis-contract-20260816
          fetch-depth: 0
      - name: Apply exact Release 56 prompt-contract repair
        shell: bash
        run: |
          python - <<'PY'
          import ast
          import json
          from pathlib import Path

          path = Path('services/agent-service/src/agent_core/lifecycle/goal_planning.py')
          text = path.read_text(encoding='utf-8')
          tree = ast.parse(text)

          marker_primary = 'must be disjoint from the dependent Goal requested_outputs evidence spans'
          marker_repair = 'if no disjoint relation-only basis exists'
          nodes = [
              node for node in ast.walk(tree)
              if isinstance(node, ast.Constant)
              and isinstance(node.value, str)
              and (marker_primary in node.value or marker_repair in node.value)
          ]
          primary = [node for node in nodes if marker_primary in node.value]
          repair = [node for node in nodes if marker_repair in node.value]
          if len(primary) != 1:
              raise SystemExit(f'expected exactly one primary stale prompt constant, found {len(primary)}')
          if len(repair) != 1:
              raise SystemExit(f'expected exactly one repair stale prompt constant, found {len(repair)}')

          replacements = []

          value = primary[0].value
          old_primary_clause = 'must be disjoint from the dependent Goal requested_outputs evidence spans'
          old_primary_tail = (
              'A basis inside requested-output evidence, or a broader phrase that wraps requested-output evidence with control/action wording, '
              'proves the requested outcome rather than a result dependency and must be rejected; use a relation-only literal basis when one exists, otherwise the pair is independent'
          )
          if old_primary_tail not in value:
              raise SystemExit('primary stale tail not found inside parsed prompt constant')
          value = value.replace(
              old_primary_clause,
              'must be relation-only, must not equal a requested-output evidence span, and must not wrap a requested-output evidence span with action/control wording',
              1,
          ).replace(
              old_primary_tail,
              'A strictly smaller relation-only literal basis nested inside a broader requested-output evidence span is admissible because the basis itself denotes only the result-reference, result-condition or result-value-input relation; use the smallest such literal basis when one exists, otherwise the pair is independent',
              1,
          )
          replacements.append((primary[0], value))

          value = repair[0].value
          old_repair_clause = (
              'The basis must not be requested-output evidence and must not wrap a requested-output evidence span with action/control wording; '
              'if no disjoint relation-only basis exists, return relation=independent.'
          )
          if old_repair_clause not in value:
              raise SystemExit('repair stale clause not found inside parsed prompt constant')
          value = value.replace(
              old_repair_clause,
              'The basis must be relation-only, must not equal a requested-output evidence span, and must not wrap a requested-output evidence span with action/control wording; '
              'a strictly smaller relation-only literal basis nested inside a broader requested-output evidence span is admissible. '
              'If no valid relation-only basis exists under those rules, return relation=independent.',
              1,
          )
          replacements.append((repair[0], value))

          lines = text.splitlines(keepends=True)
          offsets = [0]
          for line in lines:
              offsets.append(offsets[-1] + len(line))

          edits = []
          for node, new_value in replacements:
              start = offsets[node.lineno - 1] + node.col_offset
              end = offsets[node.end_lineno - 1] + node.end_col_offset
              edits.append((start, end, json.dumps(new_value, ensure_ascii=False)))
          for start, end, replacement in sorted(edits, reverse=True):
              text = text[:start] + replacement + text[end:]

          path.write_text(text, encoding='utf-8')
          final = path.read_text(encoding='utf-8')
          assert marker_primary not in final
          assert marker_repair not in final
          assert 'a strictly smaller relation-only literal basis nested inside a broader requested-output evidence span is admissible' in final
          assert 'must not equal a requested-output evidence span' in final
          assert 'must not wrap a requested-output evidence span with action/control wording' in final
          ast.parse(final)
          PY
          python -m py_compile services/agent-service/src/agent_core/lifecycle/goal_planning.py
      - name: Commit exact product repair
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/agent-service/src/agent_core/lifecycle/goal_planning.py
          test "$(git diff --cached --name-only)" = "services/agent-service/src/agent_core/lifecycle/goal_planning.py"
          git commit -m 'fix(semantic): align nested dependency basis verifier contract'
          git push origin HEAD:repair/release56-dependency-verifier-nested-basis-contract-20260816
