name: tmp-wp08-deepseek-latency-repair

on:
  push:
    branches:
      - fix/wp08-deepseek-v4-latency-envelope-20260813

permissions:
  contents: write

jobs:
  repair-validate-publish:
    if: github.ref == 'refs/heads/fix/wp08-deepseek-v4-latency-envelope-20260813'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/wp08-deepseek-v4-latency-envelope-20260813
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Apply bounded DeepSeek V4 latency policy repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected exactly one replacement in {path}, found {count}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          config_path = "services/agent-service/src/agent_core/config.py"
          old_settings = '''def get_model_settings() -> dict[str, object]:
              """Return the complete, non-secret OpenAI-compatible model configuration.

              The settings are intentionally read from ``.env`` rather than hard-coded in
              ``get_model``.  A model change must be reproducible from deployment
              configuration and visible in the model profile without exposing credentials.
              """
              return {
                  "model": os.getenv("OPENAI_MODEL", "gpt-4o-mini"),
                  "base_url": os.getenv("OPENAI_API_BASE") or None,
                  "temperature": _bounded_float_env("MODEL_TEMPERATURE", 0.0, minimum=0.0, maximum=2.0),
                  "timeout_seconds": _bounded_float_env("MODEL_TIMEOUT_SECONDS", 25.0, minimum=1.0, maximum=600.0),
                  "max_retries": _bounded_int_env("MODEL_MAX_RETRIES", 1, minimum=0, maximum=10),
              }
          '''
          new_settings = '''def _is_official_deepseek_v4_identity(*, model: object, base_url: object) -> bool:
              model_name = str(model or "").strip().lower()
              endpoint = str(base_url or "").strip().rstrip("/").lower()
              return (
                  endpoint in {"https://api.deepseek.com", "https://api.deepseek.com/v1"}
                  and model_name.startswith("deepseek-v4")
              )


          def get_model_settings() -> dict[str, object]:
              """Return the complete, non-secret model configuration and latency policy.

              Generic providers keep the governed 25-second / one-retry defaults. Official
              DeepSeek V4 control-plane calls instead use one longer bounded attempt by
              default: 40 seconds / zero retries. This raises the useful per-attempt read
              window while reducing the default worst-case provider envelope from 50 seconds
              to 40 seconds, so a slow-but-valid response is less likely to be killed and
              duplicated by a retry. Provider-specific overrides remain explicit and bounded.
              """
              model = os.getenv("OPENAI_MODEL", "gpt-4o-mini")
              base_url = os.getenv("OPENAI_API_BASE") or None
              timeout_seconds = _bounded_float_env("MODEL_TIMEOUT_SECONDS", 25.0, minimum=1.0, maximum=600.0)
              max_retries = _bounded_int_env("MODEL_MAX_RETRIES", 1, minimum=0, maximum=10)
              latency_policy = "generic_bounded_retry"
              if _is_official_deepseek_v4_identity(model=model, base_url=base_url):
                  timeout_seconds = _bounded_float_env(
                      "DEEPSEEK_V4_TIMEOUT_SECONDS", 40.0, minimum=1.0, maximum=60.0
                  )
                  max_retries = _bounded_int_env(
                      "DEEPSEEK_V4_MAX_RETRIES", 0, minimum=0, maximum=1
                  )
                  latency_policy = "deepseek_v4_long_first_attempt"
              return {
                  "model": model,
                  "base_url": base_url,
                  "temperature": _bounded_float_env("MODEL_TEMPERATURE", 0.0, minimum=0.0, maximum=2.0),
                  "timeout_seconds": timeout_seconds,
                  "max_retries": max_retries,
                  "latency_policy": latency_policy,
                  "provider_retry_envelope_seconds": timeout_seconds * (max_retries + 1),
              }
          '''
          replace_once(config_path, old_settings, new_settings)

          old_profile = '''        "temperature": settings["temperature"],
                  "timeout_seconds": settings["timeout_seconds"],
                  "max_retries": settings["max_retries"],
                  # Agent planning, routing and verifier calls are latency-bounded control-plane work.
          '''
          new_profile = '''        "temperature": settings["temperature"],
                  "timeout_seconds": settings["timeout_seconds"],
                  "max_retries": settings["max_retries"],
                  "latency_policy": settings["latency_policy"],
                  "provider_retry_envelope_seconds": settings["provider_retry_envelope_seconds"],
                  # Agent planning, routing and verifier calls are latency-bounded control-plane work.
          '''
          replace_once(config_path, old_profile, new_profile)

          old_diag = '''        "model_timeout_seconds": model_settings.get("timeout_seconds"),
                  "model_max_retries": model_settings.get("max_retries"),
                  "model_config_error": model_config_error,
          '''
          new_diag = '''        "model_timeout_seconds": model_settings.get("timeout_seconds"),
                  "model_max_retries": model_settings.get("max_retries"),
                  "model_latency_policy": model_settings.get("latency_policy"),
                  "model_provider_retry_envelope_seconds": model_settings.get("provider_retry_envelope_seconds"),
                  "model_config_error": model_config_error,
          '''
          replace_once(config_path, old_diag, new_diag)

          old_comment = '''            # V4 defaults to thinking=enabled. Control-plane calls must remain inside the
                      # existing 25s x 2-attempt provider envelope, so disable thinking explicitly.
          '''
          new_comment = '''            # V4 defaults to thinking=enabled. Keep control-plane work inside the
                      # provider-specific bounded latency envelope, so disable thinking explicitly.
          '''
          replace_once(config_path, old_comment, new_comment)

          env_path = "services/agent-service/.env.example"
          old_env = '''MODEL_TEMPERATURE=0
          MODEL_TIMEOUT_SECONDS=25
          MODEL_MAX_RETRIES=1
          # Protected real-model certification only accepts official HTTPS provider hosts.
          '''
          new_env = '''MODEL_TEMPERATURE=0
          # Generic provider control-call budget.
          MODEL_TIMEOUT_SECONDS=25
          MODEL_MAX_RETRIES=1
          # Official DeepSeek V4 uses one longer attempt instead of duplicating a 25s timeout.
          # The production effective provider envelope is still fail-closed at <= 60 seconds.
          DEEPSEEK_V4_TIMEOUT_SECONDS=40
          DEEPSEEK_V4_MAX_RETRIES=0
          # Protected real-model certification only accepts official HTTPS provider hosts.
          '''
          replace_once(env_path, old_env, new_env)

          test_path = "services/agent-service/tests/runtime/test_wp08_attempt6_release_repairs.py"
          old_profile_test = '''def test_deepseek_v4_profile_uses_provider_adapter_without_tool_choice(monkeypatch: pytest.MonkeyPatch) -> None:
              monkeypatch.setenv("MODEL_PROVIDER", "deepseek")
              monkeypatch.setenv("OPENAI_MODEL", "deepseek-v4-flash")
              monkeypatch.setenv("OPENAI_API_BASE", "https://api.deepseek.com")
              profile = agent_config.get_model_profile()
              assert profile["provider"] == "deepseek"
              assert profile["thinking_mode"] == "disabled"
              assert profile["tool_choice_supported"] is False
              assert profile["reasoning_content_required_for_tool_calls"] is False
          '''
          new_profile_test = '''def test_deepseek_v4_profile_uses_provider_adapter_without_tool_choice(monkeypatch: pytest.MonkeyPatch) -> None:
              monkeypatch.setenv("MODEL_PROVIDER", "deepseek")
              monkeypatch.setenv("OPENAI_MODEL", "deepseek-v4-flash")
              monkeypatch.setenv("OPENAI_API_BASE", "https://api.deepseek.com")
              monkeypatch.delenv("DEEPSEEK_V4_TIMEOUT_SECONDS", raising=False)
              monkeypatch.delenv("DEEPSEEK_V4_MAX_RETRIES", raising=False)
              profile = agent_config.get_model_profile()
              assert profile["provider"] == "deepseek"
              assert profile["thinking_mode"] == "disabled"
              assert profile["tool_choice_supported"] is False
              assert profile["reasoning_content_required_for_tool_calls"] is False
              assert profile["timeout_seconds"] == 40.0
              assert profile["max_retries"] == 0
              assert profile["latency_policy"] == "deepseek_v4_long_first_attempt"
              assert profile["provider_retry_envelope_seconds"] == 40.0
          '''
          replace_once(test_path, old_profile_test, new_profile_test)

          old_model_test = '''def test_get_model_uses_chatdeepseek_for_official_deepseek_v4(monkeypatch: pytest.MonkeyPatch) -> None:
              monkeypatch.setenv("MODEL_PROVIDER", "deepseek")
              monkeypatch.setenv("OPENAI_MODEL", "deepseek-v4-flash")
              monkeypatch.setenv("OPENAI_API_BASE", "https://api.deepseek.com")
              monkeypatch.setenv("OPENAI_API_KEY", "test-only-key")
              # Do not inherit timeout/retry overrides from unrelated standard-suite tests.
              # This provider-construction test proves the exact governed control-plane envelope.
              monkeypatch.setenv("MODEL_TIMEOUT_SECONDS", "25")
              monkeypatch.setenv("MODEL_MAX_RETRIES", "1")
              agent_config.get_model.cache_clear()
              try:
                  model = agent_config.get_model()
                  assert model.__class__.__module__.startswith("langchain_deepseek")
                  assert str(getattr(model, "model_name", "")) == "deepseek-v4-flash"
                  assert getattr(model, "extra_body", None) == {"thinking": {"type": "disabled"}}
                  settings = agent_config.get_model_settings()
                  assert settings["timeout_seconds"] == 25.0
                  assert settings["max_retries"] == 1
              finally:
                  agent_config.get_model.cache_clear()
          '''
          new_model_test = '''def test_get_model_uses_chatdeepseek_for_official_deepseek_v4(monkeypatch: pytest.MonkeyPatch) -> None:
              monkeypatch.setenv("MODEL_PROVIDER", "deepseek")
              monkeypatch.setenv("OPENAI_MODEL", "deepseek-v4-flash")
              monkeypatch.setenv("OPENAI_API_BASE", "https://api.deepseek.com")
              monkeypatch.setenv("OPENAI_API_KEY", "test-only-key")
              # Generic settings stay 25/1 while official V4 resolves its dedicated policy.
              monkeypatch.setenv("MODEL_TIMEOUT_SECONDS", "25")
              monkeypatch.setenv("MODEL_MAX_RETRIES", "1")
              monkeypatch.delenv("DEEPSEEK_V4_TIMEOUT_SECONDS", raising=False)
              monkeypatch.delenv("DEEPSEEK_V4_MAX_RETRIES", raising=False)
              agent_config.get_model.cache_clear()
              try:
                  model = agent_config.get_model()
                  assert model.__class__.__module__.startswith("langchain_deepseek")
                  assert str(getattr(model, "model_name", "")) == "deepseek-v4-flash"
                  assert getattr(model, "extra_body", None) == {"thinking": {"type": "disabled"}}
                  settings = agent_config.get_model_settings()
                  assert settings["timeout_seconds"] == 40.0
                  assert settings["max_retries"] == 0
                  assert settings["provider_retry_envelope_seconds"] == 40.0
              finally:
                  agent_config.get_model.cache_clear()


          def test_deepseek_v4_latency_policy_has_dedicated_bounded_override(monkeypatch: pytest.MonkeyPatch) -> None:
              monkeypatch.setenv("OPENAI_MODEL", "deepseek-v4-flash")
              monkeypatch.setenv("OPENAI_API_BASE", "https://api.deepseek.com")
              monkeypatch.setenv("DEEPSEEK_V4_TIMEOUT_SECONDS", "30")
              monkeypatch.setenv("DEEPSEEK_V4_MAX_RETRIES", "1")
              settings = agent_config.get_model_settings()
              assert settings["timeout_seconds"] == 30.0
              assert settings["max_retries"] == 1
              assert settings["provider_retry_envelope_seconds"] == 60.0
              assert settings["latency_policy"] == "deepseek_v4_long_first_attempt"


          def test_non_v4_deepseek_keeps_generic_provider_budget(monkeypatch: pytest.MonkeyPatch) -> None:
              monkeypatch.setenv("OPENAI_MODEL", "deepseek-chat")
              monkeypatch.setenv("OPENAI_API_BASE", "https://api.deepseek.com")
              monkeypatch.setenv("MODEL_TIMEOUT_SECONDS", "25")
              monkeypatch.setenv("MODEL_MAX_RETRIES", "1")
              monkeypatch.setenv("DEEPSEEK_V4_TIMEOUT_SECONDS", "40")
              monkeypatch.setenv("DEEPSEEK_V4_MAX_RETRIES", "0")
              settings = agent_config.get_model_settings()
              assert settings["timeout_seconds"] == 25.0
              assert settings["max_retries"] == 1
              assert settings["provider_retry_envelope_seconds"] == 50.0
              assert settings["latency_policy"] == "generic_bounded_retry"
          '''
          replace_once(test_path, old_model_test, new_model_test)
          PY
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Run focused provider latency regressions
        run: >-
          services/agent-service/.venv/bin/python -m pytest
          services/agent-service/tests/runtime/test_wp08_attempt6_release_repairs.py -q
      - name: Refresh exact protected source baseline
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          baseline_path = Path("skill-system/registry/product-source-baseline.json")
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          protected = [
              "services/agent-service/.env.example",
              "services/agent-service/src/agent_core/config.py",
              "services/agent-service/tests/runtime/test_wp08_attempt6_release_repairs.py",
          ]
          files = baseline.get("files")
          if not isinstance(files, dict):
              raise SystemExit("product source baseline files map is invalid")
          missing = [path for path in protected if path not in files]
          if missing:
              raise SystemExit(f"protected path missing from baseline: {missing}")
          for path in protected:
              files[path] = hashlib.sha256(Path(path).read_bytes()).hexdigest()
          baseline["file_count"] = len(files)
          baseline_path.write_text(
              json.dumps(baseline, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print({path: files[path] for path in protected})
          PY
      - name: Validate Skill control plane against refreshed baseline
        run: services/agent-service/.venv/bin/python -B skill-system/controller/profile_runner.py skill-control-plane
      - name: Publish validated repair and remove carrier
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-wp08-deepseek-latency-repair.yml
          git add \
            services/agent-service/.env.example \
            services/agent-service/src/agent_core/config.py \
            services/agent-service/tests/runtime/test_wp08_attempt6_release_repairs.py \
            skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m "Bound DeepSeek V4 latency with a longer first attempt"
          git push origin HEAD:fix/wp08-deepseek-v4-latency-envelope-20260813
