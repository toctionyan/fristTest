name: quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  skill-control-plane:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Validate Skill control plane
        run: '${pythonLocation}/bin/python -B skill-system/controller/profile_runner.py skill-control-plane'
      - name: Validate quality toolchain authority
        run: >-
          "${pythonLocation}/bin/python" -B scripts/quality_toolchain_contract.py
          --workspace-root . --static-only

  quality-static:
    needs: skill-control-plane
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Create static quality target
        env:
          QUALITY_TARGET: ${{ github.workspace }}/.quality/targets/quality-target-static.md
        run: '"${pythonLocation}/bin/python" -B scripts/create_ci_quality_target.py --output "$QUALITY_TARGET" --ref "${{ github.sha }}" --workflow quality-static'
      - name: Run static quality gates
        env:
          QUALITY_EVIDENCE_DIR: ${{ runner.temp }}/quality-evidence/static
          QUALITY_TARGET: ${{ github.workspace }}/.quality/targets/quality-target-static.md
        run: '"${pythonLocation}/bin/python" -B scripts/quality_loop.py --mode static --target "$QUALITY_TARGET"'
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-static-evidence
          path: |
            ${{ runner.temp }}/quality-evidence/static
            ${{ github.workspace }}/.quality/targets/quality-target-static.md
            ${{ github.workspace }}/.quality/targets/quality-target-static.claims.json

  quality-quick:
    needs: quality-static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Validate locked runtime toolchain
        env:
          QUALITY_TOOLCHAIN_RESULT: ${{ runner.temp }}/quality-toolchain-${{ github.job }}.json
        run: >-
          "${pythonLocation}/bin/python" -B scripts/quality_toolchain_contract.py
          --workspace-root . --runtime-only --output "$QUALITY_TOOLCHAIN_RESULT"
      - name: Install locked Python environments
        run: |
          cd services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups
          cd ../agent-service/frontend && npm ci --ignore-scripts=false
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Create quick quality target
        env:
          QUALITY_TARGET: ${{ github.workspace }}/.quality/targets/quality-target-quick.md
        run: '"${pythonLocation}/bin/python" -B scripts/create_ci_quality_target.py --output "$QUALITY_TARGET" --ref "${{ github.sha }}" --workflow quality-quick --claims-source governance/claims/v20.6.2-project-quick-certification.json'
      - name: Run unit, contract and frontend gates
        env:
          QUALITY_EVIDENCE_DIR: ${{ runner.temp }}/quality-evidence/quick
          QUALITY_TARGET: ${{ github.workspace }}/.quality/targets/quality-target-quick.md
        run: services/agent-service/.venv/bin/python -B scripts/quality_loop.py --mode quick --target "$QUALITY_TARGET"
      - name: Upload quick evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-quick-evidence
          path: |
            ${{ runner.temp }}/quality-evidence/quick
            ${{ github.workspace }}/.quality/targets/quality-target-quick.md
            ${{ github.workspace }}/.quality/targets/quality-target-quick.claims.json
            ${{ runner.temp }}/quality-toolchain-quality-quick.json

  quality-integration:
    if: github.event_name != 'pull_request'
    needs: quality-quick
    runs-on: ubuntu-24.04
    services:
      pgvector:
        image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: agent_test
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Validate locked runtime toolchain
        env:
          QUALITY_TOOLCHAIN_RESULT: ${{ runner.temp }}/quality-toolchain-${{ github.job }}.json
        run: >-
          "${pythonLocation}/bin/python" -B scripts/quality_toolchain_contract.py
          --workspace-root . --runtime-only --output "$QUALITY_TOOLCHAIN_RESULT"
      - name: Install locked Python environments
        run: |
          cd services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups
          cd ../agent-service/frontend && npm ci --ignore-scripts=false
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Create integration quality target
        env:
          QUALITY_TARGET: ${{ github.workspace }}/.quality/targets/quality-target-integration.md
        run: '"${pythonLocation}/bin/python" -B scripts/create_ci_quality_target.py --output "$QUALITY_TARGET" --ref "${{ github.sha }}" --workflow quality-integration --claims-source governance/claims/v20.6.2-project-integration-certification.json'
      - name: Start deterministic model and both services
        env:
          APP_PROFILE: local
          PYTHONDONTWRITEBYTECODE: '1'
          OPENAI_API_KEY: deterministic-ci-key
          OPENAI_API_BASE: http://127.0.0.1:18081/v1
          OPENAI_MODEL: deterministic-ci-model
          BUSINESS_SERVICE_TOKEN: dev-service-token
          BUSINESS_REQUIRE_ACTOR_SIGNATURE: 'false'
          BUSINESS_SEED_DEMO_DATA: 'true'
          BUSINESS_SERVICE_RELOAD: 'false'
          AGENT_SERVICE_RELOAD: 'false'
          WEB_CONSOLE_DEV_LOGIN: 'true'
          AGENT_REQUIRE_AUTH: 'true'
          AGENT_AUTH_PROVIDER: dev_token
          RAG_BACKEND: local_sparse
          AGENT_DB_BACKEND: sqlite
          CHECKPOINT_BACKEND: sqlite
          SQLITE_DB_PATH: ${{ runner.temp }}/agent.db
          CHECKPOINT_DB_PATH: ${{ runner.temp }}/checkpoints.db
          BUSINESS_DB_PATH: ${{ runner.temp }}/business.db
        run: |
          services/agent-service/.venv/bin/python -m uvicorn tests.integration.model_stub:app --app-dir services/agent-service --host 127.0.0.1 --port 18081 > "${RUNNER_TEMP}/model-stub.log" 2>&1 &
          services/business-service/.venv/bin/python services/business-service/scripts/run_business_api.py > "${RUNNER_TEMP}/business.log" 2>&1 &
          services/agent-service/.venv/bin/python services/agent-service/scripts/run_api.py > "${RUNNER_TEMP}/agent.log" 2>&1 &
          for _ in $(seq 1 30); do curl --fail --silent http://127.0.0.1:9000/health && curl --fail --silent http://127.0.0.1:8000/health && exit 0; sleep 2; done
          exit 1
      - name: Run integration quality gates
        env:
          APP_PROFILE: local
          PYTHONDONTWRITEBYTECODE: '1'
          OPENAI_API_KEY: deterministic-ci-key
          OPENAI_API_BASE: http://127.0.0.1:18081/v1
          OPENAI_MODEL: deterministic-ci-model
          BUSINESS_SERVICE_BASE_URL: http://127.0.0.1:9000
          BUSINESS_SERVICE_TOKEN: dev-service-token
          AGENT_TEST_URL: http://127.0.0.1:8000
          BUSINESS_TEST_URL: http://127.0.0.1:9000
          PRODUCT_HTTP_SMOKE_EPHEMERAL_DATA: 'true'
          AGENT_TEST_POSTGRES_URL: postgresql+psycopg://agent:agent-test-password@127.0.0.1:5432/agent_test
          QUALITY_EVIDENCE_DIR: ${{ runner.temp }}/quality-evidence/integration
          QUALITY_TARGET: ${{ github.workspace }}/.quality/targets/quality-target-integration.md
        run: services/agent-service/.venv/bin/python -B scripts/quality_loop.py --mode integration --target "$QUALITY_TARGET"
      - name: Upload integration evidence and service logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-integration-evidence
          path: |
            ${{ runner.temp }}/quality-evidence/integration
            ${{ runner.temp }}/model-stub.log
            ${{ runner.temp }}/business.log
            ${{ runner.temp }}/agent.log
            ${{ github.workspace }}/.quality/targets/quality-target-integration.md
            ${{ github.workspace }}/.quality/targets/quality-target-integration.claims.json
            ${{ runner.temp }}/quality-toolchain-quality-integration.json
