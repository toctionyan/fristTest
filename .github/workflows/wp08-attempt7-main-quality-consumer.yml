name: wp08-attempt7-main-quality-consumer

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  consume:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt7-main-quality-consumer-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact repaired main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 91b06d66a4efbadd8da4ea3d3653341bbd9e4d02
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Fetch exact-main push Quality and replay coordinator event
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 91b06d66a4efbadd8da4ea3d3653341bbd9e4d02
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          curl --fail-with-body --silent --show-error -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?event=push&branch=main&per_page=50" \
            > "${RUNNER_TEMP}/runs.json"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          payload=json.loads((root/'runs.json').read_text())
          matches=[
              row for row in payload.get('workflow_runs', [])
              if row.get('head_sha') == os.environ['EXPECTED_SHA']
              and row.get('event') == 'push'
              and row.get('head_branch') == 'main'
              and row.get('name') == 'quality'
          ]
          if not matches:
              raise SystemExit('exact-main push Quality run not found')
          run=max(matches, key=lambda row: int(row.get('id') or 0))
          print(json.dumps({
              'quality_run_id': run.get('id'),
              'status': run.get('status'),
              'conclusion': run.get('conclusion'),
              'head_sha': run.get('head_sha'),
          }, sort_keys=True))
          if run.get('status') != 'completed':
              raise SystemExit(f"exact-main Quality is not completed: {run.get('status')}")
          if run.get('conclusion') not in {'success','failure','cancelled','timed_out'}:
              raise SystemExit(f"unsupported exact-main Quality conclusion: {run.get('conclusion')}")
          (root/'event.json').write_text(json.dumps({'workflow_run':run}), encoding='utf-8')
          PY
          GITHUB_TOKEN="${GH_TOKEN}" python -B scripts/wp08_release_coordinator.py \
            --mode workflow-run --event-path "${RUNNER_TEMP}/event.json"
      - name: Verify bounded durable state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib import request
          req=request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/454",
              headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f"Bearer {os.environ['GH_TOKEN']}",
                  'X-GitHub-Api-Version':'2022-11-28',
              },
          )
          with request.urlopen(req,timeout=30) as r:
              issue=json.load(r)
          body=str(issue.get('body') or '')
          block=body.split('<!-- WP08_RELEASE_RUN_STATE_BEGIN -->',1)[1].split('<!-- WP08_RELEASE_RUN_STATE_END -->',1)[0]
          state=json.loads(block.split('```json',1)[1].split('```',1)[0])
          assert state['current_candidate_sha'] == '91b06d66a4efbadd8da4ea3d3653341bbd9e4d02', state
          assert state['production_closed'] is False, state
          assert state['attempt'] <= 8, state
          assert not any(x.get('event') == 'wp08_dispatched' and int(x.get('attempt') or 0) > 8 for x in state.get('history', [])), state
          assert state['status'] in {'CERTIFYING','MAIN_QUALITY_FAILED'}, state
          if state['status'] == 'CERTIFYING':
              assert state['attempt'] == 8, state
              assert int(state.get('current_wp08_run_id') or 0) != 31448791975, state
              assert any(x.get('event') == 'wp08_dispatched' and int(x.get('attempt') or 0) == 8 for x in state.get('history', [])), state
          print(json.dumps({'status':'PASS','attempt':state['attempt'],'release_state':state['status'],'current_wp08_run_id':state.get('current_wp08_run_id')},sort_keys=True))
          PY
