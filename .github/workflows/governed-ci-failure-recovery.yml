name: governed-ci-failure-recovery

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

concurrency:
  group: governed-ci-failure-recovery-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  recover-stage1:
    if: ${{ github.event.issue.pull_request && github.event.comment.user.login == github.repository_owner && startsWith(github.event.comment.body, '/governed-repair-ingest ') }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Checkout trusted recovery control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Bind owner-authorized failed source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_AUTHOR: ${{ github.event.comment.user.login }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          if [[ "${COMMENT_AUTHOR}" != "${REPOSITORY_OWNER}" ]]; then
            echo "Only the repository owner may enter the recovery lane." >&2
            exit 1
          fi
          if [[ ! "${COMMENT_BODY}" =~ ^/governed-repair-ingest[[:space:]]+([1-9][0-9]*)[[:space:]]*$ ]]; then
            echo "Recovery command must be exactly: /governed-repair-ingest <numeric-run-id>" >&2
            exit 1
          fi
          SOURCE_RUN_ID="${BASH_REMATCH[1]}"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > incoming/source-run.json
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${ISSUE_NUMBER}" > incoming/source-pr.json
          "${pythonLocation}/bin/python" -B control/scripts/github_failure_recovery_event.py \
            --comment "/governed-repair-run ${SOURCE_RUN_ID}" \
            --repository "${GITHUB_REPOSITORY}" \
            --issue-number "${ISSUE_NUMBER}" \
            --run-json incoming/source-run.json \
            --pr-json incoming/source-pr.json \
            --output incoming/source-event.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Record Stage-1 recovery receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source_run_attempt }}
          SOURCE_WORKFLOW: ${{ steps.source.outputs.workflow_name }}
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
        run: |
          set -euo pipefail
          TITLE="[governed-ci-failure] run ${SOURCE_RUN_ID}"
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" \
            --json number --jq '.[0].number // empty')
          BODY=$(cat <<EOF
          The repository-owner Stage-1 recovery lane received and rebound a failed workflow run.

          - Stage: \`RECOVERY_RECEIVED\`
          - Source workflow: \`${SOURCE_WORKFLOW}\`
          - Source run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}
          - Run ID / attempt: \`${SOURCE_RUN_ID}/${SOURCE_RUN_ATTEMPT}\`
          - Head SHA: \`${SOURCE_SHA}\`
          - Recovery mode: \`stage1-only\`
          - Source changes: none
          - Stage 2 model repair: not authorized by this workflow
          - production_closed: false
          EOF
          )
          if [[ -n "${EXISTING}" ]]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
            RECEIPT_ISSUE="${EXISTING}"
          else
            ISSUE_URL=$(gh issue create --title "${TITLE}" --body "${BODY}")
            RECEIPT_ISSUE="${ISSUE_URL##*/}"
          fi
          [[ "${RECEIPT_ISSUE}" =~ ^[0-9]+$ ]]
          echo "issue_number=${RECEIPT_ISSUE}" >> "$GITHUB_OUTPUT"

      - name: Checkout failed source as untrusted data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Download failed-run artifacts as untrusted evidence
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: incoming/artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.source_run_id }}

      - name: Download failed-run logs as untrusted evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p incoming/logs
          if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/logs" > incoming/logs.zip; then
            unzip -q incoming/logs.zip -d incoming/logs || true
          else
            rm -f incoming/logs.zip
          fi

      - name: Capture source PR changed-file metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR_NUMBER: ${{ steps.source.outputs.source_pr_number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR_NUMBER}/files" \
            --jq '.[].filename' | jq -R -s 'split("\n")[:-1]' > incoming/changed-files.json

      - name: Ingest failure and create durable TaskRun
        id: ingest
        run: >-
          "${pythonLocation}/bin/python" -B control/scripts/github_failure_ingest_control_plane.py
          --event incoming/source-event.json
          --workspace candidate
          --artifacts incoming/artifacts
          --logs incoming/logs
          --changed-files incoming/changed-files.json
          --output incoming/failure-case.json
          --task-run incoming/task-run.json
          --github-output "$GITHUB_OUTPUT"

      - name: Upload Stage-1 recovery evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-ci-recovery-stage1-${{ steps.source.outputs.source_run_id }}
          path: |
            incoming/source-event.json
            incoming/failure-case.json
            incoming/task-run.json
            incoming/changed-files.json
          retention-days: 30
          if-no-files-found: error

      - name: Finalize Stage-1 recovery issue
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ISSUE: ${{ steps.receipt.outputs.issue_number }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source_run_attempt }}
          CLASSIFICATION: ${{ steps.ingest.outputs.classification }}
          REPAIR_ALLOWED: ${{ steps.ingest.outputs.repair_allowed }}
          FAILURE_SIGNATURE: ${{ steps.ingest.outputs.failure_signature }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Repository-owner Stage-1 recovery ingestion completed.

          - Stage: \`RECOVERY_INGESTED\`
          - Run ID / attempt: \`${SOURCE_RUN_ID}/${SOURCE_RUN_ATTEMPT}\`
          - Classification: \`${CLASSIFICATION}\`
          - Failure signature: \`${FAILURE_SIGNATURE}\`
          - Source is structurally eligible for later repair: \`${REPAIR_ALLOWED}\`
          - Stage 2 started by this workflow: \`false\`
          - Evidence artifact: \`governed-ci-recovery-stage1-${SOURCE_RUN_ID}\`
          - Source changes: none
          - production_closed: false

          This workflow ends at Stage 1. A later separately approved Stage-2 handoff must
          consume the bound evidence before any model Secret can be accessed.
          EOF
          )
          gh issue comment "${RECEIPT_ISSUE}" --body "${BODY}"

      - name: Mark Stage-1 recovery failure
        if: ${{ failure() && steps.receipt.outputs.issue_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          RECEIPT_ISSUE: ${{ steps.receipt.outputs.issue_number }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
        run: |
          set -euo pipefail
          gh issue comment "${RECEIPT_ISSUE}" --body "Stage-1 recovery stopped after receipt for run \`${SOURCE_RUN_ID}\`. Automatic repair remains disabled, source changes are none, and \`production_closed=false\`."

      - name: Publish Stage-1 recovery summary
        if: always()
        env:
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          RECEIPT_ISSUE: ${{ steps.receipt.outputs.issue_number }}
          CLASSIFICATION: ${{ steps.ingest.outputs.classification }}
          REPAIR_ALLOWED: ${{ steps.ingest.outputs.repair_allowed }}
        run: |
          {
            echo "## Governed CI Stage-1 recovery"
            echo
            echo "- Source Run ID: \`${SOURCE_RUN_ID}\`"
            echo "- Receipt issue: \`#${RECEIPT_ISSUE}\`"
            echo "- Classification: \`${CLASSIFICATION:-not-produced}\`"
            echo "- Structurally eligible for later repair: \`${REPAIR_ALLOWED:-false}\`"
            echo "- Stage 2 started: \`false\`"
            echo "- Source changes: none"
            echo "- production_closed: false"
          } >> "$GITHUB_STEP_SUMMARY"
