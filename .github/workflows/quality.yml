name: quality

on:
  pull_request:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  consume-exact-main-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Wait for exact-main push Quality and replay repository coordinator
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: 'c50ab97b178f1216755f0d4dda5007cc8209c5d8'
        run: |
          set -euo pipefail
          RUN_JSON="${RUNNER_TEMP}/quality-run.json"
          EVENT_JSON="${RUNNER_TEMP}/quality-event.json"
          for poll in $(seq 1 120); do
            curl --fail-with-body --silent --show-error -L \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2026-03-10" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?event=push&branch=main&per_page=20" \
              > "${RUNNER_TEMP}/runs.json"
            FOUND=$(python -B - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'runs.json').read_text())
          expected = os.environ['EXPECTED_SHA']
          rows = [r for r in data.get('workflow_runs', []) if r.get('head_sha') == expected]
          if not rows:
              print('NONE')
          else:
              row = sorted(rows, key=lambda r: int(r.get('id') or 0), reverse=True)[0]
              (Path(os.environ['RUNNER_TEMP']) / 'quality-run.json').write_text(
                  json.dumps(row), encoding='utf-8'
              )
              print(f"{row.get('id')}:{row.get('status')}:{row.get('conclusion')}")
          PY
            )
            echo "[EXACT-MAIN QUALITY] poll=${poll} state=${FOUND} sha=${EXPECTED_SHA}"
            if [[ "${FOUND}" != "NONE" ]]; then
              STATUS=$(python -B - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'quality-run.json').read_text())
          print(run.get('status') or '')
          PY
              )
              if [[ "${STATUS}" == "completed" ]]; then
                break
              fi
            fi
            sleep 10
          done
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          path = Path(os.environ['RUNNER_TEMP']) / 'quality-run.json'
          if not path.is_file():
              raise SystemExit('exact-main push Quality run was not found before timeout')
          run = json.loads(path.read_text())
          expected = os.environ['EXPECTED_SHA']
          assert run['name'] == 'quality', run
          assert run['event'] == 'push', run
          assert run['head_sha'] == expected, run
          assert run['status'] == 'completed', run
          if run.get('conclusion') != 'success':
              raise SystemExit(f"exact-main push Quality did not pass: {run.get('conclusion')}")
          (Path(os.environ['RUNNER_TEMP']) / 'quality-event.json').write_text(
              json.dumps({'workflow_run': run}), encoding='utf-8'
          )
          print(json.dumps({
              'exact_main_sha': expected,
              'quality_run_id': run['id'],
              'status': run['status'],
              'conclusion': run['conclusion'],
          }))
          PY
          GH_TOKEN="${GH_TOKEN}" GITHUB_TOKEN="${GH_TOKEN}" \
            python -B scripts/wp08_release_coordinator.py \
            --mode workflow-run --event-path "${EVENT_JSON}"
