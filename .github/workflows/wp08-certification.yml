name: wp08-full-stack-certification

"on":
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "Completed WP-08 run ID to resume from; must match the same candidate SHA"
        required: false
        type: string
      resume_run_attempt:
        description: "GitHub run attempt for the checkpoint artifact"
        required: false
        default: "1"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: wp08-full-stack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  certify:
    if: github.ref_protected == true && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    environment: production-certification
    env:
      WP08_RESUME_RUN_ID_RESOLVED: ${{ inputs.resume_run_id || vars.WP08_RESUME_RUN_ID }}
      WP08_RESUME_RUN_ATTEMPT_RESOLVED: ${{ inputs.resume_run_attempt || vars.WP08_RESUME_RUN_ATTEMPT || '1' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Validate release supply-chain lock
        run: >-
          "${pythonLocation}/bin/python" -B scripts/release_toolchain_contract.py
          --workspace-root . --static-only
      - name: Install locked full-stack dependencies
        run: |
          cd services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups
          cd ../agent-service/frontend && npm ci --ignore-scripts=false
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Capture locked release toolchain provenance
        env:
          TOOLCHAIN_EVIDENCE: ${{ runner.temp }}/wp08-toolchain.json
          PRODUCTION_RELEASE_EXPECTED_EVENT: workflow_dispatch
          PRODUCTION_RELEASE_EXPECTED_WORKFLOW: wp08-full-stack-certification
          PRODUCTION_RELEASE_EXPECTED_WORKFLOW_FILE: .github/workflows/wp08-certification.yml
          PRODUCTION_RELEASE_EXPECTED_JOB: certify
          PRODUCTION_RELEASE_EXPECTED_REF: refs/heads/main
        run: |
          services/agent-service/.venv/bin/python -B scripts/release_toolchain_contract.py \
            --workspace-root . --output "$TOOLCHAIN_EVIDENCE"
          TOOLCHAIN_FINGERPRINT=$(services/agent-service/.venv/bin/python -c \
            'import json,os; print(json.load(open(os.environ["TOOLCHAIN_EVIDENCE"], encoding="utf-8"))["toolchain_fingerprint_sha256"])')
          RUN_IDENTITY_FINGERPRINT=$(services/agent-service/.venv/bin/python -c \
            'import json,os; print(json.load(open(os.environ["TOOLCHAIN_EVIDENCE"], encoding="utf-8"))["ci_run_identity"]["run_identity_fingerprint_sha256"])')
          echo "PRODUCTION_CERTIFICATION_TOOLCHAIN_EVIDENCE=$TOOLCHAIN_EVIDENCE" >> "$GITHUB_ENV"
          echo "PRODUCTION_CERTIFICATION_TOOLCHAIN_FINGERPRINT=$TOOLCHAIN_FINGERPRINT" >> "$GITHUB_ENV"
          echo "PRODUCTION_CERTIFICATION_RUN_IDENTITY_FINGERPRINT=$RUN_IDENTITY_FINGERPRINT" >> "$GITHUB_ENV"
      - name: Resolve versioned production profile and protected environment overrides
        env:
          WP08_PRODUCTION_PROFILE: deployment/ci/wp08-production-profile.json
          CONFIG_MODEL_PROVIDER: ${{ vars.REAL_MODEL_CERTIFICATION_PROVIDER || vars.PRODUCTION_MODEL_PROVIDER || vars.MODEL_PROVIDER }}
          CONFIG_MODEL_ID: ${{ vars.OPENAI_MODEL || vars.PRODUCTION_MODEL_ID || vars.MODEL_ID }}
          CONFIG_MODEL_API_BASE: ${{ vars.OPENAI_API_BASE || vars.PRODUCTION_MODEL_API_BASE || vars.MODEL_API_BASE }}
          CONFIG_EMBEDDING_PROVIDER: ${{ vars.EMBEDDING_PROVIDER || vars.PRODUCTION_EMBEDDING_PROVIDER }}
          CONFIG_EMBEDDING_MODEL: ${{ vars.EMBEDDING_MODEL || vars.PRODUCTION_EMBEDDING_MODEL }}
          CONFIG_EMBEDDING_DIM: ${{ vars.EMBEDDING_DIM || vars.PRODUCTION_EMBEDDING_DIM }}
          CONFIG_EMBEDDING_API_BASE: ${{ vars.EMBEDDING_API_BASE || vars.EMBEDDING_BASE_URL || vars.PRODUCTION_EMBEDDING_API_BASE }}
          CONFIG_EMBEDDING_BATCH_SIZE: ${{ vars.EMBEDDING_BATCH_SIZE || vars.PRODUCTION_EMBEDDING_BATCH_SIZE }}
          CONFIG_MODEL_API_KEY: ${{ secrets.PRODUCTION_MODEL_API_KEY }}
          CONFIG_EMBEDDING_API_KEY: ${{ secrets.PRODUCTION_EMBEDDING_API_KEY }}
          CONFIG_EVIDENCE_SIGNING_KEY: ${{ secrets.QUALITY_EVIDENCE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" - <<'PY'
          from __future__ import annotations

          import json
          import os
          from pathlib import Path

          profile_path = Path(os.environ["WP08_PRODUCTION_PROFILE"])
          try:
              profile = json.loads(profile_path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError) as exc:
              raise SystemExit(f"WP-08 production profile is unreadable: {profile_path}") from exc
          if not isinstance(profile, dict) or profile.get("contract") != "wp08-production-profile@1":
              raise SystemExit("WP-08 production profile contract is invalid")
          if profile.get("production_closed") is not False:
              raise SystemExit("WP-08 production profile cannot claim production closure")

          forbidden_tokens = ("secret", "api_key", "token", "password", "credential")
          forbidden_fields = [
              str(key) for key in profile
              if any(token in str(key).casefold() for token in forbidden_tokens)
          ]
          if forbidden_fields:
              raise SystemExit("WP-08 production profile must not contain secret material fields")

          override_env = {
              "model_provider": "CONFIG_MODEL_PROVIDER",
              "model_id": "CONFIG_MODEL_ID",
              "model_api_base": "CONFIG_MODEL_API_BASE",
              "embedding_provider": "CONFIG_EMBEDDING_PROVIDER",
              "embedding_model": "CONFIG_EMBEDDING_MODEL",
              "embedding_dimension": "CONFIG_EMBEDDING_DIM",
              "embedding_api_base": "CONFIG_EMBEDDING_API_BASE",
              "embedding_batch_size": "CONFIG_EMBEDDING_BATCH_SIZE",
          }

          def clean(value: object, name: str) -> str:
              text = str(value if value is not None else "").strip()
              if "\n" in text or "\r" in text:
                  raise SystemExit(f"{name} must not contain newline characters")
              return text

          resolved: dict[str, str] = {}
          field_sources: dict[str, str] = {}
          for field, env_name in override_env.items():
              override = clean(os.environ.get(env_name), env_name)
              if override:
                  resolved[field] = override
                  field_sources[field] = "protected_environment_override"
              else:
                  resolved[field] = clean(profile.get(field), f"production_profile.{field}")
                  field_sources[field] = "versioned_production_profile"

          provider = resolved["model_provider"].casefold()
          model_id = resolved["model_id"]
          model_api_base = resolved["model_api_base"].rstrip("/")
          embedding_provider = resolved["embedding_provider"].casefold()
          embedding_model = resolved["embedding_model"]
          embedding_api_base = resolved["embedding_api_base"].rstrip("/")
          try:
              embedding_dimension = int(resolved["embedding_dimension"])
              embedding_batch_size = int(resolved["embedding_batch_size"])
          except ValueError as exc:
              raise SystemExit("embedding dimension and batch size must be positive integers") from exc

          if provider == "openai":
              if model_api_base != "https://api.openai.com/v1":
                  raise SystemExit("Configured OpenAI certification base must be https://api.openai.com/v1")
          elif provider == "deepseek":
              if model_api_base not in {"https://api.deepseek.com", "https://api.deepseek.com/v1"}:
                  raise SystemExit("Configured DeepSeek certification base must use the official api.deepseek.com host")
          else:
              raise SystemExit("resolved certification provider must be openai or deepseek")

          if not model_id:
              raise SystemExit("resolved certification model ID is empty")
          if not embedding_provider:
              raise SystemExit("resolved embedding provider is empty")
          if not embedding_model:
              raise SystemExit("resolved embedding model is empty")
          if embedding_dimension < 1:
              raise SystemExit("EMBEDDING_DIM must be a positive integer")
          if embedding_batch_size < 1:
              raise SystemExit("EMBEDDING_BATCH_SIZE must be a positive integer")
          if not embedding_api_base.startswith("https://"):
              raise SystemExit("EMBEDDING_API_BASE must use HTTPS")

          missing_secrets = [
              name for name in (
                  "CONFIG_MODEL_API_KEY",
                  "CONFIG_EMBEDDING_API_KEY",
                  "CONFIG_EVIDENCE_SIGNING_KEY",
              )
              if not os.environ.get(name)
          ]
          if missing_secrets:
              raise SystemExit("production-certification Environment is missing required secret(s): " + ", ".join(missing_secrets))

          payload = {
              "contract": "wp08-environment-configuration@2",
              "source": "versioned-production-profile-with-protected-environment-overrides",
              "production_profile": profile_path.as_posix(),
              "production_profile_contract": profile["contract"],
              "field_sources": field_sources,
              "model_provider": provider,
              "model_id": model_id,
              "model_api_base": model_api_base,
              "embedding_provider": embedding_provider,
              "embedding_model": embedding_model,
              "embedding_dimension": embedding_dimension,
              "embedding_api_base": embedding_api_base,
              "embedding_batch_size": embedding_batch_size,
              "secrets_present": {
                  "production_model_api_key": True,
                  "production_embedding_api_key": True,
                  "quality_evidence_signing_key": True,
              },
          }
          output = Path(os.environ["RUNNER_TEMP"]) / "wp08-environment-config.json"
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          exported = {
              "OPENAI_MODEL": model_id,
              "OPENAI_API_BASE": model_api_base,
              "REAL_MODEL_CERTIFICATION_PROVIDER": provider,
              "EMBEDDING_PROVIDER": embedding_provider,
              "EMBEDDING_MODEL": embedding_model,
              "EMBEDDING_DIM": str(embedding_dimension),
              "EMBEDDING_API_BASE": embedding_api_base,
              "EMBEDDING_BATCH_SIZE": str(embedding_batch_size),
              "WP08_CONFIG_EVIDENCE": output.as_posix(),
          }
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              for key, value in exported.items():
                  handle.write(f"{key}={value}\n")
          PY
      - name: Download previous WP-08 checkpoint
        if: ${{ env.WP08_RESUME_RUN_ID_RESOLVED != '' }}
        id: download-resume
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: wp08-full-stack-certification-${{ env.WP08_RESUME_RUN_ID_RESOLVED }}-${{ env.WP08_RESUME_RUN_ATTEMPT_RESOLVED }}
          path: ${{ runner.temp }}/wp08-resume
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WP08_RESUME_RUN_ID_RESOLVED }}
      - name: Validate and restore previous WP-08 checkpoint
        if: ${{ env.WP08_RESUME_RUN_ID_RESOLVED != '' }}
        env:
          RESUME_ARTIFACT_ROOT: ${{ runner.temp }}/wp08-resume
          RESUME_EVIDENCE_DIR: ${{ runner.temp }}/wp08-certification-evidence
          RESUME_STATE_FILE: ${{ runner.temp }}/wp08-certification-state/wp08-state.json
          RESUME_PROVENANCE: ${{ runner.temp }}/wp08-resume-provenance.json
        run: >-
          "${pythonLocation}/bin/python" -B scripts/prepare_wp08_resume.py
          --workspace-root .
          --artifact-root "$RESUME_ARTIFACT_ROOT"
          --target-evidence-dir "$RESUME_EVIDENCE_DIR"
          --target-state-file "$RESUME_STATE_FILE"
          --expected-run-id "$WP08_RESUME_RUN_ID_RESOLVED"
          --expected-run-attempt "$WP08_RESUME_RUN_ATTEMPT_RESOLVED"
          --expected-repository "$GITHUB_REPOSITORY"
          --expected-commit-sha "$GITHUB_SHA"
          --output "$RESUME_PROVENANCE"
      - name: Run resumable WP-08 certification batches
        env:
          OPENAI_API_KEY: ${{ secrets.PRODUCTION_MODEL_API_KEY }}
          EMBEDDING_API_KEY: ${{ secrets.PRODUCTION_EMBEDDING_API_KEY }}
          QUALITY_EVIDENCE_SIGNING_KEY: ${{ secrets.QUALITY_EVIDENCE_SIGNING_KEY }}
          WP08_EVIDENCE_DIR: ${{ runner.temp }}/wp08-certification-evidence
          WP08_STATE_FILE: ${{ runner.temp }}/wp08-certification-state/wp08-state.json
          WP08_RESUME_REQUESTED: ${{ env.WP08_RESUME_RUN_ID_RESOLVED != '' && '1' || '0' }}
          WP08_HEARTBEAT_SECONDS: "60"
        run: |
          RESUME_ARGS=()
          if [[ "$WP08_RESUME_REQUESTED" == "1" ]]; then
            RESUME_ARGS+=(--resume)
          fi
          services/agent-service/.venv/bin/python -B scripts/run_wp08_certification.py \
            --workspace-root . \
            --config deployment/ci/wp08-certification-batches.json \
            --evidence-dir "$WP08_EVIDENCE_DIR" \
            --state-file "$WP08_STATE_FILE" \
            "${RESUME_ARGS[@]}"
      - name: Upload WP-08 evidence and checkpoints
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wp08-full-stack-certification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/wp08-certification-evidence
            ${{ runner.temp }}/wp08-certification-state
            ${{ runner.temp }}/wp08-toolchain.json
            ${{ runner.temp }}/wp08-environment-config.json
            ${{ runner.temp }}/wp08-resume-provenance.json
          retention-days: 30
          if-no-files-found: error
