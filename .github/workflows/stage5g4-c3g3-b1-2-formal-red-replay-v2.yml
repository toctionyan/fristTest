name: stage5g4-c3g3-b1-2-formal-red-replay-v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  formal-red-replay-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A4 control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          fetch-depth: 0

      - name: Checkout untouched exact B36 source
        uses: actions/checkout@v4
        with:
          ref: e0e04d51e9da9790bef7bd0482584f60b8e975a9
          path: source
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install test dependencies outside source workspace
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project control/services/agent-service --locked --all-groups --python 3.12
          test -x control/services/agent-service/.venv/bin/python

      - name: Download immutable B1-1 Oracle overlay
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 8994125634
          path: oracle-source
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31179398373

      - name: Execute formal exact-B36 RED replay
        shell: bash
        run: |
          set -euo pipefail
          test -f oracle-source/overlay.zip
          python -B control/docs/governance/ci-probes/stage5g4-c3g3-b1-2/run_formal_red_replay.py \
            --control control \
            --source source \
            --overlay oracle-source/overlay.zip \
            --output b1-results

      - name: Upload formal RED replay evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage5g4-c3g3-b1-2-formal-red-replay-v2
          path: b1-results
          if-no-files-found: error
          retention-days: 7
