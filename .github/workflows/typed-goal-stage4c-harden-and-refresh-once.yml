        else ""
    )
    if final != timeline_final:
        errors.append("HANDOFF_FINAL_AUTHORITY_TIMELINE_MISMATCH")
    if expected_timeline is not None and final != expected_timeline[-1][1]:
        errors.append("HANDOFF_FINAL_AUTHORITY_STATUS_MISMATCH")

    expected_typed_steps = 1 if status in {
        "TYPED_HANDOFF_SIMULATED",
        "ROLLBACK_DRILL_COMPLETE",
    } else 0
    if typed_steps != expected_typed_steps:
        errors.append("HANDOFF_TYPED_STEP_COUNT_INVALID")

    typed_entered = row.get("typed_candidate_entered_in_simulation") is True
    expected_typed_entered = status in {
        "TYPED_HANDOFF_SIMULATED",
        "ROLLBACK_DRILL_COMPLETE",
    }
    if typed_entered != expected_typed_entered:
        errors.append("HANDOFF_TYPED_ENTRY_FLAG_MISMATCH")

    rollback_exercised = row.get("rollback_exercised_in_simulation") is True
    expected_rollback_exercised = status == "ROLLBACK_DRILL_COMPLETE"
    if rollback_exercised != expected_rollback_exercised:
        errors.append("HANDOFF_ROLLBACK_FLAG_MISMATCH")

    requested = _text(row.get("requested_simulated_authority"), limit=200)
    if status == "LEGACY_ONLY_SIMULATED" and requested != LEGACY_DEPENDENCY_AUTHORITY:
        errors.append("HANDOFF_REQUEST_STATUS_MISMATCH")
    if status in {"TYPED_HANDOFF_SIMULATED", "ROLLBACK_DRILL_COMPLETE"} and requested != TYPED_DEPENDENCY_AUTHORITY:
        errors.append("HANDOFF_REQUEST_STATUS_MISMATCH")

    evidence_errors = row.get("errors") if isinstance(row.get("errors"), list) else []
    if status == "BLOCKED" and not evidence_errors:
        errors.append("HANDOFF_BLOCKED_ERRORS_REQUIRED")
    if status != "BLOCKED" and evidence_errors:
        errors.append("HANDOFF_NONBLOCKED_ERRORS_MUST_BE_EMPTY")

    if status != "BLOCKED" and not _text(row.get("source_gate_digest"), limit=128):
        errors.append("HANDOFF_SOURCE_GATE_DIGEST_REQUIRED")
    if status == "ROLLBACK_DRILL_COMPLETE" and not _text(
        row.get("source_rollback_digest"), limit=128
    ):
        errors.append("HANDOFF_SOURCE_ROLLBACK_DIGEST_REQUIRED")
'''
          if source.count(old) != 1:
              raise SystemExit(f"source_exact_block_match_count:{source.count(old)}")
          source_path.write_text(source.replace(old, new, 1), encoding="utf-8")

          test_path = Path("services/agent-service/tests/runtime/test_typed_goal_dependency_handoff_simulation.py")
          tests = test_path.read_text(encoding="utf-8")
          marker = '''\ndef test_stage4c_simulation_module_has_no_runtime_or_domain_import_authority() -> None:\n'''
          inserted = '''\ndef test_integrity_rejects_recomputed_repeated_typed_handoff_sequence() -> None:\n    gate = _ready_gate()\n    simulation = build_dependency_authority_handoff_simulation(\n        gate=gate,\n        rollback=_rollback(gate),\n        exercise_rollback=True,\n    )\n    tampered = deepcopy(simulation)\n    tampered["timeline"].extend(\n        [\n            {\n                "index": 3,\n                "phase": "simulated_typed_handoff",\n                "selected_dependency_authority": TYPED_DEPENDENCY_AUTHORITY,\n                "active_authorities": [TYPED_DEPENDENCY_AUTHORITY],\n                "legacy_active": False,\n                "typed_active": True,\n            },\n            {\n                "index": 4,\n                "phase": "simulated_rollback_to_legacy",\n                "selected_dependency_authority": LEGACY_DEPENDENCY_AUTHORITY,\n                "active_authorities": [LEGACY_DEPENDENCY_AUTHORITY],\n                "legacy_active": True,\n                "typed_active": False,\n            },\n        ]\n    )\n    tampered["simulation_digest"] = _digest(\n        {k: v for k, v in tampered.items() if k != "simulation_digest"}\n    )\n\n    integrity = dependency_authority_handoff_simulation_integrity(tampered)\n\n    assert integrity["ok"] is False\n    assert "HANDOFF_TIMELINE_SHAPE_INVALID" in integrity["errors"]\n    assert "HANDOFF_TYPED_STEP_COUNT_INVALID" in integrity["errors"]\n\n\ndef test_integrity_rejects_recomputed_phase_and_index_drift() -> None:\n    simulation = build_dependency_authority_handoff_simulation(gate=_ready_gate())\n    tampered = deepcopy(simulation)\n    tampered["timeline"][1]["index"] = 7\n    tampered["timeline"][1]["phase"] = "unexpected_phase"\n    tampered["simulation_digest"] = _digest(\n        {k: v for k, v in tampered.items() if k != "simulation_digest"}\n    )\n\n    integrity = dependency_authority_handoff_simulation_integrity(tampered)\n\n    assert integrity["ok"] is False\n    assert "HANDOFF_TIMELINE_STEP_1_INDEX_INVALID" in integrity["errors"]\n    assert "HANDOFF_TIMELINE_SHAPE_INVALID" in integrity["errors"]\n\n\ndef test_integrity_rejects_recomputed_request_status_mismatch() -> None:\n    simulation = build_dependency_authority_handoff_simulation(gate=_ready_gate())\n    tampered = deepcopy(simulation)\n    tampered["requested_simulated_authority"] = LEGACY_DEPENDENCY_AUTHORITY\n    tampered["simulation_digest"] = _digest(\n        {k: v for k, v in tampered.items() if k != "simulation_digest"}\n    )\n\n    integrity = dependency_authority_handoff_simulation_integrity(tampered)\n\n    assert integrity["ok"] is False\n    assert "HANDOFF_REQUEST_STATUS_MISMATCH" in integrity["errors"]\n\n'''
          if tests.count(marker) != 1:
              raise SystemExit(f"test_marker_match_count:{tests.count(marker)}")
          test_path.write_text(tests.replace(marker, inserted + marker, 1), encoding="utf-8")
          PY

          python -m py_compile \
            services/agent-service/src/agent_core/goal_graph/handoff_simulation.py \
            services/agent-service/tests/runtime/test_typed_goal_dependency_handoff_simulation.py
          git diff --check

      - name: Commit hardened protected source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/agent-service/src/agent_core/goal_graph/handoff_simulation.py \
            services/agent-service/tests/runtime/test_typed_goal_dependency_handoff_simulation.py
          git diff --cached --check
          git commit -m "Harden Stage4C handoff timeline invariants"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh protected baseline against hardened source
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          baseline_path = root / "skill-system/registry/product-source-baseline.json"
          source_sha = os.environ["SOURCE_SHA"].strip()
          if len(source_sha) != 40:
              raise SystemExit("source_sha_identity_missing")
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != source_sha:
              raise SystemExit("source_sha_not_current_hardened_head")

          payload = json.loads(baseline_path.read_text(encoding="utf-8"))
          previous = {str(k): str(v) for k, v in (payload.get("files") or {}).items()}
          if int(payload.get("file_count") or 0) != 589 or len(previous) != 589:
              raise SystemExit(
                  f"unexpected_previous_baseline:{payload.get('file_count')}/{len(previous)}"
              )
          protected_roots = tuple(str(v) for v in payload.get("protected_roots") or ())
          if protected_roots != ("services", "web", "contracts"):
              raise SystemExit(f"unexpected_protected_roots:{protected_roots!r}")

          raw = subprocess.check_output(
              ["git", "ls-files", "-z", "--", *protected_roots], cwd=root
          )
          tracked = sorted(item.decode("utf-8") for item in raw.split(b"\0") if item)
          current = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          if len(current) != 589:
              raise SystemExit(f"unexpected_protected_file_count:{len(current)}")

          changed = {
              path
              for path in set(current) & set(previous)
              if current[path] != previous[path]
          }
          added = set(current) - set(previous)
          removed = set(previous) - set(current)
          expected_changed = {
              "services/agent-service/src/agent_core/goal_graph/handoff_simulation.py",
              "services/agent-service/tests/runtime/test_typed_goal_dependency_handoff_simulation.py",
          }
          if changed != expected_changed:
              raise SystemExit("unexpected_changed_existing:" + ",".join(sorted(changed)))
          if added:
              raise SystemExit("unexpected_added:" + ",".join(sorted(added)))
          if removed:
              raise SystemExit("unexpected_removed:" + ",".join(sorted(removed)))

          payload["file_count"] = len(current)
          payload["files"] = dict(sorted(current.items()))
          payload["generated_at"] = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          payload["generated_from"] = "git:" + source_sha
          baseline_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "status": "PASS",
              "file_count": len(current),
              "generated_from": payload["generated_from"],
              "changed": sorted(changed),
              "added": sorted(added),
              "removed": sorted(removed),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Verify refreshed baseline contract
        run: python skill-system/tests/test_product_source_baseline_binding.py

      - name: Commit refreshed baseline and remove one-shot workflow
        run: |
          git rm .github/workflows/typed-goal-stage4c-harden-and-refresh-once.yml
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m "Refresh hardened Stage4C protected baseline"
          git push origin HEAD:feat/typed-goal-graph-foundation-20260814

      - name: Dispatch final quality verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in quality.yml skill-self-validation.yml; do
            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d '{"ref":"feat/typed-goal-graph-foundation-20260814"}'
          done
