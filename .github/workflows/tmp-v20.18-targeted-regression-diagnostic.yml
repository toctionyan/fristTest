name: tmp-v20.18-context-performance-diagnostic

on:
  push:
    branches:
      - tmp/v20.18-governance-recovery-20260814
    paths:
      - .github/workflows/tmp-v20.18-targeted-regression-diagnostic.yml

permissions:
  contents: read

jobs:
  context-performance:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - name: Checkout diagnostic carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Reconstruct baseline and exact 17-path candidate overlay
        shell: bash
        run: |
          set -euo pipefail
          baseline_sha='aeb9a445001d4922e13a032e4cccc12f8ff34e9a'
          candidate_sha='55403a01f957257fbbefead32bcde21b7d866001'
          rm -rf /tmp/v2018-perf-base /tmp/v2018-perf-candidate
          mkdir -p /tmp/v2018-perf-base /tmp/v2018-perf-candidate
          git archive "$baseline_sha" | tar -x -C /tmp/v2018-perf-base
          git archive "$baseline_sha" | tar -x -C /tmp/v2018-perf-candidate
          mapfile -t allowed < <(python3 -c "import json,pathlib; print('\\n'.join(json.loads(pathlib.Path('/tmp/v2018-perf-base/governance/active-change.json').read_text())['allowed_paths']))")
          test "${#allowed[@]}" -eq 17
          for path in "${allowed[@]}"; do
            target="/tmp/v2018-perf-candidate/$path"
            if git cat-file -e "${candidate_sha}:${path}" 2>/dev/null; then
              mkdir -p "$(dirname "$target")"
              git show "${candidate_sha}:${path}" > "$target"
            else
              rm -f "$target"
            fi
          done
          printf '%s\n' "baseline=$baseline_sha" "candidate=$candidate_sha" "allowed_paths=${#allowed[@]}"

      - name: Bootstrap identical locked environments
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r /tmp/v2018-perf-base/deployment/ci/uv-requirements-linux-x86_64.txt
          (cd /tmp/v2018-perf-base/services/agent-service && uv sync --locked --all-groups)
          (cd /tmp/v2018-perf-candidate/services/agent-service && uv sync --locked --all-groups)

      - name: Profile baseline context slice with gate-equivalent coverage
        shell: bash
        env:
          APP_ENV: dev
          APP_PROFILE: local
          AGENT_DB_BACKEND: sqlite
          CHECKPOINT_BACKEND: memory
          AGENT_BUSINESS_ADAPTER: ecommerce_http
          OPENAI_API_KEY: deterministic-test-not-a-real-key
          OPENAI_API_BASE: http://127.0.0.1:9/v1
          OPENAI_MODEL: deterministic-test-model
        run: |
          set -u
          root=/tmp/v2018-perf-base
          cd "$root/services/agent-service"
          export PYTHONPATH="$root/services/agent-service/src:$root/services/agent-service"
          export AGENT_DATABASE_URL="sqlite:///$root/perf.sqlite3"
          export DATABASE_URL="$AGENT_DATABASE_URL"
          export SQLITE_DB_PATH="$root/perf.sqlite3"
          log="${RUNNER_TEMP}/context-baseline.log"
          start=$(date +%s)
          set +e
          timeout --signal=TERM 300s .venv/bin/python -X faulthandler -B -m pytest -q -ra -p no:cacheprovider \
            -m 'not integration and not preprod' \
            --cov=agent_core --cov=app --cov-report="xml:${RUNNER_TEMP}/context-baseline-coverage.xml" \
            --durations=50 --durations-min=0.20 \
            tests/context/test_context_bundle_runtime.py \
            tests/context/test_context_convergence_boundaries.py \
            tests/context/test_conversation_protocol.py \
            tests/context/test_conversation_regression_suite_execution.py \
            tests/context/test_dialogue_counterexamples.py \
            tests/context/test_parameterized_capability_alignment.py \
            tests/context/test_reference_resolution_contract.py \
            tests/context/test_runtime_result_ref_pipeline.py \
            tests/context/test_scenario_topology.py \
            tests/context/test_semantic_goal_coverage_suite_execution.py \
            2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          elapsed=$(( $(date +%s) - start ))
          printf '%s\n' "$rc" > "${RUNNER_TEMP}/context-baseline.rc"
          printf '%s\n' "$elapsed" > "${RUNNER_TEMP}/context-baseline.seconds"
          echo "BASELINE_CONTEXT_RC=$rc ELAPSED=${elapsed}s"

      - name: Profile candidate context slice with gate-equivalent coverage
        shell: bash
        env:
          APP_ENV: dev
          APP_PROFILE: local
          AGENT_DB_BACKEND: sqlite
          CHECKPOINT_BACKEND: memory
          AGENT_BUSINESS_ADAPTER: ecommerce_http
          OPENAI_API_KEY: deterministic-test-not-a-real-key
          OPENAI_API_BASE: http://127.0.0.1:9/v1
          OPENAI_MODEL: deterministic-test-model
        run: |
          set -u
          root=/tmp/v2018-perf-candidate
          cd "$root/services/agent-service"
          export PYTHONPATH="$root/services/agent-service/src:$root/services/agent-service"
          export AGENT_DATABASE_URL="sqlite:///$root/perf.sqlite3"
          export DATABASE_URL="$AGENT_DATABASE_URL"
          export SQLITE_DB_PATH="$root/perf.sqlite3"
          log="${RUNNER_TEMP}/context-candidate.log"
          start=$(date +%s)
          set +e
          timeout --signal=TERM 300s .venv/bin/python -X faulthandler -B -m pytest -q -ra -p no:cacheprovider \
            -m 'not integration and not preprod' \
            --cov=agent_core --cov=app --cov-report="xml:${RUNNER_TEMP}/context-candidate-coverage.xml" \
            --durations=50 --durations-min=0.20 \
            tests/context/test_context_bundle_runtime.py \
            tests/context/test_context_convergence_boundaries.py \
            tests/context/test_conversation_protocol.py \
            tests/context/test_conversation_regression_suite_execution.py \
            tests/context/test_dialogue_counterexamples.py \
            tests/context/test_parameterized_capability_alignment.py \
            tests/context/test_reference_resolution_contract.py \
            tests/context/test_runtime_result_ref_pipeline.py \
            tests/context/test_scenario_topology.py \
            tests/context/test_semantic_goal_coverage_suite_execution.py \
            2>&1 | tee "$log"
          rc=${PIPESTATUS[0]}
          set -e
          elapsed=$(( $(date +%s) - start ))
          printf '%s\n' "$rc" > "${RUNNER_TEMP}/context-candidate.rc"
          printf '%s\n' "$elapsed" > "${RUNNER_TEMP}/context-candidate.seconds"
          echo "CANDIDATE_CONTEXT_RC=$rc ELAPSED=${elapsed}s"

      - name: Stage performance evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p context-performance
          for stem in context-baseline context-candidate; do
            cp -f "${RUNNER_TEMP}/${stem}.log" context-performance/ 2>/dev/null || true
            cp -f "${RUNNER_TEMP}/${stem}.rc" context-performance/ 2>/dev/null || true
            cp -f "${RUNNER_TEMP}/${stem}.seconds" context-performance/ 2>/dev/null || true
            cp -f "${RUNNER_TEMP}/${stem}-coverage.xml" context-performance/ 2>/dev/null || true
          done
          printf '%s\n' 'aeb9a445001d4922e13a032e4cccc12f8ff34e9a' > context-performance/baseline-source-sha.txt
          printf '%s\n' '55403a01f957257fbbefead32bcde21b7d866001' > context-performance/candidate-source-sha.txt

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v20.18-context-performance-diagnostic
          path: context-performance
          if-no-files-found: error
