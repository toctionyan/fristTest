name: dependency-proof-authority-fix1-carrier

on:
  push:
    branches:
      - fix/dependency-proof-authority-reducer-20260816

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-proof-authority-reducer-20260816
          fetch-depth: 0

      - name: Align historical tests with proof authority
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          skill_test = ROOT / "skill-system/tests/test_semantic_dependency_repair_feedback.py"
          replace_once(
              skill_test,
              '''from agent_core.lifecycle.tool_execution_runtime import _tool_result_message  # noqa: E402\n''',
              '''from agent_core.lifecycle.tool_execution_runtime import _tool_result_message  # noqa: E402\nfrom agent_core.goal_graph.dependency_alignment import (  # noqa: E402\n    alignment_dependency_authority_details,\n    apply_alignment_dependency_proof,\n)\n''',
              "skill authority imports",
          )
          helper_marker = '''class _InjectedVerifier:\n    def __init__(self, verdict: GoalAlignmentVerdict) -> None:\n        self.verdict = verdict\n\n    def verify(self, **_kwargs):\n        return self.verdict\n\n\n'''
          helper = helper_marker + '''def _close_dependency_authority(\n    *,\n    user_text: str,\n    goals: list[dict],\n    legacy_details: dict,\n    decisions: list[dict],\n) -> dict:\n    ledger, _ = apply_alignment_dependency_proof(\n        None,\n        user_text=user_text,\n        goals=goals,\n        details={\n            "dependency_authority": "independent_goal_alignment",\n            "dependency_proof_complete": True,\n            "dependency_graph_match": legacy_details.get("dependency_graph_match"),\n            "dependency_pair_decisions": decisions,\n        },\n        phase="candidate_blind_dependency_authority_closure",\n    )\n    return {\n        **legacy_details,\n        **alignment_dependency_authority_details(ledger, goals=goals),\n    }\n\n\n'''
          replace_once(skill_test, helper_marker, helper, "skill authority helper")

          first_old = '''        self.assertEqual(error, "goal_alignment_dependency_graph_mismatch")\n\n        feedback = _alignment_repair_feedback(\n            GoalAlignmentVerdict(\n                "incomplete",\n                ("查一下键盘订单", "再看看它能不能退款"),\n                (),\n                "goal_alignment_dependency_graph_mismatch",\n                "model",\n                True,\n                details,\n            )\n        )["independent_verifier_feedback"]\n'''
          first_new = '''        self.assertEqual(error, "goal_alignment_dependency_graph_mismatch")\n        details = _close_dependency_authority(\n            user_text=text,\n            goals=goals,\n            legacy_details=details,\n            decisions=[{\n                "goal_a_id": "g1",\n                "goal_b_id": "g2",\n                "relation": "b_depends_on_a",\n                "basis_kind": "result_reference",\n                "basis_span": "它",\n            }],\n        )\n\n        feedback = _alignment_repair_feedback(\n            GoalAlignmentVerdict(\n                "incomplete",\n                ("查一下键盘订单", "再看看它能不能退款"),\n                (),\n                "goal_alignment_dependency_graph_mismatch",\n                "model",\n                True,\n                details,\n            )\n        )["independent_verifier_feedback"]\n'''
          replace_once(skill_test, first_old, first_new, "positive repair authority")

          second_old = '''        self.assertEqual(error, "goal_alignment_dependency_graph_mismatch")\n\n        feedback = _alignment_repair_feedback(\n            GoalAlignmentVerdict(\n                "incomplete",\n                ("查一下鼠标订单", "帮我申请退款"),\n                (),\n                "goal_alignment_dependency_graph_mismatch",\n                "model",\n                True,\n                details,\n            )\n        )["independent_verifier_feedback"]\n'''
          second_new = '''        self.assertEqual(error, "goal_alignment_dependency_graph_mismatch")\n        details = _close_dependency_authority(\n            user_text=text,\n            goals=goals,\n            legacy_details=details,\n            decisions=[{\n                "goal_a_id": "g1",\n                "goal_b_id": "g2",\n                "relation": "independent",\n            }],\n        )\n\n        feedback = _alignment_repair_feedback(\n            GoalAlignmentVerdict(\n                "incomplete",\n                ("查一下鼠标订单", "帮我申请退款"),\n                (),\n                "goal_alignment_dependency_graph_mismatch",\n                "model",\n                True,\n                details,\n            )\n        )["independent_verifier_feedback"]\n'''
          replace_once(skill_test, second_old, second_new, "negative repair authority")

          injected_old = '''        self.assertEqual(error, "goal_alignment_dependency_graph_mismatch")\n        state = {\n            "current_user_input": text,\n            "goal_alignment_verifier": _InjectedVerifier(\n'''
          injected_new = '''        self.assertEqual(error, "goal_alignment_dependency_graph_mismatch")\n        proof_goals = [\n            _goal("g1", "查一下键盘订单", []),\n            _goal("g2", "再看看它能不能退款", []),\n        ]\n        details = _close_dependency_authority(\n            user_text=text,\n            goals=proof_goals,\n            legacy_details=details,\n            decisions=[{\n                "goal_a_id": "g1",\n                "goal_b_id": "g2",\n                "relation": "b_depends_on_a",\n                "basis_kind": "result_reference",\n                "basis_span": "它",\n            }],\n        )\n        state = {\n            "current_user_input": text,\n            "goal_alignment_verifier": _InjectedVerifier(\n'''
          replace_once(skill_test, injected_old, injected_new, "injected authority details")

          # Preserve an explicit regression: raw complete/matching proof without
          # maturity authority must not become writer repair authority.
          marker = '''    def test_alignment_rejection_path_includes_grounded_feedback_hook(self) -> None:\n'''
          new_test = '''    def test_raw_complete_matching_dependency_proof_is_not_repair_authority(self) -> None:\n        details = {\n            "dependency_authority": "independent_goal_alignment",\n            "dependency_proof_complete": True,\n            "dependency_graph_match": False,\n            "dependency_edges": [{\n                "dependent_goal_id": "g2",\n                "requires_result_of_goal_id": "g1",\n                "basis_kind": "result_reference",\n                "basis_span": "它",\n            }],\n            "declared_dependency_edges": [],\n        }\n        verdict = GoalAlignmentVerdict(\n            "incomplete",\n            ("查一下键盘订单", "再看看它能不能退款"),\n            (),\n            "goal_alignment_dependency_graph_mismatch",\n            "model",\n            True,\n            details,\n        )\n        self.assertEqual(_alignment_repair_feedback(verdict), {})\n\n'''
          replace_once(skill_test, marker, new_test + marker, "raw proof no authority regression")

          wp08 = ROOT / "skill-system/tests/test_wp08_final_product_closure_repair.py"
          replace_once(
              wp08,
              '''        corrected = _response({\n            "verdict": "exact",\n            "evidence_spans": ["查一下键盘订单", "再看看它能不能退款"],\n            "missing_spans": [],\n            "dependency_decisions": [decision],\n            "reason_code": "target_identity_and_result_reference_are_not_scope_constraints",\n        })\n        with patch("agent_core.config.get_model", return_value=object()), patch(\n            "agent_core.model_calls.invoke_model", side_effect=[first, false_scope_claim, corrected]\n        ) as invoke:\n''',
              '''        corrected = _response({\n            "verdict": "exact",\n            "evidence_spans": ["查一下键盘订单", "再看看它能不能退款"],\n            "missing_spans": [],\n            "dependency_decisions": [decision],\n            "reason_code": "target_identity_and_result_reference_are_not_scope_constraints",\n        })\n        closed = _response({\n            "verdict": "exact",\n            "evidence_spans": ["查一下键盘订单", "再看看它能不能退款"],\n            "missing_spans": [],\n            "dependency_decisions": [decision],\n            "reason_code": "dependency_authority_closed",\n        })\n        with patch("agent_core.config.get_model", return_value=object()), patch(\n            "agent_core.model_calls.invoke_model", side_effect=[first, false_scope_claim, corrected, closed]\n        ) as invoke:\n''',
              "wp08 fourth closure response",
          )
          replace_once(
              wp08,
              '''        self.assertEqual(invoke.call_count, 3)\n        self.assertTrue(verdict.exact)\n        self.assertTrue(verdict.details["dependency_graph_match"])\n        self.assertEqual(verdict.details["dependency_edges"], [edge])\n        self.assertEqual(\n            verdict.details["verifier_repair_kind"],\n            "candidate_blind_dependency_scope_constraint_reaudit",\n        )\n        repair_message = invoke.call_args_list[2].kwargs["payload"][-1].content\n        self.assertIn("Object identity, member naming, ordinary target selection", repair_message)\n        self.assertIn("current-turn Goal result", repair_message)\n        self.assertIn("remain incomplete", repair_message)\n''',
              '''        self.assertEqual(invoke.call_count, 4)\n        self.assertTrue(verdict.exact)\n        self.assertTrue(verdict.details["dependency_graph_match"])\n        self.assertEqual(verdict.details["dependency_edges"], [edge])\n        self.assertEqual(\n            verdict.details["verifier_repair_kind"],\n            "candidate_blind_dependency_authority_closure",\n        )\n        self.assertTrue(verdict.details["dependency_authority_complete"])\n        self.assertTrue(verdict.details["dependency_authority_graph_match"])\n        repair_message = invoke.call_args_list[2].kwargs["payload"][-1].content\n        self.assertIn("Object identity, member naming, ordinary target selection", repair_message)\n        self.assertIn("current-turn Goal result", repair_message)\n        self.assertIn("remain incomplete", repair_message)\n        closure_message = invoke.call_args_list[3].kwargs["payload"][-1].content\n        self.assertIn("complete/matching alone is not authority", closure_message)\n''',
              "wp08 closure assertions",
          )

          release53 = ROOT / "services/agent-service/tests/runtime/test_release53_blind_semantic_grounding_adjudication.py"
          replace_once(
              release53,
              '''def _goal(goal_id: str, span: str, *, output_id: str) -> dict:\n''',
              '''def _goal(\n    goal_id: str,\n    span: str,\n    *,\n    output_id: str,\n    output_span: str | None = None,\n) -> dict:\n''',
              "release53 goal output span signature",
          )
          replace_once(
              release53,
              '''                "evidence_span": span,\n            }],\n''',
              '''                "evidence_span": output_span or span,\n            }],\n''',
              "release53 output span body",
          )
          replace_once(
              release53,
              '''        "basis_span": "record B",\n''',
              '''        "basis_span": "that result",\n''',
              "release53 relation-only basis",
          )
          old_conflict_start = '''def test_semantic_reaudit_cannot_certify_provisional_false_dependency_absence() -> None:\n    text = "Inspect record A, and summarize record B"\n    calls = [\n        _first_exact(),\n        _blind_ungrounded_incomplete(),\n'''
          new_conflict_start = '''def test_semantic_reaudit_cannot_certify_provisional_false_dependency_absence() -> None:\n    text = "Inspect record A, then summarize that result for record B"\n    goals = [\n        _goal("g1", "Inspect record A", output_id="semantic.one"),\n        _goal(\n            "g2",\n            "summarize that result for record B",\n            output_id="semantic.two",\n            output_span="record B",\n        ),\n    ]\n    calls = [\n        _response({\n            "verdict": "exact",\n            "evidence_spans": ["Inspect record A", "summarize that result for record B"],\n            "missing_spans": [],\n            "dependency_edges": [],\n            "reason_code": "candidate_exact",\n        }),\n        _response({\n            "verdict": "incomplete",\n            "evidence_spans": ["Inspect record A", "summarize that result for record B"],\n            "missing_spans": [],\n            "dependency_decisions": _independent_pair(),\n            "reason_code": "semantic_coverage_gap",\n        }),\n'''
          replace_once(release53, old_conflict_start, new_conflict_start, "release53 conflict setup")
          # Update the two response evidence lists inside the conflict block only.
          text = release53.read_text(encoding="utf-8")
          start = text.index("def test_semantic_reaudit_cannot_certify_provisional_false_dependency_absence")
          end = text.index("\ndef test_release53_semantic_grounding_adjudication_branch_is_domain_neutral", start)
          block = text[start:end]
          block = block.replace(
              '["Inspect record A", "summarize record B"]',
              '["Inspect record A", "summarize that result for record B"]',
          )
          block = block.replace("goals=_goals(),", "goals=goals,")
          block = block.replace('"basis_span": "record B",', '"basis_span": "that result",')
          release53.write_text(text[:start] + block + text[end:], encoding="utf-8")

          # Recompute protected source baseline for every tracked file and add no
          # workflow file: the carrier deletes itself before commit.
          carrier = ROOT / ".github/workflows/dependency-proof-authority-fix1-carrier.yml"
          carrier.unlink()
          baseline_path = ROOT / "skill-system/registry/product-source-baseline.json"
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          files = dict(baseline.get("files") or {})
          for rel in list(files):
              path = ROOT / rel
              if path.is_file():
                  files[rel] = sha256(path.read_bytes()).hexdigest()
          baseline["files"] = dict(sorted(files.items()))
          baseline["file_count"] = len(files)
          baseline_path.write_text(json.dumps(baseline, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Compile patched tests
        run: |
          python -m py_compile \
            skill-system/tests/test_semantic_dependency_repair_feedback.py \
            skill-system/tests/test_wp08_final_product_closure_repair.py \
            services/agent-service/tests/runtime/test_release53_blind_semantic_grounding_adjudication.py

      - name: Run focused control-plane regressions
        run: |
          cd services/agent-service
          python -m pip install -q pytest
          PYTHONPATH=src python -m pytest -q \
            ../../skill-system/tests/test_semantic_dependency_repair_feedback.py \
            ../../skill-system/tests/test_wp08_final_product_closure_repair.py \
            tests/runtime/test_dependency_proof_authority.py \
            tests/runtime/test_dependency_alignment_authority.py \
            tests/runtime/test_release52_dependency_independence_adjudication.py \
            tests/runtime/test_release53_blind_semantic_grounding_adjudication.py

      - name: Commit regression alignment
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(semantic): bind repair feedback to mature dependency authority"
          git push origin HEAD:fix/dependency-proof-authority-reducer-20260816
