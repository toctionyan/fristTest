name: tmp-m2-resilient-fixture-closure

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'long-task-execution-control-plane-m2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact M2 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: long-task-execution-control-plane-m2
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Bootstrap locked validation environment
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups
      - name: Close resilient fixture runtime dependency and reproduce exact failures
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('services/agent-service/tests/architecture/test_resilient_repair_task_run.py')
          text = path.read_text(encoding='utf-8')
          old = '''        "issue_state.py",\n        "task_run.py",\n    ):'''
          new = '''        "issue_state.py",\n        "task_run.py",\n        "execution_runtime.py",\n    ):'''
          if old not in text:
              if new not in text:
                  raise SystemExit('resilient fixture controller-list anchor missing')
          else:
              if text.count(old) != 1:
                  raise SystemExit('resilient fixture controller-list anchor ambiguous')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          cd services/agent-service
          .venv/bin/python -m pytest \
            tests/architecture/test_resilient_repair_task_run.py::test_interrupted_fixer_is_reconciled_without_replaying_the_fixer \
            tests/architecture/test_resilient_repair_task_run.py::test_interrupted_fixer_with_out_of_scope_drift_blocks_without_replay \
            tests/architecture/test_resilient_repair_task_run.py::test_no_progress_fixer_is_bounded_across_process_restarts \
            -q
          cd ../..
          git diff --check
      - name: Commit only validated fixture closure
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-m2-resilient-fixture-closure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/agent-service/tests/architecture/test_resilient_repair_task_run.py .github/workflows/tmp-m2-resilient-fixture-closure.yml
          git commit -m 'Include shared runtime in resilient repair fixture'
          git push origin HEAD:long-task-execution-control-plane-m2
