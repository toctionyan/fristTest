name: wp08-attempt5-fixture-migrate-v3-once

on:
  push:
    branches:
      - fix/wp08-attempt5-canonical-semantic-certification-20260813
    paths:
      - .github/workflows/wp08-attempt5-fixture-migrate-v3-once.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Migrate final stale semantic fixtures
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/agent-service/tests/runtime/test_wp08_attempt6_release_repairs.py')
          text = path.read_text(encoding='utf-8')

          def replace_fn(source: str, name: str, body: str) -> str:
              marker = f'def {name}() -> None:'
              start = source.find(marker)
              if start < 0:
                  raise SystemExit(f'missing function {name}')
              end = source.find('\ndef ', start + len(marker))
              if end < 0:
                  raise SystemExit(f'missing function boundary after {name}')
              return source[:start] + body.rstrip() + '\n\n' + source[end + 1:]

          text = replace_fn(text, 'test_semantic_oracle_accepts_optional_legacy_goal_type_when_effect_matches', '''def test_semantic_oracle_accepts_optional_legacy_goal_type_when_effect_matches() -> None:
              smoke = _load_semantic_smoke()
              oracle = [{
                  "oracle_id": "g1", "goal_type": "query", "evidence_span": "查一下键盘订单",
                  "required": True, "depends_on": [],
                  "accepted_output_sets": [["order.collection"]],
              }]
              goals = [{
                  "goal_id": "m1", "goal_type": "", "evidence_span": "查一下键盘订单",
                  "required": True, "depends_on": [],
                  "requested_effect": {"requested_outputs": [{"output_id": "order.collection"}]},
              }]
              smoke._match_oracle(case_id="optional-goal-type", oracle=oracle, goals=goals)''')

          text = replace_fn(text, 'test_semantic_oracle_rejects_wrong_authoritative_requested_effect', '''def test_semantic_oracle_rejects_wrong_authoritative_requested_effect() -> None:
              smoke = _load_semantic_smoke()
              oracle = [{
                  "oracle_id": "g1", "goal_type": "query", "evidence_span": "查一下键盘订单",
                  "required": True, "depends_on": [],
                  "accepted_output_sets": [["order.collection"]],
              }]
              goals = [{
                  "goal_id": "m1", "goal_type": "query", "evidence_span": "查一下键盘订单",
                  "required": True, "depends_on": [],
                  "requested_effect": {"requested_outputs": [{"output_id": "shipment.tracking"}]},
              }]
              with pytest.raises(RuntimeError, match="accepted_outputs"):
                  smoke._match_oracle(case_id="wrong-effect", oracle=oracle, goals=goals)''')

          path.write_text(text, encoding='utf-8')
          PY
      - name: Refresh exact protected baseline
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          protected_roots = tuple(str(v) for v in payload.get('protected_roots') or ('services', 'web', 'contracts'))
          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', *protected_roots], cwd=root)
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          payload['file_count'] = len(tracked)
          payload['files'] = {rel: hashlib.sha256((root / rel).read_bytes()).hexdigest() for rel in tracked}
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()
          payload['generated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          payload['generated_from'] = f'git:{head}'
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit migration and remove temporary workflow
        shell: bash
        run: |
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git rm .github/workflows/wp08-attempt5-fixture-migrate-v3-once.yml
          git add services/agent-service/tests/runtime/test_wp08_attempt6_release_repairs.py skill-system/registry/product-source-baseline.json
          git commit -m 'Migrate final WP08 semantic smoke fixtures'
          git push origin HEAD:fix/wp08-attempt5-canonical-semantic-certification-20260813
