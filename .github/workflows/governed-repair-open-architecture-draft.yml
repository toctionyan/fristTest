name: governed-repair-open-architecture-draft

on:
  push:
    branches:
      - architecture/governed-repair-rca-write-grant-20260816
    paths:
      - .github/governed-repair-open-architecture-draft-trigger

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  validate-and-publish-draft:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: architecture/governed-repair-rca-write-grant-20260816
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'

      - name: Assert all prior migration authority is gone
        shell: bash
        run: |
          set -euo pipefail
          for path in \
            .github/workflows/governed-repair-finalize-architecture.yml \
            .github/governed-repair-finalize-architecture-trigger \
            .github/workflows/governed-repair-architecture-cleanup.yml \
            .github/workflows/governed-repair-architecture-fixup.yml \
            .github/workflows/governed-repair-lifecycle-contract-migration.yml \
            .github/workflows/governed-repair-baseline-scope-migration.yml \
            .github/workflows/governed-repair-required-guard-migration.yml \
            .github/workflows/governed-repair-architecture-validation.yml \
            .github/workflows/governed-repair-architecture-validation-v2.yml \
            scripts/migrate_governed_repair_required_guard.py; do
            if [[ -e "${path}" ]]; then
              echo "temporary authority survived: ${path}" >&2
              exit 1
            fi
          done
          test ! -e scripts/github_repair_stage3_complete.py
          test ! -e .github/workflows/b28-product-baseline-refresh.yml

      - name: Bootstrap locked validation environment
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups

      - name: Run mechanical architecture and protected-baseline gates
        shell: bash
        run: |
          set -euo pipefail
          services/agent-service/.venv/bin/python -B scripts/verify_governed_repair_architecture.py
          services/agent-service/.venv/bin/python -B scripts/verify_product_source_baseline.py \
            --workspace . --output /tmp/product-source-baseline.json
          services/agent-service/.venv/bin/python - <<'PY'
          import json
          payload = json.load(open('/tmp/product-source-baseline.json', encoding='utf-8'))
          assert payload['status'] == 'PASS', payload
          assert payload['drift_paths'] == [], payload
          PY

      - name: Run complete Skill control-plane unit suite
        shell: bash
        run: |
          set -euo pipefail
          services/agent-service/.venv/bin/python -B -m unittest discover -v \
            -s skill-system/tests -p 'test_*.py'

      - name: Parse permanent workflow contracts
        shell: bash
        run: |
          set -euo pipefail
          services/agent-service/.venv/bin/python - <<'PY'
          import pathlib, yaml
          for raw in (
              '.github/workflows/governed-ci-repair-stage2.yml',
              '.github/workflows/governed-ci-repair-stage3.yml',
              '.github/workflows/governed-ci-repair-governance.yml',
              '.github/workflows/quality.yml',
          ):
              payload = yaml.safe_load(pathlib.Path(raw).read_text(encoding='utf-8'))
              assert isinstance(payload, dict), raw
              assert isinstance(payload.get('jobs'), dict) and payload['jobs'], raw
          PY
          git diff --check

      - name: Remove this one-shot publisher and reverify clean tree
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/governed-repair-open-architecture-draft.yml
          git rm .github/governed-repair-open-architecture-draft-trigger
          services/agent-service/.venv/bin/python -B scripts/verify_governed_repair_architecture.py
          git diff --check

      - name: Commit exact clean architecture head
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m 'chore(repair): remove final architecture publisher'
            git push origin HEAD:architecture/governed-repair-rca-write-grant-20260816
          fi
          echo "head_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create or update Draft architecture PR only
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          branch='architecture/governed-repair-rca-write-grant-20260816'
          existing=$(gh pr list --state open --head "${branch}" --json url,isDraft,number --jq '.[0] // empty')
          body=$(cat <<EOF
          ## Governed repair harness architecture

          This Draft implements the approved fail-closed repair architecture. It does **not** merge or deploy anything.

          ### Authority and lifecycle
          - Canonical governed-repair lifecycle contract is the structural source for states/gates/protected authority.
          - Mandatory read-only RCA precedes every write grant.
          - Write authority is an exact path allowlist bound to repository/run/attempt/head/failure signature/RCA fingerprint.
          - The Patch Agent cannot edit tests/oracles, workflows, governance, Skill control plane, baselines, dependencies, secrets, merge state, deploy state, or production closure.
          - Repeating the same deterministic failure twice revokes write authority and requires architecture re-plan plus a new RCA.

          ### Permanent machine memory
          - Automatic repair requires at least one existing machine guard in the original failure evidence.
          - Those guard IDs are immutable write-grant authority.
          - Independent Stage 3 must re-run every required guard as a mandatory Quick gate and observe PASS; otherwise repair blocks with permanent_guard_not_reverified.
          - Failures without machine-gate evidence remain non-repairable until a separately governed permanent guard exists.

          ### G0-G6
          - G0 Scope/Authority
          - G1 Contract Projection
          - G2 Semantic Invariant + permanent guard re-verification
          - G3 Mutation/Drift
          - G4 Final Authority
          - G5 Integration Certification
          - G6 Governance → protected baseline acceptance → exact-head quality + skill-self-validation

          ### Governance sequencing
          - Stage 3 publishes source-only Draft repair content; it cannot refresh the protected baseline.
          - Governance must close explicitly before baseline acceptance.
          - Baseline acceptance may update only the baseline registry and only for the exact governed protected-source drift.
          - G6 requires normal \`quality\` and \`skill-self-validation\` to pass on the exact baseline-acceptance commit while the PR is still Draft.
          - Only then may automation convert the PR to **Ready for review**.
          - Automatic merge: **disabled**.
          - Deployment: **disabled**.
          - \`production_closed=false\`.

          Clean architecture head staged by this publisher: \`${HEAD_SHA}\`.
          EOF
          )
          if [[ -n "${existing}" ]]; then
            pr_url=$(jq -r '.url' <<<"${existing}")
            is_draft=$(jq -r '.isDraft' <<<"${existing}")
            if [[ "${is_draft}" != "true" ]]; then
              echo "existing architecture PR is unexpectedly non-Draft" >&2
              exit 1
            fi
            gh pr edit "${pr_url}" --body "${body}"
          else
            pr_url=$(gh pr create --draft --base main --head "${branch}" \
              --title 'feat(repair): RCA-bound governed repair lifecycle' \
              --body "${body}")
          fi
          state=$(gh pr view "${pr_url}" --json isDraft,state,headRefOid,baseRefName,headRefName)
          jq -e --arg sha "${HEAD_SHA}" --arg head "${branch}" '
            .state == "OPEN"
            and .isDraft == true
            and .headRefOid == $sha
            and .baseRefName == "main"
            and .headRefName == $head
          ' <<<"${state}" >/dev/null
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"

      - name: Record non-merge publication boundary
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          HEAD_SHA: ${{ steps.commit.outputs.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr comment "${PR_URL}" --body "Architecture Draft published at exact head \`${HEAD_SHA}\`. Final disposition remains review-only: no automatic merge, no deployment, and production_closed=false. Normal PR CI must provide the next independent evidence."
