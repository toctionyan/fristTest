name: temporary-wp08-collection-boundary-validation
# rerun after preserving one-or-collection fail-closed semantics

"on":
  push:
    branches:
      - fix/wp08-collection-singleton-compiler-boundary-20260813
    paths:
      - .github/workflows/tmp-wp08-collection-boundary-validation.yml

permissions:
  contents: write

jobs:
  validate-and-refresh-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/wp08-collection-singleton-compiler-boundary-20260813
          fetch-depth: 1
          clean: true
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Run focused deterministic target authority tests
        run: >-
          cd services/agent-service &&
          PYTHONPATH=src uv run pytest -q
          tests/runtime/test_deterministic_target_compiler.py
          tests/runtime/test_execution_target_authority_cutover.py
      - name: Refresh protected product-source baseline for repaired owner
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          owned = "services/agent-service/src/agent_core/runtime/target_compiler.py"
          baseline_path = Path("skill-system/registry/product-source-baseline.json")
          payload = json.loads(baseline_path.read_text(encoding="utf-8"))
          payload["files"][owned] = hashlib.sha256(Path(owned).read_bytes()).hexdigest()
          baseline_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(owned, payload["files"][owned])
          PY
          git diff --check
          git diff -- skill-system/registry/product-source-baseline.json
      - name: Commit baseline refresh to repair branch
        run: |
          if git diff --quiet -- skill-system/registry/product-source-baseline.json; then
            echo "baseline already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skill-system/registry/product-source-baseline.json
          git commit -m "Refresh target compiler product-source baseline"
          git push origin HEAD:fix/wp08-collection-singleton-compiler-boundary-20260813
