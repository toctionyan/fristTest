name: governed-repair-architecture-cleanup

on:
  push:
    branches:
      - architecture/governed-repair-rca-write-grant-20260816
    paths:
      - .github/governed-repair-architecture-cleanup-trigger

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: architecture/governed-repair-rca-write-grant-20260816
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Remove pre-governance completion bypass and protect governance scripts
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from __future__ import annotations
          import ast
          from pathlib import Path

          def offsets(text: str) -> list[int]:
              result = [0]
              for line in text.splitlines(keepends=True):
                  result.append(result[-1] + len(line))
              return result

          stage3 = Path('scripts/github_repair_stage3.py')
          text = stage3.read_text(encoding='utf-8')
          tree = ast.parse(text)
          node = next(
              (
                  item for item in tree.body
                  if isinstance(item, ast.FunctionDef)
                  and item.name == 'complete_publication'
              ),
              None,
          )
          if node is None or not node.body:
              raise SystemExit('complete_publication function not found')
          off = offsets(text)
          body_start = off[node.body[0].lineno - 1] + node.body[0].col_offset
          body_end = off[node.end_lineno - 1] + node.end_col_offset
          replacement = (
              'raise Stage3Error("deprecated completion path: use '
              'github_repair_stage3_record_publication.py, governance closure, '
              'baseline acceptance, and exact-head G6")'
          )
          text = text[:body_start] + replacement + text[body_end:]
          ast.parse(text)
          if 'task.complete(' in ast.get_source_segment(text, ast.parse(text).body[
              next(i for i, item in enumerate(ast.parse(text).body)
                   if isinstance(item, ast.FunctionDef) and item.name == 'complete_publication')
          ]) or '':
              raise SystemExit('pre-governance task.complete survived')
          stage3.write_text(text, encoding='utf-8')

          ingest = Path('scripts/github_failure_ingest.py')
          source = ingest.read_text(encoding='utf-8')
          anchor = '''    normalized = _normalize_repo_path(path)\n    if not normalized or normalized in PROTECTED_EXACT:\n        return False\n'''
          replacement = '''    normalized = _normalize_repo_path(path)\n    if not normalized or normalized in PROTECTED_EXACT:\n        return False\n    if (\n        normalized.startswith("scripts/github_repair_")\n        or normalized == "scripts/github_stage2_handoff.py"\n        or normalized == "scripts/verify_product_source_baseline.py"\n    ):\n        return False\n'''
          if source.count(anchor) != 1:
              raise SystemExit('failure-ingest safe-candidate anchor is not unique')
          source = source.replace(anchor, replacement, 1)
          ast.parse(source)
          ingest.write_text(source, encoding='utf-8')
          PY
          python -m py_compile scripts/github_repair_stage3.py scripts/github_failure_ingest.py
      - name: Remove temporary cleanup authority
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/governed-repair-architecture-cleanup.yml
          git rm .github/governed-repair-architecture-cleanup-trigger
          git diff --check
      - name: Commit permanent cleanup
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(repair): remove pre-governance completion bypass'
          git push origin HEAD:architecture/governed-repair-rca-write-grant-20260816
