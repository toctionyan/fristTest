name: temporary-run-goal-boundary-repair
run-name: one-time mixed-workflow expectation repair v2

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-run-goal-boundary-repair.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: temporary-run-goal-boundary-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TARGET_BRANCH: agent/fix-cancel-refund-goal-boundary
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/fix-cancel-refund-goal-boundary
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Apply exact mixed-workflow expectation repair
        run: |
          set -euo pipefail
          python -B scripts/repair_cancel_refund_goal_boundary.py
          python -m json.tool services/agent-service/tests/context/strong_context_cases/semantic_goal_coverage_suite_v20_4.json >/dev/null
          git diff --check
          test -n "$(git status --porcelain services/agent-service/tests/context/strong_context_cases/semantic_goal_coverage_suite_v20_4.json)"
      - name: Commit repaired catalog to bounded branch
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/agent-service/tests/context/strong_context_cases/semantic_goal_coverage_suite_v20_4.json
          git commit -m "Align mixed workflow cardinality and status"
          git push origin "HEAD:${TARGET_BRANCH}"
      - name: Record bounded repair outcome
        if: always()
        continue-on-error: true
        run: |
          gh issue comment 33 --body "mixed-workflow-expectation-repair:${GITHUB_RUN_ID}

Outcome: ${{ job.status }}
Branch: ${TARGET_BRANCH}
Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
