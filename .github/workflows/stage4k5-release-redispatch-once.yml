name: stage4k5-release-redispatch-once

on:
  push:
    branches:
      - governance/stage4k5-release-redispatch-20260815
    paths:
      - .github/workflows/stage4k5-release-redispatch-once.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch-current-main-release:
    if: github.repository == 'toctionyan/fristTest' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout one-shot dispatcher branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: governance/stage4k5-release-redispatch-20260815
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Bind redispatch to exact repaired Stage4K5-A main
        env:
          EXPECTED_MAIN_SHA: 7549adbb88da6c0a1ef7eea622fbf98a431416b9
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          ACTUAL_MAIN_SHA="$(git rev-parse origin/main)"
          test "${ACTUAL_MAIN_SHA}" = "${EXPECTED_MAIN_SHA}"
          python3 -B - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('governance/active-change.json').read_text(encoding='utf-8'))
          assert data['change_id'] == 'certify-stage4k5-production-dependency-authority-preflight'
          assert data['target_kind'] == 'certification'
          assert data['writer_role'] == 'none'
          assert data['status'] == 'draft'
          assert data['result'] == 'PENDING'
          assert data['minimum_quality_mode'] == 'release'
          assert data['initial_source_fingerprint'] == 'a2ed705dc3f0d88f2e06268b384e4287e92b5d4ea1f1a854fcc9d911d22438b0'
          print('stage4k5_release_redispatch_preconditions=PASS')
          PY

      - name: Remove one-shot redispatcher before starting protected release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage4k5-release-redispatch-once.yml
          git diff --cached --check
          git commit -m "Remove Stage4K5 release redispatcher"
          git push origin HEAD:governance/stage4k5-release-redispatch-20260815
          echo "clean_head=$(git rev-parse HEAD)"

      - name: Dispatch protected production certification on exact repaired main
        env:
          GH_TOKEN: ${{ github.token }}
          MAIN_SHA: 7549adbb88da6c0a1ef7eea622fbf98a431416b9
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "${MAIN_SHA}"
          curl --fail-with-body -L \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            -d '{"ref":"main","inputs":{"provider":"deepseek","model":"deepseek-v4-flash","embedding_model":"text-embedding-v4","embedding_dimension":"1024"}}'
          echo "dispatched_main_sha=${MAIN_SHA}"
          echo "provider=deepseek"
          echo "model=deepseek-v4-flash"
          echo "embedding_model=text-embedding-v4"
          echo "embedding_dimension=1024"
