name: release55-candidate-verification

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release55-candidate-verification.yml

permissions:
  contents: read

jobs:
  clean-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Reconstruct exact pre-repair baseline workspace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          clean="${RUNNER_TEMP}/release55-base"
          rm -rf "$clean"
          mkdir -p "$clean"
          git archive --format=tar "$BASE_SHA" -o "${RUNNER_TEMP}/release55-base.tar"
          tar -xf "${RUNNER_TEMP}/release55-base.tar" -C "$clean"

          change_id="repair-release55-dependency-output-role-overlap"
          rm -rf "$clean/governance/repair-cases/$change_id"
          mkdir -p "$clean/governance/repair-cases" "$clean/governance/targets" "$clean/governance/claims"
          cp -R "governance/repair-cases/$change_id" "$clean/governance/repair-cases/"
          cp "governance/targets/$change_id.md" "$clean/governance/targets/$change_id.md"
          cp "governance/claims/$change_id.json" "$clean/governance/claims/$change_id.json"
          cp governance/active-change.json "$clean/governance/active-change.json"
          rm -rf "$clean/governance/repair-cases/$change_id/evidence/quality-baseline"
          rm -rf "$clean/governance/repair-cases/$change_id/evidence/quality-verification"

      - name: Install clean Agent environment
        run: |
          cd "${RUNNER_TEMP}/release55-base/services/agent-service"
          uv sync --locked --all-groups

      - name: Record exact-base canonical RED with current trust key
        run: |
          set -euo pipefail
          clean="${RUNNER_TEMP}/release55-base"
          cd "$clean"
          export PYTHONPATH="$clean/services/agent-service/src:$clean/services/agent-service"
          change_id="repair-release55-dependency-output-role-overlap"
          case="governance/repair-cases/$change_id"
          target="governance/targets/$change_id.md"
          baseline="$case/evidence/quality-baseline"
          rm -rf "$baseline" "${RUNNER_TEMP}/release55-baseline-state"
          set +e
          services/agent-service/.venv/bin/python -B scripts/quality_loop.py \
            --workspace-root . \
            --policy "$case/quality-input/focused-policy.json" \
            --mode quick \
            --target "$target" \
            --baseline \
            --evidence-dir "$baseline" \
            --state-dir "${RUNNER_TEMP}/release55-baseline-state" \
            > "${RUNNER_TEMP}/release55-canonical-red.log" 2>&1
          rc=$?
          set -e
          cat "${RUNNER_TEMP}/release55-canonical-red.log"
          "${pythonLocation}/bin/python" -B - "$baseline/run-summary.json" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rc = int(sys.argv[2])
          assert rc != 0, "pre-repair baseline unexpectedly passed"
          assert summary["run_kind"] == "baseline", summary
          assert summary["decision"] == "FAIL", summary
          assert summary["loop_status"] == "BASELINE_RECORDED", summary
          results = {item["id"]: item for item in summary["results"]}
          gate = results["release55-role-overlap-counterexample"]
          assert gate["status"] == "FAIL", gate
          combined = str(gate.get("stdout") or "") + str(gate.get("stderr") or "")
          assert "goal_alignment_dependency_basis_is_requested_output:0" in combined, combined
          assert "ModuleNotFoundError" not in combined, combined
          print(json.dumps({"decision": summary["decision"], "loop_status": summary["loop_status"]}, ensure_ascii=False))
          PY

      - name: Overlay only permitted product candidate
        run: |
          set -euo pipefail
          clean="${RUNNER_TEMP}/release55-base"
          product_paths=(
            services/agent-service/src/agent_core/lifecycle/goal_planning.py
            services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py
          )
          for path in "${product_paths[@]}"; do
            mkdir -p "$clean/$(dirname "$path")"
            cp "$path" "$clean/$path"
          done
          printf '%s\n' "${product_paths[@]}" > "${RUNNER_TEMP}/release55-product-allowlist.txt"

      - name: Run focused dependency regressions
        run: |
          set -euo pipefail
          clean="${RUNNER_TEMP}/release55-base"
          cd "$clean/services/agent-service"
          export PYTHONPATH="$clean/services/agent-service/src:$clean/services/agent-service"
          .venv/bin/python -B -m pytest -q \
            tests/runtime/test_release55_dependency_output_role_overlap.py \
            tests/runtime/test_wp08_attempt7_final_authority_and_retry.py \
            tests/runtime/test_dependency_obligation_evidence_pipeline.py \
            tests/runtime/test_dependency_alignment_authority.py \
            tests/runtime/test_dependency_proof_authority.py \
            tests/runtime/test_release47_dependency_repair_projection.py \
            tests/runtime/test_release52_dependency_independence_adjudication.py \
            tests/runtime/test_release53_blind_semantic_grounding_adjudication.py \
            2>&1 | tee "${RUNNER_TEMP}/release55-focused-regressions.log"
          cd "$clean"
          PYTHONPATH="$clean/services/agent-service/src:$clean/services/agent-service" \
            services/agent-service/.venv/bin/python -B -m pytest -q \
            skill-system/tests/test_semantic_dependency_repair_feedback.py \
            2>&1 | tee "${RUNNER_TEMP}/release55-skill-compat.log"

      - name: Run canonical RED-to-GREEN Quality transition
        run: |
          set -euo pipefail
          clean="${RUNNER_TEMP}/release55-base"
          cd "$clean"
          export PYTHONPATH="$clean/services/agent-service/src:$clean/services/agent-service"
          change_id="repair-release55-dependency-output-role-overlap"
          case="governance/repair-cases/$change_id"
          target="governance/targets/$change_id.md"
          evidence="$case/evidence/quality-verification"
          rm -rf "$evidence" "${RUNNER_TEMP}/release55-quality-state"
          services/agent-service/.venv/bin/python -B scripts/quality_loop.py \
            --workspace-root . \
            --policy "$case/quality-input/focused-policy.json" \
            --mode quick \
            --target "$target" \
            --baseline-evidence "$case/evidence/quality-baseline" \
            --evidence-dir "$evidence" \
            --state-dir "${RUNNER_TEMP}/release55-quality-state" \
            2>&1 | tee "${RUNNER_TEMP}/release55-quality-transition.log"
          "${pythonLocation}/bin/python" -B - "$evidence/run-summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert summary["decision"] == "PASS", summary
          assert summary["loop_status"] in {"CONVERGED", "CI_VERIFIED"}, summary
          results = {item["id"]: item for item in summary["results"]}
          assert results["release55-role-overlap-counterexample"]["status"] == "PASS", results
          assert not summary.get("unverified_claim_ids"), summary
          print(json.dumps({"decision": summary["decision"], "loop_status": summary["loop_status"], "claim_status": summary["claim_results"][0]["status"]}, ensure_ascii=False))
          PY

      - name: Freeze clean candidate evidence
        if: always()
        run: |
          set -euo pipefail
          clean="${RUNNER_TEMP}/release55-base"
          {
            echo "pr_base=${{ github.event.pull_request.base.sha }}"
            echo "pr_head=${{ github.event.pull_request.head.sha }}"
            echo "source_sha256=$(sha256sum "$clean/services/agent-service/src/agent_core/lifecycle/goal_planning.py" | awk '{print $1}')"
            if [ -f "$clean/services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py" ]; then
              echo "test_sha256=$(sha256sum "$clean/services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py" | awk '{print $1}')"
            else
              echo "test_sha256=NOT_OVERLAID"
            fi
          } > "${RUNNER_TEMP}/release55-clean-candidate-identity.txt"

      - name: Upload clean candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release55-clean-candidate-${{ github.event.pull_request.head.sha }}
          path: |
            ${{ runner.temp }}/release55-canonical-red.log
            ${{ runner.temp }}/release55-focused-regressions.log
            ${{ runner.temp }}/release55-skill-compat.log
            ${{ runner.temp }}/release55-quality-transition.log
            ${{ runner.temp }}/release55-clean-candidate-identity.txt
            ${{ runner.temp }}/release55-base/governance/repair-cases/repair-release55-dependency-output-role-overlap/evidence/quality-baseline
            ${{ runner.temp }}/release55-base/governance/repair-cases/repair-release55-dependency-output-role-overlap/evidence/quality-verification
          if-no-files-found: warn
          include-hidden-files: true
