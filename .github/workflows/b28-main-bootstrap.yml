name: B28 Governed Quick-Suite Repair
run-name: Apply verified B28 quick-suite repair patch

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .b28-publisher-trigger

permissions:
  contents: write

env:
  B28_UPGRADE_BRANCH: agent/b28-repository-onboarding
  B28_EXPECTED_HEAD: df2724b992c4db242b82093188b60653b3973698
  B28_EXPECTED_PARENT: 43a123929850cb26fc90f59a6652f690d02863a4
  PATCH_BLOB_SHA: b7e41e4a2e3bf107f0f5d8c697e24822722e745e
  PATCH_ZST_SHA256: 40b72f5a419e1be6d536f04d33660959eb69ff0835c177bb430fd502817cc82e
  PATCH_SHA256: f3dad25ce8bbfec7334c93c588576d99d3650e16bc655a2db9e9f4806ab7f1df

jobs:
  apply-verified-quick-suite-repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/b28-publisher-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable B28 repair transport
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.B28_EXPECTED_HEAD }}
          fetch-depth: 2
          clean: true
          persist-credentials: true

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Verify and apply immutable repair patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$B28_EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$B28_EXPECTED_PARENT"
          test "$(git hash-object .b28-quick-fix/patch.zst.b64)" = "$PATCH_BLOB_SHA"

          base64 --decode .b28-quick-fix/patch.zst.b64 > /tmp/b28-quick-fix.patch.zst
          echo "$PATCH_ZST_SHA256  /tmp/b28-quick-fix.patch.zst" | sha256sum -c -
          command -v zstd >/dev/null
          zstd -q -d /tmp/b28-quick-fix.patch.zst -o /tmp/b28-quick-fix.patch
          echo "$PATCH_SHA256  /tmp/b28-quick-fix.patch" | sha256sum -c -

          git apply --check /tmp/b28-quick-fix.patch
          git apply /tmp/b28-quick-fix.patch
          rm -rf .b28-quick-fix

          echo "d9037e505b1575333271a51acdd740c41b9307d5a36c45891f06b0c665694397  services/agent-service/tests/context/strong_context_cases/conversation_runtime_contract_suite_v20_4.json" | sha256sum -c -
          echo "0fb12150301b7a00f17ec326ac45874a1edfbc68f0d845408c85bdcfaf46898d  services/agent-service/tests/context/strong_context_cases/semantic_goal_coverage_suite_v20_4.json" | sha256sum -c -
          echo "3d082d4f80c495a1f007c1e1f99ae71ea43b321a307c4e24976b2e3a1ca99fb8  services/agent-service/tests/support/conversation_case_fixtures.py" | sha256sum -c -
          echo "bcf090574287f2a86848d5887be0e21ffd79fccd698017800b4c55a453ad4952  services/agent-service/tests/support/conversation_case_runner.py" | sha256sum -c -
          echo "ab2f952c9798f1a3805c095702438beeb4f38917bd1fb580aa94b88c12cc57db  services/agent-service/tests/runtime/test_b17h_protected_environment_preflight.py" | sha256sum -c -
          echo "a133e88fb30ec1f1513749ade72cc7b59bb2f53314326a26f778ec4ded6626da  services/agent-service/tests/runtime/test_b17i_production_execution_handoff.py" | sha256sum -c -

      - name: Install locked Agent validation environment
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups

      - name: Run focused regression and governance gates
        shell: bash
        run: |
          set -euo pipefail
          PY=services/agent-service/.venv/bin/python
          "$PY" -B scripts/verify_task_ledger.py
          "$PY" -B skill-system/controller/profile_runner.py skill-control-plane
          "$PY" -B scripts/quality_toolchain_contract.py --workspace-root . --static-only
          cd services/agent-service
          .venv/bin/python -m pytest -q \
            tests/context/test_conversation_regression_suite_execution.py \
            tests/context/test_semantic_goal_coverage_suite_execution.py \
            tests/runtime/test_b17h_protected_environment_preflight.py \
            tests/runtime/test_b17i_production_execution_handoff.py

      - name: Commit and publish repaired B28 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .quality
          git add -A
          git diff --cached --stat
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git commit -m 'Repair B28 quick-suite protocol and CI isolation'
          git push --force-with-lease=refs/heads/${B28_UPGRADE_BRANCH}:$B28_EXPECTED_HEAD \
            origin HEAD:${B28_UPGRADE_BRANCH}
