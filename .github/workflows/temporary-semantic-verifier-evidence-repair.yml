name: temporary-semantic-verifier-evidence-repair

on:
  push:
    branches:
      - fix/semantic-verifier-repair-evidence-grounding-20260815
    paths:
      - .github/semantic-verifier-evidence-repair.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/semantic-verifier-repair-evidence-grounding-20260815
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Patch candidate-blind evidence composition
        shell: bash
        run: python3 -B .github/temporary_semantic_verifier_evidence_repair.py
      - name: Refresh protected product-source baseline via repo authority
        shell: bash
        run: python3 -B scripts/refresh_product_source_baseline.py --workspace . --generated-from-sha "${GITHUB_SHA}"
      - name: Run focused semantic regressions
        shell: bash
        env:
          PYTHONPATH: services/agent-service/src
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.11.29
          (cd services/agent-service && uv sync --locked --all-groups)
          services/agent-service/.venv/bin/python -B -m pytest -q -p no:cacheprovider \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py \
            services/agent-service/tests/runtime/test_semantic_dependency_counterfactual_contract.py
          services/agent-service/.venv/bin/python -B -m pytest -q -p no:cacheprovider \
            skill-system/tests/test_product_source_baseline_binding.py
      - name: Publish governed repair commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/release-trigger \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py \
            skill-system/registry/product-source-baseline.json
          git diff --cached --quiet && { echo "no repair delta"; exit 1; }
          git commit -m "fix(semantic): preserve verifier repair evidence grounding"
          git push origin HEAD:fix/semantic-verifier-repair-evidence-grounding-20260815
