name: tmp-m2-repair-runtime-closure

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  validate-and-commit:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'long-task-execution-control-plane-m2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact M2 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: long-task-execution-control-plane-m2
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Bootstrap locked validation environment
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups
      - name: Add shared runtime to repair package closure and reproduce failed counterexample
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/repair_loop.py')
          text = path.read_text(encoding='utf-8')
          old = '''REPAIR_RUNTIME_CONTROLLER_FILES = (\n    "progress.py",\n    "trusted_judge.py",\n    "fixer_env.py",\n    "issue_state.py",\n    "task_run.py",\n)'''
          new = '''REPAIR_RUNTIME_CONTROLLER_FILES = (\n    "progress.py",\n    "trusted_judge.py",\n    "fixer_env.py",\n    "issue_state.py",\n    "task_run.py",\n    "execution_runtime.py",\n)'''
          if old not in text:
              if new not in text:
                  raise SystemExit('authoritative repair runtime manifest anchor missing')
          else:
              if text.count(old) != 1:
                  raise SystemExit('authoritative repair runtime manifest anchor is ambiguous')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          (
            cd services/agent-service
            .venv/bin/python -m pytest \
              tests/architecture/test_quality_loop_governance.py::test_repair_orchestrator_builds_stable_issue_records \
              -q
          )
          git diff --check
      - name: Commit only validated runtime closure
        run: |
          set -euo pipefail
          rm -f .github/workflows/tmp-m2-repair-runtime-closure.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/repair_loop.py .github/workflows/tmp-m2-repair-runtime-closure.yml
          git commit -m 'Include shared execution runtime in repair package closure'
          git push origin HEAD:long-task-execution-control-plane-m2
