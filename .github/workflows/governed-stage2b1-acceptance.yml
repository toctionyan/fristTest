name: governed-stage2b1-acceptance

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful p4-8-evidence-producer run
        required: true
        type: string
      source_run_attempt:
        description: Exact attempt for source_run_id
        required: true
        type: string
      payload_artifact_id:
        description: Exact payload artifact ID produced by source_run_id
        required: true
        type: string
      bundle_artifact_id:
        description: Exact bundle artifact ID produced by source_run_id
        required: true
        type: string

permissions:
  contents: read
  actions: read
  deployments: read

concurrency:
  group: governed-stage2b1-acceptance-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}-${{ inputs.payload_artifact_id }}-${{ inputs.bundle_artifact_id }}
  cancel-in-progress: false

jobs:
  verify-stage2b1-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # This is a protected human boundary for running the preview. It does not
    # turn source evidence into an acceptance decision or write governance.
    environment:
      name: stage2b1-acceptance
    permissions:
      contents: read
      actions: read
      deployments: read
    steps:
      - name: Require dispatch from protected main
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]
          [[ "${GITHUB_REF_PROTECTED}" == "true" ]]
          [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]

      - name: Checkout the verifier at the dispatched control-plane commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Resolve the explicit producer run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${SOURCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          mkdir -p incoming
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/attempts/${SOURCE_RUN_ATTEMPT}" > incoming/source-run.json
          jq -e \
            --arg run_id "${SOURCE_RUN_ID}" \
            --arg attempt "${SOURCE_RUN_ATTEMPT}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            '(.id|tostring) == $run_id and
             .run_attempt == ($attempt|tonumber) and
             .name == "p4-8-evidence-producer" and
             .path == ".github/workflows/p4-8-evidence-producer.yml" and
             .event == "workflow_dispatch" and
             .head_branch == "main" and
             (.head_sha|type) == "string" and
             (.head_sha|test("^[0-9a-f]{40}$")) and
             .status == "completed" and
             .conclusion == "success" and
             (.repository.full_name // "") == $repository' \
            incoming/source-run.json >/dev/null
          jq -r '.head_sha' incoming/source-run.json > incoming/source-head-sha.txt

      - name: Download and verify the two explicit source artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          PAYLOAD_ARTIFACT_ID: ${{ inputs.payload_artifact_id }}
          BUNDLE_ARTIFACT_ID: ${{ inputs.bundle_artifact_id }}
        run: |
          set -euo pipefail
          [[ "${PAYLOAD_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${BUNDLE_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PAYLOAD_ARTIFACT_ID}" != "${BUNDLE_ARTIFACT_ID}" ]]
          SOURCE_HEAD_SHA="$(cat incoming/source-head-sha.txt)"
          PAYLOAD_NAME="p4-8-evidence-payload-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"
          BUNDLE_NAME="p4-8-evidence-bundle-${SOURCE_RUN_ID}-${SOURCE_RUN_ATTEMPT}"

          fetch_artifact() {
            local artifact_id="$1"
            local expected_name="$2"
            local label="$3"
            local zip_path="incoming/${label}.zip"
            [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > "incoming/${label}.metadata.json"
            jq -e \
              --arg artifact_id "${artifact_id}" \
              --arg expected_name "${expected_name}" \
              --arg run_id "${SOURCE_RUN_ID}" \
              --arg attempt "${SOURCE_RUN_ATTEMPT}" \
              --arg head_sha "${SOURCE_HEAD_SHA}" \
              '(.id|tostring) == $artifact_id and
               .name == $expected_name and
               .expired == false and
               (.workflow_run.id|tostring) == $run_id and
               (.workflow_run.head_branch // "") == "main" and
               (.workflow_run.head_sha // "") == $head_sha and
               (.digest|type) == "string" and
               (.digest|test("^sha256:[0-9a-f]{64}$"))' \
              "incoming/${label}.metadata.json" >/dev/null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "${zip_path}"
            ACTUAL_DIGEST="sha256:$(sha256sum "${zip_path}" | awk '{print $1}')"
            EXPECTED_DIGEST="$(jq -r '.digest' "incoming/${label}.metadata.json")"
            test "${ACTUAL_DIGEST}" = "${EXPECTED_DIGEST}"
            printf '%s\n' "${ACTUAL_DIGEST}" > "incoming/${label}.digest"
          }

          fetch_artifact "${PAYLOAD_ARTIFACT_ID}" "${PAYLOAD_NAME}" payload
          fetch_artifact "${BUNDLE_ARTIFACT_ID}" "${BUNDLE_NAME}" bundle

      - name: Copy the trusted control-plane baseline into the verification workspace
        run: |
          set -euo pipefail
          SOURCE_SHA="$(jq -r '.product_source_ref' control/skill-system/registry/product-source-baseline.json)"
          [[ "${SOURCE_SHA}" =~ ^git-commit-sha1:[0-9a-f]{40}$ ]] || {
            echo "trusted product source reference is invalid" >&2
            exit 1
          }
          SOURCE_SHA="${SOURCE_SHA#git-commit-sha1:}"
          git -C control fetch --no-tags origin "${SOURCE_SHA}"
          python3 -B control/scripts/verify_product_source_baseline.py \
            --workspace control > incoming/product-source-verification.json
          jq -e '.status == "PASS" and .source_snapshot_match == true' \
            incoming/product-source-verification.json >/dev/null
          mkdir -p incoming/skill-system/registry
          cp control/skill-system/registry/product-source-baseline.json \
            incoming/skill-system/registry/product-source-baseline.json

      - name: Extract and validate the producer bundle
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          PAYLOAD_ARTIFACT_ID: ${{ inputs.payload_artifact_id }}
          BUNDLE_ARTIFACT_ID: ${{ inputs.bundle_artifact_id }}
        run: |
          set -euo pipefail
          mkdir -p incoming/bundle
          python3 - incoming/bundle.zip incoming/bundle <<'PY'
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          required = {
              "producer-run.json",
              "product-binding.json",
              "attestation-policy.json",
              "provenance.json",
              "workflow-run.json",
              "payload-artifact.json",
              "manifest.json",
          }
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as source:
              entries = source.infolist()
              names = []
              for entry in entries:
                  name = pathlib.PurePosixPath(entry.filename)
                  if entry.filename.endswith("/") or name.is_absolute() or ".." in name.parts or len(name.parts) != 1:
                      raise SystemExit("producer bundle contains an unsafe path")
                  file_mode = (entry.external_attr >> 16) & 0o170000
                  if file_mode not in (0, 0o100000):
                      raise SystemExit("producer bundle contains a non-regular file")
                  names.append(name.name)
              if len(names) != len(set(names)) or set(names) != required:
                  raise SystemExit("producer bundle must contain exactly the expected files")
              for filename in sorted(required):
                  (destination / filename).write_bytes(source.read(filename))
          PY
      - name: Run the canonical source verification preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -B control/scripts/stage2b1_acceptance.py \
            --workspace incoming \
            --producer-bundle incoming/bundle \
            --artifact-archive incoming/payload.zip \
            --source-run-id "${{ inputs.source_run_id }}" \
            --source-run-attempt "${{ inputs.source_run_attempt }}" \
            --artifact-id "${{ inputs.payload_artifact_id }}" \
            > incoming/source-verification-preview.json
          jq -e \
            '.schema == "stage2b1-acceptance-verification@2" and
             .status == "ACCEPTABLE_PREVIEW" and
             .active_change_written == false and
             .task_run_written == false and
             .governance_state_changed == false and
             .authority_effect == false' \
            incoming/source-verification-preview.json >/dev/null
          cat incoming/source-verification-preview.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source verification preview
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2b1-source-verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: incoming/source-verification-preview.json
          retention-days: 90
          if-no-files-found: error
