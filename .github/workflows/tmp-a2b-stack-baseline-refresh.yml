name: temporary-a2b-stack-baseline-refresh

on:
  push:
    branches:
      - validation/a2b-perf-oracle-stack-20260812

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Rebuild mechanically-derived protected source baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone
          import hashlib
          import json
          import subprocess

          root = Path.cwd()
          path = root / "skill-system/registry/product-source-baseline.json"
          data = json.loads(path.read_text(encoding="utf-8"))
          protected_roots = [str(value) for value in data.get("protected_roots") or []]
          raw = subprocess.check_output(["git", "ls-files", "-z", "--", *protected_roots], cwd=root)
          tracked = sorted(item.decode("utf-8") for item in raw.split(b"\0") if item)
          data["files"] = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          data["file_count"] = len(tracked)
          data["generated_at"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat()
          source_sha = subprocess.check_output(["git", "rev-parse", "HEAD^"], cwd=root, text=True).strip()
          data["generated_from"] = f"git:{source_sha}"
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          print("BASELINE_FILE_COUNT=" + str(len(tracked)))
          print("GENERATED_FROM=" + data["generated_from"])
          PY

      - name: Commit baseline and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/tmp-a2b-stack-baseline-refresh.yml
          git add skill-system/registry/product-source-baseline.json .github/workflows/tmp-a2b-stack-baseline-refresh.yml
          git diff --cached --check
          git commit -m "Refresh protected baseline for combined A2/B validation"
          git push origin HEAD:validation/a2b-perf-oracle-stack-20260812
