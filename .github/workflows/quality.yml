name: quality

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-validate-attempt2-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: wp08-release-31388975089-attempt2-repair
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Apply two focused Attempt-2 repairs and regressions
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from pathlib import Path

          goal_path = Path('services/agent-service/src/agent_core/lifecycle/goal_planning.py')
          text = goal_path.read_text(encoding='utf-8')
          old = '''        last_indeterminate = GoalAlignmentVerdict(
              "indeterminate", (), (), "goal_alignment_unverified", "model", True, {}
          )
          for attempt in range(2):
          '''
          new = '''        last_indeterminate = GoalAlignmentVerdict(
              "indeterminate", (), (), "goal_alignment_unverified", "model", True, {}
          )
          initial_exact_alignment: GoalAlignmentVerdict | None = None
          for attempt in range(2):
          '''
          if text.count(old) != 1:
              raise SystemExit('goal_planning initial exact insertion anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''                else:
                      verdict = _as_alignment_verdict(
                          parsed,
                          user_text=user_text,
                          source="model",
                          independent=True,
                      )
                      if dependency_details:
                          verdict = GoalAlignmentVerdict(
                              verdict.verdict,
                              verdict.evidence_spans,
                              verdict.missing_spans,
                              verdict.reason_code,
                              verdict.source,
                              verdict.independent,
                              {**verdict.details, **dependency_details},
                          )
          '''
          new = '''                else:
                      if (
                          blind_dependency_audit
                          and raw_verdict == "exact"
                          and initial_exact_alignment is not None
                      ):
                          # The second call is dependency-only authority. Outcome
                          # coverage was already grounded by the first exact call,
                          # so a pairwise-complete blind audit must not be rejected
                          # merely because it omits redundant top-level evidence_spans.
                          verdict = GoalAlignmentVerdict(
                              "exact",
                              initial_exact_alignment.evidence_spans,
                              (),
                              "goal_alignment_candidate_blind_dependency_reaudit_exact",
                              "model",
                              True,
                              {
                                  **initial_exact_alignment.details,
                                  "initial_alignment_reason_code": initial_exact_alignment.reason_code,
                                  "candidate_blind_dependency_reaudit": True,
                              },
                          )
                      else:
                          verdict = _as_alignment_verdict(
                              parsed,
                              user_text=user_text,
                              source="model",
                              independent=True,
                          )
                      if dependency_details:
                          verdict = GoalAlignmentVerdict(
                              verdict.verdict,
                              verdict.evidence_spans,
                              verdict.missing_spans,
                              verdict.reason_code,
                              verdict.source,
                              verdict.independent,
                              {**verdict.details, **dependency_details},
                          )
          '''
          if text.count(old) != 1:
              raise SystemExit('goal_planning verdict merge anchor mismatch')
          text = text.replace(old, new, 1)

          old = '''            if attempt == 0 and verdict.exact and len(goals) > 1:
                  # The first verifier saw Planner's candidate graph and may have
          '''
          new = '''            if attempt == 0 and verdict.exact and len(goals) > 1:
                  initial_exact_alignment = verdict
                  # The first verifier saw Planner's candidate graph and may have
          '''
          if text.count(old) != 1:
              raise SystemExit('goal_planning first exact capture anchor mismatch')
          text = text.replace(old, new, 1)
          goal_path.write_text(text, encoding='utf-8')

          gate_path = Path('services/agent-service/src/agent_core/runtime/capability_gate.py')
          text = gate_path.read_text(encoding='utf-8')
          old = '''        elif reference_cardinality == "single" and member_handles:
              matched = bool(actual_handles & member_handles)
              reason = "resolved_single_reference_member_bound" if matched else "resolved_single_reference_requires_member_handle"
          else:
              matched = bool(result_ref and result_ref in actual_handles)
              reason = "resolved_collection_reference_bound" if matched else "resolved_collection_reference_target_mismatch"
          '''
          new = '''        elif reference_cardinality == "single" and member_handles:
              matched = bool(actual_handles & member_handles)
              reason = "resolved_single_reference_member_bound" if matched else "resolved_single_reference_requires_member_handle"
          elif (
              reference_cardinality == "collection"
              and goal_result_cardinality == "single"
              and len(member_handles) == 1
          ):
              # A collection referent that Runtime has already proven contains
              # exactly one member has one canonical scope. For a singular final
              # Goal, accept either the exact collection ResultRef or that exact
              # proven member handle. This never selects a member from a plural
              # collection: the model-supplied handle must equal the sole member.
              sole_member = next(iter(member_handles))
              if result_ref and result_ref in actual_handles:
                  matched = True
                  reason = "resolved_collection_reference_bound"
              else:
                  matched = sole_member in actual_handles
                  reason = (
                      "resolved_singleton_collection_member_bound"
                      if matched
                      else "resolved_singleton_collection_target_mismatch"
                  )
          else:
              matched = bool(result_ref and result_ref in actual_handles)
              reason = "resolved_collection_reference_bound" if matched else "resolved_collection_reference_target_mismatch"
          '''
          if text.count(old) != 1:
              raise SystemExit('capability_gate singleton collection anchor mismatch')
          text = text.replace(old, new, 1)
          gate_path.write_text(text, encoding='utf-8')

          test_path = Path('skill-system/tests/test_wp08_new_release_attempt2_root_fixes.py')
          text = test_path.read_text(encoding='utf-8')
          marker = '''def test_semantic_binding_uses_referent_cardinality_not_goal_output_cardinality() -> None:
          '''
          if text.count(marker) != 1:
              raise SystemExit('focused test insertion marker mismatch')
          inserted = r'''
          def test_blind_dependency_reaudit_reuses_first_grounded_exact_evidence() -> None:
              from agent_core.lifecycle.goal_planning import ModelGoalAlignmentVerifier

              user_text = "查一下耳机物流，再查一下键盘物流"
              goals = [
                  {
                      "goal_id": "g1",
                      "evidence_span": "查一下耳机物流",
                      "depends_on": [],
                  },
                  {
                      "goal_id": "g2",
                      "evidence_span": "查一下键盘物流",
                      "depends_on": [],
                  },
              ]
              first = SimpleNamespace(content=json.dumps({
                  "verdict": "exact",
                  "evidence_spans": ["查一下耳机物流", "查一下键盘物流"],
                  "missing_spans": [],
                  "dependency_edges": [],
                  "reason_code": "all_outcomes_grounded",
              }, ensure_ascii=False))
              blind = SimpleNamespace(content=json.dumps({
                  "verdict": "exact",
                  "dependency_decisions": [{
                      "goal_a_id": "g1",
                      "goal_b_id": "g2",
                      "relation": "independent",
                  }],
                  "reason_code": "pairwise_independent",
              }, ensure_ascii=False))
              with patch("agent_core.config.get_model", return_value=object()), patch(
                  "agent_core.model_calls.invoke_model", side_effect=[(first, {}), (blind, {})]
              ) as invoke:
                  verdict = ModelGoalAlignmentVerifier().verify(
                      user_text=user_text,
                      goals=goals,
                      known_tools=set(),
                  )
              assert invoke.call_count == 2
              assert verdict.exact
              assert verdict.evidence_spans == ("查一下耳机物流", "查一下键盘物流")
              assert verdict.reason_code == "goal_alignment_candidate_blind_dependency_reaudit_exact"
              assert verdict.details["dependency_proof_complete"] is True
              assert verdict.details["dependency_graph_match"] is True
              assert verdict.details["dependency_pair_decisions"] == [{
                  "goal_a_id": "g1",
                  "goal_b_id": "g2",
                  "relation": "independent",
              }]
              assert verdict.details["candidate_blind_dependency_reaudit"] is True
              assert verdict.details["initial_alignment_reason_code"] == "all_outcomes_grounded"


          '''
          text = text.replace(marker, inserted + marker, 1)

          marker = '''def test_single_latest_reference_resolves_verified_member_without_runtime_guessing() -> None:
          '''
          if text.count(marker) != 1:
              raise SystemExit('reference regression insertion marker mismatch')
          inserted = r'''
          def test_singleton_collection_can_bind_its_only_proven_member_for_single_result_goal() -> None:
              from agent_core.runtime.capability_gate import _semantic_reference_binding_proof

              state = {
                  "frozen_semantic_contract": _contract(
                      reference_cardinality="collection",
                      goal_result_cardinality="single",
                  )
              }
              member = _semantic_reference_binding_proof(
                  state,
                  {"target": {"mode": "artifact", "left_handle": "artifact:order:10001"}},
                  goal_ids={"g1"},
              )
              assert member["complete"] is True
              assert member["checks"][0]["reason_code"] == "resolved_singleton_collection_member_bound"
              assert member["checks"][0]["canonical_scope"] == "member:artifact:order:10001"

              wrong = _semantic_reference_binding_proof(
                  state,
                  {"target": {"mode": "artifact", "left_handle": "artifact:order:10002"}},
                  goal_ids={"g1"},
              )
              assert wrong["complete"] is False
              assert wrong["checks"][0]["reason_code"] == "resolved_singleton_collection_target_mismatch"


          def test_plural_collection_still_cannot_select_one_member_without_exact_collection_binding() -> None:
              from agent_core.runtime.capability_gate import _semantic_reference_binding_proof

              contract = _contract(
                  reference_cardinality="collection",
                  goal_result_cardinality="single",
              )
              goal = contract["goals"][0]
              members = ["artifact:order:10001", "artifact:order:10002"]
              goal["resolved_reference"]["member_handles"] = list(members)
              goal["referent_resolution_proof"]["resolved_member_handles"] = list(members)
              state = {"frozen_semantic_contract": contract}
              one_member = _semantic_reference_binding_proof(
                  state,
                  {"target": {"mode": "artifact", "left_handle": "artifact:order:10001"}},
                  goal_ids={"g1"},
              )
              assert one_member["complete"] is False
              assert one_member["checks"][0]["reason_code"] == "resolved_collection_reference_target_mismatch"


          '''
          text = text.replace(marker, inserted + marker, 1)
          test_path.write_text(text, encoding='utf-8')
          PY
      - name: Run focused repair regressions
        run: |
          set -euo pipefail
          services/agent-service/.venv/bin/python -m py_compile \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/runtime/capability_gate.py
          services/agent-service/.venv/bin/python -m pytest -q \
            skill-system/tests/test_wp08_new_release_attempt2_root_fixes.py \
            skill-system/tests/test_wp08_attempt1_product_repair.py
          git diff --check
      - name: Commit product repair, regenerate protected baseline, validate control plane, and publish formal branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/runtime/capability_gate.py \
            skill-system/tests/test_wp08_new_release_attempt2_root_fixes.py
          git commit -m "Repair WP-08 Attempt 2 alignment and singleton reference binding"
          PRODUCT_SHA=$(git rev-parse HEAD)
          PRODUCT_SHA="$PRODUCT_SHA" python -B - <<'PY'
          from datetime import datetime, timezone
          import hashlib
          import json
          import os
          from pathlib import Path

          baseline_path = Path('skill-system/registry/product-source-baseline.json')
          payload = json.loads(baseline_path.read_text(encoding='utf-8'))
          files = payload.get('files')
          if not isinstance(files, dict) or not files:
              raise SystemExit('invalid protected source baseline')
          missing = []
          for relative in sorted(files):
              path = Path(relative)
              if not path.is_file():
                  missing.append(relative)
                  continue
              files[relative] = hashlib.sha256(path.read_bytes()).hexdigest()
          if missing:
              raise SystemExit('baseline path(s) missing: ' + ', '.join(missing[:10]))
          payload['file_count'] = len(files)
          payload['generated_at'] = datetime.now(timezone.utc).isoformat()
          payload['generated_from'] = 'git:' + os.environ['PRODUCT_SHA']
          baseline_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          PY
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/profile_runner.py skill-control-plane
          git diff --check
          git add skill-system/registry/product-source-baseline.json
          git commit -m "Bind WP-08 Attempt 2 repair to protected source baseline"
          git push origin HEAD:refs/heads/wp08-release-31388975089-attempt2-repair
