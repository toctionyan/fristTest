name: wp08-attempt7-repair-contract-compat-carrier

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  validate-compatibility:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt7-repair-contract-compat-carrier-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout temporary controls
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false
      - name: Checkout formal Attempt 7 repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: wp08-release-31388975089-attempt7-repair
          path: candidate
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        working-directory: candidate
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent validation environment
        working-directory: candidate
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Remove redundant repair-contract field
        run: >-
          "${pythonLocation}/bin/python" -B control/scripts/tmp_wp08_attempt7_repair_contract_compat.py
          patch --workspace candidate
      - name: Run exact failed contract test
        working-directory: candidate/services/agent-service
        run: >-
          .venv/bin/python -m pytest
          tests/runtime/test_goal_coverage_runtime.py::test_invalid_goal_declaration_returns_authoritative_current_user_text
          -q
      - name: Run focused Attempt 7 and preserved authority regressions
        working-directory: candidate
        run: |
          set -euo pipefail
          PYTHONPATH=services/agent-service/src \
            services/agent-service/.venv/bin/python -m pytest \
            skill-system/tests/test_wp08_attempt7_scope_constraint_repair.py \
            skill-system/tests/test_wp08_attempt6_semantic_fidelity_repair.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py \
            -q
      - name: Commit compatibility correction
        working-directory: candidate
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agent-service/src/agent_core/lifecycle/goal_planning.py
          git diff --cached --check
          git commit -m "Preserve goal declaration repair contract shape"
          git rev-parse HEAD > ../product-sha.txt
      - name: Regenerate protected source baseline
        run: |
          set -euo pipefail
          PRODUCT_SHA=$(cat product-sha.txt)
          "${pythonLocation}/bin/python" -B control/scripts/tmp_wp08_attempt7_repair_contract_compat.py \
            baseline --workspace candidate --product-sha "$PRODUCT_SHA"
      - name: Run full Agent standard test suite
        working-directory: candidate/services/agent-service
        run: .venv/bin/python -m pytest -q -ra -p no:cacheprovider -m "not integration and not preprod"
      - name: Run full Skill control plane
        working-directory: candidate
        run: |
          set -euo pipefail
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/profile_runner.py skill-control-plane
          git diff --check
      - name: Publish corrected formal branch
        working-directory: candidate
        run: |
          set -euo pipefail
          git add skill-system/registry/product-source-baseline.json
          git commit -m "Rebind Attempt 7 repair protected baseline"
          git push origin HEAD:refs/heads/wp08-release-31388975089-attempt7-repair
