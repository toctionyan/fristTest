name: Release55 Product Source Baseline Refresh

on:
  push:
    branches:
      - repair/release55-dependency-output-role-overlap-20260816
    paths:
      - .github/release55-product-source-baseline-refresh.trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact post-closure candidate head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Assert governed repair is already closed
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          active = json.loads(Path('governance/active-change.json').read_text(encoding='utf-8'))
          assert active['change_id'] == 'repair-release55-dependency-output-role-overlap', active
          assert active['status'] == 'closed', active
          assert active['result'] == 'CONVERGED', active
          assert active['verification']['source_file_count'] == 2, active
          PY

      - name: Refresh protected source baseline with repository authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/refresh_product_source_baseline.py \
            --workspace . \
            --generated-from-sha "${GITHUB_SHA}"
          python3 -B -m unittest discover \
            -s skill-system/tests \
            -p 'test_product_source_baseline_binding.py'
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = "skill-system/registry/product-source-baseline.json"

      - name: Publish baseline-only maintenance and retire carrier
        shell: bash
        run: |
          set -euo pipefail
          baseline='skill-system/registry/product-source-baseline.json'
          workflow='.github/workflows/release55-product-source-baseline-refresh.yml'
          trigger='.github/release55-product-source-baseline-refresh.trigger'

          test ! "$(git diff --quiet -- "$baseline"; echo $?)" = '0'
          git rm "$workflow" "$trigger"
          git add "$baseline"
          git diff --cached --check

          printf '%s\n' "$trigger" "$workflow" "$baseline" | sort > "${RUNNER_TEMP}/expected-release55-refresh-paths.txt"
          git diff --cached --name-only | sort > "${RUNNER_TEMP}/actual-release55-refresh-paths.txt"
          diff -u "${RUNNER_TEMP}/expected-release55-refresh-paths.txt" "${RUNNER_TEMP}/actual-release55-refresh-paths.txt"

          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git commit -m 'chore(governance): refresh Release 55 product source baseline'
          git push origin HEAD:repair/release55-dependency-output-role-overlap-20260816
