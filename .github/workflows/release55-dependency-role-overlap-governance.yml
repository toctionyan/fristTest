name: release55-dependency-role-overlap-governance

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release55-dependency-role-overlap-governance.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  initialize-governed-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout repair carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Reconstruct exact PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          rm -rf "${RUNNER_TEMP}/release55-base"
          mkdir -p "${RUNNER_TEMP}/release55-base"
          git archive --format=tar "${BASE_SHA}" -o "${RUNNER_TEMP}/release55-base.tar"
          tar -xf "${RUNNER_TEMP}/release55-base.tar" -C "${RUNNER_TEMP}/release55-base"

      - name: Install exact baseline Agent environment
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/release55-base/services/agent-service"
          uv sync --locked --all-groups

      - name: Generate target, claim and focused RED policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/release55-base"
          CHANGE_ID="repair-release55-dependency-output-role-overlap"
          CASE="governance/repair-cases/${CHANGE_ID}"
          TARGET="governance/targets/${CHANGE_ID}.md"
          mkdir -p "${CASE}/evidence" "${CASE}/quality-input"

          "${pythonLocation}/bin/python" -B skillctl.py product-scaffold \
            --change-id "${CHANGE_ID}" \
            --target-kind repair \
            --goal "Close Release #55 missing true dependency caused by structural conflation of a relation-only basis with a broader requested-output evidence span." \
            --allow services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            --allow services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py \
            --minimum-mode quick \
            --claim-id RELEASE55.DEPENDENCY_OUTPUT_ROLE_OVERLAP \
            --claim-statement "A literal relation-only dependency basis nested inside a broader requested-output evidence span remains admissible as provisional semantic evidence and must reach adversarial dependency adjudication rather than being structurally coerced to independence; equal/wrapping outcome evidence remains rejected and deterministic dependency authority remains unchanged." \
            --risk P1 \
            --evidence-kind counterexample \
            --required-gate release55-role-overlap-counterexample \
            --evidence-ref gate-log:release55-role-overlap-counterexample \
            --owner goal-alignment-dependency-authority \
            --forbidden-description "Do not change the semantic oracle, dependency reducer, Stage 4.2 obligation-evidence bridge, CapabilityGate, transaction authority, business tools, production defaults, Skill/Judge/Quality policy, or weaken any existing dependency tests." \
            --acceptance-description "The exact protected Release #55 failure must be reproduced structurally. A true same-turn result reference with basis '它' nested inside broader output evidence '它能不能退款' must not be rejected as requested-output evidence; it must remain provisional and be subject to the existing counterfactual/adversarial closure. False Draft/support-dataflow dependencies must still close as independent." \
            --baseline-description "Protected Production Certification Release #55 failed on semantic_query_then_refund_consult with expected g2->g1 but actual empty dependencies. The current pairwise structural validator rejects basis '它' whenever requested-output evidence is the broader phrase '它能不能退款', then format-repair instructions explicitly tell the verifier to return independent when no disjoint basis exists." \
            --max-rounds 8 \
            --force

          cat > "${CASE}/evidence/release55-protected-failure.md" <<EOF
          # Protected Release #55 failure

          - Exact source branch: main
          - Release workflow run: 31923348988
          - Source SHA: b1ab036566f17d7ea52acafd23523d1420460bae
          - Signed failure artifact: production-certification-evidence-31923348988-1
          - Artifact ID: 9257132257
          - Artifact digest: sha256:d43774610f0ec4deeb98cdce69f28560611c3fd4ee0ac332c62239245972ff07
          - Failed protected component: production-certification-bundle / real_model / semantic
          - Exact error: semantic_query_then_refund_consult: goal dependency mismatch for oracle g2; expected_dependencies=['g1']; actual_dependencies=[]
          - No production-closed artifact was produced.

          The catalog and historical regression explicitly define `它能不能退款` as a true current-turn result reference to the preceding order-query result. This repair does not change that oracle.
          EOF

          "${pythonLocation}/bin/python" -B - <<'PY'
          from __future__ import annotations
          import base64
          import json
          from pathlib import Path

          root = Path.cwd()
          change_id = "repair-release55-dependency-output-role-overlap"
          case = root / "governance/repair-cases" / change_id
          script = r'''
          import json
          from agent_core.lifecycle.goal_planning import _model_alignment_pairwise_dependency_proof

          user_text = "查一下键盘订单，再看看它能不能退款"
          goals = [
              {
                  "goal_id": "g1",
                  "evidence_span": "查一下键盘订单",
                  "requested_effect": {
                      "domain": "order",
                      "operation": "list",
                      "object_type": "order",
                      "requested_outputs": [
                          {"output_id": "order.collection", "evidence_span": "查一下键盘订单"}
                      ],
                  },
                  "depends_on": [],
              },
              {
                  "goal_id": "g2",
                  "evidence_span": "它能不能退款",
                  "requested_effect": {
                      "domain": "refund",
                      "operation": "assess_eligibility",
                      "object_type": "order",
                      "requested_outputs": [
                          {"output_id": "refund.eligibility", "evidence_span": "它能不能退款"}
                      ],
                  },
                  "depends_on": [],
              },
          ]
          details, error = _model_alignment_pairwise_dependency_proof(
              user_text=user_text,
              goals=goals,
              values=[{
                  "goal_a_id": "g1",
                  "goal_b_id": "g2",
                  "relation": "b_depends_on_a",
                  "basis_kind": "result_reference",
                  "basis_span": "它",
              }],
          )
          observed = {"error": error, "details": details}
          print(json.dumps(observed, ensure_ascii=False, sort_keys=True))
          assert error == "goal_alignment_dependency_graph_mismatch", (
              "strictly nested relation-only basis was structurally rejected instead of reaching graph/adversarial adjudication: "
              + str(error)
          )
          assert details["dependency_edges"][0]["basis_span"] == "它"
          '''
          encoded = base64.b64encode(script.encode("utf-8")).decode("ascii")
          policy = {
              "version": "release55-dependency-output-role-overlap-v1",
              "steps": [{
                  "id": "release55-role-overlap-counterexample",
                  "name": "Release 55 nested relation/output evidence counterexample",
                  "modes": ["quick"],
                  "kind": "shell",
                  "argv": [
                      "services/agent-service/.venv/bin/python",
                      "-B",
                      "-c",
                      f"import base64;exec(base64.b64decode('{encoded}'))",
                  ],
                  "owner": "quality-controller",
                  "category": "counterexample-regression",
                  "blocking_level": "required",
                  "repair_playbook": "repair the structural evidence-role boundary; do not change the oracle or weaken dependency authority",
                  "rerun_contract": "dependency_closure_then_downstream",
                  "depends_on": [],
                  "environment": {
                      "PYTHONDONTWRITEBYTECODE": "1",
                      "PYTHONPATH": "services/agent-service/src:services/agent-service",
                  },
                  "timeout_seconds": 120,
              }],
          }
          (case / "quality-input" / "focused-policy.json").write_text(
              json.dumps(policy, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY

      - name: Record canonical focused RED baseline
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/release55-base"
          CHANGE_ID="repair-release55-dependency-output-role-overlap"
          CASE="governance/repair-cases/${CHANGE_ID}"
          TARGET="governance/targets/${CHANGE_ID}.md"
          POLICY="${CASE}/quality-input/focused-policy.json"
          EVIDENCE="${CASE}/evidence/quality-baseline"
          rm -rf "${EVIDENCE}" "${RUNNER_TEMP}/release55-quality-state"
          set +e
          services/agent-service/.venv/bin/python -B scripts/quality_loop.py \
            --workspace-root . \
            --policy "${POLICY}" \
            --mode quick \
            --target "${TARGET}" \
            --baseline \
            --evidence-dir "${EVIDENCE}" \
            --state-dir "${RUNNER_TEMP}/release55-quality-state"
          rc=$?
          set -e
          "${pythonLocation}/bin/python" -B - "${EVIDENCE}/run-summary.json" "$rc" <<'PY'
          import json, sys
          from pathlib import Path
          summary = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          rc = int(sys.argv[2])
          assert rc != 0, "RED baseline unexpectedly passed before product repair"
          assert summary["run_kind"] == "baseline"
          assert summary["decision"] == "FAIL"
          assert summary["results"][0]["id"] == "release55-role-overlap-counterexample"
          assert summary["results"][0]["status"] == "FAIL"
          stderr = str(summary["results"][0].get("stderr") or "")
          assert "goal_alignment_dependency_basis_is_requested_output:0" in stderr, stderr
          print(json.dumps({"decision": summary["decision"], "loop_status": summary["loop_status"], "red_gate": summary["results"][0]["id"]}, ensure_ascii=False))
          PY

      - name: Generate governed repair chain and ChangePermit
        run: |
          set -euo pipefail
          cd "${RUNNER_TEMP}/release55-base"
          CHANGE_ID="repair-release55-dependency-output-role-overlap"
          CASE="governance/repair-cases/${CHANGE_ID}"
          TARGET="governance/targets/${CHANGE_ID}.md"

          "${pythonLocation}/bin/python" -B - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          from pathlib import Path

          root = Path.cwd()
          change_id = "repair-release55-dependency-output-role-overlap"
          case_rel = Path("governance/repair-cases") / change_id
          case = root / case_rel
          source = "services/agent-service/src/agent_core/lifecycle/goal_planning.py"
          test = "services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py"
          protected = f"{case_rel.as_posix()}/evidence/release55-protected-failure.md"
          baseline = f"{case_rel.as_posix()}/evidence/quality-baseline/run-summary.json"

          def write(path: Path, payload: dict) -> None:
              path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          def sha(path: Path) -> str:
              return hashlib.sha256(path.read_bytes()).hexdigest()

          failure_path = case / "failure-case.json"
          write(failure_path, {
              "schema_version": 1,
              "record_type": "failure-case",
              "change_id": change_id,
              "classification": "implementation-defect",
              "reproduction": {
                  "status": "REPRODUCED",
                  "expected": "For the true same-turn result reference '它能不能退款', a relation-only basis '它' must remain admissible provisional dependency evidence and reach the existing counterfactual/adversarial dependency closure even when requested-output evidence uses the broader literal phrase.",
                  "actual": "The structural validator rejects any containment overlap as goal_alignment_dependency_basis_is_requested_output; the subsequent format-repair prompt instructs the verifier to return independent when no disjoint basis exists. Protected Release #55 then accepted an empty candidate graph and failed the independent oracle with expected g2->g1 versus actual empty dependencies.",
                  "evidence_refs": [protected, baseline, source],
              },
              "violated_invariants": [
                  "Explicit same-turn result references are semantic dependencies when the later outcome consumes the earlier Goal result.",
                  "Runtime structural validation must not coerce a semantic dependency to independence merely because one candidate evidence annotation is broader than the relation-only subspan.",
                  "Dependency semantics remain model-observed and reducer-authorized; structural substring overlap is not a language-meaning authority.",
              ],
              "affected_boundaries": [
                  "candidate-blind pairwise dependency proof grounding",
                  "requested-output evidence span role separation",
                  "positive-edge adversarial adjudication entry",
                  "protected real-model semantic certification",
              ],
          })

          root_path = case / "root-cause-proof.json"
          write(root_path, {
              "schema_version": 1,
              "record_type": "root-cause-proof",
              "change_id": change_id,
              "failure_case_sha256": sha(failure_path),
              "decision": "PROVEN",
              "root_cause": "_dependency_basis_overlaps_requested_output treats both overlap directions as equally invalid. This incorrectly rejects a strictly smaller relation-only basis nested inside a broader requested-output annotation. ModelGoalAlignmentVerifier then routes that structural error to candidate_blind_dependency_format_repair, whose instruction says to mark the pair independent if no disjoint basis exists. Thus a broad output evidence span can structurally erase a true result reference before the existing positive-edge counterfactual/adversarial closure can judge it.",
              "causal_chain": [
                  "The accepted semantic schema requires requested-output evidence only to be a literal contiguous subspan of the Goal; it does not require minimal or relation-disjoint annotation.",
                  "The true consult phrase can therefore legally carry requested-output evidence '它能不能退款' while the independent verifier identifies relation-only basis '它'.",
                  "The overlap helper returns true for basis-in-output as well as output-in-basis/equality, so pairwise proof rejects the positive observation before dependency authority processing.",
                  "The verifier's bounded format-repair path explicitly says that when no disjoint basis exists the pair should be independent, converting annotation overlap into a semantic graph decision.",
                  "Release #55 demonstrates the protected outcome: the production validator accepted a declaration with empty depends_on and the independent semantic oracle later rejected it as a missing g2->g1 dependency.",
              ],
              "evidence_refs": [protected, baseline, source, "services/agent-service/src/agent_core/lifecycle/semantic_contract.py", "services/agent-service/tests/runtime/test_wp08_attempt7_final_authority_and_retry.py"],
              "rejected_hypotheses": [
                  "The Release #55 oracle is stale: historical and current regressions explicitly define this pronoun consult as a true current-turn result dependency.",
                  "The deterministic dependency reducer dropped the edge: Release #55 failure occurs before oracle matching because the semantic declaration itself was accepted with an empty graph.",
                  "Stage 4.2 obligation evidence should be weakened: it is downstream of this structural pair-admissibility failure and remains unchanged.",
                  "All output/basis overlap should be allowed without safeguards: equality and a basis that wraps the requested outcome remain structurally suspicious and stay rejected.",
              ],
              "affected_boundaries": [
                  "literal evidence role classification",
                  "candidate-blind dependency observation admissibility",
                  "adversarial positive-edge closure",
                  "semantic Writer repair boundary",
              ],
          })

          required_tests = {
              "focused": [
                  "strictly nested result-reference basis inside broader requested-output evidence reaches graph mismatch/adversarial handling instead of basis-is-output format rejection",
                  "canonical true-reference case with requested_outputs can close as a positive dependency after the existing adversarial confirmation path",
              ],
              "counterexamples": [
                  "equal basis and requested-output evidence remains rejected",
                  "basis that wraps requested-output evidence remains rejected",
                  "false Draft/support-dataflow dependency is not made authoritative merely because nested overlap is structurally admissible",
              ],
              "regression": [
                  "existing WP08 Attempt 7 false-dependency and true-reference tests remain green",
                  "Stage 4.2 dependency obligation evidence/reducer tests remain green",
                  "product quick profile remains green",
              ],
              "negative_path": [
                  "malformed/nonliteral/unknown-goal dependency basis remains fail-closed",
                  "nested overlap never bypasses target compatibility, counterfactual or adversarial closure obligations",
              ],
          }
          plan_path = case / "repair-plan.json"
          write(plan_path, {
              "schema_version": 1,
              "record_type": "repair-plan",
              "change_id": change_id,
              "root_cause_proof_sha256": sha(root_path),
              "status": "APPROVED",
              "strategy": "Narrow the structural overlap rule rather than changing semantic meaning or authority: reject equality and basis-wrapping-output as before, but allow a strictly smaller literal relation basis nested inside a broader requested-output evidence span to remain provisional. Let the already-existing candidate-blind counterfactual, positive-edge adversarial adjudication, obligation-evidence envelope and deterministic reducer decide dependency authority. Add a focused Release #55 regression using canonical requested_outputs plus negative controls.",
              "changes": [
                  {"path": source, "responsibility": "separate structurally invalid outcome-as-basis overlap from admissible strict nested relation subspan without inferring language meaning", "reason": "the reproduced coercion is localized to this structural evidence-role check and its pairwise proof callers"},
                  {"path": test, "responsibility": "reproduce the protected Release #55 schema interaction and protect equal/wrapping/false-edge counterexamples", "reason": "existing true-reference tests omit requested_outputs and therefore cannot expose the production-schema collision"},
              ],
              "unchanged_boundaries": [
                  "dependency_alignment and dependency_proof remain unchanged",
                  "Stage 4.2 obligation evidence contracts and deterministic reducer remain the authority path",
                  "semantic oracle/catalog remains unchanged",
                  "dialogue Writer projection remains unchanged",
                  "CapabilityGate, transaction authority, business tools/services and production defaults remain unchanged",
              ],
              "forbidden_repairs": [
                  "Do not change semantic_query_then_refund_consult oracle dependencies.",
                  "Do not accept equal or basis-wrapping requested-output evidence as a relation-only proof.",
                  "Do not treat strict nested overlap as authority; it is only provisional evidence and must still pass existing adversarial/obligation closure.",
                  "Do not add keywords, pronoun tables, domain-specific dependency rules or automatic Runtime semantic inference.",
                  "Do not weaken reducer obligations, Quality gates, tests or production certification.",
              ],
              "required_invariants": [
                  "semantic dependency meaning remains model-observed, not substring-inferred",
                  "strict nested relation basis can reach semantic adjudication",
                  "equal/wrapping outcome evidence cannot masquerade as relation proof",
                  "positive edges still require target compatibility, counterfactual and adversarial closure before deterministic authority",
                  "false execution-support dependencies can still be adjudicated independent",
              ],
              "required_tests": required_tests,
              "risks": [
                  "A false positive nested basis may proceed one stage further; existing positive-edge adversarial counterfactual closure must reject it before authority.",
                  "Over-broad output evidence remains legal annotation, so tests must prove it cannot itself become dependency authority.",
                  "Changing broader Writer/oracle semantics would hide rather than repair this structural coercion and is out of scope.",
              ],
              "rollback_plan": "Revert the goal_planning overlap refinement and its focused test together. Do not restore semantic coercion as a compatibility fallback; if adversarial closure proves insufficient, replan that authority boundary separately.",
          })

          review_path = case / "plan-review.json"
          write(review_path, {
              "schema_version": 1,
              "record_type": "plan-review",
              "change_id": change_id,
              "repair_plan_sha256": sha(plan_path),
              "reviewer_role": "repair-plan-reviewer",
              "decision": "APPROVED",
              "approved_paths": [source, test],
              "review_findings": [
                  "The protected failure and deterministic baseline agree on the same boundary: strict nested basis is rejected before semantic/adversarial dependency closure.",
                  "The plan does not trust overlap as authority; it only removes a structural semantic-coercion shortcut and delegates meaning back to the existing model verification plus deterministic authority pipeline.",
                  "Keeping equality and basis-wrapping-output rejected preserves the original anti-outcome-as-basis guard.",
                  "The new regression must include canonical requested_outputs because prior true-reference tests omitted that production-schema dimension.",
              ],
              "skill_rule_mappings": [
                  "AGENTS: reproduce before product write",
                  "AGENTS: root-cause proof before repair",
                  "AGENTS: single authority owner and no parallel fallback",
                  "AGENTS: transition repair requires counterexamples, negative paths and real diff review",
              ],
          })
          PY

          "${pythonLocation}/bin/python" -B skillctl.py product-init \
            --change-id "${CHANGE_ID}" \
            --goal "Close Release #55 dependency output-evidence role overlap without changing semantic oracle or dependency authority." \
            --target-kind repair \
            --allow services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            --allow services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py \
            --forbid skill-system/** \
            --forbid architecture-skill/** \
            --forbid governance/quality-loop-policy.json \
            --forbid governance/evidence/** \
            --forbid .quality/** \
            --forbid AGENTS.md \
            --forbid CLAUDE.md \
            --forbid services/agent-service/src/agent_core/goal_graph/dependency_alignment.py \
            --forbid services/agent-service/src/agent_core/goal_graph/dependency_proof.py \
            --forbid services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py \
            --forbid services/agent-service/tests/context/strong_context_cases/semantic_goal_coverage_suite_v20_4.json \
            --affected-module agent_core.lifecycle.goal_planning \
            --invariant "true explicit current-turn result reference remains a semantic dependency" \
            --invariant "strict nested evidence overlap is provisional only and never dependency authority" \
            --invariant "equal or wrapping outcome evidence remains structurally rejected as dependency basis" \
            --invariant "Stage 4.2 obligation evidence and deterministic reducer remain unchanged authority owners" \
            --invariant "CapabilityGate transaction business tools production defaults and semantic oracle remain unchanged" \
            --minimum-mode quick \
            --quality-target "${TARGET}" \
            --baseline-evidence "${CASE}/evidence/quality-baseline" \
            --repair-governance "${CASE}" \
            --approve \
            --force

          "${pythonLocation}/bin/python" -B skillctl.py repair-permit
          "${pythonLocation}/bin/python" -B skillctl.py contract-begin
          "${pythonLocation}/bin/python" -B skillctl.py contract-validate

      - name: Copy repository-generated governance state into carrier branch
        run: |
          set -euo pipefail
          BASE="${RUNNER_TEMP}/release55-base"
          CHANGE_ID="repair-release55-dependency-output-role-overlap"
          rm -rf "governance/repair-cases/${CHANGE_ID}"
          mkdir -p governance/repair-cases governance/targets governance/claims
          cp -R "${BASE}/governance/repair-cases/${CHANGE_ID}" governance/repair-cases/
          cp "${BASE}/governance/targets/${CHANGE_ID}.md" "governance/targets/${CHANGE_ID}.md"
          cp "${BASE}/governance/claims/${CHANGE_ID}.json" "governance/claims/${CHANGE_ID}.json"
          cp "${BASE}/governance/active-change.json" governance/active-change.json

      - name: Commit governed permit to repair branch
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          CHANGE_ID="repair-release55-dependency-output-role-overlap"
          git config user.name "customer-agent-governance[bot]"
          git config user.email "customer-agent-governance[bot]@users.noreply.github.com"
          git add governance/active-change.json \
            "governance/targets/${CHANGE_ID}.md" \
            "governance/claims/${CHANGE_ID}.json" \
            "governance/repair-cases/${CHANGE_ID}"
          if git diff --cached --quiet; then
            echo "governance state already current"
            exit 0
          fi
          git commit -m "Govern Release 55 dependency evidence-role repair"
          git push origin "HEAD:${HEAD_REF}"
