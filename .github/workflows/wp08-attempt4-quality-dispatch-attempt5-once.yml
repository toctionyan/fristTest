name: wp08-attempt4-quality-dispatch-attempt5-once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  advance:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt4-quality-dispatch-attempt5-once-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_MAIN_SHA: aa59cc6dc59d783f3bec5161467b51fbd1f62f63
      RELEASE_ISSUE_NUMBER: '335'
      EXPECTED_RELEASE_ID: wp08-release-31340813528
      PARENT_WP08_RUN_ID: '31351903660'
      EXPECTED_ATTEMPT: '5'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact authoritative main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Wait for exact-main push Quality and reconstruct workflow_run event
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib import parse, request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; sha=os.environ['EXPECTED_MAIN_SHA']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          deadline=time.time()+12*60; last=None
          while time.time()<deadline:
              query=parse.urlencode({'event':'push','branch':'main','per_page':50})
              req=request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/quality.yml/runs?{query}',headers=headers)
              with request.urlopen(req,timeout=30) as response: payload=json.load(response)
              matches=[r for r in payload.get('workflow_runs') or [] if str(r.get('head_sha') or '')==sha and str(r.get('head_branch') or '')=='main' and str(r.get('event') or '')=='push']
              if matches:
                  run=max(matches,key=lambda r:int(r.get('id') or 0)); last={'id':int(run.get('id') or 0),'status':str(run.get('status') or ''),'conclusion':str(run.get('conclusion') or '')}
                  print(json.dumps({'exact_main_quality':last,'candidate_sha':sha},sort_keys=True),flush=True)
                  if last['status']=='completed':
                      if last['conclusion']!='success': raise SystemExit('exact-main push Quality non-success: '+json.dumps(last,sort_keys=True))
                      Path('/tmp/wp08-quality-event.json').write_text(json.dumps({'workflow_run':run}),encoding='utf-8')
                      break
              time.sleep(15)
          else:
              raise SystemExit('timed out waiting for exact-main push Quality: '+json.dumps(last,sort_keys=True))
          PY
      - name: Verify durable state is waiting for this repair CI
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib import request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; issue_number=int(os.environ['RELEASE_ISSUE_NUMBER'])
          req=request.Request(f'https://api.github.com/repos/{repo}/issues/{issue_number}',headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'})
          with request.urlopen(req,timeout=30) as response: issue=json.load(response)
          body=str(issue.get('body') or ''); block=body.split('<!-- WP08_RELEASE_RUN_STATE_BEGIN -->',1)[1].split('<!-- WP08_RELEASE_RUN_STATE_END -->',1)[0]
          state=json.loads(block.split('```json',1)[1].split('```',1)[0])
          if state.get('release_run_id')!=os.environ['EXPECTED_RELEASE_ID']: raise SystemExit('release id mismatch')
          if state.get('status')!='WAITING_FOR_REPAIR_CI': raise SystemExit('unexpected pre-dispatch status: '+str(state.get('status')))
          if int(state.get('attempt') or 0)!=4: raise SystemExit('unexpected attempt before dispatch')
          if str(state.get('current_candidate_sha') or '')!=os.environ['EXPECTED_MAIN_SHA']: raise SystemExit('candidate mismatch before dispatch')
          if int(state.get('last_wp08_run_id') or 0)!=int(os.environ['PARENT_WP08_RUN_ID']): raise SystemExit('parent WP08 run mismatch')
          repair=state.get('repair_pr') or {}
          if int(repair.get('number') or 0)!=377 or str(repair.get('merge_commit_sha') or '')!=os.environ['EXPECTED_MAIN_SHA']: raise SystemExit('repair binding mismatch')
          if state.get('production_closed') is not False: raise SystemExit('production_closed unexpectedly true')
          print(json.dumps({'status':'PASS','attempt':4,'release_state':'WAITING_FOR_REPAIR_CI','candidate_sha':os.environ['EXPECTED_MAIN_SHA']},sort_keys=True))
          PY
      - name: Feed exact push Quality to repository coordinator
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/wp08_release_coordinator.py --mode workflow-run --event-path /tmp/wp08-quality-event.json
      - name: Verify Attempt 5 dispatched exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib import request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; issue_number=int(os.environ['RELEASE_ISSUE_NUMBER'])
          req=request.Request(f'https://api.github.com/repos/{repo}/issues/{issue_number}',headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'})
          with request.urlopen(req,timeout=30) as response: issue=json.load(response)
          body=str(issue.get('body') or ''); block=body.split('<!-- WP08_RELEASE_RUN_STATE_BEGIN -->',1)[1].split('<!-- WP08_RELEASE_RUN_STATE_END -->',1)[0]
          state=json.loads(block.split('```json',1)[1].split('```',1)[0])
          expected_attempt=int(os.environ['EXPECTED_ATTEMPT']); expected_sha=os.environ['EXPECTED_MAIN_SHA']; parent=int(os.environ['PARENT_WP08_RUN_ID'])
          if state.get('status')!='CERTIFYING': raise SystemExit('Attempt 5 did not enter CERTIFYING: '+str(state.get('status')))
          if int(state.get('attempt') or 0)!=expected_attempt: raise SystemExit('attempt mismatch')
          if str(state.get('current_candidate_sha') or '')!=expected_sha: raise SystemExit('candidate mismatch')
          current=int(state.get('current_wp08_run_id') or 0)
          if current<=0 or current==parent: raise SystemExit('new WP08 run id missing')
          if state.get('production_closed') is not False: raise SystemExit('production_closed unexpectedly true')
          history=list(state.get('history') or [])
          repair_rows=[r for r in history if isinstance(r,dict) and r.get('event')=='repair_merged' and int(r.get('pr_number') or 0)==377 and str(r.get('candidate_sha') or '')==expected_sha]
          dispatch_rows=[r for r in history if isinstance(r,dict) and r.get('event')=='wp08_dispatched' and int(r.get('attempt') or 0)==expected_attempt and str(r.get('candidate_sha') or '')==expected_sha and int(r.get('wp08_run_id') or 0)==current]
          if len(repair_rows)!=1: raise SystemExit('repair_merged history must be exactly one')
          if len(dispatch_rows)!=1: raise SystemExit('Attempt5 dispatch history must be exactly one')
          print(json.dumps({'status':'PASS','issue':issue_number,'attempt':expected_attempt,'candidate_sha':expected_sha,'wp08_run_id':current,'production_closed':False},sort_keys=True))
          PY
