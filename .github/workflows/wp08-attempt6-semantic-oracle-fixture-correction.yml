name: wp08-attempt6-semantic-oracle-fixture-correction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate-and-publish-fixture-correction:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt6-semantic-oracle-test-fixture-correction-20260808'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FORMAL_BRANCH: agent/wp08-attempt6-provider-checkpoint-semantic-repair-20260808
      FORMAL_HEAD: 97ab95877f21d7f81b66441a7a9e98c258f4925e
    steps:
      - name: Checkout carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: wp08-attempt6-semantic-oracle-test-fixture-correction-20260808
          path: carrier
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact formal candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.FORMAL_HEAD }}
          path: candidate
          fetch-depth: 1
          persist-credentials: true

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Verify branch authority and apply one-file fixture correction
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$FORMAL_HEAD"
          REMOTE="$(git -C candidate ls-remote origin refs/heads/$FORMAL_BRANCH | awk '{print $1}')"
          test "$REMOTE" = "$FORMAL_HEAD"
          "${pythonLocation}/bin/python" -B \
            carrier/scripts/wp08_attempt6_semantic_oracle_fixture_correction.py candidate
          cd candidate
          git diff --check
          test "$(git diff --name-only "$FORMAL_HEAD" --)" = \
            'services/agent-service/tests/architecture/test_quality_loop_governance.py'

      - name: Install locked Agent environment
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r candidate/deployment/ci/uv-requirements-linux-x86_64.txt
          cd candidate/services/agent-service
          uv sync --locked --all-groups

      - name: Run exact Quick adversarial counterexample gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/.quality/attempt6-fixture-correction
          candidate/services/agent-service/.venv/bin/python -B \
            candidate/scripts/run_agent_pytest.py \
            --workspace-root candidate \
            --junitxml candidate/.quality/attempt6-fixture-correction/adversarial.xml \
            tests/runtime/test_goal_binding_counterexamples.py \
            tests/runtime/test_semantic_grounding_read.py \
            tests/runtime/test_similar_capability_rejection.py \
            tests/context/test_parameterized_capability_alignment.py \
            tests/architecture/test_quality_loop_governance.py

      - name: Publish only validated fixture correction
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          git clean -fdX
          find . -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          test "$(git diff --name-only "$FORMAL_HEAD" --)" = \
            'services/agent-service/tests/architecture/test_quality_loop_governance.py'
          REMOTE="$(git ls-remote origin refs/heads/$FORMAL_BRANCH | awk '{print $1}')"
          test "$REMOTE" = "$FORMAL_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/agent-service/tests/architecture/test_quality_loop_governance.py
          git diff --cached --check
          git commit -m 'Align semantic smoke governance fixtures with requested-effect authority'
          test "$(git rev-parse HEAD^)" = "$FORMAL_HEAD"
          git push --force-with-lease=refs/heads/${FORMAL_BRANCH}:${FORMAL_HEAD} origin HEAD:refs/heads/$FORMAL_BRANCH
