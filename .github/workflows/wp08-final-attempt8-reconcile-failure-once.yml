name: wp08-final-attempt8-reconcile-failure-once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-final-attempt8-reconcile-failure-once-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 1ed0be9a2ad0965813142c532df3d13bb1b225e1
      EXPECTED_WP08_RUN_ID: '31327858933'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact authoritative final candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Reconcile completed final Attempt 8 without dispatching another attempt
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python -B scripts/wp08_release_recovery.py --mode reconcile
          python - <<'PY'
          import json
          import os
          from urllib import request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          expected_sha = os.environ['EXPECTED_MAIN_SHA']
          expected_run = int(os.environ['EXPECTED_WP08_RUN_ID'])
          req = request.Request(
              f'https://api.github.com/repos/{repo}/issues/293',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with request.urlopen(req, timeout=30) as response:
              issue = json.load(response)
          body = str(issue.get('body') or '')
          state_text = body.split('<!-- WP08_RELEASE_RUN_STATE_BEGIN -->', 1)[1].split('<!-- WP08_RELEASE_RUN_STATE_END -->', 1)[0]
          payload = state_text.split('```json', 1)[1].split('```', 1)[0]
          state = json.loads(payload)
          if int(state.get('attempt') or 0) != 8 or int(state.get('max_attempts') or 0) != 8:
              raise SystemExit('final attempt budget changed unexpectedly')
          if str(state.get('current_candidate_sha') or '') != expected_sha:
              raise SystemExit('final candidate SHA mismatch')
          if int(state.get('current_wp08_run_id') or 0) != expected_run:
              raise SystemExit('final WP-08 run ID mismatch')
          if str(state.get('last_wp08_conclusion') or '') != 'failure':
              raise SystemExit('final failure was not durably reconciled')
          if int(state.get('last_wp08_run_id') or 0) != expected_run:
              raise SystemExit('last WP-08 run does not point to final Attempt 8')
          if state.get('production_closed') is not False:
              raise SystemExit('production_closed must remain false after failed final certification')
          if str(state.get('status') or '') == 'CERTIFYING':
              raise SystemExit('ledger remained stale at CERTIFYING')
          if any(
              isinstance(row, dict)
              and row.get('event') == 'wp08_dispatched'
              and int(row.get('attempt') or 0) > 8
              for row in list(state.get('history') or [])
          ):
              raise SystemExit('forbidden attempt greater than 8 detected')
          print(json.dumps({
              'status': 'PASS',
              'release_state': state.get('status'),
              'attempt': state.get('attempt'),
              'max_attempts': state.get('max_attempts'),
              'candidate_sha': state.get('current_candidate_sha'),
              'last_wp08_run_id': state.get('last_wp08_run_id'),
              'last_wp08_conclusion': state.get('last_wp08_conclusion'),
              'production_closed': state.get('production_closed'),
          }, sort_keys=True))
          PY
