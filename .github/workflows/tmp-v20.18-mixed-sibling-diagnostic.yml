name: temporary-v20.18-mixed-sibling-diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-v20.18-mixed-sibling-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: production-certification
    env:
      OPENAI_API_KEY: ${{ secrets.PRODUCTION_MODEL_API_KEY }}
      CONFIG_MODEL_PROVIDER: ${{ vars.REAL_MODEL_CERTIFICATION_PROVIDER || vars.PRODUCTION_MODEL_PROVIDER || vars.MODEL_PROVIDER }}
      CONFIG_MODEL_ID: ${{ vars.OPENAI_MODEL || vars.PRODUCTION_MODEL_ID || vars.MODEL_ID }}
      CONFIG_MODEL_API_BASE: ${{ vars.OPENAI_API_BASE || vars.PRODUCTION_MODEL_API_BASE || vars.MODEL_API_BASE }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent and Business environments
        run: |
          cd services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups
      - name: Resolve protected official model identity
        run: |
          "${pythonLocation}/bin/python" -B - <<'PY'
          import json, os
          from pathlib import Path
          profile = json.loads(Path('deployment/ci/wp08-production-profile.json').read_text(encoding='utf-8'))
          if profile.get('contract') != 'wp08-production-profile@1': raise SystemExit('invalid versioned production profile')
          provider = str(os.environ.get('CONFIG_MODEL_PROVIDER') or profile.get('model_provider') or '').strip().casefold()
          model = str(os.environ.get('CONFIG_MODEL_ID') or profile.get('model_id') or '').strip()
          base = str(os.environ.get('CONFIG_MODEL_API_BASE') or profile.get('model_api_base') or '').strip().rstrip('/')
          if provider == 'openai' and base != 'https://api.openai.com/v1': raise SystemExit('OpenAI diagnostic must use official endpoint')
          if provider == 'deepseek' and base not in {'https://api.deepseek.com', 'https://api.deepseek.com/v1'}: raise SystemExit('DeepSeek diagnostic must use official endpoint')
          if provider not in {'openai', 'deepseek'}: raise SystemExit(f'unsupported protected provider: {provider!r}')
          if not model or not os.environ.get('OPENAI_API_KEY'): raise SystemExit('protected model identity/credential unavailable')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'REAL_MODEL_CERTIFICATION_PROVIDER={provider}\nOPENAI_MODEL={model}\nOPENAI_API_BASE={base}\n')
          print(json.dumps({'provider': provider, 'model': model, 'endpoint': base, 'credential_present': True}))
          PY
      - name: Capture mixed sibling state
        run: |
          services/agent-service/.venv/bin/python -B - <<'PY'
          from __future__ import annotations
          import json, os, sqlite3, sys
          from pathlib import Path
          from uuid import uuid4
          root = Path('.').resolve()
          for path in (root / 'services/agent-service/src', root / 'services/agent-service/scripts', root / 'scripts'): sys.path.insert(0, str(path))
          from agent_core.model_calls import resolve_real_model_identity
          from verify_full_lifecycle_canary import ProductRuntimeHarness
          from verify_preprod_full_lifecycle import _attest_lifecycle_model_calls, _call, _graph_diagnostics, _token, _transaction_ids

          def graph_states(database):
              states=[]
              with sqlite3.connect(database) as connection:
                  rows=connection.execute("SELECT id, output_json FROM trace_logs WHERE event_type='graph_snapshot' ORDER BY id").fetchall()
              for trace_id, raw in rows:
                  payload=json.loads(raw or '{}'); state=payload.get('state') if isinstance(payload.get('state'),dict) else payload
                  if isinstance(state,dict): states.append((trace_id,state))
              return states

          def goal_rows(value):
              return [{'goal_id':r.get('goal_id'),'description':r.get('description'),'evidence_span':r.get('evidence_span'),'required':r.get('required'),'depends_on':r.get('depends_on'),'requested_effect':r.get('requested_effect'),'coverage_status':r.get('coverage_status'),'covered_by_terminal_tools':r.get('covered_by_terminal_tools')} for r in list((value or {}).get('goals') or []) if isinstance(r,dict)]

          def first_present(states,key):
              for trace_id,state in states:
                  value=state.get(key)
                  if value not in (None,{},[]): return {'trace_id':trace_id,'value':value}
              return None

          def declaration_calls(states):
              seen=set(); output=[]
              for trace_id,state in states:
                  for row in list(state.get('tool_trace') or []):
                      if not isinstance(row,dict) or row.get('name')!='declare_turn_goals': continue
                      identity=str(row.get('id') or row.get('call_id') or '') + ':' + json.dumps(row.get('args') or {},ensure_ascii=False,sort_keys=True)
                      if identity in seen: continue
                      seen.add(identity); args=row.get('args') if isinstance(row.get('args'),dict) else {}; result=row.get('result') if isinstance(row.get('result'),dict) else {}
                      output.append({'trace_id':trace_id,'summary':args.get('summary'),'goals':goal_rows({'goals':args.get('goals') or []}),'result_ok':result.get('ok'),'result_code':result.get('code'),'result_data':result.get('data') if isinstance(result.get('data'),dict) else None})
              return output

          def tool_rows(state):
              out=[]
              for row in list(state.get('tool_trace') or []):
                  if not isinstance(row,dict): continue
                  args=row.get('args') if isinstance(row.get('args'),dict) else {}; result=row.get('result') if isinstance(row.get('result'),dict) else {}; proof=row.get('match_proof') if isinstance(row.get('match_proof'),dict) else result.get('match_proof') if isinstance(result.get('match_proof'),dict) else {}
                  out.append({'name':row.get('name'),'goal_ids':list(args.get('goal_ids') or []),'result_ok':result.get('ok'),'result_code':result.get('code'),'match_goal_ids':list(proof.get('goal_ids') or []),'capability_surface':proof.get('capability_surface'),'goal_effect_identity':proof.get('goal_effect_identity')})
              return out

          harness=ProductRuntimeHarness(deterministic_model=False); harness.env.update({'CAPABILITY_SEMANTIC_VERIFIER_MODE':'model','GOAL_ALIGNMENT_VERIFIER_MODE':'model','GOAL_GRANULARITY_VERIFIER_MODE':'model','ANSWER_RELEASE_ALIGNMENT_VERIFIER_MODE':'model'})
          identity=resolve_real_model_identity(harness.env); evidence={'contract':'v20.18-mixed-sibling-diagnostic@2','source_sha':os.environ.get('GITHUB_SHA'),'identity':{k:identity.get(k) for k in ('provider','endpoint','model','credential_fingerprint_sha256_16')}}
          with harness:
              base=harness.agent_url; token=_token(base,harness.env); database=harness.runtime_dir/'agent.db'; before=_transaction_ids(_call(base,'/api/transactions',token=token))
              response=_call(base,'/api/chat/turn',method='POST',token=token,body={'thread_id':f'v2018-mixed-diagnostic-{uuid4().hex}','message':'查一下鼠标物流，再告诉我快递员手机号'})
              states=graph_states(database); latest=states[-1][1] if states else {}; after=_transaction_ids(_call(base,'/api/transactions',token=token))
              frozen=first_present(states,'frozen_semantic_contract'); declaration=first_present(states,'goal_declaration'); surface=first_present(states,'capability_surface'); policy=first_present(states,'pretool_execution_policy'); plan=first_present(states,'grounded_execution_plan')
              evidence.update({'response_type':response.get('type') if isinstance(response,dict) else None,'status':latest.get('status'),'graph_snapshot_count':len(states),'declare_turn_goals_calls':declaration_calls(states),'first_frozen_semantic_contract':{'trace_id':frozen['trace_id'],'goals':goal_rows(frozen['value']),'alignment_proof':frozen['value'].get('alignment_proof'),'granularity_proof':frozen['value'].get('granularity_proof')} if frozen and isinstance(frozen['value'],dict) else None,'first_goal_declaration':{'trace_id':declaration['trace_id'],'goals':goal_rows(declaration['value'])} if declaration and isinstance(declaration['value'],dict) else None,'first_capability_surface':{'trace_id':surface['trace_id'],'value':surface['value']} if surface else None,'first_pretool_execution_policy':{'trace_id':policy['trace_id'],'value':policy['value']} if policy else None,'first_grounded_execution_plan':{'trace_id':plan['trace_id'],'goals':goal_rows(plan['value']),'status':plan['value'].get('status')} if plan and isinstance(plan['value'],dict) else None,'latest_tool_trace':tool_rows(latest),'model_attestation':_attest_lifecycle_model_calls(diagnostics=_graph_diagnostics(database),identity=identity,turn_index=1),'transaction_delta':len(after-before)+len(before-after)})
          Path('/tmp/v20.18-mixed-sibling-diagnostic.json').write_text(json.dumps(evidence,ensure_ascii=False,indent=2)+'\n',encoding='utf-8'); print(json.dumps(evidence,ensure_ascii=False))
          if evidence['transaction_delta'] != 0: raise RuntimeError('diagnostic changed transaction state')
          PY
      - name: Upload mixed sibling diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v20.18-mixed-sibling-diagnostic-${{ github.run_id }}
          path: /tmp/v20.18-mixed-sibling-diagnostic.json
          retention-days: 30
          if-no-files-found: warn
