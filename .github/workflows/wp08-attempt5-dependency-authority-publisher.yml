name: wp08-attempt5-dependency-authority-publisher

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt5-dependency-authority-publisher-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout formal Attempt 5 repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: agent/wp08-attempt5-dependency-authority-20260810
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Apply reviewed Attempt 5 authority patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "0c6c8960c7a8472f988658d8a6ddc829d6052a09"
          python -B .github/wp08-attempt5-dependency-authority-fix.py
          python -m py_compile \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/lifecycle/goal_granularity.py \
            services/agent-service/src/agent_core/lifecycle/protocol.py \
            services/agent-service/scripts/verify_preprod_conversation_smoke.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py
          git diff --check
      - name: Run focused Attempt 5 regression gates
        shell: bash
        run: |
          set -euo pipefail
          cd services/agent-service
          PYTHONPATH=src .venv/bin/python -B -m pytest -q \
            tests/runtime/test_wp08_attempt5_dependency_authority.py \
            tests/runtime/test_wp08_attempt4_release_repairs.py \
            tests/runtime/test_goal_granularity_and_conditions.py \
            tests/context/test_reference_resolution_contract.py
          cd ../..
          PYTHONPATH=services/agent-service/src services/agent-service/.venv/bin/python -B skill-system/tests/test_wp08_new_release_attempt3_root_fixes.py
          PYTHONPATH=services/agent-service/src:services/agent-service services/agent-service/.venv/bin/python -B -m pytest -q \
            services/agent-service/tests/context/test_semantic_goal_coverage_suite_execution.py \
            services/agent-service/tests/runtime/test_semantic_reference_binding.py
      - name: Commit focused-green product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/lifecycle/goal_granularity.py \
            services/agent-service/src/agent_core/lifecycle/protocol.py \
            services/agent-service/scripts/verify_preprod_conversation_smoke.py \
            services/agent-service/tests/runtime/test_wp08_attempt4_release_repairs.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py \
            skill-system/tests/test_wp08_new_release_attempt3_root_fixes.py
          git commit -m 'fix: separate outcome and dependency semantic authority'
      - name: Regenerate protected baseline and publish formal branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          root=Path('.').resolve(); path=root/'skill-system/registry/product-source-baseline.json'
          previous=json.loads(path.read_text(encoding='utf-8')); roots=['services','web','contracts']
          raw=subprocess.check_output(['git','ls-files','-z','--',*roots],cwd=root)
          tracked=sorted(x.decode() for x in raw.split(b'\0') if x)
          files={rel:hashlib.sha256((root/rel).read_bytes()).hexdigest() for rel in tracked}
          head=subprocess.check_output(['git','rev-parse','HEAD'],cwd=root,text=True).strip()
          payload={'schema_version':int(previous.get('schema_version') or 2),'generated_from':f'git:{head}','source_release_sha256':str(previous.get('source_release_sha256') or ''),'generated_at':datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),'protected_roots':roots,'file_count':len(files),'files':files}
          if any(len(v)!=64 for v in files.values()): raise SystemExit('invalid protected sha256')
          path.write_text(json.dumps(payload,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git rm .github/wp08-attempt5-dependency-authority-fix.py
          git diff --check
          git add skill-system/registry/product-source-baseline.json .github/wp08-attempt5-dependency-authority-fix.py
          git commit -m 'chore: bind Attempt 5 repair to exact protected baseline'
          git push origin HEAD:agent/wp08-attempt5-dependency-authority-20260810
