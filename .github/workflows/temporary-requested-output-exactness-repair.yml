name: temporary-requested-output-exactness-repair

on:
  push:
    branches:
      - fix/semantic-requested-output-exactness-20260815
    paths:
      - .github/requested-output-exactness-repair.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/semantic-requested-output-exactness-20260815
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Apply requested-output exactness repair
        run: |
          python -B .github/temporary_requested_output_exactness_repair_anchor_fix.py
          python -B .github/temporary_requested_output_exactness_repair.py
      - name: Run focused semantic regressions
        run: |
          PYTHONPATH=services/agent-service/src services/agent-service/.venv/bin/python -B -m pytest -q \
            services/agent-service/tests/runtime/test_requested_output_exactness_redeclaration_feedback.py \
            services/agent-service/tests/runtime/test_scope_constraint_redeclaration_feedback.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py \
            services/agent-service/tests/runtime/test_semantic_dependency_counterfactual_contract.py
          git diff --check
      - name: Commit governed semantic repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py \
            services/agent-service/tests/runtime/test_requested_output_exactness_redeclaration_feedback.py \
            .github/release-trigger
          git commit -m 'fix(semantic): verify requested outputs against canonical meaning'
      - name: Refresh tracked protected baseline
        run: >-
          python -B scripts/refresh_product_source_baseline.py
          --generated-from-sha "$(git rev-parse HEAD)"
      - name: Verify protected baseline binding
        run: |
          PYTHONPATH=services/agent-service/src python -B -m unittest skill-system.tests.test_product_source_baseline_binding
          git diff --check
      - name: Remove temporary repair machinery and commit baseline
        run: |
          git rm \
            .github/requested-output-exactness-repair.trigger \
            .github/temporary_requested_output_exactness_repair.py \
            .github/temporary_requested_output_exactness_repair_anchor_fix.py \
            .github/workflows/temporary-requested-output-exactness-repair.yml
          git add skill-system/registry/product-source-baseline.json
          git commit -m 'chore(governance): refresh protected source baseline'
          git push origin HEAD:fix/semantic-requested-output-exactness-20260815
