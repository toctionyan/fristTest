name: tmp-local-workspace-export

on:
  push:
    branches:
      - fix/wp08-literal-evidence-repair-20260813

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          clean: true
          persist-credentials: false
      - name: Prove clean exact workspace
        run: |
          set -euo pipefail
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"
          git rev-parse HEAD
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4 pinned
        with:
          name: tmp-local-workspace-${{ github.run_id }}
          path: .
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
