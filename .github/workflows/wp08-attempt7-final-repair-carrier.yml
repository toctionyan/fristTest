name: wp08-attempt7-final-repair-carrier

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt7-final-repair-20260810' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: wp08-attempt7-final-repair-20260810
          fetch-depth: 1
      - name: Apply exact deterministic patch
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/wp08_attempt7_final_patch_v2.py
          git diff --check
          git status --short
          git add services/agent-service/src/agent_core/lifecycle/goal_planning.py \
                  services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py \
                  services/agent-service/tests/runtime/test_wp08_attempt7_final_repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: repair Attempt 7 dependency audit and workflow frontier'
          git push origin HEAD:wp08-attempt7-final-repair-20260810
