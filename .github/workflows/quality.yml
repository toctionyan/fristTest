name: quality

on:
  pull_request:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  replay-wp08-completion:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Fetch authoritative completed WP-08 run and replay coordinator event
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: '31388991073'
          EXPECTED_SHA: '77a0c615ec90260a838e73bdbea24dbbbb85ee85'
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" \
            > "${RUNNER_TEMP}/run.json"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads((Path(os.environ['RUNNER_TEMP']) / 'run.json').read_text())
          assert run['id'] == int(os.environ['RUN_ID'])
          assert run['name'] == 'wp08-full-stack-certification'
          assert run['event'] == 'workflow_dispatch'
          assert run['status'] == 'completed'
          assert run['conclusion'] == 'failure'
          assert run['head_sha'] == os.environ['EXPECTED_SHA']
          (Path(os.environ['RUNNER_TEMP']) / 'event.json').write_text(
              json.dumps({'workflow_run': run}), encoding='utf-8'
          )
          PY
          GH_TOKEN="${GH_TOKEN}" GITHUB_TOKEN="${GH_TOKEN}" \
            python -B scripts/wp08_release_coordinator.py \
            --mode workflow-run --event-path "${RUNNER_TEMP}/event.json"
