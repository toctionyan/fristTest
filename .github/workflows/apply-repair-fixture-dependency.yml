name: Apply Repair Fixture Dependency

"on":
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_repair_fixture_dependency.py
      - .github/workflows/apply-repair-fixture-dependency.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Complete temporary controller fixture
        run: "${pythonLocation}/bin/python -B scripts/apply_repair_fixture_dependency.py"
      - name: Commit exact fixture repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Include locked Python owner in repair controller fixture"
          git push origin HEAD:${{ github.head_ref }}
