name: Configure DeepSeek and Alibaba Defaults
# Retrigger after the workflow became visible on the branch.

"on":
  push:
    branches:
      - agent/configure-deepseek-aliyun-models
    paths:
      - scripts/configure_deepseek_aliyun_defaults.py
      - .github/workflows/configure-deepseek-aliyun-defaults.yml

permissions:
  contents: write

jobs:
  configure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Apply bounded model defaults
        id: configure
        shell: bash
        run: |
          if [ ! -f scripts/configure_deepseek_aliyun_defaults.py ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          "${pythonLocation}/bin/python" -B scripts/configure_deepseek_aliyun_defaults.py
          echo "applied=true" >> "$GITHUB_OUTPUT"
      - name: Commit exact configured tree
        if: steps.configure.outputs.applied == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Configure DeepSeek Flash and Alibaba text embeddings"
          git push origin HEAD:${{ github.ref_name }}
