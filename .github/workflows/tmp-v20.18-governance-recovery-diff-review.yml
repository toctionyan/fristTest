name: tmp-v20.18-governance-recovery-diff-review

on:
  push:
    branches:
      - tmp/v20.18-governance-recovery-20260814

permissions:
  contents: read

jobs:
  historical-diff-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout recovery carrier
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct exact historical governed candidate
        shell: bash
        run: |
          set -euo pipefail
          target_sha="55403a01f957257fbbefead32bcde21b7d866001"
          test "$(git rev-parse HEAD^)" != "$target_sha"
          test "$(git rev-parse HEAD^^)" = "$target_sha"
          rm -rf /tmp/v2018-recovery
          mkdir -p /tmp/v2018-recovery
          git archive "$target_sha" | tar -x -C /tmp/v2018-recovery
          change_id="$(python3 -c "import json, pathlib; print(json.loads(pathlib.Path('/tmp/v2018-recovery/governance/active-change.json').read_text())['change_id'])")"
          test "$change_id" = "migration-v20.18-semantic-single-writer-output-coverage"

      - name: Run repository-owned deterministic diff review
        shell: bash
        working-directory: /tmp/v2018-recovery
        run: |
          set -euo pipefail
          python3 -B skillctl.py repair-governance-status
          python3 -B skillctl.py repair-diff-review --decision PASS
          python3 -c "import json,pathlib; p=pathlib.Path('governance/repair-cases/migration-v20.18-semantic-single-writer-output-coverage/diff-review.json'); d=json.loads(p.read_text()); assert d['decision']=='PASS',d; assert d['out_of_scope_paths']==[],d; assert d['deterministic_findings']==[],d; assert d['candidate_source_fingerprint']!=d['baseline_source_fingerprint'],d; print(json.dumps({'status':'PASS','decision':d['decision'],'changed_paths':d['changed_paths'],'out_of_scope_paths':d['out_of_scope_paths'],'candidate_source_fingerprint':d['candidate_source_fingerprint'],'baseline_source_fingerprint':d['baseline_source_fingerprint']},indent=2))"

      - name: Stage deterministic recovery evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p recovery-artifact
          cp /tmp/v2018-recovery/governance/repair-cases/migration-v20.18-semantic-single-writer-output-coverage/diff-review.json recovery-artifact/ 2>/dev/null || true
          cp /tmp/v2018-recovery/governance/active-change.json recovery-artifact/active-change-at-55403.json
          printf '%s\n' '55403a01f957257fbbefead32bcde21b7d866001' > recovery-artifact/historical-candidate-sha.txt

      - name: Upload recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v20.18-governance-recovery-diff-review
          path: recovery-artifact
          if-no-files-found: error
