name: release56-canonical-dependency-contract-migration

on:
  push:
    branches:
      - repair/release56-dependency-verifier-nested-basis-contract-20260816
    paths:
      - .github/release56-prompt-contract-patch-trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: repair/release56-dependency-verifier-nested-basis-contract-20260816
          fetch-depth: 0

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'

      - name: Apply canonical projection migration
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          python -B scripts/migrate_release56_dependency_contract.py
          python -B scripts/verify_dependency_basis_contract.py --write-manifest
          python -m py_compile \
            services/agent-service/src/agent_core/goal_graph/dependency_basis_contract.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            scripts/verify_dependency_basis_contract.py \
            services/agent-service/tests/runtime/test_release56_dependency_basis_contract.py

      - name: Install locked Agent validation environment
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups

      - name: Prove canonical contract and semantic invariants
        shell: bash
        run: |
          set -euo pipefail
          services/agent-service/.venv/bin/python -B scripts/verify_dependency_basis_contract.py
          cd services/agent-service
          PYTHONPATH=src .venv/bin/python -B -m pytest -q -ra -p no:cacheprovider \
            tests/runtime/test_release55_dependency_output_role_overlap.py \
            tests/runtime/test_release56_dependency_basis_contract.py

      - name: Remove temporary migration authority
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release56-prompt-contract-patch.yml
          git rm .github/release56-prompt-contract-patch-trigger
          git rm scripts/migrate_release56_dependency_contract.py
          if git diff --name-only | grep -Fx 'skill-system/registry/product-source-baseline.json'; then
            echo "Baseline refresh is forbidden before governance closure." >&2
            exit 1
          fi
          if ! git diff --quiet origin/main -- services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py; then
            echo "Protected Release 55 oracle was not restored exactly to main." >&2
            exit 1
          fi
          git diff --check

      - name: Commit canonical contract migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only | sort
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(semantic): canonicalize dependency basis contract'
          git push origin HEAD:repair/release56-dependency-verifier-nested-basis-contract-20260816
