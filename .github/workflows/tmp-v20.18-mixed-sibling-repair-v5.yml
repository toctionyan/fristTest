name: temporary-v20.18-mixed-sibling-dependency-repair-v5

on:
  push:
    branches:
      - repair/v20.18-mixed-sibling-dependency-evidence-20260813
    paths:
      - .github/workflows/tmp-v20.18-mixed-sibling-repair-v5.yml

permissions:
  contents: write

env:
  PYTHONPATH: ${{ github.workspace }}/services/agent-service/src

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 2
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Apply generic dependency-evidence repair
        run: |
          "${pythonLocation}/bin/python" -B - <<'PY'
          from pathlib import Path
          p=Path('services/agent-service/src/agent_core/lifecycle/goal_planning.py'); s=p.read_text(encoding='utf-8')
          start=s.index('def _model_alignment_pairwise_dependency_proof('); pos=s.index('            edge = (dependent, prerequisite)\n', start)
          if 'goal_alignment_dependency_basis_is_requested_output' in s: raise SystemExit('guard already present')
          guard='''            dependent_requested_effect = goal_by_id[dependent].get("requested_effect")\n            dependent_requested_outputs = (dependent_requested_effect.get("requested_outputs") if isinstance(dependent_requested_effect, dict) else [])\n            requested_output_spans = {\n                _clean_text(row.get("evidence_span"), limit=240)\n                for row in list(dependent_requested_outputs or [])\n                if isinstance(row, dict) and _clean_text(row.get("evidence_span"), limit=240)\n            }\n            if any(basis_span in output_span for output_span in requested_output_spans):\n                return base_details, f"goal_alignment_dependency_basis_is_requested_output:{index}"\n'''
          s=s[:pos]+guard+s[pos:]
          anchor='        blind_dependency_rules = [\n'; q=s.index(anchor)+len(anchor)
          s=s[:q]+'            "dependency basis evidence must identify the result-reference, result-condition or result-value-input relation itself; "\n            "if a proposed basis_span is only or wholly inside the dependent Goal requested_outputs evidence_span, that phrase proves only the requested output and the pair must be independent",\n'+s[q:]
          p.write_text(s,encoding='utf-8')
          t=Path('services/agent-service/tests/runtime/test_mixed_sibling_dependency_evidence.py')
          t.write_text('''from __future__ import annotations\n\nfrom agent_core.lifecycle.goal_planning import _model_alignment_pairwise_dependency_proof\n\ndef _goal(goal_id: str, *, evidence_span: str, output_id: str, output_span: str, depends_on: list[str] | None = None) -> dict:\n    return {"goal_id": goal_id, "description": evidence_span, "evidence_span": evidence_span, "required": True, "depends_on": list(depends_on or []), "requested_effect": {"domain": "example", "operation": "read", "object_type": "example", "requested_outputs": [{"output_id": output_id, "evidence_span": output_span}]}}\n\ndef test_dependency_proof_rejects_requested_output_phrase_as_dependency_basis() -> None:\n    goals=[_goal("g1",evidence_span="查一下鼠标物流",output_id="shipment.tracking",output_span="鼠标物流"),_goal("g2",evidence_span="快递员手机号",output_id="courier.contact.phone",output_span="快递员手机号",depends_on=["g1"])]\n    _,error=_model_alignment_pairwise_dependency_proof(user_text="查一下鼠标物流，再告诉我快递员手机号",goals=goals,values=[{"goal_a_id":"g1","goal_b_id":"g2","relation":"b_depends_on_a","basis_kind":"result_value_input","basis_span":"快递员手机号"}])\n    assert error == "goal_alignment_dependency_basis_is_requested_output:0"\n\ndef test_dependency_proof_keeps_distinct_literal_result_reference_valid() -> None:\n    goals=[_goal("g1",evidence_span="查一下订单",output_id="order.details",output_span="订单"),_goal("g2",evidence_span="查它的物流",output_id="shipment.tracking",output_span="物流",depends_on=["g1"])]\n    details,error=_model_alignment_pairwise_dependency_proof(user_text="查一下订单，然后查它的物流",goals=goals,values=[{"goal_a_id":"g1","goal_b_id":"g2","relation":"b_depends_on_a","basis_kind":"result_reference","basis_span":"它"}])\n    assert error is None\n    assert details["dependency_proof_complete"] is True\n    assert details["dependency_graph_match"] is True\n''',encoding='utf-8')
          PY
      - name: Run focused regressions
        run: |
          cd services/agent-service
          .venv/bin/python -m pytest -q tests/runtime/test_mixed_sibling_dependency_evidence.py tests/runtime/test_semantic_output_coverage.py tests/runtime/test_unified_semantic_planning_contract.py
      - name: Commit source and test
        run: |
          set -euo pipefail
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add services/agent-service/src/agent_core/lifecycle/goal_planning.py services/agent-service/tests/runtime/test_mixed_sibling_dependency_evidence.py
          git diff --cached --check
          git commit -m 'Reject requested-output text as dependency evidence'
          echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh protected product-source baseline
        run: |
          set -euo pipefail
          rm -rf services/agent-service/.pytest_cache
          "${pythonLocation}/bin/python" -B - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          root=Path('.').resolve(); bp=root/'skill-system/registry/product-source-baseline.json'; data=json.loads(bp.read_text(encoding='utf-8')); ignored={'.venv','.pytest_cache','.ruff_cache','node_modules','__pycache__'}; current={}
          for name in tuple(str(x) for x in data['protected_roots']):
              for path in sorted(p for p in (root/name).rglob('*') if p.is_file()):
                  if any(part in ignored for part in path.parts): continue
                  current[path.relative_to(root).as_posix()]=hashlib.sha256(path.read_bytes()).hexdigest()
          old={str(k):str(v) for k,v in data['files'].items()}; expected={'services/agent-service/src/agent_core/lifecycle/goal_planning.py','services/agent-service/tests/runtime/test_mixed_sibling_dependency_evidence.py'}; changed={p for p in set(current)|set(old) if current.get(p)!=old.get(p)}
          if changed != expected: raise SystemExit('unexpected_product_source_delta:'+','.join(sorted(changed)))
          data['generated_from']='git:'+os.environ['SOURCE_COMMIT']; data['generated_at']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'); data['file_count']=len(current); data['files']=dict(sorted(current.items())); bp.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':'PASS','generated_from':data['generated_from'],'file_count':len(current),'changed':sorted(changed)},ensure_ascii=False))
          PY
      - name: Validate Skill control plane
        run: services/agent-service/.venv/bin/python -B skill-system/controller/profile_runner.py skill-control-plane
      - name: Commit baseline and push repair
        run: |
          set -euo pipefail
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m 'Refresh product-source baseline after dependency-evidence repair'
          git push origin HEAD:repair/v20.18-mixed-sibling-dependency-evidence-20260813
