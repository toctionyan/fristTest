name: p4-8-evidence-producer

on:
  workflow_dispatch:

# This workflow has no caller-controlled inputs. It can only produce evidence
# from a server-owned run of this exact workflow on protected main.
permissions:
  contents: read
  actions: read
  id-token: write
  attestations: write
  artifact-metadata: write

concurrency:
  group: p4-8-evidence-producer-${{ github.run_id }}-${{ github.run_attempt }}
  cancel-in-progress: false

jobs:
  produce:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.ref_protected == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout the exact server-selected commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Prepare producer directories
        run: |
          set -euo pipefail
          mkdir -p producer/payload producer/bundle

      - name: Produce the unsigned evidence payload
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          python3 -B scripts/p4_8_evidence_producer.py \
            --phase payload \
            --workspace . \
            --output producer/payload

      - name: Upload the evidence subject
        id: payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-8-evidence-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: producer/payload
          if-no-files-found: error
          retention-days: 90

      # The attestation subject is the immutable digest returned by the
      # upload action, never a digest generated by the producer script.
      - name: Create the GitHub platform attestation
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-digest: sha256:${{ steps.payload.outputs.artifact-digest }}
          subject-name: p4-8-evidence-payload-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Download the exact uploaded subject
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          PAYLOAD_ARTIFACT_ID: ${{ steps.payload.outputs.artifact-id }}
          PAYLOAD_ARTIFACT_DIGEST_HEX: ${{ steps.payload.outputs.artifact-digest }}
        run: |
          set -euo pipefail
          [[ "${PAYLOAD_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${PAYLOAD_ARTIFACT_DIGEST_HEX}" =~ ^[0-9a-f]{64}$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${PAYLOAD_ARTIFACT_ID}/zip" > producer/payload.zip
          test -s producer/payload.zip
          test "$(sha256sum producer/payload.zip | awk '{print $1}')" = "${PAYLOAD_ARTIFACT_DIGEST_HEX}"

      - name: Build the auditable producer manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          python3 -B scripts/p4_8_evidence_producer.py \
            --phase finalize \
            --workspace producer/payload \
            --output producer/bundle \
            --artifact-id "${{ steps.payload.outputs.artifact-id }}" \
            --upload-artifact-digest "sha256:${{ steps.payload.outputs.artifact-digest }}" \
            --downloaded-artifact producer/payload.zip

      - name: Upload the evidence manifest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: p4-8-evidence-bundle-${{ github.run_id }}-${{ github.run_attempt }}
          path: producer/bundle
          if-no-files-found: error
          retention-days: 90

      - name: Summarize the producer result
        run: |
          set -euo pipefail
          jq -r '"P4.8 producer: `\(.status)`", "Run: `\(.provenance.run.run_id)/\(.provenance.run.run_attempt)`", "Payload artifact: `\(.provenance.artifact.id)` / `\(.provenance.artifact.digest)`", "Platform attestation required: `\(.attestation_verification_request.platform_proof_required)`"' producer/bundle/manifest.json >> "$GITHUB_STEP_SUMMARY"
