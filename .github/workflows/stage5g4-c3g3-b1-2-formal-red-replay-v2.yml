name: stage5g4-c3g3-b1-2-formal-red-replay-v2

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  formal-red-replay-v2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout A4 control plane
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          fetch-depth: 0

      - name: Checkout untouched exact B36 source
        uses: actions/checkout@v4
        with:
          ref: e0e04d51e9da9790bef7bd0482584f60b8e975a9
          path: source
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install test dependencies outside source workspace
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project control/services/agent-service --locked --all-groups --python 3.12
          test -x control/services/agent-service/.venv/bin/python

      - name: Download immutable B1-1 Oracle overlay
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 8994125634
          path: oracle-source
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31179398373

      - name: Prepare quick-mode formal probe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('control/docs/governance/ci-probes/stage5g4-c3g3-b1-2/run_formal_red_replay.py')
          target = Path('b1-runner-quick.py')
          text = source.read_text(encoding='utf-8')
          replacements = [
              ('"required_mode": "static"', '"required_mode": "quick"'),
              ('"- 最低质量模式：static"', '"- 最低质量模式：quick"'),
              ('"modes": ["static"]', '"modes": ["quick"]'),
              ('"--mode",\n            "static",', '"--mode",\n            "quick",'),
              ('gate_python = (control / "services" / "agent-service" / ".venv" / "bin" / "python").resolve()', 'gate_python = control / "services" / "agent-service" / ".venv" / "bin" / "python"'),
              ('"from pathlib import Path; import os, pytest; "', '"from pathlib import Path; import os, sys, pytest; sys.path.insert(0, str(Path.cwd() / \'services/agent-service/src\')); sys.path.insert(0, str(Path.cwd() / \'services/agent-service\')); "'),
          ]
          for old, new in replacements:
              count = text.count(old)
              assert count == 1, (old, count)
              text = text.replace(old, new)
          target.write_text(text, encoding='utf-8')
          compile(text, str(target), 'exec')
          PY

      - name: Execute formal exact-B36 RED replay
        id: replay
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          test -f oracle-source/overlay.zip
          python -B b1-runner-quick.py \
            --control control \
            --source source \
            --overlay oracle-source/overlay.zip \
            --output b1-results

      - name: Verify semantic RED cause
        id: semantic_red
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          STEP_OUT=b1-results/formal-red-evidence/steps/preferred-red-proof.stdout.txt
          STEP_ERR=b1-results/formal-red-evidence/steps/preferred-red-proof.stderr.txt
          test -f "$STEP_OUT"
          grep -q 'prepare_refund_from_eligibility' "$STEP_OUT"
          ! grep -q 'ModuleNotFoundError' "$STEP_OUT"
          ! grep -q 'ModuleNotFoundError' "$STEP_ERR"
          grep -q '1 failed' "$STEP_OUT"

      - name: Preserve Controller diagnostic evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p b1-results/controller-diagnostic
          if [ -d source/.quality/b1/formal-red-evidence ]; then
            cp -a source/.quality/b1/formal-red-evidence b1-results/controller-diagnostic/
          fi
          if [ -d source/.quality/b1/formal-red-state ]; then
            cp -a source/.quality/b1/formal-red-state b1-results/controller-diagnostic/
          fi
          if [ -f b1-results/formal-red.stdout ]; then cp b1-results/formal-red.stdout b1-results/controller-diagnostic/; fi
          if [ -f b1-results/formal-red.stderr ]; then cp b1-results/formal-red.stderr b1-results/controller-diagnostic/; fi
          if [ -f b1-results/formal-red.exit-code.txt ]; then cp b1-results/formal-red.exit-code.txt b1-results/controller-diagnostic/; fi
          sha256sum b1-runner-quick.py > b1-results/controller-diagnostic/quick-runner.sha256
          find b1-results -maxdepth 5 -type f -print | sort > b1-results/controller-diagnostic/file-list.txt

      - name: Upload formal RED replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5g4-c3g3-b1-2-formal-red-replay-v2
          path: b1-results
          if-no-files-found: error
          retention-days: 7

      - name: Enforce replay success
        if: always()
        shell: bash
        run: |
          test '${{ steps.replay.outcome }}' = 'success'
          test '${{ steps.semantic_red.outcome }}' = 'success'
