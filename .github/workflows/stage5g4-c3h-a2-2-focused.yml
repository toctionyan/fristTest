name: stage5g4-c3h-a2-2-focused

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  focused-workspace-root:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout probe candidate
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify exact A2-1 candidate blobs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object skill-system/controller/product_quality_bridge.py)" = "142739db76089e6769ca4ebda64dd67ef1efb46f"
          test "$(git hash-object skill-system/controller/product_contract_gate.py)" = "3f6c6ea0721b0e3ddf1631b9f090b90da3ef0a63"
          test "$(git hash-object skill-system/tests/test_baseline_oracle_bridge_transport.py)" = "65e1f7c6373977387aa2a3a8e62b802dd8e44c2a"
          test "$(git hash-object skill-system/tests/test_product_quality_bridge.py)" = "43ddaefdaddbf13300dcd23f2a8186ca1c7c8f45"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile changed Controller surface
        run: |
          python -m py_compile \
            skill-system/controller/product_quality_bridge.py \
            skill-system/controller/product_contract_gate.py \
            skill-system/tests/test_baseline_oracle_bridge_transport.py \
            skill-system/tests/test_product_quality_bridge.py

      - name: Run focused Bridge workspace-root tests
        run: |
          python -m pytest -q \
            skill-system/tests/test_baseline_oracle_bridge_transport.py \
            skill-system/tests/test_product_quality_bridge.py
