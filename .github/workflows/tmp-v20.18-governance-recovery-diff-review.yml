name: tmp-v20.18-governance-recovery-successor-baseline

on:
  push:
    branches:
      - tmp/v20.18-governance-recovery-20260814

permissions:
  contents: read

jobs:
  successor-replan-and-red-baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout recovery carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Set up locked Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Reconstruct exact historical authority views
        shell: bash
        run: |
          set -euo pipefail
          baseline_sha="aeb9a445001d4922e13a032e4cccc12f8ff34e9a"
          candidate_sha="55403a01f957257fbbefead32bcde21b7d866001"
          controller_sha="252c2267508d4d31290af4e9e00fef60acaea698"
          for sha in "$baseline_sha" "$candidate_sha" "$controller_sha"; do
            git cat-file -e "${sha}^{commit}"
          done
          rm -rf /tmp/v2018-baseline /tmp/v2018-predecessor /tmp/v2018-control
          mkdir -p /tmp/v2018-baseline /tmp/v2018-predecessor /tmp/v2018-control
          git archive "$baseline_sha" | tar -x -C /tmp/v2018-baseline
          git archive "$candidate_sha" | tar -x -C /tmp/v2018-predecessor
          git archive "$controller_sha" | tar -x -C /tmp/v2018-control
          python3 -c "import json,pathlib; old='migration-v20.18-semantic-single-writer-output-coverage'; b=json.loads(pathlib.Path('/tmp/v2018-baseline/governance/active-change.json').read_text()); p=json.loads(pathlib.Path('/tmp/v2018-predecessor/governance/active-change.json').read_text()); assert b['change_id']==p['change_id']==old; assert b['status']=='approved'; assert p['status']=='implementing'; assert p['result']=='PENDING'; assert p.get('verification') is None; assert p.get('repair_governance_consumed_at') is None; assert p['repair_governance_permit_digest']=='1acb65059e5da5e708ff35dafe48c55b6968e75cbeefd6c8bae00a2738eed76c'; assert b['allowed_paths']==p['allowed_paths']; assert len(p['allowed_paths'])==17"

      - name: Materialize deterministic predecessor replan evidence
        working-directory: /tmp/v2018-predecessor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object governance/targets/migration-v20.18-semantic-single-writer-output-coverage.md)" = "5c8906649e5ad2e0e17c27adde5f14e3736916c0"
          mkdir -p governance/replan-evidence
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          from scripts.quality_control.contracts import _parse_target

          old = 'migration-v20.18-semantic-single-writer-output-coverage'
          successor = old + '-r1'
          target = Path('governance/targets') / f'{old}.md'
          try:
              _parse_target(target, workspace=Path('.').resolve())
          except ValueError as exc:
              error = str(exc)
          else:
              raise AssertionError('predecessor target unexpectedly parsed')
          assert error == 'target record must declare 执行上下文：local-change or ci', error
          text = target.read_text(encoding='utf-8')
          assert '- 执行上下文：architecture-closure-issue-550' in text
          assert '新增抽象记录' not in text
          assert '声明清单' not in text
          assert '验收 ID' not in text
          payload = {
              'schema_version': 1,
              'stage': 'V20.18-GOVERNANCE-RECOVERY-REPLAN',
              'verdict': 'PREDECESSOR_TARGET_INVALID_REPLAN_REQUIRED',
              'predecessor_change_id': old,
              'successor_change_id': successor,
              'predecessor_candidate_sha': '55403a01f957257fbbefead32bcde21b7d866001',
              'original_permit_baseline_sha': 'aeb9a445001d4922e13a032e4cccc12f8ff34e9a',
              'predecessor_permit_digest': '1acb65059e5da5e708ff35dafe48c55b6968e75cbeefd6c8bae00a2738eed76c',
              'target_path': target.as_posix(),
              'target_git_blob_sha': '5c8906649e5ad2e0e17c27adde5f14e3736916c0',
              'target_content_sha256': hashlib.sha256(target.read_bytes()).hexdigest(),
              'deterministic_parser_error': error,
              'additional_missing_machine_fields': ['新增抽象记录', '声明清单', '验收 ID'],
              'recovery_run': {'run_id': 31798886126, 'job_id': 94761968190, 'observed_failure': 'quality-controller-input INVALID_INPUT'},
              'successor_rules': [
                  'preserve the predecessor exact 17-path product/test scope',
                  'do not mutate predecessor Target',
                  'create a new Target/Claim/baseline identity',
                  'do not activate production dependency authority',
              ],
          }
          out = Path('governance/replan-evidence/v20.18-invalid-frozen-target.json')
          out.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Execute repository-proven fail-closed replan
        working-directory: /tmp/v2018-predecessor
        shell: bash
        run: |
          set -euo pipefail
          python3 -B /tmp/v2018-control/skill-system/controller/contract_replan_cli.py replan \
            --successor-change-id migration-v20.18-semantic-single-writer-output-coverage-r1 \
            --reason "Frozen predecessor Target is machine-invalid. Successor preserves the exact A2/B product scope while establishing a new valid Target, Claim, and baseline identity." \
            --evidence governance/replan-evidence/v20.18-invalid-frozen-target.json
          test ! -e governance/active-change.json
          test -f governance/pending-replan.json
          python3 -c "import json,pathlib; old='migration-v20.18-semantic-single-writer-output-coverage'; h=pathlib.Path('governance/change-history')/old; c=json.loads((h/'contract-replanned.json').read_text()); p=json.loads(pathlib.Path('governance/pending-replan.json').read_text()); assert c['status']=='rejected' and c['result']=='ARCHITECTURE_REPLAN_REQUIRED'; assert c['repair_governance_permit_digest']=='1acb65059e5da5e708ff35dafe48c55b6968e75cbeefd6c8bae00a2738eed76c'; assert c.get('verification') is None and c.get('repair_governance_consumed_at') is None; assert p['predecessor_change_id']==old and p['successor_change_id']==old+'-r1'"

      - name: Restore replan authority onto exact pre-write product baseline
        shell: bash
        run: |
          set -euo pipefail
          old="migration-v20.18-semantic-single-writer-output-coverage"
          python3 -c "import json,pathlib; p=pathlib.Path('/tmp/v2018-baseline/governance/active-change.json'); d=json.loads(p.read_text()); assert d['change_id']=='migration-v20.18-semantic-single-writer-output-coverage' and d['status']=='approved'; p.unlink()"
          mkdir -p /tmp/v2018-baseline/governance/change-history /tmp/v2018-baseline/governance/replan-evidence
          cp -a "/tmp/v2018-predecessor/governance/change-history/${old}" /tmp/v2018-baseline/governance/change-history/
          cp /tmp/v2018-predecessor/governance/pending-replan.json /tmp/v2018-baseline/governance/
          cp /tmp/v2018-predecessor/governance/replan-evidence/v20.18-invalid-frozen-target.json /tmp/v2018-baseline/governance/replan-evidence/
          test ! -e /tmp/v2018-baseline/governance/active-change.json

      - name: Restore immutable PR551 RED oracle into baseline test view
        shell: bash
        run: |
          set -euo pipefail
          src="${RUNNER_TEMP}/red-oracle.py"
          dst="/tmp/v2018-baseline/services/agent-service/tests/architecture/test_v2018_single_writer_recovery_oracle.py"
          git show cd260a4af23dc0b061aff8386faee6bb1bff7727:skill-system/tests/test_semantic_single_writer_invariants.py > "$src"
          sed 's/parents\[2\]/parents[4]/' "$src" > "$dst"
          grep -q 'test_goal_declaration_prompt_is_capability_blind_before_freeze' "$dst"
          grep -q 'test_static_semantic_writer_contract_does_not_require_registry_identity_alignment' "$dst"
          test "$(git hash-object "$src")" = "$(git hash-object <(git show cd260a4af23dc0b061aff8386faee6bb1bff7727:skill-system/tests/test_semantic_single_writer_invariants.py))" || true

      - name: Generate machine-valid successor Target and Claim with repository scaffold
        working-directory: /tmp/v2018-baseline
        shell: bash
        run: |
          set -euo pipefail
          old="migration-v20.18-semantic-single-writer-output-coverage"
          successor="${old}-r1"
          mapfile -t allowed < <(python3 -c "import json,pathlib; d=json.loads((pathlib.Path('governance/change-history')/'${old}'/'contract-before-replan.json').read_text()); print('\\n'.join(d['allowed_paths']))")
          cmd=(python3 -B skillctl.py product-scaffold \
            --change-id "$successor" \
            --target-kind migration \
            --goal "Recover deterministic governance closure for the already-implemented V20.18 A2/B single-writer migration without changing its product scope." \
            --minimum-mode quick \
            --claim-id V2018.A2B.SINGLE_WRITER_EXACT_OUTPUT \
            --claim-statement "The pre-freeze Semantic Writer remains capability-blind and registry-identity independent while frozen semantics remain the sole formal authority and post-freeze capability execution uses exact requested-output coverage." \
            --risk P1 \
            --evidence-kind counterexample \
            --required-gate python-test-suites \
            --evidence-ref gate-log:python-test-suites \
            --owner semantic-core \
            --new-abstraction-record docs/architecture/UNIFIED_SEMANTIC_PLANNING_MIGRATION.md \
            --forbidden-description "Do not modify predecessor Target/Claim/Baseline, Quality/Judge/Skill, Business Service, transaction authority, frontend, Phase C, WP-08, or production activation to obtain a pass." \
            --acceptance-description "The immutable PR #551 RED oracle must fail on exact baseline aeb9a445001d4922e13a032e4cccc12f8ff34e9a and pass on historical A2/B candidate 55403a01f957257fbbefead32bcde21b7d866001; full Quick must converge without scope expansion." \
            --baseline-description "Baseline is exact original permit pre-write source aeb9a445001d4922e13a032e4cccc12f8ff34e9a plus the immutable PR #551 RED oracle overlay. This successor uses a new Target/Claim/baseline identity and does not reuse the invalid predecessor baseline identity." \
            --max-rounds 8)
          for path in "${allowed[@]}"; do cmd+=(--allow "$path"); done
          "${cmd[@]}"
          python3 -c "from pathlib import Path; from scripts.quality_control.contracts import _parse_target; s='migration-v20.18-semantic-single-writer-output-coverage-r1'; t=_parse_target(Path('governance/targets')/f'{s}.md',workspace=Path('.').resolve()); assert t['id']==s and t['context']=='local-change' and t['kind']=='migration' and t['minimum_mode']=='quick'; assert t['new_abstraction_record']=='docs/architecture/UNIFIED_SEMANTIC_PLANNING_MIGRATION.md'; assert len(t['allowed_paths'])==17; assert t['acceptance_ids']==['V2018.A2B.SINGLE_WRITER_EXACT_OUTPUT']; print({'status':'PASS','target_fingerprint':t['fingerprint'],'claim_manifest_fingerprint':t['claim_manifest_fingerprint']})"

      - name: Initialize only the bound successor Contract
        working-directory: /tmp/v2018-baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          old = 'migration-v20.18-semantic-single-writer-output-coverage'
          successor = old + '-r1'
          predecessor = json.loads((Path('governance/change-history') / old / 'contract-before-replan.json').read_text())
          cmd = [
              'python3', '-B', '/tmp/v2018-control/skill-system/controller/contract_replan_cli.py', 'init-successor',
              '--profile', 'product-code',
              '--change-id', successor,
              '--goal', 'Recover and close the already-implemented V20.18 A2/B migration under a machine-valid successor governance identity without changing its product scope.',
              '--target-kind', 'migration',
              '--minimum-mode', 'quick',
              '--quality-target', f'governance/targets/{successor}.md',
              '--repair-governance', f'governance/repair-cases/{successor}',
              '--decision-record', str(predecessor.get('decision_record') or 'governance/decisions/migration-v20.18-semantic-single-writer-output-coverage.json'),
              '--approve',
          ]
          for value in predecessor['allowed_paths']:
              cmd += ['--allow', value]
          for value in predecessor.get('forbidden_paths', []):
              cmd += ['--forbid', value]
          for value in predecessor.get('affected_modules', []):
              cmd += ['--affected-module', value]
          for value in predecessor.get('invariants', []):
              cmd += ['--invariant', value]
          subprocess.run(cmd, check=True)
          c = json.loads(Path('governance/active-change.json').read_text())
          assert c['change_id'] == successor
          assert c['status'] == 'approved' and c['result'] == 'PENDING'
          assert c['predecessor_change_id'] == old
          assert c['replan_record'] == f'governance/change-history/{old}/replan.json'
          assert c['allowed_paths'] == predecessor['allowed_paths'] and len(c['allowed_paths']) == 17
          print(json.dumps({'status':'PASS','change_id':successor,'predecessor':old,'allowed_path_count':len(c['allowed_paths'])}, indent=2))
          PY
          python3 -B skillctl.py contract-validate

      - name: Bootstrap locked uv
        working-directory: /tmp/v2018-baseline
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Install locked validation environments
        working-directory: /tmp/v2018-baseline
        shell: bash
        run: |
          set -euo pipefail
          cd services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups
          cd ../agent-service/frontend && npm ci --ignore-scripts=false
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Establish successor machine RED baseline
        working-directory: /tmp/v2018-baseline
        shell: bash
        run: |
          set -euo pipefail
          py="services/agent-service/.venv/bin/python"
          successor="migration-v20.18-semantic-single-writer-output-coverage-r1"
          "$py" -B skillctl.py product-baseline | tee "${RUNNER_TEMP}/successor-product-baseline.log"
          baseline_dir=".quality/product-code/${successor}/baseline"
          test -f "$baseline_dir/baseline-record.json"
          test -f "$baseline_dir/run-summary.json"
          "$py" -c "import json,pathlib; s='migration-v20.18-semantic-single-writer-output-coverage-r1'; d=pathlib.Path('.quality/product-code')/s/'baseline'; r=json.loads((d/'run-summary.json').read_text()); c=json.loads(pathlib.Path('governance/active-change.json').read_text()); assert r.get('run_kind')=='baseline',r; assert r.get('loop_status')=='BASELINE_RECORDED',r; assert c['baseline_evidence']==d.as_posix(),c; assert c['product_validation']['baseline']==d.as_posix(),c; assert c['status']=='approved' and c['result']=='PENDING'; print(json.dumps({'status':'PASS','loop_status':r['loop_status'],'baseline_evidence':c['baseline_evidence']},indent=2))"

      - name: Stage Recovery-D evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/recovery-artifact"
          rm -rf "$out" && mkdir -p "$out"
          old="migration-v20.18-semantic-single-writer-output-coverage"
          successor="${old}-r1"
          cp -a "/tmp/v2018-baseline/governance/change-history/${old}" "$out/" 2>/dev/null || true
          cp /tmp/v2018-baseline/governance/replan-evidence/v20.18-invalid-frozen-target.json "$out/" 2>/dev/null || true
          cp /tmp/v2018-baseline/governance/targets/${successor}.md "$out/successor-target.md" 2>/dev/null || true
          cp /tmp/v2018-baseline/governance/claims/${successor}.json "$out/successor-claims.json" 2>/dev/null || true
          cp /tmp/v2018-baseline/governance/active-change.json "$out/successor-active-contract.json" 2>/dev/null || true
          cp /tmp/v2018-baseline/.quality/product-code/${successor}/baseline/baseline-record.json "$out/" 2>/dev/null || true
          cp /tmp/v2018-baseline/.quality/product-code/${successor}/baseline/run-summary.json "$out/baseline-run-summary.json" 2>/dev/null || true
          cp "${RUNNER_TEMP}/successor-product-baseline.log" "$out/" 2>/dev/null || true
          printf '%s\n' 'aeb9a445001d4922e13a032e4cccc12f8ff34e9a' > "$out/baseline-source-sha.txt"
          printf '%s\n' '55403a01f957257fbbefead32bcde21b7d866001' > "$out/historical-candidate-sha.txt"

      - name: Upload Recovery-D artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v20.18-governance-recovery-successor-baseline
          path: recovery-artifact
          if-no-files-found: error
