name: temporary-v20.18-historical-followup-diagnostic

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-v20.18-historical-followup-diagnostic.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production-certification
    env:
      OPENAI_API_KEY: ${{ secrets.PRODUCTION_MODEL_API_KEY }}
      CONFIG_MODEL_PROVIDER: ${{ vars.REAL_MODEL_CERTIFICATION_PROVIDER || vars.PRODUCTION_MODEL_PROVIDER || vars.MODEL_PROVIDER }}
      CONFIG_MODEL_ID: ${{ vars.OPENAI_MODEL || vars.PRODUCTION_MODEL_ID || vars.MODEL_ID }}
      CONFIG_MODEL_API_BASE: ${{ vars.OPENAI_API_BASE || vars.PRODUCTION_MODEL_API_BASE || vars.MODEL_API_BASE }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent and Business environments
        run: |
          cd services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups
      - name: Resolve protected official model identity
        run: |
          "${pythonLocation}/bin/python" -B - <<'PY'
          import json, os
          from pathlib import Path
          profile=json.loads(Path('deployment/ci/wp08-production-profile.json').read_text(encoding='utf-8'))
          if profile.get('contract') != 'wp08-production-profile@1': raise SystemExit('invalid versioned production profile')
          provider=str(os.environ.get('CONFIG_MODEL_PROVIDER') or profile.get('model_provider') or '').strip().casefold()
          model=str(os.environ.get('CONFIG_MODEL_ID') or profile.get('model_id') or '').strip()
          base=str(os.environ.get('CONFIG_MODEL_API_BASE') or profile.get('model_api_base') or '').strip().rstrip('/')
          if provider == 'openai' and base != 'https://api.openai.com/v1': raise SystemExit('OpenAI validation must use official endpoint')
          if provider == 'deepseek' and base not in {'https://api.deepseek.com','https://api.deepseek.com/v1'}: raise SystemExit('DeepSeek validation must use official endpoint')
          if provider not in {'openai','deepseek'} or not model or not os.environ.get('OPENAI_API_KEY'): raise SystemExit('protected model identity/credential unavailable')
          with Path(os.environ['GITHUB_ENV']).open('a',encoding='utf-8') as h:
              h.write(f'REAL_MODEL_CERTIFICATION_PROVIDER={provider}\nOPENAI_MODEL={model}\nOPENAI_API_BASE={base}\n')
          print(json.dumps({'provider':provider,'model':model,'endpoint':base,'credential_present':True}))
          PY
      - name: Diagnose protected historical follow-up boundary
        run: |
          services/agent-service/.venv/bin/python -B - <<'PY'
          from __future__ import annotations
          import json, os, sqlite3, sys
          from pathlib import Path
          from uuid import uuid4

          root=Path('.').resolve()
          for path in (root/'services/agent-service/src', root/'services/agent-service/scripts', root/'scripts'):
              sys.path.insert(0,str(path))

          from agent_core.model_calls import resolve_real_model_identity
          from verify_full_lifecycle_canary import ProductRuntimeHarness
          from verify_preprod_full_lifecycle import _call, _token

          OUT=Path('/tmp/v20.18-historical-followup-diagnostic.json')

          def latest_state(database: Path) -> dict:
              with sqlite3.connect(database) as connection:
                  row=connection.execute("SELECT output_json FROM trace_logs WHERE event_type='graph_snapshot' ORDER BY id DESC LIMIT 1").fetchone()
              if not row:
                  raise RuntimeError('missing graph snapshot')
              payload=json.loads(row[0] or '{}')
              state=payload.get('state') if isinstance(payload.get('state'),dict) else payload
              if not isinstance(state,dict):
                  raise RuntimeError('graph snapshot state is invalid')
              return state

          def trace_summary(state: dict) -> list[dict]:
              rows=[]
              for row in list(state.get('tool_trace') or []):
                  if not isinstance(row,dict):
                      continue
                  result=row.get('result') if isinstance(row.get('result'),dict) else {}
                  rows.append({
                      'name': row.get('name'),
                      'classification': row.get('classification'),
                      'effect_id': row.get('effect_id'),
                      'args': row.get('args') if isinstance(row.get('args'),dict) else {},
                      'compiled_runtime_target': row.get('compiled_runtime_target') if isinstance(row.get('compiled_runtime_target'),dict) else None,
                      'result': {
                          'ok': result.get('ok'),
                          'code': result.get('code'),
                          'message': result.get('message'),
                          'data': result.get('data') if isinstance(result.get('data'),dict) else None,
                      },
                  })
              return rows

          def state_diag(state: dict) -> dict:
              bundle=state.get('context_bundle') if isinstance(state.get('context_bundle'),dict) else {}
              debug=[]
              for row in list(state.get('debug_llm_calls') or [])[-8:]:
                  if not isinstance(row,dict):
                      continue
                  debug.append({key: row.get(key) for key in (
                      'node','loop_step','tool_call_count','tool_names','workflow_level','workflow_status',
                      'pretool_shadow_status','pretool_execution_policy_mode','pretool_allowed_capability_tools',
                      'pretool_shadow_comparison'
                  )})
              return {
                  'turn_index': state.get('turn_index'),
                  'phase': state.get('phase'),
                  'status': state.get('status'),
                  'goal_declaration_retry': state.get('goal_declaration_retry'),
                  'agent_loop_step': state.get('agent_loop_step'),
                  'current_turn_plan': state.get('current_turn_plan'),
                  'semantic_proposal': state.get('semantic_proposal'),
                  'frozen_semantic_contract': state.get('frozen_semantic_contract'),
                  'capability_surface': state.get('capability_surface'),
                  'pretool_shadow_plan': state.get('pretool_shadow_plan'),
                  'pretool_execution_policy': state.get('pretool_execution_policy'),
                  'grounded_execution_plan': state.get('grounded_execution_plan'),
                  'goal_blockers': state.get('goal_blockers'),
                  'goal_records': state.get('goal_records'),
                  'focus_state': state.get('focus_state'),
                  'visible_result_refs': bundle.get('visible_result_refs'),
                  'decision_chain_tail': list(state.get('decision_chain') or [])[-20:],
                  'debug_llm_calls': debug,
                  'tool_trace': trace_summary(state),
              }

          harness=ProductRuntimeHarness(deterministic_model=False)
          harness.env.update({
              'CAPABILITY_SEMANTIC_VERIFIER_MODE':'model',
              'GOAL_ALIGNMENT_VERIFIER_MODE':'model',
              'GOAL_GRANULARITY_VERIFIER_MODE':'model',
              'ANSWER_RELEASE_ALIGNMENT_VERIFIER_MODE':'model',
          })
          identity=resolve_real_model_identity(harness.env)
          evidence={
              'contract':'v20.18-historical-followup-diagnostic@1',
              'source_sha':os.environ.get('GITHUB_SHA'),
              'identity':{key:identity.get(key) for key in ('provider','endpoint','model','credential_fingerprint_sha256_16')},
          }
          try:
              with harness:
                  base=harness.agent_url
                  token=_token(base,harness.env)
                  database=harness.runtime_dir/'agent.db'
                  thread=f'v2018-historical-diagnostic-{uuid4().hex}'
                  seed=_call(base,'/api/chat/turn',method='POST',token=token,body={'thread_id':thread,'message':'查一下机械键盘订单'})
                  state1=latest_state(database)
                  follow=_call(base,'/api/chat/turn',method='POST',token=token,body={'thread_id':thread,'message':'查一下它的物流'})
                  state2=latest_state(database)
                  evidence['seed_response_type']=seed.get('type') if isinstance(seed,dict) else type(seed).__name__
                  evidence['follow_response_type']=follow.get('type') if isinstance(follow,dict) else type(follow).__name__
                  evidence['seed']=state_diag(state1)
                  evidence['followup']=state_diag(state2)
                  names=[row.get('name') for row in evidence['followup']['tool_trace']]
                  evidence['observed_followup_tools']=names
                  evidence['historical_logistics_reached']='get_order_logistics' in names
                  OUT.write_text(json.dumps(evidence,ensure_ascii=False,indent=2,default=str)+'\n',encoding='utf-8')
                  print(json.dumps(evidence,ensure_ascii=False,default=str))
                  if 'get_order_logistics' not in names:
                      raise RuntimeError(f'historical follow-up still stops before logistics; trace={names}')
          except Exception:
              if not OUT.exists():
                  OUT.write_text(json.dumps(evidence,ensure_ascii=False,indent=2,default=str)+'\n',encoding='utf-8')
                  print(json.dumps(evidence,ensure_ascii=False,default=str))
              raise
          PY
      - name: Upload historical follow-up diagnostic
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v20.18-historical-followup-diagnostic-${{ github.run_id }}
          path: /tmp/v20.18-historical-followup-diagnostic.json
          retention-days: 30
          if-no-files-found: error
