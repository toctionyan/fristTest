name: stage5g4-c3h-a4-a2-formal-product-baseline

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  formal-product-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout admission runner
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner
          fetch-depth: 0

      - name: Checkout exact A3 candidate control plane
        uses: actions/checkout@v4
        with:
          ref: 435fade35f49f1339fe6d3e248982d54a69ee6af
          path: control
          fetch-depth: 0

      - name: Checkout untouched exact B36 product source
        uses: actions/checkout@v4
        with:
          ref: e0e04d51e9da9790bef7bd0482584f60b8e975a9
          path: source
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Install focused control environment
        shell: bash
        run: |
          set -euo pipefail
          uv sync --project control/services/agent-service --locked --all-groups --python 3.12
          test -x control/services/agent-service/.venv/bin/python

      - name: Download immutable B1 Oracle overlay
        uses: actions/download-artifact@v4
        with:
          artifact-ids: 8994125634
          path: oracle-download
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 31179398373

      - name: Materialize frozen formal admission inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "e0e04d51e9da9790bef7bd0482584f60b8e975a9"
          test "$(git -C control rev-parse HEAD)" = "435fade35f49f1339fe6d3e248982d54a69ee6af"
          test "$(sha256sum oracle-download/overlay.zip | awk '{print $1}')" = "ac86e73820716bdf2a995ffe9fc2813b42cbbda741932a14e10597fe11d72da6"
          fixture=runner/.github/formal-baseline/stage5g4-c3h-a4
          test "$(sha256sum "$fixture/target.md" | awk '{print $1}')" = "54f06043784f24a765e53d14ad6ea4f27d17e94bf35746c5d948b7195699970a"
          test "$(sha256sum "$fixture/claim.json" | awk '{print $1}')" = "a1d1b2bf7e0478dfadd146a6e02dda870f0a74c8b666147aeb3b4f7d58d68027"
          test "$(sha256sum "$fixture/focused-policy.json" | awk '{print $1}')" = "ca5ce92e4f93d4c411da7d07abfdf5e49f8955aa3af117acfa2f9acdeb695914"
          test "$(sha256sum "$fixture/oracle-manifest.json" | awk '{print $1}')" = "3eba94de3750b79d8bdec94b6d7342491082b5558eee650be6abf942afb9b4fa"
          mkdir -p source/.quality/stage5g4-c3h-a4/formal-baseline/oracle formal-artifact
          cp "$fixture/target.md" source/.quality/stage5g4-c3h-a4/formal-baseline/target.md
          cp "$fixture/claim.json" source/.quality/stage5g4-c3h-a4/formal-baseline/claim.json
          cp "$fixture/focused-policy.json" source/.quality/stage5g4-c3h-a4/formal-baseline/focused-policy.json
          cp "$fixture/oracle-manifest.json" source/.quality/stage5g4-c3h-a4/formal-baseline/oracle/manifest.json
          cp oracle-download/overlay.zip source/.quality/stage5g4-c3h-a4/formal-baseline/oracle/overlay.zip
          python - <<'PY'
          from pathlib import Path
          import json, subprocess, sys
          control=Path('control').resolve()
          source=Path('source').resolve()
          target=source/'.quality/stage5g4-c3h-a4/formal-baseline/target.md'
          sys.path.insert(0,str(control/'skill-system/controller'))
          sys.path.insert(0,str(control/'scripts'))
          from product_scope import parse_target_allowed_paths
          from quality_control.contracts import workspace_snapshot
          allowed=list(parse_target_allowed_paths(target))
          assert len(allowed)==30 and len(set(allowed))==30
          cmd=[
              sys.executable,
              str(control/'skill-system/controller/change_contract_cli.py'),
              'init',
              '--profile','product-code',
              '--change-id','migration-v20.17-b38-context-reference-goal-coverage',
              '--goal','Admit exact-B36 formal RED baseline for frozen B38 context/reference/goal-coverage migration',
              '--target-kind','migration',
          ]
          for path in allowed:
              cmd += ['--allow',path]
          cmd += [
              '--minimum-mode','quick',
              '--quality-target','.quality/stage5g4-c3h-a4/formal-baseline/target.md',
              '--approve','--force',
          ]
          subprocess.run(cmd,cwd=source,check=True)
          fp='f9ab6acafe592e49534ed6d2fd2b3e9b0f45debc7bb26fbd9a86d06515e1a2fa'
          assert workspace_snapshot(source)['fingerprint']==fp
          contract=json.loads((source/'governance/active-change.json').read_text())
          assert contract['change_id']=='migration-v20.17-b38-context-reference-goal-coverage'
          assert contract['target_kind']=='migration'
          assert contract['profile']=='product-migration'
          assert contract['minimum_quality_mode']=='quick'
          assert contract['status']=='approved'
          assert contract.get('baseline_evidence') in (None,'')
          assert contract['allowed_paths']==allowed
          assert subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'],text=True).strip()=='e0e04d51e9da9790bef7bd0482584f60b8e975a9'
          (source/'.quality/stage5g4-c3h-a4/formal-baseline/source-fingerprint-before.txt').write_text(fp+'\n')
          PY

      - name: Run formal product baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          python -B control/skill-system/controller/product_quality_bridge.py baseline \
            --workspace-root source \
            --baseline-policy .quality/stage5g4-c3h-a4/formal-baseline/focused-policy.json \
            --baseline-oracle-manifest .quality/stage5g4-c3h-a4/formal-baseline/oracle/manifest.json \
            --baseline-oracle-artifact .quality/stage5g4-c3h-a4/formal-baseline/oracle/overlay.zip \
            > bridge.stdout.json 2> bridge.stderr.txt

      - name: Verify formal product baseline admission
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json, subprocess, sys
          control=Path('control').resolve()
          source=Path('source').resolve()
          out=Path('formal-artifact')
          sys.path.insert(0,str(control/'scripts'))
          from quality_control.contracts import workspace_snapshot
          change='migration-v20.17-b38-context-reference-goal-coverage'
          selector='services/agent-service/tests/runtime/test_stage4_goal_output_refs.py::test_dependency_goal_output_is_not_reused_across_different_explicit_targets'
          expected_fp='f9ab6acafe592e49534ed6d2fd2b3e9b0f45debc7bb26fbd9a86d06515e1a2fa'
          expected_policy='ca5ce92e4f93d4c411da7d07abfdf5e49f8955aa3af117acfa2f9acdeb695914'
          expected_oracle='a8315eaa1348eba744379c84e68d6a13fbc0f40578dbbcf8e93ca377541a4f54'
          evidence=source/'.quality/product-code'/change/'baseline'
          bridge_path=source/'.quality/product-code'/change/'bridge-results/baseline.json'
          bridge=json.loads(Path('bridge.stdout.json').read_text())
          summary=json.loads((evidence/'run-summary.json').read_text())
          record=json.loads((evidence/'baseline-record.json').read_text())
          oracle=json.loads((evidence/'baseline-oracle-overlay-identity.json').read_text())
          contract=json.loads((source/'governance/active-change.json').read_text())
          assert bridge['status']=='PASS'
          assert bridge['expected_red_baseline'] is True
          assert summary['decision']=='FAIL'
          assert summary['loop_status']=='BASELINE_RECORDED'
          assert summary['policy_fingerprint']==expected_policy
          assert summary['selected_gate_ids']==['preferred-red-proof']
          assert summary['required_gate_ids']==['preferred-red-proof']
          assert len(summary['results'])==1
          row=summary['results'][0]
          assert row['id']=='preferred-red-proof' and row['status']=='FAIL'
          combined=(row.get('stdout') or '')+'\n'+(row.get('stderr') or '')
          for token in ['AssertionError','prepare_refund_from_eligibility',selector.split('::',1)[1],'1 failed']:
              assert token in combined
          for token in ['ModuleNotFoundError','ERR_MODULE_NOT_FOUND','exit 78','exit_code": 78']:
              assert token not in combined
          claim=summary['claim_results'][0]
          assert claim['id']=='B1.PREFERRED.RED'
          assert claim['status']=='FAILED'
          assert claim['evidence_ref_statuses'][selector]=='FAILED'
          assert claim['gate_statuses']=={'preferred-red-proof':'FAIL'}
          assert oracle['canonical_fingerprint']==expected_oracle
          assert oracle['overlay_artifact_sha256']=='ac86e73820716bdf2a995ffe9fc2813b42cbbda741932a14e10597fe11d72da6'
          assert oracle['base_source_identity']['commit_sha']=='e0e04d51e9da9790bef7bd0482584f60b8e975a9'
          assert oracle['base_workspace_fingerprint']==expected_fp
          assert record['workspace_snapshot_fingerprint']==expected_fp
          assert summary['workspace_snapshot_start_fingerprint']==expected_fp
          assert summary['workspace_snapshot_fingerprint']==expected_fp
          assert workspace_snapshot(source)['fingerprint']==expected_fp
          assert subprocess.check_output(['git','-C',str(source),'rev-parse','HEAD'],text=True).strip()=='e0e04d51e9da9790bef7bd0482584f60b8e975a9'
          assert contract['change_id']==change
          assert contract['status']=='approved'
          expected_evidence=f'.quality/product-code/{change}/baseline'
          assert contract['baseline_evidence']==expected_evidence
          assert contract['product_validation']['baseline']==expected_evidence
          assert contract['product_validation']['baseline_mode']=='quick'
          assert bridge_path.is_file()
          report={
            'schema_version':1,
            'stage':'5G4-C3H-A4-A2',
            'verdict':'FORMAL_PRODUCT_BASELINE_ADMISSION_PASS',
            'formal_product_baseline_admitted':True,
            'change_id':change,
            'control_head':'435fade35f49f1339fe6d3e248982d54a69ee6af',
            'source_head':'e0e04d51e9da9790bef7bd0482584f60b8e975a9',
            'source_fingerprint':expected_fp,
            'policy_fingerprint':expected_policy,
            'oracle_canonical_fingerprint':expected_oracle,
            'selected_gate_ids':['preferred-red-proof'],
            'only_failure':selector,
            'claim_status':'FAILED',
            'unrelated_noise_observed':False,
            'baseline_evidence':expected_evidence,
            'contract_begin_run':False,
            'canonical_b38_pushed':False,
            'production_closed':False,
          }
          (out/'FORMAL_PRODUCT_BASELINE_ADMISSION_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          (out/'source-head.txt').write_text('e0e04d51e9da9790bef7bd0482584f60b8e975a9\n')
          (out/'source-fingerprint-before.txt').write_text(expected_fp+'\n')
          (out/'source-fingerprint-after.txt').write_text(workspace_snapshot(source)['fingerprint']+'\n')
          (out/'source-git-status.txt').write_text(subprocess.check_output(['git','-C',str(source),'status','--porcelain'],text=True))
          PY

      - name: Preserve formal lifecycle artifact
        if: always()
        shell: bash
        run: |
          set -u
          mkdir -p formal-artifact/root/governance formal-artifact/root/.quality/stage5g4-c3h-a4 formal-artifact/root/.quality/product-code
          if [ -f source/governance/active-change.json ]; then cp source/governance/active-change.json formal-artifact/root/governance/active-change.json; fi
          if [ -d source/.quality/stage5g4-c3h-a4/formal-baseline ]; then cp -a source/.quality/stage5g4-c3h-a4/formal-baseline formal-artifact/root/.quality/stage5g4-c3h-a4/; fi
          if [ -d source/.quality/product-code/migration-v20.17-b38-context-reference-goal-coverage ]; then cp -a source/.quality/product-code/migration-v20.17-b38-context-reference-goal-coverage formal-artifact/root/.quality/product-code/; fi
          cat > formal-artifact/RESTORE_MANIFEST.json <<'JSON'
          {
            "schema_version": 1,
            "stage": "5G4-C3H-A4-A2",
            "restore_root": "root",
            "required_product_head": "e0e04d51e9da9790bef7bd0482584f60b8e975a9",
            "restore_instruction": "Copy root/. over a fresh exact-B36 checkout, then verify source/evidence bindings before contract-begin.",
            "contract_begin_run": false,
            "canonical_b38_pushed": false,
            "production_closed": false
          }
          JSON
          cp bridge.stdout.json formal-artifact/bridge.stdout.json 2>/dev/null || true
          cp bridge.stderr.txt formal-artifact/bridge.stderr.txt 2>/dev/null || true
          git -C source rev-parse HEAD > formal-artifact/source-head-best-effort.txt 2>/dev/null || true
          git -C source status --porcelain > formal-artifact/source-git-status-best-effort.txt 2>/dev/null || true

      - name: Upload formal product baseline artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5g4-c3h-a4-formal-product-baseline
          path: formal-artifact
          if-no-files-found: error
          retention-days: 14
          include-hidden-files: true
