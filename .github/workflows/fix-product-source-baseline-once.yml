name: One-shot product source baseline sync

on:
  push:
    branches:
      - quality-loop-resumable-checkpoint-20260810

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  sync:
    if: github.event.head_commit.message != 'Sync protected source baseline after Anti-Stall test relocation'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Regenerate protected source baseline
        run: |
          python -B - <<'PY'
          import datetime
          import hashlib
          import json
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          roots = [str(value) for value in payload.get('protected_roots') or ()]
          if not roots:
              raise SystemExit('protected_roots is empty')
          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', *roots], cwd=root)
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          files = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          payload['generated_from'] = 'git:' + subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], cwd=root, text=True
          ).strip()
          payload['generated_at'] = datetime.datetime.now(datetime.timezone.utc).isoformat()
          payload['file_count'] = len(files)
          payload['files'] = files
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print({'file_count': len(files)})
          PY
      - name: Validate full Skill tests
        run: python -B -m unittest discover -s skill-system/tests -p 'test_*.py'
      - name: Commit synced baseline and remove carrier
        run: |
          rm .github/workflows/fix-product-source-baseline-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json .github/workflows/fix-product-source-baseline-once.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Sync protected source baseline after Anti-Stall test relocation'
          git push origin HEAD:quality-loop-resumable-checkpoint-20260810
