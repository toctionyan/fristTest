name: temporary-pr1065-baseline-refresh

on:
  push:
    branches:
      - fix/semantic-scope-redeclare-20260815
    paths:
      - .github/pr1065-baseline-refresh.trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/semantic-scope-redeclare-20260815
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Refresh tracked protected baseline
        run: >-
          python -B scripts/refresh_product_source_baseline.py
          --generated-from-sha "$(git rev-parse HEAD)"
      - name: Verify refreshed binding
        run: |
          PYTHONPATH=services/agent-service/src python -B -m unittest skill-system.tests.test_product_source_baseline_binding
          git diff --check
      - name: Commit governed baseline refresh
        run: |
          if git diff --quiet; then
            echo 'Baseline already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json
          git commit -m 'chore(governance): refresh protected source baseline'
          git push origin HEAD:fix/semantic-scope-redeclare-20260815
