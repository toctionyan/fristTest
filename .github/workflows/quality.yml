name: quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: write

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  repair-strong-context-scope:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: repair-strong-context-scope-20260810
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Apply condition scope closure
        run: |
          python -B - <<'PY'
          from pathlib import Path

          gate_path = Path('services/agent-service/src/agent_core/runtime/capability_gate.py')
          gate = gate_path.read_text(encoding='utf-8')
          helper_anchor = '\n\ndef _visible_reference_proof(state: dict[str, Any], args: dict[str, Any]) -> dict[str, Any]:\n'
          if helper_anchor not in gate:
              raise SystemExit('capability helper anchor missing')
          if 'def _goal_condition_parameterization_proof(' in gate:
              raise SystemExit('goal condition proof already exists')
          helper = r'''


def _goal_condition_parameterization_proof(
    state: dict[str, Any],
    *,
    effect_id: str,
    parameterization: dict[str, Any],
) -> dict[str, Any]:
    """Prove frozen result-scope conditions are represented by covered Tool parameters.

    Runtime stays domain-neutral: it compares only formal condition operand paths
    and literal values against already-validated constraint bindings. It never
    maps natural-language business vocabulary to Tool fields. ``goal_output``
    conditions remain workflow dependencies and are intentionally out of scope.
    """
    effect = next((
        row for row in list((state.get("current_turn_plan") or {}).get("effects") or [])
        if isinstance(row, dict) and str(row.get("effect_id") or "") == str(effect_id or "")
    ), {})
    goal_ids = [str(value) for value in list(effect.get("goal_ids") or []) if str(value)]
    wanted = set(goal_ids)
    goals = {
        str(row.get("goal_id") or ""): row
        for row in semantic_goals(state)
        if str(row.get("goal_id") or "") in wanted
    }
    requirements: list[dict[str, Any]] = []
    structural_errors: list[str] = []

    def has_parameter_operand(value: Any) -> bool:
        if isinstance(value, dict):
            if str(value.get("source") or "") in {"target_fact", "input"}:
                return True
            return any(has_parameter_operand(item) for item in value.values())
        if isinstance(value, list):
            return any(has_parameter_operand(item) for item in value)
        return False

    def walk(goal_id: str, node: Any, trail: str) -> None:
        if not isinstance(node, dict):
            return
        op = str(node.get("op") or "")
        if op in {"and", "or"}:
            for index, child in enumerate(list(node.get("args") or [])):
                walk(goal_id, child, f"{trail}.{op}[{index}]")
            return
        if op == "eq":
            left = node.get("left") if isinstance(node.get("left"), dict) else {}
            right = node.get("right") if isinstance(node.get("right"), dict) else {}
            for formal, literal in ((left, right), (right, left)):
                source = str(formal.get("source") or "")
                path = str(formal.get("path") or "").strip()
                if source not in {"target_fact", "input"} or str(literal.get("source") or "") != "literal":
                    continue
                value = literal.get("value")
                if not path or value is None:
                    structural_errors.append(f"condition_parameterization_invalid:{goal_id}:{trail}")
                    return
                requirements.append({
                    "goal_id": goal_id,
                    "condition_path": path,
                    "condition_path_leaf": path.rsplit(".", 1)[-1],
                    "normalized_value": value,
                    "operator": "eq",
                })
                return
        if has_parameter_operand(node):
            structural_errors.append(f"condition_parameterization_unrepresented:{goal_id}:{trail or op or 'condition'}")

    for goal_id in goal_ids:
        condition = (goals.get(goal_id) or {}).get("condition")
        if isinstance(condition, dict):
            walk(goal_id, condition, "condition")

    bindings = [
        dict(row)
        for row in list(parameterization.get("bindings") or [])
        if isinstance(row, dict) and str(row.get("status") or "") == "covered"
    ]
    checks: list[dict[str, Any]] = []
    errors = list(structural_errors)
    for requirement in requirements:
        matches = [
            row for row in bindings
            if str(row.get("parameter_path") or "").rsplit(".", 1)[-1]
            == str(requirement.get("condition_path_leaf") or "")
            and row.get("normalized_value") == requirement.get("normalized_value")
        ]
        matched = len(matches) == 1
        checks.append({
            **requirement,
            "matched": matched,
            "matched_parameter_paths": [str(row.get("parameter_path") or "") for row in matches],
            "matched_source_spans": [str(row.get("source_span") or "") for row in matches],
        })
        if not matched:
            errors.append(
                f"goal_condition_parameterization_required:{requirement['goal_id']}:"
                f"{requirement['condition_path']}"
            )

    return {
        "version": "goal-condition-parameterization-proof@1",
        "goal_ids": goal_ids,
        "required": bool(requirements or structural_errors),
        "requirements": requirements,
        "checks": checks,
        "complete": not errors,
        "errors": errors,
    }
'''
          gate = gate.replace(helper_anchor, helper + helper_anchor, 1)
          start = gate.index('def issue_execution_permit(')
          end = gate.index('\n\ndef permit_allows_dispatch(', start)
          section = gate[start:end]
          old = '''    parameterization = _parameterization_proof(state, normalized_args) if contract is not None and not arg_errors else {
        "version": "constraint-coverage-proof@1", "bindings": [], "parameterization_complete": False,
        "errors": ["tool_schema_invalid"] if arg_errors else ["tool_not_registered"],
    }
'''
          new = old + '''    goal_condition_parameterization = _goal_condition_parameterization_proof(
        state,
        effect_id=effect_id,
        parameterization=parameterization,
    )
    parameterization_complete = bool(
        parameterization.get("parameterization_complete")
        and goal_condition_parameterization.get("complete")
    )
'''
          if section.count(old) != 1:
              raise SystemExit(f'parameterization anchor count={section.count(old)}')
          section = section.replace(old, new, 1)
          section = section.replace('and parameterization.get("parameterization_complete")\n        and visible_reference.get("complete")', 'and parameterization_complete\n        and visible_reference.get("complete")', 1)
          section = section.replace('"match_proof_version": "match-proof@4.1",', '"match_proof_version": "match-proof@4.2",', 1)
          old_proof = '''        "parameterization": parameterization,
        "parameterization_complete": bool(parameterization.get("parameterization_complete")),
        "visible_result_reference": visible_reference,
'''
          new_proof = '''        "parameterization": parameterization,
        "goal_condition_parameterization": goal_condition_parameterization,
        "parameterization_complete": parameterization_complete,
        "visible_result_reference": visible_reference,
'''
          if section.count(old_proof) != 1:
              raise SystemExit(f'proof anchor count={section.count(old_proof)}')
          section = section.replace(old_proof, new_proof, 1)
          old_errors = '*list(parameterization.get("errors") or []), *list(visible_reference.get("errors") or [])'
          new_errors = '*list(parameterization.get("errors") or []), *list(goal_condition_parameterization.get("errors") or []), *list(visible_reference.get("errors") or [])'
          if section.count(old_errors) != 1:
              raise SystemExit(f'constraint errors anchor count={section.count(old_errors)}')
          section = section.replace(old_errors, new_errors, 1)
          section = section.replace('and parameterization.get("parameterization_complete") and visible_reference.get("complete")', 'and parameterization_complete and visible_reference.get("complete")', 1)
          section = section.replace('or not parameterization.get("parameterization_complete") or not visible_reference.get("complete")', 'or not parameterization_complete or not visible_reference.get("complete")', 1)
          section = section.replace('and not parameterization.get("parameterization_complete")\n                    else "CAPABILITY_SEMANTIC_CLARIFICATION_REQUIRED"', 'and not parameterization_complete\n                    else "CAPABILITY_SEMANTIC_CLARIFICATION_REQUIRED"', 1)
          section = section.replace('and not parameterization.get("parameterization_complete")\n                    else "当前请求需要先澄清', 'and not parameterization_complete\n                    else "当前请求需要先澄清', 1)
          gate = gate[:start] + section + gate[end:]
          gate_path.write_text(gate, encoding='utf-8')

          semantic_path = Path('services/agent-service/src/agent_core/runtime/semantic_capability_verifier.py')
          semantic = semantic_path.read_text(encoding='utf-8')
          old_goal = '            "depends_on": [str(value) for value in list(row.get("depends_on") or []) if str(value)],\n'
          new_goal = old_goal + '            "condition": deepcopy(row.get("condition")) if isinstance(row.get("condition"), dict) else None,\n'
          if semantic.count(old_goal) != 1:
              raise SystemExit(f'semantic projection anchor count={semantic.count(old_goal)}')
          semantic_path.write_text(semantic.replace(old_goal, new_goal, 1), encoding='utf-8')

          release_path = Path('services/agent-service/src/agent_core/runtime/answer_release_alignment.py')
          release = release_path.read_text(encoding='utf-8')
          verdict_anchor = '\n\ndef _deterministic_verdict(*, result: dict[str, Any], blocks: list[dict[str, Any]]) -> AnswerAlignmentVerdict:\n'
          if verdict_anchor not in release:
              raise SystemExit('release verdict anchor missing')
          release_helper = r'''


def _match_proof_condition_parameterization_complete(proof: dict[str, Any]) -> bool:
    if str(proof.get("match_proof_version") or "") != "match-proof@4.2":
        return True
    condition_proof = proof.get("goal_condition_parameterization")
    return bool(isinstance(condition_proof, dict) and condition_proof.get("complete"))
'''
          release = release.replace(verdict_anchor, release_helper + verdict_anchor, 1)
          old_loop = '''    proofs = _effective_match_proofs(result)
    for proof in proofs:
        semantic = proof.get("semantic_verdict") if isinstance(proof.get("semantic_verdict"), dict) else {}
'''
          new_loop = '''    proofs = _effective_match_proofs(result)
    for proof in proofs:
        if proof.get("candidate_tool") and not _match_proof_condition_parameterization_complete(proof):
            return AnswerAlignmentVerdict(
                "reject",
                "goal_condition_parameterization_unproven",
                "deterministic",
                True,
                {"match_proof": proof},
            )
        semantic = proof.get("semantic_verdict") if isinstance(proof.get("semantic_verdict"), dict) else {}
'''
          if release.count(old_loop) != 1:
              raise SystemExit(f'release proof-loop anchor count={release.count(old_loop)}')
          release = release.replace(old_loop, new_loop, 1)
          old_exact = '''            and proof.get("parameterization_complete")
            and (proof.get("visible_result_reference") or {}).get("complete")
'''
          new_exact = '''            and proof.get("parameterization_complete")
            and _match_proof_condition_parameterization_complete(proof)
            and (proof.get("visible_result_reference") or {}).get("complete")
'''
          if release.count(old_exact) != 1:
              raise SystemExit(f'release authority anchor count={release.count(old_exact)}')
          release_path.write_text(release.replace(old_exact, new_exact, 1), encoding='utf-8')

          test_path = Path('skill-system/tests/test_strong_context_condition_parameterization.py')
          test_path.write_text(r'''from __future__ import annotations

from pathlib import Path
import sys
import unittest

ROOT = Path(__file__).resolve().parents[2]
AGENT_SRC = ROOT / "services" / "agent-service" / "src"
if str(AGENT_SRC) not in sys.path:
    sys.path.insert(0, str(AGENT_SRC))

from agent_core.lifecycle.semantic_contract import freeze_semantic_contract  # noqa: E402
from agent_core.runtime.capability_gate import _goal_condition_parameterization_proof  # noqa: E402
from agent_core.runtime.semantic_capability_verifier import _workflow_step_context  # noqa: E402
from agent_core.runtime.answer_release_alignment import _deterministic_verdict  # noqa: E402


def _state() -> dict:
    text = "哪些还在路上？"
    contract = freeze_semantic_contract(
        turn=1,
        user_text=text,
        summary=text,
        goals=[{
            "goal_id": "g1",
            "description": "查询还在运输中的订单物流",
            "evidence_span": text,
            "requested_effect": {
                "domain": "ecommerce",
                "operation": "logistics.get",
                "object_type": "order",
                "raw_description": text,
            },
            "expected_result_cardinality": "collection",
            "required": True,
            "depends_on": [],
            "condition": {
                "version": "condition-expression@1",
                "op": "eq",
                "left": {"source": "target_fact", "path": "delivery_status"},
                "right": {"source": "literal", "value": "运输中"},
            },
        }],
        alignment_proof={"verdict": "exact", "source": "test", "independent": True},
        granularity_proof={"verdict": "exact", "source": "test"},
    )
    return {
        "current_user_input": text,
        "turn_index": 1,
        "frozen_semantic_contract": contract,
        "current_turn_plan": {"effects": [{"effect_id": "effect:g1", "goal_ids": ["g1"]}]},
    }


class StrongContextConditionParameterizationTests(unittest.TestCase):
    def test_broad_candidate_without_condition_binding_fails_closed(self) -> None:
        proof = _goal_condition_parameterization_proof(
            _state(), effect_id="effect:g1",
            parameterization={"bindings": [], "parameterization_complete": True, "errors": []},
        )
        self.assertTrue(proof["required"])
        self.assertFalse(proof["complete"])
        self.assertEqual(proof["requirements"][0]["condition_path"], "delivery_status")
        self.assertEqual(proof["requirements"][0]["normalized_value"], "运输中")

    def test_exact_status_binding_closes_frozen_condition(self) -> None:
        proof = _goal_condition_parameterization_proof(
            _state(), effect_id="effect:g1",
            parameterization={
                "parameterization_complete": True,
                "errors": [],
                "bindings": [{
                    "status": "covered",
                    "source_span": "在路上",
                    "parameter_path": "query.delivery_status",
                    "normalized_value": "运输中",
                }],
            },
        )
        self.assertTrue(proof["required"])
        self.assertTrue(proof["complete"])
        self.assertEqual(proof["checks"][0]["matched_parameter_paths"], ["query.delivery_status"])

    def test_semantic_capability_verifier_receives_frozen_condition(self) -> None:
        context = _workflow_step_context(_state(), "effect:g1")
        condition = context["declared_goals"][0]["condition"]
        self.assertEqual(condition["left"]["path"], "delivery_status")
        self.assertEqual(condition["right"]["value"], "运输中")

    def test_answer_release_rejects_v42_matchproof_without_condition_closure(self) -> None:
        verdict = _deterministic_verdict(
            result={"turn_match_proofs": [{
                "match_proof_version": "match-proof@4.2",
                "effect_id": "effect:g1",
                "candidate_tool": "get_order_logistics",
                "goal_condition_parameterization": {"required": True, "complete": False},
            }]},
            blocks=[],
        )
        self.assertEqual(verdict.verdict, "reject")
        self.assertEqual(verdict.reason_code, "goal_condition_parameterization_unproven")


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')
          PY
      - name: Regenerate protected source baseline
        run: |
          python -B - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path
          root = Path.cwd()
          path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          roots = [str(value) for value in payload.get('protected_roots') or ()]
          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', *roots], cwd=root)
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          payload['file_count'] = len(tracked)
          payload['files'] = {relative: hashlib.sha256((root / relative).read_bytes()).hexdigest() for relative in tracked}
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Install locked focused-test environment
        run: |
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service && uv sync --locked --all-groups
      - name: Run focused scope regressions
        run: |
          services/agent-service/.venv/bin/python -B -m unittest skill-system.tests.test_strong_context_condition_parameterization
          services/agent-service/.venv/bin/python -B -m pytest -q \
            services/agent-service/tests/context/test_parameterized_capability_alignment.py \
            services/agent-service/tests/presentation/test_result_release.py \
            services/agent-service/tests/runtime/test_goal_granularity_and_conditions.py
          services/agent-service/.venv/bin/python -B -m unittest discover -s skill-system/tests -p 'test_product_source_baseline_binding.py'
      - name: Restore governance workflows and commit green repair
        run: |
          git checkout origin/main -- .github/workflows/quality.yml .github/workflows/skill-self-validation.yml
          rm -f docs/c1-2-strong-context-trigger.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Close frozen condition scope before logistics release'
          git push origin HEAD:repair-strong-context-scope-20260810
