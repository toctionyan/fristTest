name: Publish final B34 resilient task harness

on:
  push:
    branches:
      - agent/b34-final-publisher-20260804
    paths:
      - candidate-validation/b34-final-publisher/**
      - .github/workflows/publish-b34-final-resilient-task-harness.yml
  pull_request:
    branches:
      - agent/b33-full-source-20260804
    paths:
      - candidate-validation/b34-final-publisher/**
      - .github/workflows/publish-b34-final-resilient-task-harness.yml

permissions:
  contents: read

jobs:
  diagnose-github-product-hashes:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 5b8e9d71c596fefdc59766bc47773f750549e952
      OVERLAY_SHA: a4c771dc9ed99faa806d859c5017bb7dc5065d2417fe15ce99a0b6fd0a1663ff
      CORRECTION_SHA: 9c6d1d5f53681361fdf42ab47c88a48f0c6403c9b86f6204ca69c4a0129655da
      AUTHORITY_SHA: 3391d063b927267a3f975f8098637da10d66953256c6cd573921075ad0c01204
      LEDGER_BINDING_SHA: f668bb44687010f100fefbb569277e11b6693cc9ff1dd546cb658cfee322a81c

    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/b34-final-publisher-20260804
          fetch-depth: 0

      - name: Authenticate and materialize exact final tree
        run: |
          set -euo pipefail
          cat candidate-validation/b34-final-publisher/part-*.b64 > /tmp/base.b64
          base64 --decode /tmp/base.b64 > /tmp/base.tar.xz
          echo "${OVERLAY_SHA}  /tmp/base.tar.xz" | sha256sum --check --strict

          cat candidate-validation/b34-final-publisher/correction-part-*.b64 > /tmp/correction.b64
          base64 --decode /tmp/correction.b64 > /tmp/correction.tar.xz
          echo "${CORRECTION_SHA}  /tmp/correction.tar.xz" | sha256sum --check --strict

          cat candidate-validation/b34-final-publisher/authority-small-part-*.b64 > /tmp/authority.b64
          base64 --decode /tmp/authority.b64 > /tmp/authority.tar.xz
          echo "${AUTHORITY_SHA}  /tmp/authority.tar.xz" | sha256sum --check --strict

          cat candidate-validation/b34-final-publisher/ledger-binding-part-*.b64 > /tmp/ledger.b64
          base64 --decode /tmp/ledger.b64 > /tmp/ledger.tar.xz
          echo "${LEDGER_BINDING_SHA}  /tmp/ledger.tar.xz" | sha256sum --check --strict

          git worktree add --detach /tmp/b34-hash-tree "${BASE_SHA}"
          tar -xJf /tmp/base.tar.xz -C /tmp/b34-hash-tree
          tar -xJf /tmp/correction.tar.xz -C /tmp/b34-hash-tree
          tar -xJf /tmp/authority.tar.xz -C /tmp/b34-hash-tree
          tar -xJf /tmp/ledger.tar.xz -C /tmp/b34-hash-tree
          rm -f \
            /tmp/b34-hash-tree/services/agent-service/runtime/sqlite/app.db \
            /tmp/b34-hash-tree/services/business-service/runtime/business-service/business.db

      - name: Print exact GitHub SHA-256 identities
        run: |
          set -euo pipefail
          cd /tmp/b34-hash-tree
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          paths = [
              'services/agent-service/src/agent_core/lifecycle/protocol.py',
              'services/agent-service/tests/architecture/test_full_lifecycle_canary_interpreter.py',
              'services/agent-service/tests/runtime/test_b14f1_sqlite_resource_lifecycle.py',
              'services/agent-service/tests/runtime/test_b17h_protected_environment_preflight.py',
              'services/agent-service/tests/runtime/test_b17i_production_execution_handoff.py',
              'services/agent-service/tests/runtime/test_goal_coverage_runtime.py',
              'services/agent-service/tests/support/conversation_case_fixtures.py',
          ]
          rows = {}
          for raw in paths:
              path = Path(raw)
              rows[raw] = {
                  'exists': path.is_file(),
                  'size': path.stat().st_size if path.is_file() else None,
                  'sha256': hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None,
              }
          print('B34_GITHUB_PRODUCT_IDENTITIES=' + json.dumps(rows, sort_keys=True))
          PY

          python - <<'PY'
          import sys
          from pathlib import Path
          root = Path('.').resolve()
          sys.path.insert(0, str(root / 'skill-system/controller'))
          import project_compatibility  # type: ignore
          print('B34_GITHUB_PROTECTED_FILE_COUNT=' + str(len(project_compatibility.snapshot(root))))
          PY

          echo 'Diagnostic-only run completed; no branch was published.'
