name: Temporary PR Product Baseline Refresh

on:
  push:
    branches:
      - fix/real-model-refund-history-semantic-20260815
    paths:
      - .github/pr-baseline-refresh.trigger

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.head_commit.message == 'ci(control): trigger governed product baseline refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh baseline with repository authority
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "fix/real-model-refund-history-semantic-20260815"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          python3 -B scripts/refresh_product_source_baseline.py \
            --workspace . \
            --generated-from-sha "${GITHUB_SHA}"
          printf '%s\n' 'skill-system/registry/product-source-baseline.json' > /tmp/expected.txt
          git diff --name-only -- | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt

      - name: Publish baseline-only commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m 'chore(control): refresh product-source baseline for refund semantics'
          git push origin HEAD:fix/real-model-refund-history-semantic-20260815
