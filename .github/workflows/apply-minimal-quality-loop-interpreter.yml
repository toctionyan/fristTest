name: apply-minimal-quality-loop-interpreter

on:
  push:
    branches:
      - agent/fix-minimal-quality-loop-interpreter
    paths:
      - .github/repair/minimal-quality-loop-interpreter.patch
      - .github/workflows/apply-minimal-quality-loop-interpreter.yml

permissions:
  contents: write

jobs:
  apply-audited-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Apply exact compatibility patch
        run: |
          git apply --check .github/repair/minimal-quality-loop-interpreter.patch
          git apply .github/repair/minimal-quality-loop-interpreter.patch
          rm .github/repair/minimal-quality-loop-interpreter.patch
          rm .github/workflows/apply-minimal-quality-loop-interpreter.yml
      - name: Validate controller syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('scripts/quality_loop.py')
          ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
      - name: Commit compatibility fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: keep quality loop usable in minimal test workspaces"
          git push origin "HEAD:${GITHUB_REF_NAME}"
