name: wp08-attempt4-failure-reconcile-once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt4-failure-reconcile-once-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 83251fe9e5e20fe66f9f80c569583a9e189214c8
      EXPECTED_WP08_RUN_ID: '31351903660'
      RELEASE_ISSUE_NUMBER: '335'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact Attempt 4 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Verify exact failed Attempt 4 workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          python - <<'PY'
          import json, os
          from urllib import request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          run_id = int(os.environ['EXPECTED_WP08_RUN_ID'])
          req = request.Request(
              f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
              headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'},
          )
          with request.urlopen(req, timeout=30) as response:
              run = json.load(response)
          expected_sha = os.environ['EXPECTED_MAIN_SHA']
          checks = {
              'name': str(run.get('name') or '') == 'wp08-full-stack-certification',
              'event': str(run.get('event') or '') == 'workflow_dispatch',
              'branch': str(run.get('head_branch') or '') == 'main',
              'sha': str(run.get('head_sha') or '') == expected_sha,
              'status': str(run.get('status') or '') == 'completed',
              'conclusion': str(run.get('conclusion') or '') == 'failure',
          }
          if not all(checks.values()):
              raise SystemExit('Attempt 4 run identity/conclusion mismatch: ' + json.dumps(checks, sort_keys=True))
          print(json.dumps({'status':'PASS','wp08_run_id':run_id,'candidate_sha':expected_sha,'conclusion':'failure'}, sort_keys=True))
          PY
      - name: Reconcile through repository recovery controller
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/wp08_release_recovery.py --mode reconcile
      - name: Verify durable failure classification state
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib import request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          issue_number = int(os.environ['RELEASE_ISSUE_NUMBER'])
          expected_run = int(os.environ['EXPECTED_WP08_RUN_ID'])
          expected_sha = os.environ['EXPECTED_MAIN_SHA']
          req = request.Request(
              f'https://api.github.com/repos/{repo}/issues/{issue_number}',
              headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'},
          )
          with request.urlopen(req, timeout=30) as response:
              issue = json.load(response)
          body = str(issue.get('body') or '')
          block = body.split('<!-- WP08_RELEASE_RUN_STATE_BEGIN -->',1)[1].split('<!-- WP08_RELEASE_RUN_STATE_END -->',1)[0]
          state = json.loads(block.split('```json',1)[1].split('```',1)[0])
          if state.get('status') != 'FAILED_NEEDS_CLASSIFICATION':
              raise SystemExit('unexpected ReleaseRun status: ' + str(state.get('status')))
          if int(state.get('attempt') or 0) != 4:
              raise SystemExit('Attempt count changed unexpectedly')
          if int(state.get('current_wp08_run_id') or 0) != expected_run:
              raise SystemExit('current WP-08 run changed unexpectedly')
          if int(state.get('last_wp08_run_id') or 0) != expected_run:
              raise SystemExit('last WP-08 run was not reconciled')
          if state.get('last_wp08_conclusion') != 'failure':
              raise SystemExit('last conclusion mismatch')
          if str(state.get('current_candidate_sha') or '') != expected_sha:
              raise SystemExit('candidate SHA changed unexpectedly')
          if state.get('production_closed') is not False:
              raise SystemExit('production_closed changed unexpectedly')
          history = list(state.get('history') or [])
          rows = [r for r in history if isinstance(r,dict) and r.get('event') == 'wp08_reconciled_completed_failure' and int(r.get('wp08_run_id') or 0) == expected_run]
          if len(rows) != 1:
              raise SystemExit('expected exactly one reconciled failure history row')
          print(json.dumps({'status':'PASS','issue':issue_number,'attempt':4,'release_state':'FAILED_NEEDS_CLASSIFICATION','candidate_sha':expected_sha,'wp08_run_id':expected_run,'production_closed':False}, sort_keys=True))
          PY
