name: governed-ci-post-merge-validation

on:
  workflow_dispatch:
    inputs:
      merge_sha:
        description: Exact already-consumed merge commit SHA to validate
        required: true
        type: string
      source_pr_number:
        description: Merged source pull request number
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: write
  actions: write
  issues: write
  pull-requests: read

concurrency:
  group: governed-ci-post-merge-validation-${{ github.repository }}-${{ inputs.merge_sha || github.event.issue.number }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.issue.pull_request != null
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Resolve owner-authorized validation target
        id: request
        env:
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          DISPATCH_MERGE_SHA: ${{ inputs.merge_sha }}
          DISPATCH_PR_NUMBER: ${{ inputs.source_pr_number }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          [[ "${ACTOR}" == "${OWNER}" ]] || {
            echo "post-merge validation may only be started by the repository owner" >&2
            exit 1
          }
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            merge_sha="${DISPATCH_MERGE_SHA}"
            pr_number="${DISPATCH_PR_NUMBER}"
          else
            [[ "${COMMENT_BODY}" =~ ^/governed-post-merge-validate[[:space:]]+([0-9a-f]{40})$ ]] || {
              echo "issue comment is not an exact post-merge validation command" >&2
              exit 1
            }
            merge_sha="${BASH_REMATCH[1]}"
            pr_number="${COMMENT_PR_NUMBER}"
          fi
          [[ "${merge_sha}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]
          echo "merge_sha=${merge_sha}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted post-merge control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: control
          fetch-depth: 0
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Verify merged PR identity and exact merge lineage
        id: target
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          MERGE_SHA: ${{ steps.request.outputs.merge_sha }}
        run: |
          set -euo pipefail
          mkdir -p post-merge-evidence
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > post-merge-evidence/pr.json
          gh api "repos/${GITHUB_REPOSITORY}/commits/${MERGE_SHA}" > post-merge-evidence/merge-commit.json
          "${pythonLocation}/bin/python" -B control/scripts/github_post_merge_validation.py verify-target \
            --pr post-merge-evidence/pr.json \
            --merge-commit post-merge-evidence/merge-commit.json \
            --source-pr-number "${PR_NUMBER}" \
            --merge-sha "${MERGE_SHA}" \
            --actor "${ACTOR}" \
            --repository-owner "${OWNER}" \
            --output post-merge-evidence/target.json
          git -C control fetch --no-tags origin "${MERGE_SHA}" main >/dev/null 2>&1
          git -C control merge-base --is-ancestor "${MERGE_SHA}" origin/main || {
            echo "requested merge commit is not an ancestor of current main" >&2
            exit 1
          }
          temp_branch="governed-post-merge-validation/${MERGE_SHA:0:12}-${GITHUB_RUN_ID}"
          echo "temp_branch=${temp_branch}" >> "$GITHUB_OUTPUT"

      - name: Record post-merge validation start
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          MERGE_SHA: ${{ steps.request.outputs.merge_sha }}
        run: |
          set -euo pipefail
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body \
            "Post-merge validation started for exact merge \`${MERGE_SHA}\` in workflow run \`${GITHUB_RUN_ID}\`. This stage is validation-only: authority_effect=false, merge_allowed=false, deploy_allowed=false, production_closed=false."

      - name: Create temporary exact-merge validation ref
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.request.outputs.merge_sha }}
          TEMP_BRANCH: ${{ steps.target.outputs.temp_branch }}
        run: |
          set -euo pipefail
          jq -n --arg ref "refs/heads/${TEMP_BRANCH}" --arg sha "${MERGE_SHA}" '{ref:$ref,sha:$sha}' \
            > post-merge-evidence/create-ref-request.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            --input post-merge-evidence/create-ref-request.json > post-merge-evidence/create-ref-response.json
          jq -e --arg sha "${MERGE_SHA}" '.object.sha == $sha' post-merge-evidence/create-ref-response.json >/dev/null

      - name: Dispatch Quality on the exact merge ref
        id: quality-dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.request.outputs.merge_sha }}
          TEMP_BRANCH: ${{ steps.target.outputs.temp_branch }}
        run: |
          set -euo pipefail
          dispatched_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n --arg ref "${TEMP_BRANCH}" '{ref:$ref}' > post-merge-evidence/quality-dispatch-request.json
          gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/dispatches" \
            --input post-merge-evidence/quality-dispatch-request.json
          echo "dispatched_at=${dispatched_at}" >> "$GITHUB_OUTPUT"

      - name: Resolve and await exact post-merge Quality
        id: quality
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.request.outputs.merge_sha }}
          TEMP_BRANCH: ${{ steps.target.outputs.temp_branch }}
          DISPATCHED_AT: ${{ steps.quality-dispatch.outputs.dispatched_at }}
        run: |
          set -euo pipefail
          quality_run_id=""
          for attempt in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?event=workflow_dispatch&branch=${TEMP_BRANCH}&per_page=20" \
              > post-merge-evidence/quality-runs.json
            quality_run_id=$(jq -r --arg sha "${MERGE_SHA}" --arg started "${DISPATCHED_AT}" '
              [.workflow_runs[]
               | select(.head_sha == $sha)
               | select(.event == "workflow_dispatch")
               | select(.created_at >= $started)]
              | sort_by(.created_at) | reverse | .[0].id // empty
            ' post-merge-evidence/quality-runs.json)
            [[ "${quality_run_id}" =~ ^[1-9][0-9]*$ ]] && break
            sleep 2
          done
          [[ "${quality_run_id}" =~ ^[1-9][0-9]*$ ]] || {
            echo "could not resolve the exact dispatched Quality run" >&2
            exit 1
          }
          for attempt in $(seq 1 90); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${quality_run_id}" > post-merge-evidence/quality-run.json
            status=$(jq -r '.status' post-merge-evidence/quality-run.json)
            [[ "${status}" == "completed" ]] && break
            sleep 5
          done
          jq -e --arg sha "${MERGE_SHA}" '
            .name == "quality"
            and .event == "workflow_dispatch"
            and .head_sha == $sha
            and .status == "completed"
            and .conclusion == "success"
          ' post-merge-evidence/quality-run.json >/dev/null || {
            echo "exact post-merge Quality did not complete successfully" >&2
            exit 1
          }
          echo "run_id=${quality_run_id}" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$(jq -r '.run_attempt' post-merge-evidence/quality-run.json)" >> "$GITHUB_OUTPUT"
          echo "completed_at=$(jq -r '.updated_at' post-merge-evidence/quality-run.json)" >> "$GITHUB_OUTPUT"

      - name: Resolve and await chained project convergence
        id: convergence
        env:
          GH_TOKEN: ${{ github.token }}
          MERGE_SHA: ${{ steps.request.outputs.merge_sha }}
          TEMP_BRANCH: ${{ steps.target.outputs.temp_branch }}
          QUALITY_COMPLETED_AT: ${{ steps.quality.outputs.completed_at }}
        run: |
          set -euo pipefail
          convergence_run_id=""
          for attempt in $(seq 1 40); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/project-convergence.yml/runs?event=workflow_run&branch=${TEMP_BRANCH}&per_page=20" \
              > post-merge-evidence/convergence-runs.json
            convergence_run_id=$(jq -r --arg sha "${MERGE_SHA}" --arg started "${QUALITY_COMPLETED_AT}" '
              [.workflow_runs[]
               | select(.head_sha == $sha)
               | select(.event == "workflow_run")
               | select(.created_at >= $started)]
              | sort_by(.created_at) | reverse | .[0].id // empty
            ' post-merge-evidence/convergence-runs.json)
            [[ "${convergence_run_id}" =~ ^[1-9][0-9]*$ ]] && break
            sleep 3
          done
          [[ "${convergence_run_id}" =~ ^[1-9][0-9]*$ ]] || {
            echo "project-convergence did not chain from the dispatched Quality run" >&2
            exit 1
          }
          for attempt in $(seq 1 60); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${convergence_run_id}" > post-merge-evidence/convergence-run.json
            status=$(jq -r '.status' post-merge-evidence/convergence-run.json)
            [[ "${status}" == "completed" ]] && break
            sleep 3
          done
          jq -e --arg sha "${MERGE_SHA}" '
            .name == "project-convergence"
            and .event == "workflow_run"
            and .head_sha == $sha
            and .status == "completed"
            and .conclusion == "success"
          ' post-merge-evidence/convergence-run.json >/dev/null || {
            echo "exact project-convergence did not complete successfully" >&2
            exit 1
          }
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${convergence_run_id}/jobs?per_page=100" \
            > post-merge-evidence/convergence-jobs.json
          jq -e '[.jobs[] | select(.name == "assess" and .conclusion == "success")] | length == 1' \
            post-merge-evidence/convergence-jobs.json >/dev/null
          echo "run_id=${convergence_run_id}" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$(jq -r '.run_attempt' post-merge-evidence/convergence-run.json)" >> "$GITHUB_OUTPUT"

      - name: Finalize immutable post-merge validation receipt
        env:
          MERGE_SHA: ${{ steps.request.outputs.merge_sha }}
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B control/scripts/github_post_merge_validation.py finalize \
            --target post-merge-evidence/target.json \
            --quality-run post-merge-evidence/quality-run.json \
            --convergence-run post-merge-evidence/convergence-run.json \
            --output post-merge-evidence/post-merge-validation.json
          jq -e --arg sha "${MERGE_SHA}" '
            .status == "POST_MERGE_VALIDATED"
            and .merge_sha == $sha
            and .authority_effect == false
            and .merge_allowed == false
            and .deploy_allowed == false
            and .production_closed == false
          ' post-merge-evidence/post-merge-validation.json >/dev/null

      - name: Upload immutable post-merge evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-post-merge-validation-${{ steps.request.outputs.merge_sha }}
          path: post-merge-evidence
          retention-days: 90
          if-no-files-found: error

      - name: Record completed post-merge validation
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          MERGE_SHA: ${{ steps.request.outputs.merge_sha }}
          QUALITY_RUN_ID: ${{ steps.quality.outputs.run_id }}
          CONVERGENCE_RUN_ID: ${{ steps.convergence.outputs.run_id }}
        run: |
          set -euo pipefail
          gh pr comment "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --body \
            "Post-merge validation completed for exact merge \`${MERGE_SHA}\`: Quality run \`${QUALITY_RUN_ID}\` and project-convergence run \`${CONVERGENCE_RUN_ID}\` both succeeded on that exact merge snapshot. POST_MERGE_VALIDATED; authority_effect=false, merge_allowed=false, deploy_allowed=false, production_closed=false."

      - name: Remove temporary exact-merge validation ref
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TEMP_BRANCH: ${{ steps.target.outputs.temp_branch }}
        run: |
          set -euo pipefail
          if [[ -n "${TEMP_BRANCH}" ]]; then
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${TEMP_BRANCH}" >/dev/null 2>&1 || true
          fi
