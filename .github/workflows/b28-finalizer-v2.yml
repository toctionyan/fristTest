name: B28 Governed Finalizer V2
run-name: Validate and assemble corrected B28 candidate

"on":
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.b28-publisher-trigger]

permissions:
  contents: write

env:
  B28_BRANCH: agent/b28-repository-onboarding
  B28_TRANSPORT_HEAD: 4382c38d04fdd2570eaf20d1cfc2032b734c80fd
  B28_TRANSPORT_PARENT: 6e22385a06763dbfcf602d43151221c454a53f33
  B28_STABLE_HEAD: 03484367b072fe82d189d79f9287e95592c2ed11
  OVERLAY_ZST_SHA256: 99129c5c474e6deb5a440693f810decd50e928e9854acd8e2d15aa65e2b16432
  OVERLAY_TAR_SHA256: 1342275712e254753518c1dba3567c6f43b1f7660a20e6254d121da3ba3917bb

jobs:
  finalize:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/b28-publisher-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable transport
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.B28_TRANSPORT_HEAD }}
          fetch-depth: 32
          clean: true
          persist-credentials: true

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Set up governed Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Verify transport and apply reviewed overlays
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$B28_TRANSPORT_HEAD"
          test "$(git rev-parse HEAD^)" = "$B28_TRANSPORT_PARENT"
          git cat-file -e "$B28_STABLE_HEAD^{commit}"
          git merge-base --is-ancestor "$B28_STABLE_HEAD" HEAD
          test "$(find .b28-import-correction -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" = "14"

          cat .b28-import-correction/part-* | base64 --decode > /tmp/b28-overlay.tar.zst
          echo "$OVERLAY_ZST_SHA256  /tmp/b28-overlay.tar.zst" | sha256sum -c -
          command -v zstd >/dev/null
          zstd -q -d /tmp/b28-overlay.tar.zst -o /tmp/b28-overlay.tar
          echo "$OVERLAY_TAR_SHA256  /tmp/b28-overlay.tar" | sha256sum -c -
          if tar -tf /tmp/b28-overlay.tar | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe path found in B28 overlay.' >&2
            exit 1
          fi
          rm -rf .b28-import-correction
          tar -xf /tmp/b28-overlay.tar -C .

          echo '794fccb32df38fff87ec0472217de014acd923471083c1da328060d497a845ac  skill-system/registry/product-source-baseline.json' | sha256sum -c -
          echo '326da05da9d1772d0c23f4c201554b7a2ce772bcc9d7c6c5cb12d17802446645  skill-system/controller/project_compatibility.py' | sha256sum -c -
          echo 'feea3da00a69cd327645a2970939d7fe61ac980a60ce91386bd632fa00d6f570  skill-system/tests/test_project_compatibility.py' | sha256sum -c -

          "${pythonLocation}/bin/python" - <<'PY'
          import json
          from pathlib import Path

          baseline = Path("skill-system/registry/product-source-baseline.json")
          payload = json.loads(baseline.read_text(encoding="utf-8"))
          files = payload.get("files")
          if not isinstance(files, dict) or payload.get("file_count") != 537 or len(files) != 537:
              raise SystemExit("unexpected B28 source baseline shape")
          for generated in (
              "services/agent-service/runtime/sqlite/app.db",
              "services/business-service/runtime/business-service/business.db",
          ):
              if generated not in files:
                  raise SystemExit(f"missing reviewed generated-state entry: {generated}")
              files.pop(generated)
          payload["file_count"] = len(files)
          if payload["file_count"] != 535:
              raise SystemExit("corrected source baseline must contain 535 files")
          baseline.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          compatibility = Path("skill-system/controller/project_compatibility.py")
          source = compatibility.read_text(encoding="utf-8")
          replacements = (
              (
                  'IGNORED_PARTS = {".venv", "node_modules", "__pycache__"}\n',
                  'IGNORED_PARTS = {".venv", "node_modules", "__pycache__"}\n'
                  'GENERATED_STATE_PREFIXES = (\n'
                  '    "services/agent-service/runtime/",\n'
                  '    "services/business-service/runtime/",\n'
                  ')\n\n\n'
                  'def _is_generated_state_path(path: str) -> bool:\n'
                  '    return path.startswith(GENERATED_STATE_PREFIXES)\n',
              ),
              (
                  '            if any(part in IGNORED_PARTS for part in path.parts):\n'
                  '                continue\n'
                  '            rows[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()\n',
                  '            if any(part in IGNORED_PARTS for part in path.parts):\n'
                  '                continue\n'
                  '            relative = path.relative_to(root).as_posix()\n'
                  '            if _is_generated_state_path(relative):\n'
                  '                continue\n'
                  '            rows[relative] = hashlib.sha256(path.read_bytes()).hexdigest()\n',
              ),
              (
                  '        if not path.startswith(prefixes):\n'
                  '            continue\n',
                  '        if not path.startswith(prefixes) or _is_generated_state_path(path):\n'
                  '            continue\n',
              ),
          )
          for old, new in replacements:
              if source.count(old) != 1:
                  raise SystemExit("project compatibility preimage changed")
              source = source.replace(old, new, 1)
          compatibility.write_text(source, encoding="utf-8")

          test_file = Path("skill-system/tests/test_project_compatibility.py")
          tests = test_file.read_text(encoding="utf-8")
          marker = '\n\n\nif __name__ == "__main__":\n'
          addition = '''    def test_generated_service_runtime_state_is_not_product_source(self) -> None:
              write(self.root / "services/agent-service/runtime/sqlite/app.db", "runtime state\\n")
              write(
                  self.root / "services/business-service/runtime/business-service/business.db",
                  "runtime state\\n",
              )
              result = evaluate(self.root)
              self.assertEqual(result["status"], "PASS")
              self.assertEqual(result["protected_file_count"], 1)

              def test_source_runtime_code_remains_protected(self) -> None:
              write(
                  self.root / "services/agent-service/src/agent_core/runtime/guard.py",
                  "ENFORCED = True\\n",
              )
              result = evaluate(self.root)
              self.assertEqual(result["status"], "FAIL")
              self.assertTrue(
                  any(
                      "product_source_changed:services/agent-service/src/agent_core/runtime/guard.py"
                      in item
                      for item in result["errors"]
                  )
              )
          '''
          if tests.count(marker) != 1:
              raise SystemExit("test module tail marker changed")
          tests = tests.replace(marker, "\n\n" + addition + "\n\nif __name__ == \"__main__\":\n", 1)
          test_file.write_text(tests, encoding="utf-8")
          PY

          echo '250ed571ca73a1338d232a070fc2442b1dbe263318db4f0e3e700c7a5dc0a419  skill-system/registry/product-source-baseline.json' | sha256sum -c -
          echo '28c6509301b74c54eba9fcf1a2f62c5e435ed58531ef4595e748bdcd5544e4a0  skill-system/controller/project_compatibility.py' | sha256sum -c -
          echo '3d2064a0139660ff9f779d69b94912a141e0eabf91288c57620630e7c8202f57  skill-system/tests/test_project_compatibility.py' | sha256sum -c -

      - name: Install locked validation environment
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups

      - name: Run governed validation
        shell: bash
        run: |
          set -euo pipefail
          PYTHON=services/agent-service/.venv/bin/python
          TARGET="$GITHUB_WORKSPACE/.quality/targets/quality-target-b28-finalizer-v2.md"
          export QUALITY_EVIDENCE_DIR="$RUNNER_TEMP/quality-evidence/b28-finalizer-v2"
          "$PYTHON" -B scripts/verify_task_ledger.py
          "$PYTHON" -B skill-system/controller/profile_runner.py skill-control-plane
          "$PYTHON" -B scripts/quality_toolchain_contract.py --static-only
          "$PYTHON" -B scripts/create_ci_quality_target.py \
            --output "$TARGET" --ref "$B28_TRANSPORT_HEAD" --workflow quality-static
          "$PYTHON" -B scripts/quality_loop.py --mode static --target "$TARGET"

      - name: Assemble exact final candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .quality services/agent-service/.venv
          find . -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          git add -A
          cat > /tmp/expected-paths.txt <<'EOF'
          governance/task-ledger-evidence-archive.json
          governance/task-ledger.json
          governance/task-ledger.schema.json
          skill-system/controller/project_compatibility.py
          skill-system/controller/task_ledger.py
          skill-system/registry/product-source-baseline.json
          skill-system/tests/test_project_compatibility.py
          skill-system/tests/test_task_ledger.py
          EOF
          git diff --cached --name-only "$B28_STABLE_HEAD" -- | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt
          echo '62888ce62c3e529c13d29471760a103d52b124c7c8137b0d174d22539d62ba96  skill-system/controller/task_ledger.py' | sha256sum -c -
          echo 'b73d1e2484acec1ba0dc3a1d824371212ca20b393bae56f27cad19fc9c6a9080  governance/task-ledger.schema.json' | sha256sum -c -
          echo '64a2e9e93d0cdcfa44b0815833c8f17fe5527fd87d8fa85f55df37ce3daed170  governance/task-ledger.json' | sha256sum -c -
          echo 'd39d03d98dc1c8510b7f41b6ad60faf822a10bf5f8174ab7c2ef2c37a31b74fa  governance/task-ledger-evidence-archive.json' | sha256sum -c -
          echo '250ed571ca73a1338d232a070fc2442b1dbe263318db4f0e3e700c7a5dc0a419  skill-system/registry/product-source-baseline.json' | sha256sum -c -
          echo 'c0d24d0a311b5836cac49076df74f47b545943d15e2f60df0ab8dd22b8d42a86  skill-system/tests/test_task_ledger.py' | sha256sum -c -
          echo '28c6509301b74c54eba9fcf1a2f62c5e435ed58531ef4595e748bdcd5544e4a0  skill-system/controller/project_compatibility.py' | sha256sum -c -
          echo '3d2064a0139660ff9f779d69b94912a141e0eabf91288c57620630e7c8202f57  skill-system/tests/test_project_compatibility.py' | sha256sum -c -
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git commit -m 'Persist evidence and correct B28 source authority'
          echo "FINAL_COMMIT=$(git rev-parse HEAD)"
          echo "FINAL_TREE=$(git rev-parse HEAD^{tree})"
          git push --force-with-lease=refs/heads/${B28_BRANCH}:$B28_TRANSPORT_HEAD \
            origin HEAD:${B28_BRANCH}
