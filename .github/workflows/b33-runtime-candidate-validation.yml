name: B33 Runtime Candidate Validation

on:
  pull_request:
    branches:
      - agent/b28-repository-onboarding
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-b33-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Reconstruct and validate B33 runtime patch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/b33-evidence"
          target='services/agent-service/src/agent_core/runtime/capability_gate.py'
          cat \
            candidate-validation/b33-runtime-patch/part-000.b64 \
            candidate-validation/b33-runtime-patch/part-001.b64 \
            candidate-validation/b33-runtime-patch/part-002.b64 \
            candidate-validation/b33-runtime-patch/part-003.b64 \
            candidate-validation/b33-runtime-patch/part-004.b64 \
            candidate-validation/b33-runtime-patch/part-005.b64 \
            candidate-validation/b33-runtime-patch/part-006-seg-000.b64 \
            candidate-validation/b33-runtime-patch/part-006-seg-001.b64 \
            candidate-validation/b33-runtime-patch/part-006-seg-002.b64 \
            candidate-validation/b33-runtime-patch/part-006-seg-003.b64 \
            candidate-validation/b33-runtime-patch/part-007.b64 \
            candidate-validation/b33-runtime-patch/part-008.b64 \
            | base64 --decode \
            | gzip -dc > "${RUNNER_TEMP}/b33-runtime.patch"
          echo "af58c9e2262eaaf945b9c893624bc726ac619f832cb962e8209e61da1ca7bd89  ${RUNNER_TEMP}/b33-runtime.patch" \
            | sha256sum --check --strict

          set +e
          git apply --3way "${RUNNER_TEMP}/b33-runtime.patch"
          apply_rc=$?
          set -e

          if git ls-files -u -- "$target" | grep -q .; then
            git show ":1:${target}" > "${RUNNER_TEMP}/b33-evidence/capability_gate.base.py"
            git show ":2:${target}" > "${RUNNER_TEMP}/b33-evidence/capability_gate.repository.py"
            git show ":3:${target}" > "${RUNNER_TEMP}/b33-evidence/capability_gate.b33.py"
            cp "$target" "${RUNNER_TEMP}/b33-evidence/capability_gate.conflict.py"
            git diff --cc -- "$target" > "${RUNNER_TEMP}/b33-evidence/capability_gate.conflict.diff"
            {
              echo 'status=merge_conflict'
              echo "path=${target}"
              echo "apply_rc=${apply_rc}"
            } > "${RUNNER_TEMP}/b33-evidence/merge-status.txt"
            exit 86
          fi

          test "$apply_rc" -eq 0
          git diff --name-only HEAD -- services/agent-service/src services/agent-service/tests \
            | LC_ALL=C sort > "${RUNNER_TEMP}/b33-evidence/changed-paths.txt"
          test "$(wc -l < "${RUNNER_TEMP}/b33-evidence/changed-paths.txt")" -eq 48
          git diff --check HEAD

      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Install locked Agent dependencies
        run: cd services/agent-service && uv sync --locked --all-groups

      - name: Run B33 focused architecture contracts
        working-directory: services/agent-service
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/b33-evidence"
          uv run pytest -q \
            --junitxml="${RUNNER_TEMP}/b33-evidence/focused-junit.xml" \
            tests/runtime/test_stage1_known_architecture_gaps.py \
            tests/runtime/test_stage2_p0_safety_boundaries.py \
            tests/runtime/test_stage3_entity_authority.py \
            tests/runtime/test_stage4_goal_output_refs.py \
            tests/runtime/test_stage5_controlled_target_dsl.py \
            tests/runtime/test_pretool_execution_policy.py \
            tests/runtime/test_capability_target_schema.py

      - name: Run Agent non-integration regression
        working-directory: services/agent-service
        run: |
          set -euo pipefail
          uv run pytest -q \
            -m "not integration and not preprod" \
            --junitxml="${RUNNER_TEMP}/b33-evidence/agent-regression-junit.xml"

      - name: Run architecture gates
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B scripts/verify_architecture.py
          "${pythonLocation}/bin/python" -B scripts/verify_module_closure.py
          "${pythonLocation}/bin/python" -B scripts/verify_version_consistency.py
          services/agent-service/.venv/bin/python -m compileall -q services/agent-service/src

      - name: Record tested tree
        if: always()
        shell: bash
        run: |
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "commit=${GITHUB_SHA}"
            echo "base_ref=${GITHUB_BASE_REF}"
            echo "head_ref=${GITHUB_HEAD_REF}"
            echo "patch_sha256=af58c9e2262eaaf945b9c893624bc726ac619f832cb962e8209e61da1ca7bd89"
            echo "merge_mode=git-apply-3way"
            echo "production_closed=false"
          } > "${RUNNER_TEMP}/b33-evidence/run-binding.txt"

      - name: Upload B33 validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b33-runtime-validation-evidence
          if-no-files-found: error
          path: ${{ runner.temp }}/b33-evidence
