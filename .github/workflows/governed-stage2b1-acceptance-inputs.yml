name: governed-stage2b1-acceptance-inputs

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact successful workflow run containing the six input artifacts
        required: true
        type: string
      source_run_attempt:
        description: Exact attempt for source_run_id
        required: false
        default: '1'
        type: string
      task_run_artifact_id:
        description: Artifact ID named stage2b1-acceptance-task-run
        required: true
        type: string
      decision_artifact_id:
        description: Artifact ID named stage2b1-acceptance-decision
        required: true
        type: string
      expected_binding_artifact_id:
        description: Artifact ID named stage2b1-acceptance-expected-binding
        required: true
        type: string
      change_contract_artifact_id:
        description: Artifact ID named stage2b1-acceptance-change-contract
        required: true
        type: string
      human_gate_artifact_id:
        description: Artifact ID named stage2b1-acceptance-human-gate
        required: true
        type: string
      human_decision_artifact_id:
        description: Artifact ID named stage2b1-acceptance-human-decision
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: governed-stage2b1-acceptance-inputs-${{ inputs.source_run_id }}-${{ inputs.source_run_attempt }}
  cancel-in-progress: false

jobs:
  package-stage2b1-acceptance-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require dispatch from main
        run: |
          set -euo pipefail
          [[ "${GITHUB_REF}" == "refs/heads/main" ]]

      - name: Checkout trusted control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Validate the exact source run
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${SOURCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          mkdir -p incoming
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > incoming/source-run.json
          jq -e \
            --arg run_id "${SOURCE_RUN_ID}" \
            --arg attempt "${SOURCE_RUN_ATTEMPT}" \
            '(.id|tostring) == $run_id and
             .run_attempt == ($attempt|tonumber) and
             .status == "completed" and
             .conclusion == "success"' \
            incoming/source-run.json >/dev/null

      - name: Download and validate the explicit input artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          TASK_RUN_ARTIFACT_ID: ${{ inputs.task_run_artifact_id }}
          DECISION_ARTIFACT_ID: ${{ inputs.decision_artifact_id }}
          EXPECTED_BINDING_ARTIFACT_ID: ${{ inputs.expected_binding_artifact_id }}
          CHANGE_CONTRACT_ARTIFACT_ID: ${{ inputs.change_contract_artifact_id }}
          HUMAN_GATE_ARTIFACT_ID: ${{ inputs.human_gate_artifact_id }}
          HUMAN_DECISION_ARTIFACT_ID: ${{ inputs.human_decision_artifact_id }}
        run: |
          set -euo pipefail

          fetch_input() {
            local artifact_id="$1"
            local artifact_name="$2"
            local filename="$3"
            local label="$4"
            [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]]
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}" > "incoming/${label}.metadata.json"
            jq -e \
              --arg artifact_id "${artifact_id}" \
              --arg artifact_name "${artifact_name}" \
              --arg run_id "${SOURCE_RUN_ID}" \
              '(.id|tostring) == $artifact_id and
               .name == $artifact_name and
               .expired == false and
               (.workflow_run.id|tostring) == $run_id' \
              "incoming/${label}.metadata.json" >/dev/null
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "incoming/${label}.zip"
            python - "incoming/${label}.zip" "incoming/${label}" "${filename}" <<'PY'
          import json
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          destination = pathlib.Path(sys.argv[2])
          expected = sys.argv[3]
          destination.mkdir(parents=True, exist_ok=True)
          with zipfile.ZipFile(archive) as source:
              entries = source.infolist()
              if len(entries) != 1:
                  raise SystemExit("input artifact must contain exactly one file")
              entry = entries[0]
              path = pathlib.PurePosixPath(entry.filename)
              mode = (entry.external_attr >> 16) & 0o170000
              if (
                  entry.filename.endswith("/")
                  or path.is_absolute()
                  or ".." in path.parts
                  or len(path.parts) != 1
                  or path.name != expected
              ):
                  raise SystemExit("input artifact contains an unsafe or unexpected path")
              if mode == 0o120000:
                  raise SystemExit("input artifact contains a symlink")
              if mode and mode not in (0o100644, 0o100755):
                  raise SystemExit("input artifact contains a non-regular file")
              payload = source.read(entry)
              value = json.loads(payload.decode("utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit("input artifact JSON must be an object")
              (destination / expected).write_bytes(payload)
          PY
          }

          fetch_input "${TASK_RUN_ARTIFACT_ID}" \
            "stage2b1-acceptance-task-run" "task-run.json" "task-run"
          fetch_input "${DECISION_ARTIFACT_ID}" \
            "stage2b1-acceptance-decision" "decision.json" "decision"
          fetch_input "${EXPECTED_BINDING_ARTIFACT_ID}" \
            "stage2b1-acceptance-expected-binding" "expected-binding.json" "expected-binding"
          fetch_input "${CHANGE_CONTRACT_ARTIFACT_ID}" \
            "stage2b1-acceptance-change-contract" "change-contract.json" "change-contract"
          fetch_input "${HUMAN_GATE_ARTIFACT_ID}" \
            "stage2b1-acceptance-human-gate" "human-gate.json" "human-gate"
          fetch_input "${HUMAN_DECISION_ARTIFACT_ID}" \
            "stage2b1-acceptance-human-decision" "human-decision.json" "human-decision"

      - name: Package the exact inputs without running acceptance
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
        run: |
          set -euo pipefail
          mkdir -p incoming/package
          python -B control/scripts/stage2b1_acceptance_inputs.py \
            --source-run-id "${SOURCE_RUN_ID}" \
            --source-run-attempt "${SOURCE_RUN_ATTEMPT}" \
            --task-run incoming/task-run/task-run.json \
            --decision incoming/decision/decision.json \
            --expected-binding incoming/expected-binding/expected-binding.json \
            --change-contract incoming/change-contract/change-contract.json \
            --human-gate incoming/human-gate/human-gate.json \
            --human-decision incoming/human-decision/human-decision.json \
            --output-dir incoming/package

      - name: Upload the exact Stage2B1 acceptance input package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage2b1-acceptance-inputs
          path: incoming/package
          retention-days: 90
          if-no-files-found: error
