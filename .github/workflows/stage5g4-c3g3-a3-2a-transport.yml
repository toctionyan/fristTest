name: stage5g4-c3g3-a3-2a-transport

on:
  push:
    branches:
      - stage5g4-c3g3-a3-2a-execution-view

permissions:
  contents: write

jobs:
  materialize-a3-1:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact A3-1 candidate and remove transport
        shell: bash
        env:
          A2_HEAD: 93bf61ff7277bc6a002f9ce96354061ed530e7e1
          PATCH_PATH: .quality/stage5g4-c3g3-a3-2a/A3_1.patch
          PATCH_SHA256: 86902328c742ca668f6c28a3f3a894a9b83449d1def54179a1ab32e4d92b4d57
          WORKFLOW_PATH: .github/workflows/stage5g4-c3g3-a3-2a-transport.yml
        run: |
          set -euo pipefail

          test "$(git merge-base "$A2_HEAD" HEAD)" = "$A2_HEAD"
          echo "$PATCH_SHA256  $PATCH_PATH" | sha256sum -c -

          git apply --check "$PATCH_PATH"
          git apply "$PATCH_PATH"

          python - <<'PY'
          from pathlib import Path
          for name in (
              'scripts/quality_control/baseline_oracle.py',
              'scripts/quality_loop.py',
              'skill-system/tests/test_baseline_oracle_quality_loop_integration.py',
          ):
              text = Path(name).read_text(encoding='utf-8')
              compile(text, name, 'exec')
          PY

          printf '%s  %s\n' \
            '7b4f09500d4da88d55080aea76f0c5668b127ff395d2e3bf3ff19ba8600b9271' 'scripts/quality_control/baseline_oracle.py' \
            'e104ca57c82dbe0d9bbaaee73f83183f2a2d8b62fab548037428bff9242a283f' 'scripts/quality_loop.py' \
            '1a7a865dd1f30412f4e1769dfe7301038135d3e2fe07653f5733ac7aedc4b6d9' 'skill-system/tests/test_baseline_oracle_quality_loop_integration.py' \
            | sha256sum -c -

          rm -f "$PATCH_PATH" "$WORKFLOW_PATH"
          rmdir --ignore-fail-on-non-empty .quality/stage5g4-c3g3-a3-2a || true

          git add -A

          expected=$(printf '%s\n' \
            'scripts/quality_control/baseline_oracle.py' \
            'scripts/quality_loop.py' \
            'skill-system/tests/test_baseline_oracle_quality_loop_integration.py' | sort)
          actual=$(git diff --cached --name-only "$A2_HEAD" | sort)
          test "$actual" = "$expected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'stage5g4-c3g3-a3-2a: materialize tested execution-view candidate'
          git push origin HEAD:stage5g4-c3g3-a3-2a-execution-view
