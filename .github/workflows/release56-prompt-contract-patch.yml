name: release56-canonical-dependency-contract-migration

on:
  push:
    branches:
      - repair/release56-dependency-verifier-nested-basis-contract-20260816
    paths:
      - .github/release56-prompt-contract-patch-trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: repair/release56-dependency-verifier-nested-basis-contract-20260816
          fetch-depth: 0

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'

      - name: Materialize canonical contract and permanent guards
        shell: bash
        env:
          CONTRACT_B64: 
          VERIFIER_B64: 
          TEST_B64: 
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          python - <<'PY'
          from __future__ import annotations

          import ast
          import base64
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          files = {
              root / "services/agent-service/src/agent_core/goal_graph/dependency_basis_contract.py": os.environ["CONTRACT_B64"],
              root / "scripts/verify_dependency_basis_contract.py": os.environ["VERIFIER_B64"],
              root / "services/agent-service/tests/runtime/test_release56_dependency_basis_contract.py": os.environ["TEST_B64"],
          }
          for path, encoded in files.items():
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(base64.b64decode(encoded))

          protected_test = "services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py"
          original = subprocess.run(
              ["git", "show", f"origin/main:{protected_test}"],
              check=True,
              stdout=subprocess.PIPE,
          ).stdout
          (root / protected_test).write_bytes(original)

          path = root / "services/agent-service/src/agent_core/lifecycle/goal_planning.py"
          text = path.read_text(encoding="utf-8")

          import_block = '''from agent_core.goal_graph.dependency_basis_contract import (
              ALLOWED_DEPENDENCY_BASIS_KINDS,
              dependency_basis_conflicts_with_requested_outputs,
              render_candidate_blind_dependency_rule,
              render_dependency_format_repair_rule,
          )

          '''
          anchor = 'GOAL_PLAN_VERSION = "turn-goal-plan@1.1"'
          if "from agent_core.goal_graph.dependency_basis_contract import (" not in text:
              if anchor not in text:
                  raise SystemExit("goal-planning import anchor missing")
              text = text.replace(anchor, import_block + anchor, 1)

          old_kinds = '''_ALLOWED_ALIGNMENT_DEPENDENCY_BASIS_KINDS = {
              "result_reference",
              "result_condition",
              "result_value_input",
          }'''
          if old_kinds in text:
              text = text.replace(
                  old_kinds,
                  "_ALLOWED_ALIGNMENT_DEPENDENCY_BASIS_KINDS = set(ALLOWED_DEPENDENCY_BASIS_KINDS)",
                  1,
              )
          elif "_ALLOWED_ALIGNMENT_DEPENDENCY_BASIS_KINDS = set(ALLOWED_DEPENDENCY_BASIS_KINDS)" not in text:
              raise SystemExit("dependency basis kind block missing")

          start_marker = "def _dependency_basis_overlaps_requested_output("
          end_marker = "\n\ndef _model_alignment_dependency_proof("
          start = text.find(start_marker)
          end = text.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("dependency overlap function boundary missing")
          replacement = '''def _dependency_basis_overlaps_requested_output(
              goal: dict[str, Any],
              basis_span: str,
          ) -> bool:
              """Project the canonical structural dependency-basis contract.

              This compatibility wrapper has no semantic or final-edge authority. The
              canonical contract admits a strict nested relation-only subspan while
              rejecting equality and a basis that wraps requested-output evidence.
              """

              return dependency_basis_conflicts_with_requested_outputs(
                  basis_span,
                  _requested_output_evidence_spans(goal),
              )
          '''
          text = text[:start] + replacement + text[end:]

          tree = ast.parse(text)
          primary_marker = "must be disjoint from the dependent Goal requested_outputs evidence spans"
          repair_clause = (
              "The basis must not be requested-output evidence and must not wrap a requested-output evidence span with action/control wording; "
              "if no disjoint relation-only basis exists, return relation=independent."
          )
          primary_nodes = [
              node
              for node in ast.walk(tree)
              if isinstance(node, ast.Constant)
              and isinstance(node.value, str)
              and primary_marker in node.value
          ]
          repair_nodes = [
              node
              for node in ast.walk(tree)
              if isinstance(node, ast.Constant)
              and isinstance(node.value, str)
              and repair_clause in node.value
          ]
          if len(primary_nodes) != 1:
              raise SystemExit(f"expected one stale primary projection, found {len(primary_nodes)}")
          if len(repair_nodes) != 1:
              raise SystemExit(f"expected one stale format-repair projection, found {len(repair_nodes)}")

          lines = text.splitlines(keepends=True)
          offsets = [0]
          for line in lines:
              offsets.append(offsets[-1] + len(line))

          edits: list[tuple[int, int, str]] = []
          primary = primary_nodes[0]
          p_start = offsets[primary.lineno - 1] + primary.col_offset
          p_end = offsets[primary.end_lineno - 1] + primary.end_col_offset
          edits.append((p_start, p_end, "render_candidate_blind_dependency_rule()"))

          repair = repair_nodes[0]
          r_start = offsets[repair.lineno - 1] + repair.col_offset
          r_end = offsets[repair.end_lineno - 1] + repair.end_col_offset
          prefix, suffix = repair.value.split(repair_clause, 1)
          repair_expr = (
              "("
              + json.dumps(prefix, ensure_ascii=False)
              + " + render_dependency_format_repair_rule() + "
              + json.dumps(suffix, ensure_ascii=False)
              + ")"
          )
          edits.append((r_start, r_end, repair_expr))

          for edit_start, edit_end, new_source in sorted(edits, reverse=True):
              text = text[:edit_start] + new_source + text[edit_end:]

          if primary_marker in text or "if no disjoint relation-only basis exists" in text:
              raise SystemExit("stale dependency projection survived migration")
          ast.parse(text)
          path.write_text(text, encoding="utf-8")
          PY

          chmod +x scripts/verify_dependency_basis_contract.py
          python -B scripts/verify_dependency_basis_contract.py --write-manifest
          python -m py_compile             services/agent-service/src/agent_core/goal_graph/dependency_basis_contract.py             services/agent-service/src/agent_core/lifecycle/goal_planning.py             scripts/verify_dependency_basis_contract.py             services/agent-service/tests/runtime/test_release56_dependency_basis_contract.py

      - name: Install locked Agent validation environment
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check             --require-hashes --only-binary=:all:             -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups

      - name: Prove canonical contract and semantic invariants
        shell: bash
        run: |
          set -euo pipefail
          services/agent-service/.venv/bin/python -B scripts/verify_dependency_basis_contract.py
          cd services/agent-service
          .venv/bin/python -B -m pytest -q -ra -p no:cacheprovider             tests/runtime/test_release55_dependency_output_role_overlap.py             tests/runtime/test_release56_dependency_basis_contract.py

      - name: Remove temporary migration authority
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/release56-prompt-contract-patch.yml
          git rm .github/release56-prompt-contract-patch-trigger
          if git diff --name-only | grep -Fx 'skill-system/registry/product-source-baseline.json'; then
            echo "Baseline refresh is forbidden before governance closure." >&2
            exit 1
          fi
          if ! git diff --quiet origin/main -- services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py; then
            echo "Protected Release 55 oracle was not restored exactly to main." >&2
            exit 1
          fi
          git diff --check

      - name: Commit canonical contract migration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --name-only | sort
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix(semantic): canonicalize dependency basis contract'
          git push origin HEAD:repair/release56-dependency-verifier-nested-basis-contract-20260816
