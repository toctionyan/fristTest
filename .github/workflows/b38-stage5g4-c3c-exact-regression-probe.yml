name: b38-stage5g4-c3c-exact-regression-probe

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  exact-30path-regression:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout C3C probe payload
        uses: actions/checkout@v4
        with:
          path: payload
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Checkout exact B36 base
        uses: actions/checkout@v4
        with:
          path: exact
          ref: e0e04d51e9da9790bef7bd0482584f60b8e975a9
          fetch-depth: 1

      - name: Checkout reviewed C3A2 five-patch payload
        uses: actions/checkout@v4
        with:
          path: exact5payload
          ref: a92440c3c1d1735af11b44493634dc86b13ad327
          fetch-depth: 1

      - name: Pin Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Pin exact toolchain
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'uv==0.11.29'
          sudo npm install -g 'n@10.1.0'
          sudo n 24.18.0
          hash -r
          sudo npm install -g 'npm@11.16.0'
          test "$(python3 --version)" = "Python 3.12.13"
          test "$(uv --version | awk '{print $2}')" = "0.11.29"
          test "$(node --version)" = "v24.18.0"
          test "$(npm --version)" = "11.16.0"

      - name: Reassemble safe 25-path patch
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/payload/docs/governance/ci-probes/b38-stage5g4-c3c"
          cat "$SRC"/safe25-part-*.b64 > safe25.patch.xz.b64
          base64 -d safe25.patch.xz.b64 > safe25.patch.xz
          test "$(sha256sum safe25.patch.xz | awk '{print $1}')" = "a7003a2e3cdc542a1a7e1dacf8e85affd20fb57e3dd4f6a2bbf6e6e1b0722056"
          xz -dc safe25.patch.xz > safe25.patch
          test "$(sha256sum safe25.patch | awk '{print $1}')" = "6f4e4f936591b3fe29060e17bd4a1437a4799fa2eb4791354d6f213569a9e8c1"

      - name: Reassemble reviewed five exact-base patches
        shell: bash
        run: |
          set -euo pipefail
          SRC="$GITHUB_WORKSPACE/exact5payload/docs/governance/ci-probes/b38-stage5g4-c3a2"
          cat "$SRC"/part-00.b64 "$SRC"/part-01.b64 "$SRC"/part-02.b64 "$SRC"/part-03.b64 > exact5.tar.gz.b64
          base64 -d exact5.tar.gz.b64 > exact5.tar.gz
          test "$(sha256sum exact5.tar.gz | awk '{print $1}')" = "61271101c405b0eb7cdaf901531fa5f6e802288baeab642427ab2213ffafc078"
          mkdir exact5patches
          tar -xzf exact5.tar.gz -C exact5patches
          test "$(find exact5patches -maxdepth 1 -type f | wc -l | tr -d ' ')" = "5"

      - name: Apply exact 30-path candidate fail closed
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C exact rev-parse HEAD)" = "e0e04d51e9da9790bef7bd0482584f60b8e975a9"
          test -z "$(git -C exact status --porcelain=v1 --untracked-files=all)"
          git -C exact apply --check -p1 "$GITHUB_WORKSPACE/safe25.patch"
          git -C exact apply -p1 "$GITHUB_WORKSPACE/safe25.patch"
          patches=(
            "$GITHUB_WORKSPACE/exact5patches/services_agent-service_src_agent_core_context_visible_result_refs.py.patch"
            "$GITHUB_WORKSPACE/exact5patches/services_agent-service_src_agent_core_kernel_plan_projection_contract.py.patch"
            "$GITHUB_WORKSPACE/exact5patches/services_agent-service_src_agent_core_lifecycle_dialogue_runtime.py.patch"
            "$GITHUB_WORKSPACE/exact5patches/protocol_exact_base_selective.patch"
            "$GITHUB_WORKSPACE/exact5patches/services_agent-service_src_agent_core_lifecycle_workflow_runtime.py.patch"
          )
          for patch in "${patches[@]}"; do git -C exact apply --check -p1 "$patch"; done
          for patch in "${patches[@]}"; do git -C exact apply -p1 "$patch"; done

      - name: Verify exact 30-path scope and bytes
        shell: bash
        run: |
          set -euo pipefail
          cd exact
          cat > /tmp/expected30.txt <<'EOF'
          docs/architecture/V20_17_B38_CONTEXT_REFERENCE_GOAL_COVERAGE.md
          services/agent-service/.env.example
          services/agent-service/src/agent_core/config.py
          services/agent-service/src/agent_core/context/context_bundle.py
          services/agent-service/src/agent_core/context/reference_resolution.py
          services/agent-service/src/agent_core/context/state_projection.py
          services/agent-service/src/agent_core/context/visible_result_refs.py
          services/agent-service/src/agent_core/kernel/plan_projection_contract.py
          services/agent-service/src/agent_core/kernel/semantic_contract.py
          services/agent-service/src/agent_core/lifecycle/condition_expression.py
          services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py
          services/agent-service/src/agent_core/lifecycle/goal_capability_coverage.py
          services/agent-service/src/agent_core/lifecycle/goal_granularity.py
          services/agent-service/src/agent_core/lifecycle/goal_lifecycle.py
          services/agent-service/src/agent_core/lifecycle/goal_outputs.py
          services/agent-service/src/agent_core/lifecycle/goal_planning.py
          services/agent-service/src/agent_core/lifecycle/pretool_execution_policy.py
          services/agent-service/src/agent_core/lifecycle/pretool_planner.py
          services/agent-service/src/agent_core/lifecycle/protocol.py
          services/agent-service/src/agent_core/lifecycle/semantic_contract.py
          services/agent-service/src/agent_core/lifecycle/workflow_runtime.py
          services/agent-service/src/agent_core/runtime/capability_effects.py
          services/agent-service/src/agent_core/runtime/capability_gate.py
          services/agent-service/tests/architecture/test_production_security_contract.py
          services/agent-service/tests/context/test_reference_resolution_contract.py
          services/agent-service/tests/runtime/test_global_goal_capability_coverage.py
          services/agent-service/tests/runtime/test_goal_granularity_and_conditions.py
          services/agent-service/tests/runtime/test_pretool_execution_policy.py
          services/agent-service/tests/runtime/test_semantic_reference_binding.py
          services/agent-service/tests/runtime/test_stage4_goal_output_refs.py
          EOF
          sed -i 's/^          //' /tmp/expected30.txt
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/actual30.txt
          test "$(wc -l < /tmp/actual30.txt | tr -d ' ')" = "30"
          diff -u <(sort /tmp/expected30.txt) /tmp/actual30.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          manifest = {
          'docs/architecture/V20_17_B38_CONTEXT_REFERENCE_GOAL_COVERAGE.md':'5510278024f177157dc3edf1d452fd411dc92235fe3a8343c1abbe013dd1e25f',
          'services/agent-service/.env.example':'a1caf48e3251f7a5f918a5f42d2f187e22dd33363b1dd0f7ad87b5af8341a0df',
          'services/agent-service/src/agent_core/config.py':'7f2e3ae109e2e1d5f7ee8d1c5d295d8f94d8d38f1fbace6e94876d986509e749',
          'services/agent-service/src/agent_core/context/context_bundle.py':'bed5ad5b97dff5a863b52e679f146d55d936359c89eaaf100327a32a9e2e06de',
          'services/agent-service/src/agent_core/context/reference_resolution.py':'33d93ec066157096b6561c812a727adfd58d4bc3a67c206eba76de23fa3d7ab3',
          'services/agent-service/src/agent_core/context/state_projection.py':'52a1bcf40b9d299804bf1562a21e420bd385a85793bfe8ab8161bb819e8707f7',
          'services/agent-service/src/agent_core/context/visible_result_refs.py':'f3d91366e6232a272b2b711b3e174efc2dc87ed81ed3d6f402dddea2e79610a3',
          'services/agent-service/src/agent_core/kernel/plan_projection_contract.py':'09cbd448ee8b9fdb2a601ca16e966a64f7da5fd4411e0ef34b677e44d84f8594',
          'services/agent-service/src/agent_core/kernel/semantic_contract.py':'08ac1c0b199b9b1347414cf2c959b12085e5162d2e96bb794e2e558915f4ee9d',
          'services/agent-service/src/agent_core/lifecycle/condition_expression.py':'102b78de9365825a765eeebbe6fb4da0ba88d9774dfeaee0b0c4896ee0be5ae1',
          'services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py':'6f95758797250a7351f3cbd920519ee969e477f308891342522ea55d99d12286',
          'services/agent-service/src/agent_core/lifecycle/goal_capability_coverage.py':'c0e5fe02acb49b272e7d83d1c558dcf0af4d1ed40c41a65f05ed7c8bf734a26d',
          'services/agent-service/src/agent_core/lifecycle/goal_granularity.py':'e625ff61002b24d8b48058db65ac62119f11df72540bccff6960207c0e5717b5',
          'services/agent-service/src/agent_core/lifecycle/goal_lifecycle.py':'7f452744f00beb18e4c97a782a43cc56e4e387970b93e6a09910af2be64caf1a',
          'services/agent-service/src/agent_core/lifecycle/goal_outputs.py':'bb96998180c8177d6317764f998e3928a3d2a39d801fc207854f5595fe861a2e',
          'services/agent-service/src/agent_core/lifecycle/goal_planning.py':'67dabee8a0eaec3bd9b8ec1cc62bfd35b62d8e5bcb04e4dfa6f3e6560a3556df',
          'services/agent-service/src/agent_core/lifecycle/pretool_execution_policy.py':'c59e5fa254e69582b576f23294860e379424eeeca6ab03d929645104439e178c',
          'services/agent-service/src/agent_core/lifecycle/pretool_planner.py':'3055619d4a72581900ce2a8cb0e9e8a622448fb8efe5f3d13d295313b644411a',
          'services/agent-service/src/agent_core/lifecycle/protocol.py':'4fe73a4cb4ea41268f561a16b158f8ca49171afbf798ab19f573fbc384ba3e30',
          'services/agent-service/src/agent_core/lifecycle/semantic_contract.py':'f5c7beb454b705ccd44d4b0fc5f3003ea8036638fdace79a927899dc5cf80b58',
          'services/agent-service/src/agent_core/lifecycle/workflow_runtime.py':'ebb42db27082e44381dd26f9b1fc365a25f76b92b08b612c130bc8637f93dfa7',
          'services/agent-service/src/agent_core/runtime/capability_effects.py':'b480f2adaedab9b0c75031ed4561004a190f181bdabcc7c9534f2bdbd1581ce6',
          'services/agent-service/src/agent_core/runtime/capability_gate.py':'302957b5137a330739ebd1b960af71e33db323d23ab086cb0c7c5584e86efc4c',
          'services/agent-service/tests/architecture/test_production_security_contract.py':'14f71a8b8d833ca54e07188832a7a3ebef9bb66064e2f313a66560465a365865',
          'services/agent-service/tests/context/test_reference_resolution_contract.py':'845b253e1c1411518f63d712919ba8dd3430489fae1c151ec52a9c5c88badf2c',
          'services/agent-service/tests/runtime/test_global_goal_capability_coverage.py':'b975ced41e01886148fcfba2e61104ec4bc39984d369c283fc403342743f9ea0',
          'services/agent-service/tests/runtime/test_goal_granularity_and_conditions.py':'c73a85f2b21b88e8e771e9f2cbe2cb6fffe60a60be5d93e6b85c4ee9f9a4efa5',
          'services/agent-service/tests/runtime/test_pretool_execution_policy.py':'5695f4e7a128e8f588ad77a2bc130fab77821a33f4165bb8487899401141d3d3',
          'services/agent-service/tests/runtime/test_semantic_reference_binding.py':'32f2cc6081f92c406f9d012da65dfe7ed596a79a4e1629f97ce29eeaaed25533',
          'services/agent-service/tests/runtime/test_stage4_goal_output_refs.py':'d442fd4d03f67e0272cc7d1b4308195e36986944a31193b5b51c5c1065d01f38',
          }
          rows=[]
          for raw in sorted(Path('/tmp/actual30.txt').read_text().splitlines()):
              digest=hashlib.sha256(Path(raw).read_bytes()).hexdigest()
              if digest != manifest[raw]:
                  raise SystemExit(f'SHA mismatch {raw}: {digest} != {manifest[raw]}')
              rows.append({'path':raw,'sha256':digest})
          Path('../candidate30-before-tests.json').write_text(json.dumps({'base_sha':'e0e04d51e9da9790bef7bd0482584f60b8e975a9','path_count':30,'files':rows},indent=2)+'\n')
          PY

      - name: Install locked Agent dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd exact/services/agent-service
          uv sync --locked --all-groups

      - name: Compile exact B38 changed Python surface
        shell: bash
        run: |
          set -euo pipefail
          python3 -m compileall -q exact/services/agent-service/src/agent_core exact/services/agent-service/tests
          find exact/services/agent-service/src/agent_core exact/services/agent-service/tests -type d -name __pycache__ -prune -exec rm -rf {} +

      - name: Run focused B38 regression
        shell: bash
        run: |
          set -euo pipefail
          cd exact
          export APP_PROFILE=local
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH="$PWD/services/agent-service/src"
          PY=services/agent-service/.venv/bin/python
          "$PY" -m pytest -q \
            services/agent-service/tests/context/test_reference_resolution_contract.py \
            services/agent-service/tests/runtime/test_goal_granularity_and_conditions.py \
            services/agent-service/tests/runtime/test_global_goal_capability_coverage.py \
            services/agent-service/tests/runtime/test_pretool_execution_policy.py \
            services/agent-service/tests/runtime/test_semantic_reference_binding.py \
            services/agent-service/tests/runtime/test_stage4_goal_output_refs.py \
            services/agent-service/tests/architecture/test_production_security_contract.py \
            services/agent-service/tests/architecture/test_lifecycle_runtime_dependency_boundary_scc.py \
            | tee ../focused-regression.txt

      - name: Run architecture SCC regression
        shell: bash
        run: |
          set -euo pipefail
          cd exact
          export APP_PROFILE=local
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH="$PWD/services/agent-service/src"
          PY=services/agent-service/.venv/bin/python
          "$PY" -m pytest -q \
            services/agent-service/tests/architecture/test_*_boundary_scc.py \
            skill-system/tests/test_architecture_cycle_debt.py \
            | tee ../architecture-scc.txt

      - name: Run architecture convergence
        shell: bash
        run: |
          set -euo pipefail
          cd exact
          export PYTHONDONTWRITEBYTECODE=1
          services/agent-service/.venv/bin/python -B architecture-skill/scripts/verify_convergence.py \
            --workspace-root "$PWD" \
            --policy governance/architecture-policy.json \
            | tee ../architecture-convergence.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('../architecture-convergence.json').read_text())
          assert d['status']=='PASS', d
          assert d['architecture_status']=='PASS', d
          assert d['architecture_debt_status']=='RESOLVED', d
          assert d['checks']['dependency_cycle_debt']['current_cycles']==[], d
          assert d['checks']['illegal_core_module_imports']==[], d
          PY

      - name: Build Stage 5G4 C3C evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          candidate=json.loads(Path('candidate30-before-tests.json').read_text())
          focused=Path('focused-regression.txt').read_text()
          scc=Path('architecture-scc.txt').read_text()
          arch=json.loads(Path('architecture-convergence.json').read_text())
          def summary(text):
              lines=[x.strip() for x in text.splitlines() if x.strip()]
              return lines[-1] if lines else ''
          out={
            'schema_version':1,
            'stage':'5G4-C3C',
            'base_sha':'e0e04d51e9da9790bef7bd0482584f60b8e975a9',
            'candidate_path_count':candidate['path_count'],
            'candidate_files':candidate['files'],
            'toolchain':{
              'python':subprocess.check_output(['python3','--version'],text=True).strip(),
              'uv':subprocess.check_output(['uv','--version'],text=True).strip(),
              'node':subprocess.check_output(['node','--version'],text=True).strip(),
              'npm':subprocess.check_output(['npm','--version'],text=True).strip(),
            },
            'focused_regression':summary(focused),
            'architecture_scc':summary(scc),
            'architecture_status':arch['architecture_status'],
            'architecture_debt_status':arch['architecture_debt_status'],
            'current_cycles':arch['checks']['dependency_cycle_debt']['current_cycles'],
            'illegal_core_module_imports':arch['checks']['illegal_core_module_imports'],
            'canonical_b38_pushed':False,
            'formal_product_baseline_recorded':False,
            'contract_begin_run':False,
            'production_closed':False,
          }
          Path('STAGE5G4_C3C_RESULT.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Upload Stage 5G4 C3C evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage5g4-c3c-exact-30path-focused-regression
          path: |
            STAGE5G4_C3C_RESULT.json
            candidate30-before-tests.json
            focused-regression.txt
            architecture-scc.txt
            architecture-convergence.json
          if-no-files-found: error
          retention-days: 7
