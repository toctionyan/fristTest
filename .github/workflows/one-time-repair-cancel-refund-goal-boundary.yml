name: one-time-repair-cancel-refund-goal-boundary

"on":
  push:
    branches:
      - agent/fix-cancel-refund-goal-boundary
    paths:
      - .github/workflows/one-time-repair-cancel-refund-goal-boundary.yml

permissions:
  contents: write
  issues: write

concurrency:
  group: one-time-repair-cancel-refund-goal-boundary
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/fix-cancel-refund-goal-boundary
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Apply exact semantic catalog repair
        run: |
          python -B scripts/repair_cancel_refund_goal_boundary.py
          python -m json.tool services/agent-service/tests/context/strong_context_cases/semantic_goal_coverage_suite_v20_4.json >/dev/null
          git diff --check
          git diff --exit-code -- scripts/repair_cancel_refund_goal_boundary.py || true
          test -n "$(git status --porcelain services/agent-service/tests/context/strong_context_cases/semantic_goal_coverage_suite_v20_4.json)"
      - name: Commit repaired catalog
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/agent-service/tests/context/strong_context_cases/semantic_goal_coverage_suite_v20_4.json
          git commit -m "Correct cancel and refund business goal boundary"
          git push origin HEAD:agent/fix-cancel-refund-goal-boundary
      - name: Record bounded repair result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 33 --body "cancel-refund-goal-boundary-repair:${GITHUB_RUN_ID}

Outcome: ${{ job.status }}
Branch: agent/fix-cancel-refund-goal-boundary
Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
