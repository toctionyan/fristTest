name: stage5g4-final-b39-baseline-refresh

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: read

jobs:
  refresh-b39-product-baseline:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'stage5g4-final-b39-baseline-refresh'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CANONICAL_BRANCH: agent/b38-context-reference-goal-coverage-canonical-20260808
      CANONICAL_SOURCE_HEAD: 8d057f0c9032f2b8068ce3be07074c779ada2de3
      PLAN_PATH: services/agent-service/src/agent_core/lifecycle/plan_execution.py
      TEST_PATH: services/agent-service/tests/runtime/test_plan_run_runtime_field_isolation.py
      PLAN_SHA256: 86d2b2adcf2770c7caa7502864dd2d2fdd31341c0054e2105a1f80a1e4b316d4
      TEST_SHA256: d5e3a015767842d73f82da3ebaaf4122a64b5fc33a41f77a0226c5bb471074b4
    steps:
      - name: Checkout exact canonical B39 source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANONICAL_SOURCE_HEAD }}
          path: candidate
          fetch-depth: 1
          persist-credentials: true

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Verify canonical authority and install locked validation environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANONICAL_SOURCE_HEAD"
          REMOTE="$(git -C candidate ls-remote origin refs/heads/$CANONICAL_BRANCH | awk '{print $1}')"
          test "$REMOTE" = "$CANONICAL_SOURCE_HEAD"
          test "$(sha256sum "candidate/$PLAN_PATH" | cut -d' ' -f1)" = "$PLAN_SHA256"
          test "$(sha256sum "candidate/$TEST_PATH" | cut -d' ' -f1)" = "$TEST_SHA256"
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r candidate/deployment/ci/uv-requirements-linux-x86_64.txt
          cd candidate/services/agent-service
          uv sync --locked --all-groups

      - name: Regenerate only the historical protected-source baseline
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B - <<'PY'
          from __future__ import annotations
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('candidate').resolve()
          baseline_path = root / 'skill-system/registry/product-source-baseline.json'
          baseline = json.loads(baseline_path.read_text(encoding='utf-8'))
          protected_roots = tuple(str(x) for x in baseline['protected_roots'])
          ignored = {'.venv', '.pytest_cache', 'node_modules', '__pycache__'}
          current = {}
          for name in protected_roots:
              base = root / name
              if not base.exists():
                  continue
              for path in sorted(item for item in base.rglob('*') if item.is_file()):
                  if any(part in ignored for part in path.parts):
                      continue
                  current[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()

          old = {str(k): str(v) for k, v in baseline['files'].items()}
          changed = {path for path in set(current) | set(old) if current.get(path) != old.get(path)}
          expected = {os.environ['PLAN_PATH'], os.environ['TEST_PATH']}
          if changed != expected:
              raise SystemExit('unexpected_product_source_delta:' + ','.join(sorted(changed ^ expected)))
          if len(old) != 555:
              raise SystemExit(f'unexpected_old_baseline_count:{len(old)}')
          if len(current) != 556:
              raise SystemExit(f'unexpected_new_baseline_count:{len(current)}')
          expected_hashes = {
              os.environ['PLAN_PATH']: os.environ['PLAN_SHA256'],
              os.environ['TEST_PATH']: os.environ['TEST_SHA256'],
          }
          bad = {
              path: {'expected': digest, 'actual': current.get(path)}
              for path, digest in expected_hashes.items()
              if current.get(path) != digest
          }
          if bad:
              raise SystemExit('approved_hash_mismatch:' + json.dumps(bad, sort_keys=True))

          prior_release = baseline.get('source_release_sha256')
          baseline['generated_from'] = 'git:' + os.environ['CANONICAL_SOURCE_HEAD']
          baseline['generated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          baseline['file_count'] = len(current)
          baseline['files'] = dict(sorted(current.items()))
          baseline_path.write_text(json.dumps(baseline, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          result = {
              'schema_version': 1,
              'status': 'B39_BASELINE_REFRESH_GENERATED',
              'canonical_source_head': os.environ['CANONICAL_SOURCE_HEAD'],
              'old_file_count': len(old),
              'new_file_count': len(current),
              'approved_paths': sorted(expected),
              'approved_hashes': expected_hashes,
              'prior_source_release_sha256_preserved': prior_release,
              'baseline_sha256': hashlib.sha256(baseline_path.read_bytes()).hexdigest(),
          }
          Path('b39-baseline-refresh-report.json').write_text(json.dumps(result, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Validate refreshed baseline and full Skill control plane
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          services/agent-service/.venv/bin/python -B skill-system/controller/project_compatibility.py \
            | tee ../b39-project-compatibility-after-refresh.json
          services/agent-service/.venv/bin/python -B skill-system/controller/profile_runner.py skill-control-plane \
            | tee ../b39-skill-control-plane-after-refresh.json

      - name: Publish exact one-file B39 baseline promotion
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          git clean -fdX
          find . -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          test "$(git rev-parse HEAD)" = "$CANONICAL_SOURCE_HEAD"
          printf '%s\n' 'skill-system/registry/product-source-baseline.json' > /tmp/expected.txt
          git diff --name-only "$CANONICAL_SOURCE_HEAD" -- | sort > /tmp/actual.txt
          diff -u /tmp/expected.txt /tmp/actual.txt
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m 'Promote B39 protected product-source baseline'
          BASELINE_HEAD="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^)" = "$CANONICAL_SOURCE_HEAD"
          git push --force-with-lease=refs/heads/${CANONICAL_BRANCH}:${CANONICAL_SOURCE_HEAD} \
            origin HEAD:${CANONICAL_BRANCH}
          echo "$BASELINE_HEAD" > ../b39-baseline-promotion-head.txt

      - name: Upload B39 baseline promotion evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage5g4-final-b39-baseline-promotion
          path: |
            b39-baseline-refresh-report.json
            b39-project-compatibility-after-refresh.json
            b39-skill-control-plane-after-refresh.json
            b39-baseline-promotion-head.txt
          if-no-files-found: error
          retention-days: 90
