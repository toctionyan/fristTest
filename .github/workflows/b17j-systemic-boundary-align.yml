name: B17j Systemic Boundary Alignment

on:
  push:
    branches:
      - agent/fix-integration-real-model-boundary
    paths:
      - scripts/b17j_align_systemic_real_model_boundary.py
      - .github/workflows/b17j-systemic-boundary-align.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Align stale systemic assertion
        id: align
        shell: bash
        run: |
          if [ ! -f scripts/b17j_align_systemic_real_model_boundary.py ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          "${pythonLocation}/bin/python" -B scripts/b17j_align_systemic_real_model_boundary.py
          echo "applied=true" >> "$GITHUB_OUTPUT"
      - name: Commit exact aligned tree
        if: steps.align.outputs.applied == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agent-service/tests/architecture/test_systemic_operational_closure.py \
                  PHASE_CANDIDATE_MANIFEST.json \
                  scripts/b17j_align_systemic_real_model_boundary.py
          git diff --cached --check
          git commit -m "Align systemic real-model boundary assertion"
          git push origin HEAD:${{ github.ref_name }}
