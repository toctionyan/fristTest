name: Publish final B34 resilient task harness

on:
  push:
    branches:
      - agent/b34-final-publisher-20260804
    paths:
      - candidate-validation/b34-final-publisher/**
      - .github/workflows/publish-b34-final-resilient-task-harness.yml
  pull_request:
    branches:
      - agent/b33-full-source-20260804
    paths:
      - candidate-validation/b34-final-publisher/**
      - .github/workflows/publish-b34-final-resilient-task-harness.yml

permissions:
  contents: write

concurrency:
  group: publish-final-b34
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 5b8e9d71c596fefdc59766bc47773f750549e952
      EXPECTED_TARGET_SHA: 5b8e9d71c596fefdc59766bc47773f750549e952
      TARGET_BRANCH: agent/b34-resilient-task-harness-final-20260804
      OVERLAY_SHA: a4c771dc9ed99faa806d859c5017bb7dc5065d2417fe15ce99a0b6fd0a1663ff
      CORRECTION_SHA: 9c6d1d5f53681361fdf42ab47c88a48f0c6403c9b86f6204ca69c4a0129655da
      FINAL_MANIFEST_SHA: 4af6b4a95cf67099c1d69e388e3d83e8a12ab919e0d55c082850e22901749472
      BASELINE_SHA: 36829d99f2b4738823b41e1a866baaa50c30fa27d1e28ddb2b532f64ae2bc5dd
      LEDGER_SHA: 17c009b9e67f8f3e61e8f77bd161747ddbedbf47ee81b3dd4625254d531dd958
      ENV_EVIDENCE_SHA: 7964116c3e1cd01951389e3bbb2db9d4ac4585a3cedbe2f22b5c592d9098adfb
      REL_EVIDENCE_SHA: 664f54f8477846f7ad15a362595e68d2e920b55cbddf330adc0ed1b64718b134

    steps:
      - name: Checkout immutable publisher payload
        uses: actions/checkout@v4
        with:
          ref: agent/b34-final-publisher-20260804
          fetch-depth: 0

      - name: Authenticate base and correction overlays
        run: |
          set -euo pipefail
          cat candidate-validation/b34-final-publisher/part-*.b64 > /tmp/b34-overlay.tar.xz.b64
          base64 --decode /tmp/b34-overlay.tar.xz.b64 > /tmp/b34-overlay.tar.xz
          echo "${OVERLAY_SHA}  /tmp/b34-overlay.tar.xz" | sha256sum --check --strict
          xz --test /tmp/b34-overlay.tar.xz

          cat candidate-validation/b34-final-publisher/correction-part-*.b64 > /tmp/b34-correction.tar.xz.b64
          base64 --decode /tmp/b34-correction.tar.xz.b64 > /tmp/b34-correction.tar.xz
          echo "${CORRECTION_SHA}  /tmp/b34-correction.tar.xz" | sha256sum --check --strict
          xz --test /tmp/b34-correction.tar.xz

      - id: authority
        name: Enforce clean target authority
        run: |
          set -euo pipefail
          git fetch origin "${TARGET_BRANCH}" --no-tags
          target_sha="$(git rev-parse FETCH_HEAD)"
          echo "target_sha=${target_sha}" >> "${GITHUB_OUTPUT}"

          if [[ "${target_sha}" == "${EXPECTED_TARGET_SHA}" ]]; then
            echo "mode=publish" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          rm -rf /tmp/b34-existing
          git worktree add --detach /tmp/b34-existing "${target_sha}"
          if [[ -f /tmp/b34-existing/B34_RESILIENT_TASK_HARNESS_MANIFEST.json ]]; then
            actual="$(sha256sum /tmp/b34-existing/B34_RESILIENT_TASK_HARNESS_MANIFEST.json | awk '{print $1}')"
            if [[ "${actual}" == "${FINAL_MANIFEST_SHA}" ]]; then
              echo "B34 final source is already published at ${target_sha}."
              echo "mode=already-published" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi

          echo "Refusing to overwrite ${TARGET_BRANCH}: expected clean base ${EXPECTED_TARGET_SHA} or authenticated final B34, got ${target_sha}." >&2
          exit 1

      - name: Materialize and verify final B34
        if: steps.authority.outputs.mode == 'publish'
        run: |
          set -euo pipefail
          rm -rf /tmp/b34-final
          git worktree add --detach /tmp/b34-final "${BASE_SHA}"
          tar -xJf /tmp/b34-overlay.tar.xz -C /tmp/b34-final
          tar -xJf /tmp/b34-correction.tar.xz -C /tmp/b34-final
          cd /tmp/b34-final

          echo "${FINAL_MANIFEST_SHA}  B34_RESILIENT_TASK_HARNESS_MANIFEST.json" | sha256sum --check --strict
          echo "${BASELINE_SHA}  skill-system/registry/product-source-baseline.json" | sha256sum --check --strict
          echo "${LEDGER_SHA}  governance/task-ledger.json" | sha256sum --check --strict
          echo "${ENV_EVIDENCE_SHA}  governance/repair-cases/repair-v20.17-b22-transaction-identity-closure/evidence/blocked-by-environment.json" | sha256sum --check --strict
          echo "${REL_EVIDENCE_SHA}  governance/repair-cases/repair-v20.17-b34-resilient-task-harness/evidence/issue-rel-001-oracle-current.json" | sha256sum --check --strict

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          root = Path('.')
          manifest = json.loads((root / 'B34_RESILIENT_TASK_HARNESS_MANIFEST.json').read_text(encoding='utf-8'))
          assert manifest['changed_file_count'] == 34, manifest['changed_file_count']
          files = manifest['files']
          assert len(files) == 34, len(files)
          for relative_path, record in sorted(files.items()):
              path = root / relative_path
              assert path.is_file(), relative_path
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == record['sha256'], (relative_path, actual, record['sha256'])
          print('B34 manifest verification: 34/34 PASS')
          PY

          python scripts/verify_task_ledger.py
          python skill-system/controller/project_compatibility.py
          python -m compileall -q \
            scripts/repair_loop.py \
            scripts/verify_b34_resilient_task_harness.py \
            skill-system/controller/task_run.py \
            skill-system/controller/task_run_cli.py

      - id: publish
        name: Commit and publish direct B34 source branch
        if: steps.authority.outputs.mode == 'publish'
        run: |
          set -euo pipefail
          cd /tmp/b34-final
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          count="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          if [[ "${count}" != "39" ]]; then
            echo "Expected 39 B34 publication paths, got ${count}." >&2
            git diff --cached --name-only >&2
            exit 1
          fi
          git commit -m 'Publish final B34 resilient task harness'
          published_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/${TARGET_BRANCH}" \
            --force-with-lease="${TARGET_BRANCH}:${EXPECTED_TARGET_SHA}"
          echo "published_sha=${published_sha}" >> "${GITHUB_OUTPUT}"

      - name: Record publication result
        if: always()
        run: |
          {
            echo '## Final B34 publication'
            echo "- mode: ${{ steps.authority.outputs.mode }}"
            echo "- previous target: ${{ steps.authority.outputs.target_sha }}"
            echo "- published commit: ${{ steps.publish.outputs.published_sha }}"
            echo "- target branch: ${TARGET_BRANCH}"
          } >> "${GITHUB_STEP_SUMMARY}"
