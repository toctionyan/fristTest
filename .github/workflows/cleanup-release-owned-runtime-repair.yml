name: Cleanup Release Owned Runtime Repair

"on":
  pull_request:
    branches:
      - main
    paths:
      - scripts/cleanup_release_owned_runtime_repair.py
      - .github/workflows/cleanup-release-owned-runtime-repair.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Restore exact managed source set
        run: "${pythonLocation}/bin/python -B scripts/cleanup_release_owned_runtime_repair.py"
      - name: Commit clean repaired tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clean generated bytecode and restore owned-runtime contracts"
          git push origin HEAD:${{ github.head_ref }}
