name: stage5g4-c3h-a7-a6-successor-b38-green

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  successor-b38-green:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout runner head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner
          fetch-depth: 1

      - name: Checkout fresh exact B36 formal source
        uses: actions/checkout@v4
        with:
          ref: e0e04d51e9da9790bef7bd0482584f60b8e975a9
          path: source
          fetch-depth: 1

      - name: Checkout verified replan Controller
        uses: actions/checkout@v4
        with:
          ref: 252c2267508d4d31290af4e9e00fef60acaea698
          path: control
          fetch-depth: 1

      - name: Pin Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Install exact policy interpreter environment
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check 'uv==0.11.29'
          test "$(python3 --version)" = "Python 3.12.13"
          test "$(uv --version | awk '{print $2}')" = "0.11.29"
          uv sync --project control/services/agent-service --locked --all-groups --python 3.12.13
          test -x control/services/agent-service/.venv/bin/python
          test "$(control/services/agent-service/.venv/bin/python --version)" = "Python 3.12.13"

      - name: Restore successor governance and frozen B38 candidate authority
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "e0e04d51e9da9790bef7bd0482584f60b8e975a9"
          test "$(git -C control rev-parse HEAD)" = "252c2267508d4d31290af4e9e00fef60acaea698"

          gh api /repos/toctionyan/fristTest/actions/artifacts/9017895641/zip > a7a3.zip
          test "$(sha256sum a7a3.zip | awk '{print $1}')" = "3cb1a02770801a4091ae36b098768adaa61846807dc6c5621efafd91d25c44b3"
          mkdir a7a3-download
          unzip -q a7a3.zip -d a7a3-download

          gh api /repos/toctionyan/fristTest/actions/artifacts/9018113516/zip > a7a4.zip
          test "$(sha256sum a7a4.zip | awk '{print $1}')" = "393a091b602c2d60ccc7eb7d045465839fbf174f90d20c4729c8522991ec81b2"
          mkdir a7a4-download
          unzip -q a7a4.zip -d a7a4-download

          gh api /repos/toctionyan/fristTest/actions/artifacts/9018369890/zip > a7a5.zip
          test "$(sha256sum a7a5.zip | awk '{print $1}')" = "7ea1ef13e4153d4555266aeddb6a9d53a936aa2e2ab3ec3f17007365d06324fc"
          mkdir a7a5-download
          unzip -q a7a5.zip -d a7a5-download

          gh api /repos/toctionyan/fristTest/actions/artifacts/9016338327/zip > b38.zip
          test "$(sha256sum b38.zip | awk '{print $1}')" = "ad12a58481c1705f6f79a7bafc765a6a307e29f6b91fd05b1dcd1b0f315039f8"
          mkdir b38-download
          unzip -q b38.zip -d b38-download

          successor="migration-v20.17-b38-context-reference-goal-coverage-r1"
          mkdir -p source/governance/architecture-decisions source/governance/repair-cases/"$successor"
          cp -a a7a3-download/governance/change-history source/governance/
          cp a7a5-download/active-change.json source/governance/active-change.json
          cp a7a5-download/architecture-decisions/"$successor".json source/governance/architecture-decisions/"$successor".json
          cp -a a7a5-download/repair-cases/"$successor"/. source/governance/repair-cases/"$successor"/

          input="source/.quality/stage5g4-c3h-a7-a4-successor-input"
          mkdir -p "$input/oracle"
          cp a7a4-download/CORRECTED_TARGET.md "$input/target.md"
          cp a7a4-download/SUCCESSOR_CLAIM.json "$input/claim.json"
          cp a7a4-download/FOCUSED_POLICY.json "$input/focused-policy.json"
          cp a7a4-download/ORACLE_MANIFEST.json "$input/oracle/manifest.json"
          cp a7a4-download/ORACLE_OVERLAY.zip "$input/oracle/overlay.zip"
          cp a7a4-download/CANDIDATE30_MANIFEST.json "$input/candidate30-manifest.json"
          cp a7a4-download/CANDIDATE_NEW_ABSTRACTION_RECORD.md "$input/candidate-new-abstraction-record.md"

          baseline="source/.quality/product-code/$successor/baseline"
          mkdir -p "$baseline/steps"
          cp a7a5-download/formal-red/run-summary.json "$baseline/run-summary.json"
          cp a7a5-download/formal-red/baseline-record.json "$baseline/baseline-record.json"
          cp a7a5-download/formal-red/preferred-red-proof.stdout.txt "$baseline/steps/preferred-red-proof.stdout.txt"

          test "$(sha256sum "$input/target.md" | awk '{print $1}')" = "aff372809b92e43ff1292744969aa3a6f9c3b150eb7cedc4ace25caa48584801"
          test "$(sha256sum "$input/claim.json" | awk '{print $1}')" = "33de1dee1dfd74f08a8cb89309a734217660ab890ace1b0a99643114c644580e"
          test "$(sha256sum "$input/focused-policy.json" | awk '{print $1}')" = "ca5ce92e4f93d4c411da7d07abfdf5e49f8955aa3af117acfa2f9acdeb695914"
          test "$(sha256sum "$input/oracle/manifest.json" | awk '{print $1}')" = "3eba94de3750b79d8bdec94b6d7342491082b5558eee650be6abf942afb9b4fa"
          test "$(sha256sum "$input/oracle/overlay.zip" | awk '{print $1}')" = "ac86e73820716bdf2a995ffe9fc2813b42cbbda741932a14e10597fe11d72da6"

      - name: Execute successor Contract begin
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p a7a6-evidence/g0 a7a6-evidence/g1 a7a6-evidence/g2 a7a6-evidence/g3 a7a6-evidence/g4 a7a6-evidence/g5
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root=Path("source")
          successor="migration-v20.17-b38-context-reference-goal-coverage-r1"
          active=root/"governance/active-change.json"
          c=json.loads(active.read_text())
          assert c["change_id"]==successor
          assert c["status"]=="approved"
          assert c["result"]=="PENDING"
          assert c["baseline_evidence"]==f".quality/product-code/{successor}/baseline"
          assert c["repair_governance"]==f"governance/repair-cases/{successor}"
          assert c["decision_record"]==f"governance/architecture-decisions/{successor}.json"
          assert c["verification"] is None
          assert c.get("repair_governance_consumed_at") is None
          permit=root/f"governance/repair-cases/{successor}/change-permit.json"
          p=json.loads(permit.read_text())
          assert p["permit_digest"]=="84266f85f4ffb8735fb3fe4dc941fefe050238513cece269c849f2b61b23dadd"
          assert p["status"]=="ACTIVE"
          summary=json.loads((root/c["baseline_evidence"]/"run-summary.json").read_text())
          assert summary["decision"]=="FAIL"
          assert summary["loop_status"]=="BASELINE_RECORDED"
          assert summary["target_identity"]["id"]==successor
          out={
            "gate":"G0.PRE_BEGIN_INPUT_INTEGRITY","status":"PASS",
            "active_contract_sha256":hashlib.sha256(active.read_bytes()).hexdigest(),
            "permit_digest":p["permit_digest"],
            "formal_red_decision":"FAIL",
            "formal_red_claim_id":"B1.PREFERRED.RED",
          }
          Path("a7a6-evidence/g0/pre-begin.json").write_text(json.dumps(out,indent=2)+"\n")
          PY

          (
            cd source
            python -B ../control/skill-system/controller/change_contract_cli.py begin
          ) > a7a6-evidence/g0/begin.stdout.txt 2> a7a6-evidence/g0/begin.stderr.txt

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          active=Path("source/governance/active-change.json")
          c=json.loads(active.read_text())
          assert c["status"]=="implementing"
          assert c["result"]=="PENDING"
          assert c["repair_governance_permit_digest"]=="84266f85f4ffb8735fb3fe4dc941fefe050238513cece269c849f2b61b23dadd"
          assert c.get("repair_governance_consumed_at") is None
          assert c["verification"] is None
          out={
            "gate":"G0.CONTRACT_BEGIN","status":"PASS",
            "active_contract_sha256":hashlib.sha256(active.read_bytes()).hexdigest(),
            "contract_status":c["status"],
            "permit_digest":c["repair_governance_permit_digest"],
          }
          Path("a7a6-evidence/g0/post-begin.json").write_text(json.dumps(out,indent=2)+"\n")
          PY

      - name: Install frozen B38 30-file candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, shutil, subprocess
          from pathlib import Path

          root=Path("source")
          payload=Path("b38-download/root")
          manifest=json.loads(Path("b38-download/FROZEN_B38_CANDIDATE30_MANIFEST.json").read_text())
          assert manifest["exact_base_sha"]=="e0e04d51e9da9790bef7bd0482584f60b8e975a9"
          assert manifest["path_count"]==30
          expected=[r["path"] for r in manifest["files"]]
          hashes={r["path"]:r["sha256"] for r in manifest["files"]}

          for rel in expected:
              src=payload/rel
              dst=root/rel
              assert src.is_file(), rel
              dst.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(src,dst)
              digest=hashlib.sha256(dst.read_bytes()).hexdigest()
              assert digest==hashes[rel], (rel,digest,hashes[rel])

          actual=set(subprocess.check_output(["git","-C","source","diff","--name-only"],text=True).splitlines())
          untracked=subprocess.check_output(["git","-C","source","ls-files","--others","--exclude-standard"],text=True).splitlines()
          actual.update(x for x in untracked if x and not x.startswith("governance/"))
          actual=sorted(actual)
          assert actual==sorted(expected), {"missing":sorted(set(expected)-set(actual)),"extra":sorted(set(actual)-set(expected))}
          Path("a7a6-evidence/g0/candidate-install.json").write_text(json.dumps({
              "gate":"G0.CANDIDATE_INSTALL","status":"PASS",
              "candidate_path_count":30,
              "paths":[{"path":r,"sha256":hashes[r]} for r in expected],
          },indent=2)+"\n")
          PY

          find source/governance -type f -print0 | sort -z | xargs -0 sha256sum > a7a6-evidence/g0/governance-after-install.sha256
          find source/.quality -type f -print0 | sort -z | xargs -0 sha256sum > a7a6-evidence/g0/quality-after-install.sha256

      - name: G1 SAME_POLICY RED to GREEN
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, subprocess, zipfile
          from pathlib import Path

          root=Path("source")
          successor="migration-v20.17-b38-context-reference-goal-coverage-r1"
          input_dir=root/".quality/stage5g4-c3h-a7-a4-successor-input"
          policy_path=input_dir/"focused-policy.json"
          policy=json.loads(policy_path.read_text())
          assert hashlib.sha256(policy_path.read_bytes()).hexdigest()=="ca5ce92e4f93d4c411da7d07abfdf5e49f8955aa3af117acfa2f9acdeb695914"
          assert len(policy["steps"])==1
          step=policy["steps"][0]
          assert step["id"]=="preferred-red-proof"
          expected_argv=[
            "/home/runner/work/fristTest/fristTest/control/services/agent-service/.venv/bin/python",
            "-B","-c",step["argv"][3],
          ]
          assert step["argv"]==expected_argv
          assert step["environment"]=={
            "APP_PROFILE":"local",
            "PYTHONDONTWRITEBYTECODE":"1",
            "PYTHONPATH":"services/agent-service/src:services/agent-service",
          }

          test_rel="services/agent-service/tests/runtime/test_stage4_goal_output_refs.py"
          candidate_test=(root/test_rel).read_bytes()
          assert hashlib.sha256(candidate_test).hexdigest()=="d442fd4d03f67e0272cc7d1b4308195e36986944a31193b5b51c5c1065d01f38"
          overlay=input_dir/"oracle/overlay.zip"
          assert hashlib.sha256(overlay.read_bytes()).hexdigest()=="ac86e73820716bdf2a995ffe9fc2813b42cbbda741932a14e10597fe11d72da6"
          with zipfile.ZipFile(overlay) as zf:
              oracle_test=zf.read(test_rel)
          assert oracle_test==candidate_test

          baseline=root/f".quality/product-code/{successor}/baseline"
          summary=json.loads((baseline/"run-summary.json").read_text())
          assert summary["decision"]=="FAIL"
          assert summary["claim_results"][0]["id"]=="B1.PREFERRED.RED"
          assert summary["claim_results"][0]["status"]=="FAILED"
          red_out=(baseline/"steps/preferred-red-proof.stdout.txt").read_text()
          assert "1 failed" in red_out
          assert "prepare_refund_from_eligibility" in red_out

          evidence=Path("a7a6-evidence/g1")
          env=os.environ.copy()
          env.update(step["environment"])
          env["QUALITY_EVIDENCE_DIR"]=str((Path.cwd()/evidence).resolve())
          proc=subprocess.run(
              step["argv"], cwd="source", env=env, text=True,
              capture_output=True, timeout=step["timeout_seconds"],
          )
          (evidence/"preferred-red-proof.stdout.txt").write_text(proc.stdout)
          (evidence/"preferred-red-proof.stderr.txt").write_text(proc.stderr)
          (evidence/"preferred-red-proof.exit-code.txt").write_text(str(proc.returncode)+"\n")
          result={
              "gate":"G1.SAME_POLICY_RED_TO_GREEN","status":"PASS" if proc.returncode==0 else "FAIL",
              "claim_id":"B1.PREFERRED.RED",
              "selector":"services/agent-service/tests/runtime/test_stage4_goal_output_refs.py::test_dependency_goal_output_is_not_reused_across_different_explicit_targets",
              "baseline_status":"FAIL",
              "candidate_status":"PASS" if proc.returncode==0 else "FAIL",
              "same_oracle_test_bytes":True,
              "policy_sha256":hashlib.sha256(policy_path.read_bytes()).hexdigest(),
              "oracle_overlay_sha256":hashlib.sha256(overlay.read_bytes()).hexdigest(),
              "exit_code":proc.returncode,
          }
          (evidence/"transition.json").write_text(json.dumps(result,indent=2)+"\n")
          assert proc.returncode==0, result
          assert "1 passed" in proc.stdout, proc.stdout
          PY

      - name: G2 COUNTEREXAMPLES
        shell: bash
        run: |
          set -euo pipefail
          cd source
          export APP_PROFILE=local
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH="$PWD/services/agent-service/src:$PWD/services/agent-service"
          PY="$GITHUB_WORKSPACE/control/services/agent-service/.venv/bin/python"
          "$PY" -B -m pytest -q \
            services/agent-service/tests/runtime/test_stage4_goal_output_refs.py::test_multi_goal_completion_recording_rejects_different_explicit_targets \
            services/agent-service/tests/runtime/test_semantic_reference_binding.py \
            services/agent-service/tests/context/test_reference_resolution_contract.py \
            --junitxml="$GITHUB_WORKSPACE/a7a6-evidence/g2/counterexamples.xml" \
            | tee "$GITHUB_WORKSPACE/a7a6-evidence/g2/counterexamples.stdout.txt"

      - name: G3 REGRESSION
        shell: bash
        run: |
          set -euo pipefail
          cd source
          export APP_PROFILE=local
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH="$PWD/services/agent-service/src:$PWD/services/agent-service"
          PY="$GITHUB_WORKSPACE/control/services/agent-service/.venv/bin/python"
          "$PY" -B -m pytest -q \
            services/agent-service/tests/runtime/test_pretool_execution_policy.py \
            services/agent-service/tests/runtime/test_global_goal_capability_coverage.py \
            services/agent-service/tests/runtime/test_goal_granularity_and_conditions.py \
            services/agent-service/tests/architecture/test_production_security_contract.py \
            --junitxml="$GITHUB_WORKSPACE/a7a6-evidence/g3/regression.xml" \
            | tee "$GITHUB_WORKSPACE/a7a6-evidence/g3/regression.stdout.txt"

      - name: G4 NEGATIVE PATHS
        shell: bash
        run: |
          set -euo pipefail
          cd source
          export APP_PROFILE=local
          export PYTHONDONTWRITEBYTECODE=1
          export PYTHONPATH="$PWD/services/agent-service/src:$PWD/services/agent-service"
          PY="$GITHUB_WORKSPACE/control/services/agent-service/.venv/bin/python"
          "$PY" -B -m pytest -q \
            services/agent-service/tests/runtime/test_global_goal_capability_coverage.py::test_global_coverage_rejects_shared_dispatch_for_different_explicit_targets \
            services/agent-service/tests/runtime/test_pretool_execution_policy.py::test_capability_gate_frontier_rejects_forged_cross_target_shared_binding \
            services/agent-service/tests/runtime/test_semantic_reference_binding.py::test_multi_goal_single_call_rejects_different_resolved_targets \
            services/agent-service/tests/runtime/test_global_goal_capability_coverage.py::test_global_coverage_fails_closed_when_shared_target_identity_is_unknown \
            --junitxml="$GITHUB_WORKSPACE/a7a6-evidence/g4/negative-path.xml" \
            | tee "$GITHUB_WORKSPACE/a7a6-evidence/g4/negative-path.stdout.txt"

      - name: G5 POST TEST INTEGRITY
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, subprocess
          from pathlib import Path

          root=Path("source")
          successor="migration-v20.17-b38-context-reference-goal-coverage-r1"
          manifest=json.loads(Path("b38-download/FROZEN_B38_CANDIDATE30_MANIFEST.json").read_text())
          expected=sorted(r["path"] for r in manifest["files"])
          hashes={r["path"]:r["sha256"] for r in manifest["files"]}

          actual=set(subprocess.check_output(["git","-C","source","diff","--name-only"],text=True).splitlines())
          untracked=subprocess.check_output(["git","-C","source","ls-files","--others","--exclude-standard"],text=True).splitlines()
          actual.update(x for x in untracked if x and not x.startswith("governance/"))
          actual=sorted(actual)
          assert actual==expected, {"missing":sorted(set(expected)-set(actual)),"extra":sorted(set(actual)-set(expected))}

          mismatches=[]
          for rel in expected:
              digest=hashlib.sha256((root/rel).read_bytes()).hexdigest()
              if digest!=hashes[rel]:
                  mismatches.append({"path":rel,"actual":digest,"expected":hashes[rel]})
          assert not mismatches, mismatches

          active=root/"governance/active-change.json"
          c=json.loads(active.read_text())
          assert c["change_id"]==successor
          assert c["status"]=="implementing"
          assert c["result"]=="PENDING"
          assert c["repair_governance_permit_digest"]=="84266f85f4ffb8735fb3fe4dc941fefe050238513cece269c849f2b61b23dadd"
          assert c.get("repair_governance_consumed_at") is None
          assert c["verification"] is None
          assert c["review_attestations"]==[]
          input_dir=root/".quality/stage5g4-c3h-a7-a4-successor-input"
          assert hashlib.sha256((input_dir/"target.md").read_bytes()).hexdigest()=="aff372809b92e43ff1292744969aa3a6f9c3b150eb7cedc4ace25caa48584801"
          assert hashlib.sha256((input_dir/"claim.json").read_bytes()).hexdigest()=="33de1dee1dfd74f08a8cb89309a734217660ab890ace1b0a99643114c644580e"
          assert hashlib.sha256((input_dir/"focused-policy.json").read_bytes()).hexdigest()=="ca5ce92e4f93d4c411da7d07abfdf5e49f8955aa3af117acfa2f9acdeb695914"
          assert hashlib.sha256((input_dir/"oracle/manifest.json").read_bytes()).hexdigest()=="3eba94de3750b79d8bdec94b6d7342491082b5558eee650be6abf942afb9b4fa"
          assert hashlib.sha256((input_dir/"oracle/overlay.zip").read_bytes()).hexdigest()=="ac86e73820716bdf2a995ffe9fc2813b42cbbda741932a14e10597fe11d72da6"

          Path("a7a6-evidence/g5/post-test-integrity.json").write_text(json.dumps({
              "gate":"G5.POST_TEST_INTEGRITY","status":"PASS",
              "candidate_path_count":30,
              "candidate_sha_mismatches":mismatches,
              "active_contract_sha256":hashlib.sha256(active.read_bytes()).hexdigest(),
              "contract_status":c["status"],
              "permit_digest":c["repair_governance_permit_digest"],
              "contract_verify_run":False,
              "contract_close_run":False,
              "canonical_b38_pushed":False,
              "production_closed":False,
          },indent=2)+"\n")
          PY

          find source/governance -type f -print0 | sort -z | xargs -0 sha256sum > a7a6-evidence/g5/governance-after-tests.sha256
          find source/.quality -type f -print0 | sort -z | xargs -0 sha256sum > a7a6-evidence/g5/quality-after-tests.sha256
          diff -u a7a6-evidence/g0/governance-after-install.sha256 a7a6-evidence/g5/governance-after-tests.sha256
          diff -u a7a6-evidence/g0/quality-after-install.sha256 a7a6-evidence/g5/quality-after-tests.sha256
          git -C control diff --quiet
          test "$(git -C control rev-parse HEAD)" = "252c2267508d4d31290af4e9e00fef60acaea698"

      - name: Build A7-A6 authoritative evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          g0=json.loads(Path("a7a6-evidence/g0/post-begin.json").read_text())
          install=json.loads(Path("a7a6-evidence/g0/candidate-install.json").read_text())
          g1=json.loads(Path("a7a6-evidence/g1/transition.json").read_text())
          g5=json.loads(Path("a7a6-evidence/g5/post-test-integrity.json").read_text())
          active=Path("source/governance/active-change.json")
          report={
              "schema_version":1,
              "stage":"5G4-C3H-A7-A6",
              "verdict":"SUCCESSOR_BEGIN_B38_INSTALL_AND_SAME_POLICY_GREEN_PASS",
              "source_head":"e0e04d51e9da9790bef7bd0482584f60b8e975a9",
              "controller_head":"252c2267508d4d31290af4e9e00fef60acaea698",
              "successor_change_id":"migration-v20.17-b38-context-reference-goal-coverage-r1",
              "successor_permit_digest":"84266f85f4ffb8735fb3fe4dc941fefe050238513cece269c849f2b61b23dadd",
              "b38_install_artifact_id":9016338327,
              "b38_install_artifact_digest":"sha256:ad12a58481c1705f6f79a7bafc765a6a307e29f6b91fd05b1dcd1b0f315039f8",
              "candidate_path_count":install["candidate_path_count"],
              "claim_id":"B1.PREFERRED.RED",
              "selector":g1["selector"],
              "baseline_status":"FAIL",
              "candidate_status":"PASS",
              "same_oracle_test_bytes":g1["same_oracle_test_bytes"],
              "policy_sha256":g1["policy_sha256"],
              "oracle_overlay_sha256":g1["oracle_overlay_sha256"],
              "gates":{
                "G0.CONTRACT_BEGIN":"PASS",
                "G0.CANDIDATE_INSTALL":"PASS",
