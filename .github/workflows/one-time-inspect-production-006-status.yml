name: one-time-inspect-production-006-status

"on":
  push:
    branches:
      - agent/inspect-production-006-status

permissions:
  actions: read
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_MAIN_SHA: ac1202501308d040d3047e1a3ec49e7b80b45dda
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Read request and production workflow status
        run: python -B .github/scripts/inspect_production_006_status.py
      - name: Remove inspector and commit sanitized status
        shell: bash
        run: |
          rm -f .github/scripts/inspect_production_006_status.py
          rm -f .github/workflows/one-time-inspect-production-006-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record production certification 006 status"
          git push origin HEAD:${GITHUB_REF_NAME}
