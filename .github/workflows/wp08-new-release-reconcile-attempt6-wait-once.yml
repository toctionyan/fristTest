name: wp08-new-release-reconcile-attempt6-wait-once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-new-release-reconcile-attempt6-wait-once-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      EXPECTED_MAIN_SHA: ff973cb1b6d6089953ab842683351ed1ab5772a8
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact authoritative main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Wait for exact-main Quality and reconcile through official controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          for attempt in $(seq 1 60); do
            python -B scripts/wp08_release_recovery.py --mode reconcile
            python - <<'PY' && exit 0 || true
          import json
          import os
          from urllib import request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          expected_sha = os.environ['EXPECTED_MAIN_SHA']
          req = request.Request(
              f'https://api.github.com/repos/{repo}/issues/293',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with request.urlopen(req, timeout=30) as response:
              issue = json.load(response)
          body = str(issue.get('body') or '')
          left_wait = (
              f'"current_candidate_sha": "{expected_sha}"' in body
              and any(
                  state in body
                  for state in (
                      '"status": "CERTIFYING"',
                      '"status": "WP08_PASS"',
                      '"status": "FAILED_NEEDS_CLASSIFICATION"',
                      '"status": "MAIN_QUALITY_FAILED"',
                      '"status": "ATTEMPT_BUDGET_EXHAUSTED"',
                  )
              )
          )
          if left_wait and '"status": "CERTIFYING"' in body and '"attempt": 6' not in body:
              raise SystemExit(1)
          raise SystemExit(0 if left_wait else 1)
          PY
            sleep 15
          done
          echo 'Exact-main Quality did not become reconcilable within the bounded wait.' >&2
          exit 1
