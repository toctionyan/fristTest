name: tmp-local-browser-export

on:
  push:
    branches:
      - fix/wp08-literal-evidence-repair-20260813

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # pinned
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Install lock-matched Playwright Chromium
        working-directory: services/agent-service/frontend
        run: |
          set -euo pipefail
          npm ci --ignore-scripts=false
          npx playwright install chromium
          browser="$(node -e "const { chromium } = require('playwright'); process.stdout.write(chromium.executablePath())")"
          test -x "$browser"
          root="$(dirname "$(dirname "$browser")")"
          printf 'browser=%s\nroot=%s\n' "$browser" "$root"
          tar -C "$(dirname "$root")" -czf /tmp/playwright-chromium.tar.gz "$(basename "$root")"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4 pinned
        with:
          name: tmp-local-browser-${{ github.run_id }}
          path: /tmp/playwright-chromium.tar.gz
          if-no-files-found: error
          retention-days: 1
