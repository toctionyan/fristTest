name: temporary-v20.18-main-live-model-architecture-validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/tmp-v20.18-main-live-model-architecture-validation.yml

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    environment: production-certification
    env:
      OPENAI_API_KEY: ${{ secrets.PRODUCTION_MODEL_API_KEY }}
      CONFIG_MODEL_PROVIDER: ${{ vars.REAL_MODEL_CERTIFICATION_PROVIDER || vars.PRODUCTION_MODEL_PROVIDER || vars.MODEL_PROVIDER }}
      CONFIG_MODEL_ID: ${{ vars.OPENAI_MODEL || vars.PRODUCTION_MODEL_ID || vars.MODEL_ID }}
      CONFIG_MODEL_API_BASE: ${{ vars.OPENAI_API_BASE || vars.PRODUCTION_MODEL_API_BASE || vars.MODEL_API_BASE }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'

      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Install locked Agent and Business environments
        run: |
          cd services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups

      - name: Resolve protected official model identity
        run: |
          "${pythonLocation}/bin/python" -B - <<'PY'
          import json
          import os
          from pathlib import Path

          profile = json.loads(Path('deployment/ci/wp08-production-profile.json').read_text(encoding='utf-8'))
          if profile.get('contract') != 'wp08-production-profile@1':
              raise SystemExit('invalid versioned production profile')
          provider = str(os.environ.get('CONFIG_MODEL_PROVIDER') or profile.get('model_provider') or '').strip().casefold()
          model = str(os.environ.get('CONFIG_MODEL_ID') or profile.get('model_id') or '').strip()
          base = str(os.environ.get('CONFIG_MODEL_API_BASE') or profile.get('model_api_base') or '').strip().rstrip('/')
          if provider == 'openai':
              if base != 'https://api.openai.com/v1':
                  raise SystemExit('OpenAI architecture validation must use the official endpoint')
          elif provider == 'deepseek':
              if base not in {'https://api.deepseek.com', 'https://api.deepseek.com/v1'}:
                  raise SystemExit('DeepSeek architecture validation must use the official endpoint')
          else:
              raise SystemExit(f'unsupported protected model provider: {provider!r}')
          if not model:
              raise SystemExit('protected model id is empty')
          if not os.environ.get('OPENAI_API_KEY'):
              raise SystemExit('production-certification environment has no model credential')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'REAL_MODEL_CERTIFICATION_PROVIDER={provider}\n')
              handle.write(f'OPENAI_MODEL={model}\n')
              handle.write(f'OPENAI_API_BASE={base}\n')
          print(json.dumps({'provider': provider, 'model': model, 'endpoint': base, 'credential_present': True}))
          PY

      - name: Diagnose protected model usage attestation without weakening it
        run: |
          services/agent-service/.venv/bin/python -B - <<'PY'
          from __future__ import annotations

          import json
          import os
          import sqlite3
          import sys
          from pathlib import Path
          from uuid import uuid4

          root = Path('.').resolve()
          for path in (
              root / 'services/agent-service/src',
              root / 'services/agent-service/scripts',
              root / 'scripts',
          ):
              sys.path.insert(0, str(path))

          from langchain_core.messages import HumanMessage
          from agent_core.config import get_model
          from agent_core.model_calls import invoke_model, model_call_scope, resolve_real_model_identity
          from verify_full_lifecycle_canary import ProductRuntimeHarness
          from verify_preprod_full_lifecycle import (
              _attest_lifecycle_model_calls,
              _call,
              _graph_diagnostics,
              _token,
          )

          output_path = Path('/tmp/v20.18-live-model-usage-diagnostic.json')
          safe_keys = (
              'purpose', 'status', 'model', 'provider_model', 'finish_reason',
              'prompt_tokens', 'completion_tokens', 'total_tokens', 'lane', 'sequence',
          )

          def safe_record(record: object) -> dict:
              if not isinstance(record, dict):
                  return {'record_type': type(record).__name__}
              return {key: record.get(key) for key in safe_keys if key in record}

          def safe_response_shape(response: object) -> dict:
              metadata = getattr(response, 'response_metadata', None)
              usage = getattr(response, 'usage_metadata', None)
              result = {
                  'response_type': type(response).__name__,
                  'response_metadata_type': type(metadata).__name__,
                  'response_metadata_keys': sorted(str(key) for key in metadata) if isinstance(metadata, dict) else [],
                  'usage_metadata_type': type(usage).__name__,
              }
              if isinstance(usage, dict):
                  result['usage_metadata'] = {
                      key: usage.get(key)
                      for key in ('input_tokens', 'output_tokens', 'total_tokens')
                      if key in usage
                  }
              if isinstance(metadata, dict):
                  token_usage = metadata.get('token_usage')
                  result['token_usage_type'] = type(token_usage).__name__
                  if isinstance(token_usage, dict):
                      result['token_usage'] = {
                          key: token_usage.get(key)
                          for key in ('prompt_tokens', 'completion_tokens', 'total_tokens')
                          if key in token_usage
                      }
              return result

          identity = resolve_real_model_identity(dict(os.environ))
          evidence = {
              'contract': 'v20.18-live-model-usage-diagnostic@1',
              'source_sha': os.environ.get('GITHUB_SHA'),
              'identity': {
                  key: identity.get(key)
                  for key in ('provider', 'endpoint', 'model', 'credential_fingerprint_sha256_16')
              },
              'strict_attestation_weakened': False,
              'probes': [],
          }

          # Probe the exact project gateway with an unbound provider model.
          model = get_model()
          with model_call_scope(max_calls=1):
              response, record = invoke_model(
                  purpose='architecture_usage_probe',
                  model=model,
                  payload=[HumanMessage(content='Reply with OK.')],
              )
          evidence['probes'].append({
              'id': 'direct-gateway',
              'record': safe_record(record),
              'response_shape': safe_response_shape(response),
          })

          # Probe the same adapter after bind_tools, matching the agent-loop wrapper shape.
          schema = {
              'type': 'function',
              'function': {
                  'name': 'diagnostic_noop',
                  'description': 'Diagnostic no-op; do not expose user data.',
                  'parameters': {
                      'type': 'object',
                      'properties': {},
                      'additionalProperties': False,
                  },
              },
          }
          bound = model.bind_tools([schema]) if hasattr(model, 'bind_tools') else model
          with model_call_scope(max_calls=1):
              response, record = invoke_model(
                  purpose='architecture_bound_usage_probe',
                  model=bound,
                  payload=[HumanMessage(content='Reply with OK.')],
              )
          evidence['probes'].append({
              'id': 'bound-tools-gateway',
              'record': safe_record(record),
              'response_shape': safe_response_shape(response),
          })

          # Reproduce only the first architecture scenario and capture already-redacted
          # lifecycle model-call records before strict attestation runs.
          harness = ProductRuntimeHarness(deterministic_model=False)
          harness.env.update({
              'CAPABILITY_SEMANTIC_VERIFIER_MODE': 'model',
              'GOAL_ALIGNMENT_VERIFIER_MODE': 'model',
              'GOAL_GRANULARITY_VERIFIER_MODE': 'model',
              'ANSWER_RELEASE_ALIGNMENT_VERIFIER_MODE': 'model',
          })
          with harness:
              base = harness.agent_url
              token = _token(base, harness.env)
              database = harness.runtime_dir / 'agent.db'
              response = _call(base, '/api/chat/turn', method='POST', token=token, body={
                  'thread_id': f'v2018-usage-diagnostic-{uuid4().hex}',
                  'message': '快递员电话是多少？',
              })
              if not isinstance(response, dict) or response.get('type') != 'answer':
                  raise RuntimeError(f'usage diagnostic expected safe answer, got type={type(response).__name__}')
              with sqlite3.connect(database) as connection:
                  row = connection.execute(
                      "SELECT output_json FROM trace_logs WHERE event_type='graph_snapshot' ORDER BY id DESC LIMIT 1"
                  ).fetchone()
              state = json.loads(row[0] or '{}') if row else {}
              state = state.get('state') if isinstance(state.get('state'), dict) else state
              tool_names = [
                  str(item.get('name') or '')
                  for item in list((state or {}).get('tool_trace') or [])
                  if isinstance(item, dict) and str(item.get('name') or '')
              ]
              diagnostics = _graph_diagnostics(database)
              model_calls = [
                  safe_record(record)
                  for diagnostic in diagnostics
                  if isinstance(diagnostic, dict)
                  for record in list(diagnostic.get('model_calls') or [])
                  if isinstance(record, dict)
              ]
              scenario = {
                  'id': 'unsupported-courier-phone',
                  'tool_names': tool_names,
                  'model_calls': model_calls,
                  'unsupported_reporter_present': 'report_unsupported_request' in tool_names,
                  'logistics_substitution_absent': 'get_order_logistics' not in tool_names,
              }
              evidence['scenario'] = scenario
              try:
                  attestation = _attest_lifecycle_model_calls(
                      diagnostics=diagnostics,
                      identity=identity,
                      turn_index=1,
                  )
              except Exception as exc:
                  evidence['attestation'] = {
                      'status': 'FAIL',
                      'error_type': type(exc).__name__,
                      'error_code': str(getattr(exc, 'code', '') or ''),
                  }
                  output_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
                  print(json.dumps(evidence, ensure_ascii=False))
                  raise
              else:
                  evidence['attestation'] = {'status': 'PASS', 'result': attestation}

          output_path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, ensure_ascii=False))
          PY

      - name: Upload protected usage diagnostic evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v20.18-live-model-usage-diagnostic-${{ github.run_id }}
          path: /tmp/v20.18-live-model-usage-diagnostic.json
          retention-days: 30
          if-no-files-found: error
