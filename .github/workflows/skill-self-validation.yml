name: skill-self-validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skill-self-validation:
    name: skill-self-validation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Build, verify, and commit governed A2/B carrier candidate
        run: |
          set -euo pipefail
          git checkout temp/v20.18-a2b-builder-20260812
          "${pythonLocation}/bin/python" -B scripts/temp_v2018_a2b_builder.py
          "${pythonLocation}/bin/python" - <<'PY'
          from pathlib import Path

          path = Path("services/agent-service/tests/architecture/test_semantic_single_writer_invariants.py")
          text = path.read_text(encoding="utf-8")
          marker = "def test_alignment_and_granularity_feedback_are_violation_only() -> None:\n"
          helper = '''def _mapping_keys(value: object) -> set[str]:
              keys: set[str] = set()
              if isinstance(value, dict):
                  for key, nested in value.items():
                      keys.add(str(key))
                      keys.update(_mapping_keys(nested))
              elif isinstance(value, (list, tuple)):
                  for nested in value:
                      keys.update(_mapping_keys(nested))
              return keys


          def test_alignment_and_granularity_feedback_are_violation_only() -> None:
          '''
          if marker not in text:
              raise SystemExit("alignment/granularity invariant marker missing")
          text = text.replace(marker, helper, 1)
          text = text.replace(
              '''    alignment_feedback = _alignment_repair_feedback(alignment)
              encoded = json.dumps(alignment_feedback, ensure_ascii=False)
              assert "dependency_edges" not in encoded
              assert "requires_result_of_goal_id" not in encoded
          ''',
              '''    alignment_feedback = _alignment_repair_feedback(alignment)
              alignment_keys = _mapping_keys(alignment_feedback)
              assert "dependency_edges" not in alignment_keys
              assert "requires_result_of_goal_id" not in alignment_keys
          ''',
              1,
          )
          text = text.replace(
              '''    granularity_feedback = _granularity_repair_feedback(granularity)
              encoded = json.dumps(granularity_feedback, ensure_ascii=False)
              assert "recommended_role" not in encoded
              assert "dependency_edges" not in encoded
              assert "快递员手机号" in encoded
          ''',
              '''    granularity_feedback = _granularity_repair_feedback(granularity)
              granularity_keys = _mapping_keys(granularity_feedback)
              encoded = json.dumps(granularity_feedback, ensure_ascii=False)
              assert "recommended_role" not in granularity_keys
              assert "dependency_edges" not in granularity_keys
              assert "快递员手机号" in encoded
          ''',
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
          services/agent-service/.venv/bin/python -B -m py_compile \
            services/agent-service/src/agent_core/modules/contracts.py \
            services/agent-service/src/agent_core/modules/registry.py \
            services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py \
            services/agent-service/src/agent_core/lifecycle/protocol.py \
            services/agent-service/src/agent_core/lifecycle/semantic_contract.py \
            services/agent-service/src/agent_core/kernel/semantic_contract.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/lifecycle/goal_granularity.py \
            services/agent-service/src/agent_core/runtime/capability_effects.py \
            services/agent-service/src/agent_modules/ecommerce/semantic_vocabulary.py \
            services/agent-service/src/agent_modules/ecommerce/module.py \
            services/agent-service/tests/architecture/test_semantic_single_writer_invariants.py
          PYTHONPATH="${GITHUB_WORKSPACE}/services/agent-service/src:${GITHUB_WORKSPACE}/services/agent-service" \
            services/agent-service/.venv/bin/python -B -m pytest -q \
              services/agent-service/tests/architecture/test_semantic_single_writer_invariants.py \
              services/agent-service/tests/runtime/test_semantic_output_coverage.py \
              services/agent-service/tests/runtime/test_unified_semantic_planning_contract.py \
              services/agent-service/tests/runtime/test_capability_contract_v2.py \
              services/agent-service/tests/runtime/test_unsupported_capability_surface_binding.py \
              services/agent-service/tests/runtime/test_wp08_attempt4_release_repairs.py \
              services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py
          git add \
            services/agent-service/src/agent_core/modules/contracts.py \
            services/agent-service/src/agent_core/modules/registry.py \
            services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py \
            services/agent-service/src/agent_core/lifecycle/protocol.py \
            services/agent-service/src/agent_core/lifecycle/semantic_contract.py \
            services/agent-service/src/agent_core/kernel/semantic_contract.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/lifecycle/goal_granularity.py \
            services/agent-service/src/agent_core/runtime/capability_effects.py \
            services/agent-service/src/agent_modules/ecommerce/semantic_vocabulary.py \
            services/agent-service/src/agent_modules/ecommerce/module.py \
            services/agent-service/tests/architecture/test_semantic_single_writer_invariants.py \
            services/agent-service/tests/runtime/test_semantic_output_coverage.py \
            services/agent-service/tests/runtime/test_unified_semantic_planning_contract.py
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Builder: implement V20.18 semantic output coverage"
            git push origin HEAD:temp/v20.18-a2b-builder-20260812
          else
            echo "Candidate already committed."
          fi
      - name: Validate Skill control plane
        run: services/agent-service/.venv/bin/python -B skill-system/controller/profile_runner.py skill-control-plane
      - name: Validate quality toolchain authority
        run: >-
          services/agent-service/.venv/bin/python -B scripts/quality_toolchain_contract.py
          --workspace-root . --static-only
