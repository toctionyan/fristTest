name: one-time-diagnose-npm-ls-after-gates

"on":
  push:
    branches:
      - agent/diagnose-npm-ls-after-gates

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Install exact frontend dependencies
        working-directory: services/agent-service/frontend
        run: npm ci --ignore-scripts=false
      - name: Run frontend tests before final recapture
        working-directory: services/agent-service/frontend
        run: npm run test:ci
      - name: Run frontend production build before final recapture
        working-directory: services/agent-service/frontend
        run: npm run build
      - name: Probe npm ls invocation variants
        run: python -B .github/scripts/diagnose_npm_ls_after_gates.py
      - name: Remove diagnostic machinery and commit sanitized result
        shell: bash
        run: |
          rm -f .github/scripts/diagnose_npm_ls_after_gates.py
          rm -f .github/workflows/one-time-diagnose-npm-ls-after-gates.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record npm post-gate diagnostics"
          git push origin HEAD:${GITHUB_REF_NAME}
