name: quality

on:
  pull_request:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  consume-exact-main-quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Fetch exact-main push Quality and replay coordinator event
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: '4fecee91b5a06ec7433eff795c08b923ff58d6fc'
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/quality.yml/runs?event=push&branch=main&per_page=50" \
            > "${RUNNER_TEMP}/runs.json"
          python -B - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP'])
          payload = json.loads((root / 'runs.json').read_text())
          matches = [
              row for row in payload.get('workflow_runs', [])
              if row.get('head_sha') == os.environ['EXPECTED_SHA']
              and row.get('event') == 'push'
              and row.get('head_branch') == 'main'
              and row.get('name') == 'quality'
          ]
          if not matches:
              raise SystemExit('exact-main push Quality run not found')
          run = sorted(matches, key=lambda row: int(row['id']), reverse=True)[0]
          if run.get('status') != 'completed':
              raise SystemExit(f"exact-main Quality is not completed: {run.get('status')}")
          if run.get('conclusion') not in {'success', 'failure', 'cancelled', 'timed_out'}:
              raise SystemExit(f"unsupported exact-main Quality conclusion: {run.get('conclusion')}")
          print(json.dumps({
              'quality_run_id': run['id'],
              'head_sha': run['head_sha'],
              'status': run['status'],
              'conclusion': run['conclusion'],
          }, sort_keys=True))
          (root / 'event.json').write_text(
              json.dumps({'workflow_run': run}), encoding='utf-8'
          )
          PY
          GH_TOKEN="${GH_TOKEN}" GITHUB_TOKEN="${GH_TOKEN}" \
            python -B scripts/wp08_release_coordinator.py \
            --mode workflow-run --event-path "${RUNNER_TEMP}/event.json"
