name: stage42-replan-baseline-probe

on:
  pull_request:
    branches:
      - fix/dependency-proof-authority-reducer-20260816
    paths:
      - scripts/stage42_replan_baseline_probe.py
      - .github/workflows/stage42-replan-baseline-probe.yml

permissions:
  contents: read

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Probe real pre-change product baseline
        run: |
          set -o pipefail
          "${pythonLocation}/bin/python" -B <(git show "${{ github.event.pull_request.head.sha }}:scripts/stage42_replan_baseline_probe.py") 2>&1 | tee stage42-baseline-probe.log

      - name: Freeze canonical Stage 4.2 RED evidence
        run: |
          set -euo pipefail
          change="probe-stage4-2-dependency-obligation-evidence-pipeline"
          mkdir -p stage42-formal-red
          cp -R ".quality/product-code/${change}/baseline" stage42-formal-red/baseline
          cp -R ".quality/stage42-dependency-obligation-red-input" stage42-formal-red/input
          cp stage42-baseline-probe.log stage42-formal-red/probe.log
          git rev-parse HEAD > stage42-formal-red/SOURCE_HEAD.txt
          git status --porcelain=v1 > stage42-formal-red/WORKTREE_STATUS.txt
          sha256sum \
            stage42-formal-red/baseline/baseline-record.json \
            stage42-formal-red/baseline/run-summary.json \
            stage42-formal-red/input/target.md \
            stage42-formal-red/input/claim.json \
            stage42-formal-red/input/focused-policy.json \
            > stage42-formal-red/SHA256SUMS.txt

      - name: Upload canonical Stage 4.2 RED evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage42-formal-red-baseline
          path: stage42-formal-red
          if-no-files-found: error
          retention-days: 30
