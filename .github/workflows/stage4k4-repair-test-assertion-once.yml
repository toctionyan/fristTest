name: stage4k4-repair-test-assertion-once

on:
  push:
    branches:
      - feat/stage4k4-production-composition-disabled-20260814

permissions:
  contents: write

jobs:
  repair-and-self-remove:
    runs-on: ubuntu-24.04
    if: github.repository == 'toctionyan/fristTest'
    steps:
      - name: Checkout Stage4K4 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: feat/stage4k4-production-composition-disabled-20260814

      - name: Repair exact readiness assertion
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/stage4k4-production-composition-finalize-once.yml')
          text = path.read_text(encoding='utf-8')
          old = '                  assert "signature" not in str(readiness)\n'
          new = (
              '                  assert "signature" not in readiness\n'
              '                  assert readiness["signature_scheme"] == DEPENDENCY_AUTHORITY_ED25519_SIGNATURE_SCHEME\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected_single_assertion:{text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit repaired one-shot and self-remove
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage4k4-repair-test-assertion-once.yml
          git add .github/workflows/stage4k4-production-composition-finalize-once.yml
          git diff --cached --check
          git commit -m "Fix Stage4K4 sanitized readiness assertion"
          git push origin HEAD:feat/stage4k4-production-composition-disabled-20260814
