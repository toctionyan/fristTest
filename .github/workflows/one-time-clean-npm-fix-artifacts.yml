name: one-time-clean-npm-fix-artifacts

"on":
  push:
    branches:
      - agent/fix-npm-toolchain-diagnostic-exit

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Remove generated bytecode and cleanup workflow
        shell: bash
        run: |
          rm -rf scripts/__pycache__
          rm -f .github/workflows/one-time-clean-npm-fix-artifacts.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove npm fix validation artifacts"
          git push origin HEAD:${GITHUB_REF_NAME}
