name: B35 Staged Goal Progression Validation

on:
  pull_request:
    branches:
      - agent/b28-repository-onboarding
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-b35-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      APP_PROFILE: local
      PYTHONPATH: ${{ github.workspace }}/services/agent-service:${{ github.workspace }}/services/agent-service/src
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Validate B35 candidate
        run: bash candidate-validation/run-b35-validation.sh
      - name: Upload B35 validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b35-runtime-validation-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: ${{ runner.temp }}/b35-evidence

