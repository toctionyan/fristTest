name: stage5g4-final-b39-governed-repair-cycle

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

jobs:
  b39-governed-repair-cycle:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'stage5g4-final-b39-governed-repair-cycle'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout runner head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner
          fetch-depth: 1

      - name: Checkout canonical B38 formal source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 18d1795ebfd1a1ecb827ce12385b945bac1f74df
          path: source
          fetch-depth: 1

      - name: Checkout canonical B38 pure baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 18d1795ebfd1a1ecb827ce12385b945bac1f74df
          path: baseline-source
          fetch-depth: 1

      - name: Checkout canonical B38 candidate workspace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 18d1795ebfd1a1ecb827ce12385b945bac1f74df
          path: candidate-source
          fetch-depth: 1

      - name: Checkout verified Controller
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 4e3beb4a6a4a8f2f86b60b95eb8166045b411615
          path: control
          fetch-depth: 1

      - name: Pin Python 3.12.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Install exact Controller test environment
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r control/deployment/ci/uv-requirements-linux-x86_64.txt
          uv sync --project control/services/agent-service --locked --all-groups --python 3.12.13
          test "$(git -C source rev-parse HEAD)" = '18d1795ebfd1a1ecb827ce12385b945bac1f74df'
          test "$(git -C baseline-source rev-parse HEAD)" = '18d1795ebfd1a1ecb827ce12385b945bac1f74df'
          test "$(git -C candidate-source rev-parse HEAD)" = '18d1795ebfd1a1ecb827ce12385b945bac1f74df'
          test "$(git -C control rev-parse HEAD)" = '4e3beb4a6a4a8f2f86b60b95eb8166045b411615'
          control/services/agent-service/.venv/bin/python --version

      - name: Execute governed B39 repair cycle
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          python3 -B runner/.github/scripts/stage5g4_final_b39_governed_repair.py > b39-driver.stdout.txt 2> b39-driver.stderr.txt
          rc=$?
          echo "$rc" > b39-driver.exit-code.txt
          exit 0

      - name: Upload B39 governed repair evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage5g4-final-b39-governed-repair-cycle
          path: |
            B39_GOVERNED_REPAIR_REPORT.json
            B39_GOVERNED_REPAIR_FAILURE.json
            b39-driver.stdout.txt
            b39-driver.stderr.txt
            b39-driver.exit-code.txt
            b39-governed-evidence/
            baseline-source/.quality/product-code/repair-v20.17-b39-planrun-runtime-field-isolation/
            source/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce B39 governed closure
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat b39-driver.exit-code.txt)" = '0'
          test -f B39_GOVERNED_REPAIR_REPORT.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('B39_GOVERNED_REPAIR_REPORT.json').read_text())
          assert p['verdict']=='B39_GOVERNED_REPAIR_CYCLE_CLOSED_CONVERGED'
          assert p['formal_red']['decision']=='FAIL'
          assert p['verification']['summary']['decision']=='PASS'
          assert p['diff_review']['decision']=='PASS'
          assert p['diff_review']['changed_paths']==[
              'services/agent-service/src/agent_core/lifecycle/plan_execution.py',
              'services/agent-service/tests/runtime/test_plan_run_runtime_field_isolation.py',
          ]
          assert p['closure']['final_decision']=='CLOSED_VERIFIED'
          assert p['contract']['status']=='closed'
          assert p['contract']['result']=='CONVERGED'
          assert p['contract']['repair_governance_consumed_at']
          assert p['candidate']['plan_sha256']=='86d2b2adcf2770c7caa7502864dd2d2fdd31341c0054e2105a1f80a1e4b316d4'
          assert p['candidate']['test_sha256']=='d5e3a015767842d73f82da3ebaaf4122a64b5fc33a41f77a0226c5bb471074b4'
          assert p['publication_authorized_by_this_run'] is False
          assert p['canonical_b38_branch_modified'] is False
          assert p['main_modified'] is False
          assert p['production_closed'] is False
          PY
