name: one-time-diagnose-npm-quality-loop-path

"on":
  push:
    branches:
      - agent/diagnose-npm-ls-after-gates

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Install and exercise frontend
        working-directory: services/agent-service/frontend
        run: |
          npm ci --ignore-scripts=false
          npm run test:ci
          npm run build
      - name: Probe exact Quality Loop PATH
        run: python3 -B .github/scripts/diagnose_npm_quality_loop_path.py
      - name: Remove probe and commit result
        shell: bash
        run: |
          rm -f .github/scripts/diagnose_npm_quality_loop_path.py
          rm -f .github/workflows/one-time-diagnose-npm-quality-loop-path.yml
          rm -f .github/diagnostics/npm-ls-diagnostic-trigger.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Record exact Quality Loop npm PATH diagnostics"
          git push origin HEAD:${GITHUB_REF_NAME}
