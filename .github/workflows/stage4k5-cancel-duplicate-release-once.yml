name: stage4k5-cancel-duplicate-release-once

on:
  push:
    branches:
      - governance/stage4k5-release-dispatch-20260815
    paths:
      - .github/workflows/stage4k5-cancel-duplicate-release-once.yml

permissions:
  contents: write
  actions: write

jobs:
  cancel-duplicate:
    if: github.repository == 'toctionyan/fristTest' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout cancellation branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: governance/stage4k5-release-dispatch-20260815
          fetch-depth: 0
          persist-credentials: true

      - name: Cancel only duplicate pending exact-main release
        env:
          GH_TOKEN: ${{ github.token }}
          DUPLICATE_RUN_ID: '31854438406'
          KEEP_RUN_ID: '31854414627'
          EXPECTED_MAIN_SHA: d536aaff8b2d5d78c20ad5cebaa5e96006513dec
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          import json, os, urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          duplicate = os.environ['DUPLICATE_RUN_ID']
          keep = os.environ['KEEP_RUN_ID']
          expected = os.environ['EXPECTED_MAIN_SHA']

          def get(run_id):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{run_id}',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          d = get(duplicate)
          k = get(keep)
          for row in (d, k):
              assert row['name'] == 'production-certification-release'
              assert row['event'] == 'workflow_dispatch'
              assert row['head_branch'] == 'main'
              assert row['head_sha'] == expected
          assert k['status'] in {'queued', 'in_progress', 'completed', 'pending', 'waiting', 'requested'}
          if d['status'] not in {'completed', 'cancelled'}:
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/actions/runs/{duplicate}/cancel',
                  data=b'{}',
                  method='POST',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req) as response:
                  assert response.status in {202, 204}
          print(f'kept_release_run={keep}')
          print(f'cancelled_duplicate_run={duplicate}')
          PY

      - name: Remove cancellation workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/stage4k5-cancel-duplicate-release-once.yml
          git diff --cached --check
          git commit -m "Remove duplicate release cancellation workflow"
          git push origin HEAD:governance/stage4k5-release-dispatch-20260815
