name: Temporary Product Source Baseline Refresh

"on":
  push:
    branches:
      - fix/semantic-shared-scope-dependency-20260815
    paths:
      - .github/product-source-baseline-refresh.trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Refresh baseline with repository-owned authority
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/refresh_product_source_baseline.py \
            --workspace . \
            --generated-from-sha "${GITHUB_SHA}"
          python3 -B -m unittest discover \
            -s skill-system/tests \
            -p 'test_product_source_baseline_binding.py'
          git diff --check

      - name: Publish baseline-only repair
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- skill-system/registry/product-source-baseline.json; then
            echo 'baseline already current'
            exit 0
          fi
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json
          git commit -m 'chore(governance): refresh product source baseline'
          git push origin HEAD:fix/semantic-shared-scope-dependency-20260815
