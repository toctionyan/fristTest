name: stage42-dependency-obligation-permit-export

on:
  pull_request:
    branches:
      - fix/dependency-proof-authority-reducer-20260816
    paths:
      - scripts/stage42_dependency_permit_carrier.py
      - .github/workflows/stage42-dependency-obligation-permit-export.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  export-trusted-permit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout temporary carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Generate repository-owned Stage 4.2 permit from exact PR base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B scripts/stage42_dependency_permit_carrier.py \
            --base-sha "${BASE_SHA}" \
            --workspace "${RUNNER_TEMP}/stage42-base"

      - name: Copy exact generated governance state into carrier branch
        run: |
          set -euo pipefail
          CHANGE_ID="repair-stage4-2-dependency-bridge-obligation-evidence"
          CASE="governance/repair-cases/${CHANGE_ID}"
          BASE="${RUNNER_TEMP}/stage42-base"
          mkdir -p governance/targets governance/claims governance/repair-cases
          cp "${BASE}/governance/active-change.json" governance/active-change.json
          cp "${BASE}/governance/targets/${CHANGE_ID}.md" "governance/targets/${CHANGE_ID}.md"
          cp "${BASE}/governance/claims/${CHANGE_ID}.json" "governance/claims/${CHANGE_ID}.json"
          rm -rf "${CASE}"
          cp -R "${BASE}/${CASE}" "${CASE}"
          sha256sum \
            governance/active-change.json \
            "governance/targets/${CHANGE_ID}.md" \
            "governance/claims/${CHANGE_ID}.json" \
            "${CASE}/failure-case.json" \
            "${CASE}/root-cause-proof.json" \
            "${CASE}/repair-plan.json" \
            "${CASE}/plan-review.json" \
            "${CASE}/baseline-manifest.json" \
            "${CASE}/change-permit.json"

      - name: Commit generated governance state only to temporary carrier
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          CHANGE_ID="repair-stage4-2-dependency-bridge-obligation-evidence"
          CASE="governance/repair-cases/${CHANGE_ID}"
          git add \
            governance/active-change.json \
            "governance/targets/${CHANGE_ID}.md" \
            "governance/claims/${CHANGE_ID}.json" \
            "${CASE}"
          if git diff --cached --quiet; then
            echo "Generated governance state already present; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Carrier: export governed Stage 4.2 dependency repair permit"
          git push origin "HEAD:${HEAD_REF}"
