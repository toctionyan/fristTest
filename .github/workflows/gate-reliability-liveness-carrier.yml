name: gate-reliability-liveness-carrier

on:
  push:
    branches:
      - fix/proof-authority-lifecycle-20260816

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/proof-authority-lifecycle-20260816
          fetch-depth: 0
      - name: Apply deterministic liveness transition patch
        run: python .github/gate_reliability_liveness_patch.py
      - name: Compile changed Python
        run: |
          python -m py_compile \
            skill-system/controller/execution_runtime.py \
            skill-system/tests/test_wp08_certification_liveness.py
      - name: Commit reliability fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(control-plane): guarantee stall warning before timeout"
          git push origin HEAD:fix/proof-authority-lifecycle-20260816
