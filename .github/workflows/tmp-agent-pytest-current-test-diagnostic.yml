name: temporary-agent-pytest-current-test-diagnostic

on:
  push:
    branches:
      - architecture/v20.18-contract-owner-repair-rule-oracle-20260812

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'

      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups

      - name: Profile one known slow real-lifecycle scenario
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          from pathlib import Path

          import scripts.run_python_test_suites as runner

          root = Path.cwd()
          agent = root / "services/agent-service"
          py = agent / ".venv/bin/python"
          runtime = Path(os.environ["RUNNER_TEMP"]) / "agent-profile-diagnostic"
          runtime.mkdir(parents=True, exist_ok=True)
          profile_path = runtime / "profile.pstats"
          report_path = runtime / "profile.txt"

          env = os.environ.copy()
          for key in tuple(env):
              if key.startswith(runner.STANDARD_CONFIG_PREFIXES):
                  env.pop(key, None)
          env.update(runner.STANDARD_ENV)
          env["PYTHONDONTWRITEBYTECODE"] = "1"
          env["PYTHONPATH"] = "src:." + (f":{env['PYTHONPATH']}" if env.get("PYTHONPATH") else "")
          env.update({
              "SQLITE_DB_PATH": str(runtime / "agent.sqlite3"),
              "AGENT_DATABASE_URL": f"sqlite:///{runtime / 'agent.sqlite3'}",
              "DATABASE_URL": f"sqlite:///{runtime / 'agent.sqlite3'}",
              "CHECKPOINT_DB_PATH": str(runtime / "checkpoints.sqlite3"),
              "VECTOR_DB_PATH": str(runtime / "vector.sqlite3"),
              "UPLOAD_DIR": str(runtime / "uploads"),
              "BUSINESS_DB_PATH": str(runtime / "business.sqlite3"),
          })

          node = "tests/context/test_conversation_regression_suite_execution.py::test_conversation_case_executes_real_lifecycle_contract[visible_superlative_cheapest]"
          cmd = [
              str(py), "-B", "-m", "cProfile", "-o", str(profile_path), "-m", "pytest",
              "-q", "--disable-warnings", "--tb=short", "-p", "no:cacheprovider", node,
          ]
          print("PROFILE_COMMAND=" + " ".join(cmd), flush=True)
          completed = subprocess.run(cmd, cwd=agent, env=env, timeout=240)

          import pstats
          with report_path.open("w", encoding="utf-8") as handle:
              stats = pstats.Stats(str(profile_path), stream=handle)
              stats.strip_dirs().sort_stats("cumulative").print_stats(120)
              handle.write("\n\n=== INTERNAL EFFECT / REGISTRY HOTSPOTS ===\n")
              stats.sort_stats("cumulative").print_stats(
                  "capability_effects|goal_capability_coverage|goal_outputs|registry.py"
              )
          print(report_path.read_text(encoding="utf-8")[:30000], flush=True)
          print(f"PROFILE_EXIT={completed.returncode}", flush=True)
          raise SystemExit(completed.returncode)
          PY

      - name: Upload profile evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: temporary-agent-profile-evidence
          path: |
            ${{ runner.temp }}/agent-profile-diagnostic/profile.txt
            ${{ runner.temp }}/agent-profile-diagnostic/profile.pstats
          if-no-files-found: error
