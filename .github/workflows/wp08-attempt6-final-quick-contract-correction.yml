name: wp08-attempt6-final-quick-contract-correction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt6-final-quick-contract-correction-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FORMAL_BRANCH: agent/wp08-attempt6-provider-checkpoint-semantic-repair-20260808
      CANDIDATE_HEAD: 50cab5534a9c409c1d5d16e21e5c38afe5622a72
    steps:
      - name: Checkout carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: wp08-attempt6-final-quick-contract-correction-20260809
          path: carrier
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact formal candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          path: candidate
          fetch-depth: 1
          persist-credentials: true

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Verify authority, apply exact correction and install locked environments
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_HEAD"
          REMOTE="$(git -C candidate ls-remote origin refs/heads/$FORMAL_BRANCH | awk '{print $1}')"
          test "$REMOTE" = "$CANDIDATE_HEAD"
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r candidate/deployment/ci/uv-requirements-linux-x86_64.txt
          "${pythonLocation}/bin/python" -B carrier/scripts/wp08_attempt6_final_quick_contract_correction.py candidate
          (cd candidate/services/agent-service && uv sync --locked --all-groups)
          (cd candidate/services/business-service && uv sync --locked --all-groups)

      - name: Run focused boundary and lock regressions through native runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/.quality/attempt6-final-correction/junit
          candidate/services/agent-service/.venv/bin/python -B \
            candidate/scripts/run_agent_pytest.py \
            --workspace-root candidate \
            --junitxml candidate/.quality/attempt6-final-correction/junit/focused.xml \
            tests/architecture/test_command_and_model_governance.py::test_structured_command_facade_runs_public_wrapper_then_resumes_graph \
            tests/runtime/test_wp08_attempt6_release_repairs.py::test_structured_boundary_persists_verified_ingress_and_formal_update \
            tests/architecture/test_dependency_lock_contract.py::test_python_lockfiles_are_current_and_release_visible

      - name: Run native standard Python suites
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/.quality/attempt6-final-correction/junit candidate/.quality/attempt6-final-correction/coverage
          candidate/services/agent-service/.venv/bin/python -B \
            candidate/scripts/run_python_test_suites.py \
            candidate \
            --mode standard \
            --junit-dir candidate/.quality/attempt6-final-correction/junit \
            --coverage-dir candidate/.quality/attempt6-final-correction/coverage

      - name: Re-run full managed PostgreSQL public recovery
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          services/agent-service/.venv/bin/python -B - <<'PY'
          from __future__ import annotations
          import json
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / 'scripts'))
          sys.path.insert(0, str(root / 'services' / 'agent-service'))
          sys.path.insert(0, str(root / 'services' / 'agent-service' / 'src'))
          from run_managed_quality_integration import ManagedPostgres
          from verify_full_lifecycle_canary import ProductRuntimeHarness
          from verify_managed_postgres_recovery import run_managed_postgres_recovery

          with ManagedPostgres() as postgres, ProductRuntimeHarness(persistence_url=postgres.url) as product:
              result = run_managed_postgres_recovery(product)
          if result.get('status') != 'PASS':
              raise SystemExit('managed_postgres_recovery_not_passed')
          print(json.dumps(result, ensure_ascii=False, indent=2))
          PY

      - name: Verify exact two-file candidate delta
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          git clean -fdX
          find . -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          "${pythonLocation}/bin/python" - <<'PY'
          import subprocess
          expected = {
              'services/agent-service/app/services/lifecycle_command_runner.py',
              'services/agent-service/tests/architecture/test_dependency_lock_contract.py',
          }
          rows = subprocess.check_output(['git', 'status', '--porcelain=v1'], text=True).splitlines()
          actual = {row[3:] for row in rows if len(row) > 3}
          if actual != expected:
              raise SystemExit(f'unexpected_changed_paths:{sorted(actual)}')
          PY

      - name: Publish exact validated correction
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          REMOTE="$(git ls-remote origin refs/heads/$FORMAL_BRANCH | awk '{print $1}')"
          test "$REMOTE" = "$CANDIDATE_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/agent-service/app/services/lifecycle_command_runner.py \
            services/agent-service/tests/architecture/test_dependency_lock_contract.py
          git diff --cached --check
          git commit -m 'Fix final Quick checkpoint ingress and lock semantics'
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_HEAD"
          git push --force-with-lease=refs/heads/${FORMAL_BRANCH}:${CANDIDATE_HEAD} origin HEAD:refs/heads/$FORMAL_BRANCH
