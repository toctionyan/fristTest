name: dependency-authority-v4-carrier

on:
  push:
    branches:
      - fix/proof-authority-lifecycle-20260816

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/proof-authority-lifecycle-20260816
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked agent environment
        run: cd services/agent-service && uv sync --locked --all-groups

      - name: Apply state-driven closure integration
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          ROOT = Path.cwd()
          path = ROOT / "services/agent-service/src/agent_core/lifecycle/goal_planning.py"
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              text = text.replace(old, new, 1)

          replace_once(
              "        for attempt in range(3):\n",
              "        for attempt in range(6):\n",
              "verifier bounded state transitions",
          )

          old_return = '''            if verdict.verdict in {"exact", "incomplete"}:\n                return verdict\n'''
          new_return = '''            dependency_proof_needs_closure = bool(\n                dependency_proof is not None\n                and dependency_proof.maturity.value == "verified"\n                and dependency_proof.dependency_challenge_required\n                and isinstance(verdict.details, dict)\n                and verdict.details.get("dependency_proof_complete") is True\n                and (\n                    verdict.exact\n                    or (\n                        verdict.verdict == "incomplete"\n                        and verdict.reason_code == "goal_alignment_dependency_graph_mismatch"\n                        and not verdict.missing_spans\n                    )\n                )\n            )\n            if dependency_proof_needs_closure and attempt < 5:\n                # Call number is not proof maturity. A semantic-only adjudication may\n                # preserve a VERIFIED graph (#1124), but complete/matching absence or\n                # a graph mismatch still cannot become repair/acceptance authority\n                # without a dependency-specific adversarial closure (#1110). Close\n                # that dimension in a separate state transition instead of making the\n                # third model call own two unrelated semantic decisions.\n                preserved_blind_dependency_details = deepcopy(verdict.details)\n                verifier_repair_kind = "candidate_blind_dependency_authority_closure"\n                verifier_repair = (\n                    "Close only the current-turn dependency proof maturity from USER_TEXT. The prior pairwise graph is VERIFIED and preservable but not authoritative: complete/matching alone is not authority. Re-read every unordered Goal pair from scratch and apply the result-removal counterfactual. Remove only the earlier Goal user-visible result payload while preserving objects, scopes and constraints already literal in USER_TEXT. Return a positive relation only when literal wording inside the dependent Goal consumes the earlier result as result_reference, result_condition or result_value_input; sequencing, shared topic/scope, zero-anaphora target omission, stable-ID lookup, Draft/preflight support and other execution prerequisites remain independent. Return exactly one dependency_decisions row for every unordered Goal pair. Positive rows require the smallest relation-only basis_span inside the dependent Goal. Do not re-audit requested_effect, requested_outputs, target scope, historical references, capability availability, tool order, business state or transaction mechanics. Return verdict=exact, literal evidence_spans when available, missing_spans=[], dependency_decisions and reason_code; Runtime compares the closed graph to Planner depends_on deterministically."\n                )\n                prompt = {\n                    "USER_TEXT_UNTRUSTED": user_text,\n                    "DECLARED_GOALS": _dependency_adjudication_goal_projection(goals),\n                    "RECENT_PUBLIC_CONTEXT": list(recent_public_context or []),\n                    "ACTIVE_STRUCTURED_INTERACTION": dict(active_structured_interaction or {}),\n                    "CANONICAL_SEMANTIC_OUTPUT_VOCABULARY": semantic_vocabulary,\n                }\n                continue\n            if verdict.verdict in {"exact", "incomplete"}:\n                return verdict\n'''
          replace_once(old_return, new_return, "state-driven authority closure")

          old_feedback = '''        details.get("dependency_authority") == "independent_goal_alignment"\n        and details.get("dependency_proof_complete") is True\n        and details.get("dependency_graph_match") is False\n    ):\n        return {}\n'''
          new_feedback = '''        details.get("dependency_authority") == "independent_goal_alignment"\n        and details.get("dependency_proof_complete") is True\n        and details.get("dependency_graph_match") is False\n        and details.get("dependency_authority_state") == "authoritative"\n    ):\n        return {}\n'''
          replace_once(old_feedback, new_feedback, "repair feedback authority gate")

          text = text.replace(
              "Do not re-judge, replace or return dependency_decisions; dependency authority remains the preserved prior proof.",
              "Do not re-judge, replace or return dependency_decisions; preserve the prior dependency proof unchanged. If it is only VERIFIED, a dedicated dependency closure transition may run after this semantic-only adjudication.",
          )
          text = text.replace(
              "Do not re-audit or return dependency_decisions; the prior complete dependency proof remains authoritative.",
              "Do not re-audit or return dependency_decisions; preserve the prior complete dependency proof unchanged. This semantic-only call cannot mint, reopen or downgrade dependency authority.",
          )
          text = text.replace(
              "Do not re-audit or return dependency_decisions; the prior complete candidate-blind dependency proof remains \"\n                    \"authoritative.",
              "Do not re-audit or return dependency_decisions; preserve the prior complete candidate-blind dependency proof unchanged. This semantic-only call cannot mint, reopen or downgrade dependency authority.",
          )
          text = text.replace(
              "# The candidate-blind proof is itself the authority that the\n                        # declared graph is wrong.",
              "# The candidate-blind proof is grounded graph evidence that the\n                        # declared graph may be wrong. Repair authority is granted only\n                        # after the dedicated dependency-closure transition.",
          )
          path.write_text(text, encoding="utf-8")

          # Refresh protected-source hashes for every tracked file after the two
          # direct source/test updates and this integration patch.
          baseline_path = ROOT / "skill-system/registry/product-source-baseline.json"
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          files = dict(baseline.get("files") or {})
          for rel in list(files):
              candidate = ROOT / rel
              if candidate.is_file():
                  files[rel] = sha256(candidate.read_bytes()).hexdigest()
          baseline["files"] = dict(sorted(files.items()))
          baseline["file_count"] = len(files)
          baseline_path.write_text(
              json.dumps(baseline, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          # One-shot carrier must not enter the formal PR diff.
          carrier = ROOT / ".github/workflows/dependency-authority-v4-carrier.yml"
          carrier.unlink()
          PY

      - name: Compile changed Python
        run: |
          python -m py_compile \
            services/agent-service/src/agent_core/lifecycle/goal_dependency_proof.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/tests/runtime/test_dependency_proof_authority.py

      - name: Commit integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(semantic): close dependency authority as a separate state transition"
          git push origin HEAD:fix/proof-authority-lifecycle-20260816

      - name: Run focused historical and authority regressions
        shell: bash
        run: |
          cd services/agent-service
          export PYTHONPATH="$PWD/src"
          .venv/bin/python -B -m pytest -q -p no:cacheprovider \
            tests/runtime/test_dependency_proof_authority.py \
            tests/runtime/test_release47_dependency_repair_projection.py \
            tests/runtime/test_release52_dependency_independence_adjudication.py \
            tests/runtime/test_release53_blind_semantic_grounding_adjudication.py \
            tests/runtime/test_wp08_attempt5_dependency_authority.py \
            tests/runtime/test_wp08_attempt6_alignment_normalization.py \
            tests/runtime/test_wp08_attempt7_final_authority_and_retry.py \
            ../../skill-system/tests/test_semantic_dependency_repair_feedback.py \
            ../../skill-system/tests/test_wp08_final_product_closure_repair.py
