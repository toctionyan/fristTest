name: apply-release-owned-runtime-repair

on:
  push:
    branches:
      - agent/fix-release-owned-runtime
    paths:
      - .github/repair/release-owned-runtime.patch
      - .github/workflows/apply-release-owned-runtime-repair.yml

permissions:
  contents: write

jobs:
  apply-audited-patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - name: Apply exact release runtime repair
        run: |
          git apply --check .github/repair/release-owned-runtime.patch
          git apply .github/repair/release-owned-runtime.patch
          rm .github/repair/release-owned-runtime.patch
          rm .github/workflows/apply-release-owned-runtime-repair.yml
      - name: Validate changed Python syntax
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          paths = [
              Path('scripts/locked_python.py'),
              Path('scripts/quality_loop.py'),
              Path('scripts/run_production_release.py'),
              Path('scripts/verify_production_browser_bundle.py'),
              Path('scripts/verify_production_certification_bundle.py'),
              Path('scripts/verify_production_postgres_bundle.py'),
              Path('services/agent-service/tests/runtime/test_release_owned_runtime_boundary.py'),
          ]
          for path in paths:
              ast.parse(path.read_text(encoding='utf-8'), filename=str(path))
          PY
      - name: Commit repaired source tree
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: own release integration runtime and locked interpreters"
          git push origin "HEAD:${GITHUB_REF_NAME}"
