name: wp08-attempt7-completion-reconcile

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt7-completion-reconcile-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact authoritative main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: c278dc81475455fdf98d9aa1823efd1b68271d3e
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Reconcile missed Attempt 7 workflow_run
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "c278dc81475455fdf98d9aa1823efd1b68271d3e"
          python -B scripts/wp08_release_recovery.py --mode reconcile
      - name: Verify durable ledger
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib import request
          repo=os.environ['GITHUB_REPOSITORY']
          req=request.Request(
              f'https://api.github.com/repos/{repo}/issues/454',
              headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f'Bearer {os.environ["GITHUB_TOKEN"]}',
                  'X-GitHub-Api-Version':'2022-11-28',
              },
          )
          with request.urlopen(req,timeout=30) as r:
              issue=json.load(r)
          body=str(issue.get('body') or '')
          block=body.split('<!-- WP08_RELEASE_RUN_STATE_BEGIN -->',1)[1].split('<!-- WP08_RELEASE_RUN_STATE_END -->',1)[0]
          state=json.loads(block.split('```json',1)[1].split('```',1)[0])
          assert state['attempt'] == 7, state
          assert state['status'] == 'FAILED_NEEDS_CLASSIFICATION', state
          assert int(state['current_wp08_run_id']) == 31448791975, state
          assert int(state['last_wp08_run_id']) == 31448791975, state
          assert state['last_wp08_conclusion'] == 'failure', state
          assert state['current_candidate_sha'] == 'c278dc81475455fdf98d9aa1823efd1b68271d3e', state
          assert state['production_closed'] is False, state
          assert not any(int(x.get('attempt') or 0) >= 8 and x.get('event') == 'wp08_dispatched' for x in state.get('history', [])), state
          print(json.dumps({'status':'PASS','attempt':7,'release_state':state['status'],'run_id':state['last_wp08_run_id'],'candidate_sha':state['current_candidate_sha']}, sort_keys=True))
          PY
