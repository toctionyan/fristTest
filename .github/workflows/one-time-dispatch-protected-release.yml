name: One-time dispatch protected release
run-name: Dispatch protected release after PR 38

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-dispatch-protected-release.yml

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Dispatch release and record run
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          jq -n '{
            ref: "main",
            inputs: {
              provider: "deepseek",
              model: "deepseek-v4-flash",
              embedding_model: "text-embedding-v4",
              embedding_dimension: "1024"
            }
          }' | gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
            --input -

          runs_api="repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=workflow_dispatch&head_sha=${target_sha}&per_page=10"
          run_id=""
          run_status=""
          run_url=""
          for _ in $(seq 1 30); do
            run_json="$(gh api "$runs_api")"
            run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$run_json")"
            if [ -n "$run_id" ]; then
              run_status="$(jq -r '.workflow_runs[0].status // "unknown"' <<<"$run_json")"
              run_url="$(jq -r '.workflow_runs[0].html_url // empty' <<<"$run_json")"
              break
            fi
            sleep 2
          done
          test -n "$run_id"

          body_file="${RUNNER_TEMP}/protected-release-dispatch.md"
          cat > "$body_file" <<EOF
          one-time-protected-release-dispatch:${GITHUB_RUN_ID}

          Target SHA: ${target_sha}
          Protected release run: ${run_id}
          Initial status: ${run_status}
          Protected release URL: ${run_url}
          Dispatcher run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue comment 33 --body-file "$body_file"
