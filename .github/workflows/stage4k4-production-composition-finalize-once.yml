      - name: Refresh protected source baseline fail-closed
        env:
          SOURCE_SHA: ${{ steps.source_commit.outputs.source_sha }}
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          baseline_path = root / "skill-system/registry/product-source-baseline.json"
          source_sha = os.environ["SOURCE_SHA"].strip()
          if len(source_sha) != 40 or subprocess.check_output(
              ["git", "rev-parse", "HEAD"], cwd=root, text=True
          ).strip() != source_sha:
              raise SystemExit("source_sha_identity_mismatch")

          payload = json.loads(baseline_path.read_text(encoding="utf-8"))
          previous = {str(k): str(v) for k, v in (payload.get("files") or {}).items()}
          if int(payload.get("file_count") or 0) != 601 or len(previous) != 601:
              raise SystemExit(
                  f"unexpected_previous_baseline:{payload.get('file_count')}/{len(previous)}"
              )
          protected_roots = tuple(str(v) for v in payload.get("protected_roots") or ())
          if protected_roots != ("services", "web", "contracts"):
              raise SystemExit(f"unexpected_protected_roots:{protected_roots!r}")

          raw = subprocess.check_output(
              ["git", "ls-files", "-z", "--", *protected_roots], cwd=root
          )
          tracked = sorted(item.decode("utf-8") for item in raw.split(b"\0") if item)
          current = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }

          changed = {
              path
              for path in set(current) & set(previous)
              if current[path] != previous[path]
          }
          added = set(current) - set(previous)
          removed = set(previous) - set(current)
          expected_changed = {
              "services/agent-service/.env.example",
              "services/agent-service/app/services/agent_service.py",
              "services/agent-service/app/services/readiness_service.py",
              "services/agent-service/pyproject.toml",
              "services/agent-service/requirements.txt",
              "services/agent-service/src/agent_core/runtime/dependency_authority_control.py",
              "services/agent-service/src/agent_core/runtime/dependency_authority_persistent_control.py",
              "services/agent-service/src/agent_core/runtime/dependency_authority_signed_provider.py",
              "services/agent-service/tests/runtime/test_typed_goal_dependency_control_provider_contract.py",
              "services/agent-service/tests/runtime/test_typed_goal_dependency_persistent_control.py",
              "services/agent-service/tests/runtime/test_typed_goal_dependency_signed_provider.py",
              "services/agent-service/uv.lock",
          }
          expected_added = {
              "services/agent-service/app/services/dependency_authority_composition.py",
              "services/agent-service/tests/runtime/test_typed_goal_dependency_production_composition.py",
          }
          if changed != expected_changed:
              raise SystemExit("unexpected_changed_existing:" + ",".join(sorted(changed)))
          if added != expected_added:
              raise SystemExit("unexpected_added:" + ",".join(sorted(added)))
          if removed:
              raise SystemExit("unexpected_removed:" + ",".join(sorted(removed)))
          if len(current) != 603:
              raise SystemExit(f"unexpected_protected_file_count:{len(current)}")

          payload["file_count"] = len(current)
          payload["files"] = dict(sorted(current.items()))
          payload["generated_at"] = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          payload["generated_from"] = "git:" + source_sha
          baseline_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "status": "PASS",
              "file_count": len(current),
              "generated_from": payload["generated_from"],
              "changed": sorted(changed),
              "added": sorted(added),
              "removed": sorted(removed),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Verify refreshed baseline contract
        run: python skill-system/tests/test_product_source_baseline_binding.py

      - name: Finalize baseline and remove one-shot workflow
        run: |
          git rm .github/workflows/stage4k4-production-composition-finalize-once.yml
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m "Refresh Stage4K4 production-composition protected baseline"
          git push origin HEAD:feat/stage4k4-production-composition-disabled-20260814

      - name: Dispatch final exact-SHA verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in quality.yml skill-self-validation.yml; do
            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d '{"ref":"feat/stage4k4-production-composition-disabled-20260814"}'
          done
