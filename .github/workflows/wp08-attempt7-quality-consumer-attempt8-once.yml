name: wp08-attempt7-quality-consumer-attempt8-once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  consume:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt7-quality-consumer-attempt8-once-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXPECTED_MAIN_SHA: f60e8092caf72487e52966f53be598935dcaeead
      RELEASE_ISSUE_NUMBER: '335'
      EXPECTED_RELEASE_ID: wp08-release-31340813528
      PARENT_WP08_RUN_ID: '31362503184'
      EXPECTED_REPAIR_PR: '399'
    steps:
      - name: Checkout exact authoritative main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Find exact-main push Quality
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python - <<'PY'
          import json, os, time
          from pathlib import Path
          from urllib import parse, request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; sha=os.environ['EXPECTED_MAIN_SHA']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          deadline=time.time()+8*60; last=None
          while time.time()<deadline:
              query=parse.urlencode({'event':'push','branch':'main','per_page':50})
              req=request.Request(f'https://api.github.com/repos/{repo}/actions/workflows/quality.yml/runs?{query}',headers=headers)
              with request.urlopen(req,timeout=30) as response: payload=json.load(response)
              matches=[r for r in payload.get('workflow_runs') or [] if str(r.get('head_sha') or '')==sha and str(r.get('head_branch') or '')=='main' and str(r.get('event') or '')=='push']
              if matches:
                  run=max(matches,key=lambda r:int(r.get('id') or 0))
                  last={'id':int(run.get('id') or 0),'status':str(run.get('status') or ''),'conclusion':str(run.get('conclusion') or '')}
                  print(json.dumps({'exact_main_quality':last,'candidate_sha':sha},sort_keys=True),flush=True)
                  if last['status']=='completed':
                      if last['conclusion']!='success': raise SystemExit('exact-main push Quality non-success: '+json.dumps(last,sort_keys=True))
                      Path('/tmp/wp08-quality-event.json').write_text(json.dumps({'workflow_run':run}),encoding='utf-8')
                      break
              time.sleep(15)
          else:
              raise SystemExit('timed out waiting for exact-main push Quality: '+json.dumps(last,sort_keys=True))
          PY
      - name: Consume Quality only if still waiting
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, subprocess
          from urllib import request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; n=int(os.environ['RELEASE_ISSUE_NUMBER'])
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          req=request.Request(f'https://api.github.com/repos/{repo}/issues/{n}',headers=headers)
          with request.urlopen(req,timeout=30) as response: issue=json.load(response)
          body=str(issue.get('body') or '')
          block=body.split('<!-- WP08_RELEASE_RUN_STATE_BEGIN -->',1)[1].split('<!-- WP08_RELEASE_RUN_STATE_END -->',1)[0]
          state=json.loads(block.split('```json',1)[1].split('```',1)[0])
          assert state.get('release_run_id')==os.environ['EXPECTED_RELEASE_ID'], state
          assert state.get('current_candidate_sha')==os.environ['EXPECTED_MAIN_SHA'], state
          status=state.get('status')
          if status=='CERTIFYING':
              if int(state.get('attempt') or 0)!=8:
                  raise SystemExit('already certifying but not Attempt 8')
              print(json.dumps({'status':'ALREADY_ADVANCED','attempt':8,'run_id':state.get('current_wp08_run_id')},sort_keys=True))
              raise SystemExit(0)
          if status!='WAITING_FOR_REPAIR_CI' or int(state.get('attempt') or 0)!=7:
              raise SystemExit('unexpected pre-consume release state: '+json.dumps({'status':status,'attempt':state.get('attempt')},sort_keys=True))
          if int(state.get('last_wp08_run_id') or 0)!=int(os.environ['PARENT_WP08_RUN_ID']):
              raise SystemExit('parent WP08 run mismatch')
          repair=state.get('repair_pr') or {}
          if int(repair.get('number') or 0)!=int(os.environ['EXPECTED_REPAIR_PR']) or repair.get('merge_commit_sha')!=os.environ['EXPECTED_MAIN_SHA']:
              raise SystemExit('repair binding mismatch')
          if state.get('production_closed') is not False:
              raise SystemExit('production closure changed before final certification')
          env=dict(os.environ)
          env['GITHUB_EVENT_PATH']='/tmp/wp08-quality-event.json'
          subprocess.run(['python','-B','scripts/wp08_release_coordinator.py','--mode','workflow-run','--event-path','/tmp/wp08-quality-event.json'],check=True,env=env)
          PY
      - name: Verify Attempt 8 exactly once
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib import request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']; n=int(os.environ['RELEASE_ISSUE_NUMBER'])
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          req=request.Request(f'https://api.github.com/repos/{repo}/issues/{n}',headers=headers)
          with request.urlopen(req,timeout=30) as response: issue=json.load(response)
          body=str(issue.get('body') or '')
          block=body.split('<!-- WP08_RELEASE_RUN_STATE_BEGIN -->',1)[1].split('<!-- WP08_RELEASE_RUN_STATE_END -->',1)[0]
          state=json.loads(block.split('```json',1)[1].split('```',1)[0])
          assert state.get('status')=='CERTIFYING', state
          assert int(state.get('attempt') or 0)==8, state
          assert state.get('current_candidate_sha')==os.environ['EXPECTED_MAIN_SHA'], state
          dispatches=[x for x in state.get('history') or [] if x.get('event')=='wp08_dispatched' and int(x.get('attempt') or 0)==8]
          assert len(dispatches)==1, dispatches
          assert int(state.get('current_wp08_run_id') or 0)==int(dispatches[0].get('wp08_run_id') or 0), state
          assert state.get('production_closed') is False, state
          print(json.dumps({'status':'PASS','attempt':8,'run_id':state['current_wp08_run_id'],'candidate_sha':state['current_candidate_sha']},sort_keys=True))
          PY
