name: temporary-agent-pytest-tail-diagnostic

on:
  push:
    branches:
      - architecture/v20.18-contract-owner-repair-rule-oracle-20260812

permissions:
  contents: write

concurrency:
  group: temporary-agent-pytest-tail-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: architecture/v20.18-contract-owner-repair-rule-oracle-20260812
          fetch-depth: 0

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'

      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups

      - name: Collect and probe final standard tests
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" - <<'PY'
          from __future__ import annotations

          import os
          import subprocess
          import tempfile
          from pathlib import Path

          import scripts.run_python_test_suites as runner

          root = Path.cwd()
          agent = root / "services/agent-service"
          py = agent / ".venv/bin/python"
          env = os.environ.copy()
          for key in tuple(env):
              if key.startswith(runner.STANDARD_CONFIG_PREFIXES):
                  env.pop(key, None)
          env.update(runner.STANDARD_ENV)
          env["PYTHONDONTWRITEBYTECODE"] = "1"
          env["PYTHONPATH"] = "src:." + (f":{env['PYTHONPATH']}" if env.get("PYTHONPATH") else "")
          env["COVERAGE_CORE"] = "sysmon"
          runtime = Path(tempfile.mkdtemp(prefix="pytest-tail-"))
          env.update({
              "SQLITE_DB_PATH": str(runtime / "agent.sqlite3"),
              "AGENT_DATABASE_URL": f"sqlite:///{runtime / 'agent.sqlite3'}",
              "DATABASE_URL": f"sqlite:///{runtime / 'agent.sqlite3'}",
              "CHECKPOINT_DB_PATH": str(runtime / "checkpoints.sqlite3"),
              "VECTOR_DB_PATH": str(runtime / "vector.sqlite3"),
              "UPLOAD_DIR": str(runtime / "uploads"),
              "BUSINESS_DB_PATH": str(runtime / "business.sqlite3"),
          })

          collect_cmd = [
              str(py), "-B", "-m", "pytest", "--collect-only", "-q",
              "-p", "no:cacheprovider", "-m", "not integration and not preprod",
          ]
          cp = subprocess.run(collect_cmd, cwd=agent, env=env, text=True, capture_output=True, check=True)
          nodeids = [line.strip() for line in cp.stdout.splitlines() if "::" in line and not line.lstrip().startswith("<")]
          print(f"COLLECTED_NODEIDS={len(nodeids)}")
          print("TAIL_NODEIDS_BEGIN")
          for i, nodeid in enumerate(nodeids[-20:], start=max(1, len(nodeids)-19)):
              print(f"{i}: {nodeid}")
          print("TAIL_NODEIDS_END")

          print("PROBE_BEGIN")
          for nodeid in nodeids[-8:]:
              print(f"PROBE {nodeid}", flush=True)
              cmd = [str(py), "-B", "-m", "pytest", "-vv", "-s", "-p", "no:cacheprovider", nodeid]
              try:
                  result = subprocess.run(cmd, cwd=agent, env=env, text=True, capture_output=True, timeout=45)
                  print(f"RESULT exit={result.returncode} nodeid={nodeid}")
                  if result.stdout:
                      print(result.stdout[-4000:])
                  if result.stderr:
                      print(result.stderr[-2000:])
              except subprocess.TimeoutExpired as exc:
                  print(f"RESULT TIMEOUT nodeid={nodeid}")
                  if exc.stdout:
                      print(str(exc.stdout)[-4000:])
                  if exc.stderr:
                      print(str(exc.stderr)[-2000:])
          print("PROBE_END")
          PY

      - name: Remove temporary diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/tmp-agent-pytest-tail-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary pytest tail diagnostic"
          git push origin HEAD:architecture/v20.18-contract-owner-repair-rule-oracle-20260812
