name: governed-ci-repair-stage2

on:
  workflow_run:
    workflows:
      - governed-ci-failure-ingest
    types: [completed]
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Exact failed Quality run ID already accepted by Stage 4A
        required: true
        type: string
      source_run_attempt:
        description: Exact source Quality run attempt
        required: false
        default: '1'
        type: string
      loop_feedback_run_id:
        description: Optional outer-loop coordinator run carrying a later-round feedback artifact
        required: false
        default: ''
        type: string
      loop_feedback_run_attempt:
        description: Exact outer-loop coordinator run attempt when loop_feedback_run_id is supplied
        required: false
        default: '1'
        type: string
      repair_round:
        description: Governed product repair round; workflow attempts and fixer cycles do not count
        required: false
        default: '1'
        type: string

permissions:
  contents: read
  actions: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: governed-ci-repair-stage2-${{ github.event.workflow_run.id || inputs.loop_feedback_run_id || inputs.source_run_id }}-${{ github.event.workflow_run.run_attempt || inputs.loop_feedback_run_attempt || inputs.source_run_attempt }}
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    outputs:
      control_sha: ${{ steps.control.outputs.control_sha }}
      repair_allowed: ${{ steps.inspect.outputs.repair_allowed }}
      head_sha: ${{ steps.inspect.outputs.head_sha }}
      source_run_id: ${{ steps.inspect.outputs.source_run_id }}
      source_run_attempt: ${{ steps.inspect.outputs.source_run_attempt }}
      failure_signature: ${{ steps.inspect.outputs.failure_signature }}
      input_artifact_pattern: ${{ steps.source.outputs.input_artifact_pattern }}
      input_run_id: ${{ steps.source.outputs.input_run_id }}
      input_kind: ${{ steps.source.outputs.input_kind }}
      input_artifact_id: ${{ steps.loop_artifact.outputs.input_artifact_id }}
      repair_round: ${{ steps.source.outputs.repair_round }}
    steps:
      - name: Checkout trusted Stage-2 control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Bind trusted Stage-2 control SHA
        id: control
        run: echo "control_sha=$(git -C control rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve governed Stage-2 input
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DISPATCH_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          LOOP_FEEDBACK_RUN_ID: ${{ inputs.loop_feedback_run_id }}
          LOOP_FEEDBACK_RUN_ATTEMPT: ${{ inputs.loop_feedback_run_attempt }}
          REPAIR_ROUND: ${{ inputs.repair_round }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            [[ "${WORKFLOW_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            echo "input_run_id=${WORKFLOW_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "input_artifact_pattern=governed-ci-failure-*" >> "$GITHUB_OUTPUT"
            echo "input_kind=stage1" >> "$GITHUB_OUTPUT"
            echo "repair_round=1" >> "$GITHUB_OUTPUT"
          elif [[ -n "${LOOP_FEEDBACK_RUN_ID}" ]]; then
            [[ "${DISPATCH_SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            [[ "${DISPATCH_SOURCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
            [[ "${LOOP_FEEDBACK_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            [[ "${LOOP_FEEDBACK_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
            [[ "${REPAIR_ROUND}" =~ ^[1-8]$ ]]
            echo "input_run_id=${LOOP_FEEDBACK_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "input_artifact_pattern=governed-repair-loop-feedback-${DISPATCH_SOURCE_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "input_kind=loop_feedback" >> "$GITHUB_OUTPUT"
            echo "repair_round=${REPAIR_ROUND}" >> "$GITHUB_OUTPUT"
          else
            [[ "${DISPATCH_SOURCE_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
            [[ "${DISPATCH_SOURCE_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
            echo "input_run_id=${DISPATCH_SOURCE_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "input_artifact_pattern=governed-ci-quality-stage1-${DISPATCH_SOURCE_RUN_ID}" >> "$GITHUB_OUTPUT"
            echo "input_kind=stage1" >> "$GITHUB_OUTPUT"
            echo "repair_round=1" >> "$GITHUB_OUTPUT"
          fi

      - name: Download approved Stage-1 governed evidence when present
        if: steps.source.outputs.input_kind == 'stage1'
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ${{ steps.source.outputs.input_artifact_pattern }}
          path: incoming
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.input_run_id }}

      - name: Download exact outer-loop feedback attempt
        if: steps.source.outputs.input_kind == 'loop_feedback'
        id: loop_artifact
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ steps.source.outputs.input_run_id }}
          INPUT_RUN_ATTEMPT: ${{ inputs.loop_feedback_run_attempt }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INPUT_RUN_ID}" > incoming/loop-run.json
          jq -e --arg attempt "${INPUT_RUN_ATTEMPT}" '
            .name == "governed-ci-repair-loop-coordinator"
            and .status == "completed"
            and .conclusion == "success"
            and ((.run_attempt | tostring) == $attempt)
          ' incoming/loop-run.json >/dev/null
          run_started_at=$(jq -r '.run_started_at // empty' incoming/loop-run.json)
          [[ -n "${run_started_at}" ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INPUT_RUN_ID}/artifacts?per_page=100" > incoming/loop-artifacts.json
          artifact_id=$(jq -r --arg started "${run_started_at}" --arg name "governed-repair-loop-feedback-${SOURCE_RUN_ID}" '[.artifacts[]
            | select(.expired == false)
            | select(.name == $name)
            | select(.created_at >= $started)]
            | sort_by(.created_at)
            | reverse
            | .[0].id // empty' incoming/loop-artifacts.json)
          [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > incoming/loop-feedback.zip
          unzip -q incoming/loop-feedback.zip -d incoming
          echo "input_artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Verify Stage-1 or outer-loop handoff
        id: inspect
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          DISPATCH_SOURCE_RUN_ATTEMPT: ${{ inputs.source_run_attempt }}
          INPUT_KIND: ${{ steps.source.outputs.input_kind }}
          REPAIR_ROUND: ${{ steps.source.outputs.repair_round }}
        run: |
          set -euo pipefail
          failure_case=$(find incoming -type f -name failure-case.json -print -quit 2>/dev/null || true)
          task_run=$(find incoming -type f -name task-run.json -print -quit 2>/dev/null || true)
          seed_patch=$(find incoming -type f -name seed.patch -print -quit 2>/dev/null || true)
          loop_state=$(find incoming -type f -name loop-state.json -print -quit 2>/dev/null || true)
          if [[ -z "${failure_case}" || -z "${task_run}" ]]; then
            echo "repair_allowed=false" >> "$GITHUB_OUTPUT"
            echo "head_sha=" >> "$GITHUB_OUTPUT"
            echo "source_run_id=" >> "$GITHUB_OUTPUT"
            echo "source_run_attempt=" >> "$GITHUB_OUTPUT"
            echo "failure_signature=" >> "$GITHUB_OUTPUT"
            echo "No governed failure artifact was produced by Stage 1; Stage 2 skipped." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          "${pythonLocation}/bin/python" - "$failure_case" "$task_run" "$GITHUB_OUTPUT" "${EVENT_NAME}" "${DISPATCH_SOURCE_RUN_ID}" "${DISPATCH_SOURCE_RUN_ATTEMPT}" "${INPUT_KIND}" "${REPAIR_ROUND}" "${seed_patch}" "${loop_state}" <<'PY'
          import json
          import sys
          from pathlib import Path

          failure_path, task_path, output_path = map(Path, sys.argv[1:4])
          event_name, dispatch_run_id, dispatch_run_attempt, input_kind, repair_round = sys.argv[4:9]
          seed_patch_raw, loop_state_raw = sys.argv[9:11]
          failure = json.loads(failure_path.read_text(encoding="utf-8"))
          task = json.loads(task_path.read_text(encoding="utf-8"))
          if failure.get("schema") != "github-failure-ingest@1" or failure.get("status") != "INGESTED":
              raise SystemExit("invalid Stage-1 failure-case contract")
          binding = task.get("binding") if isinstance(task.get("binding"), dict) else {}
          expected = {
              "repository": failure.get("repository"),
              "workflow_run_id": str(failure.get("workflow_run_id")),
              "workflow_run_attempt": str(failure.get("workflow_run_attempt")),
              "head_sha": failure.get("head_sha"),
              "failure_signature": failure.get("failure_signature"),
          }
          for key, value in expected.items():
              if str(binding.get(key)) != str(value):
                  raise SystemExit(f"Stage-1 TaskRun binding mismatch: {key}")
          if event_name == "workflow_dispatch":
              if str(failure.get("workflow_run_id")) != dispatch_run_id:
                  raise SystemExit("approved source Run ID does not match governed evidence")
              if str(failure.get("workflow_run_attempt")) != dispatch_run_attempt:
                  raise SystemExit("approved source run attempt does not match governed evidence")
          if input_kind == "loop_feedback":
              if not seed_patch_raw or not Path(seed_patch_raw).is_file():
                  raise SystemExit("outer-loop feedback is missing seed.patch")
              if not loop_state_raw or not Path(loop_state_raw).is_file():
                  raise SystemExit("outer-loop feedback is missing loop-state.json")
              loop = json.loads(Path(loop_state_raw).read_text(encoding="utf-8"))
              feedback = failure.get("loop_feedback") if isinstance(failure.get("loop_feedback"), dict) else {}
              if loop.get("schema") != "github-governed-repair-loop@1":
                  raise SystemExit("invalid outer-loop state schema")
              if feedback.get("schema") != "github-governed-repair-feedback@1":
                  raise SystemExit("invalid outer-loop feedback schema")
              if loop.get("action") != "DISPATCH_REPAIR":
                  raise SystemExit("outer-loop state did not authorize another product repair")
              if str(loop.get("source_run_id")) != dispatch_run_id:
                  raise SystemExit("outer-loop state source run mismatch")
              if int(feedback.get("next_repair_round") or 0) != int(repair_round):
                  raise SystemExit("outer-loop next repair round mismatch")
              if int(loop.get("next_repair_round") or 0) != int(repair_round):
                  raise SystemExit("outer-loop dispatch round mismatch")
          repair_allowed = bool(
              failure.get("repair_allowed") is True
              and failure.get("same_repository") is True
              and failure.get("classification") == "code_or_contract"
              and failure.get("candidate_paths")
              and not str(failure.get("head_branch") or "").startswith("governed-repair/")
          )
          with output_path.open("a", encoding="utf-8") as handle:
              handle.write(f"repair_allowed={'true' if repair_allowed else 'false'}\n")
              handle.write(f"head_sha={failure.get('head_sha', '')}\n")
              handle.write(f"source_run_id={failure.get('workflow_run_id', '')}\n")
              handle.write(f"source_run_attempt={failure.get('workflow_run_attempt', '')}\n")
              handle.write(f"failure_signature={failure.get('failure_signature', '')}\n")
          PY

  repair:
    needs: inspect
    if: needs.inspect.outputs.repair_allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    environment: production-certification
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout bound Stage-2 control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.inspect.outputs.control_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout failed candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.inspect.outputs.head_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Download Stage-1 governed repair input
        if: needs.inspect.outputs.input_kind == 'stage1'
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: ${{ needs.inspect.outputs.input_artifact_pattern }}
          path: incoming
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.inspect.outputs.input_run_id }}

      - name: Download exact outer-loop repair feedback artifact
        if: needs.inspect.outputs.input_kind == 'loop_feedback'
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_ARTIFACT_ID: ${{ needs.inspect.outputs.input_artifact_id }}
        run: |
          set -euo pipefail
          [[ "${INPUT_ARTIFACT_ID}" =~ ^[1-9][0-9]*$ ]]
          mkdir -p incoming
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${INPUT_ARTIFACT_ID}/zip" > incoming/loop-feedback.zip
          unzip -q incoming/loop-feedback.zip -d incoming

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Set up locked Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Run bounded restricted repair controller
        id: repair
        env:
          GOVERNED_REPAIR_MODEL_PROVIDER: ${{ vars.REAL_MODEL_CERTIFICATION_PROVIDER || vars.PRODUCTION_MODEL_PROVIDER || vars.MODEL_PROVIDER || 'deepseek' }}
          GOVERNED_REPAIR_MODEL: ${{ vars.OPENAI_MODEL || vars.PRODUCTION_MODEL_ID || vars.MODEL_ID || 'deepseek-v4-flash' }}
          GOVERNED_REPAIR_MODEL_API_BASE: ${{ vars.OPENAI_API_BASE || vars.PRODUCTION_MODEL_API_BASE || vars.MODEL_API_BASE || 'https://api.deepseek.com' }}
          GOVERNED_REPAIR_MODEL_API_KEY: ${{ secrets.PRODUCTION_MODEL_API_KEY }}
          REPAIR_ROUND: ${{ needs.inspect.outputs.repair_round }}
        run: |
          set -euo pipefail
          failure_case=$(find incoming -type f -name failure-case.json -print -quit)
          task_run=$(find incoming -type f -name task-run.json -print -quit)
          seed_patch=$(find incoming -type f -name seed.patch -print -quit 2>/dev/null || true)
          [[ -n "${failure_case}" && -n "${task_run}" ]]
          mkdir -p stage2-evidence
          cp "${task_run}" stage2-evidence/task-run.json
          echo "task_run=stage2-evidence/task-run.json" >> "$GITHUB_OUTPUT"
          args=(
            --workspace candidate
            --failure-case "${failure_case}"
            --task-run stage2-evidence/task-run.json
            --evidence-root stage2-evidence
            --max-cycles 8
            --repair-round "${REPAIR_ROUND}"
            --max-repair-rounds 8
          )
          if [[ -n "${seed_patch}" ]]; then
            args+=(--seed-patch "${seed_patch}")
          fi
          "${pythonLocation}/bin/python" -B control/scripts/github_repair_orchestrator_control_plane.py "${args[@]}"
          "${pythonLocation}/bin/python" -B control/scripts/github_stage2_handoff.py \
            --failure-case "${failure_case}" \
            --result stage2-evidence/repair-result.json \
            --patch stage2-evidence/repair.patch

      - name: Build redacted Stage-2 public summary
        if: always()
        env:
          STAGE2_RUN_ID: ${{ github.run_id }}
          STAGE2_RUN_ATTEMPT: ${{ github.run_attempt }}
          REPAIR_ROUND: ${{ needs.inspect.outputs.repair_round }}
          INPUT_KIND: ${{ needs.inspect.outputs.input_kind }}
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B - <<'PY'
          import json
          import os
          import re
          import sys
          from pathlib import Path

          sys.path.insert(0, str(Path("control/scripts").resolve()))
          from github_failure_ingest import redact

          stage2_run_id = os.environ["STAGE2_RUN_ID"]
          stage2_run_attempt = os.environ["STAGE2_RUN_ATTEMPT"]
          repair_round = int(os.environ["REPAIR_ROUND"])
          input_kind = os.environ["INPUT_KIND"]

          result_path = Path("stage2-evidence/repair-result.json")
          payload = {}
          if result_path.is_file():
              try:
                  loaded = json.loads(result_path.read_text(encoding="utf-8"))
                  if isinstance(loaded, dict):
                      payload = loaded
              except json.JSONDecodeError:
                  payload = {}
          code = re.sub(r"[^A-Z0-9_]+", "_", str(payload.get("code") or "UNKNOWN").upper()).strip("_")[:80] or "UNKNOWN"
          reason = redact(str(payload.get("reason") or "not_provided"))
          reason = " ".join(reason.replace("\r", " ").replace("\n", " ").split())[:1000] or "not_provided"
          summary = {
              "schema": "github-stage2-public-summary@1",
              "stage2_run_id": stage2_run_id,
              "stage2_run_attempt": stage2_run_attempt,
              "repair_round": repair_round,
              "input_kind": input_kind,
              "status": str(payload.get("status") or "BLOCKED")[:80],
              "code": code,
              "reason": reason,
              "changed_paths": payload.get("changed_paths") if isinstance(payload.get("changed_paths"), list) else [],
              "stage3_handoff_bound": payload.get("stage3_handoff_bound") is True,
              "production_closed": False,
          }
          output = Path("stage2-evidence/public-summary.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(summary, ensure_ascii=False, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Upload Stage-2 repair candidate evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-ci-repair-stage2-${{ needs.inspect.outputs.source_run_id }}
          path: stage2-evidence
          retention-days: 30
          if-no-files-found: error

      - name: Update governed failure issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.inspect.outputs.source_run_id }}
          STAGE2_RUN_ID: ${{ github.run_id }}
          STAGE2_RUN_ATTEMPT: ${{ github.run_attempt }}
          REPAIR_ROUND: ${{ needs.inspect.outputs.repair_round }}
          INPUT_KIND: ${{ needs.inspect.outputs.input_kind }}
        run: |
          set -euo pipefail
          issue=$(gh issue list --state open --search "[governed-ci-failure] run ${SOURCE_RUN_ID} in:title" \
            --json number --jq '.[0].number // empty')
          status="BLOCKED"
          code="UNKNOWN"
          reason="not_provided"
          changed_paths="[]"
          handoff_bound="false"
          if [[ -f stage2-evidence/public-summary.json ]]; then
            status=$(jq -r '.status // "BLOCKED"' stage2-evidence/public-summary.json)
            code=$(jq -r '.code // "UNKNOWN"' stage2-evidence/public-summary.json)
            reason=$(jq -r '.reason // "not_provided"' stage2-evidence/public-summary.json)
            changed_paths=$(jq -c '.changed_paths // []' stage2-evidence/public-summary.json)
            handoff_bound=$(jq -r '.stage3_handoff_bound // false' stage2-evidence/public-summary.json)
          fi
          body=$(cat <<EOF
          Stage 2 completed for source run \`${SOURCE_RUN_ID}\`.

          - Stage-2 workflow run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${STAGE2_RUN_ID}
          - Stage-2 Run ID / attempt: \`${STAGE2_RUN_ID}/${STAGE2_RUN_ATTEMPT}\`
          - Governed repair round: \`${REPAIR_ROUND}/8\`
          - Input kind: \`${INPUT_KIND}\`
          - Status: \`${status}\`
          - Code: \`${code}\`
          - Redacted reason: \`${reason}\`
          - Changed paths: \`${changed_paths}\`
          - Stage-3 handoff bound: \`${handoff_bound}\`
          - Evidence artifact: \`governed-ci-repair-stage2-${SOURCE_RUN_ID}\`
          - Full targeted/Quick regression: not yet performed
          - Branch pushed: no
          - Draft PR created: no
          - production_closed: false

          A \`REPAIR_CANDIDATE_READY\` result is only a local candidate for Stage 3 independent validation.
          Fixer cycles are internal to this repair round and do not consume additional global repair rounds.
          EOF
          )
          if [[ -n "${issue}" ]]; then
            gh issue comment "${issue}" --body "${body}"
          else
            gh issue create --title "[governed-ci-repair-stage2] run ${SOURCE_RUN_ID}" --body "${body}"
          fi
