name: temporary-wp08-reconcile-31657854963

"on":
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: read
  actions: write

jobs:
  dispatch:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'ops/wp08-authorize-20260813-0926'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Reconcile completed WP-08 Attempt 1 into durable ledger
        env:
          GH_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          payload='{"ref":"main","inputs":{"operation":"reconcile"}}'
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${API_URL}/repos/${REPOSITORY}/actions/workflows/wp08-release-coordinator.yml/dispatches" \
            -d "${payload}"
