name: B28 Governed Import Correction
run-name: Apply verified B28 repository import correction

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .b28-publisher-trigger

permissions:
  contents: write

env:
  B28_UPGRADE_BRANCH: agent/b28-repository-onboarding
  B28_EXPECTED_HEAD: 6e22385a06763dbfcf602d43151221c454a53f33
  B28_STABLE_HEAD: 03484367b072fe82d189d79f9287e95592c2ed11
  CORRECTION_ZST_SHA256: 99129c5c474e6deb5a440693f810decd50e928e9854acd8e2d15aa65e2b16432
  CORRECTION_TAR_SHA256: 1342275712e254753518c1dba3567c6f43b1f7660a20e6254d121da3ba3917bb
  B28_FINAL_TREE: 753c01b000fa51754879b7c46620294ab3dd603d

jobs:
  apply-verified-import-correction:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/b28-publisher-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable B28 transport head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.B28_EXPECTED_HEAD }}
          fetch-depth: 2
          clean: true
          persist-credentials: true

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.1.0
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Verify and apply immutable correction overlay
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$B28_EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = "$B28_STABLE_HEAD"
          test "$(find .b28-import-correction -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" = "5"
          for part in 00 01 02 03 04; do
            test -f ".b28-import-correction/part-${part}"
          done

          cat .b28-import-correction/part-* | base64 --decode > /tmp/b28-import-correction.tar.zst
          echo "$CORRECTION_ZST_SHA256  /tmp/b28-import-correction.tar.zst" | sha256sum -c -
          command -v zstd >/dev/null
          zstd -q -d /tmp/b28-import-correction.tar.zst -o /tmp/b28-import-correction.tar
          echo "$CORRECTION_TAR_SHA256  /tmp/b28-import-correction.tar" | sha256sum -c -

          if tar -tf /tmp/b28-import-correction.tar | grep -Eq '(^/|(^|/)\.\.(/|$))'; then
            echo 'Unsafe path found in correction archive.' >&2
            exit 1
          fi

          rm -rf .b28-import-correction
          tar -xf /tmp/b28-import-correction.tar -C .

          if find . -type f -name '.env' -print -quit | grep -q .; then
            echo 'A real .env file was found in the corrected candidate.' >&2
            exit 1
          fi
          if find . -type d \( -name '.pytest_cache' -o -name '__pycache__' -o -name '.venv' -o -name 'venv' -o -name 'node_modules' \) -print -quit | grep -q .; then
            echo 'A generated dependency or cache directory was found.' >&2
            exit 1
          fi

      - name: Revalidate governance and static quality authority
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/verify_task_ledger.py
          python -B skill-system/controller/profile_runner.py skill-control-plane
          python -B scripts/quality_toolchain_contract.py --static-only
          python -B scripts/quality_loop.py --mode static

      - name: Commit and publish corrected B28 candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .quality
          git add -A
          test "$(git write-tree)" = "$B28_FINAL_TREE"
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git commit -m 'Persist evidence and repository baseline required by B28'
          test "$(git rev-parse HEAD^{tree})" = "$B28_FINAL_TREE"
          git push --force-with-lease=refs/heads/${B28_UPGRADE_BRANCH}:$B28_EXPECTED_HEAD \
            origin HEAD:${B28_UPGRADE_BRANCH}
