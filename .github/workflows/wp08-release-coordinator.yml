name: wp08-release-coordinator

"on":
  workflow_dispatch:
    inputs:
      operation:
        description: Authorize a new ReleaseRun or reconcile the active one
        required: true
        default: authorize
        type: choice
        options:
          - authorize
          - reconcile
  schedule:
    - cron: '2-59/5 * * * *'
  issue_comment:
    types:
      - created
  push:
    branches:
      - main
    paths:
      - governance/release-runs/wp08-bootstrap-*.json
  pull_request:
    branches:
      - main
    types:
      - closed
  workflow_run:
    workflows:
      - quality
      - wp08-full-stack-certification
    types:
      - completed

permissions:
  contents: read
  actions: write
  issues: write
  pull-requests: read

concurrency:
  group: wp08-release-coordinator
  cancel-in-progress: false

jobs:
  coordinate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Coordinate authorized WP-08 release run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WP08_COORDINATOR_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            workflow_dispatch)
              case "${WP08_COORDINATOR_OPERATION:-authorize}" in
                authorize)
                  python -B scripts/wp08_release_coordinator.py --mode authorize
                  ;;
                reconcile)
                  python -B scripts/wp08_release_recovery.py --mode reconcile
                  ;;
                *)
                  echo "Unsupported workflow_dispatch operation: ${WP08_COORDINATOR_OPERATION}" >&2
                  exit 2
                  ;;
              esac
              ;;
            schedule)
              python -B scripts/wp08_release_recovery.py --mode reconcile
              ;;
            issue_comment)
              python -B scripts/wp08_release_recovery.py --mode issue-comment
              ;;
            push)
              python -B scripts/wp08_release_coordinator.py --mode bootstrap
              ;;
            pull_request)
              python -B scripts/wp08_release_coordinator.py --mode pull-request
              ;;
            workflow_run)
              python -B scripts/wp08_release_coordinator.py --mode workflow-run
              ;;
            *)
              echo "Unsupported coordinator event: $GITHUB_EVENT_NAME" >&2
              exit 2
              ;;
          esac
