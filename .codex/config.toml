
[features]
hooks = true

[[hooks.PreToolUse]]
matcher = "^(Bash|apply_patch|Edit|Write)$"
[[hooks.PreToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/skill-system/hooks/pre_tool_use.py"'
timeout = 30
statusMessage = "Checking Skill change scope"

[[hooks.PostToolUse]]
matcher = "^(Bash|apply_patch|Edit|Write)$"
[[hooks.PostToolUse.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/skill-system/hooks/post_tool_use.py"'
timeout = 60
statusMessage = "Validating Skill change"

[[hooks.Stop]]
[[hooks.Stop.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/skill-system/hooks/stop_guard.py"'
timeout = 60
statusMessage = "Checking completion evidence"
