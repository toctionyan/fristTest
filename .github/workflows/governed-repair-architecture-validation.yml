name: governed-repair-architecture-validation

on:
  push:
    branches:
      - architecture/governed-repair-rca-write-grant-20260816
    paths:
      - .github/governed-repair-architecture-validation-trigger

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: architecture/governed-repair-rca-write-grant-20260816
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Compile governed repair control plane
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/github_failure_ingest.py \
            scripts/github_repair_authority.py \
            scripts/github_repair_rca.py \
            scripts/github_repair_orchestrator_control_plane.py \
            scripts/github_repair_orchestrator.py \
            scripts/github_agent_fixer.py \
            scripts/github_stage2_handoff.py \
            scripts/github_repair_stage3.py \
            scripts/github_repair_stage3_tree.py \
            scripts/github_repair_stage3_publish.py \
            scripts/github_repair_stage3_record_publication.py \
            scripts/github_repair_governance.py \
            scripts/github_repair_baseline_acceptance.py \
            scripts/github_repair_exact_head.py \
            scripts/verify_product_source_baseline.py
      - name: Prove protected control boundaries
        run: |
          set -euo pipefail
          test ! -e scripts/github_repair_stage3_complete.py
          test ! -e .github/workflows/b28-product-baseline-refresh.yml
          ! grep -F 'task.complete(' scripts/github_repair_stage3.py
          ! grep -F 'generate_product_source_baseline.py' scripts/github_repair_stage3_tree.py
          ! grep -F '|| true' .github/workflows/governed-ci-repair-governance.yml
          grep -F 'STAGE4_GOVERNANCE_REQUIRED' scripts/github_repair_stage3_record_publication.py
          grep -F 'STAGE5_BASELINE_ACCEPTANCE_REQUIRED' scripts/github_repair_governance.py
          grep -F 'STAGE6_EXACT_HEAD_CERTIFICATION_REQUIRED' scripts/github_repair_baseline_acceptance.py
          grep -F 'READY_FOR_REVIEW' scripts/github_repair_exact_head.py
      - name: Run focused governed repair tests
        run: |
          set -euo pipefail
          for pattern in \
            test_github_failure_ingest.py \
            test_github_repair_authority.py \
            test_github_repair_rca.py \
            test_github_repair_stage3_authority.py \
            test_github_repair_governance.py; do
            python -B -m unittest discover -v -s skill-system/tests -p "${pattern}"
          done
      - name: Verify current protected product baseline remains untouched
        run: |
          set -euo pipefail
          python -B scripts/verify_product_source_baseline.py \
            --workspace . \
            --output /tmp/product-source-baseline-verification.json
          python - <<'PY'
          import json
          payload = json.load(open('/tmp/product-source-baseline-verification.json', encoding='utf-8'))
          assert payload['status'] == 'PASS', payload
          assert payload['drift_paths'] == [], payload
          PY
      - name: Validate workflow YAML syntax with PyYAML from locked agent environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: \
            -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups
          cd ../..
          services/agent-service/.venv/bin/python - <<'PY'
          import pathlib, yaml
          for raw in (
              '.github/workflows/governed-ci-repair-stage3.yml',
              '.github/workflows/governed-ci-repair-governance.yml',
          ):
              payload = yaml.safe_load(pathlib.Path(raw).read_text(encoding='utf-8'))
              assert isinstance(payload, dict) and payload.get('jobs'), raw
          PY
