name: typed-goal-stage4k1-final-dispatch-once

on:
  push:
    branches:
      - feat/typed-goal-graph-foundation-20260814

permissions:
  contents: write
  actions: write

jobs:
  dispatch-final-verification:
    runs-on: ubuntu-24.04
    if: github.repository == 'toctionyan/fristTest'
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: feat/typed-goal-graph-foundation-20260814

      - name: Verify bootstrap surface
        env:
          EXPECTED_PARENT: d68e3418b82da5e0af2fac9323a53e323f47ddce
          WORKFLOW_PATH: .github/workflows/typed-goal-stage4k1-final-dispatch-once.yml
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          changed="$(git diff --name-only "$EXPECTED_PARENT"..HEAD)"
          test "$changed" = "$WORKFLOW_PATH"
          git diff --check "$EXPECTED_PARENT"..HEAD

      - name: Remove dispatcher and freeze clean final HEAD
        env:
          WORKFLOW_PATH: .github/workflows/typed-goal-stage4k1-final-dispatch-once.yml
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm "$WORKFLOW_PATH"
          git diff --cached --check
          git commit -m "Remove Stage4K1 final dispatcher"
          git push origin HEAD:feat/typed-goal-graph-foundation-20260814
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch exact-final-SHA quality and self-validation
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: feat/typed-goal-graph-foundation-20260814
        run: |
          set -euo pipefail
          for workflow in quality.yml skill-self-validation.yml; do
            curl --fail-with-body --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/toctionyan/fristTest/actions/workflows/${workflow}/dispatches" \
              -d "{\"ref\":\"${BRANCH}\"}"
          done
          echo "Dispatched quality and skill-self-validation for ${FINAL_SHA}"
