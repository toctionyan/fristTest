name: quality

on:
  pull_request:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  c4-deterministic-strong-context-browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked runtime and browser
        run: |
          cd services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups
          cd ../agent-service/frontend && npm ci --ignore-scripts=false
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Replay Attempt-8 strong-context journey in Chromium
        env:
          PRODUCT_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/c4-browser
        run: |
          set -o pipefail
          services/agent-service/.venv/bin/python -B scripts/verify_product_browser_journey.py \
            --journey strong-context --model-mode deterministic \
            2>&1 | tee "${RUNNER_TEMP}/c4-strong-context.log"
      - name: Upload C4 browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: c4-deterministic-strong-context-browser
          path: |
            ${{ runner.temp }}/c4-browser
            ${{ runner.temp }}/c4-strong-context.log
          if-no-files-found: warn
