name: WP08 Repair Product Baseline Refresh
run-name: Refresh protected source baseline for PR 722

"on":
  push:
    branches: [fix/wp08-single-authority-cutover-20260813]
    paths: [.wp08-baseline-refresh-trigger]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Verify governed repair delta and refresh baseline
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          cat > /tmp/expected-pr-paths.txt <<'EOF'
          services/agent-service/src/agent_core/lifecycle/goal_planning.py
          services/agent-service/src/agent_core/lifecycle/protocol.py
          services/agent-service/src/agent_core/lifecycle/tool_execution_runtime.py
          services/agent-service/src/agent_core/runtime/capability_gate.py
          services/agent-service/src/agent_core/runtime/semantic_capability_verifier.py
          services/agent-service/tests/architecture/test_semantic_single_writer_invariants.py
          services/agent-service/tests/context/test_conversation_regression_suite_execution.py
          services/agent-service/tests/context/test_scenario_topology.py
          services/agent-service/tests/context/test_semantic_goal_coverage_suite_execution.py
          services/agent-service/tests/runtime/test_unsupported_capability_surface_binding.py
          services/agent-service/tests/runtime/test_wp08_attempt3_single_authority_repairs.py
          services/agent-service/tests/support/canonical_semantic_fixture.py
          skill-system/registry/product-source-baseline.json
          EOF
          git diff --name-only origin/main...HEAD \
            | grep -v -E '^(\.github/workflows/b28-product-baseline-refresh\.yml|\.wp08-baseline-refresh-trigger)$' \
            | sort > /tmp/actual-pr-paths.txt
          sort -o /tmp/expected-pr-paths.txt /tmp/expected-pr-paths.txt
          diff -u /tmp/expected-pr-paths.txt /tmp/actual-pr-paths.txt

          python -B - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          baseline_path = root / "skill-system/registry/product-source-baseline.json"
          payload = json.loads(baseline_path.read_text(encoding="utf-8"))
          protected_roots = tuple(str(item) for item in payload["protected_roots"])
          raw = subprocess.check_output(["git", "ls-files", "-z", "--", *protected_roots], cwd=root)
          tracked = sorted(item.decode("utf-8") for item in raw.split(b"\0") if item)
          current = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          payload["generated_from"] = "git:" + os.environ["SOURCE_SHA"]
          payload["generated_at"] = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          payload["file_count"] = len(current)
          payload["files"] = dict(sorted(current.items()))
          baseline_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "status": "PASS",
              "generated_from": payload["generated_from"],
              "file_count": len(current),
          }, ensure_ascii=False, indent=2))
          PY

          git diff --check -- skill-system/registry/product-source-baseline.json
          git diff --name-only -- skill-system/registry/product-source-baseline.json | grep -qx 'skill-system/registry/product-source-baseline.json'

      - name: Validate refreshed protected snapshot
        shell: bash
        run: |
          set -euo pipefail
          python -B -m unittest skill-system.tests.test_product_source_baseline_binding

      - name: Publish baseline only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git diff --name-only)" = 'skill-system/registry/product-source-baseline.json'
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m 'Refresh WP08 repair protected source baseline'
          git push origin HEAD:fix/wp08-single-authority-cutover-20260813
