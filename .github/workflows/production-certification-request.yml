name: protected-production-certification-request

"on":
  push:
    branches:
      - main
    paths:
      - .github/production-certification-request.json

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: protected-production-certification-request-main
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/main' && github.ref_protected == true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EVENT_SHA: ${{ github.sha }}
    steps:
      - name: Validate request and dispatch exact protected main
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          import os
          import re
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          event_sha = os.environ["EVENT_SHA"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "protected-production-certification-request",
          }

          def request(method: str, url: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  return exc.code, body

          def comment(issue_number: int, body: str) -> None:
              status, response = request(
                  "POST",
                  f"{api}/issues/{issue_number}/comments",
                  {"body": body},
              )
              if status != 201:
                  print(f"warning: comment failed: HTTP {status}: {response}")

          encoded_path = urllib.parse.quote(
              ".github/production-certification-request.json",
              safe="",
          )
          status, content_payload = request(
              "GET",
              f"{api}/contents/{encoded_path}?ref={event_sha}",
          )
          if status != 200 or not isinstance(content_payload, dict):
              raise SystemExit(f"request ledger unavailable at event SHA: HTTP {status}")
          raw = base64.b64decode(str(content_payload.get("content") or ""))
          payload = json.loads(raw.decode("utf-8"))

          required = {
              "schema_version",
              "request_id",
              "provider",
              "model",
              "embedding_model",
              "embedding_dimension",
              "comment_issue",
          }
          if set(payload) != required:
              raise SystemExit(
                  f"request ledger fields differ: expected={sorted(required)}, actual={sorted(payload)}"
              )
          if payload["schema_version"] != 1:
              raise SystemExit("unsupported production request schema")
          request_id = str(payload["request_id"])
          if not re.fullmatch(r"production-certification-[0-9]{8}-[0-9]{3}", request_id):
              raise SystemExit("invalid production request_id")
          provider = str(payload["provider"])
          if provider not in {"openai", "deepseek"}:
              raise SystemExit("provider must be openai or deepseek")
          model = str(payload["model"]).strip()
          embedding_model = str(payload["embedding_model"]).strip()
          embedding_dimension = str(payload["embedding_dimension"]).strip()
          issue_number = int(payload["comment_issue"])
          if not model or any(character.isspace() for character in model):
              raise SystemExit("model must be a non-empty provider model ID")
          if not embedding_model or any(character.isspace() for character in embedding_model):
              raise SystemExit("embedding_model must be a non-empty model ID")
          if not embedding_dimension.isdigit() or int(embedding_dimension) <= 0:
              raise SystemExit("embedding_dimension must be a positive integer string")
          if issue_number <= 0:
              raise SystemExit("comment_issue must be positive")

          status, ref_payload = request("GET", f"{api}/git/ref/heads/main")
          if status != 200 or not isinstance(ref_payload, dict):
              comment(issue_number, f"PRODUCTION_REQUEST_FAILED `{request_id}`: main ref unavailable")
              raise SystemExit(f"failed to resolve main ref: HTTP {status}")
          current_main = str(((ref_payload.get("object") or {}).get("sha") or ""))
          if current_main != event_sha:
              comment(
                  issue_number,
                  f"PRODUCTION_REQUEST_REJECTED `{request_id}`: event SHA `{event_sha}` is not current main `{current_main}`.",
              )
              raise SystemExit("main moved before production dispatch")

          dispatch_payload = {
              "ref": "main",
              "inputs": {
                  "provider": provider,
                  "model": model,
                  "embedding_model": embedding_model,
                  "embedding_dimension": embedding_dimension,
              },
          }
          status, response = request(
              "POST",
              f"{api}/actions/workflows/release.yml/dispatches",
              dispatch_payload,
          )
          if status != 204:
              comment(
                  issue_number,
                  f"PRODUCTION_REQUEST_FAILED `{request_id}` on `{event_sha}`: workflow dispatch HTTP `{status}`.",
              )
              raise SystemExit(f"workflow dispatch failed: HTTP {status}: {response}")

          run = None
          for _ in range(90):
              query = urllib.parse.urlencode({
                  "event": "workflow_dispatch",
                  "branch": "main",
                  "per_page": 20,
              })
              status, runs_payload = request(
                  "GET",
                  f"{api}/actions/workflows/release.yml/runs?{query}",
              )
              if status == 200 and isinstance(runs_payload, dict):
                  for candidate in runs_payload.get("workflow_runs") or []:
                      if str(candidate.get("head_sha") or "") == event_sha:
                          run = candidate
                          break
              if run is not None:
                  break
              time.sleep(2)

          if run is None:
              comment(
                  issue_number,
                  f"PRODUCTION_REQUEST_PENDING `{request_id}` on `{event_sha}`: dispatch accepted, Run ID not observed before timeout.",
              )
              raise SystemExit("dispatch accepted but matching run was not observed")

          run_id = int(run["id"])
          run_url = str(run.get("html_url") or f"https://github.com/{repo}/actions/runs/{run_id}")
          comment(
              issue_number,
              "PRODUCTION_REQUEST_DISPATCHED\n\n"
              f"- request_id: `{request_id}`\n"
              f"- certified_main_sha: `{event_sha}`\n"
              f"- production_run_id: `{run_id}`\n"
              f"- run: {run_url}",
          )
          print(json.dumps({
              "status": "DISPATCHED",
              "request_id": request_id,
              "main_sha": event_sha,
              "run_id": run_id,
              "run_url": run_url,
          }))
          PY
