name: B29 Product Baseline Refresh
run-name: Bind service AGENTS files into the product baseline

"on":
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [agent/b28-repository-onboarding]
    paths:
      - .github/workflows/b29-product-baseline-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/b29-codex-multi-agent-governance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact B29 head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: true

      - name: Refresh only the two service instruction records
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd().resolve()
          baseline_path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(baseline_path.read_text(encoding='utf-8'))
          old_files = {str(key): str(value) for key, value in payload['files'].items()}

          ignored = {'.venv', 'node_modules', '__pycache__'}
          current: dict[str, str] = {}
          for name in ('services', 'web', 'contracts'):
              protected_root = root / name
              if not protected_root.exists():
                  continue
              for path in sorted(item for item in protected_root.rglob('*') if item.is_file()):
                  if any(part in ignored for part in path.parts):
                      continue
                  current[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()

          changed = sorted(path for path in set(old_files) | set(current) if old_files.get(path) != current.get(path))
          expected = [
              'services/agent-service/AGENTS.md',
              'services/business-service/AGENTS.md',
          ]
          if changed != expected:
              raise SystemExit(f'unexpected protected product delta: {changed}')
          if len(old_files) != 535 or len(current) != 537:
              raise SystemExit(f'unexpected product baseline counts: old={len(old_files)} current={len(current)}')

          payload['generated_from'] = 'git:' + os.environ['GITHUB_SHA']
          payload['generated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          payload['file_count'] = len(current)
          payload['files'] = dict(sorted(current.items()))
          baseline_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({'status': 'PASS', 'changed': changed, 'file_count': len(current)}, ensure_ascii=False))
          PY

      - name: Verify refreshed baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -B skill-system/controller/project_compatibility.py
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = 'skill-system/registry/product-source-baseline.json'

      - name: Publish baseline only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json
          test "$(git diff --cached --name-only | tr -d '\r')" = 'skill-system/registry/product-source-baseline.json'
          git diff --cached --check
          git commit -m 'Bind B29 service instructions to product baseline'
          echo "BASELINE_COMMIT=$(git rev-parse HEAD)"
          git push origin HEAD:agent/b29-codex-multi-agent-governance
