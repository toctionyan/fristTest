name: quality
run-name: Verify B28 PR comment transport

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify-comment-transport:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/b28-bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Fetch and verify exact PR comment payload
        env:
          GH_TOKEN: ${{ github.token }}
          COMMENT_ID: '5161729797'
          EXPECTED_LENGTH: '8192'
          EXPECTED_SHA256: '32080320a732136731905661d4ca4e9f6cec21726650b34557591bd0331e917c'
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" \
            > "$RUNNER_TEMP/comment.json"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          body = json.loads(Path(os.environ['RUNNER_TEMP']).joinpath('comment.json').read_text(encoding='utf-8'))['body']
          marker = '\n\n'
          if marker not in body:
              raise SystemExit('comment_payload_separator_missing')
          header, payload = body.split(marker, 1)
          expected_length = int(os.environ['EXPECTED_LENGTH'])
          expected_sha = os.environ['EXPECTED_SHA256']
          actual_sha = hashlib.sha256(payload.encode('utf-8')).hexdigest()
          print(f'body_length={len(body)}')
          print(f'payload_length={len(payload)}')
          print(f'payload_sha256={actual_sha}')
          if header != f'B28-TRANSFER-TEST\nlength:{expected_length}\nsha256:{expected_sha}':
              raise SystemExit('comment_header_mismatch')
          if len(payload) != expected_length:
              raise SystemExit('comment_payload_length_mismatch')
          if actual_sha != expected_sha:
              raise SystemExit('comment_payload_sha256_mismatch')
          print('comment_transport=PASS')
          PY
