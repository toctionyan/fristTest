name: wp08-new-release-attempt3-reconcile

"on":
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: wp08-new-release-attempt3-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event.pull_request.head.ref == 'wp08-new-release-attempt3-reconcile-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      EXPECTED_MAIN_SHA: 8a8b614903f20f5a030e9d80a0adfacb74785882
      RELEASE_ISSUE: '335'
      EXPECTED_WP08_RUN: '31344310588'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact Attempt-3 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify preconditions and reconcile through repository controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python - <<'PY'
          import json, os
          from urllib import request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          def get(path):
              req=request.Request(f'https://api.github.com/repos/{repo}{path}',headers=headers)
              with request.urlopen(req,timeout=30) as r: return json.load(r)
          issue=get('/issues/'+os.environ['RELEASE_ISSUE']); body=str(issue.get('body') or '')
          assert '"status": "CERTIFYING"' in body, 'ReleaseRun is not awaiting reconciliation'
          assert '"attempt": 3' in body and '"max_attempts": 8' in body
          assert f'"current_wp08_run_id": {os.environ["EXPECTED_WP08_RUN"]}' in body
          run=get('/actions/runs/'+os.environ['EXPECTED_WP08_RUN'])
          assert run.get('status')=='completed' and run.get('conclusion')=='failure'
          assert run.get('head_sha')==os.environ['EXPECTED_MAIN_SHA'] and run.get('head_branch')=='main'
          print(json.dumps({'status':'PRECONDITION_PASS','run':int(os.environ['EXPECTED_WP08_RUN'])}))
          PY
          python -B scripts/wp08_release_recovery.py --mode reconcile

      - name: Prove fail-closed reconciliation and no Attempt 4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib import request
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GITHUB_TOKEN']
          headers={'Accept':'application/vnd.github+json','Authorization':f'Bearer {token}','X-GitHub-Api-Version':'2022-11-28'}
          req=request.Request(f'https://api.github.com/repos/{repo}/issues/{os.environ["RELEASE_ISSUE"]}',headers=headers)
          with request.urlopen(req,timeout=30) as r: issue=json.load(r)
          body=str(issue.get('body') or '')
          checks=[
              '"status": "FAILED_NEEDS_CLASSIFICATION"',
              '"attempt": 3',
              '"last_wp08_run_id": 31344310588',
              '"last_wp08_conclusion": "failure"',
              '"failure_signature": "wp08:failure"',
              '"production_closed": false',
              '"event": "wp08_reconciled_completed_failure"',
          ]
          missing=[x for x in checks if x not in body]
          if missing: raise SystemExit('reconciliation proof missing: '+repr(missing))
          if '"attempt": 4' in body: raise SystemExit('unexpected Attempt 4 dispatch')
          print(json.dumps({'status':'PASS','issue':int(os.environ['RELEASE_ISSUE']),'attempt':3,'classification':'FAILED_NEEDS_CLASSIFICATION','production_closed':False}))
          PY
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
