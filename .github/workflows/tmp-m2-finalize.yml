name: tmp-m2-finalize

on:
  pull_request:
    branches: [main]
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'long-task-execution-control-plane-m2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout M2 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: long-task-execution-control-plane-m2
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Apply final cleanup and regressions
        run: |
          set -euo pipefail
          python -B scripts/tmp_m2_finalize.py
          python -m py_compile \
            skill-system/controller/execution_runtime.py \
            scripts/quality_control/environment.py \
            scripts/run_wp08_certification.py \
            skill-system/tests/test_execution_runtime_m2_integration.py
          python -m unittest discover -s skill-system/tests -p 'test_execution_runtime_m2_integration.py'
          git diff --check
      - name: Commit clean M2 head
        run: |
          set -euo pipefail
          rm -f scripts/tmp_m2_finalize.py .github/workflows/tmp-m2-finalize.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Harden external wait liveness contracts and add M2 regressions'
          git push origin HEAD:long-task-execution-control-plane-m2
