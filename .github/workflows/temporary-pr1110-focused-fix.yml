name: temporary-pr1110-focused-fix

on:
  push:
    branches:
      - fix/release52-dependency-independence-adjudication-20260815
    paths:
      - .github/workflows/temporary-pr1110-focused-fix.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/release52-dependency-independence-adjudication-20260815
          fetch-depth: 0

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: 3.12.13
          check-latest: false

      - name: Apply focused correction
        run: |
          set -euo pipefail
          python .github/pr1110-focused-fix.py
          python -m py_compile services/agent-service/src/agent_core/lifecycle/goal_planning.py services/agent-service/tests/runtime/test_release52_dependency_independence_adjudication.py
          git diff --check

      - name: Install locked focused test environment
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups

      - name: Run focused dependency regressions
        run: |
          set -euo pipefail
          services/agent-service/.venv/bin/python -m pytest -q \
            services/agent-service/tests/runtime/test_release52_dependency_independence_adjudication.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py::test_unproposed_refund_dependency_requires_candidate_blind_confirmation

      - name: Commit source and regression correction
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agent-service/src/agent_core/lifecycle/goal_planning.py services/agent-service/tests/runtime/test_release52_dependency_independence_adjudication.py
          git diff --cached --exit-code && { echo "expected focused source/test correction"; exit 1; } || true
          git commit -m "fix(semantic): bound dependency-absence adjudication"

      - name: Refresh protected source baseline
        run: |
          set -euo pipefail
          SOURCE_SHA="$(git rev-parse HEAD)"
          python scripts/refresh_product_source_baseline.py --workspace . --generated-from-sha "$SOURCE_SHA"
          git diff --check

      - name: Remove temporary carrier and publish repair
        run: |
          set -euo pipefail
          git rm .github/pr1110-focused-fix.py .github/workflows/temporary-pr1110-focused-fix.yml
          git add skill-system/registry/product-source-baseline.json
          git diff --check
          git commit -m "chore: rebind PR #1110 focused repair baseline"
          git push origin HEAD:fix/release52-dependency-independence-adjudication-20260815
