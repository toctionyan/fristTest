name: B28 Current Main Snapshot

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: b28-current-main-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.event.pull_request.head.ref == 'agent/b28-repository-onboarding'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable upgrade head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 5
          clean: true
          persist-credentials: false

      - name: Capture normalized current-main source identity
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          test "$EXPECTED_BRANCH" = "agent/b28-repository-onboarding"
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git merge-base --is-ancestor b33e876eb0f9a6df3a9222dd4696c24230e0f8d9 HEAD
          test "$(find .b28-bootstrap -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" = "16"

          find . -path './.git' -prune -o -type d -exec chmod 0755 {} +
          find . -path './.git' -prune -o -type f -exec chmod 0644 {} +

          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --format=gnu \
            --exclude='./.git' \
            --exclude='./.b28-bootstrap' \
            --exclude='./.github/workflows/b28-bootstrap.yml' \
            -cf /tmp/current-main-normalized.tar .
          sha256sum /tmp/current-main-normalized.tar | tee /tmp/current-main-normalized.tar.sha256

      - name: Upload normalized current-main snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b28-current-main-normalized-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            /tmp/current-main-normalized.tar
            /tmp/current-main-normalized.tar.sha256
          retention-days: 7
          if-no-files-found: error
