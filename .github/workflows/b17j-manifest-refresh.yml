name: B17j Manifest Refresh

on:
  push:
    branches:
      - agent/b17i-quality-validation
    paths:
      - B17J_MANIFEST_TRIGGER.tmp

permissions:
  contents: write

jobs:
  refresh-manifest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/b17i-quality-validation
          fetch-depth: 1
          persist-credentials: true
      - name: Generate exact B17j source manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json

          root = Path('.')
          manifest_path = root / 'PHASE_CANDIDATE_MANIFEST.json'
          excluded = {
              'PHASE_CANDIDATE_MANIFEST.json',
              '.github/workflows/b17j-manifest-refresh.yml',
              'B17J_MANIFEST_TRIGGER.tmp',
          }
          files = []
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.is_symlink():
                  continue
              relative = path.relative_to(root).as_posix()
              if relative in excluded or relative.startswith('.git/'):
                  continue
              payload = path.read_bytes()
              files.append({
                  'path': relative,
                  'size': len(payload),
                  'sha256': hashlib.sha256(payload).hexdigest(),
              })
          manifest = {
              'schema_version': 1,
              'status': 'PHASE_CANDIDATE_ENVIRONMENT_EXECUTION_PENDING',
              'phase': 'B17j',
              'root_name': 'customer_agent_workspace_v20_17_b17j_ci_profile_boundary_repair_phase_candidate_env_blocked_20260731',
              'file_count': len(files),
              'required_environment': [
                  'GitHub repository access to the exact B17j commit',
                  'project quality CI PASS on the exact final source tree',
                  'workflow_dispatch on protected refs/heads/main in the production-certification Environment',
                  'release-admission PASS with downloadable sanitized same-run evidence',
                  'protected-environment-preflight PASS before dependency installation',
                  'official chat-model and embedding credentials plus quality evidence signing key',
                  'locked Python 3.12.13, Node 24.18.0, npm 11.16.0, uv 0.11.29, Docker, pgvector and Playwright Chromium',
                  'same repository/workflow/ref/commit/run ID/run attempt identity',
              ],
              'production_closed': False,
              'files': files,
          }
          manifest_path.write_text(
              json.dumps(manifest, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({'status': 'PASS', 'file_count': len(files)}))
          PY
      - name: Commit exact manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PHASE_CANDIDATE_MANIFEST.json
          git diff --cached --quiet && { echo 'Manifest already current'; exit 0; }
          git commit -m 'Regenerate exact B17j source manifest'
          git push origin HEAD:agent/b17i-quality-validation
