name: Temporary Semantic Dependency Repair

"on":
  push:
    branches:
      - fix/semantic-shared-scope-dependency-20260815
    paths:
      - .github/semantic-dependency-repair.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply capability-independent dependency contract repair
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from pathlib import Path

          def insert_after_once(path: str, anchor: str, addition: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(anchor)
              if count != 1:
                  raise SystemExit(f"anchor_count:{path}:{count}:{anchor[:80]}")
              p.write_text(text.replace(anchor, anchor + addition, 1), encoding="utf-8")

          protocol = "services/agent-service/src/agent_core/lifecycle/protocol.py"
          protocol_anchor = (
              "同一原话前文已明确业务对象或范围而后文真正省略重复对象（零指代）时，应继承该明示范围；"
              "这不是对前一个 Goal 执行结果的依赖。执行时若仍需一次读取把该描述解析成稳定 ID/artifact handle，"
              "那只是支持步骤，不能反向制造 depends_on。"
          )
          protocol_addition = (
              "判断依赖必须做结果反事实：假设前一个 Goal 的用户可见结果尚未产生，但保留当前原话中已经明示的对象、范围和业务约束；"
              "如果后一个 Goal 仍能独立确定自己要得到的业务结果并独立判断完成，则 depends_on 必须为空。"
              "只有拿掉前一个 Goal 的结果后，后一个 Goal 的目标、值输入、条件或可完成含义本身无法成立时，才存在真实结果依赖。"
          )
          insert_after_once(protocol, protocol_anchor, protocol_addition)

          planning = "services/agent-service/src/agent_core/lifecycle/goal_planning.py"
          decision_anchor = (
              '            "and/then/next/also/再/然后/另外 or merely sharing the same business object/topic does not by itself create depends_on; '
              'independently acceptable sibling outcomes must keep depends_on empty",'
          )
          decision_addition = (
              '\n            "apply a result counterfactual before retaining any dependency: pretend the earlier Goal user-visible result has not been produced while preserving objects, scopes and constraints already literal in USER_TEXT; if the later Goal still has a self-contained requested outcome whose completion can be judged independently, the pair is independent; only retain depends_on when removing the earlier result makes the later target, value input, condition or user-visible completion meaning itself unavailable",'
          )
          insert_after_once(planning, decision_anchor, decision_addition)

          blind_anchor = (
              '            "shared object/topic/scope and sequencing words alone never create a result dependency",'
          )
          blind_addition = (
              '\n            "use the result counterfactual for every pair: hold fixed the objects, scopes and constraints already literal in USER_TEXT, remove only the earlier Goal user-visible result, and mark the pair independent whenever the later requested outcome remains self-contained and independently judgeable",'
          )
          insert_after_once(planning, blind_anchor, blind_addition)

          smoke = "services/agent-service/scripts/verify_preprod_conversation_smoke.py"
          smoke_anchor = "前文已明示对象而后文真正省略重复对象（零指代）只是共享范围，不产生依赖；"
          smoke_addition = (
              "判断依赖必须做结果反事实：假设前一 Goal 的用户可见结果尚未产生，但保留当前原话已经明示的对象、范围和约束；"
              "若后一 Goal 仍可独立确定自己的业务结果并独立判断完成，则 depends_on 必须为空，不能因为再/然后等顺序表达、共享主题或执行时需要解析稳定 ID 而制造依赖。"
              "只有拿掉前一 Goal 的结果后，后一 Goal 的目标、值输入、条件或可完成含义本身无法成立时才依赖；"
          )
          insert_after_once(smoke, smoke_anchor, smoke_addition)

          test_path = Path("services/agent-service/tests/runtime/test_semantic_dependency_counterfactual_contract.py")
          if test_path.exists():
              raise SystemExit("regression_test_already_exists")
          test_path.write_text('''from __future__ import annotations\n\nimport json\nfrom pathlib import Path\n\nfrom agent_core.lifecycle.protocol import DECLARE_TURN_GOALS_SCHEMA\n\n\nROOT = Path(__file__).resolve().parents[2]\nCATALOG = ROOT / "tests/context/strong_context_cases/semantic_goal_coverage_suite_v20_4.json"\n\n\ndef _oracle(case_id: str) -> dict[str, list[str]]:\n    payload = json.loads(CATALOG.read_text(encoding="utf-8"))\n    case = next(row for row in payload["cases"] if row["id"] == case_id)\n    rows = case["execution_contract"]["turn_contracts"][0]["goal_oracle"]\n    return {row["oracle_id"]: list(row.get("depends_on") or []) for row in rows}\n\n\ndef test_depends_on_schema_requires_result_counterfactual_not_discourse_order() -> None:\n    goal_schema = DECLARE_TURN_GOALS_SCHEMA["function"]["parameters"]["properties"]["goals"]["items"]\n    description = goal_schema["properties"]["depends_on"]["description"]\n    assert "结果反事实" in description\n    assert "用户可见结果尚未产生" in description\n    assert "仍能独立确定自己要得到的业务结果并独立判断完成" in description\n    assert "再/然后/另外" in description\n    for forbidden in ("list_orders", "get_order_logistics", "prepare_refund"):\n        assert forbidden not in description\n\n\ndef test_shared_scope_ellipsis_and_explicit_result_reference_stay_distinct() -> None:\n    assert _oracle("semantic_multi_orders_logistics") == {"g1": [], "g2": []}\n    assert _oracle("semantic_query_then_refund_draft") == {"g1": [], "g2": []}\n    assert _oracle("semantic_query_then_refund_consult") == {"g1": [], "g2": ["g1"]}\n''', encoding="utf-8")

          trigger = Path(".github/release-trigger")
          identity = {
              line.split(":", 1)[0]: line.split(":", 1)[1].strip()
              for line in trigger.read_text(encoding="utf-8").splitlines()
              if ":" in line
          }
          expected = {
              "provider": "deepseek",
              "model": "deepseek-v4-flash",
              "embedding_model": "text-embedding-v4",
              "embedding_dimension": "1024",
          }
          for key, value in expected.items():
              if identity.get(key) != value:
                  raise SystemExit(f"protected_identity_changed:{key}")
          trigger.write_text(
              "release_request: 2026-08-15T13:30:00+08:00\n"
              "provider: deepseek\n"
              "model: deepseek-v4-flash\n"
              "embedding_model: text-embedding-v4\n"
              "embedding_dimension: 1024\n"
              "reason: rerun protected release after shared-scope versus result-dependency semantic repair\n",
              encoding="utf-8",
          )
          PY

      - name: Validate repaired semantic dependency boundary
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            services/agent-service/src/agent_core/lifecycle/protocol.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/scripts/verify_preprod_conversation_smoke.py \
            services/agent-service/tests/runtime/test_semantic_dependency_counterfactual_contract.py
          python3 -B - <<'PY'
          import json
          from pathlib import Path
          catalog = json.loads(Path("services/agent-service/tests/context/strong_context_cases/semantic_goal_coverage_suite_v20_4.json").read_text(encoding="utf-8"))
          cases = {row["id"]: row for row in catalog["cases"]}
          def deps(case_id):
              rows = cases[case_id]["execution_contract"]["turn_contracts"][0]["goal_oracle"]
              return {row["oracle_id"]: list(row.get("depends_on") or []) for row in rows}
          assert deps("semantic_multi_orders_logistics") == {"g1": [], "g2": []}
          assert deps("semantic_query_then_refund_draft") == {"g1": [], "g2": []}
          assert deps("semantic_query_then_refund_consult") == {"g1": [], "g2": ["g1"]}
          assert "结果反事实" in Path("services/agent-service/src/agent_core/lifecycle/protocol.py").read_text(encoding="utf-8")
          assert "result counterfactual" in Path("services/agent-service/src/agent_core/lifecycle/goal_planning.py").read_text(encoding="utf-8")
          assert "结果反事实" in Path("services/agent-service/scripts/verify_preprod_conversation_smoke.py").read_text(encoding="utf-8")
          PY

      - name: Refresh protected product-source baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/refresh_product_source_baseline.py \
            --workspace . \
            --generated-from-sha "${GITHUB_SHA}"

      - name: Publish governed repair
        shell: bash
        run: |
          set -euo pipefail
          git clean -fdX
          find . -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          git diff --check
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add \
            .github/release-trigger \
            services/agent-service/scripts/verify_preprod_conversation_smoke.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/lifecycle/protocol.py \
            services/agent-service/tests/runtime/test_semantic_dependency_counterfactual_contract.py \
            skill-system/registry/product-source-baseline.json
          git commit -m 'fix(semantic): distinguish shared scope from result dependency'
          git push origin HEAD:fix/semantic-shared-scope-dependency-20260815
