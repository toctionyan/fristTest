name: tmp-m2-execution-runtime-patch

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'long-task-execution-control-plane-m2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout M2 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: long-task-execution-control-plane-m2
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Apply exact M2 patch
        run: |
          set -euo pipefail
          python -B scripts/tmp_m2_execution_runtime_patch.py
          python -m py_compile \
            skill-system/controller/execution_runtime.py \
            scripts/quality_control/environment.py \
            scripts/run_wp08_certification.py
          git diff --check
      - name: Commit product patch when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- skill-system/controller/execution_runtime.py scripts/quality_control/environment.py scripts/run_wp08_certification.py; then
            echo 'M2 product patch already present'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill-system/controller/execution_runtime.py scripts/quality_control/environment.py scripts/run_wp08_certification.py
          git commit -m 'Unify quality and WP08 execution liveness runtime'
          git push origin HEAD:long-task-execution-control-plane-m2
