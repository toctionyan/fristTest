name: Proof authority baseline refresh

on:
  push:
    branches:
      - fix/proof-authority-lifecycle-20260816

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Refresh protected source baseline and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/proof-authority-baseline-refresh.yml'
          baseline='skill-system/registry/product-source-baseline.json'

          git rm "$workflow"

          python -B - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.').resolve()
          baseline_path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(baseline_path.read_text(encoding='utf-8'))
          protected_roots = tuple(str(item) for item in payload['protected_roots'])
          raw = subprocess.check_output(
              ['git', 'ls-files', '-z', '--', *protected_roots],
              cwd=root,
          )
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          current = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          payload['generated_from'] = 'git:' + os.environ['GITHUB_SHA']
          payload['generated_at'] = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace('+00:00', 'Z')
          )
          payload['file_count'] = len(current)
          payload['files'] = dict(sorted(current.items()))
          baseline_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'status': 'PASS',
              'file_count': len(current),
              'generated_from': payload['generated_from'],
          }, sort_keys=True))
          PY

          git add "$baseline"
          git diff --cached --check
          git config user.name 'customer-agent-proof-authority[bot]'
          git config user.email 'customer-agent-proof-authority[bot]@users.noreply.github.com'
          git commit -m 'test: seal monotonic proof authority baseline [proof-authority-baseline]'
          git push origin HEAD:${GITHUB_REF_NAME}
