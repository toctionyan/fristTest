name: release55-dependency-role-overlap-governance-v4

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/release55-dependency-role-overlap-governance-v4.yml

permissions:
  contents: write
  pull-requests: read

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_REF: ${{ github.event.pull_request.head.ref }}
  PYTHONPATH: ${{ runner.temp }}/release55-base/services/agent-service/src:${{ runner.temp }}/release55-base/services/agent-service
  PYTHONDONTWRITEBYTECODE: '1'

jobs:
  initialize-governed-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Execute corrected governed carrier steps
        run: |
          set -euo pipefail
          carrier=.github/workflows/release55-dependency-role-overlap-governance-v3.yml
          for step_name in \
            "Reconstruct exact PR base and install Agent environment" \
            "Generate target, claim and focused RED policy" \
            "Record canonical focused RED baseline" \
            "Generate governed repair chain and ChangePermit" \
            "Copy and commit governed permit to repair branch"
          do
            script="${RUNNER_TEMP}/release55-step.sh"
            "${pythonLocation}/bin/python" -B - "$carrier" "$step_name" > "$script" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1])
          target = sys.argv[2]
          lines = path.read_text(encoding="utf-8").splitlines()
          marker = f"      - name: {target}"
          try:
              start = lines.index(marker)
          except ValueError as exc:
              raise SystemExit(f"carrier step not found: {target}") from exc
          run_line = None
          for index in range(start + 1, len(lines)):
              if lines[index].startswith("      - name:") or lines[index].startswith("      - uses:"):
                  break
              if lines[index] == "        run: |":
                  run_line = index + 1
                  break
          if run_line is None:
              raise SystemExit(f"run block not found: {target}")
          out = []
          for line in lines[run_line:]:
              if line.startswith("      - name:") or line.startswith("      - uses:"):
                  break
              if not line.startswith("          "):
                  raise SystemExit(f"unexpected carrier indentation in {target}: {line!r}")
              out.append(line[10:])
          print("\n".join(out))
          PY
            echo "===== executing: ${step_name} ====="
            bash "$script"
          done
