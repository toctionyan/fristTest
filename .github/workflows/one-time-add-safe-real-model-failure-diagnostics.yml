name: One-time add safe real-model failure diagnostics
run-name: Apply bounded real-model failure diagnostics

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .github/safe-real-model-diagnostics-trigger

permissions:
  contents: write

jobs:
  repair:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/add-safe-real-model-failure-diagnostics'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/add-safe-real-model-failure-diagnostics
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Apply bounded diagnostic repair
        shell: bash
        run: |
          set -euo pipefail
          python -B scripts/one_time_add_safe_real_model_failure_diagnostics.py
          rm -f scripts/one_time_add_safe_real_model_failure_diagnostics.py
          rm -f .github/safe-real-model-diagnostics-trigger
          python -m py_compile \
            services/agent-service/src/agent_core/model_calls/real_model_certification_bundle.py \
            services/agent-service/tests/runtime/test_real_model_bundle_safe_failure_diagnostics.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Preserve bounded real-model lifecycle failure diagnostics"
          git push origin HEAD:agent/add-safe-real-model-failure-diagnostics
