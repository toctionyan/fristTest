name: wp08-post-budget-attempt8-root-repair-push

on:
  push:
    branches:
      - wp08-post-budget-attempt8-root-repair-20260810

permissions:
  contents: write

jobs:
  apply-root-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: wp08-post-budget-attempt8-root-repair-20260810
          fetch-depth: 1
      - name: Apply exact Attempt 8 root repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/wp08_attempt8_root_repair.py
          python3 -m py_compile \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/runtime/semantic_capability_verifier.py
          git diff --check
          git diff -- \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/runtime/semantic_capability_verifier.py
      - name: Publish clean two-source-file candidate
        shell: bash
        run: |
          set -euo pipefail
          git rm -f \
            .github/scripts/wp08_attempt8_root_repair.py \
            .github/workflows/wp08-post-budget-attempt8-root-repair-applier.yml \
            .github/workflows/wp08-post-budget-attempt8-root-repair-push.yml
          git add \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/runtime/semantic_capability_verifier.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: close Attempt 8 dependency and broad-filter gaps'
          git push origin HEAD:wp08-post-budget-attempt8-root-repair-20260810
