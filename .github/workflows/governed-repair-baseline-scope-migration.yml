name: governed-repair-baseline-scope-migration

on:
  push:
    branches:
      - architecture/governed-repair-rca-write-grant-20260816
    paths:
      - .github/governed-repair-baseline-scope-trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: architecture/governed-repair-rca-write-grant-20260816
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Separate governed source scope from protected baseline scope
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/github_repair_governance.py')
          text = path.read_text(encoding='utf-8')
          old = '''    approved_baseline_paths = []\n    for raw in publication.get("changed_paths") or []:\n        path = str(raw or "").strip().replace("\\\\", "/")\n        if path and path not in approved_baseline_paths:\n            approved_baseline_paths.append(path)\n    if not approved_baseline_paths:\n        raise GovernanceError("governance has no validated source paths")\n'''
          new = '''    approved_source_paths = []\n    for raw in publication.get("changed_paths") or []:\n        path = str(raw or "").strip().replace("\\\\", "/")\n        if path and path not in approved_source_paths:\n            approved_source_paths.append(path)\n    if not approved_source_paths:\n        raise GovernanceError("governance has no validated source paths")\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'approved_source_paths = []' not in text:
              raise SystemExit('governance source-scope block not found')
          text = text.replace(
              '        "approved_baseline_paths": approved_baseline_paths,\n',
              '        "approved_source_paths": approved_source_paths,\n',
          )
          path.write_text(text, encoding='utf-8')

          path = Path('scripts/github_repair_baseline_acceptance.py')
          text = path.read_text(encoding='utf-8')
          old = '''    approved = {\n        str(path or "").strip().replace("\\\\", "/")\n        for path in governance.get("approved_baseline_paths") or []\n        if str(path or "").strip()\n    }\n    if not approved:\n        raise BaselineAcceptanceError("governance approved no baseline paths")\n    if observed_drift != approved:\n'''
          new = '''    approved_source = {\n        str(path or "").strip().replace("\\\\", "/")\n        for path in governance.get("approved_source_paths") or []\n        if str(path or "").strip()\n    }\n    if not approved_source:\n        raise BaselineAcceptanceError("governance approved no source paths")\n    protected_roots = {\n        str(root or "").strip().replace("\\\\", "/").rstrip("/")\n        for root in baseline.get("protected_roots") or []\n        if str(root or "").strip()\n    }\n    approved = {\n        path\n        for path in approved_source\n        if any(path.startswith(root + "/") for root in protected_roots)\n    }\n    if observed_drift != approved:\n'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'approved_source = {' not in text:
              raise SystemExit('baseline approved-scope block not found')
          receipt_anchor = '        "approved_baseline_paths": sorted(approved),\n'
          if '        "approved_source_paths": sorted(approved_source),\n' not in text:
              if receipt_anchor not in text:
                  raise SystemExit('baseline receipt scope anchor missing')
              text = text.replace(
                  receipt_anchor,
                  '        "approved_source_paths": sorted(approved_source),\n' + receipt_anchor,
                  1,
              )
          path.write_text(text, encoding='utf-8')

          test = Path('skill-system/tests/test_github_repair_governance.py')
          source = test.read_text(encoding='utf-8')
          source = source.replace(
              '            "approved_baseline_paths": approved,\n',
              '            "approved_source_paths": approved,\n',
          )
          source = source.replace(
              '            "approved_baseline_paths": ["services/agent-service/src/a.py"],\n',
              '            "approved_source_paths": ["services/agent-service/src/a.py"],\n            "approved_baseline_paths": ["services/agent-service/src/a.py"],\n',
          )
          test.write_text(source, encoding='utf-8')
          PY
          python -m py_compile \
            scripts/github_repair_governance.py \
            scripts/github_repair_baseline_acceptance.py \
            skill-system/tests/test_github_repair_governance.py
      - name: Remove temporary migration authority
        run: |
          set -euo pipefail
          git rm .github/workflows/governed-repair-baseline-scope-migration.yml
          git rm .github/governed-repair-baseline-scope-trigger
          git diff --check
      - name: Commit protected-baseline scope normalization
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix(governance): separate source and baseline authority'
          git push origin HEAD:architecture/governed-repair-rca-write-grant-20260816
