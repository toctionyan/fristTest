name: stage5g4-c3h-a7-a2-replan-materialize

on:
  push:
    branches:
      - stage5g4-c3h-a7-a2-controller-replan-lifecycle

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact A3 parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "435fade35f49f1339fe6d3e248982d54a69ee6af"
      - name: Apply frozen Controller replan patch
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/a7a2.patch.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/a7a2.patch.gz.b64 | gzip -d > /tmp/a7a2.patch
          git apply --check /tmp/a7a2.patch
          git apply /tmp/a7a2.patch
      - name: Run focused and adjacent Controller tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest skill-system/tests/test_contract.py
          python -m unittest skill-system/tests/test_repair_governance.py
          python -m unittest skill-system/tests/test_product_scope.py
      - name: Commit only permanent Controller repair
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/stage5g4-c3h-a7-a2-replan-materialize.yml
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add skill-system/controller/change_contract_cli.py skill-system/tests/test_contract.py docs/architecture/QUALITY_LOOP.md .github/workflows/stage5g4-c3h-a7-a2-replan-materialize.yml
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "4"
          git commit -m "Controller: add fail-closed replan successor lifecycle"
          git push origin HEAD:stage5g4-c3h-a7-a2-controller-replan-lifecycle
