name: wp08-new-release-attempt4-repair-publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate-and-publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-new-release-attempt4-repair-publisher-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      BASE_SHA: 97922f31922a470f1ee3643e1e86e8f33c630a23
      FORMAL_BRANCH: agent/wp08-new-release-attempt4-runtime-repair-parity-20260809
    steps:
      - name: Checkout carrier helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: carrier
          fetch-depth: 1

      - name: Checkout exact failed candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.BASE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: true

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Verify exact authority and install both locked Python environments
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test -z "$(git -C candidate ls-remote origin refs/heads/$FORMAL_BRANCH | awk '{print $1}')"
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r candidate/deployment/ci/uv-requirements-linux-x86_64.txt
          (cd candidate/services/agent-service && uv sync --locked --all-groups)
          (cd candidate/services/business-service && uv sync --locked --all-groups)

      - name: Apply bounded Runtime-repair parity change
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B carrier/.github/wp08-new-release-attempt4-repair-publisher-v2.py
          git -C candidate diff --check

      - name: Run focused counterexamples and semantic execution regressions
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/attempt4-junit" "${RUNNER_TEMP}/attempt4-coverage"
          cd candidate
          services/agent-service/.venv/bin/python -m pytest -q \
            skill-system/tests/test_wp08_new_release_attempt4_repair.py \
            --junitxml="${RUNNER_TEMP}/attempt4-junit/attempt4-repair.xml"
          cd services/agent-service
          PYTHONPATH="$PWD:$PWD/src" .venv/bin/python -m pytest -q \
            tests/context/test_semantic_goal_coverage_suite_execution.py \
            tests/runtime/test_global_goal_capability_coverage.py \
            --junitxml="${RUNNER_TEMP}/attempt4-junit/semantic-execution.xml"

      - name: Run native standard Python suites
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          services/agent-service/.venv/bin/python -B scripts/run_python_test_suites.py \
            --mode standard \
            --junit-dir "${RUNNER_TEMP}/attempt4-junit" \
            --coverage-dir "${RUNNER_TEMP}/attempt4-coverage"

      - name: Prove exact two-file product candidate and commit it
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          git add -N skill-system/tests/test_wp08_new_release_attempt4_repair.py
          printf '%s\n' \
            services/agent-service/scripts/verify_preprod_conversation_smoke.py \
            skill-system/tests/test_wp08_new_release_attempt4_repair.py | sort > /tmp/expected-product.txt
          git diff --name-only "$BASE_SHA" -- | sort > /tmp/actual-product.txt
          diff -u /tmp/expected-product.txt /tmp/actual-product.txt
          git diff --check "$BASE_SHA" --
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add \
            services/agent-service/scripts/verify_preprod_conversation_smoke.py \
            skill-system/tests/test_wp08_new_release_attempt4_repair.py
          git diff --cached --check
          git commit -m 'Mirror production declaration repair payload in certification'
          git rev-parse HEAD | tee ../wp08-attempt4-product-head.txt

      - name: Regenerate protected baseline from exact product commit
        shell: bash
        run: |
          set -euo pipefail
          export PRODUCT_HEAD="$(git -C candidate rev-parse HEAD)"
          "${pythonLocation}/bin/python" -B carrier/.github/wp08-new-release-attempt4-baseline.py

      - name: Validate project compatibility and full Skill control plane
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          services/agent-service/.venv/bin/python -B skill-system/controller/project_compatibility.py | tee wp08-attempt4-project-compatibility.json
          services/agent-service/.venv/bin/python -B skill-system/controller/profile_runner.py skill-control-plane | tee wp08-attempt4-skill-control-plane.json

      - name: Prove exact three-file final delta and publish formal repair branch
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          printf '%s\n' \
            services/agent-service/scripts/verify_preprod_conversation_smoke.py \
            skill-system/registry/product-source-baseline.json \
            skill-system/tests/test_wp08_new_release_attempt4_repair.py | sort > /tmp/expected-final.txt
          git diff --name-only "$BASE_SHA" -- | sort > /tmp/actual-final.txt
          diff -u /tmp/expected-final.txt /tmp/actual-final.txt
          git diff --check "$BASE_SHA" --
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test -z "$(git ls-remote origin refs/heads/$FORMAL_BRANCH | awk '{print $1}')"
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m 'Bind attempt4 repair protected source baseline'
          git push origin HEAD:refs/heads/$FORMAL_BRANCH
          git rev-parse HEAD | tee ../wp08-attempt4-final-head.txt

      - name: Upload governed validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wp08-new-release-attempt4-repair-validation
          path: |
            wp08-attempt4-product-head.txt
            wp08-attempt4-final-head.txt
            candidate/wp08-attempt4-baseline-report.json
            candidate/wp08-attempt4-project-compatibility.json
            candidate/wp08-attempt4-skill-control-plane.json
            ${{ runner.temp }}/attempt4-junit
          if-no-files-found: warn
          retention-days: 90
