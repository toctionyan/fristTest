name: wp08-new-release-reconcile-attempt7-failure-once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-new-release-reconcile-attempt7-failure-once-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 11e119c134906f1395db615762fd45c1e7385c92
      EXPECTED_WP08_RUN_ID: '31321476958'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact authoritative main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Reconcile completed attempt 7 through repository controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python -B scripts/wp08_release_recovery.py --mode reconcile
          python - <<'PY'
          import json
          import os
          from urllib import request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          expected_run = int(os.environ['EXPECTED_WP08_RUN_ID'])
          expected_sha = os.environ['EXPECTED_MAIN_SHA']
          req = request.Request(
              f'https://api.github.com/repos/{repo}/issues/293',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with request.urlopen(req, timeout=30) as response:
              issue = json.load(response)
          body = str(issue.get('body') or '')
          required = (
              '"status": "FAILED_NEEDS_CLASSIFICATION"',
              f'"current_wp08_run_id": {expected_run}',
              f'"last_wp08_run_id": {expected_run}',
              f'"current_candidate_sha": "{expected_sha}"',
              '"attempt": 7',
              '"production_closed": false',
          )
          missing = [value for value in required if value not in body]
          if missing:
              raise SystemExit('ReleaseRun did not reconcile exactly: ' + repr(missing))
          print(json.dumps({
              'status': 'PASS',
              'issue': 293,
              'wp08_run_id': expected_run,
              'candidate_sha': expected_sha,
              'release_state': 'FAILED_NEEDS_CLASSIFICATION',
              'attempt': 7,
          }, sort_keys=True))
          PY
