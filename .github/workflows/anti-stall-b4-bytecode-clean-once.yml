name: One-shot Anti-Stall B4 bytecode cleanup

on:
  push:
    branches:
      - quality-loop-resumable-checkpoint-20260810

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Remove tracked bytecode and add repository guard
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          git rm -r skill-system/controller/__pycache__
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.gitignore')
          lines = path.read_text(encoding='utf-8').splitlines()
          for rule in ('__pycache__/', '*.py[cod]'):
              if rule not in lines:
                  lines.append(rule)
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          python3 skill-system/tests/test_anti_stall_controller.py
          python3 skill-system/tests/test_anti_stall_workflow_default.py
      - name: Commit cleanup and remove carrier
        run: |
          set -euo pipefail
          git rm .github/workflows/anti-stall-b4-bytecode-clean-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Remove bytecode artifacts and guard Anti-Stall sources'
          git push
