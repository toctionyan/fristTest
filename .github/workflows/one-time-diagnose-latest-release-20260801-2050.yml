name: one-time-diagnose-latest-release-20260801-2050

"on":
  push:
    branches:
      - agent/diagnose-latest-release-20260801-2050
    paths:
      - .github/diagnostics/latest-release-trigger.txt

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Read latest release workflow run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/diagnostics
          runs_url="repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?per_page=10"
          gh api "$runs_url" > /tmp/runs.json
          run_id="$(jq -r '.workflow_runs[0].id // empty' /tmp/runs.json)"
          if [ -z "$run_id" ]; then
            jq -n '{error:"no release workflow run found"}' > .github/diagnostics/latest-release-run.json
          else
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" > /tmp/jobs.json
            jq -n \
              --argjson run "$(jq '.workflow_runs[0]' /tmp/runs.json)" \
              --argjson jobs "$(jq '.jobs' /tmp/jobs.json)" \
              '{run:$run,jobs:$jobs}' > .github/diagnostics/latest-release-run.json
          fi
      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/latest-release-run.json
          git commit -m "Record latest release workflow failure" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
