name: governed-ci-stage3-recovery-handoff

on:
  schedule:
    - cron: '*/10 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/governed-ci-stage3-recovery-handoff.yml'
      - '.github/workflows/governed-ci-repair-stage3.yml'
      - 'skill-system/tests/test_governed_ci_stage3_recovery_handoff_workflow.py'
      - 'skill-system/tests/test_governed_ci_repair_stage3_workflow.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: governed-ci-stage3-recovery-handoff
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout trusted Stage-3 recovery control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Discover newest candidate-ready Stage-2 run missing Stage 3
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          echo "found=false" >> "$GITHUB_OUTPUT"

          gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/runs" \
            -f status=completed -f per_page=100 \
            --jq '.workflow_runs[]
              | select(.name == "governed-ci-repair-stage2")
              | select(.conclusion == "success")
              | .id' > incoming/candidate-stage2-run-ids.txt

          while IFS= read -r run_id; do
            [[ "${run_id}" =~ ^[1-9][0-9]*$ ]] || continue
            rm -rf incoming/stage2 incoming/stage2.zip

            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" > incoming/stage2-run.json
            run_attempt=$(jq -r '.run_attempt // empty' incoming/stage2-run.json)
            [[ "${run_attempt}" =~ ^[1-9][0-9]*$ ]] || continue

            run_started_at=$(jq -r '.run_started_at // empty' incoming/stage2-run.json)
            [[ -n "${run_started_at}" ]] || continue
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" \
              > incoming/stage2-artifacts.json
            artifact_id=$(jq -r --arg started "${run_started_at}" '[.artifacts[]
              | select(.expired == false)
              | select(.name | startswith("governed-ci-repair-stage2-"))
              | select(.created_at >= $started)]
              | sort_by(.created_at)
              | reverse
              | .[0].id // empty' incoming/stage2-artifacts.json)
            [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]] || continue

            mkdir -p incoming/stage2
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > incoming/stage2.zip
            unzip -q incoming/stage2.zip -d incoming/stage2

            result=$(find incoming/stage2 -type f -name repair-result.json -print -quit 2>/dev/null || true)
            [[ -n "${result}" ]] || continue

            if ! jq -e --arg repository "${GITHUB_REPOSITORY}" '
              .schema == "github-governed-repair-stage2@1"
              and .status == "REPAIR_CANDIDATE_READY"
              and .stage3_handoff_bound == true
              and .repository == $repository
            ' "${result}" >/dev/null; then
              continue
            fi

            source_run_id=$(jq -r '.workflow_run_id // empty' "${result}")
            [[ "${source_run_id}" =~ ^[1-9][0-9]*$ ]] || continue

            inspect_artifact_name="governed-ci-repair-stage3-inspect-${run_id}-${run_attempt}"
            existing_stage3=$(gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${inspect_artifact_name}&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | length')
            if [[ "${existing_stage3}" != "0" ]]; then
              continue
            fi

            issue_number=$(gh issue list --state all \
              --search "[governed-ci-failure] run ${source_run_id} in:title" \
              --json number --jq '.[0].number // empty')
            [[ "${issue_number}" =~ ^[1-9][0-9]*$ ]] || continue

            marker="AUTO_STAGE3_RECOVERY_DISPATCHED:${run_id}/${run_attempt}"
            existing_text=$(gh issue view "${issue_number}" --json body,comments \
              --jq '[.body, (.comments[].body // "")] | join("\n")')
            if grep -Fq "${marker}" <<<"${existing_text}"; then
              continue
            fi

            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "stage2_run_id=${run_id}" >> "$GITHUB_OUTPUT"
            echo "stage2_run_attempt=${run_attempt}" >> "$GITHUB_OUTPUT"
            echo "source_run_id=${source_run_id}" >> "$GITHUB_OUTPUT"
            echo "issue_number=${issue_number}" >> "$GITHUB_OUTPUT"
            echo "dispatch_marker=${marker}" >> "$GITHUB_OUTPUT"
            exit 0
          done < incoming/candidate-stage2-run-ids.txt

          echo "No candidate-ready Stage-2 run needs Stage-3 recovery." >> "$GITHUB_STEP_SUMMARY"

      - name: Dispatch exact governed Stage 3 recovery
        if: steps.discover.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          STAGE2_RUN_ID: ${{ steps.discover.outputs.stage2_run_id }}
          STAGE2_RUN_ATTEMPT: ${{ steps.discover.outputs.stage2_run_attempt }}
          SOURCE_RUN_ID: ${{ steps.discover.outputs.source_run_id }}
          ISSUE_NUMBER: ${{ steps.discover.outputs.issue_number }}
          DISPATCH_MARKER: ${{ steps.discover.outputs.dispatch_marker }}
        run: |
          set -euo pipefail
          gh api -X POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/governed-ci-repair-stage3.yml/dispatches" \
            -f ref=main \
            -f "inputs[stage2_run_id]=${STAGE2_RUN_ID}" \
            -f "inputs[stage2_run_attempt]=${STAGE2_RUN_ATTEMPT}"

          body=$(cat <<EOF
          Stage-3 recovery handoff dispatched independent validation.

          - Marker: \`${DISPATCH_MARKER}\`
          - Stage-2 Run ID / attempt: \`${STAGE2_RUN_ID}/${STAGE2_RUN_ATTEMPT}\`
          - Source Quality Run ID: \`${SOURCE_RUN_ID}\`
          - Stage-3 workflow: \`governed-ci-repair-stage3\` from trusted \`main\`
          - Candidate code executed by this handoff workflow: \`false\`
          - Model Secret read by this handoff workflow: \`false\`
          - Source changes: none
          - production_closed: false
          EOF
          )
          gh issue comment "${ISSUE_NUMBER}" --body "${body}"

      - name: Publish Stage-3 recovery handoff summary
        if: always()
        env:
          FOUND: ${{ steps.discover.outputs.found }}
          STAGE2_RUN_ID: ${{ steps.discover.outputs.stage2_run_id }}
          STAGE2_RUN_ATTEMPT: ${{ steps.discover.outputs.stage2_run_attempt }}
          SOURCE_RUN_ID: ${{ steps.discover.outputs.source_run_id }}
        run: |
          {
            echo "## Governed Stage-3 recovery handoff"
            echo
            echo "- Candidate-ready Stage 2 found: \`${FOUND:-false}\`"
            echo "- Stage-2 Run ID / attempt: \`${STAGE2_RUN_ID:-none}/${STAGE2_RUN_ATTEMPT:-none}\`"
            echo "- Source Quality Run ID: \`${SOURCE_RUN_ID:-none}\`"
            echo "- Stage 3 dispatch requested: \`${FOUND:-false}\`"
            echo "- Candidate code executed here: \`false\`"
            echo "- Model Secret read here: \`false\`"
            echo "- Source changes: none"
            echo "- production_closed: false"
          } >> "$GITHUB_STEP_SUMMARY"
