name: WP08 Current Baseline Closure
run-name: Refresh protected baseline for current PR 722 head

on:
  push:
    branches: [fix/wp08-single-authority-cutover-20260813]
    paths: [.wp08-current-baseline-refresh]

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Refresh only the deterministic stale protected fingerprint
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -B - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          baseline_path = root / "skill-system/registry/product-source-baseline.json"
          payload = json.loads(baseline_path.read_text(encoding="utf-8"))
          roots = tuple(str(item) for item in payload["protected_roots"])
          raw = subprocess.check_output(["git", "ls-files", "-z", "--", *roots], cwd=root)
          tracked = sorted(item.decode("utf-8") for item in raw.split(b"\0") if item)
          current = {path: hashlib.sha256((root / path).read_bytes()).hexdigest() for path in tracked}
          recorded = {str(k): str(v) for k, v in payload["files"].items()}
          changed = sorted(path for path in set(current) | set(recorded) if current.get(path) != recorded.get(path))
          expected = ["services/agent-service/tests/support/canonical_semantic_fixture.py"]
          if changed != expected:
              raise SystemExit("unexpected_protected_delta:" + json.dumps(changed, ensure_ascii=False))
          payload["generated_from"] = "git:" + os.environ["SOURCE_SHA"]
          payload["generated_at"] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace("+00:00", "Z")
          payload["file_count"] = len(current)
          payload["files"] = dict(sorted(current.items()))
          baseline_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps({"status":"PASS","changed":changed,"file_count":len(current)}, ensure_ascii=False))
          PY
          python -B -m unittest skill-system.tests.test_product_source_baseline_binding
          git diff --check -- skill-system/registry/product-source-baseline.json
          test "$(git diff --name-only)" = "skill-system/registry/product-source-baseline.json"

      - name: Publish baseline closure only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m 'Close current WP08 protected source baseline'
          git push origin HEAD:fix/wp08-single-authority-cutover-20260813
