name: Stage42 Postclosure Baseline Refresh

on:
  push:
    branches:
      - governance/stage4-2-final-obligation-pipeline-permit-20260816
    paths:
      - .github/stage42-postclosure-baseline-refresh.trigger

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact closed candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: governance/stage4-2-final-obligation-pipeline-permit-20260816
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Verify closed governed candidate source identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          sys.path.insert(0, str(root / 'skill-system/controller'))
          from verification import source_fingerprint

          payload = json.load(open('governance/active-change.json', encoding='utf-8'))
          closure = json.load(open(
              'governance/repair-cases/repair-stage4-2-dependency-obligation-evidence-pipeline/closure-matrix.json',
              encoding='utf-8',
          ))
          assert payload['status'] == 'closed', payload
          assert payload['result'] == 'CONVERGED', payload
          assert closure['result'] == 'CONVERGED', closure
          assert closure['final_decision'] == 'CLOSED_VERIFIED', closure

          verification = payload.get('verification') or {}
          fingerprint, file_count = source_fingerprint(root, payload['allowed_paths'])
          assert fingerprint == verification.get('source_fingerprint'), (fingerprint, verification)
          assert file_count == verification.get('source_file_count'), (file_count, verification)
          print(json.dumps({
              'status': 'PASS',
              'source_fingerprint': fingerprint,
              'source_file_count': file_count,
              'closure': closure['final_decision'],
          }, sort_keys=True))
          PY

      - name: Refresh tracked protected product-source baseline
        run: >-
          python -B scripts/refresh_product_source_baseline.py
          --generated-from-sha "$(git rev-parse HEAD)"

      - name: Verify refreshed binding
        run: |
          set -euo pipefail
          PYTHONPATH=services/agent-service/src python -B -m unittest \
            skill-system.tests.test_product_source_baseline_binding
          git diff --check

      - name: Commit governed baseline refresh
        run: |
          set -euo pipefail
          if git diff --quiet -- skill-system/registry/product-source-baseline.json; then
            echo 'Baseline already current'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json
          git commit -m 'chore(governance): refresh Stage 4.2 product source baseline'
          git push origin HEAD:governance/stage4-2-final-obligation-pipeline-permit-20260816
