name: stage4k2-finalize-once

on:
  push:
    branches:
      - feat/stage4k2-persistent-control-20260814

permissions:
  contents: write

concurrency:
  group: stage4k2-finalize-once
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      SOURCE_SHA: 64d5db2652f35c28d6115cd9f727894401c92e87
      BRANCH_NAME: feat/stage4k2-persistent-control-20260814
      WORKFLOW_PATH: .github/workflows/stage4k2-finalize-once.yml
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.BRANCH_NAME }}
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Verify frozen Stage4K2 source boundary
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$SOURCE_SHA" HEAD
          mapfile -t changed < <(git diff --name-only "$SOURCE_SHA" HEAD)
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "$WORKFLOW_PATH" ]; then
            printf 'unexpected files after frozen source SHA:\n%s\n' "${changed[*]}"
            exit 1
          fi

      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups

      - name: Run Stage4K2 focused contracts
        run: >-
          services/agent-service/.venv/bin/python -B -m pytest -q
          services/agent-service/tests/runtime/test_typed_goal_dependency_persistent_control.py
          services/agent-service/tests/runtime/test_typed_goal_dependency_signed_provider.py
          services/agent-service/tests/runtime/test_typed_goal_dependency_control_provider_contract.py
          services/agent-service/tests/runtime/test_typed_goal_dependency_activation_ingress.py

      - name: Assert focused tests did not mutate tracked source
        run: git diff --exit-code -- . ':!skill-system/registry/product-source-baseline.json'

      - name: Refresh protected product-source baseline from frozen source
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B scripts/refresh_product_source_baseline.py \
            --workspace . --generated-from-sha "$SOURCE_SHA"
          "${pythonLocation}/bin/python" - <<'PY'
          import json
          from pathlib import Path
          path = Path('skill-system/registry/product-source-baseline.json')
          payload = json.loads(path.read_text(encoding='utf-8'))
          assert payload['generated_from'] == 'git:64d5db2652f35c28d6115cd9f727894401c92e87'
          assert payload['file_count'] == 601, payload['file_count']
          expected = {
              'services/agent-service/src/agent_core/runtime/dependency_authority_persistent_control.py',
              'services/agent-service/migrations/agent_db/versions/0006_dependency_authority_control.py',
              'services/agent-service/tests/runtime/test_typed_goal_dependency_persistent_control.py',
          }
          assert expected <= set(payload['files'])
          print(json.dumps({
              'file_count': payload['file_count'],
              'generated_from': payload['generated_from'],
              'generated_at': payload['generated_at'],
          }, sort_keys=True))
          PY

      - name: Commit refreshed baseline and remove one-shot workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json
          test -n "$(git diff --cached --name-only)"
          git commit -m 'Stage4K2: refresh protected source baseline'
          git rm "$WORKFLOW_PATH"
          git commit -m 'Remove Stage4K2 finalizer'
          git push origin "HEAD:$BRANCH_NAME"
