name: temporary-wp08-repair-baseline-refresh

"on":
  push:
    branches:
      - fix/wp08-collection-singleton-compiler-boundary-20260813
    paths:
      - .github/workflows/tmp-wp08-repair-baseline-refresh.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/wp08-collection-singleton-compiler-boundary-20260813
          fetch-depth: 1
          clean: true
          persist-credentials: true
      - name: Refresh protected changed-file baseline entries
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          paths = [
              "services/agent-service/src/agent_core/runtime/target_compiler.py",
              "services/agent-service/tests/runtime/test_deterministic_target_compiler.py",
              "services/agent-service/tests/runtime/test_execution_target_authority_cutover.py",
          ]
          baseline_path = Path("skill-system/registry/product-source-baseline.json")
          payload = json.loads(baseline_path.read_text(encoding="utf-8"))
          for item in paths:
              digest = hashlib.sha256(Path(item).read_bytes()).hexdigest()
              if item not in payload["files"]:
                  raise SystemExit(f"protected baseline missing expected tracked path: {item}")
              payload["files"][item] = digest
              print(item, digest)
          baseline_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add skill-system/registry/product-source-baseline.json
          if git diff --cached --quiet; then
            echo "baseline already current"
            exit 0
          fi
          git commit -m "Refresh WP-08 repair protected baselines"
          git push origin HEAD:fix/wp08-collection-singleton-compiler-boundary-20260813
