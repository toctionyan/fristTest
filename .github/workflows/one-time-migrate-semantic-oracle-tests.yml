name: One-time migrate semantic oracle tests
run-name: Migrate legacy exact-AST tests to effect coverage

"on":
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .github/semantic-oracle-test-migration-trigger

permissions:
  contents: write

jobs:
  migrate:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/refine-goal-dependency-target-inheritance'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/refine-goal-dependency-target-inheritance
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Migrate legacy semantic oracle tests
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          identity = root / 'services/agent-service/tests/runtime/test_b15b1_real_model_semantic_identity_boundary.py'
          text = identity.read_text(encoding='utf-8')
          old = 'monkeypatch.setattr(script, "_match_oracle", lambda **_kwargs: None)'
          new = 'monkeypatch.setattr(script, "_assert_effect_evidence_coverage", lambda **_kwargs: None)'
          if text.count(old) != 1:
              raise SystemExit(f'identity test expected one legacy matcher patch, found {text.count(old)}')
          identity.write_text(text.replace(old, new, 1), encoding='utf-8')

          governance = root / 'services/agent-service/tests/architecture/test_quality_loop_governance.py'
          text = governance.read_text(encoding='utf-8')
          legacy_count = text.count('._match_oracle(')
          if legacy_count != 4:
              raise SystemExit(f'governance test expected four legacy matcher calls, found {legacy_count}')
          text = text.replace('._match_oracle(', '._assert_effect_evidence_coverage(')
          if text.count('match="no unique model goal"') != 2:
              raise SystemExit('governance test expected two old unique-match assertions')
          text = text.replace(
              'match="no unique model goal"',
              'match="required effect evidence not covered"',
          )
          text = text.replace(
              'def test_protected_goal_smoke_rejects_fuzzy_or_ambiguous_span_matching() -> None:',
              'def test_protected_goal_smoke_rejects_fuzzy_but_accepts_composite_effect_evidence() -> None:',
              1,
          )
          lines = text.splitlines(keepends=True)
          case_index = next(
              index for index, line in enumerate(lines)
              if 'case_id="ambiguous-containment"' in line
          )
          with_index = next(
              index for index in range(case_index - 1, -1, -1)
              if lines[index].lstrip().startswith('with pytest.raises(')
          )
          del lines[with_index]
          end_index = next(
              index for index in range(with_index, len(lines))
              if lines[index].startswith('def test_process_group_cleanup')
          )
          for index in range(with_index, end_index):
              if lines[index].startswith('    '):
                  lines[index] = lines[index][4:]
          governance.write_text(''.join(lines), encoding='utf-8')
          PY

          rm -f .github/semantic-oracle-test-migration-trigger
          rm -f .github/workflows/one-time-update-semantic-oracle-tests.yml
          python -m py_compile \
            services/agent-service/tests/runtime/test_b15b1_real_model_semantic_identity_boundary.py \
            services/agent-service/tests/architecture/test_quality_loop_governance.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Migrate legacy semantic oracle tests to effect coverage"
          git push origin HEAD:agent/refine-goal-dependency-target-inheritance
