name: governed-repair-lifecycle-contract-migration

on:
  push:
    branches:
      - architecture/governed-repair-rca-write-grant-20260816
    paths:
      - .github/governed-repair-lifecycle-contract-trigger

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: architecture/governed-repair-rca-write-grant-20260816
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Project canonical lifecycle into write authority and architecture verifier
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          authority = Path('scripts/github_repair_authority.py')
          text = authority.read_text(encoding='utf-8')
          import_anchor = 'from typing import Any, Iterable, Mapping\n\n'
          import_block = 'from governed_repair_contract import PREWRITE_STATES, PROTECTED_AUTHORITY\n\n'
          if import_block not in text:
              if text.count(import_anchor) != 1:
                  raise SystemExit('repair-authority import anchor is not unique')
              text = text.replace(import_anchor, import_anchor + import_block, 1)
          local_states = '''PREWRITE_STATES = (\n    "DETECTED",\n    "EVIDENCE_FROZEN",\n    "RCA_READ_ONLY",\n    "INVARIANT_BOUND",\n    "REPAIR_PLAN_FROZEN",\n    "WRITE_GRANTED",\n)\n\n'''
          if local_states in text:
              text = text.replace(local_states, '', 1)
          authority_block = '''        "authority": {\n            "write_authority": True,\n            "scope_expansion_allowed": False,\n            "tests_oracles_write_allowed": False,\n            "workflow_write_allowed": False,\n            "governance_write_allowed": False,\n            "skill_control_plane_write_allowed": False,\n            "baseline_write_allowed": False,\n            "dependency_manifest_write_allowed": False,\n            "secret_write_allowed": False,\n            "merge_allowed": False,\n            "deploy_allowed": False,\n            "production_close_allowed": False,\n        },\n'''
          projected = '''        "authority": {"write_authority": True, **PROTECTED_AUTHORITY},\n'''
          if authority_block in text:
              text = text.replace(authority_block, projected, 1)
          elif projected not in text:
              raise SystemExit('repair-authority protected authority block not found')
          authority.write_text(text, encoding='utf-8')

          verifier = Path('scripts/verify_governed_repair_architecture.py')
          source = verifier.read_text(encoding='utf-8')
          typing_anchor = 'from typing import Any\n\n'
          canonical_import = 'from governed_repair_contract import GATES, PROTECTED_AUTHORITY, STATE_MACHINE\n\n'
          if canonical_import not in source:
              if source.count(typing_anchor) != 1:
                  raise SystemExit('architecture verifier import anchor is not unique')
              source = source.replace(typing_anchor, typing_anchor + canonical_import, 1)

          start = source.find('REQUIRED_STATES = (')
          end = source.find('\n\nREQUIRED_GATES = (', start)
          if start >= 0 and end >= 0:
              source = source[:start] + 'REQUIRED_STATES = STATE_MACHINE\n' + source[end + 2:]
          start = source.find('REQUIRED_GATES = (')
          end = source.find('\n\n\ndef _text', start)
          if start >= 0 and end >= 0:
              source = source[:start] + 'REQUIRED_GATES = GATES\n' + source[end:]

          old_stage3 = '    if "gh pr merge" in stage3_workflow or "workflow_dispatch" in stage3_workflow and "deploy" in stage3_workflow.casefold():\n        errors.append("stage3_contains_merge_or_deploy_authority")\n'
          new_stage3 = '    if any(\n        marker in stage3_workflow\n        for marker in ("gh pr merge", "kubectl ", "helm upgrade", "docker push")\n    ):\n        errors.append("stage3_contains_merge_or_deploy_authority")\n'
          if old_stage3 in source:
              source = source.replace(old_stage3, new_stage3, 1)

          source = source.replace(
              '        "same_failure_signature",\n',
              '        "ARCHITECTURE_REPLAN_AND_NEW_RCA",\n',
          )
          canonical_marker = '''    contract_authority = {\n        key: value for key, value in PROTECTED_AUTHORITY.items()\n    }\n    if contract_authority.get("merge_allowed") is not False or contract_authority.get("deploy_allowed") is not False:\n        errors.append("canonical_lifecycle_contract_expands_merge_or_deploy")\n\n'''
          aggregate_anchor = '    aggregate = "\\n".join(\n'
          if canonical_marker not in source:
              if source.count(aggregate_anchor) != 1:
                  raise SystemExit('architecture verifier aggregate anchor is not unique')
              source = source.replace(aggregate_anchor, canonical_marker + aggregate_anchor, 1)
          verifier.write_text(source, encoding='utf-8')
          PY
          python -m py_compile scripts/governed_repair_contract.py scripts/github_repair_authority.py scripts/verify_governed_repair_architecture.py
          python -B scripts/verify_governed_repair_architecture.py
      - name: Remove temporary lifecycle migration authority
        run: |
          set -euo pipefail
          git rm .github/workflows/governed-repair-lifecycle-contract-migration.yml
          git rm .github/governed-repair-lifecycle-contract-trigger
          git diff --check
      - name: Commit canonical lifecycle projection
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'refactor(repair): project canonical lifecycle contract'
          git push origin HEAD:architecture/governed-repair-rca-write-grant-20260816
