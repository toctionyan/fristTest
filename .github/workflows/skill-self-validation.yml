name: skill-self-validation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skill-self-validation:
    name: skill-self-validation
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout temporary governed carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: temp/v20.18-a2b-builder-20260812
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups

      - name: Apply architecture-compatible legacy-contract correction
        shell: bash
        run: |
          set -euo pipefail
          if grep -q "def _semantic_writer_declaration_result_projection" \
            services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py; then
            echo "Compatibility correction already present; validating existing candidate."
          else
            "${pythonLocation}/bin/python" -B scripts/temp_v2018_a2b_compat_fix.py
          fi

      - name: Compile corrected product sources
        run: |
          services/agent-service/.venv/bin/python -B -m py_compile \
            services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/lifecycle/protocol.py \
            services/agent-service/src/agent_core/lifecycle/semantic_contract.py \
            services/agent-service/tests/architecture/test_semantic_single_writer_invariants.py

      - name: Run focused A2/B and legacy semantic contracts
        env:
          PYTHONPATH: ${{ github.workspace }}/services/agent-service/src:${{ github.workspace }}/services/agent-service
        run: |
          services/agent-service/.venv/bin/python -B -m pytest -q \
            services/agent-service/tests/architecture/test_semantic_single_writer_invariants.py \
            services/agent-service/tests/runtime/test_semantic_output_coverage.py \
            services/agent-service/tests/runtime/test_unified_semantic_planning_contract.py \
            services/agent-service/tests/runtime/test_capability_contract_v2.py \
            services/agent-service/tests/runtime/test_unsupported_capability_surface_binding.py \
            services/agent-service/tests/runtime/test_wp08_attempt4_release_repairs.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py \
            skill-system/tests/test_semantic_dependency_repair_feedback.py \
            skill-system/tests/test_wp08_attempt7_final_repair.py \
            skill-system/tests/test_wp08_new_release_attempt5_semantic_boundary.py

      - name: Commit only corrected governed product paths
        shell: bash
        run: |
          set -euo pipefail
          git add \
            services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/lifecycle/protocol.py \
            services/agent-service/src/agent_core/lifecycle/semantic_contract.py \
            services/agent-service/tests/architecture/test_semantic_single_writer_invariants.py
          if git diff --cached --quiet; then
            echo "Corrected candidate already committed."
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Builder: reconcile A2/B with legacy semantic contracts"
          git push origin HEAD:temp/v20.18-a2b-builder-20260812
