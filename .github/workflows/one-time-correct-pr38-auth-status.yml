name: One-time correct PR 38 authorization status

on:
  push:
    branches:
      - agent/fix-cancel-refund-goal-boundary
    paths:
      - .github/workflows/one-time-correct-pr38-auth-status.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-cancel-refund-goal-boundary
          fetch-depth: 0

      - name: Correct expected workflow status and remove helper
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("services/agent-service/tests/context/strong_context_cases/semantic_goal_coverage_suite_v20_4.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          matches = [case for case in payload.get("cases", []) if case.get("id") == "semantic_cancel_and_refund_branch"]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one semantic_cancel_and_refund_branch case, found {len(matches)}")

          contracts = matches[0]["execution_contract"]["turn_contracts"]
          if len(contracts) != 1:
              raise SystemExit(f"expected exactly one turn contract, found {len(contracts)}")

          expected = contracts[0]["expected"]
          current = expected.get("workflow_statuses")
          if current != ["RUNNING"]:
              raise SystemExit(f"unexpected pre-correction workflow statuses: {current!r}")
          if expected.get("public_interaction") != "transaction_interaction":
              raise SystemExit("expected a transaction interaction")
          if expected.get("draft", {}).get("states") != ["AWAITING_AUTHORIZATION"]:
              raise SystemExit("expected an authorization-waiting draft")

          expected["workflow_statuses"] = ["AWAITING_AUTHORIZATION"]
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

          rm .github/workflows/one-time-correct-pr38-auth-status.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agent-service/tests/context/strong_context_cases/semantic_goal_coverage_suite_v20_4.json .github/workflows/one-time-correct-pr38-auth-status.yml
          git diff --cached --check
          git commit -m "Expect authorization wait for transaction workflow"
          git push origin HEAD:agent/fix-cancel-refund-goal-boundary
