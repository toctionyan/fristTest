name: wp08-attempt3-replay-repair-dispatch-attempt4-once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  replay-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt3-replay-repair-dispatch-attempt4-once-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_MAIN_SHA: 83251fe9e5e20fe66f9f80c569583a9e189214c8
      REPAIR_PR_NUMBER: '361'
      RELEASE_ISSUE_NUMBER: '335'
      EXPECTED_RELEASE_ID: wp08-release-31340813528
      PARENT_WP08_RUN_ID: '31344310588'
      EXPECTED_ATTEMPT: '4'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact authoritative main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Wait for exact-main push Quality success
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python - <<'PY'
          import json, os, time
          from urllib import parse, request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          sha = os.environ['EXPECTED_MAIN_SHA']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          deadline = time.time() + 12 * 60
          last = None
          while time.time() < deadline:
              query = parse.urlencode({'event': 'push', 'branch': 'main', 'per_page': 50})
              req = request.Request(
                  f'https://api.github.com/repos/{repo}/actions/workflows/quality.yml/runs?{query}',
                  headers=headers,
              )
              with request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              matches = [r for r in payload.get('workflow_runs') or []
                         if str(r.get('head_sha') or '') == sha
                         and str(r.get('head_branch') or '') == 'main']
              if matches:
                  run = max(matches, key=lambda row: int(row.get('id') or 0))
                  last = {'id': int(run.get('id') or 0), 'status': str(run.get('status') or ''), 'conclusion': str(run.get('conclusion') or '')}
                  print(json.dumps({'exact_main_quality': last, 'candidate_sha': sha}, sort_keys=True), flush=True)
                  if last['status'] == 'completed':
                      if last['conclusion'] != 'success':
                          raise SystemExit('exact-main push Quality is non-success: ' + json.dumps(last, sort_keys=True))
                      break
              time.sleep(15)
          else:
              raise SystemExit('timed out waiting for exact-main push Quality: ' + json.dumps(last, sort_keys=True))
          PY

      - name: Reconstruct exact merged repair event
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          from urllib import request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          pr_number = int(os.environ['REPAIR_PR_NUMBER'])
          sha = os.environ['EXPECTED_MAIN_SHA']
          release_id = os.environ['EXPECTED_RELEASE_ID']
          parent_run = os.environ['PARENT_WP08_RUN_ID']
          req = request.Request(
              f'https://api.github.com/repos/{repo}/pulls/{pr_number}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with request.urlopen(req, timeout=30) as response:
              pr = json.load(response)
          if pr.get('merged') is not True:
              raise SystemExit('repair PR is not merged')
          if str(pr.get('merge_commit_sha') or '') != sha:
              raise SystemExit('repair PR merge SHA does not equal exact main')
          if str((pr.get('base') or {}).get('ref') or '') != 'main':
              raise SystemExit('repair PR base is not main')
          body = str(pr.get('body') or '')
          if f'WP08-Release-Run-ID: {release_id}' not in body:
              raise SystemExit('repair PR release marker missing')
          if f'WP08-Parent-Run-ID: {parent_run}' not in body:
              raise SystemExit('repair PR parent marker missing')
          Path('/tmp/wp08-repair-event.json').write_text(json.dumps({'pull_request': pr}), encoding='utf-8')
          print(json.dumps({'repair_pr': pr_number, 'merge_sha': sha, 'markers': 'exact'}, sort_keys=True))
          PY

      - name: Replay repository-owned repair transition and dispatch Attempt 4
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python -B scripts/wp08_release_coordinator.py --mode pull-request --event-path /tmp/wp08-repair-event.json

      - name: Verify durable ReleaseRun advanced exactly once
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib import request
          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          issue_number = int(os.environ['RELEASE_ISSUE_NUMBER'])
          expected_sha = os.environ['EXPECTED_MAIN_SHA']
          expected_attempt = int(os.environ['EXPECTED_ATTEMPT'])
          parent_run = int(os.environ['PARENT_WP08_RUN_ID'])
          req = request.Request(
              f'https://api.github.com/repos/{repo}/issues/{issue_number}',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with request.urlopen(req, timeout=30) as response:
              issue = json.load(response)
          body = str(issue.get('body') or '')
          block = body.split('<!-- WP08_RELEASE_RUN_STATE_BEGIN -->', 1)[1].split('<!-- WP08_RELEASE_RUN_STATE_END -->', 1)[0]
          state = json.loads(block.split('```json', 1)[1].split('```', 1)[0])
          if state.get('status') != 'CERTIFYING':
              raise SystemExit('ReleaseRun did not advance to CERTIFYING: ' + str(state.get('status')))
          if int(state.get('attempt') or 0) != expected_attempt:
              raise SystemExit('ReleaseRun attempt mismatch: ' + str(state.get('attempt')))
          if str(state.get('current_candidate_sha') or '') != expected_sha:
              raise SystemExit('Attempt 4 candidate SHA mismatch')
          if state.get('production_closed') is not False:
              raise SystemExit('production_closed changed unexpectedly')
          current_run = int(state.get('current_wp08_run_id') or 0)
          if current_run <= 0 or current_run == parent_run:
              raise SystemExit('Attempt 4 did not receive a new WP-08 run id')
          repair = state.get('repair_pr') or {}
          if int(repair.get('number') or 0) != int(os.environ['REPAIR_PR_NUMBER']):
              raise SystemExit('repair PR binding mismatch')
          if str(repair.get('merge_commit_sha') or '') != expected_sha:
              raise SystemExit('repair merge binding mismatch')
          history = list(state.get('history') or [])
          repair_rows = [r for r in history if isinstance(r, dict) and r.get('event') == 'repair_merged' and int(r.get('pr_number') or 0) == int(os.environ['REPAIR_PR_NUMBER']) and str(r.get('candidate_sha') or '') == expected_sha]
          dispatch_rows = [r for r in history if isinstance(r, dict) and r.get('event') == 'wp08_dispatched' and int(r.get('attempt') or 0) == expected_attempt and str(r.get('candidate_sha') or '') == expected_sha and int(r.get('wp08_run_id') or 0) == current_run]
          if len(repair_rows) != 1:
              raise SystemExit('expected exactly one repair_merged history row')
          if len(dispatch_rows) != 1:
              raise SystemExit('expected exactly one Attempt 4 dispatch row')
          print(json.dumps({'status': 'PASS', 'issue': issue_number, 'attempt': expected_attempt, 'candidate_sha': expected_sha, 'wp08_run_id': current_run, 'production_closed': False}, sort_keys=True))
          PY
