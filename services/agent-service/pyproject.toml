[project]
name = "ecommerce-agent-service"
version = "20.6.1"
description = "Artifact-ledger native tool/skill ecommerce Agent; consumes an external Business Service through HTTP"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115.0",
  "httpx>=0.27.0",
  "uvicorn[standard]>=0.30.0",
  "python-dotenv>=1.0.1",
  "pydantic>=2.7.0",
  "python-multipart>=0.0.9",
  "langchain-core>=0.3.0",
  "langchain-openai>=0.2.0",
  "langchain-deepseek>=1.1.0,<2.0.0",
  "langgraph>=0.2.50",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "langgraph-checkpoint-postgres>=2.0.0",
  "SQLAlchemy>=2.0.30",
  "alembic>=1.13.0",
  "psycopg[binary,pool]>=3.2.0",
  "cryptography>=45.0",
  "pypdf>=4.2.0",
  "python-docx>=1.1.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agent_core = ["presentation/contracts/*.json"]

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "httpx>=0.27",
]

[tool.pytest.ini_options]
markers = [
  "integration: requires separately running Agent and Business services",
  "preprod: requires protected preproduction credentials",
]

[tool.uv]
default-groups = ["dev"]
