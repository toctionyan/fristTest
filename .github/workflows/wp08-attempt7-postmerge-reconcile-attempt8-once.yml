name: wp08-attempt7-postmerge-reconcile-attempt8-once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt7-postmerge-reconcile-attempt8-once-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      EXPECTED_MAIN_SHA: 1ed0be9a2ad0965813142c532df3d13bb1b225e1
      PARENT_WP08_RUN_ID: '31321476958'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact repaired authoritative main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Wait for completed successful exact-main Quality
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python - <<'PY'
          import json
          import os
          import time
          from urllib import parse, request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          expected_sha = os.environ['EXPECTED_MAIN_SHA']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          deadline = time.time() + 12 * 60
          last = None
          while time.time() < deadline:
              query = parse.urlencode({'event': 'push', 'branch': 'main', 'per_page': 50})
              req = request.Request(
                  f'https://api.github.com/repos/{repo}/actions/workflows/quality.yml/runs?{query}',
                  headers=headers,
              )
              with request.urlopen(req, timeout=30) as response:
                  payload = json.load(response)
              matches = [
                  row for row in payload.get('workflow_runs') or []
                  if str(row.get('head_sha') or '') == expected_sha
                  and str(row.get('head_branch') or '') == 'main'
              ]
              if matches:
                  run = max(matches, key=lambda row: int(row.get('id') or 0))
                  last = {
                      'id': int(run.get('id') or 0),
                      'status': str(run.get('status') or ''),
                      'conclusion': str(run.get('conclusion') or ''),
                  }
                  print(json.dumps({'quality': last, 'candidate_sha': expected_sha}, sort_keys=True), flush=True)
                  if last['status'] == 'completed':
                      if last['conclusion'] != 'success':
                          raise SystemExit('exact-main Quality completed non-success: ' + json.dumps(last, sort_keys=True))
                      break
              time.sleep(15)
          else:
              raise SystemExit('timed out waiting for exact-main Quality: ' + json.dumps(last, sort_keys=True))
          PY

      - name: Reconcile exact-main Quality and permit only final Attempt 8
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python -B scripts/wp08_release_recovery.py --mode reconcile
          python - <<'PY'
          import json
          import os
          from urllib import request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          expected_sha = os.environ['EXPECTED_MAIN_SHA']
          parent_run = int(os.environ['PARENT_WP08_RUN_ID'])
          req = request.Request(
              f'https://api.github.com/repos/{repo}/issues/293',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with request.urlopen(req, timeout=30) as response:
              issue = json.load(response)
          body = str(issue.get('body') or '')
          state_text = body.split('<!-- WP08_RELEASE_RUN_STATE_BEGIN -->', 1)[1].split('<!-- WP08_RELEASE_RUN_STATE_END -->', 1)[0]
          payload = state_text.split('```json', 1)[1].split('```', 1)[0]
          state = json.loads(payload)
          if str(state.get('status') or '') != 'CERTIFYING':
              raise SystemExit('ReleaseRun did not advance to CERTIFYING: ' + str(state.get('status')))
          if int(state.get('attempt') or 0) != 8:
              raise SystemExit('ReleaseRun attempt is not exactly final Attempt 8: ' + str(state.get('attempt')))
          if int(state.get('max_attempts') or 0) != 8:
              raise SystemExit('ReleaseRun max_attempts changed unexpectedly')
          if str(state.get('current_candidate_sha') or '') != expected_sha:
              raise SystemExit('Attempt 8 candidate SHA mismatch')
          if state.get('production_closed') is not False:
              raise SystemExit('production_closed changed unexpectedly before certification')
          current_run = int(state.get('current_wp08_run_id') or 0)
          if current_run <= 0 or current_run == parent_run:
              raise SystemExit(f'Attempt 8 did not receive a new WP-08 run id: {current_run}')
          history = list(state.get('history') or [])
          if not any(
              isinstance(row, dict)
              and row.get('event') == 'wp08_dispatched'
              and int(row.get('attempt') or 0) == 8
              and str(row.get('candidate_sha') or '') == expected_sha
              and int(row.get('wp08_run_id') or 0) == current_run
              for row in history
          ):
              raise SystemExit('Attempt 8 dispatch history is missing or not exact-main bound')
          print(json.dumps({
              'status': 'PASS',
              'issue': 293,
              'release_state': 'CERTIFYING',
              'attempt': 8,
              'max_attempts': 8,
              'candidate_sha': expected_sha,
              'wp08_run_id': current_run,
              'production_closed': False,
          }, sort_keys=True))
          PY
