name: One-time fix independent goal dependencies
run-name: Apply independent goal dependency repair

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
    paths:
      - .github/independent-goal-dependency-repair-trigger

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: agent/fix-independent-goal-dependency-semantics
          fetch-depth: 0
          token: ${{ github.token }}
      - name: Apply repair and remove one-time helpers
        shell: bash
        run: |
          python -B scripts/one_time_fix_independent_goal_dependencies.py
          rm scripts/one_time_fix_independent_goal_dependencies.py
          rm .github/workflows/one-time-fix-independent-goal-dependencies.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Clarify independent goal dependency semantics"
          git push origin HEAD:agent/fix-independent-goal-dependency-semantics
