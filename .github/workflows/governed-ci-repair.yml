name: governed-ci-repair

on:
  workflow_run:
    workflows:
      - quality
      - skill-self-validation
      - wp08-full-stack-certification
      - governed-repair-validation
    types: [completed]

permissions:
  contents: read
  actions: read

concurrency:
  group: governed-ci-repair-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      github.event.workflow_run.conclusion != 'success' &&
      (!startsWith(github.event.workflow_run.head_branch, 'governed-repair/') ||
       github.event.workflow_run.name == 'governed-repair-validation')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    outputs:
      repair_allowed: ${{ steps.ingest.outputs.repair_allowed }}
      classification: ${{ steps.ingest.outputs.classification }}
      repair_branch: ${{ steps.ingest.outputs.repair_branch }}
      repair_base_branch: ${{ steps.ingest.outputs.repair_base_branch }}
      head_sha: ${{ steps.ingest.outputs.head_sha }}
      head_branch: ${{ steps.ingest.outputs.head_branch }}
      source_pr_number: ${{ steps.ingest.outputs.source_pr_number }}
      workflow_run_id: ${{ steps.ingest.outputs.workflow_run_id }}
      failure_signature: ${{ steps.ingest.outputs.failure_signature }}
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout same-repository failed candidate without credentials
        if: github.event.workflow_run.head_repository.full_name == github.repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: candidate
          fetch-depth: 80
          clean: true
          persist-credentials: false

      - name: Prepare non-repairable fork workspace
        if: github.event.workflow_run.head_repository.full_name != github.repository
        run: mkdir -p candidate

      - name: Download failed-run artifacts
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: incoming/artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Download failed-run job logs
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p incoming/logs
          if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/logs" > incoming/logs.zip; then
            unzip -q incoming/logs.zip -d incoming/logs || true
          fi

      - name: Resolve associated pull request
        id: source_pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        run: |
          NUMBER="${EVENT_PR_NUMBER}"
          if [[ -z "${NUMBER}" || "${NUMBER}" == "0" ]]; then
            NUMBER=$(gh pr list --state open --head "${HEAD_BRANCH}" --json number --jq '.[0].number // empty')
          fi
          printf 'number=%s\n' "${NUMBER}" >> "$GITHUB_OUTPUT"
          if [[ -n "${NUMBER}" ]]; then
            gh pr view "${NUMBER}" --json headRefName,baseRefName \
              --jq '{number:'"${NUMBER}"',head:.headRefName,base:.baseRefName}' > incoming/pr-context.json
          else
            jq -n --arg head "${HEAD_BRANCH}" '{number:0,head:$head,base:"main"}' > incoming/pr-context.json
          fi

      - name: Capture associated PR changed files
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR_NUMBER: ${{ steps.source_pr.outputs.number }}
        run: |
          if [[ -n "${SOURCE_PR_NUMBER}" && "${SOURCE_PR_NUMBER}" != "0" ]]; then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR_NUMBER}/files" \
              --jq '.[].filename' | jq -R -s 'split("\n")[:-1]' > incoming/changed-files.json
          else
            printf '[]\n' > incoming/changed-files.json
          fi

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Ingest failure into TaskRun
        id: ingest
        run: >-
          "${pythonLocation}/bin/python" -B control/scripts/github_failure_ingest.py
          --event "$GITHUB_EVENT_PATH"
          --workspace candidate
          --artifacts incoming/artifacts
          --logs incoming/logs
          --changed-files incoming/changed-files.json
          --pr-context incoming/pr-context.json
          --output incoming/failure-case.json
          --task-run incoming/task-run.json
          --github-output "$GITHUB_OUTPUT"

      - name: Upload governed failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-repair-ingest-${{ github.event.workflow_run.id }}
          path: |
            incoming/failure-case.json
            incoming/task-run.json
            incoming/changed-files.json
            incoming/pr-context.json
          retention-days: 30
          if-no-files-found: error

      - name: Publish non-repairable failure issue
        if: steps.ingest.outputs.repair_allowed != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          CLASSIFICATION: ${{ steps.ingest.outputs.classification }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          TITLE="[governed-ci-repair] ${GITHUB_REPOSITORY} run ${SOURCE_RUN_ID} blocked"
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')
          BODY=$(cat <<EOF
          The GitHub failure bridge ingested this run automatically.

          - Source run: ${SOURCE_URL}
          - Classification: \`${CLASSIFICATION}\`
          - Automatic source repair: not authorized
          - Evidence artifact: \`governed-repair-ingest-${SOURCE_RUN_ID}\`
          - Production closure: false

          Environment, secret, timeout, interruption, fork, unknown, repeated-failure, or protected-control-plane failures are fail-closed and are never converted into source edits.
          EOF
          )
          if [[ -n "${EXISTING}" ]]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
          else
            gh issue create --title "${TITLE}" --body "${BODY}"
          fi

  repair:
    needs: ingest
    if: needs.ingest.outputs.repair_allowed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: production-certification
    permissions:
      contents: write
      actions: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout trusted control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout failed candidate without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.ingest.outputs.head_sha }}
          path: candidate
          fetch-depth: 80
          clean: true
          persist-credentials: false

      - name: Download ingested failure evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: governed-repair-ingest-${{ needs.ingest.outputs.workflow_run_id }}
          path: incoming

      - name: Add semantic failure signature
        run: |
          SEMANTIC=$(jq -c '{workflow_name,classification,failed_gates,failure_summary}' incoming/failure-case.json | sha256sum | awk '{print $1}')
          jq --arg semantic "$SEMANTIC" '.semantic_failure_signature=$semantic' incoming/failure-case.json > incoming/failure-case.tmp
          mv incoming/failure-case.tmp incoming/failure-case.json

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Prepare isolated repair branch
        env:
          REPAIR_BRANCH: ${{ needs.ingest.outputs.repair_branch }}
          SOURCE_SHA: ${{ needs.ingest.outputs.head_sha }}
        run: |
          git -C candidate checkout -B "${REPAIR_BRANCH}" "${SOURCE_SHA}"
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"
          mkdir -p repair-evidence

      - name: Run one bounded multi-role model repair cycle
        id: repair_cycle
        env:
          GOVERNED_REPAIR_MODEL_PROVIDER: ${{ vars.REAL_MODEL_CERTIFICATION_PROVIDER || vars.PRODUCTION_MODEL_PROVIDER || vars.MODEL_PROVIDER }}
          GOVERNED_REPAIR_MODEL: ${{ vars.OPENAI_MODEL || vars.PRODUCTION_MODEL_ID || vars.MODEL_ID }}
          GOVERNED_REPAIR_MODEL_API_BASE: ${{ vars.OPENAI_API_BASE || vars.PRODUCTION_MODEL_API_BASE || vars.MODEL_API_BASE }}
          GOVERNED_REPAIR_MODEL_API_KEY: ${{ secrets.PRODUCTION_MODEL_API_KEY }}
        run: >-
          "${pythonLocation}/bin/python" -B control/scripts/github_repair_orchestrator.py
          --control-root control
          --workspace candidate
          --failure-case incoming/failure-case.json
          --task-run incoming/task-run.json
          --evidence-root repair-evidence
          --max-cycles 8
          --github-output "$GITHUB_OUTPUT"

      - name: Verify the repair commit is clean and scoped
        env:
          SOURCE_SHA: ${{ needs.ingest.outputs.head_sha }}
        run: |
          test "$(git -C candidate rev-parse HEAD)" = "${{ steps.repair_cycle.outputs.repair_commit }}"
          test "$(git -C candidate rev-list --count "${SOURCE_SHA}..HEAD")" -gt 0
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"
          git -C candidate diff --check "${SOURCE_SHA}..HEAD"
          git -C candidate diff --name-only "${SOURCE_SHA}..HEAD" > repair-evidence/changed-paths.txt
          if grep -E '^(governance/|skill-system/|scripts/|deployment/|\.github/)' repair-evidence/changed-paths.txt; then
            echo "protected control-plane path changed" >&2
            exit 1
          fi

      - name: Push repair branch
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_BRANCH: ${{ needs.ingest.outputs.repair_branch }}
        run: |
          git -C candidate remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git -C candidate push origin "HEAD:refs/heads/${REPAIR_BRANCH}"

      - name: Create or update Draft repair PR
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_BRANCH: ${{ needs.ingest.outputs.repair_branch }}
          REPAIR_BASE: ${{ needs.ingest.outputs.repair_base_branch }}
          SOURCE_RUN_ID: ${{ needs.ingest.outputs.workflow_run_id }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
          REPAIR_CYCLE: ${{ steps.repair_cycle.outputs.repair_cycle }}
        run: |
          EXISTING=$(gh pr list --state open --head "${REPAIR_BRANCH}" --json url --jq '.[0].url // empty')
          BODY=$(cat <<EOF
          ## Governed repair

          - Automatically ingested source run: ${SOURCE_URL}
          - Source Run ID: \`${SOURCE_RUN_ID}\`
          - Repair cycle: \`${REPAIR_CYCLE}\` of at most 8
          - Four-role model governance: explorer → plan reviewer → restricted fixer → diff reviewer
          - Candidate validation: dispatched to a separate no-secret workflow
          - Direct write to protected main: no
          - Automatic merge: no
          - Automatic production closure: false

          This PR remains Draft. Quick and deterministic Integration validation run outside the secret-bearing repair process.
          EOF
          )
          if [[ -n "${EXISTING}" ]]; then
            gh pr comment "${EXISTING}" --body "${BODY}"
            PR_URL="${EXISTING}"
          else
            PR_URL=$(gh pr create --draft --base "${REPAIR_BASE}" --head "${REPAIR_BRANCH}" \
              --title "Governed repair: workflow run ${SOURCE_RUN_ID}" --body "${BODY}")
          fi
          echo "pr_url=${PR_URL}" >> "$GITHUB_OUTPUT"

      - name: Upload cycle TaskRun for isolated validation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-repair-task-${{ steps.repair_cycle.outputs.task_id }}-${{ needs.ingest.outputs.workflow_run_id }}
          path: |
            incoming/task-run.json
            incoming/failure-case.json
            repair-evidence
          retention-days: 30
          if-no-files-found: error

      - name: Dispatch isolated no-secret validation
        env:
          GH_TOKEN: ${{ github.token }}
          REPAIR_BRANCH: ${{ needs.ingest.outputs.repair_branch }}
          REPAIR_COMMIT: ${{ steps.repair_cycle.outputs.repair_commit }}
          TASK_ID: ${{ steps.repair_cycle.outputs.task_id }}
          SOURCE_RUN_ID: ${{ needs.ingest.outputs.workflow_run_id }}
          REPAIR_CYCLE: ${{ steps.repair_cycle.outputs.repair_cycle }}
          PR_URL: ${{ steps.publish.outputs.pr_url }}
        run: |
          gh workflow run governed-repair-validation.yml \
            --ref "${REPAIR_BRANCH}" \
            -f repair_sha="${REPAIR_COMMIT}" \
            -f bridge_run_id="${GITHUB_RUN_ID}" \
            -f task_id="${TASK_ID}" \
            -f source_run_id="${SOURCE_RUN_ID}" \
            -f repair_cycle="${REPAIR_CYCLE}" \
            -f pr_url="${PR_URL}"

      - name: Publish blocked repair issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ needs.ingest.outputs.workflow_run_id }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          TITLE="[governed-ci-repair] automatic repair ${SOURCE_RUN_ID} blocked"
          BODY="Automatic repair stopped fail-closed. Source: ${SOURCE_URL}. Inspect the governed repair artifacts. No protected branch was changed and production closure remains false."
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" --json number --jq '.[0].number // empty')
          if [[ -n "${EXISTING}" ]]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
          else
            gh issue create --title "${TITLE}" --body "${BODY}"
          fi
