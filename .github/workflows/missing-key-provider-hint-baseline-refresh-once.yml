name: Missing Key Provider Hint Baseline Refresh Once

on:
  push:
    branches:
      - fix/missing-key-provider-hint-isolation-20260815
    paths:
      - .github/workflows/missing-key-provider-hint-baseline-refresh-once.yml

permissions:
  contents: write

concurrency:
  group: missing-key-provider-hint-baseline-refresh-once
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'toctionyan/fristTest' && github.ref_name == 'fix/missing-key-provider-hint-isolation-20260815'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/missing-key-provider-hint-isolation-20260815
          fetch-depth: 0
          persist-credentials: true

      - name: Verify repair scope and refresh protected baseline
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          python3 -B - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.').resolve()
          baseline_path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(baseline_path.read_text(encoding='utf-8'))
          protected_roots = tuple(str(value) for value in payload.get('protected_roots') or ())
          if protected_roots != ('services', 'web', 'contracts'):
              raise SystemExit(f'unexpected_protected_roots:{protected_roots!r}')

          expected_repair_paths = {
              'services/agent-service/tests/runtime/test_b15b1_real_model_semantic_identity_boundary.py',
              'services/agent-service/tests/runtime/test_b15b2_real_model_lifecycle_attestation_boundary.py',
          }
          diff_raw = subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main...HEAD', '--', *protected_roots],
              cwd=root,
              text=True,
          )
          protected_diff = {line.strip() for line in diff_raw.splitlines() if line.strip()}
          if protected_diff != expected_repair_paths:
              raise SystemExit(
                  'unexpected_protected_branch_diff:' + ','.join(sorted(protected_diff))
              )

          raw = subprocess.check_output(
              ['git', 'ls-files', '-z', '--', *protected_roots],
              cwd=root,
          )
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          current = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          previous = {str(k): str(v) for k, v in (payload.get('files') or {}).items()}
          added = set(current) - set(previous)
          changed_existing = {
              path for path in set(current) & set(previous)
              if current[path] != previous[path]
          }
          removed = set(previous) - set(current)
          if added:
              raise SystemExit('unexpected_added_protected_paths:' + ','.join(sorted(added)))
          if changed_existing != expected_repair_paths:
              raise SystemExit(
                  'unexpected_changed_existing_protected_paths:'
                  + ','.join(sorted(changed_existing))
              )
          if removed:
              raise SystemExit('unexpected_removed_protected_paths:' + ','.join(sorted(removed)))

          source_head = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], cwd=root, text=True
          ).strip()
          payload['file_count'] = len(current)
          payload['files'] = dict(sorted(current.items()))
          payload['generated_at'] = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace('+00:00', 'Z')
          )
          payload['generated_from'] = 'git:' + source_head
          baseline_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'status': 'PASS',
              'source_head': source_head,
              'file_count': len(current),
              'added': sorted(added),
              'changed_existing': sorted(changed_existing),
              'removed': sorted(removed),
              'hashes': {path: current[path] for path in sorted(expected_repair_paths)},
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish governed baseline and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/missing-key-provider-hint-baseline-refresh-once.yml
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json .github/workflows/missing-key-provider-hint-baseline-refresh-once.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/missing-key-provider-hint-baseline-refresh-once.yml skill-system/registry/product-source-baseline.json "
          git commit -m 'Refresh missing-key provider-hint protected product-source baseline'
          git push origin HEAD:fix/missing-key-provider-hint-isolation-20260815
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
