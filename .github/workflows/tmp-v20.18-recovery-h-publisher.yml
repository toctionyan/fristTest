name: tmp-v20.18-governance-recovery-d4-reconciliation-publisher

on:
  push:
    branches:
      - tmp/v20.18-governance-recovery-20260814
    paths:
      - .github/workflows/tmp-v20.18-recovery-h-publisher.yml
      - .github/recovery_d4_reconciliation_publish.py

permissions:
  contents: write
  actions: read

jobs:
  d4-governance-reconciliation-branch-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Download immutable D2b bound-export artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          zip="${RUNNER_TEMP}/d2b-bound-export.zip"
          out="${RUNNER_TEMP}/d2b-bound-export"
          rm -rf "$out" "$zip"
          mkdir -p "$out"
          curl --fail --silent --show-error --location \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9237447365/zip" \
            --output "$zip"
          unzip -q "$zip" -d "$out"
          test -f "$out/bound-export-summary.json"

      - name: Revalidate exact-main D3 simulation before publish
        env:
          D2B_ARTIFACT_DIR: ${{ runner.temp }}/d2b-bound-export
          D3_OUT_DIR: ${{ runner.temp }}/recovery-d3-revalidated
        run: python3 -B .github/recovery_d3_reconciliation_sim.py

      - name: Publish one governance-only reconciliation branch
        env:
          D2B_ARTIFACT_DIR: ${{ runner.temp }}/d2b-bound-export
          D3_OUT_DIR: ${{ runner.temp }}/recovery-d3-revalidated
          D4_OUT_DIR: ${{ github.workspace }}/recovery-d4-publish-artifact
        run: python3 -B .github/recovery_d4_reconciliation_publish.py

      - name: Upload D4 reconciliation publish evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v20.18-governance-recovery-d4-reconciliation-publish
          path: recovery-d4-publish-artifact
          if-no-files-found: error
