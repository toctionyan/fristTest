name: governed-ci-existing-candidate-solo-governance

on:
  workflow_dispatch:
    inputs:
      adoption_run_id:
        description: Exact successful existing-candidate adoption workflow run ID
        required: true
        type: string
      adoption_run_attempt:
        description: Exact adoption run attempt
        required: false
        default: '1'
        type: string
      approval_token:
        description: Type CLOSE_SOLO_GOVERNANCE_AND_ACCEPT_BASELINE to acknowledge solo-owner G6
        required: true
        type: string

permissions:
  contents: read
  actions: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: governed-existing-candidate-solo-governance-${{ inputs.adoption_run_id }}-${{ inputs.adoption_run_attempt }}
  cancel-in-progress: false

jobs:
  solo-governance-baseline-exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
      pull-requests: write
      issues: read
    steps:
      - name: Require explicit repository-owner acknowledgement
        env:
          APPROVAL_TOKEN: ${{ inputs.approval_token }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          if [[ "${APPROVAL_TOKEN}" != "CLOSE_SOLO_GOVERNANCE_AND_ACCEPT_BASELINE" ]]; then
            echo "explicit solo-owner governance acknowledgement token is required" >&2
            exit 1
          fi
          if [[ "${GITHUB_ACTOR}" != "${GITHUB_REPOSITORY_OWNER}" ]]; then
            echo "solo governance may only be acknowledged by the repository owner" >&2
            exit 1
          fi

      - name: Checkout trusted governance control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve exact successful read-only adoption artifact
        id: adoption
        env:
          GH_TOKEN: ${{ github.token }}
          ADOPTION_RUN_ID: ${{ inputs.adoption_run_id }}
          ADOPTION_RUN_ATTEMPT: ${{ inputs.adoption_run_attempt }}
        run: |
          set -euo pipefail
          [[ "${ADOPTION_RUN_ID}" =~ ^[1-9][0-9]*$ ]]
          [[ "${ADOPTION_RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]]
          mkdir -p incoming
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ADOPTION_RUN_ID}" > incoming/adoption-run.json
          jq -e --arg attempt "${ADOPTION_RUN_ATTEMPT}" '
            .name == "governed-ci-existing-candidate-adoption"
            and .event == "issue_comment"
            and .status == "completed"
            and .conclusion == "success"
            and ((.run_attempt | tostring) == $attempt)
          ' incoming/adoption-run.json >/dev/null
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${ADOPTION_RUN_ID}/artifacts?per_page=100" > incoming/artifacts.json
          artifact_id=$(jq -r '[.artifacts[]
            | select(.expired == false)
            | select(.name | startswith("governed-ci-existing-candidate-adoption-published-"))]
            | sort_by(.created_at) | reverse | .[0].id // empty' incoming/artifacts.json)
          [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > incoming/adoption.zip
          unzip -q incoming/adoption.zip -d incoming/adoption
          for required in \
            publication-result.json validation-result.json task-run.json \
            adoption-authority.json adoption-plan.json profile-validation.json \
            adoption-profile.json quick-summary.json pr.json; do
            mapfile -t matches < <(find incoming/adoption -type f -name "${required}" -print)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "expected exactly one ${required}, found ${#matches[@]}" >&2
              exit 1
            fi
          done
          publication=$(find incoming/adoption -type f -name publication-result.json -print -quit)
          authority=$(find incoming/adoption -type f -name adoption-authority.json -print -quit)
          jq -e '
            .schema == "github-governed-repair-draft-publication@1"
            and .status == "DRAFT_REPAIR_PR_PUBLISHED_AWAITING_GOVERNANCE"
            and .governed_repair_state == "GOVERNANCE_REQUIRED"
            and .candidate_origin == "existing_pr_adoption"
            and .write_authority_effect == false
            and .draft_pr_published == true
            and .governance_closed == false
            and .baseline_accepted == false
            and .exact_head_certified == false
            and .ready_for_review == false
            and .merge_allowed == false
            and .deploy_allowed == false
            and .production_closed == false
          ' "${publication}" >/dev/null
          jq -e '
            .schema == "governed-existing-candidate-no-write-authority@1"
            and .write_authority_effect == false
            and .source_writes_allowed == false
            and .test_or_oracle_writes_allowed == false
            and .workflow_writes_allowed == false
            and .baseline_writes_allowed == false
            and .merge_allowed == false
            and .deploy_allowed == false
            and .production_closed == false
          ' "${authority}" >/dev/null
          echo "publication=${publication}" >> "$GITHUB_OUTPUT"

      - name: Bind Draft PR to exact adopted source SHA
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLICATION: ${{ steps.adoption.outputs.publication }}
        run: |
          set -euo pipefail
          pr_url=$(jq -r '.draft_pr_url' "${PUBLICATION}")
          source_sha=$(jq -r '.published_source_sha' "${PUBLICATION}")
          branch=$(jq -r '.repair_branch' "${PUBLICATION}")
          base=$(jq -r '.repair_base_branch' "${PUBLICATION}")
          [[ "${source_sha}" =~ ^[0-9a-f]{40}$ ]]
          state=$(gh pr view "${pr_url}" --json number,isDraft,state,headRefName,headRefOid,baseRefName,url)
          pr_number=$(jq -r '.number' <<<"${state}")
          [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]]
          jq -e --arg head "${branch}" --arg base "${base}" --arg sha "${source_sha}" --argjson pr_number "${pr_number}" '
            .state == "OPEN"
            and .isDraft == true
            and .number == $pr_number
            and .headRefName == $head
            and .baseRefName == $base
            and .headRefOid == $sha
          ' <<<"${state}" >/dev/null
          echo "pr_url=${pr_url}" >> "$GITHUB_OUTPUT"
          echo "pr_number=${pr_number}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Close governance from explicit solo-owner acknowledgement
        env:
          GOVERNANCE_ACTOR: ${{ github.actor }}
        run: |
          set -euo pipefail
          mkdir -p governance-evidence
          for name in \
            publication-result.json validation-result.json task-run.json \
            adoption-authority.json adoption-plan.json profile-validation.json \
            adoption-profile.json quick-summary.json pr.json; do
            cp "$(find incoming/adoption -type f -name "${name}" -print -quit)" \
              "governance-evidence/${name}"
          done
          "${pythonLocation}/bin/python" -B control/scripts/github_repair_governance.py \
            --publication-receipt governance-evidence/publication-result.json \
            --task-run governance-evidence/task-run.json \
            --actor "${GOVERNANCE_ACTOR}" \
            --approval-ref "github-actions:${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}:solo-owner-existing-candidate-adoption" \
            --output governance-evidence/governance-receipt.json
          jq -e '.status == "GOVERNANCE_CLOSED" and .governance_closed == true and .baseline_accepted == false' \
            governance-evidence/governance-receipt.json >/dev/null
          jq -n \
            --arg actor "${GOVERNANCE_ACTOR}" \
            --arg run "${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}" \
            '{
              schema:"governed-repair-solo-governance-attestation@1",
              governance_mode:"solo_owner",
              candidate_origin:"existing_pr_adoption",
              governance_actor:$actor,
              acknowledgement_run:$run,
              independent_human_review:false,
              machine_gates_remain_mandatory:true,
              pr_remains_draft:true,
              merge_allowed:false,
              deploy_allowed:false,
              production_closed:false
            }' > governance-evidence/solo-governance-attestation.json

      - name: Checkout exact adopted source for baseline acceptance
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.pr.outputs.source_sha }}
          path: candidate
          fetch-depth: 0
          persist-credentials: true

      - name: Accept protected baseline from governance receipt only
        id: baseline
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B control/scripts/github_repair_baseline_acceptance.py \
            --workspace candidate \
            --governance-receipt governance-evidence/governance-receipt.json \
            --task-run governance-evidence/task-run.json \
            --output governance-evidence/baseline-acceptance.json
          baseline_sha=$(jq -r '.baseline_commit_sha' governance-evidence/baseline-acceptance.json)
          [[ "${baseline_sha}" =~ ^[0-9a-f]{40}$ ]]
          actual=$(git -C candidate rev-parse HEAD)
          [[ "${actual}" == "${baseline_sha}" ]]
          branch="${{ steps.pr.outputs.branch }}"
          git -C candidate push origin "HEAD:refs/heads/${branch}"
          echo "baseline_sha=${baseline_sha}" >> "$GITHUB_OUTPUT"

      - name: Prove local baseline binding after acceptance
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B control/scripts/verify_product_source_baseline.py \
            --workspace candidate \
            --require-parent-binding \
            --output governance-evidence/post-baseline-verification.json
          jq -e '.status == "PASS" and (.drift_paths | length == 0)' \
            governance-evidence/post-baseline-verification.json >/dev/null
          git -C candidate status --porcelain=v1 --untracked-files=all | tee governance-evidence/post-baseline-status.txt
          test ! -s governance-evidence/post-baseline-status.txt

      - name: Observe mandatory exact-head pull-request workflows
        id: exact-ci
        env:
          GH_TOKEN: ${{ github.token }}
          EXACT_SHA: ${{ steps.baseline.outputs.baseline_sha }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          PR_NUMBER: ${{ steps.pr.outputs.pr_number }}
        run: |
          set -euo pipefail
          [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]]
          deadline=$((SECONDS + 5400))
          while (( SECONDS < deadline )); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${EXACT_SHA}&per_page=100" > governance-evidence/exact-head-runs.json
            quality=$(jq -c '
              [.workflow_runs[]
                | select(.name == "quality")
                | select(.head_sha == $sha)
                | select(.event == "pull_request")
                | select(any(.pull_requests[]?; ((.number | tostring) == $pr_number)))]
              | sort_by(.created_at) | reverse | .[0] // empty
            ' --arg sha "${EXACT_SHA}" --arg pr_number "${PR_NUMBER}" governance-evidence/exact-head-runs.json)
            skill=$(jq -c '
              [.workflow_runs[]
                | select(.name == "skill-self-validation")
                | select(.head_sha == $sha)
                | select(.event == "pull_request")
                | select(any(.pull_requests[]?; ((.number | tostring) == $pr_number)))]
              | sort_by(.created_at) | reverse | .[0] // empty
            ' --arg sha "${EXACT_SHA}" --arg pr_number "${PR_NUMBER}" governance-evidence/exact-head-runs.json)
            if [[ -n "${quality}" && -n "${skill}" ]]; then
              pr_state=$(gh pr view "${PR_URL}" --json number,isDraft,headRefOid,url)
              jq -n \
                --arg sha "${EXACT_SHA}" \
                --arg pr "${PR_URL}" \
                --arg pr_number "${PR_NUMBER}" \
                --argjson pr_state "${pr_state}" \
                --argjson quality "${quality}" \
                --argjson skill "${skill}" \
                '{
                  schema:"governed-repair-exact-head-ci@1",
                  head_sha:$sha,
                  pr_url:$pr,
                  pr_number:($pr_number|tonumber),
                  pr_is_draft:$pr_state.isDraft,
                  pr_head_sha:$pr_state.headRefOid,
                  workflows:{
                    quality:{
                      run_id:($quality.id|tostring),
                      status:$quality.status,
                      conclusion:($quality.conclusion // ""),
                      head_sha:$quality.head_sha,
                      event:$quality.event,
                      pr_number:($pr_number|tonumber),
                      url:$quality.html_url
                    },
                    "skill-self-validation":{
                      run_id:($skill.id|tostring),
                      status:$skill.status,
                      conclusion:($skill.conclusion // ""),
                      head_sha:$skill.head_sha,
                      event:$skill.event,
                      pr_number:($pr_number|tonumber),
                      url:$skill.html_url
                    }
                  }
                }' > governance-evidence/exact-head-ci.json
              "${pythonLocation}/bin/python" -B control/scripts/github_repair_exact_head_state.py \
                --ci-evidence governance-evidence/exact-head-ci.json \
                --exact-sha "${EXACT_SHA}" \
                --draft-pr-url "${PR_URL}" \
                --output governance-evidence/exact-head-ci-state.json
              state=$(jq -r '.status' governance-evidence/exact-head-ci-state.json)
              echo "state=${state}" >> "$GITHUB_OUTPUT"
              case "${state}" in
                EXACT_HEAD_CI_PASSED)
                  exit 0
                  ;;
                EXACT_HEAD_CI_AWAITING_APPROVAL)
                  echo "Exact-head CI is awaiting repository-owner workflow approval; baseline acceptance remains valid and G6 is resumable."
                  exit 0
                  ;;
                EXACT_HEAD_CI_FAILED)
                  jq -r '.failed_workflows[]?' governance-evidence/exact-head-ci-state.json >&2
                  exit 1
                  ;;
              esac
            fi
            sleep 30
          done
          echo "timed out waiting for exact-head pull-request CI" >&2
          exit 1

      - name: Finalize G6 but keep adopted Solo Owner PR Draft
        if: steps.exact-ci.outputs.state == 'EXACT_HEAD_CI_PASSED'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B control/scripts/github_repair_exact_head.py \
            --baseline-receipt governance-evidence/baseline-acceptance.json \
            --ci-evidence governance-evidence/exact-head-ci.json \
            --task-run governance-evidence/task-run.json \
            --output governance-evidence/exact-head-result.json
          jq -e '
            .status == "READY_FOR_REVIEW"
            and .ready_for_review == true
            and .gates.G6_GOVERNANCE_EXACT_HEAD.status == "PASS"
            and .merge_allowed == false
            and .deploy_allowed == false
            and .production_closed == false
          ' governance-evidence/exact-head-result.json >/dev/null
          pr_state=$(gh pr view "${PR_URL}" --json isDraft,state,headRefOid,url)
          jq -e --arg sha "${{ steps.baseline.outputs.baseline_sha }}" '
            .state == "OPEN" and .isDraft == true and .headRefOid == $sha
          ' <<<"${pr_state}" >/dev/null

      - name: Record resumable exact-head approval wait
        if: steps.exact-ci.outputs.state == 'EXACT_HEAD_CI_AWAITING_APPROVAL'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ steps.pr.outputs.pr_url }}
          EXACT_SHA: ${{ steps.baseline.outputs.baseline_sha }}
        run: |
          set -euo pipefail
          gh pr comment "${PR_URL}" --body "G6 baseline acceptance is complete on exact head \`${EXACT_SHA}\`, but mandatory exact-head pull-request CI is awaiting repository-owner workflow approval. This is a resumable external-approval wait, not a product failure. Do not rerun governance or baseline acceptance. After approval, use the exact-head resume workflow against this G6 run. merge_allowed=false, deploy_allowed=false, production_closed=false."

      - name: Upload solo adoption governance evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-existing-candidate-solo-governance-${{ inputs.adoption_run_id }}
          path: governance-evidence
          retention-days: 30
          if-no-files-found: warn
