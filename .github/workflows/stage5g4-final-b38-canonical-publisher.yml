name: stage5g4-final-b38-canonical-publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  actions: read

jobs:
  publish-canonical-b38:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'stage5g4-final-b38-canonical-publisher'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout runner head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: runner
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact B36 source with publisher credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e0e04d51e9da9790bef7bd0482584f60b8e975a9
          path: source
          fetch-depth: 1
          persist-credentials: true

      - name: Download immutable accepted B38 install artifact
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/9016338327/zip" \
            -o b38-install-artifact.zip
          echo 'ad12a58481c1705f6f79a7bafc765a6a307e29f6b91fd05b1dcd1b0f315039f8  b38-install-artifact.zip' | sha256sum -c -
          mkdir install-artifact
          unzip -q b38-install-artifact.zip -d install-artifact
          test -d install-artifact/root

      - name: Publish exact staged 30-file canonical B38 branch
        shell: bash
        run: |
          set -euo pipefail
          python3 -B runner/docs/governance/ci-probes/stage5g4-final-b38-canonical/publish.py \
            --source source \
            --artifact-root install-artifact/root \
            --manifest runner/docs/governance/ci-probes/stage5g4-final-b38-canonical/candidate30.json

      - name: Upload canonical publication evidence
        uses: actions/upload-artifact@v4
        with:
          name: stage5g4-final-b38-canonical-publication
          path: |
            canonical-publication-precommit.json
            canonical-publication-report.json
            canonical-b38-head.txt
          if-no-files-found: error
          retention-days: 90
