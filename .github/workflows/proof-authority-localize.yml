name: Proof authority localize

on:
  push:
    branches:
      - fix/proof-authority-lifecycle-20260816

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Move proof maturity into request-local verifier state
        shell: bash
        run: |
          set -euo pipefail
          workflow='.github/workflows/proof-authority-localize.yml'
          planning='services/agent-service/src/agent_core/lifecycle/goal_planning.py'
          baseline='skill-system/registry/product-source-baseline.json'

          python -B - <<'PY'
          from pathlib import Path

          path = Path('services/agent-service/src/agent_core/lifecycle/goal_planning.py')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, got {count}')
              text = text.replace(old, new, 1)

          replace_once(
              'from agent_core.lifecycle.goal_blockers import active_goal_blockers\n'
              'from agent_core.lifecycle.semantic_contract import (\n',
              'from agent_core.lifecycle.goal_blockers import active_goal_blockers\n'
              'from agent_core.lifecycle.goal_dependency_proof import (\n'
              '    DependencyGraphProof,\n'
              '    candidate_dependency_metadata,\n'
              '    dependency_observation_from_details,\n'
              '    dependency_premise_digest,\n'
              '    dependency_proof_metadata,\n'
              '    reduce_dependency_graph_proof,\n'
              ')\n'
              'from agent_core.lifecycle.semantic_contract import (\n',
              'proof imports',
          )

          replace_once(
              '        requested_effect_reaudit_guard: dict[str, Any] | None = None\n'
              '        preserved_blind_dependency_details: dict[str, Any] | None = None\n'
              '        for attempt in range(3):\n',
              '        requested_effect_reaudit_guard: dict[str, Any] | None = None\n'
              '        preserved_blind_dependency_details: dict[str, Any] | None = None\n'
              '        # Proof maturity is request-local. The private dependency parsers remain\n'
              '        # pure functions; no ContextVar/module monkeypatch may leak authority\n'
              '        # across verifier invocations or direct parser tests.\n'
              '        dependency_proof_premise = dependency_premise_digest(\n'
              '            user_text=user_text,\n'
              '            goals=goals,\n'
              '        )\n'
              '        dependency_proof: DependencyGraphProof | None = None\n'
              '        accepted_dependency_details: dict[str, Any] | None = None\n'
              '        accepted_dependency_error: str | None = None\n'
              '        for attempt in range(3):\n',
              'local proof state',
          )

          old_parser = '''                    elif blind_dependency_audit:\n                        dependency_details, dependency_error = _model_alignment_pairwise_dependency_proof(\n                            user_text=user_text,\n                            goals=goals,\n                            values=parsed.get("dependency_decisions"),\n                        )\n                    else:\n                        dependency_details, dependency_error = _model_alignment_dependency_proof(\n                            user_text=user_text,\n                            goals=goals,\n                            values=parsed.get("dependency_edges"),\n                        )\n'''
          new_parser = '''                    elif blind_dependency_audit:\n                        fresh_dependency_details, fresh_dependency_error = _model_alignment_pairwise_dependency_proof(\n                            user_text=user_text,\n                            goals=goals,\n                            values=parsed.get("dependency_decisions"),\n                        )\n                        previous_dependency_proof = dependency_proof\n                        dependency_observation = dependency_observation_from_details(\n                            premise_digest=dependency_proof_premise,\n                            details=fresh_dependency_details,\n                            source=verifier_repair_kind or "candidate_blind_dependency_reaudit",\n                        )\n                        next_dependency_proof = reduce_dependency_graph_proof(\n                            previous_dependency_proof,\n                            dependency_observation,\n                        )\n                        preserve_previous_details = bool(\n                            accepted_dependency_details is not None\n                            and previous_dependency_proof is not None\n                            and previous_dependency_proof.preservable\n                            and (\n                                previous_dependency_proof.authoritative\n                                or next_dependency_proof.reason_code\n                                == "inadmissible_observation_preserved_previous_proof"\n                            )\n                        )\n                        dependency_proof = next_dependency_proof\n                        if preserve_previous_details:\n                            # Authority is not a model vote. Once closed, another\n                            # same-premise call cannot replace graph/basis/error details.\n                            dependency_details = dependency_proof_metadata(\n                                deepcopy(accepted_dependency_details),\n                                next_dependency_proof,\n                            )\n                            dependency_error = accepted_dependency_error\n                        else:\n                            dependency_details = dependency_proof_metadata(\n                                fresh_dependency_details,\n                                next_dependency_proof,\n                            )\n                            dependency_error = fresh_dependency_error\n                            if next_dependency_proof.preservable:\n                                accepted_dependency_details = deepcopy(fresh_dependency_details)\n                                accepted_dependency_error = fresh_dependency_error\n                    else:\n                        dependency_details, dependency_error = _model_alignment_dependency_proof(\n                            user_text=user_text,\n                            goals=goals,\n                            values=parsed.get("dependency_edges"),\n                        )\n                        dependency_details = candidate_dependency_metadata(\n                            dependency_details,\n                            premise_digest=dependency_proof_premise,\n                            multi_goal=len(goals) > 1,\n                        )\n'''
          replace_once(old_parser, new_parser, 'dependency parser orchestration')

          seam = '''\n\n# Dependency proof authority installation seam.\n# The verifier above remains the observation producer; this deterministic\n# lifecycle reducer alone owns proof maturity. Installing after every symbol is\n# defined preserves the canonical source path and all historical source guards.\nimport sys as _dependency_proof_sys\nfrom agent_core.lifecycle.goal_dependency_proof import (\n    install_goal_dependency_proof_authority as _install_goal_dependency_proof_authority,\n)\n\n_install_goal_dependency_proof_authority(_dependency_proof_sys.modules[__name__])\ndel _dependency_proof_sys, _install_goal_dependency_proof_authority\n'''
          replace_once(seam, '\n', 'legacy global install seam')

          path.write_text(text.rstrip() + '\n', encoding='utf-8')
          PY

          python -B -m py_compile "$planning" services/agent-service/src/agent_core/lifecycle/goal_dependency_proof.py services/agent-service/tests/runtime/test_dependency_proof_authority.py

          git rm "$workflow"

          python -B - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.').resolve()
          baseline_path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(baseline_path.read_text(encoding='utf-8'))
          protected_roots = tuple(str(item) for item in payload['protected_roots'])
          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', *protected_roots], cwd=root)
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          current = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          payload['generated_from'] = 'git:' + os.environ['GITHUB_SHA']
          payload['generated_at'] = (
              datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          )
          payload['file_count'] = len(current)
          payload['files'] = dict(sorted(current.items()))
          baseline_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          git add "$planning" "$baseline"
          git diff --cached --check
          git config user.name 'customer-agent-proof-authority[bot]'
          git config user.email 'customer-agent-proof-authority[bot]@users.noreply.github.com'
          git commit -m 'refactor: localize semantic proof authority [proof-authority-local]'
          git push origin HEAD:${GITHUB_REF_NAME}
