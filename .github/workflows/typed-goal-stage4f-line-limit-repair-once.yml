name: typed-goal-stage4f-line-limit-repair-once

on:
  push:
    branches:
      - feat/typed-goal-graph-foundation-20260814

permissions:
  contents: write
  actions: write

jobs:
  repair-stage4f:
    runs-on: ubuntu-24.04
    if: github.repository == 'toctionyan/fristTest'
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: feat/typed-goal-graph-foundation-20260814

      - name: Verify exact Stage4F failed-CI parent
        env:
          BASE_SHA: eafb74923d6db9d0b513c28afca30ef862bbce04
          WORKFLOW_PATH: .github/workflows/typed-goal-stage4f-line-limit-repair-once.yml
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          python - <<'PY'
          import os, subprocess
          base = os.environ['BASE_SHA']
          expected = {os.environ['WORKFLOW_PATH']}
          changed = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}..HEAD'], text=True
          ).splitlines()))
          if changed != expected:
              raise SystemExit('unexpected_repair_entry_surface:' + ','.join(sorted(changed)))
          print({'status': 'PASS', 'changed': sorted(changed)})
          PY

      - name: Compact Stage4F node wrapper without semantic change
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('services/agent-service/src/agent_core/lifecycle/nodes.py')
          text = path.read_text(encoding='utf-8')

          old_import = '''from agent_core.lifecycle.pretool_execution_policy import (\n    TRUSTED_DEPENDENCY_AUTHORITY_CONTROL_RESOLVER_KEY,\n)\n'''
          new_import = 'from agent_core.lifecycle.pretool_execution_policy import TRUSTED_DEPENDENCY_AUTHORITY_CONTROL_RESOLVER_KEY\n'
          if text.count(old_import) != 1:
              raise SystemExit('stage4f_import_shape_changed')
          text = text.replace(old_import, new_import, 1)

          old_doc = '''    \"\"\"Thin node wrapper retaining explicit model and authority-control seams.\n\n    Checkpoint/user/model state is never trusted as dependency-activation\n    authority. The private key is stripped on every call and can only be\n    reintroduced as an in-process callable supplied by LifecycleRuntimeDeps.\n    \"\"\"\n'''
          new_doc = '    \"\"\"Strip state injection; admit only the application RuntimeDeps resolver.\"\"\"\n'
          if text.count(old_doc) != 1:
              raise SystemExit('stage4f_doc_shape_changed')
          text = text.replace(old_doc, new_doc, 1)

          old_assign = '''        runtime_state[TRUSTED_DEPENDENCY_AUTHORITY_CONTROL_RESOLVER_KEY] = (\n            dependency_authority_control_resolver\n        )\n'''
          new_assign = '        runtime_state[TRUSTED_DEPENDENCY_AUTHORITY_CONTROL_RESOLVER_KEY] = dependency_authority_control_resolver\n'
          if text.count(old_assign) != 1:
              raise SystemExit('stage4f_assignment_shape_changed')
          text = text.replace(old_assign, new_assign, 1)

          path.write_text(text, encoding='utf-8')
          lines = len(text.splitlines())
          if lines > 400:
              raise SystemExit(f'nodes_line_limit_not_repaired:{lines}')
          print({'status': 'PASS', 'nodes_lines': lines})
          PY

          python -m compileall -q services/agent-service/src/agent_core/lifecycle/nodes.py
          git diff --check
          test "$(git diff --name-only)" = "services/agent-service/src/agent_core/lifecycle/nodes.py"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Bootstrap locked uv
        run: |
          "${pythonLocation}/bin/python" -m pip install \
            --disable-pip-version-check \
            --require-hashes \
            --only-binary=:all: \
            -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups

      - name: Verify repaired architecture and Stage4F ingress behavior
        run: |
          services/agent-service/.venv/bin/python -B -m unittest \
            skill-system.tests.test_architecture_cycle_debt.ArchitectureCycleDebtTests.test_current_workspace_reports_resolved_architecture_debt
          cd services/agent-service
          PYTHONPATH=src:. .venv/bin/python -B -m pytest -q \
            tests/runtime/test_typed_goal_dependency_activation_ingress.py \
            tests/runtime/test_typed_goal_dependency_runtime_authority.py \
            tests/runtime/test_pretool_execution_policy.py

      - name: Freeze repaired protected source SHA
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agent-service/src/agent_core/lifecycle/nodes.py
          git diff --cached --check
          git commit -m "Compact Stage4F authority ingress node facade"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh protected baseline for repaired source
        env:
          BASE_SHA: eafb74923d6db9d0b513c28afca30ef862bbce04
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          baseline_path = root / 'skill-system/registry/product-source-baseline.json'
          source_sha = os.environ['SOURCE_SHA'].strip()
          base_sha = os.environ['BASE_SHA'].strip()
          if len(source_sha) != 40:
              raise SystemExit('source_sha_identity_missing')
          subprocess.run(['git', 'merge-base', '--is-ancestor', base_sha, source_sha], check=True)
          if subprocess.run(
              ['git', 'diff', '--quiet', f'{source_sha}..HEAD', '--', 'services', 'web', 'contracts'],
              check=False,
          ).returncode != 0:
              raise SystemExit('protected_sources_changed_after_repair_source_sha')

          expected_changed = {'services/agent-service/src/agent_core/lifecycle/nodes.py'}
          actual = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base_sha}..{source_sha}', '--', 'services', 'web', 'contracts'],
              text=True,
          ).splitlines()))
          if actual != expected_changed:
              raise SystemExit('unexpected_repair_protected_surface:' + ','.join(sorted(actual)))

          payload = json.loads(baseline_path.read_text(encoding='utf-8'))
          previous = {str(k): str(v) for k, v in (payload.get('files') or {}).items()}
          if int(payload.get('file_count') or 0) != 594 or len(previous) != 594:
              raise SystemExit(f"unexpected_previous_baseline:{payload.get('file_count')}/{len(previous)}")
          protected_roots = tuple(str(v) for v in payload.get('protected_roots') or ())
          if protected_roots != ('services', 'web', 'contracts'):
              raise SystemExit(f'unexpected_protected_roots:{protected_roots!r}')

          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', *protected_roots])
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          current = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          if len(current) != 594:
              raise SystemExit(f'unexpected_protected_file_count:{len(current)}')
          changed = {p for p in set(current) & set(previous) if current[p] != previous[p]}
          added = set(current) - set(previous)
          removed = set(previous) - set(current)
          if changed != expected_changed:
              raise SystemExit('unexpected_changed_existing:' + ','.join(sorted(changed)))
          if added or removed:
              raise SystemExit('unexpected_path_delta:' + ','.join(sorted(added | removed)))

          payload['file_count'] = len(current)
          payload['files'] = dict(sorted(current.items()))
          payload['generated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          payload['generated_from'] = 'git:' + source_sha
          baseline_path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps({
              'status': 'PASS',
              'generated_from': payload['generated_from'],
              'changed': sorted(changed),
              'file_count': len(current),
          }, ensure_ascii=False, indent=2))
          PY

      - name: Verify baseline and full Skill control plane before push
        run: |
          python skill-system/tests/test_product_source_baseline_binding.py
          services/agent-service/.venv/bin/python -B skill-system/controller/profile_runner.py skill-control-plane
          cd services/agent-service
          PYTHONPATH=src:. .venv/bin/python -B -m pytest -q \
            tests/runtime/test_typed_goal_dependency_activation_ingress.py \
            tests/runtime/test_typed_goal_dependency_runtime_authority.py \
            tests/runtime/test_typed_goal_dependency_activation_preflight.py \
            tests/runtime/test_typed_goal_dependency_handoff_simulation.py \
            tests/runtime/test_typed_goal_dependency_cutover_gate.py \
            tests/runtime/test_typed_goal_dependency_authority_shadow.py \
            tests/runtime/test_pretool_execution_policy.py

      - name: Commit baseline, remove repair workflow, and push
        run: |
          set -euo pipefail
          git rm .github/workflows/typed-goal-stage4f-line-limit-repair-once.yml
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m "Refresh repaired Stage4F protected baseline"
          git push origin HEAD:feat/typed-goal-graph-foundation-20260814
          echo "FINAL_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Dispatch final exact-SHA verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in quality.yml skill-self-validation.yml; do
            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d '{"ref":"feat/typed-goal-graph-foundation-20260814"}'
          done
          echo "Stage4F repaired final SHA: ${FINAL_SHA}"
