name: wp08-release-reconcile-final-attempt8-once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-release-reconcile-final-attempt8-once-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 432bf145d5a636613ab2e27760cf3343519a993e
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact authoritative main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Reconcile completed final attempt through official controller
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python -B scripts/wp08_release_recovery.py --mode reconcile
