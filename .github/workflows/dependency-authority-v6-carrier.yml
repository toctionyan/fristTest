name: dependency-authority-v6-carrier

on:
  push:
    branches:
      - fix/proof-authority-lifecycle-20260816

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/proof-authority-lifecycle-20260816
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked agent environment
        run: cd services/agent-service && uv sync --locked --all-groups

      - name: Make first-pass mismatch routing polarity-neutral
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          goal_planning = ROOT / "services/agent-service/src/agent_core/lifecycle/goal_planning.py"
          replace_once(
              goal_planning,
              '''            dependency_mismatch_introduces_new_edge = False\n            if (\n                attempt == 0\n                and verdict.verdict == "incomplete"\n                and verdict.reason_code == "goal_alignment_dependency_graph_mismatch"\n            ):\n                details = verdict.details if isinstance(verdict.details, dict) else {}\n                declared_pairs = {\n                    (str(row.get("dependent_goal_id") or ""), str(row.get("requires_result_of_goal_id") or ""))\n                    for row in list(details.get("declared_dependency_edges") or [])\n                    if isinstance(row, dict)\n                }\n                verified_pairs = {\n                    (str(row.get("dependent_goal_id") or ""), str(row.get("requires_result_of_goal_id") or ""))\n                    for row in list(details.get("dependency_edges") or [])\n                    if isinstance(row, dict)\n                }\n                dependency_mismatch_introduces_new_edge = bool(verified_pairs - declared_pairs)\n            if (\n                attempt == 0\n                and (\n                    verdict.exact\n                    or (len(goals) > 1 and dependency_mismatch_introduces_new_edge)\n                )\n            ):\n''',
              '''            dependency_mismatch_requires_blind_audit = False\n            if (\n                attempt == 0\n                and len(goals) > 1\n                and verdict.verdict == "incomplete"\n                and verdict.reason_code == "goal_alignment_dependency_graph_mismatch"\n                and not verdict.missing_spans\n            ):\n                details = verdict.details if isinstance(verdict.details, dict) else {}\n                dependency_mismatch_requires_blind_audit = bool(\n                    details.get("dependency_authority") == "independent_goal_alignment"\n                    and details.get("dependency_proof_complete") is True\n                    and details.get("dependency_graph_match") is False\n                    and details.get("dependency_mismatch_grounding") == "machine_dependency_proof"\n                )\n            if (\n                attempt == 0\n                and (\n                    verdict.exact\n                    or dependency_mismatch_requires_blind_audit\n                )\n            ):\n''',
              "polarity neutral first-pass dependency mismatch routing",
          )
          text = goal_planning.read_text(encoding="utf-8")
          text = text.replace(
              "# disagreement that introduces a new edge, receives one independent",
              "# disagreement in either polarity, receives one independent",
          )
          text = text.replace(
              "# The second candidate-blind call already closed graph authority.\n                        # A third call exists only to arbitrate one semantic-field claim;",
              "# The prior candidate-blind call produced a complete preservable graph observation.\n                        # This call exists only to arbitrate one semantic-field claim;",
          )
          goal_planning.write_text(text, encoding="utf-8")

          attempt5 = ROOT / "services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py"
          old = '''def test_false_declared_dependency_is_rejected_by_independent_alignment_graph() -> None:\n    text = "查一下鼠标订单，然后帮我申请退款"\n    goals = [_goal("g1", "查一下鼠标订单", []), _goal("g2", "帮我申请退款", ["g1"])]\n    with patch("agent_core.config.get_model", return_value=object()), patch(\n        "agent_core.model_calls.invoke_model",\n        return_value=_response({\n            "verdict": "incomplete",\n            "evidence_spans": ["查一下鼠标订单", "帮我申请退款"],\n            "missing_spans": [],\n            "dependency_edges": [],\n            "reason_code": "declared_dependency_not_expressed",\n        }),\n    ):\n        verdict = ModelGoalAlignmentVerifier().verify(user_text=text, goals=goals, known_tools=set())\n    assert verdict.verdict == "incomplete"\n    assert verdict.reason_code == "goal_alignment_dependency_graph_mismatch"\n    assert verdict.details["dependency_graph_match"] is False\n'''
          new = '''def test_false_declared_dependency_is_rejected_by_independent_alignment_graph() -> None:\n    text = "查一下鼠标订单，然后帮我申请退款"\n    goals = [_goal("g1", "查一下鼠标订单", []), _goal("g2", "帮我申请退款", ["g1"])]\n    candidate = _response({\n        "verdict": "incomplete",\n        "evidence_spans": ["查一下鼠标订单", "帮我申请退款"],\n        "missing_spans": [],\n        "dependency_edges": [],\n        "reason_code": "declared_dependency_not_expressed",\n    })\n    independent = _response({\n        "verdict": "exact",\n        "evidence_spans": ["查一下鼠标订单", "帮我申请退款"],\n        "missing_spans": [],\n        "dependency_decisions": [{\n            "goal_a_id": "g1",\n            "goal_b_id": "g2",\n            "relation": "independent",\n        }],\n        "reason_code": "candidate_blind_independent",\n    })\n    with patch("agent_core.config.get_model", return_value=object()), patch(\n        "agent_core.model_calls.invoke_model", side_effect=[candidate, independent, independent]\n    ) as invoke:\n        verdict = ModelGoalAlignmentVerifier().verify(user_text=text, goals=goals, known_tools=set())\n    assert invoke.call_count == 3\n    assert verdict.verdict == "incomplete"\n    assert verdict.reason_code == "goal_alignment_dependency_graph_mismatch"\n    assert verdict.details["dependency_graph_match"] is False\n    assert verdict.details["dependency_edges"] == []\n    assert verdict.details["dependency_authority_state"] == "authoritative"\n    assert verdict.details["dependency_challenge_required"] is False\n    assert verdict.details["verifier_repair_kind"] == "candidate_blind_dependency_authority_closure"\n'''
          replace_once(attempt5, old, new, "false declared dependency polarity regression")

          # Refresh protected source baseline.
          baseline_path = ROOT / "skill-system/registry/product-source-baseline.json"
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          files = dict(baseline.get("files") or {})
          for rel in list(files):
              candidate_path = ROOT / rel
              if candidate_path.is_file():
                  files[rel] = sha256(candidate_path.read_bytes()).hexdigest()
          baseline["files"] = dict(sorted(files.items()))
          baseline["file_count"] = len(files)
          baseline_path.write_text(
              json.dumps(baseline, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          carrier = ROOT / ".github/workflows/dependency-authority-v6-carrier.yml"
          carrier.unlink()
          PY

      - name: Compile changed Python
        run: |
          python -m py_compile \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py

      - name: Commit polarity-neutral routing
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(semantic): audit dependency mismatches in both polarities"
          git push origin HEAD:fix/proof-authority-lifecycle-20260816

      - name: Run dependency authority focus set
        shell: bash
        run: |
          cd services/agent-service
          export PYTHONPATH="$PWD/src"
          .venv/bin/python -B -m pytest -q -p no:cacheprovider \
            tests/runtime/test_dependency_proof_authority.py \
            tests/runtime/test_release47_dependency_repair_projection.py \
            tests/runtime/test_release52_dependency_independence_adjudication.py \
            tests/runtime/test_release53_blind_semantic_grounding_adjudication.py \
            tests/runtime/test_wp08_attempt5_dependency_authority.py \
            tests/runtime/test_wp08_attempt6_alignment_normalization.py \
            tests/runtime/test_wp08_attempt7_final_authority_and_retry.py \
            ../../skill-system/tests/test_semantic_dependency_repair_feedback.py \
            ../../skill-system/tests/test_wp08_final_product_closure_repair.py
