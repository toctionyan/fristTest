name: temporary-agent-pytest-hang-diagnostic-v2

on:
  push:
    branches:
      - architecture/v20.18-contract-owner-repair-rule-oracle-20260812

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: architecture/v20.18-contract-owner-repair-rule-oracle-20260812
          fetch-depth: 0
      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Run exact standard suite under stack watchdog
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" - <<'PY'
          from __future__ import annotations
          import os, subprocess, textwrap
          from pathlib import Path
          import scripts.run_python_test_suites as runner

          root = Path.cwd()
          agent = root / "services/agent-service"
          py = agent / ".venv/bin/python"
          runtime = Path(os.environ["RUNNER_TEMP"]) / "agent-pytest-hang-v2"
          runtime.mkdir(parents=True, exist_ok=True)
          helper = runtime / "diagnose_pytest_hang.py"
          helper.write_text(textwrap.dedent(r'''
              from __future__ import annotations
              import faulthandler, sys, threading, time
              from pathlib import Path
              import pytest

              runtime = Path(__file__).resolve().parent
              faulthandler.enable(file=sys.stderr, all_threads=True)
              faulthandler.dump_traceback_later(120, repeat=True, file=sys.stderr)
              stop = threading.Event()
              def watchdog():
                  started = time.monotonic()
                  while not stop.wait(30):
                      elapsed = time.monotonic() - started
                      print("WATCHDOG elapsed=%.1fs threads=%s" % (
                          elapsed,
                          ",".join(f"{t.name}:{t.ident}:daemon={t.daemon}" for t in threading.enumerate()),
                      ), file=sys.stderr, flush=True)
                      if elapsed >= 90:
                          print("WATCHDOG_STACK_DUMP_BEGIN", file=sys.stderr, flush=True)
                          faulthandler.dump_traceback(file=sys.stderr, all_threads=True)
                          print("WATCHDOG_STACK_DUMP_END", file=sys.stderr, flush=True)
              threading.Thread(target=watchdog, name="diagnostic-watchdog", daemon=True).start()
              args = [
                  "-q", "-ra", "-p", "no:cacheprovider",
                  "-m", "not integration and not preprod",
                  f"--junitxml={runtime / 'agent-service-standard.xml'}",
                  "--cov=agent_core", "--cov=app",
                  f"--cov-report=xml:{runtime / 'agent-service-standard-coverage.xml'}",
              ]
              print("PYTEST_MAIN_BEGIN", flush=True)
              rc = pytest.main(args)
              print(f"PYTEST_MAIN_RETURN rc={rc}", flush=True)
              stop.set()
              faulthandler.cancel_dump_traceback_later()
              print("PYTEST_REMAINING_THREADS=" + ",".join(
                  f"{t.name}:{t.ident}:daemon={t.daemon}" for t in threading.enumerate()
              ), flush=True)
              raise SystemExit(int(rc))
          '''), encoding="utf-8")

          env = os.environ.copy()
          for key in tuple(env):
              if key.startswith(runner.STANDARD_CONFIG_PREFIXES):
                  env.pop(key, None)
          env.update(runner.STANDARD_ENV)
          env["PYTHONDONTWRITEBYTECODE"] = "1"
          env["PYTHONPATH"] = "src:." + (f":{env['PYTHONPATH']}" if env.get("PYTHONPATH") else "")
          env["COVERAGE_CORE"] = "sysmon"
          env["COVERAGE_FILE"] = str(runtime / ".coverage")
          env.update({
              "SQLITE_DB_PATH": str(runtime / "agent.sqlite3"),
              "AGENT_DATABASE_URL": f"sqlite:///{runtime / 'agent.sqlite3'}",
              "DATABASE_URL": f"sqlite:///{runtime / 'agent.sqlite3'}",
              "CHECKPOINT_DB_PATH": str(runtime / "checkpoints.sqlite3"),
              "VECTOR_DB_PATH": str(runtime / "vector.sqlite3"),
              "UPLOAD_DIR": str(runtime / "uploads"),
              "BUSINESS_DB_PATH": str(runtime / "business.sqlite3"),
          })
          try:
              completed = subprocess.run([str(py), "-B", str(helper)], cwd=agent, env=env, timeout=330)
              raise SystemExit(completed.returncode)
          except subprocess.TimeoutExpired:
              print("PARENT_TIMEOUT_AFTER_330S", flush=True)
              raise SystemExit(124)
          PY
      - name: Remove temporary diagnostic workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm -- .github/workflows/tmp-agent-pytest-hang-diagnostic-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Remove temporary pytest hang diagnostic v2"
          git push origin HEAD:architecture/v20.18-contract-owner-repair-rule-oracle-20260812
