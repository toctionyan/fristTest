name: stage3-authority-repair-roundtrip-carrier

on:
  push:
    branches:
      - fix/proof-authority-lifecycle-20260816

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/proof-authority-lifecycle-20260816
          fetch-depth: 0

      - name: Apply authority repair-contract roundtrip
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          goal_planning = ROOT / "services/agent-service/src/agent_core/lifecycle/goal_planning.py"
          marker = '\n\ndef _granularity_repair_feedback(granularity: Any) -> dict[str, Any]:\n'
          helper = r'''


def _alignment_authoritative_dependency_repair_contract(
    alignment: GoalAlignmentVerdict,
) -> dict[str, Any]:
    """Seal only a mature dependency graph delta for Planner redeclaration.

    Before the deterministic proof reducer existed, provider-facing repair had
    to hide verifier replacement edges because a verifier opinion was not write
    authority.  Once the reducer has sealed an AUTHORITATIVE mismatch, forcing
    Planner to infer the same edge again recreates the #43/#47/Attempt-8 loop:
    proof is correct, transport loses it, and redeclaration guesses.

    This contract carries only Goal dependency relations already adjudicated by
    the reducer.  It never carries requested effects, targets, tool identities,
    capability availability or business facts, and Runtime still does not edit
    ``depends_on`` itself.
    """
    details = alignment.details if isinstance(alignment.details, dict) else {}
    if not (
        alignment.verdict == "incomplete"
        and alignment.reason_code == "goal_alignment_dependency_graph_mismatch"
        and alignment.independent
        and details.get("dependency_authority") == "independent_goal_alignment"
        and details.get("dependency_proof_complete") is True
        and details.get("dependency_graph_match") is False
        and details.get("dependency_authority_state") == "authoritative"
    ):
        return {}

    premise_digest = _clean_text(details.get("dependency_authority_premise_digest"), limit=160)
    authority_evidence_digest = _clean_text(details.get("dependency_authority_evidence_digest"), limit=160)
    if not premise_digest or not authority_evidence_digest:
        return {}

    feedback_bundle = _alignment_repair_feedback(alignment)
    feedback = (
        feedback_bundle.get("independent_verifier_feedback")
        if isinstance(feedback_bundle.get("independent_verifier_feedback"), dict)
        else {}
    )
    if feedback.get("required_action") != "redeclaration_preserving_grounded_dependency_graph":
        return {}

    verified_by_pair: dict[tuple[str, str], dict[str, str]] = {}
    for raw in list(feedback.get("dependency_edges") or []):
        if not isinstance(raw, dict):
            return {}
        dependent = _clean_text(raw.get("dependent_goal_id"), limit=80)
        prerequisite = _clean_text(raw.get("requires_result_of_goal_id"), limit=80)
        basis_kind = _clean_text(raw.get("basis_kind"), limit=80).lower()
        basis_span = _clean_text(raw.get("basis_span"), limit=240)
        if not dependent or not prerequisite or not basis_kind or not basis_span:
            return {}
        verified_by_pair[(dependent, prerequisite)] = {
            "dependent_goal_id": dependent,
            "requires_result_of_goal_id": prerequisite,
            "basis_kind": basis_kind,
            "basis_span": basis_span,
        }

    declared_pairs: set[tuple[str, str]] = set()
    for raw in list(feedback.get("candidate_declared_dependency_edges") or []):
        if not isinstance(raw, dict):
            return {}
        dependent = _clean_text(raw.get("dependent_goal_id"), limit=80)
        prerequisite = _clean_text(raw.get("requires_result_of_goal_id"), limit=80)
        if not dependent or not prerequisite:
            return {}
        declared_pairs.add((dependent, prerequisite))

    verified_pairs = set(verified_by_pair)
    operations: list[dict[str, Any]] = []
    for pair in sorted(verified_pairs - declared_pairs):
        operations.append({
            "operation": "ADD_DEPENDENCY",
            **verified_by_pair[pair],
        })
    for dependent, prerequisite in sorted(declared_pairs - verified_pairs):
        operations.append({
            "operation": "REMOVE_DEPENDENCY",
            "dependent_goal_id": dependent,
            "requires_result_of_goal_id": prerequisite,
        })
    if not operations:
        return {}

    return {
        "authoritative_dependency_delta": {
            "contract": "dependency-authority-repair@1",
            "authority": "deterministic_dependency_proof_reducer",
            "authority_state": "authoritative",
            "premise_digest": premise_digest,
            "authority_evidence_digest": authority_evidence_digest,
            "required_action": "apply_exact_dependency_delta_then_redeclare",
            "operations": operations,
            "constraints": [
                "apply_only_listed_dependency_operations",
                "preserve_goal_ids_and_all_non_dependency_semantics",
                "do_not_reinfer_or_expand_authoritative_dependency_operations",
                "do_not_copy_or_infer_tools_capabilities_targets_or_business_answers",
                "runtime_does_not_auto_rewrite_the_candidate",
            ],
        }
    }


def _goal_declaration_alignment_repair_context(
    user_text: str,
    alignment: GoalAlignmentVerdict,
) -> dict[str, Any]:
    context = _goal_declaration_repair_context(user_text)
    delta = _alignment_authoritative_dependency_repair_contract(alignment)
    if delta:
        context["repair_contract"].update(delta)
    return context
'''
          replace_once(goal_planning, marker, helper + marker, "insert authority repair contract")

          old_alignment_return = '''                "alignment_proof": alignment.as_dict(),
                **_alignment_repair_feedback(alignment),
                **_goal_declaration_repair_context(user_text),
'''
          new_alignment_return = '''                "alignment_proof": alignment.as_dict(),
                **_alignment_repair_feedback(alignment),
                **_goal_declaration_alignment_repair_context(user_text, alignment),
'''
          replace_once(goal_planning, old_alignment_return, new_alignment_return, "bind authority delta to repair contract")

          dialogue = ROOT / "services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py"
          old_doc = '''    Trace/audit may retain the independent verifier's complete proof, including
    candidate-blind dependency graphs.  That proof is never semantic write
    authority.  Before the next model declaration, this boundary retains only
    current-user text, structural errors, reason codes, constraints and literal
    violation spans; replacement edges, requested effects, roles and targets are
    deliberately dropped.
'''
          new_doc = '''    Trace/audit may retain the independent verifier's complete proof. Raw verifier
    replacement semantics remain read-only. The one exception is a dependency
    delta already sealed as AUTHORITATIVE by the deterministic proof reducer and
    placed in repair_contract.authoritative_dependency_delta: that machine
    contract crosses the provider boundary so Planner can redeclare instead of
    guessing the relation again. Requested effects, targets, tools, capabilities
    and business answers are still deliberately excluded.
'''
          replace_once(dialogue, old_doc, new_doc, "projection authority documentation")

          replace_once(
              dialogue,
              '''        # Keep the independently verified graph itself out of provider-facing
        # repair messages, but do not collapse a directional graph delta into an
        # ambiguous generic field error.  The writer may learn only whether its
        # candidate omitted a grounded relation, asserted an unproved relation,
        # or did both; it must still rederive the actual edge from current input.
''',
              '''        # Keep raw verifier graph replacement out of the diagnostic feedback.
        # A reducer-sealed relation delta, when available, travels separately in
        # repair_contract.authoritative_dependency_delta. The diagnostic still
        # records polarity so logs remain useful without becoming a second owner.
''',
              "projection dependency comment",
          )
          replace_once(
              dialogue,
              '''            "rederive_semantics_from_current_user_input",
            "do_not_copy_verifier_dependency_edges_or_replacement_semantic_values",
''',
              '''            "rederive_non_authoritative_semantics_from_current_user_input",
            "do_not_copy_unsealed_verifier_dependency_edges_or_replacement_semantic_values",
''',
              "projection generic writer constraints",
          )
          replace_once(
              dialogue,
              '''                "rederive_complete_depends_on_graph_from_current_user_input_only",
                "explicit_same_turn_result_reference_result_condition_or_result_value_input_requires_depends_on",
                "sequence_shared_topic_zero_anaphora_and_execution_support_dataflow_do_not_create_depends_on",
                "dependency_delta_kind_reports_only_candidate_graph_error_polarity_and_never_identifies_an_edge_to_copy",
''',
              '''                "apply_repair_contract_authoritative_dependency_delta_exactly_when_present_otherwise_rederive_depends_on_from_current_user_input",
                "explicit_same_turn_result_reference_result_condition_or_result_value_input_requires_depends_on",
                "sequence_shared_topic_zero_anaphora_and_execution_support_dataflow_do_not_create_depends_on",
                "diagnostic_dependency_delta_kind_is_not_write_authority_only_repair_contract_authoritative_dependency_delta_is",
''',
              "projection dependency writer constraints",
          )

          # Release #47 now verifies that diagnostic feedback remains violation-only
          # while the sealed repair contract transports the exact mature delta.
          release47 = ROOT / "services/agent-service/tests/runtime/test_release47_dependency_repair_projection.py"
          text = release47.read_text(encoding="utf-8")
          text = text.replace(
              'from agent_core.lifecycle.goal_planning import GoalAlignmentVerdict, _alignment_repair_feedback\n',
              '''from agent_core.lifecycle.goal_planning import (\n    GoalAlignmentVerdict,\n    _alignment_repair_feedback,\n    _goal_declaration_alignment_repair_context,\n)\n''',
          )
          old_fixture = '''            "current_user_input": user_text,
            "repair_contract": {
                "authority": "current_user_input_only",
                "required_action": "redeclaration",
            },
'''
          new_fixture = '''            **_goal_declaration_alignment_repair_context(user_text, alignment),
'''
          if text.count(old_fixture) != 1:
              raise SystemExit("release47 repair fixture marker mismatch")
          text = text.replace(old_fixture, new_fixture, 1)

          old_positive_tail = '''    serialized = json.dumps(projected, ensure_ascii=False, sort_keys=True)
    assert "dependent_goal_id" not in serialized
    assert "requires_result_of_goal_id" not in serialized
    assert "candidate_declared_dependency_edges" not in serialized
    assert '\"g1\"' not in serialized
    assert '\"g2\"' not in serialized
'''
          new_positive_tail = '''    diagnostic_serialized = json.dumps(feedback, ensure_ascii=False, sort_keys=True)
    assert "dependent_goal_id" not in diagnostic_serialized
    assert "requires_result_of_goal_id" not in diagnostic_serialized
    assert "candidate_declared_dependency_edges" not in diagnostic_serialized

    delta = projected["data"]["repair_contract"]["authoritative_dependency_delta"]
    assert delta["authority"] == "deterministic_dependency_proof_reducer"
    assert delta["authority_state"] == "authoritative"
    assert delta["operations"] == [{
        "operation": "ADD_DEPENDENCY",
        **_edge(),
    }]
    assert "apply_only_listed_dependency_operations" in delta["constraints"]
'''
          if text.count(old_positive_tail) != 1:
              raise SystemExit("release47 positive assertion marker mismatch")
          text = text.replace(old_positive_tail, new_positive_tail, 1)

          old_negative_tail = '''    serialized = json.dumps(projected, ensure_ascii=False, sort_keys=True)
    assert "dependent_goal_id" not in serialized
    assert "requires_result_of_goal_id" not in serialized
    assert '\"g1\"' not in serialized
    assert '\"g2\"' not in serialized
'''
          new_negative_tail = '''    diagnostic_serialized = json.dumps(feedback, ensure_ascii=False, sort_keys=True)
    assert "dependent_goal_id" not in diagnostic_serialized
    assert "requires_result_of_goal_id" not in diagnostic_serialized

    delta = projected["data"]["repair_contract"]["authoritative_dependency_delta"]
    assert delta["operations"] == [{
        "operation": "REMOVE_DEPENDENCY",
        "dependent_goal_id": "g2",
        "requires_result_of_goal_id": "g1",
    }]
'''
          if text.count(old_negative_tail) != 1:
              raise SystemExit("release47 negative assertion marker mismatch")
          release47.write_text(text.replace(old_negative_tail, new_negative_tail, 1), encoding="utf-8")

          # Control-plane roundtrip tests: consume the exact machine delta, then
          # prove the declaration matches the same authority without changing the
          # frozen semantic premise digest.
          skill_test = ROOT / "skill-system/tests/test_semantic_dependency_repair_feedback.py"
          text = skill_test.read_text(encoding="utf-8")
          text = text.replace(
              '''    _alignment_repair_feedback,\n    _model_alignment_dependency_proof,\n    validate_goal_declaration,\n''',
              '''    _alignment_authoritative_dependency_repair_contract,\n    _alignment_repair_feedback,\n    _goal_declaration_alignment_repair_context,\n    _model_alignment_dependency_proof,\n    validate_goal_declaration,\n''',
          )
          insert_marker = '''    def test_incomplete_or_nonindependent_proof_never_becomes_repair_authority(self) -> None:\n'''
          new_tests = r'''    def test_authoritative_add_delta_roundtrips_without_reinferring_dependency(self) -> None:
        text = "查一下键盘订单，再看看它能不能退款"
        edge = {
            "dependent_goal_id": "g2",
            "requires_result_of_goal_id": "g1",
            "basis_kind": "result_reference",
            "basis_span": "它",
        }
        original = [
            _goal("g1", "查一下键盘订单", []),
            _goal("g2", "再看看它能不能退款", []),
        ]
        details, error = _model_alignment_dependency_proof(
            user_text=text, goals=original, values=[edge]
        )
        self.assertEqual(error, "goal_alignment_dependency_graph_mismatch")
        mature = _authoritative_details(
            user_text=text,
            goals=original,
            details=details,
            evidence_prefix="roundtrip-add",
        )
        verdict = GoalAlignmentVerdict(
            "incomplete",
            tuple(row["evidence_span"] for row in original),
            (),
            "goal_alignment_dependency_graph_mismatch",
            "model",
            True,
            mature,
        )
        contract = _alignment_authoritative_dependency_repair_contract(verdict)[
            "authoritative_dependency_delta"
        ]
        self.assertEqual(contract["operations"], [{"operation": "ADD_DEPENDENCY", **edge}])

        repaired = [dict(row, depends_on=list(row["depends_on"])) for row in original]
        for operation in contract["operations"]:
            self.assertEqual(operation["operation"], "ADD_DEPENDENCY")
            target = next(row for row in repaired if row["goal_id"] == operation["dependent_goal_id"])
            target["depends_on"] = list(dict.fromkeys([
                *target["depends_on"], operation["requires_result_of_goal_id"]
            ]))

        self.assertEqual(
            dependency_premise_digest(user_text=text, goals=original),
            dependency_premise_digest(user_text=text, goals=repaired),
            "Planner depends_on must not change frozen semantic premise authority",
        )
        repaired_details, repaired_error = _model_alignment_dependency_proof(
            user_text=text, goals=repaired, values=[edge]
        )
        self.assertIsNone(repaired_error)
        self.assertTrue(repaired_details["dependency_graph_match"])

    def test_authoritative_remove_delta_roundtrips_to_verified_empty_graph(self) -> None:
        text = "查一下鼠标订单，然后帮我申请退款"
        original = [
            _goal("g1", "查一下鼠标订单", []),
            _goal("g2", "帮我申请退款", ["g1"]),
        ]
        details, error = _model_alignment_dependency_proof(
            user_text=text, goals=original, values=[]
        )
        self.assertEqual(error, "goal_alignment_dependency_graph_mismatch")
        mature = _authoritative_details(
            user_text=text,
            goals=original,
            details=details,
            evidence_prefix="roundtrip-remove",
        )
        verdict = GoalAlignmentVerdict(
            "incomplete",
            tuple(row["evidence_span"] for row in original),
            (),
            "goal_alignment_dependency_graph_mismatch",
            "model",
            True,
            mature,
        )
        context = _goal_declaration_alignment_repair_context(text, verdict)
        contract = context["repair_contract"]["authoritative_dependency_delta"]
        self.assertEqual(contract["operations"], [{
            "operation": "REMOVE_DEPENDENCY",
            "dependent_goal_id": "g2",
            "requires_result_of_goal_id": "g1",
        }])

        repaired = [dict(row, depends_on=list(row["depends_on"])) for row in original]
        for operation in contract["operations"]:
            target = next(row for row in repaired if row["goal_id"] == operation["dependent_goal_id"])
            target["depends_on"] = [
                dep for dep in target["depends_on"]
                if dep != operation["requires_result_of_goal_id"]
            ]
        repaired_details, repaired_error = _model_alignment_dependency_proof(
            user_text=text, goals=repaired, values=[]
        )
        self.assertIsNone(repaired_error)
        self.assertTrue(repaired_details["dependency_graph_match"])

    def test_non_authoritative_mismatch_cannot_seal_dependency_repair_delta(self) -> None:
        verdict = GoalAlignmentVerdict(
            "incomplete",
            ("查一下键盘订单", "再看看它能不能退款"),
            (),
            "goal_alignment_dependency_graph_mismatch",
            "model",
            True,
            {
                "dependency_authority": "independent_goal_alignment",
                "dependency_proof_complete": True,
                "dependency_graph_match": False,
                "dependency_authority_state": "verified",
                "dependency_edges": [{
                    "dependent_goal_id": "g2",
                    "requires_result_of_goal_id": "g1",
                    "basis_kind": "result_reference",
                    "basis_span": "它",
                }],
                "declared_dependency_edges": [],
                "dependency_authority_premise_digest": "premise",
                "dependency_authority_evidence_digest": "evidence",
            },
        )
        self.assertEqual(_alignment_authoritative_dependency_repair_contract(verdict), {})

'''
          if text.count(insert_marker) != 1:
              raise SystemExit("semantic repair test insertion marker mismatch")
          skill_test.write_text(text.replace(insert_marker, new_tests + insert_marker, 1), encoding="utf-8")

          # Remove the one-shot carrier before the resulting product commit.
          carrier = ROOT / ".github/workflows/stage3-authority-repair-roundtrip-carrier.yml"
          carrier.unlink()

          # Refresh the existing protected-source hash registry legitimately for
          # the product files/tests changed by this stage. Count/roots remain fixed.
          baseline_path = ROOT / "skill-system/registry/product-source-baseline.json"
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          files = dict(baseline.get("files") or {})
          for rel in list(files):
              path = ROOT / rel
              if path.is_file():
                  files[rel] = sha256(path.read_bytes()).hexdigest()
          baseline["files"] = dict(sorted(files.items()))
          baseline["file_count"] = len(files)
          baseline_path.write_text(
              json.dumps(baseline, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Compile Stage 3 Python
        run: |
          python -m py_compile \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py \
            services/agent-service/tests/runtime/test_release47_dependency_repair_projection.py \
            skill-system/tests/test_semantic_dependency_repair_feedback.py

      - name: Commit Stage 3
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(semantic): carry mature dependency authority through repair"
          git push origin HEAD:fix/proof-authority-lifecycle-20260816
