name: wp08-fresh-release-authorize-once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: read
  actions: write
  issues: read

jobs:
  authorize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-fresh-release-authorize-once-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 18e57097372bf597e46929cdd872b89bb4e94312
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact authoritative main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1

      - name: Verify terminal prior ReleaseRun and no active ledger
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python -B - <<'PY'
          from __future__ import annotations

          import json
          import os
          from urllib import request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }

          def get(path: str):
              req = request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          prior = get('/issues/267')
          if str(prior.get('state')) != 'closed':
              raise SystemExit('prior ReleaseRun #267 must be closed')
          body = str(prior.get('body') or '')
          required = (
              '"status": "ATTEMPT_BUDGET_EXHAUSTED"',
              '"attempt": 8',
              '"max_attempts": 8',
              '"current_candidate_sha": "18e57097372bf597e46929cdd872b89bb4e94312"',
              '"production_closed": false',
          )
          missing = [value for value in required if value not in body]
          if missing:
              raise SystemExit('prior ReleaseRun contract mismatch: ' + repr(missing))

          open_issues = get('/issues?state=open&per_page=100')
          active_ledgers = [
              row for row in open_issues
              if '<!-- WP08_RELEASE_RUN_STATE_BEGIN -->' in str(row.get('body') or '')
          ]
          if active_ledgers:
              raise SystemExit('an open WP-08 ReleaseRun ledger already exists')
          PY

      - name: Dispatch repository-owned coordinator authorization on protected main
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/wp08-release-coordinator.yml/dispatches" \
            -f ref=main
          echo 'Fresh ReleaseRun authorization dispatched through repository-owned coordinator.'

      - name: Record operational boundary
        shell: bash
        run: |
          echo 'This carrier must remain unmerged.'
          echo 'It does not create or edit the ReleaseRun ledger directly.'
          echo 'It does not claim production closure.'
