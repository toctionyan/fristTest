name: temporary-auto-release-after-real-model-repair
run-name: temporary protected release dispatcher (${{ github.event_name }})

"on":
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-auto-release-after-real-model-repair.yml
      - scripts/verify_production_certification_bundle.py
      - services/agent-service/scripts/verify_model_smoke.py
      - services/agent-service/src/agent_core/model_calls/real_model_identity.py
  issue_comment:
    types:
      - created
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  statuses: write

concurrency:
  group: temporary-auto-release-after-real-model-repair
  cancel-in-progress: false

jobs:
  dispatch-protected-release:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 33 &&
       contains(github.event.comment.body, '/dispatch-protected-release'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve release target and publish pending status
        id: target
        shell: bash
        run: |
          set -euo pipefail
          target_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          dispatcher_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          echo "target_sha=$target_sha" >> "$GITHUB_OUTPUT"
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${target_sha}" \
            -f state=pending \
            -f context=protected-release-dispatcher \
            -f description="Dispatcher ${GITHUB_RUN_ID} started" \
            -f target_url="$dispatcher_url"

      - name: Record dispatcher start
        continue-on-error: true
        shell: bash
        run: |
          body_file="${RUNNER_TEMP}/dispatcher-start.md"
          cat > "$body_file" <<EOF
          auto-real-model-dispatch-start:${GITHUB_RUN_ID}

          Event: ${GITHUB_EVENT_NAME}
          Target SHA: ${{ steps.target.outputs.target_sha }}
          Dispatcher run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue comment 33 --body-file "$body_file"

      - name: Dispatch or recover protected production certification
        id: release
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
        run: |
          set -euo pipefail
          failure_stage="discover-existing-release-run"
          trap 'echo "failure_stage=$failure_stage" >> "$GITHUB_OUTPUT"' ERR

          runs_api="repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?event=workflow_dispatch&head_sha=${TARGET_SHA}&per_page=10"
          run_id="$(gh api "$runs_api" --jq '.workflow_runs[0].id // empty')"

          if [ -z "$run_id" ]; then
            failure_stage="dispatch-protected-release"
            jq -n '{
              ref: "main",
              inputs: {
                provider: "deepseek",
                model: "deepseek-v4-flash",
                embedding_model: "text-embedding-v4",
                embedding_dimension: "1024"
              }
            }' | gh api \
              --method POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/dispatches" \
              --input -
          fi

          failure_stage="discover-dispatched-release-run"
          for _ in $(seq 1 30); do
            run_json="$(gh api "$runs_api")"
            run_id="$(jq -r '.workflow_runs[0].id // empty' <<<"$run_json")"
            if [ -n "$run_id" ]; then
              run_status="$(jq -r '.workflow_runs[0].status // "unknown"' <<<"$run_json")"
              run_url="$(jq -r '.workflow_runs[0].html_url // empty' <<<"$run_json")"
              break
            fi
            sleep 2
          done

          if [ -z "${run_id:-}" ]; then
            echo "Protected release dispatch succeeded but no run was discoverable." >&2
            exit 1
          fi

          trap - ERR
          echo "failure_stage=" >> "$GITHUB_OUTPUT"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "run_status=${run_status:-unknown}" >> "$GITHUB_OUTPUT"
          echo "run_url=${run_url:-}" >> "$GITHUB_OUTPUT"

      - name: Publish dispatcher outcome status
        if: always()
        shell: bash
        env:
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          FAILURE_STAGE: ${{ steps.release.outputs.failure_stage }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.run_id }}
          RELEASE_RUN_STATUS: ${{ steps.release.outputs.run_status }}
          RELEASE_RUN_URL: ${{ steps.release.outputs.run_url }}
        run: |
          set -euo pipefail
          dispatcher_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ "$RELEASE_OUTCOME" = "success" ]; then
            state="success"
            description="Release ${RELEASE_RUN_ID} ${RELEASE_RUN_STATUS}"
            target_url="${RELEASE_RUN_URL:-$dispatcher_url}"
          else
            state="failure"
            description="Dispatcher failed at ${FAILURE_STAGE:-unknown}"
            target_url="$dispatcher_url"
          fi
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$state" \
            -f context=protected-release-dispatcher \
            -f description="$description" \
            -f target_url="$target_url"

      - name: Record dispatcher outcome
        if: always()
        continue-on-error: true
        shell: bash
        env:
          RELEASE_OUTCOME: ${{ steps.release.outcome }}
          FAILURE_STAGE: ${{ steps.release.outputs.failure_stage }}
          TARGET_SHA: ${{ steps.target.outputs.target_sha }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.run_id }}
          RELEASE_RUN_STATUS: ${{ steps.release.outputs.run_status }}
          RELEASE_RUN_URL: ${{ steps.release.outputs.run_url }}
        run: |
          body_file="${RUNNER_TEMP}/dispatcher-outcome.md"
          cat > "$body_file" <<EOF
          auto-real-model-dispatch-result:${GITHUB_RUN_ID}

          Event: ${GITHUB_EVENT_NAME}
          Dispatch outcome: ${RELEASE_OUTCOME}
          Failure stage: ${FAILURE_STAGE}
          Target SHA: ${TARGET_SHA}
          Protected release run: ${RELEASE_RUN_ID}
          Initial status: ${RELEASE_RUN_STATUS}
          Protected release URL: ${RELEASE_RUN_URL}
          Dispatcher run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          gh issue comment 33 --body-file "$body_file"
