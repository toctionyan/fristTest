name: b28-source-snapshot

"on":
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/source-snapshot.yml

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          clean: true
          persist-credentials: false
      - name: Build source snapshot
        run: |
          tar --exclude=.git --exclude=source-snapshot.tgz -czf source-snapshot.tgz .
      - name: Upload source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b17j-source-snapshot-${{ github.event.pull_request.head.sha }}
          path: source-snapshot.tgz
          retention-days: 3
          if-no-files-found: error
