name: wp08-attempt6-semantic-oracle-baseline-refresh

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  validate-and-promote-baseline:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt6-semantic-oracle-baseline-refresh-20260808'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      FORMAL_BRANCH: agent/wp08-attempt6-provider-checkpoint-semantic-repair-20260808
      CANDIDATE_HEAD: 179599748648103b5cc095fa8663e7b39cd9f947
    steps:
      - name: Checkout carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: wp08-attempt6-semantic-oracle-baseline-refresh-20260808
          path: carrier
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact formal candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.CANDIDATE_HEAD }}
          path: candidate
          fetch-depth: 1
          persist-credentials: true

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Verify exact candidate and install locked environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$CANDIDATE_HEAD"
          REMOTE="$(git -C candidate ls-remote origin refs/heads/$FORMAL_BRANCH | awk '{print $1}')"
          test "$REMOTE" = "$CANDIDATE_HEAD"
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r candidate/deployment/ci/uv-requirements-linux-x86_64.txt
          cd candidate/services/agent-service
          uv sync --locked --all-groups

      - name: Generate exact one-file protected baseline refresh
        shell: bash
        run: |
          set -euo pipefail
          CANDIDATE_HEAD="$CANDIDATE_HEAD" "${pythonLocation}/bin/python" -B \
            carrier/scripts/wp08_attempt6_semantic_oracle_baseline_refresh.py candidate

      - name: Re-run exact Quick adversarial counterexample gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p candidate/.quality/attempt6-semantic-baseline
          candidate/services/agent-service/.venv/bin/python -B \
            candidate/scripts/run_agent_pytest.py \
            --workspace-root candidate \
            --junitxml candidate/.quality/attempt6-semantic-baseline/adversarial.xml \
            tests/runtime/test_goal_binding_counterexamples.py \
            tests/runtime/test_semantic_grounding_read.py \
            tests/runtime/test_similar_capability_rejection.py \
            tests/context/test_parameterized_capability_alignment.py \
            tests/architecture/test_quality_loop_governance.py

      - name: Validate project compatibility and full Skill control plane
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          services/agent-service/.venv/bin/python -B skill-system/controller/project_compatibility.py | tee ../wp08-attempt6-semantic-project-compatibility.json
          services/agent-service/.venv/bin/python -B skill-system/controller/profile_runner.py skill-control-plane | tee ../wp08-attempt6-semantic-skill-control-plane.json

      - name: Publish only refreshed baseline governance file
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          git clean -fdX
          find . -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete
          test "$(git rev-parse HEAD)" = "$CANDIDATE_HEAD"
          test "$(git diff --name-only "$CANDIDATE_HEAD" --)" = \
            'skill-system/registry/product-source-baseline.json'
          REMOTE="$(git ls-remote origin refs/heads/$FORMAL_BRANCH | awk '{print $1}')"
          test "$REMOTE" = "$CANDIDATE_HEAD"
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m 'Refresh semantic oracle governance protected source baseline'
          test "$(git rev-parse HEAD^)" = "$CANDIDATE_HEAD"
          git push --force-with-lease=refs/heads/${FORMAL_BRANCH}:${CANDIDATE_HEAD} origin HEAD:refs/heads/$FORMAL_BRANCH
          git rev-parse HEAD > ../wp08-attempt6-semantic-baseline-promotion-head.txt

      - name: Upload baseline evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: wp08-attempt6-semantic-oracle-baseline-promotion
          path: |
            candidate/wp08-attempt6-semantic-oracle-baseline-report.json
            wp08-attempt6-semantic-project-compatibility.json
            wp08-attempt6-semantic-skill-control-plane.json
            wp08-attempt6-semantic-baseline-promotion-head.txt
          if-no-files-found: error
          retention-days: 90
