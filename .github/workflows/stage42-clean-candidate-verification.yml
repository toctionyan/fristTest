name: stage42-clean-candidate-verification

on:
  pull_request:
    branches:
      - fix/dependency-proof-authority-reducer-20260816
    paths:
      - .github/workflows/stage42-clean-candidate-verification.yml

permissions:
  contents: read

jobs:
  verify-clean-stage42-candidate:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout carrier head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Reconstruct exact clean governed baseline workspace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          clean="${RUNNER_TEMP}/stage42-clean"
          rm -rf "$clean"
          git worktree add --detach "$clean" "$BASE_SHA"
          change="repair-stage4-2-dependency-obligation-evidence-pipeline"
          case="governance/repair-cases/${change}"

          cp governance/active-change.json "$clean/governance/active-change.json"
          rm -rf "$clean/$case"
          mkdir -p "$clean/governance/repair-cases"
          cp -R "$case" "$clean/$case"

          # The original generated target encoded the structured value as
          # "无；<explanation>".  Baseline mode reproduced RED, but verification
          # correctly rejected that malformed structured metadata.  The target
          # now keeps the same scope/claim/policy and separates the exact value
          # "无" from explanatory prose.  Preserve the prior baseline identity
          # as predecessor evidence; do not reuse/re-sign its transported
          # workspace-local attestation.
          cp "$clean/$case/evidence/quality-baseline/baseline-record.json" \
            "${RUNNER_TEMP}/stage42-pre-normalization-baseline-record.json"
          rm -rf "$clean/$case/evidence/quality-baseline" \
                 "$clean/$case/evidence/quality-verification"

          test "$(git -C "$clean" rev-parse HEAD)" = "$BASE_SHA"
          printf '%s\n' \
            governance/active-change.json \
            "$case" \
            services/agent-service/src/agent_core/goal_graph/dependency_alignment.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/tests/runtime/test_dependency_alignment_authority.py \
            services/agent-service/tests/runtime/test_dependency_obligation_evidence_pipeline.py \
            > "${RUNNER_TEMP}/stage42-overlay-allowlist.txt"
          git -C "$clean" status --short

      - name: Bootstrap locked uv in clean workspace
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r "${RUNNER_TEMP}/stage42-clean/deployment/ci/uv-requirements-linux-x86_64.txt"

      - name: Install locked Agent validation environment
        run: cd "${RUNNER_TEMP}/stage42-clean/services/agent-service" && uv sync --locked --all-groups

      - name: Replay normalized canonical RED baseline under the clean trust key
        run: |
          set -uo pipefail
          clean="${RUNNER_TEMP}/stage42-clean"
          change="repair-stage4-2-dependency-obligation-evidence-pipeline"
          case="governance/repair-cases/${change}"
          replay=".quality/stage42-clean-baseline"
          replay_state=".quality/stage42-clean-baseline-state"
          cd "$clean"
          rm -rf "$replay" "$replay_state"

          set +e
          services/agent-service/.venv/bin/python -B scripts/quality_loop.py \
            --workspace-root "$clean" \
            --mode quick \
            --target "$case/quality-input/target.md" \
            --policy "$case/quality-input/focused-policy.json" \
            --evidence-dir "$replay" \
            --state-dir "$replay_state" \
            --baseline \
            2>&1 | tee "${RUNNER_TEMP}/stage42-baseline-replay.log"
          rc=${PIPESTATUS[0]}
          set -e
          test "$rc" -ne 0

          PREVIOUS_RECORD="${RUNNER_TEMP}/stage42-pre-normalization-baseline-record.json" \
          services/agent-service/.venv/bin/python - <<'PY'
          import json
          import os
          from pathlib import Path

          replay = Path('.quality/stage42-clean-baseline')
          summary = json.loads((replay / 'run-summary.json').read_text())
          record = json.loads((replay / 'baseline-record.json').read_text())
          previous = json.loads(Path(os.environ['PREVIOUS_RECORD']).read_text())

          assert summary['run_kind'] == 'baseline', summary
          assert summary['decision'] == 'FAIL', summary
          assert summary['loop_status'] == 'BASELINE_RECORDED', summary
          assert len(summary['results']) == 1, summary['results']
          gate = summary['results'][0]
          assert gate['id'] == 'stage42-red-proof', gate
          assert gate['status'] == 'FAIL', gate
          observed = gate.get('metadata', {}).get('structured_assessment') or {}
          assert observed.get('graph_complete') is True, observed
          assert observed.get('maturity') == 'AUTHORITATIVE', observed
          assert observed.get('target_compatibility') == 'PASS', observed
          assert observed.get('counterfactual') == 'PASS', observed
          assert len(summary['claim_results']) == 1, summary['claim_results']
          assert summary['claim_results'][0]['id'] == 'STAGE4_2.DEPENDENCY_OBLIGATION_PIPELINE'
          assert summary['claim_results'][0]['status'] == 'FAILED', summary['claim_results']

          # Schema normalization must not move the semantic contract: stable
          # target/change/context, same claim manifest, same focused policy.
          for key in ('id', 'change_ref', 'context', 'claim_manifest_fingerprint'):
              assert record['target_identity'][key] == previous['target_identity'][key], (
                  key, record['target_identity'], previous['target_identity']
              )
          assert record['policy_fingerprint'] == previous['policy_fingerprint'], (record, previous)
          assert record['target_identity']['fingerprint'] != previous['target_identity']['fingerprint'], (
              'expected target text fingerprint to change after structured-field normalization',
              record,
              previous,
          )
          print(json.dumps({
              'replay_decision': summary['decision'],
              'replay_loop_status': summary['loop_status'],
              'previous_target_fingerprint': previous['target_identity']['fingerprint'],
              'normalized_target_fingerprint': record['target_identity']['fingerprint'],
              'claim_manifest_fingerprint': record['target_identity']['claim_manifest_fingerprint'],
              'policy_fingerprint': record['policy_fingerprint'],
              'red_observation': observed,
          }, indent=2))
          PY

      - name: Overlay only the bounded Stage 4.2 candidate paths
        run: |
          set -euo pipefail
          clean="${RUNNER_TEMP}/stage42-clean"
          for path in \
            services/agent-service/src/agent_core/goal_graph/dependency_alignment.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/tests/runtime/test_dependency_alignment_authority.py \
            services/agent-service/tests/runtime/test_dependency_obligation_evidence_pipeline.py
          do
            mkdir -p "$clean/$(dirname "$path")"
            cp "$path" "$clean/$path"
          done
          git -C "$clean" status --short

      - name: Run focused Stage 4.2 and compatibility regressions
        run: |
          set -o pipefail
          clean="${RUNNER_TEMP}/stage42-clean"
          export PYTHONPATH="$clean/services/agent-service/src${PYTHONPATH:+:$PYTHONPATH}"
          cd "$clean"
          services/agent-service/.venv/bin/python -B -m pytest -q \
            services/agent-service/tests/runtime/test_dependency_alignment_authority.py \
            services/agent-service/tests/runtime/test_dependency_obligation_evidence_pipeline.py \
            services/agent-service/tests/runtime/test_dependency_proof_authority.py \
            skill-system/tests/test_semantic_dependency_repair_feedback.py \
            2>&1 | tee "${RUNNER_TEMP}/stage42-focused-pytest.log"

      - name: Run canonical Stage 4.2 baseline-to-candidate Quality transition
        run: |
          set -o pipefail
          clean="${RUNNER_TEMP}/stage42-clean"
          change="repair-stage4-2-dependency-obligation-evidence-pipeline"
          case="governance/repair-cases/${change}"
          cd "$clean"
          rm -rf "$case/evidence/quality-verification" ".quality/product-code/${change}/state"
          services/agent-service/.venv/bin/python -B scripts/quality_loop.py \
            --workspace-root "$clean" \
            --mode quick \
            --target "$case/quality-input/target.md" \
            --policy "$case/quality-input/focused-policy.json" \
            --baseline-evidence ".quality/stage42-clean-baseline" \
            --evidence-dir "$case/evidence/quality-verification" \
            --state-dir ".quality/product-code/${change}/state" \
            2>&1 | tee "${RUNNER_TEMP}/stage42-quality-transition.log"

          services/agent-service/.venv/bin/python - <<'PY'
          import json
          from pathlib import Path
          change = "repair-stage4-2-dependency-obligation-evidence-pipeline"
          summary = json.loads((Path("governance/repair-cases") / change / "evidence/quality-verification/run-summary.json").read_text())
          assert summary["decision"] == "PASS", summary
          assert summary["loop_status"] == "CONVERGED", summary
          assert summary["run_kind"] == "verification", summary
          claims = summary["claim_results"]
          assert len(claims) == 1, claims
          claim = claims[0]
          assert claim["id"] == "STAGE4_2.DEPENDENCY_OBLIGATION_PIPELINE", claim
          assert claim["status"] == "VERIFIED", claim
          assert claim["required_gates"] == ["stage42-red-proof"], claim
          assert claim["evidence_refs"] == ["gate-log:stage42-red-proof"], claim
          results = summary["results"]
          assert len(results) == 1, results
          assert results[0]["id"] == "stage42-red-proof", results
          assert results[0]["status"] == "PASS", results
          print(json.dumps({
              "decision": summary["decision"],
              "loop_status": summary["loop_status"],
              "claim_results": summary["claim_results"],
              "results": summary["results"],
          }, indent=2))
          PY

      - name: Freeze clean Stage 4.2 verification evidence
        if: always()
        run: |
          set -euo pipefail
          clean="${RUNNER_TEMP}/stage42-clean"
          change="repair-stage4-2-dependency-obligation-evidence-pipeline"
          out="${RUNNER_TEMP}/stage42-clean-verification"
          rm -rf "$out"
          mkdir -p "$out"
          cp "${RUNNER_TEMP}/stage42-pre-normalization-baseline-record.json" "$out/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/stage42-baseline-replay.log" "$out/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/stage42-focused-pytest.log" "$out/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/stage42-quality-transition.log" "$out/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/stage42-overlay-allowlist.txt" "$out/"
          cp -R "$clean/.quality/stage42-clean-baseline" "$out/quality-baseline-replay" 2>/dev/null || true
          cp -R "$clean/governance/repair-cases/${change}/evidence/quality-verification" "$out/quality-verification" 2>/dev/null || true
          git -C "$clean" diff --check > "$out/diff-check.txt"
          git -C "$clean" status --short > "$out/worktree-status.txt"
          git -C "$clean" rev-parse HEAD > "$out/base-head.txt"

      - name: Upload clean Stage 4.2 verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: stage42-clean-candidate-verification
          path: ${{ runner.temp }}/stage42-clean-verification
          if-no-files-found: error
          retention-days: 30
