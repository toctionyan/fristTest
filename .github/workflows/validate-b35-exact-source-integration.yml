name: Validate B35 exact-source integration

on:
  pull_request:
    branches: [agent/b34-resilient-task-harness-final-20260804]
    paths:
      - .github/workflows/validate-b35-exact-source-integration.yml

permissions:
  contents: write

concurrency:
  group: validate-b35-exact-source-integration-${{ github.sha }}
  cancel-in-progress: false

jobs:
  restore-production-authority-boundary:
    runs-on: ubuntu-24.04
    outputs:
      b35_sha: ${{ steps.restore.outputs.b35_sha }}
    steps:
      - name: Checkout governed B35 candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/b35-staged-goal-progression-20260804
          path: source
          fetch-depth: 0

      - name: Restore canonical B35 production authority boundary
        id: restore
        env:
          TARGET_BRANCH: agent/b35-staged-goal-progression-20260804
          EXPECTED_PREVIOUS_HEAD: 065c502d3a0a67834655b927b85dd0fcc5016049
          CANONICAL_B35_TREE: 68673a936a8c6adf5394cc65cccf29db4589341c
          EXPECTED_FINGERPRINT: 2418db8c897cbb91b5f5b4cc0b8028cc3efec60dfc43c5114802547e9c544047
        run: |
          set -euo pipefail
          current_head="$(git -C source rev-parse HEAD)"
          test "${current_head}" = "${EXPECTED_PREVIOUS_HEAD}"
          test -z "$(git -C source status --short)"

          git -C source checkout "${CANONICAL_B35_TREE}" -- \
            governance/quality-loop-policy.json \
            services/agent-service/tests/architecture/test_systemic_operational_closure.py \
            B35_STAGED_GOAL_PROGRESSION_MANIFEST.json \
            B35_STAGED_GOAL_PROGRESSION_SUMMARY.json \
            release/B35_STAGED_GOAL_PROGRESSION_VALIDATION_REPORT.md \
            skill-system/registry/product-source-baseline.json

          python3 -B - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path('source')
          expected_paths = {
              'governance/quality-loop-policy.json',
              'services/agent-service/tests/architecture/test_systemic_operational_closure.py',
              'B35_STAGED_GOAL_PROGRESSION_MANIFEST.json',
              'B35_STAGED_GOAL_PROGRESSION_SUMMARY.json',
              'release/B35_STAGED_GOAL_PROGRESSION_VALIDATION_REPORT.md',
              'skill-system/registry/product-source-baseline.json',
          }
          actual_paths = set(subprocess.check_output(
              ['git', '-C', 'source', 'diff', '--name-only'],
              text=True,
          ).splitlines())
          assert actual_paths == expected_paths, {
              'expected': sorted(expected_paths),
              'actual': sorted(actual_paths),
          }

          policy = json.loads((root / 'governance/quality-loop-policy.json').read_text(encoding='utf-8'))
          by_id = {step['id']: step for step in policy['steps']}
          assert by_id['configured-model-browser-conversation']['modes'] == ['integration']
          assert by_id['configured-model-browser-campaign']['modes'] == ['integration']
          assert by_id['production-certification-bundle']['modes'] == ['release']
          assert 'production-certification-bundle' in by_id['clean-release-preflight']['depends_on']

          systemic = (root / 'services/agent-service/tests/architecture/test_systemic_operational_closure.py').read_text(encoding='utf-8')
          authority = (root / 'services/agent-service/tests/runtime/test_b17a_production_certification_authority.py').read_text(encoding='utf-8')
          assert 'assert set(gate["modes"]) == {"integration"}' in systemic
          assert 'assert "release" not in by_id["configured-model-browser-conversation"]["modes"]' in authority
          assert 'assert "release" not in by_id["configured-model-browser-campaign"]["modes"]' in authority

          manifest = json.loads((root / 'B35_STAGED_GOAL_PROGRESSION_MANIFEST.json').read_text(encoding='utf-8'))
          summary = json.loads((root / 'B35_STAGED_GOAL_PROGRESSION_SUMMARY.json').read_text(encoding='utf-8'))
          baseline = json.loads((root / 'skill-system/registry/product-source-baseline.json').read_text(encoding='utf-8'))
          expected_fingerprint = os.environ['EXPECTED_FINGERPRINT']
          assert manifest['source_fingerprint'] == expected_fingerprint
          assert manifest['changed_file_count'] == 9
          assert summary['source_fingerprint'] == expected_fingerprint
          assert summary['changed_file_count'] == 9
          assert summary['production_closed'] is False
          assert baseline['source_release_sha256'] == expected_fingerprint
          assert baseline['file_count'] == 547
          assert 'services/agent-service/runtime/vector-store/vector_store.db' not in baseline['files']
          print('Canonical B35 authority and evidence restoration prepared: PASS')
          PY

          git -C source diff --check
          git -C source config user.name github-actions[bot]
          git -C source config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git -C source add \
            governance/quality-loop-policy.json \
            services/agent-service/tests/architecture/test_systemic_operational_closure.py \
            B35_STAGED_GOAL_PROGRESSION_MANIFEST.json \
            B35_STAGED_GOAL_PROGRESSION_SUMMARY.json \
            release/B35_STAGED_GOAL_PROGRESSION_VALIDATION_REPORT.md \
            skill-system/registry/product-source-baseline.json
          git -C source commit -m "Restore B35 production authority boundary"
          git -C source diff --quiet "${CANONICAL_B35_TREE}" HEAD
          git -C source push origin "HEAD:${TARGET_BRANCH}" \
            --force-with-lease="${TARGET_BRANCH}:${EXPECTED_PREVIOUS_HEAD}"

          b35_sha="$(git -C source rev-parse HEAD)"
          echo "b35_sha=${b35_sha}" >> "${GITHUB_OUTPUT}"
          echo "Restored canonical B35 tree at ${b35_sha}"

  integration:
    needs: restore-production-authority-boundary
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    services:
      pgvector:
        image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: agent_test
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - name: Checkout exact restored B35 source Head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.restore-production-authority-boundary.outputs.b35_sha }}
          path: source
          fetch-depth: 1

      - name: Set up Python 3.12.13
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Set up Node 24.18.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Verify exact clean-tree source identity
        env:
          EXPECTED_HEAD: ${{ needs.restore-production-authority-boundary.outputs.b35_sha }}
          CANONICAL_B35_TREE: 68673a936a8c6adf5394cc65cccf29db4589341c
          EXPECTED_FINGERPRINT: 2418db8c897cbb91b5f5b4cc0b8028cc3efec60dfc43c5114802547e9c544047
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "${EXPECTED_HEAD}"
          test ! -e source/services/agent-service/runtime/vector-store/vector_store.db
          git -C source diff --quiet "${CANONICAL_B35_TREE}" HEAD
          "${pythonLocation}/bin/python" -B - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path('source')
          baseline = json.loads((root / 'skill-system/registry/product-source-baseline.json').read_text(encoding='utf-8'))
          manifest = json.loads((root / 'B35_STAGED_GOAL_PROGRESSION_MANIFEST.json').read_text(encoding='utf-8'))
          summary = json.loads((root / 'B35_STAGED_GOAL_PROGRESSION_SUMMARY.json').read_text(encoding='utf-8'))
          policy = json.loads((root / 'governance/quality-loop-policy.json').read_text(encoding='utf-8'))
          by_id = {step['id']: step for step in policy['steps']}
          expected_fingerprint = os.environ['EXPECTED_FINGERPRINT']
          assert baseline['file_count'] == 547
          assert baseline['source_release_sha256'] == expected_fingerprint
          assert manifest['source_fingerprint'] == expected_fingerprint
          assert manifest['changed_file_count'] == 9
          assert summary['source_fingerprint'] == expected_fingerprint
          assert summary['changed_file_count'] == 9
          assert summary['production_closed'] is False
          assert by_id['configured-model-browser-conversation']['modes'] == ['integration']
          assert by_id['configured-model-browser-campaign']['modes'] == ['integration']
          assert by_id['production-certification-bundle']['modes'] == ['release']
          print('Exact canonical B35 source identity: PASS')
          PY

      - name: Create deterministic integration policy overlay
        env:
          QUALITY_POLICY: ${{ runner.temp }}/b35-deterministic-integration-policy.json
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B - <<'PY'
          import json
          import os
          from pathlib import Path

          source = Path('source/governance/quality-loop-policy.json')
          output = Path(os.environ['QUALITY_POLICY'])
          payload = json.loads(source.read_text(encoding='utf-8'))
          excluded = {
              'configured-model-browser-conversation',
              'configured-model-browser-campaign',
          }
          source_steps = {step['id']: step for step in payload['steps']}
          assert source_steps['configured-model-browser-conversation']['modes'] == ['integration']
          assert source_steps['configured-model-browser-campaign']['modes'] == ['integration']
          payload['steps'] = [step for step in payload['steps'] if step['id'] not in excluded]
          remaining = {step['id']: step for step in payload['steps']}
          assert not excluded.intersection(remaining)
          for step in payload['steps']:
              unknown = set(step.get('depends_on') or []) - set(remaining)
              assert not unknown, {step['id']: sorted(unknown)}
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print('Deterministic candidate integration overlay excludes only protected real-model browser components: PASS')
          PY

      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r source/deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Validate locked runtime toolchain
        working-directory: source
        env:
          QUALITY_TOOLCHAIN_RESULT: ${{ runner.temp }}/quality-toolchain-b35-exact-integration.json
        run: >-
          "${pythonLocation}/bin/python" -B scripts/quality_toolchain_contract.py
          --workspace-root . --runtime-only --output "$QUALITY_TOOLCHAIN_RESULT"

      - name: Install locked Python and frontend environments
        run: |
          set -euo pipefail
          cd source/services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups
          cd ../agent-service/frontend && npm ci --ignore-scripts=false
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Create exact-source integration quality target
        working-directory: source
        env:
          QUALITY_TARGET: ${{ github.workspace }}/source/.quality/targets/quality-target-integration.md
          B35_HEAD: ${{ needs.restore-production-authority-boundary.outputs.b35_sha }}
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B scripts/create_ci_quality_target.py \
            --output "${QUALITY_TARGET}" \
            --ref "b35-deterministic-integration-${B35_HEAD:0:16}" \
            --workflow quality-integration \
            --claims-source governance/claims/v20.6.2-project-integration-certification.json

      - name: Start deterministic model and both services
        working-directory: source
        env:
          APP_PROFILE: local
          PYTHONDONTWRITEBYTECODE: '1'
          OPENAI_API_KEY: deterministic-ci-key
          OPENAI_API_BASE: http://127.0.0.1:18081/v1
          OPENAI_MODEL: deterministic-ci-model
          BUSINESS_SERVICE_TOKEN: dev-service-token
          BUSINESS_REQUIRE_ACTOR_SIGNATURE: 'false'
          BUSINESS_SEED_DEMO_DATA: 'true'
          BUSINESS_SERVICE_RELOAD: 'false'
          AGENT_SERVICE_RELOAD: 'false'
          WEB_CONSOLE_DEV_LOGIN: 'true'
          AGENT_REQUIRE_AUTH: 'true'
          AGENT_AUTH_PROVIDER: dev_token
          RAG_BACKEND: local_sparse
          AGENT_DB_BACKEND: sqlite
          CHECKPOINT_BACKEND: sqlite
          SQLITE_DB_PATH: ${{ runner.temp }}/agent.db
          CHECKPOINT_DB_PATH: ${{ runner.temp }}/checkpoints.db
          BUSINESS_DB_PATH: ${{ runner.temp }}/business.db
        run: |
          set -euo pipefail
          services/agent-service/.venv/bin/python -m uvicorn tests.integration.model_stub:app --app-dir services/agent-service --host 127.0.0.1 --port 18081 > "${RUNNER_TEMP}/model-stub.log" 2>&1 &
          services/business-service/.venv/bin/python services/business-service/scripts/run_business_api.py > "${RUNNER_TEMP}/business.log" 2>&1 &
          services/agent-service/.venv/bin/python services/agent-service/scripts/run_api.py > "${RUNNER_TEMP}/agent.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:9000/health >/dev/null && curl --fail --silent http://127.0.0.1:8000/health >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat "${RUNNER_TEMP}/model-stub.log" || true
          cat "${RUNNER_TEMP}/business.log" || true
          cat "${RUNNER_TEMP}/agent.log" || true
          exit 1

      - name: Run exact-source deterministic integration quality gates
        working-directory: source
        env:
          APP_PROFILE: local
          PYTHONDONTWRITEBYTECODE: '1'
          OPENAI_API_KEY: deterministic-ci-key
          OPENAI_API_BASE: http://127.0.0.1:18081/v1
          OPENAI_MODEL: deterministic-ci-model
          BUSINESS_SERVICE_BASE_URL: http://127.0.0.1:9000
          BUSINESS_SERVICE_TOKEN: dev-service-token
          AGENT_TEST_URL: http://127.0.0.1:8000
          BUSINESS_TEST_URL: http://127.0.0.1:9000
          PRODUCT_HTTP_SMOKE_EPHEMERAL_DATA: 'true'
          AGENT_TEST_POSTGRES_URL: postgresql+psycopg://agent:agent-test-password@127.0.0.1:5432/agent_test
          QUALITY_EVIDENCE_DIR: ${{ runner.temp }}/quality-evidence/b35-exact-integration
          QUALITY_TARGET: ${{ github.workspace }}/source/.quality/targets/quality-target-integration.md
          QUALITY_POLICY: ${{ runner.temp }}/b35-deterministic-integration-policy.json
        run: >-
          services/agent-service/.venv/bin/python -B scripts/quality_loop.py
          --policy "$QUALITY_POLICY" --mode integration --target "$QUALITY_TARGET"

      - name: Upload exact-source integration evidence and service logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: b35-exact-source-deterministic-integration-evidence
          path: |
            ${{ runner.temp }}/quality-evidence/b35-exact-integration
            ${{ runner.temp }}/b35-deterministic-integration-policy.json
            ${{ runner.temp }}/model-stub.log
            ${{ runner.temp }}/business.log
            ${{ runner.temp }}/agent.log
            ${{ github.workspace }}/source/.quality/targets/quality-target-integration.md
            ${{ github.workspace }}/source/.quality/targets/quality-target-integration.claims.json
            ${{ runner.temp }}/quality-toolchain-b35-exact-integration.json
          if-no-files-found: warn
          retention-days: 14
