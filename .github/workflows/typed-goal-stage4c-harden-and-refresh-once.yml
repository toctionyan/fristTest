name: typed-goal-stage4c-harden-and-refresh-once

on:
  push:
    branches:
      - feat/typed-goal-graph-foundation-20260814

permissions:
  contents: write
  actions: write

jobs:
  harden-and-refresh:
    runs-on: ubuntu-24.04
    if: github.repository == 'toctionyan/fristTest'
    steps:
      - name: Checkout branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          ref: feat/typed-goal-graph-foundation-20260814

      - name: Verify exact pre-hardening branch state
        env:
          EXPECTED_BASE_SHA: 6ff872a0d002f7abba49fa5f7cf56ae8103dcdb5
        run: |
          python - <<'PY'
          import os
          import subprocess

          base = os.environ["EXPECTED_BASE_SHA"]
          subprocess.run(["git", "merge-base", "--is-ancestor", base, "HEAD"], check=True)
          changed = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", f"{base}..HEAD"], text=True
              ).splitlines()
          )
          expected = {
              ".github/typed_goal_stage4c_harden_helper.py",
              ".github/workflows/typed-goal-stage4c-harden-and-refresh-once.yml",
          }
          if changed != expected:
              raise SystemExit(f"unexpected_pre_hardening_diff:{sorted(changed)!r}")
          PY

      - name: Harden exact Stage4C handoff invariants
        run: python .github/typed_goal_stage4c_harden_helper.py harden

      - name: Commit hardened protected source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            services/agent-service/src/agent_core/goal_graph/handoff_simulation.py \
            services/agent-service/tests/runtime/test_typed_goal_dependency_handoff_simulation.py
          git diff --cached --check
          git commit -m "Harden Stage4C handoff timeline invariants"
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Refresh protected baseline against hardened source
        run: python .github/typed_goal_stage4c_harden_helper.py refresh

      - name: Verify refreshed baseline contract
        run: python skill-system/tests/test_product_source_baseline_binding.py

      - name: Commit refreshed baseline and remove one-shot helpers
        run: |
          git rm \
            .github/typed_goal_stage4c_harden_helper.py \
            .github/workflows/typed-goal-stage4c-harden-and-refresh-once.yml
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m "Refresh hardened Stage4C protected baseline"
          git push origin HEAD:feat/typed-goal-graph-foundation-20260814

      - name: Dispatch final quality verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for workflow in quality.yml skill-self-validation.yml; do
            curl --fail-with-body -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -d '{"ref":"feat/typed-goal-graph-foundation-20260814"}'
          done
