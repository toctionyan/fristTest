name: stage42-repair-feedback-compat

on:
  pull_request:
    branches:
      - fix/dependency-proof-authority-reducer-20260816
    paths:
      - scripts/stage42_repair_feedback_compat_patch.py
      - .github/workflows/stage42-repair-feedback-compat.yml

permissions:
  contents: write
  pull-requests: read

jobs:
  patch-permitted-product-paths:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Assert active permit and apply diagnostic compatibility repair
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B scripts/stage42_repair_feedback_compat_patch.py --workspace .
          "${pythonLocation}/bin/python" -m py_compile \
            services/agent-service/src/agent_core/goal_graph/dependency_alignment.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py
          git diff --check -- \
            services/agent-service/src/agent_core/goal_graph/dependency_alignment.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py

      - name: Commit only permitted product paths
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          bridge="services/agent-service/src/agent_core/goal_graph/dependency_alignment.py"
          planner="services/agent-service/src/agent_core/lifecycle/goal_planning.py"
          git add "$bridge" "$planner"
          if git diff --cached --quiet; then
            echo "Compatibility repair already present."
            exit 0
          fi
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n%s\n' "$bridge" "$planner" | sort)"
          test "$actual" = "$expected"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Stage 4.2: preserve pair-observation repair feedback"
          git push origin "HEAD:${HEAD_REF}"
