name: wp08-attempt7-repair-merge-replay

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read
  actions: read
  issues: write
  pull-requests: read

jobs:
  replay:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt7-repair-merge-replay-20260811'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repaired main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: 91b06d66a4efbadd8da4ea3d3653341bbd9e4d02
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Fetch exact merged repair PR event
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "91b06d66a4efbadd8da4ea3d3653341bbd9e4d02"
          curl --fail-with-body --silent --show-error -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/486" \
            > "${RUNNER_TEMP}/pr.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          pr=json.loads((root/'pr.json').read_text())
          assert pr.get('number') == 486, pr
          assert pr.get('merged') is True, pr
          assert (pr.get('base') or {}).get('ref') == 'main', pr
          assert pr.get('merge_commit_sha') == '91b06d66a4efbadd8da4ea3d3653341bbd9e4d02', pr
          body=str(pr.get('body') or '')
          assert 'WP08-Release-Run-ID: wp08-release-31388975089' in body, body
          assert 'WP08-Parent-Run-ID: 31448791975' in body, body
          (root/'event.json').write_text(json.dumps({'pull_request': pr}), encoding='utf-8')
          PY
      - name: Replay through repository coordinator
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >-
          python -B scripts/wp08_release_coordinator.py
          --mode pull-request --event-path "${RUNNER_TEMP}/event.json"
      - name: Verify durable ReleaseRun transition
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib import request
          req=request.Request(
              f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/454",
              headers={
                  'Accept':'application/vnd.github+json',
                  'Authorization':f"Bearer {os.environ['GITHUB_TOKEN']}",
                  'X-GitHub-Api-Version':'2022-11-28',
              },
          )
          with request.urlopen(req, timeout=30) as r:
              issue=json.load(r)
          body=str(issue.get('body') or '')
          block=body.split('<!-- WP08_RELEASE_RUN_STATE_BEGIN -->',1)[1].split('<!-- WP08_RELEASE_RUN_STATE_END -->',1)[0]
          state=json.loads(block.split('```json',1)[1].split('```',1)[0])
          assert state['current_candidate_sha'] == '91b06d66a4efbadd8da4ea3d3653341bbd9e4d02', state
          repair=state.get('repair_pr') or {}
          assert repair.get('number') == 486, state
          assert int(repair.get('parent_wp08_run_id') or 0) == 31448791975, state
          assert repair.get('merge_commit_sha') == '91b06d66a4efbadd8da4ea3d3653341bbd9e4d02', state
          assert state['production_closed'] is False, state
          assert state['attempt'] in {7,8}, state
          assert state['status'] in {'WAITING_FOR_REPAIR_CI','CERTIFYING'}, state
          if state['attempt'] == 8:
              assert state['status'] == 'CERTIFYING', state
              assert any(x.get('event') == 'wp08_dispatched' and int(x.get('attempt') or 0) == 8 for x in state.get('history', [])), state
          assert not any(x.get('event') == 'wp08_dispatched' and int(x.get('attempt') or 0) > 8 for x in state.get('history', [])), state
          print(json.dumps({'status':'PASS','attempt':state['attempt'],'release_state':state['status'],'candidate_sha':state['current_candidate_sha'],'current_wp08_run_id':state.get('current_wp08_run_id')}, sort_keys=True))
          PY
