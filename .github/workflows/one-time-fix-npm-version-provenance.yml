name: one-time-fix-npm-version-provenance

"on":
  push:
    branches:
      - agent/fix-npm-version-provenance

permissions:
  contents: write

jobs:
  apply-fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Apply exact npm version provenance repair
        run: python -B .github/scripts/apply_npm_version_provenance_fix.py
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused counterexamples
        run: >-
          python -m pytest -q
          services/agent-service/tests/runtime/test_release_toolchain_npm_version_provenance.py
          services/agent-service/tests/runtime/test_release_toolchain_npm_diagnostics.py
      - name: Verify real hosted npm installation identity
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import shutil
          import sys

          root = Path.cwd()
          path = root / "scripts/release_toolchain_contract.py"
          spec = importlib.util.spec_from_file_location("release_toolchain_contract_live_npm_version", path)
          assert spec is not None and spec.loader is not None
          module = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = module
          spec.loader.exec_module(module)
          npm = Path(shutil.which("npm") or "").resolve()
          identity = module._npm_installation_identity(npm)
          assert identity["version"] == "11.16.0", identity
          assert len(str(identity["package_json_sha256"])) == 64
          assert len(str(identity["content_tree_sha256"])) == 64
          print(identity)
          PY
      - name: Compile modified Python files
        run: >-
          python -m py_compile
          scripts/release_toolchain_contract.py
          services/agent-service/tests/runtime/test_release_toolchain_npm_version_provenance.py
      - name: Remove one-time applicator and commit result
        shell: bash
        run: |
          rm -f .github/scripts/apply_npm_version_provenance_fix.py
          rm -f .github/workflows/one-time-fix-npm-version-provenance.yml
          find scripts services/agent-service/tests -type d -name __pycache__ -prune -exec rm -rf {} +
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Strengthen npm version provenance"
          git push origin HEAD:${GITHUB_REF_NAME}
