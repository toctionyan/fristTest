services:
  agent-postgres:
    image: pgvector/pgvector:pg16
    container_name: ${AGENT_POSTGRES_CONTAINER_NAME:-customer-agent-postgres}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-agent_db}
      POSTGRES_USER: ${POSTGRES_USER:-agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deployment/.env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agent_pgvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-agent} -d ${POSTGRES_DB:-agent_db}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  agent_pgvector_data:
