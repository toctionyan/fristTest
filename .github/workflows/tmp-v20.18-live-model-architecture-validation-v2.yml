name: temporary-v20.18-live-model-architecture-validation-v2

on:
  push:
    branches:
      - validation/v20.18-live-model-architecture-closure-20260813

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OPENAI_API_KEY: ${{ secrets.PRODUCTION_MODEL_API_KEY }}
      CONFIG_MODEL_PROVIDER: ${{ vars.REAL_MODEL_CERTIFICATION_PROVIDER || vars.PRODUCTION_MODEL_PROVIDER || vars.MODEL_PROVIDER }}
      CONFIG_MODEL_ID: ${{ vars.OPENAI_MODEL || vars.PRODUCTION_MODEL_ID || vars.MODEL_ID }}
      CONFIG_MODEL_API_BASE: ${{ vars.OPENAI_API_BASE || vars.PRODUCTION_MODEL_API_BASE || vars.MODEL_API_BASE }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent and Business environments
        run: |
          cd services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups
      - name: Resolve official model identity and credential availability
        run: |
          "${pythonLocation}/bin/python" -B - <<'PY'
          import json
          import os
          from pathlib import Path
          profile = json.loads(Path('deployment/ci/wp08-production-profile.json').read_text(encoding='utf-8'))
          if profile.get('contract') != 'wp08-production-profile@1':
              raise SystemExit('invalid versioned production profile')
          provider = str(os.environ.get('CONFIG_MODEL_PROVIDER') or profile.get('model_provider') or '').strip().casefold()
          model = str(os.environ.get('CONFIG_MODEL_ID') or profile.get('model_id') or '').strip()
          base = str(os.environ.get('CONFIG_MODEL_API_BASE') or profile.get('model_api_base') or '').strip().rstrip('/')
          if provider == 'openai' and base != 'https://api.openai.com/v1':
              raise SystemExit('OpenAI architecture validation must use official endpoint')
          if provider == 'deepseek' and base not in {'https://api.deepseek.com', 'https://api.deepseek.com/v1'}:
              raise SystemExit('DeepSeek architecture validation must use official endpoint')
          if provider not in {'openai', 'deepseek'}:
              raise SystemExit(f'unsupported provider: {provider!r}')
          if not model:
              raise SystemExit('protected model id is empty')
          if not os.environ.get('OPENAI_API_KEY'):
              raise SystemExit('PRODUCTION_MODEL_API_KEY is not available outside production-certification environment')
          with Path(os.environ['GITHUB_ENV']).open('a', encoding='utf-8') as handle:
              handle.write(f'REAL_MODEL_CERTIFICATION_PROVIDER={provider}\n')
              handle.write(f'OPENAI_MODEL={model}\n')
              handle.write(f'OPENAI_API_BASE={base}\n')
          print(json.dumps({'provider': provider, 'model': model, 'endpoint': base, 'credential_present': True}))
          PY
      - name: Run architecture adversarial matrix through public Lifecycle
        run: |
          services/agent-service/.venv/bin/python -B - <<'PY'
          from __future__ import annotations
          import json
          import os
          import sqlite3
          import sys
          from pathlib import Path
          from uuid import uuid4

          root = Path('.').resolve()
          for path in (root / 'services/agent-service/src', root / 'services/agent-service/scripts', root / 'scripts'):
              sys.path.insert(0, str(path))
          from agent_core.model_calls import resolve_real_model_identity
          from verify_full_lifecycle_canary import ProductRuntimeHarness
          from verify_preprod_full_lifecycle import _attest_lifecycle_model_calls, _call, _graph_diagnostics, _token, _transaction_ids

          def latest_state(database: Path) -> dict:
              with sqlite3.connect(database) as connection:
                  row = connection.execute("SELECT output_json FROM trace_logs WHERE event_type='graph_snapshot' ORDER BY id DESC LIMIT 1").fetchone()
              if not row:
                  raise RuntimeError('missing graph snapshot')
              payload = json.loads(row[0] or '{}')
              state = payload.get('state') if isinstance(payload.get('state'), dict) else payload
              if not isinstance(state, dict):
                  raise RuntimeError('invalid graph snapshot state')
              return state

          def require_answer(response: object, label: str) -> dict:
              if not isinstance(response, dict) or response.get('type') != 'answer':
                  raise RuntimeError(f'{label}: expected answer, got {response!r}')
              return response

          def names(state: dict) -> list[str]:
              return [str(row.get('name') or '') for row in list(state.get('tool_trace') or []) if isinstance(row, dict) and str(row.get('name') or '')]

          harness = ProductRuntimeHarness(deterministic_model=False)
          harness.env.update({
              'CAPABILITY_SEMANTIC_VERIFIER_MODE': 'model',
              'GOAL_ALIGNMENT_VERIFIER_MODE': 'model',
              'GOAL_GRANULARITY_VERIFIER_MODE': 'model',
              'ANSWER_RELEASE_ALIGNMENT_VERIFIER_MODE': 'model',
          })
          identity = resolve_real_model_identity(harness.env)
          evidence = {
              'contract': 'v20.18-live-model-architecture-matrix@1',
              'source_sha': os.environ.get('GITHUB_SHA'),
              'identity': {key: identity.get(key) for key in ('provider', 'endpoint', 'model', 'credential_fingerprint_sha256_16')},
              'scenarios': [],
          }
          with harness:
              base = harness.agent_url
              token = _token(base, harness.env)
              database = harness.runtime_dir / 'agent.db'
              before = _transaction_ids(_call(base, '/api/transactions', token=token))

              thread = f'v2018-courier-only-{uuid4().hex}'
              require_answer(_call(base, '/api/chat/turn', method='POST', token=token, body={'thread_id': thread, 'message': '快递员电话是多少？'}), 'unsupported-courier-phone')
              state = latest_state(database)
              trace = names(state)
              if 'report_unsupported_request' not in trace or 'get_order_logistics' in trace:
                  raise RuntimeError(f'unsupported-courier-phone authority failure: {trace}')
              evidence['scenarios'].append({'id': 'unsupported-courier-phone', 'status': 'PASS', 'tool_names': trace, 'model_attestation': _attest_lifecycle_model_calls(diagnostics=_graph_diagnostics(database), identity=identity, turn_index=1)})

              thread = f'v2018-mixed-{uuid4().hex}'
              require_answer(_call(base, '/api/chat/turn', method='POST', token=token, body={'thread_id': thread, 'message': '查一下鼠标物流，再告诉我快递员手机号'}), 'supported-plus-unsupported')
              state = latest_state(database)
              trace = names(state)
              missing = [name for name in ('get_order_logistics', 'report_unsupported_request') if name not in trace]
              if missing:
                  raise RuntimeError(f'supported-plus-unsupported missing branches {missing}: {trace}')
              evidence['scenarios'].append({'id': 'supported-plus-unsupported', 'status': 'PASS', 'tool_names': trace, 'model_attestation': _attest_lifecycle_model_calls(diagnostics=_graph_diagnostics(database), identity=identity, turn_index=1)})

              thread = f'v2018-historical-{uuid4().hex}'
              require_answer(_call(base, '/api/chat/turn', method='POST', token=token, body={'thread_id': thread, 'message': '查一下机械键盘订单'}), 'historical-seed')
              require_answer(_call(base, '/api/chat/turn', method='POST', token=token, body={'thread_id': thread, 'message': '查一下它的物流'}), 'historical-followup')
              state = latest_state(database)
              rows = [row for row in list(state.get('tool_trace') or []) if isinstance(row, dict) and row.get('name') == 'get_order_logistics']
              if not rows:
                  raise RuntimeError(f'historical-followup logistics missing: {names(state)}')
              row = rows[-1]
              authority = row.get('compiled_runtime_target') if isinstance(row.get('compiled_runtime_target'), dict) else {}
              binding = authority.get('binding') if isinstance(authority.get('binding'), dict) else {}
              projected = authority.get('projected_target') if isinstance(authority.get('projected_target'), dict) else {}
              args = row.get('args') if isinstance(row.get('args'), dict) else {}
              member = str(binding.get('member_handle') or '')
              if authority.get('status') != 'COMPILED':
                  raise RuntimeError(f'historical target not compiled: {authority!r}')
              if authority.get('model_target_selection_authority') is not False or authority.get('execution_authority_granted') is not False:
                  raise RuntimeError(f'historical authority boundary invalid: {authority!r}')
              if not member or projected.get('left_handle') != member or args.get('target') != projected:
                  raise RuntimeError(f'historical projected target mismatch: args={args!r}, authority={authority!r}')
              if not isinstance(row.get('result'), dict) or row['result'].get('ok') is not True:
                  raise RuntimeError(f'historical compiled dispatch failed: {row.get("result")!r}')
              evidence['scenarios'].append({'id': 'historical-single-member-runtime-target-authority', 'status': 'PASS', 'tool_names': names(state), 'target_authority': {'status': authority.get('status'), 'reason_code': authority.get('reason_code'), 'candidate_target_replaced': authority.get('candidate_target_replaced'), 'model_target_selection_authority': authority.get('model_target_selection_authority'), 'execution_authority_granted': authority.get('execution_authority_granted'), 'binding_member_present': bool(member), 'dispatcher_received_projected_target': args.get('target') == projected}, 'model_attestation': _attest_lifecycle_model_calls(diagnostics=_graph_diagnostics(database), identity=identity, turn_index=2)})

              after = _transaction_ids(_call(base, '/api/transactions', token=token))
              if after != before:
                  raise RuntimeError('live architecture matrix changed transaction state')

          evidence['status'] = 'PASS'
          evidence['transaction_delta'] = 0
          Path('/tmp/v20.18-live-model-architecture-matrix.json').write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(evidence, ensure_ascii=False))
          PY
      - name: Upload architecture matrix evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: v20.18-live-model-architecture-matrix-${{ github.run_id }}
          path: /tmp/v20.18-live-model-architecture-matrix.json
          retention-days: 30
          if-no-files-found: warn
      - name: Remove temporary validation workflow
        if: always()
        run: |
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-v20.18-live-model-architecture-validation-v2.yml
          git commit -m 'Remove temporary V20.18 live-model architecture validation v2 workflow'
          git push origin HEAD:validation/v20.18-live-model-architecture-closure-20260813
