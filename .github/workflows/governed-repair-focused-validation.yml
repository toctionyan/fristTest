name: governed-repair-focused-validation

on:
  push:
    branches:
      - architecture/governed-repair-rca-write-grant-20260816
    paths:
      - .github/workflows/governed-repair-focused-validation.yml

permissions:
  contents: read

jobs:
  focused-validation:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: architecture/governed-repair-rca-write-grant-20260816
          persist-credentials: false
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent validation environment
        run: |
          set -euo pipefail
          cd services/agent-service
          uv sync --locked --all-groups
      - name: Verify governed-repair architecture and mutation kill proof
        run: |
          set -euo pipefail
          before=$(git status --porcelain=v1 --untracked-files=all)
          services/agent-service/.venv/bin/python -B scripts/verify_governed_repair_architecture.py
          services/agent-service/.venv/bin/python -B scripts/verify_governed_repair_mutation_proof.py
          after=$(git status --porcelain=v1 --untracked-files=all)
          [[ "${before}" == "${after}" ]]
      - name: Run focused Skill control-plane tests
        run: |
          set -euo pipefail
          services/agent-service/.venv/bin/python -B -m unittest -v \
            skill-system/tests/test_governed_repair_architecture_verifier.py \
            skill-system/tests/test_github_repair_stage3.py \
            skill-system/tests/test_github_repair_governance.py
      - name: Run protected mutation-proof test
        run: |
          set -euo pipefail
          services/agent-service/.venv/bin/python -B -m pytest -q \
            services/agent-service/tests/architecture/test_governed_repair_mutation_proof.py
      - name: Assert validation workspace remained clean
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
