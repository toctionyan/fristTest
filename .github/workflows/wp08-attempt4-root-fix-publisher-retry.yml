name: wp08-attempt4-root-fix-publisher-retry

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  publish:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt4-root-fix-publisher-retry-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout formal repair branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: agent/wp08-attempt4-root-fixes-20260810
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Extract and apply reviewed patch program
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/wp08-attempt4-root-fix-publisher.yml').read_text(encoding='utf-8')
          marker = "          python - <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY\n", start)
          raw = workflow[start:end]
          lines = raw.splitlines()
          patch = "\n".join(line[10:] if line.startswith("          ") else line for line in lines) + "\n"
          Path('/tmp/wp08_attempt4_apply.py').write_text(patch, encoding='utf-8')
          print(f'extracted_patch_bytes={len(patch.encode("utf-8"))}')
          PY
          python /tmp/wp08_attempt4_apply.py
          git diff --check
      - name: Run focused Attempt 4 regression gates
        shell: bash
        run: |
          set -euo pipefail
          cd services/agent-service
          PYTHONPATH=src .venv/bin/python -B -m pytest -q \
            tests/runtime/test_wp08_attempt4_release_repairs.py \
            tests/context/test_reference_resolution_contract.py \
            tests/runtime/test_goal_granularity_and_conditions.py
          cd ../..
          PYTHONPATH=services/agent-service/src services/agent-service/.venv/bin/python -B skill-system/tests/test_wp08_new_release_attempt3_root_fixes.py
          PYTHONPATH=services/agent-service/src services/agent-service/.venv/bin/python -B -m pytest -q \
            services/agent-service/tests/context/test_semantic_goal_coverage_suite_execution.py \
            services/agent-service/tests/runtime/test_semantic_reference_binding.py
      - name: Commit focused-green product repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/agent-service/src/agent_core/context/reference_resolution.py \
            services/agent-service/src/agent_core/lifecycle/goal_granularity.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/lifecycle/protocol.py \
            services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py \
            services/agent-service/scripts/verify_preprod_conversation_smoke.py \
            services/agent-service/tests/runtime/test_wp08_attempt4_release_repairs.py
          git commit -m 'fix: close Attempt 4 dependency and historical member alias boundaries'
      - name: Regenerate exact protected baseline, remove old publisher, and push formal branch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('.').resolve()
          path = root / 'skill-system/registry/product-source-baseline.json'
          previous = json.loads(path.read_text(encoding='utf-8'))
          roots = ['services', 'web', 'contracts']
          raw = subprocess.check_output(['git','ls-files','-z','--',*roots], cwd=root)
          tracked = sorted(x.decode('utf-8') for x in raw.split(b'\0') if x)
          files = {rel: hashlib.sha256((root / rel).read_bytes()).hexdigest() for rel in tracked}
          head = subprocess.check_output(['git','rev-parse','HEAD'], cwd=root, text=True).strip()
          payload = {
              'schema_version': int(previous.get('schema_version') or 2),
              'generated_from': f'git:{head}',
              'source_release_sha256': str(previous.get('source_release_sha256') or ''),
              'generated_at': datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z'),
              'protected_roots': roots,
              'file_count': len(files),
              'files': files,
          }
          if any(len(v) != 64 for v in files.values()):
              raise SystemExit('invalid protected sha256')
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
          rm .github/workflows/wp08-attempt4-root-fix-publisher.yml
          git diff --check
          git add skill-system/registry/product-source-baseline.json .github/workflows/wp08-attempt4-root-fix-publisher.yml
          git commit -m 'chore: bind Attempt 4 repair to exact protected baseline'
          git push origin HEAD:agent/wp08-attempt4-root-fixes-20260810
