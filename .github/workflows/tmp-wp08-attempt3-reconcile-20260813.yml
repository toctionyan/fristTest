name: tmp-wp08-attempt3-reconcile-20260813

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize

permissions:
  actions: write
  contents: read

jobs:
  dispatch-reconcile:
    if: github.event.pull_request.head.ref == 'ops/wp08-attempt3-reconcile-20260813'
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch WP-08 coordinator reconcile on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO}/actions/workflows/wp08-release-coordinator.yml/dispatches" \
            -d '{"ref":"main","inputs":{"operation":"reconcile"}}'
