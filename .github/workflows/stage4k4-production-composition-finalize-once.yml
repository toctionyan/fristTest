name: stage4k4-production-composition-finalize-once

on:
  push:
    branches:
      - feat/stage4k4-production-composition-disabled-20260814

permissions:
  contents: write
  actions: write

jobs:
  implement-validate-refresh-finalize:
    runs-on: ubuntu-24.04
    if: github.repository == 'toctionyan/fristTest'
    steps:
      - name: Checkout Stage4K4 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: feat/stage4k4-production-composition-disabled-20260814

      - name: Verify exact Stage4K3 base and one-shot-only prestate
        env:
          BASE_SHA: d6ba4b034bb677ddadc817f599dc3a536b976d12
          WORKFLOW_PATH: .github/workflows/stage4k4-production-composition-finalize-once.yml
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "${BASE_SHA}" HEAD
          mapfile -t changed < <(git diff --name-only "${BASE_SHA}..HEAD")
          if [ "${#changed[@]}" -ne 1 ] || [ "${changed[0]}" != "${WORKFLOW_PATH}" ]; then
            printf 'unexpected prestate paths:\n%s\n' "${changed[*]}"
            exit 1
          fi
          git diff --quiet "${BASE_SHA}..HEAD" -- services web contracts skill-system governance

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Apply bounded Stage4K4 production-composition mutation
        run: |
          python - <<'PY'
          from __future__ import annotations

          from pathlib import Path
          from textwrap import dedent

          root = Path.cwd()

          def replace_once(relative: str, old: str, new: str) -> None:
              path = root / relative
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"replace_once_mismatch:{relative}:{count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          composition_path = root / "services/agent-service/app/services/dependency_authority_composition.py"
          if composition_path.exists():
              raise SystemExit("composition_path_must_be_new")
          composition_path.write_text(dedent(r'''
          from __future__ import annotations

          """Application-owned Stage4K4 dependency-authority composition.

          The customer-serving default is deliberately ``disabled``.  Selecting
          ``persistent`` is an explicit startup-time composition choice; it never
          follows database contents automatically and environment changes after
          process construction cannot switch authority in-place.

          Production verification uses Ed25519 public keys only.  Signing private
          keys remain outside the Agent process.  The activation governance key and
          emergency rollback key must be distinct trust roots.
          """

          import base64
          import binascii
          import os
          from dataclasses import dataclass
          from hashlib import sha256
          from time import time
          from typing import Any, Callable

          from cryptography.exceptions import InvalidSignature
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey

          from agent_core.runtime.dependency_authority_control import (
              DependencyAuthorityControlProvider,
              DisabledDependencyAuthorityControlProvider,
          )
          from agent_core.runtime.dependency_authority_persistent_control import (
              PersistentDependencyAuthorityControlProvider,
              SqlAlchemyDependencyAuthorityRollbackDirectiveSource,
              SqlAlchemyDependencyAuthoritySignedRecordSource,
          )


          DEPENDENCY_AUTHORITY_CONTROL_MODE_ENV = "DEPENDENCY_AUTHORITY_CONTROL_MODE"
          DEPENDENCY_AUTHORITY_ED25519_SIGNATURE_SCHEME = "ed25519-v1"
          _CONTROL_MODES = {"disabled", "persistent"}


          class DependencyAuthorityCompositionError(RuntimeError):
              """Startup configuration cannot safely compose the requested authority."""


          class _Ed25519Verifier:
              def __init__(
                  self,
                  *,
                  expected_identity: str,
                  public_key: Ed25519PublicKey,
              ) -> None:
                  self._expected_identity = expected_identity
                  self._public_key = public_key

              def _verify(
                  self,
                  *,
                  identity: str,
                  signature_scheme: str,
                  message: bytes,
                  signature: str,
              ) -> bool:
                  if identity != self._expected_identity:
                      return False
                  if signature_scheme != DEPENDENCY_AUTHORITY_ED25519_SIGNATURE_SCHEME:
                      return False
                  if not isinstance(message, (bytes, bytearray)):
                      return False
                  try:
                      encoded = str(signature or "").encode("ascii")
                      signature_bytes = base64.b64decode(encoded, validate=True)
                  except (UnicodeEncodeError, ValueError, binascii.Error):
                      return False
                  if len(signature_bytes) != 64:
                      return False
                  try:
                      self._public_key.verify(signature_bytes, bytes(message))
                  except (InvalidSignature, ValueError):
                      return False
                  return True


          class Ed25519DependencyAuthorityActivationVerifier(_Ed25519Verifier):
              def verify(
                  self,
                  *,
                  signer_id: str,
                  signature_scheme: str,
                  message: bytes,
                  signature: str,
              ) -> bool:
                  return self._verify(
                      identity=signer_id,
                      signature_scheme=signature_scheme,
                      message=message,
                      signature=signature,
                  )


          class Ed25519DependencyAuthorityRollbackVerifier(_Ed25519Verifier):
              def verify(
                  self,
                  *,
                  operator_id: str,
                  signature_scheme: str,
                  message: bytes,
                  signature: str,
              ) -> bool:
                  return self._verify(
                      identity=operator_id,
                      signature_scheme=signature_scheme,
                      message=message,
                      signature=signature,
                  )


          @dataclass(frozen=True)
          class DependencyAuthorityControlComposition:
              mode: str
              provider: DependencyAuthorityControlProvider
              activation_public_key_fingerprint: str | None = None
              rollback_public_key_fingerprint: str | None = None

              def diagnostics(self) -> dict[str, Any]:
                  persistent = self.mode == "persistent"
                  return {
                      "mode": self.mode,
                      "provider": self.provider.__class__.__name__,
                      "default_disabled": self.mode == "disabled",
                      "persistent_provider_wired": persistent,
                      "signature_scheme": (
                          DEPENDENCY_AUTHORITY_ED25519_SIGNATURE_SCHEME
                          if persistent
                          else None
                      ),
                      "activation_public_key_fingerprint": (
                          self.activation_public_key_fingerprint
                      ),
                      "rollback_public_key_fingerprint": (
                          self.rollback_public_key_fingerprint
                      ),
                      "trust_roots_independent": bool(
                          persistent
                          and self.activation_public_key_fingerprint
                          and self.rollback_public_key_fingerprint
                          and self.activation_public_key_fingerprint
                          != self.rollback_public_key_fingerprint
                      ),
                      "owns_model_configuration": False,
                      "creates_permit": False,
                      "dispatches_tools": False,
                      "mutates_business_state": False,
                  }


          def resolve_dependency_authority_control_mode() -> str:
              raw = (os.getenv(DEPENDENCY_AUTHORITY_CONTROL_MODE_ENV) or "disabled").strip().lower()
              if raw not in _CONTROL_MODES:
                  raise DependencyAuthorityCompositionError(
                      f"{DEPENDENCY_AUTHORITY_CONTROL_MODE_ENV} must be disabled or persistent"
                  )
              return raw


          def _required_setting(name: str, *, limit: int) -> str:
              value = (os.getenv(name) or "").strip()
              if not value:
                  raise DependencyAuthorityCompositionError(f"{name} is required in persistent mode")
              if len(value) > limit:
                  raise DependencyAuthorityCompositionError(f"{name} exceeds the allowed length")
              return value


          def _ed25519_public_key(name: str) -> tuple[Ed25519PublicKey, str]:
              encoded = _required_setting(name, limit=512)
              try:
                  raw = base64.b64decode(encoded.encode("ascii"), validate=True)
              except (UnicodeEncodeError, ValueError, binascii.Error) as exc:
                  raise DependencyAuthorityCompositionError(
                      f"{name} must be canonical base64 for a raw Ed25519 public key"
                  ) from exc
              if len(raw) != 32:
                  raise DependencyAuthorityCompositionError(
                      f"{name} must decode to exactly 32 Ed25519 public-key bytes"
                  )
              try:
                  key = Ed25519PublicKey.from_public_bytes(raw)
              except ValueError as exc:
                  raise DependencyAuthorityCompositionError(
                      f"{name} is not a valid Ed25519 public key"
                  ) from exc
              return key, sha256(raw).hexdigest()


          def build_dependency_authority_control_composition(
              *,
              store_provider: Any,
              evaluation_time_resolver: Callable[[], float] | None = None,
          ) -> DependencyAuthorityControlComposition:
              """Compose once at process startup; never auto-activate from stored rows."""

              mode = resolve_dependency_authority_control_mode()
              if mode == "disabled":
                  return DependencyAuthorityControlComposition(
                      mode="disabled",
                      provider=DisabledDependencyAuthorityControlProvider(),
                  )

              engine = getattr(store_provider, "engine", None)
              sa = getattr(store_provider, "sa", None)
              if engine is None or sa is None:
                  raise DependencyAuthorityCompositionError(
                      "persistent dependency authority requires the shared SQLAlchemy StoreProvider"
                  )

              activation_signer_id = _required_setting(
                  "DEPENDENCY_AUTHORITY_ACTIVATION_SIGNER_ID",
                  limit=500,
              )
              rollback_operator_id = _required_setting(
                  "DEPENDENCY_AUTHORITY_ROLLBACK_OPERATOR_ID",
                  limit=500,
              )
              if activation_signer_id == rollback_operator_id:
                  raise DependencyAuthorityCompositionError(
                      "activation signer and rollback operator identities must be distinct"
                  )

              activation_key, activation_fingerprint = _ed25519_public_key(
                  "DEPENDENCY_AUTHORITY_ACTIVATION_PUBLIC_KEY_B64"
              )
              rollback_key, rollback_fingerprint = _ed25519_public_key(
                  "DEPENDENCY_AUTHORITY_ROLLBACK_PUBLIC_KEY_B64"
              )
              if activation_fingerprint == rollback_fingerprint:
                  raise DependencyAuthorityCompositionError(
                      "activation and rollback Ed25519 trust roots must be distinct"
                  )

              provider = PersistentDependencyAuthorityControlProvider(
                  activation_source=SqlAlchemyDependencyAuthoritySignedRecordSource(
                      engine=engine,
                      sa=sa,
                  ),
                  activation_signature_verifier=(
                      Ed25519DependencyAuthorityActivationVerifier(
                          expected_identity=activation_signer_id,
                          public_key=activation_key,
                      )
                  ),
                  rollback_source=SqlAlchemyDependencyAuthorityRollbackDirectiveSource(
                      engine=engine,
                      sa=sa,
                  ),
                  rollback_signature_verifier=(
                      Ed25519DependencyAuthorityRollbackVerifier(
                          expected_identity=rollback_operator_id,
                          public_key=rollback_key,
                      )
                  ),
                  evaluation_time_resolver=evaluation_time_resolver or time,
              )
              return DependencyAuthorityControlComposition(
                  mode="persistent",
                  provider=provider,
                  activation_public_key_fingerprint=activation_fingerprint,
                  rollback_public_key_fingerprint=rollback_fingerprint,
              )


          def dependency_authority_composition_readiness(
              composition: DependencyAuthorityControlComposition,
          ) -> dict[str, Any]:
              """Return a sanitized readiness view without exposing signed control records."""

              diagnostics = composition.diagnostics()
              if composition.mode == "disabled":
                  return {
                      **diagnostics,
                      "ready": True,
                      "status": "DISABLED_FAIL_CLOSED",
                      "trusted_control_available": False,
                  }

              try:
                  resolved = composition.provider.resolve()
              except Exception:
                  resolved = None
              if not isinstance(resolved, dict):
                  return {
                      **diagnostics,
                      "ready": False,
                      "status": "PERSISTENT_CONTROL_UNAVAILABLE_FAIL_CLOSED",
                      "trusted_control_available": False,
                  }

              rollback_requested = resolved.get("rollback_requested") is True
              return {
                  **diagnostics,
                  "ready": True,
                  "status": (
                      "PERSISTENT_ROLLBACK_ACTIVE"
                      if rollback_requested
                      else "PERSISTENT_CONTROL_VERIFIED"
                  ),
                  "trusted_control_available": True,
                  "has_activation_preflight": isinstance(
                      resolved.get("activation_preflight"), dict
                  ),
                  "has_runtime_activation": isinstance(
                      resolved.get("runtime_activation"), dict
                  ),
                  "rollback_requested": rollback_requested,
                  "control_head_identity": (
                      dict(resolved["control_head_identity"])
                      if isinstance(resolved.get("control_head_identity"), dict)
                      else None
                  ),
                  "rollback_head_identity": (
                      dict(resolved["rollback_head_identity"])
                      if isinstance(resolved.get("rollback_head_identity"), dict)
                      else None
                  ),
              }


          __all__ = [
              "DEPENDENCY_AUTHORITY_CONTROL_MODE_ENV",
              "DEPENDENCY_AUTHORITY_ED25519_SIGNATURE_SCHEME",
              "DependencyAuthorityCompositionError",
              "DependencyAuthorityControlComposition",
              "Ed25519DependencyAuthorityActivationVerifier",
              "Ed25519DependencyAuthorityRollbackVerifier",
              "build_dependency_authority_control_composition",
              "dependency_authority_composition_readiness",
              "resolve_dependency_authority_control_mode",
          ]
          ''').lstrip(), encoding="utf-8")

          test_path = root / "services/agent-service/tests/runtime/test_typed_goal_dependency_production_composition.py"
          if test_path.exists():
              raise SystemExit("production_composition_test_must_be_new")
          test_path.write_text(dedent(r'''
          from __future__ import annotations

          import base64
          import inspect
          import json
          from types import SimpleNamespace

          import pytest
          import sqlalchemy as sa
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PrivateKey
          from cryptography.hazmat.primitives.serialization import Encoding, PublicFormat

          import app.services.dependency_authority_composition as composition_module
          from app.services.dependency_authority_composition import (
              DEPENDENCY_AUTHORITY_ED25519_SIGNATURE_SCHEME,
              DependencyAuthorityCompositionError,
              build_dependency_authority_control_composition,
              dependency_authority_composition_readiness,
          )
          from agent_core.runtime.dependency_authority_control import (
              DisabledDependencyAuthorityControlProvider,
          )
          from agent_core.runtime.dependency_authority_persistent_control import (
              PersistentDependencyAuthorityControlProvider,
              build_dependency_authority_rollback_directive,
              dependency_authority_rollback_directive_signing_bytes,
          )
          from agent_core.runtime.dependency_authority_signed_provider import (
              build_dependency_authority_signed_record,
              dependency_authority_signed_record_signing_bytes,
          )


          def _private(seed_start: int) -> Ed25519PrivateKey:
              return Ed25519PrivateKey.from_private_bytes(
                  bytes(range(seed_start, seed_start + 32))
              )


          def _public_b64(private_key: Ed25519PrivateKey) -> str:
              raw = private_key.public_key().public_bytes(
                  Encoding.Raw,
                  PublicFormat.Raw,
              )
              return base64.b64encode(raw).decode("ascii")


          def _configure_persistent(monkeypatch, *, same_key: bool = False) -> tuple[Ed25519PrivateKey, Ed25519PrivateKey]:
              activation = _private(1)
              rollback = activation if same_key else _private(33)
              monkeypatch.setenv("DEPENDENCY_AUTHORITY_CONTROL_MODE", "persistent")
              monkeypatch.setenv(
                  "DEPENDENCY_AUTHORITY_ACTIVATION_SIGNER_ID",
                  "release-governance",
              )
              monkeypatch.setenv(
                  "DEPENDENCY_AUTHORITY_ACTIVATION_PUBLIC_KEY_B64",
                  _public_b64(activation),
              )
              monkeypatch.setenv(
                  "DEPENDENCY_AUTHORITY_ROLLBACK_OPERATOR_ID",
                  "emergency-operator",
              )
              monkeypatch.setenv(
                  "DEPENDENCY_AUTHORITY_ROLLBACK_PUBLIC_KEY_B64",
                  _public_b64(rollback),
              )
              return activation, rollback


          def _engine():
              engine = sa.create_engine("sqlite:///:memory:", future=True)
              with engine.begin() as connection:
                  connection.execute(sa.text("""
                      CREATE TABLE agent_dependency_authority_control_records (
                          control_epoch BIGINT PRIMARY KEY,
                          revision VARCHAR(500) NOT NULL UNIQUE,
                          snapshot_digest VARCHAR(128) NOT NULL UNIQUE,
                          record_json TEXT NOT NULL,
                          stored_at VARCHAR(64) NOT NULL
                      )
                  """))
                  connection.execute(sa.text("""
                      CREATE TABLE agent_dependency_authority_rollback_directives (
                          rollback_epoch BIGINT PRIMARY KEY,
                          revision VARCHAR(500) NOT NULL UNIQUE,
                          snapshot_digest VARCHAR(128) NOT NULL UNIQUE,
                          directive_json TEXT NOT NULL,
                          stored_at VARCHAR(64) NOT NULL
                      )
                  """))
              return engine


          def _activation_record(private_key: Ed25519PrivateKey):
              values = {
                  "provider_id": "governance-control-plane",
                  "revision": "control-rev-0007",
                  "control_epoch": 7,
                  "signer_id": "release-governance",
                  "signature_scheme": DEPENDENCY_AUTHORITY_ED25519_SIGNATURE_SCHEME,
                  "issued_at": 900.0,
                  "expires_at": 1200.0,
                  "signature": "placeholder",
                  "activation_preflight": {"preflight_digest": "b" * 64},
                  "runtime_activation": {"activation_digest": "c" * 64},
                  "rollback_requested": False,
              }
              unsigned = build_dependency_authority_signed_record(**values)
              values["signature"] = base64.b64encode(
                  private_key.sign(
                      dependency_authority_signed_record_signing_bytes(unsigned)
                  )
              ).decode("ascii")
              return build_dependency_authority_signed_record(**values)


          def _rollback_directive(private_key: Ed25519PrivateKey, *, requested: bool = True):
              values = {
                  "rollback_epoch": 2,
                  "revision": "rollback-rev-0002",
                  "operator_id": "emergency-operator",
                  "signature_scheme": DEPENDENCY_AUTHORITY_ED25519_SIGNATURE_SCHEME,
                  "issued_at": 950.0,
                  "rollback_requested": requested,
                  "reason_code": (
                      "operator-emergency-stop" if requested else "operator-clear"
                  ),
                  "signature": "placeholder",
              }
              unsigned = build_dependency_authority_rollback_directive(**values)
              values["signature"] = base64.b64encode(
                  private_key.sign(
                      dependency_authority_rollback_directive_signing_bytes(unsigned)
                  )
              ).decode("ascii")
              return build_dependency_authority_rollback_directive(**values)


          def _insert_activation(engine, record):
              with engine.begin() as connection:
                  connection.execute(
                      sa.text("""
                          INSERT INTO agent_dependency_authority_control_records
                              (control_epoch, revision, snapshot_digest, record_json, stored_at)
                          VALUES
                              (:control_epoch, :revision, :snapshot_digest, :record_json, :stored_at)
                      """),
                      {
                          "control_epoch": record["control_epoch"],
                          "revision": record["revision"],
                          "snapshot_digest": record["record_digest"],
                          "record_json": json.dumps(record, sort_keys=True),
                          "stored_at": "2026-08-14T18:18:00+08:00",
                      },
                  )


          def _insert_rollback(engine, directive):
              with engine.begin() as connection:
                  connection.execute(
                      sa.text("""
                          INSERT INTO agent_dependency_authority_rollback_directives
                              (rollback_epoch, revision, snapshot_digest, directive_json, stored_at)
                          VALUES
                              (:rollback_epoch, :revision, :snapshot_digest, :directive_json, :stored_at)
                      """),
                      {
                          "rollback_epoch": directive["rollback_epoch"],
                          "revision": directive["revision"],
                          "snapshot_digest": directive["directive_digest"],
                          "directive_json": json.dumps(directive, sort_keys=True),
                          "stored_at": "2026-08-14T18:18:00+08:00",
                      },
                  )


          def test_stage4k4_default_is_disabled_and_ignores_unused_trust_configuration(monkeypatch):
              monkeypatch.delenv("DEPENDENCY_AUTHORITY_CONTROL_MODE", raising=False)
              monkeypatch.setenv(
                  "DEPENDENCY_AUTHORITY_ACTIVATION_PUBLIC_KEY_B64",
                  "not-even-base64",
              )
              composition = build_dependency_authority_control_composition(
                  store_provider=object()
              )
              assert composition.mode == "disabled"
              assert isinstance(
                  composition.provider,
                  DisabledDependencyAuthorityControlProvider,
              )
              assert composition.provider.resolve() is None
              readiness = dependency_authority_composition_readiness(composition)
              assert readiness["ready"] is True
              assert readiness["status"] == "DISABLED_FAIL_CLOSED"
              assert readiness["trusted_control_available"] is False


          def test_stage4k4_mode_is_explicit_and_never_auto_selected_from_storage(monkeypatch):
              monkeypatch.setenv("DEPENDENCY_AUTHORITY_CONTROL_MODE", "auto")
              with pytest.raises(DependencyAuthorityCompositionError):
                  build_dependency_authority_control_composition(
                      store_provider=object()
                  )


          def test_stage4k4_persistent_mode_requires_shared_sqlalchemy_store(monkeypatch):
              _configure_persistent(monkeypatch)
              with pytest.raises(
                  DependencyAuthorityCompositionError,
                  match="shared SQLAlchemy StoreProvider",
              ):
                  build_dependency_authority_control_composition(
                      store_provider=object()
                  )


          def test_stage4k4_requires_independent_activation_and_rollback_trust_roots(monkeypatch):
              _configure_persistent(monkeypatch, same_key=True)
              engine = _engine()
              try:
                  with pytest.raises(
                      DependencyAuthorityCompositionError,
                      match="trust roots must be distinct",
                  ):
                      build_dependency_authority_control_composition(
                          store_provider=SimpleNamespace(engine=engine, sa=sa),
                          evaluation_time_resolver=lambda: 1000.0,
                      )
              finally:
                  engine.dispose()


          def test_stage4k4_persistent_composition_verifies_ed25519_activation_and_sanitizes_readiness(monkeypatch):
              activation_key, _rollback_key = _configure_persistent(monkeypatch)
              engine = _engine()
              try:
                  record = _activation_record(activation_key)
                  _insert_activation(engine, record)
                  composition = build_dependency_authority_control_composition(
                      store_provider=SimpleNamespace(engine=engine, sa=sa),
                      evaluation_time_resolver=lambda: 1000.0,
                  )
                  assert composition.mode == "persistent"
                  assert isinstance(
                      composition.provider,
                      PersistentDependencyAuthorityControlProvider,
                  )
                  resolved = composition.provider.resolve()
                  assert resolved == {
                      "activation_preflight": {"preflight_digest": "b" * 64},
                      "runtime_activation": {"activation_digest": "c" * 64},
                      "evaluation_time": 1000.0,
                      "rollback_requested": False,
                      "control_head_identity": {
                          "control_epoch": 7,
                          "revision": "control-rev-0007",
                          "snapshot_digest": record["record_digest"],
                      },
                      "rollback_head_identity": None,
                  }
                  readiness = dependency_authority_composition_readiness(composition)
                  assert readiness["ready"] is True
                  assert readiness["status"] == "PERSISTENT_CONTROL_VERIFIED"
                  assert readiness["has_activation_preflight"] is True
                  assert readiness["has_runtime_activation"] is True
                  assert "activation_preflight" not in readiness
                  assert "runtime_activation" not in readiness
                  assert "signature" not in str(readiness)
                  assert len(readiness["activation_public_key_fingerprint"]) == 64
                  assert len(readiness["rollback_public_key_fingerprint"]) == 64
                  assert readiness["trust_roots_independent"] is True
              finally:
                  engine.dispose()


          def test_stage4k4_verified_independent_rollback_composes_without_activation_record(monkeypatch):
              _activation_key, rollback_key = _configure_persistent(monkeypatch)
              engine = _engine()
              try:
                  directive = _rollback_directive(rollback_key, requested=True)
                  _insert_rollback(engine, directive)
                  composition = build_dependency_authority_control_composition(
                      store_provider=SimpleNamespace(engine=engine, sa=sa),
                      evaluation_time_resolver=lambda: 1000.0,
                  )
                  resolved = composition.provider.resolve()
                  assert resolved == {
                      "activation_preflight": None,
                      "runtime_activation": None,
                      "evaluation_time": None,
                      "rollback_requested": True,
                      "control_head_identity": None,
                      "rollback_head_identity": {
                          "rollback_epoch": 2,
                          "revision": "rollback-rev-0002",
                          "snapshot_digest": directive["directive_digest"],
                      },
                  }
                  readiness = dependency_authority_composition_readiness(composition)
                  assert readiness["ready"] is True
                  assert readiness["status"] == "PERSISTENT_ROLLBACK_ACTIVE"
                  assert readiness["rollback_requested"] is True
              finally:
                  engine.dispose()


          def test_stage4k4_invalid_or_untrusted_persistent_control_fails_readiness_closed(monkeypatch):
              _configure_persistent(monkeypatch)
              engine = _engine()
              try:
                  composition = build_dependency_authority_control_composition(
                      store_provider=SimpleNamespace(engine=engine, sa=sa),
                      evaluation_time_resolver=lambda: 1000.0,
                  )
                  readiness = dependency_authority_composition_readiness(composition)
                  assert readiness["ready"] is False
                  assert readiness["status"] == "PERSISTENT_CONTROL_UNAVAILABLE_FAIL_CLOSED"
                  assert readiness["trusted_control_available"] is False
              finally:
                  engine.dispose()


