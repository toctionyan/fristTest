name: release55-product-red

on:
  pull_request:
    branches:
      - main
    paths:
      - services/agent-service/tests/runtime/test_release55_dependency_output_role_overlap.py
      - .github/workflows/release55-product-red.yml

permissions:
  contents: read

jobs:
  focused-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Confirm focused product test is RED for the intended structural reason
        env:
          PYTHONPATH: ${{ github.workspace }}/services/agent-service/src:${{ github.workspace }}/services/agent-service
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          set -euo pipefail
          cd services/agent-service
          set +e
          .venv/bin/python -B -m pytest -q tests/runtime/test_release55_dependency_output_role_overlap.py > "${RUNNER_TEMP}/release55-product-red.log" 2>&1
          rc=$?
          set -e
          cat "${RUNNER_TEMP}/release55-product-red.log"
          test "$rc" -ne 0
          grep -F "goal_alignment_dependency_basis_is_requested_output:0" "${RUNNER_TEMP}/release55-product-red.log"
          grep -F "test_strict_nested_relation_basis_reaches_dependency_graph_adjudication" "${RUNNER_TEMP}/release55-product-red.log"
          if grep -F "ModuleNotFoundError" "${RUNNER_TEMP}/release55-product-red.log"; then
            echo "invalid RED: import/environment failure" >&2
            exit 1
          fi
          echo "VALID_PRODUCT_RED"
      - name: Upload focused RED log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release55-product-red-${{ github.sha }}
          path: ${{ runner.temp }}/release55-product-red.log
          if-no-files-found: error
