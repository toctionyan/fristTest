name: Parameterized Permit Baseline Refresh Once

on:
  push:
    branches:
      - fix/parameterized-permit-test-verifier-isolation-20260815
    paths:
      - .github/workflows/parameterized-permit-baseline-refresh-once.yml

permissions:
  contents: write

concurrency:
  group: parameterized-permit-baseline-refresh-once
  cancel-in-progress: false

jobs:
  refresh:
    if: github.repository == 'toctionyan/fristTest' && github.ref_name == 'fix/parameterized-permit-test-verifier-isolation-20260815'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/parameterized-permit-test-verifier-isolation-20260815
          fetch-depth: 1
          persist-credentials: true

      - name: Refresh exact git-tracked protected baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 -B - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path('.').resolve()
          baseline_path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(baseline_path.read_text(encoding='utf-8'))
          protected_roots = tuple(str(value) for value in payload.get('protected_roots') or ())
          if protected_roots != ('services', 'web', 'contracts'):
              raise SystemExit(f'unexpected_protected_roots:{protected_roots!r}')

          raw = subprocess.check_output(
              ['git', 'ls-files', '-z', '--', *protected_roots],
              cwd=root,
          )
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          current = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          previous = {str(k): str(v) for k, v in (payload.get('files') or {}).items()}
          added = set(current) - set(previous)
          changed_existing = {
              path for path in set(current) & set(previous)
              if current[path] != previous[path]
          }
          removed = set(previous) - set(current)
          expected_changed = {
              'services/agent-service/tests/context/test_parameterized_capability_alignment.py'
          }
          if added:
              raise SystemExit('unexpected_added_protected_paths:' + ','.join(sorted(added)))
          if changed_existing != expected_changed:
              raise SystemExit(
                  'unexpected_changed_existing_protected_paths:'
                  + ','.join(sorted(changed_existing))
              )
          if removed:
              raise SystemExit('unexpected_removed_protected_paths:' + ','.join(sorted(removed)))

          expected_hash = '5cf35e7357a53f80063417057b8a4efbdfd492ce6e8a2811a0e5ba483af2893e'
          path = next(iter(expected_changed))
          if current.get(path) != expected_hash:
              raise SystemExit(
                  f'protected_hash_mismatch:{path}:expected={expected_hash}:actual={current.get(path)}'
              )

          source_head = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], cwd=root, text=True
          ).strip()
          payload['file_count'] = len(current)
          payload['files'] = dict(sorted(current.items()))
          payload['generated_at'] = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace('+00:00', 'Z')
          )
          payload['generated_from'] = 'git:' + source_head
          baseline_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          print(json.dumps({
              'status': 'PASS',
              'source_head': source_head,
              'file_count': len(current),
              'added': sorted(added),
              'changed_existing': sorted(changed_existing),
              'removed': sorted(removed),
              'protected_hash': current[path],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish governed baseline and retire one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/parameterized-permit-baseline-refresh-once.yml
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json .github/workflows/parameterized-permit-baseline-refresh-once.yml
          git diff --cached --check
          test "$(git diff --cached --name-only | sort | tr '\n' ' ')" = ".github/workflows/parameterized-permit-baseline-refresh-once.yml skill-system/registry/product-source-baseline.json "
          git commit -m 'Refresh parameterized permit protected product-source baseline'
          git push origin HEAD:fix/parameterized-permit-test-verifier-isolation-20260815
          echo "FINAL_HEAD=$(git rev-parse HEAD)"
