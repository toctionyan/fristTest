name: wp08-attempt6-postmerge-reconcile-attempt7-once

on:
  pull_request:
    branches: [main]
    types: [opened, reopened]

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  reconcile:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt6-postmerge-reconcile-attempt7-once-20260809'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      EXPECTED_MAIN_SHA: 11e119c134906f1395db615762fd45c1e7385c92
      PARENT_WP08_RUN_ID: '31318059970'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact authoritative main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Reconcile exact-main repair CI and permit Attempt 7 only after successful Quality
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python -B scripts/wp08_release_recovery.py --mode reconcile
          python - <<'PY'
          import json
          import os
          from urllib import request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          expected_sha = os.environ['EXPECTED_MAIN_SHA']
          parent_run = int(os.environ['PARENT_WP08_RUN_ID'])
          req = request.Request(
              f'https://api.github.com/repos/{repo}/issues/293',
              headers={
                  'Accept': 'application/vnd.github+json',
                  'Authorization': f'Bearer {token}',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
          )
          with request.urlopen(req, timeout=30) as response:
              issue = json.load(response)
          body = str(issue.get('body') or '')
          required = (
              '"status": "CERTIFYING"',
              '"attempt": 7',
              f'"current_candidate_sha": "{expected_sha}"',
              '"production_closed": false',
          )
          missing = [value for value in required if value not in body]
          if missing:
              raise SystemExit('ReleaseRun did not advance to exact Attempt 7 after successful main Quality: ' + repr(missing))
          state_text = body.split('<!-- WP08_RELEASE_RUN_STATE_BEGIN -->', 1)[1].split('<!-- WP08_RELEASE_RUN_STATE_END -->', 1)[0]
          payload = state_text.split('```json', 1)[1].split('```', 1)[0]
          state = json.loads(payload)
          current_run = int(state.get('current_wp08_run_id') or 0)
          if current_run <= 0 or current_run == parent_run:
              raise SystemExit(f'Attempt 7 did not receive a new WP-08 run id: {current_run}')
          history = list(state.get('history') or [])
          if not any(
              isinstance(row, dict)
              and row.get('event') == 'wp08_dispatched'
              and int(row.get('attempt') or 0) == 7
              and str(row.get('candidate_sha') or '') == expected_sha
              and int(row.get('wp08_run_id') or 0) == current_run
              for row in history
          ):
              raise SystemExit('Attempt 7 dispatch history is missing or not exact-main bound')
          print(json.dumps({
              'status': 'PASS',
              'issue': 293,
              'release_state': 'CERTIFYING',
              'attempt': 7,
              'candidate_sha': expected_sha,
              'wp08_run_id': current_run,
          }, sort_keys=True))
          PY
