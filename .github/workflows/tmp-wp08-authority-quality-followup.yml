name: tmp-wp08-authority-quality-followup

on:
  push:
    branches:
      - fix/wp08-single-authority-cutover-20260813

permissions:
  contents: write

jobs:
  validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/wp08-single-authority-cutover-20260813
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Apply quality compatibility follow-up
        run: python .github/tmp/wp08_authority_quality_followup.py
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Run authority and adversarial regressions
        run: >-
          cd services/agent-service && PYTHONPATH=src .venv/bin/python -m pytest
          tests/runtime/test_wp08_attempt3_single_authority_repairs.py
          tests/runtime/test_semantic_reference_binding.py
          tests/runtime/test_semantic_output_coverage.py
          tests/runtime/test_deterministic_target_compiler.py
          tests/runtime/test_execution_target_authority_cutover.py
          tests/runtime/test_goal_binding_counterexamples.py
          tests/runtime/test_goal_change_evidence_contract.py -q
      - name: Refresh protected source baseline
        run: python .github/tmp/wp08_authority_quality_baseline.py
      - name: Validate Skill control plane
        run: services/agent-service/.venv/bin/python -B skill-system/controller/profile_runner.py skill-control-plane
      - name: Publish product repair
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agent-service/src/agent_core/lifecycle/goal_planning.py
          git add services/agent-service/src/agent_core/lifecycle/tool_execution_runtime.py
          git add services/agent-service/tests/runtime/test_wp08_attempt3_single_authority_repairs.py
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m "Preserve compatibility behind canonical semantic writer boundary"
          git push origin HEAD:fix/wp08-single-authority-cutover-20260813
