name: B17i Verified Source Import

on:
  push:
    branches: [main]
    paths:
      - b17i_source.tar.xz
      - .github/workflows/b17i-import-bootstrap.yml
  pull_request:
    branches: [main]
    types: [opened, synchronize]
    paths:
      - B17I_IMPORT_TRIGGER.md
      - B17I_IMPORT_TRIGGER_2.md
      - B17I_IMPORT_TRIGGER_3.md
      - B17I_IMPORT_TRIGGER_4.md
      - .github/workflows/b17i-import-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: b17i-source-import
  cancel-in-progress: false

jobs:
  import-verified-source:
    if: github.repository == 'toctionyan/fristTest' && (github.ref == 'refs/heads/main' || github.event_name == 'pull_request')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: true

      - name: Verify archive and managed source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from __future__ import annotations
          import hashlib, json, os, shutil, tarfile
          from pathlib import Path, PurePosixPath

          archive = Path('b17i_source.tar.xz')
          expected_archive_sha256 = '1a191662c80fc6ab68d91b60e1ffdd0effe916f538acbea9fb052826dbc56e6d'
          if not archive.is_file():
              raise SystemExit('b17i_source.tar.xz is missing')
          actual_sha = hashlib.sha256(archive.read_bytes()).hexdigest()
          if actual_sha != expected_archive_sha256:
              raise SystemExit(f'archive SHA256 mismatch: {actual_sha}')

          destination = Path(os.environ['RUNNER_TEMP']) / 'b17i-verified-source'
          shutil.rmtree(destination, ignore_errors=True)
          destination.mkdir(parents=True)
          with tarfile.open(archive, mode='r:xz') as bundle:
              members = bundle.getmembers()
              if not members:
                  raise SystemExit('archive is empty')
              for member in members:
                  path = PurePosixPath(member.name)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {member.name!r}')
                  if member.issym() or member.islnk() or member.isdev():
                      raise SystemExit(f'forbidden archive entry: {member.name!r}')
                  if not (member.isdir() or member.isfile()):
                      raise SystemExit(f'unsupported archive entry: {member.name!r}')
              bundle.extractall(destination)

          manifest_path = destination / 'PHASE_CANDIDATE_MANIFEST.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          required = {
              'schema_version': 1,
              'status': 'PHASE_CANDIDATE_ENVIRONMENT_EXECUTION_PENDING',
              'phase': 'B17i',
              'file_count': 1047,
              'production_closed': False,
          }
          for key, expected in required.items():
              if manifest.get(key) != expected:
                  raise SystemExit(f'manifest {key!r} mismatch')

          entries = manifest.get('files')
          if not isinstance(entries, list) or len(entries) != 1047:
              raise SystemExit('manifest files list must contain exactly 1047 entries')
          declared = set()
          for entry in entries:
              relative = entry.get('path')
              normalized = PurePosixPath(relative)
              if normalized.is_absolute() or '..' in normalized.parts or relative in declared:
                  raise SystemExit(f'invalid manifest path: {relative!r}')
              declared.add(relative)
              candidate = destination / relative
              if not candidate.is_file() or candidate.is_symlink():
                  raise SystemExit(f'managed file missing: {relative!r}')
              payload = candidate.read_bytes()
              if len(payload) != entry.get('size'):
                  raise SystemExit(f'file size mismatch: {relative!r}')
              if hashlib.sha256(payload).hexdigest() != entry.get('sha256'):
                  raise SystemExit(f'file SHA256 mismatch: {relative!r}')

          actual = {
              p.relative_to(destination).as_posix()
              for p in destination.rglob('*')
              if p.is_file() and not p.is_symlink()
          }
          if actual != declared | {'PHASE_CANDIDATE_MANIFEST.json'}:
              raise SystemExit('archive file set mismatch')
          print(json.dumps({
              'result': 'PASS',
              'archive_sha256': actual_sha,
              'managed_file_count': len(declared),
              'phase': manifest['phase'],
              'status': manifest['status'],
              'production_closed': manifest['production_closed'],
          }, indent=2))
          PY

      - name: Replace bootstrap with verified non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR="$RUNNER_TEMP/b17i-verified-source"
          BOOTSTRAP="$RUNNER_TEMP/b17i-import-bootstrap.yml"
          cp .github/workflows/b17i-import-bootstrap.yml "$BOOTSTRAP"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$SOURCE_DIR"/. .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp "$BOOTSTRAP" .github/workflows/b17i-import-bootstrap.yml
          test -f PHASE_CANDIDATE_MANIFEST.json
          test ! -e b17i_source.tar.xz
          test ! -e .github/workflows/release.yml

      - name: Commit verified non-workflow source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No source changes to commit'; exit 1; }
          git commit -m 'Import verified B17i source candidate without workflows'
          git push origin HEAD:main
