name: engineering-autonomy-wakeup

on:
  workflow_run:
    workflows:
      - engineering-autonomy-authorize
    types: [completed]

permissions:
  contents: read
  actions: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: engineering-autonomy-wakeup-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  wakeup:
    if: >-
      github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'workflow_dispatch'
      && github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: write
      pull-requests: read
      statuses: write
    steps:
      - name: Checkout exact trusted authorization control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact authorization workflow identity
        env:
          AUTHORIZE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          [[ "${AUTHORIZE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git -C control rev-parse HEAD)" == "${AUTHORIZE_HEAD_SHA}" ]]
          test -f control/.github/workflows/engineering-autonomy-authorize.yml
          test -f control/scripts/github_repair_engineering_autonomy_wakeup.py

      - name: Resolve and download exact authorize-attempt handoff artifact
        id: handoff_artifact
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZE_RUN_ID: ${{ github.event.workflow_run.id }}
          AUTHORIZE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          AUTHORIZE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_ACTOR: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTHORIZE_RUN_ID}" > incoming/authorize-run.json
          jq -e --arg attempt "${AUTHORIZE_RUN_ATTEMPT}" --arg head "${AUTHORIZE_HEAD_SHA}" --arg actor "${EXPECTED_ACTOR}" '
            .name == "engineering-autonomy-authorize"
            and .event == "workflow_dispatch"
            and .status == "completed"
            and .conclusion == "success"
            and ((.run_attempt | tostring) == $attempt)
            and .head_sha == $head
            and .actor.login == $actor
          ' incoming/authorize-run.json >/dev/null
          run_started_at=$(jq -r '.run_started_at // empty' incoming/authorize-run.json)
          [[ -n "${run_started_at}" ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${AUTHORIZE_RUN_ID}/artifacts?per_page=100" > incoming/authorize-artifacts.json
          count=$(jq -r --arg started "${run_started_at}" '[.artifacts[]
            | select(.expired == false)
            | select(.created_at >= $started)
            | select(.name | startswith("engineering-autonomy-handoff-"))] | length' incoming/authorize-artifacts.json)
          [[ "${count}" == "1" ]]
          artifact_id=$(jq -r --arg started "${run_started_at}" '[.artifacts[]
            | select(.expired == false)
            | select(.created_at >= $started)
            | select(.name | startswith("engineering-autonomy-handoff-"))][0].id' incoming/authorize-artifacts.json)
          [[ "${artifact_id}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > incoming/handoff.zip
          unzip -q incoming/handoff.zip -d incoming
          echo "artifact_id=${artifact_id}" >> "$GITHUB_OUTPUT"

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Resolve current source Draft PR
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          handoff_result=$(find incoming -type f -name handoff-result.json -print -quit)
          [[ -n "${handoff_result}" ]]
          source_pr=$(jq -r '.source_pr_number // empty' "${handoff_result}")
          [[ "${source_pr}" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${source_pr}" > incoming/source-pr.json
          echo "handoff_result=${handoff_result}" >> "$GITHUB_OUTPUT"
          echo "source_pr_number=${source_pr}" >> "$GITHUB_OUTPUT"

      - name: Revalidate exact persisted handoff before network capability
        id: verify
        env:
          AUTHORIZE_RUN_ID: ${{ github.event.workflow_run.id }}
          AUTHORIZE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          AUTHORIZE_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B control/scripts/github_repair_engineering_autonomy_wakeup.py verify \
            --handoff-result "${{ steps.source.outputs.handoff_result }}" \
            --pr incoming/source-pr.json \
            --repository "${GITHUB_REPOSITORY}" \
            --authorize-run-id "${AUTHORIZE_RUN_ID}" \
            --authorize-run-attempt "${AUTHORIZE_RUN_ATTEMPT}" \
            --authorize-head-sha "${AUTHORIZE_HEAD_SHA}" \
            --github-output "$GITHUB_OUTPUT"

      - name: Check durable dispatch idempotency marker
        id: idempotency
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ steps.verify.outputs.source_head_sha }}
          DECISION_ID: ${{ steps.verify.outputs.decision_id }}
        run: |
          set -euo pipefail
          [[ "${SOURCE_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${DECISION_ID}" =~ ^[0-9a-f]{64}$ ]]
          CONTEXT="engineering-autonomy-dispatch/${DECISION_ID:0:16}"
          existing=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SOURCE_HEAD_SHA}/status" \
            | jq -r --arg context "${CONTEXT}" '[.statuses[] | select(.context == $context and .state == "success")][0].target_url // empty')
          if [[ -n "${existing}" ]]; then
            echo "already_dispatched=true" >> "$GITHUB_OUTPUT"
            echo "existing_ref=${existing}" >> "$GITHUB_OUTPUT"
          else
            echo "already_dispatched=false" >> "$GITHUB_OUTPUT"
            echo "existing_ref=" >> "$GITHUB_OUTPUT"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_HEAD_SHA}" \
              -f state=pending \
              -f context="${CONTEXT}" \
              -f description="bounded autonomy network request pending" \
              -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null
          fi
          echo "context=${CONTEXT}" >> "$GITHUB_OUTPUT"

      - name: Execute exactly one bounded network request
        id: network
        if: steps.idempotency.outputs.already_dispatched != 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NETWORK_KIND: ${{ steps.verify.outputs.network_kind }}
          SOURCE_RUN_ID: ${{ steps.verify.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.verify.outputs.source_run_attempt }}
          SOURCE_HEAD_SHA: ${{ steps.verify.outputs.source_head_sha }}
          S2_SOURCE_RUN_ID: ${{ steps.verify.outputs.stage2_source_run_id }}
          S2_SOURCE_RUN_ATTEMPT: ${{ steps.verify.outputs.stage2_source_run_attempt }}
          S2_HANDOFF_RUN_ID: ${{ steps.verify.outputs.stage2_autonomy_handoff_run_id }}
          S2_HANDOFF_RUN_ATTEMPT: ${{ steps.verify.outputs.stage2_autonomy_handoff_run_attempt }}
          S2_AUTHORIZATION_ID: ${{ steps.verify.outputs.stage2_autonomy_authorization_id }}
          S2_AUTHORIZATION_SHA256: ${{ steps.verify.outputs.stage2_autonomy_authorization_sha256 }}
          S2_GRANT_ID: ${{ steps.verify.outputs.stage2_autonomy_grant_id }}
          S2_GRANT_SHA256: ${{ steps.verify.outputs.stage2_autonomy_grant_sha256 }}
          S2_PLAN_SHA256: ${{ steps.verify.outputs.stage2_autonomy_plan_sha256 }}
          S2_REPAIR_ROUND: ${{ steps.verify.outputs.stage2_repair_round }}
        run: |
          set -euo pipefail
          NETWORK_REF="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [[ "${NETWORK_KIND}" == "DISPATCH_STAGE2" ]]; then
            [[ "${S2_SOURCE_RUN_ID}" == "${SOURCE_RUN_ID}" ]]
            [[ "${S2_SOURCE_RUN_ATTEMPT}" == "${SOURCE_RUN_ATTEMPT}" ]]
            [[ "${S2_HANDOFF_RUN_ID}" == "${{ github.event.workflow_run.id }}" ]]
            [[ "${S2_HANDOFF_RUN_ATTEMPT}" == "${{ github.event.workflow_run.run_attempt }}" ]]
            [[ "${S2_AUTHORIZATION_SHA256}" =~ ^[0-9a-f]{64}$ ]]
            [[ "${S2_GRANT_SHA256}" =~ ^[0-9a-f]{64}$ ]]
            [[ "${S2_PLAN_SHA256}" =~ ^[0-9a-f]{64}$ ]]
            [[ "${S2_REPAIR_ROUND}" == "1" ]]
            gh workflow run governed-ci-repair-stage2.yml \
              --ref main \
              -f "source_run_id=${S2_SOURCE_RUN_ID}" \
              -f "source_run_attempt=${S2_SOURCE_RUN_ATTEMPT}" \
              -f "autonomy_handoff_run_id=${S2_HANDOFF_RUN_ID}" \
              -f "autonomy_handoff_run_attempt=${S2_HANDOFF_RUN_ATTEMPT}" \
              -f "autonomy_authorization_id=${S2_AUTHORIZATION_ID}" \
              -f "autonomy_authorization_sha256=${S2_AUTHORIZATION_SHA256}" \
              -f "autonomy_grant_id=${S2_GRANT_ID}" \
              -f "autonomy_grant_sha256=${S2_GRANT_SHA256}" \
              -f "autonomy_plan_sha256=${S2_PLAN_SHA256}" \
              -f "repair_round=1"
          elif [[ "${NETWORK_KIND}" == "RERUN_SOURCE_RUN" ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > incoming/source-run.json
            jq -e --arg attempt "${SOURCE_RUN_ATTEMPT}" --arg head "${SOURCE_HEAD_SHA}" '
              .status == "completed"
              and .conclusion != "success"
              and ((.run_attempt | tostring) == $attempt)
              and .head_sha == $head
            ' incoming/source-run.json >/dev/null
            gh run rerun "${SOURCE_RUN_ID}"
          elif [[ "${NETWORK_KIND}" == "NOOP" ]]; then
            :
          else
            echo "Unsupported bounded network kind: ${NETWORK_KIND}" >&2
            exit 1
          fi
          echo "network_ref=${NETWORK_REF}" >> "$GITHUB_OUTPUT"

      - name: Persist successful or idempotent dispatch receipt
        if: steps.idempotency.outputs.already_dispatched == 'true' || steps.network.outcome == 'success'
        env:
          HANDOFF_RESULT: ${{ steps.source.outputs.handoff_result }}
          EXISTING_REF: ${{ steps.idempotency.outputs.existing_ref }}
          NETWORK_REF: ${{ steps.network.outputs.network_ref }}
        run: |
          set -euo pipefail
          mkdir -p receipt
          REF="${EXISTING_REF:-${NETWORK_REF:-https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}}}"
          "${pythonLocation}/bin/python" -B control/scripts/github_repair_engineering_autonomy_wakeup.py receipt \
            --handoff-result "${HANDOFF_RESULT}" \
            --status DISPATCHED \
            --network-ref "${REF}" \
            --output receipt/dispatch-receipt.json

      - name: Persist failed dispatch receipt
        if: steps.idempotency.outputs.already_dispatched != 'true' && steps.network.outcome == 'failure'
        env:
          HANDOFF_RESULT: ${{ steps.source.outputs.handoff_result }}
        run: |
          set -euo pipefail
          mkdir -p receipt
          "${pythonLocation}/bin/python" -B control/scripts/github_repair_engineering_autonomy_wakeup.py receipt \
            --handoff-result "${HANDOFF_RESULT}" \
            --status FAILED \
            --error-code NETWORK_ACTION_FAILED \
            --output receipt/dispatch-receipt.json

      - name: Publish durable dispatch status marker
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_HEAD_SHA: ${{ steps.verify.outputs.source_head_sha }}
          CONTEXT: ${{ steps.idempotency.outputs.context }}
          ALREADY_DISPATCHED: ${{ steps.idempotency.outputs.already_dispatched }}
          NETWORK_OUTCOME: ${{ steps.network.outcome }}
        run: |
          set -euo pipefail
          if [[ -z "${SOURCE_HEAD_SHA}" || -z "${CONTEXT}" ]]; then
            exit 0
          fi
          if [[ "${ALREADY_DISPATCHED}" == "true" || "${NETWORK_OUTCOME}" == "success" ]]; then
            STATE=success
            DESCRIPTION="bounded autonomy network request accepted"
          else
            STATE=failure
            DESCRIPTION="bounded autonomy network request failed"
          fi
          gh api -X POST "repos/${GITHUB_REPOSITORY}/statuses/${SOURCE_HEAD_SHA}" \
            -f state="${STATE}" \
            -f context="${CONTEXT}" \
            -f description="${DESCRIPTION}" \
            -f target_url="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" >/dev/null

      - name: Upload dispatch receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: engineering-autonomy-dispatch-receipt-${{ steps.verify.outputs.source_run_id }}
          path: receipt/dispatch-receipt.json
          retention-days: 30
          if-no-files-found: warn

      - name: Publish wakeup summary
        if: always()
        env:
          NETWORK_KIND: ${{ steps.verify.outputs.network_kind }}
          SOURCE_RUN_ID: ${{ steps.verify.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.verify.outputs.source_run_attempt }}
          SOURCE_HEAD_SHA: ${{ steps.verify.outputs.source_head_sha }}
          ALREADY_DISPATCHED: ${{ steps.idempotency.outputs.already_dispatched }}
          NETWORK_OUTCOME: ${{ steps.network.outcome }}
        run: |
          {
            echo "## Engineering autonomy wakeup"
            echo
            echo "- Source run: \`${SOURCE_RUN_ID:-unknown}/${SOURCE_RUN_ATTEMPT:-unknown}\`"
            echo "- Source head: \`${SOURCE_HEAD_SHA:-unknown}\`"
            echo "- Network kind: \`${NETWORK_KIND:-unknown}\`"
            echo "- Already dispatched: \`${ALREADY_DISPATCHED:-unknown}\`"
            echo "- Network step outcome: \`${NETWORK_OUTCOME:-skipped}\`"
            echo "- merge_allowed: \`false\`"
            echo "- deploy_allowed: \`false\`"
            echo "- production_closed: \`false\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve network failure as workflow failure
        if: steps.idempotency.outputs.already_dispatched != 'true' && steps.network.outcome == 'failure'
        run: exit 1
