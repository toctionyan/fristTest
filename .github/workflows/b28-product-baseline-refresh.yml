name: B28 Product Baseline Refresh
run-name: Refresh B28 product-source baseline from governed repair

"on":
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths: [.b28-baseline-refresh-trigger]

permissions:
  contents: write

env:
  B28_BRANCH: agent/b28-repository-onboarding
  B28_EXPECTED_HEAD: 8b356a009efde4831e527453e8f7e54f77ed4c7e
  B28_REPAIR_COMMIT: 9a5d9ddc808bef5678ae0c49988684c91e657067
  B28_REPAIR_TREE: d4f1bdbb0e660b645f2589ce547176b7a67115ab

jobs:
  refresh:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'agent/b28-quick-repair-trigger'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repaired B28 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.B28_EXPECTED_HEAD }}
          path: candidate
          fetch-depth: 1
          clean: true
          persist-credentials: true

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Install locked Skill validation environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$B28_EXPECTED_HEAD"
          test "$(git -C candidate rev-parse HEAD^{tree})" = "$B28_REPAIR_TREE"
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check \
            --require-hashes --only-binary=:all: \
            -r candidate/deployment/ci/uv-requirements-linux-x86_64.txt
          cd candidate/services/agent-service
          uv sync --locked --all-groups

      - name: Refresh only approved product-source fingerprints
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path("candidate").resolve()
          baseline_path = root / "skill-system/registry/product-source-baseline.json"
          payload = json.loads(baseline_path.read_text(encoding="utf-8"))
          protected_roots = tuple(str(item) for item in payload["protected_roots"])
          ignored_parts = {".venv", "node_modules", "__pycache__"}

          current: dict[str, str] = {}
          for name in protected_roots:
              protected_root = root / name
              for path in sorted(item for item in protected_root.rglob("*") if item.is_file()):
                  if any(part in ignored_parts for part in path.parts):
                      continue
                  current[path.relative_to(root).as_posix()] = hashlib.sha256(path.read_bytes()).hexdigest()

          baseline = {str(key): str(value) for key, value in payload["files"].items()}
          expected = {
              "services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py": "4662c742873b8fee8b956e4b98d0c41153be8fbcb787ac15030cb96cde3cbf6b",
              "services/agent-service/src/agent_core/runtime/capability_gate.py": "365e50b5ce46aa380ba556417afe0313e908b669ef1862ad621b7c20a9de9ac2",
              "services/agent-service/tests/runtime/test_b17h_protected_environment_preflight.py": "7b220110b1ba080bb1dd33f2e18e958e4bfe93c0da7008b3328ef5444a78cc33",
              "services/agent-service/tests/runtime/test_b17i_production_execution_handoff.py": "0658447ad9a0eea5d024fe4a7ae220d244e7ebc4b6b2575bd0561af761cfa4bf",
              "services/agent-service/tests/runtime/test_goal_coverage_runtime.py": "14d22a59c0be5ccd2e2807dfd0eeaae6bcf8e3c6dd6e13659f71ef95a2f7155f",
              "services/agent-service/tests/support/conversation_case_fixtures.py": "0f1e5f36f0fce2fb27f1d893bf5f74ca8a6f840244fd1f38441aa84c082c3520",
          }
          changed = {
              path
              for path in set(current) | set(baseline)
              if current.get(path) != baseline.get(path)
          }
          if changed != set(expected):
              raise SystemExit(
                  "unexpected_product_source_delta:" + ",".join(sorted(changed))
              )
          mismatched = {
              path: {"expected": digest, "actual": current.get(path)}
              for path, digest in expected.items()
              if current.get(path) != digest
          }
          if mismatched:
              raise SystemExit("approved_hash_mismatch:" + json.dumps(mismatched, sort_keys=True))
          if len(current) != int(payload["file_count"]):
              raise SystemExit(
                  f"protected_file_count_changed:{payload['file_count']}->{len(current)}"
              )

          payload["generated_from"] = "git:" + os.environ["B28_REPAIR_COMMIT"]
          payload["generated_at"] = (
              datetime.now(timezone.utc)
              .replace(microsecond=0)
              .isoformat()
              .replace("+00:00", "Z")
          )
          payload["file_count"] = len(current)
          payload["files"] = dict(sorted(current.items()))
          baseline_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(
              json.dumps(
                  {
                      "status": "PASS",
                      "generated_from": payload["generated_from"],
                      "approved_paths": sorted(expected),
                      "file_count": len(current),
                  },
                  ensure_ascii=False,
                  indent=2,
              )
          )
          PY

      - name: Validate refreshed Skill control plane
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/profile_runner.py skill-control-plane

      - name: Publish exact baseline refresh
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          git clean -fdX
          find . -type d \( -name '__pycache__' -o -name '.pytest_cache' \) -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          test "$(git rev-parse HEAD)" = "$B28_EXPECTED_HEAD"
          test "$(git rev-parse HEAD^{tree})" = "$B28_REPAIR_TREE"
          printf '%s\n' 'skill-system/registry/product-source-baseline.json' > /tmp/expected-paths.txt
          git diff --name-only "$B28_EXPECTED_HEAD" -- | sort > /tmp/actual-paths.txt
          diff -u /tmp/expected-paths.txt /tmp/actual-paths.txt

          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m 'Refresh B28 product-source baseline after governed repair'
          echo "BASELINE_COMMIT=$(git rev-parse HEAD)"
          echo "BASELINE_TREE=$(git rev-parse HEAD^{tree})"
          git push --force-with-lease=refs/heads/${B28_BRANCH}:$B28_EXPECTED_HEAD \
            origin HEAD:${B28_BRANCH}
