name: tmp-v20.18-governance-recovery-closure-d1d

on:
  push:
    branches:
      - tmp/v20.18-governance-recovery-20260814
    paths:
      - .github/workflows/tmp-v20.18-recovery-h-publisher.yml

permissions:
  contents: read

jobs:
  closure-d1d-evidence-and-diff:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout exact carrier
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Set up locked Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false

      - name: Reproduce H5 and validate Closure-D1d only
        run: python3 -B .github/recovery_d1d_wrapper.py

      - name: Stage Closure-D1d evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="${GITHUB_WORKSPACE}/recovery-d1d-artifact"
          rm -rf "$out" && mkdir -p "$out"
          successor='migration-v20.18-semantic-single-writer-output-coverage-r1'
          cp "${RUNNER_TEMP}/recovery-d1-summary.json" "$out/recovery-d1d-summary.json" 2>/dev/null || true
          cp "${RUNNER_TEMP}/recovery-d1d-runtime-hygiene.json" "$out/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/recovery-h3-execution.json" "$out/" 2>/dev/null || true
          cp "${RUNNER_TEMP}/recovery-h3-readonly-diff-proof.json" "$out/" 2>/dev/null || true
          cp -a "${RUNNER_TEMP}/recovery-h3-focused" "$out/focused-pre-closure" 2>/dev/null || true
          cp "${RUNNER_TEMP}/successor-product-verify-quick.log" "$out/" 2>/dev/null || true
          cp /tmp/v2018-baseline/governance/active-change.json "$out/successor-active-contract.json" 2>/dev/null || true
          cp -a /tmp/v2018-baseline/governance/repair-cases/${successor} "$out/successor-repair-case" 2>/dev/null || true
          cp -a /tmp/v2018-baseline/.quality/product-control-plane/${successor}/reviews "$out/reviews" 2>/dev/null || true
          cp /tmp/v2018-baseline/.quality/product-code/${successor}/baseline/baseline-record.json "$out/baseline-record.json" 2>/dev/null || true
          quick="$(cat "${RUNNER_TEMP}/quick-summary-path.txt" 2>/dev/null || true)"
          if [ -n "$quick" ] && [ -f "/tmp/v2018-baseline/$quick" ]; then cp "/tmp/v2018-baseline/$quick" "$out/quick-run-summary.json"; fi

      - name: Upload Closure-D1d evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v20.18-governance-recovery-closure-d1d
          path: recovery-d1d-artifact
          if-no-files-found: error
