name: stage5g4-c3g3-a3-2b-transport

on:
  push:
    branches:
      - stage5g4-c3g3-a3-2b-evidence-binding

permissions:
  contents: write

jobs:
  materialize-a3-2b:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout transport branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply exact A3-2B candidate and remove transport
        shell: bash
        env:
          A3_2A_HEAD: 4bb5f3a8cbe3a41cdc372c09e20b955e4c6ed7e1
          PATCH_PATH: .quality/stage5g4-c3g3-a3-2b/A3_2B.patch
          PATCH_SHA256: b0e2012cebf25b18649578b6c2d151526da001cf0c1da2bb87aa25cdf3a8f5ff
          WORKFLOW_PATH: .github/workflows/stage5g4-c3g3-a3-2b-transport.yml
        run: |
          set -euo pipefail
          test "$(git merge-base "$A3_2A_HEAD" HEAD)" = "$A3_2A_HEAD"
          echo "$PATCH_SHA256  $PATCH_PATH" | sha256sum -c -
          git apply --check "$PATCH_PATH"
          git apply "$PATCH_PATH"

          python - <<'PY2'
          from pathlib import Path
          for name in (
              'scripts/quality_loop.py',
              'skill-system/tests/test_baseline_oracle_evidence_binding.py',
          ):
              text = Path(name).read_text(encoding='utf-8')
              compile(text, name, 'exec')
          PY2

          printf '%s  %s\n' \
            'a42e9da297587090c7153ccdd32fb67fb53a5f117d75cedc1eefcd8390e8a665' 'scripts/quality_loop.py' \
            '547bc9ad40db7736d0904ae731d7650a266501852c39744b67a50b5b67c944c6' 'skill-system/tests/test_baseline_oracle_evidence_binding.py' \
            | sha256sum -c -

          rm -f "$PATCH_PATH" "$WORKFLOW_PATH"
          rmdir --ignore-fail-on-non-empty .quality/stage5g4-c3g3-a3-2b || true
          git add -A

          expected=$(printf '%s\n' \
            'scripts/quality_loop.py' \
            'skill-system/tests/test_baseline_oracle_evidence_binding.py' | sort)
          actual=$(git diff --cached --name-only "$A3_2A_HEAD" | sort)
          test "$actual" = "$expected"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'stage5g4-c3g3-a3-2b: bind oracle identity evidence'
          git push origin HEAD:stage5g4-c3g3-a3-2b-evidence-binding
