name: Temporary Stage 8 Complete Transaction Chain Probe

"on":
  push:
    branches: [fix/proof-authority-lifecycle-20260816]

permissions:
  contents: read

jobs:
  stage8-chain-probe:
    if: "${{ github.event.head_commit.message == 'test: probe Stage 8 complete transaction chain authority' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Materialize complete-chain probes
        run: |
          cat > services/agent-service/tests/_stage8_chain_probe.py <<'PY'
          from __future__ import annotations

          from pathlib import Path

          import pytest

          from agent_core.ledger import offer_entry
          from agent_core.persistence.action_lifecycle_store import TransactionLifecycleStore
          from agent_core.transaction import transition_draft
          from agent_core.transaction.coordinator import issue_grant_for_authority, reserve_grant_and_start_attempt

          SCOPE = {"tenant_id": "tenant-a", "user_id": "u001", "thread_id": "stage8-chain"}


          def _offer() -> dict:
              row = offer_entry(
                  action_id="create_refund", operation="APPLY_REFUND",
                  target_handle="artifact:order:10002",
                  input_values={"reason": "质量问题", "expected_version": 1},
                  preview={"decision": "ALLOWED", "snapshot": {"version": 1}},
                  scope=SCOPE, turn=5, label="退款申请", handle="draft:refund:stage8-chain",
              )
              row = transition_draft(row, "AWAITING_AUTHORIZATION")
              row.update({
                  "authority_protocol": "ui-authority@1", "authority_requirement": "ui_action_authority",
                  "authority_revision": 5, "confirmation_id": "confirm-stage8-chain", "confirmation_version": 1,
              })
              return row


          def _state(store):
              return {"current_tenant_id": SCOPE["tenant_id"], "current_user_id": SCOPE["user_id"], "current_thread_id": SCOPE["thread_id"], "_transaction_repository": store}


          def test_committed_draft_requires_durable_success_receipt(tmp_path: Path) -> None:
              store = TransactionLifecycleStore(tmp_path / "commit-without-receipt.db")
              offer = _offer()
              state = _state(store)
              authority = issue_grant_for_authority(
                  state=state, offer=offer,
                  authority={"actor_id": "u001", "actor_role": "customer", "client_request_id": "chain-commit", "authority_type": "ui_confirmed"},
              )
              reservation, started = reserve_grant_and_start_attempt(state=state, offer=offer, authority=authority)
              assert reservation["reserved"] is True and started["created"] is True
              attempt_id = str(started["attempt"]["attempt_id"])
              assert store.get_draft(offer["draft_id"])["draft_state"] == "COMMITTING"

              store.advance_draft(offer["draft_id"], draft_state="COMMITTED", draft_revision=offer["draft_revision"], current_attempt_id=attempt_id)
              assert store.get_draft(offer["draft_id"])["draft_state"] == "COMMITTING"

              result = {"success": True, "data": {"refund_id": "R-chain"}}
              store.record_receipt(
                  receipt_id="receipt-chain", tenant_id=SCOPE["tenant_id"], user_id=SCOPE["user_id"], thread_id=SCOPE["thread_id"],
                  draft_id=offer["draft_id"], attempt_id=attempt_id, receipt_handle="h_receipt:chain",
                  receipt_state="SUCCESS", business_result=result,
              )
              store.advance_draft(offer["draft_id"], draft_state="COMMITTED", draft_revision=offer["draft_revision"], current_attempt_id=attempt_id)
              assert store.get_draft(offer["draft_id"])["draft_state"] == "COMMITTED"


          def test_failed_inflight_draft_requires_durable_failed_receipt(tmp_path: Path) -> None:
              store = TransactionLifecycleStore(tmp_path / "fail-without-receipt.db")
              offer = _offer()
              state = _state(store)
              authority = issue_grant_for_authority(
                  state=state, offer=offer,
                  authority={"actor_id": "u001", "actor_role": "customer", "client_request_id": "chain-fail", "authority_type": "ui_confirmed"},
              )
              _reservation, started = reserve_grant_and_start_attempt(state=state, offer=offer, authority=authority)
              attempt_id = str(started["attempt"]["attempt_id"])
              store.advance_draft(offer["draft_id"], draft_state="FAILED_FINAL", draft_revision=offer["draft_revision"], current_attempt_id=attempt_id)
              assert store.get_draft(offer["draft_id"])["draft_state"] == "COMMITTING"

              failure = {"success": False, "error": "business rejected", "code": 409}
              store.record_receipt(
                  receipt_id="receipt-chain-failed", tenant_id=SCOPE["tenant_id"], user_id=SCOPE["user_id"], thread_id=SCOPE["thread_id"],
                  draft_id=offer["draft_id"], attempt_id=attempt_id, receipt_handle="h_receipt:chain-failed",
                  receipt_state="FAILED", business_result=failure,
              )
              store.advance_draft(offer["draft_id"], draft_state="FAILED_FINAL", draft_revision=offer["draft_revision"], current_attempt_id=attempt_id)
              assert store.get_draft(offer["draft_id"])["draft_state"] == "FAILED_FINAL"


          def test_pre_execution_validation_failure_can_close_without_business_receipt(tmp_path: Path) -> None:
              store = TransactionLifecycleStore(tmp_path / "preflight.db")
              offer = _offer()
              store.create_draft(
                  draft_id=offer["draft_id"], tenant_id=SCOPE["tenant_id"], user_id=SCOPE["user_id"], thread_id=SCOPE["thread_id"],
                  draft_revision=offer["draft_revision"], draft_state="AWAITING_AUTHORIZATION", action_id=offer["action_id"],
                  command_digest=offer["command_digest"], command_envelope=None, projection=offer,
              )
              store.advance_draft(offer["draft_id"], draft_state="FAILED_FINAL", draft_revision=offer["draft_revision"])
              assert store.get_draft(offer["draft_id"])["draft_state"] == "FAILED_FINAL"


          def test_repository_grant_issue_requires_canonical_awaiting_draft(tmp_path: Path) -> None:
              store = TransactionLifecycleStore(tmp_path / "grant-without-draft.db")
              offer = _offer()
              with pytest.raises(ValueError, match="Draft"):
                  store.issue_grant(
                      grant_id="grant-orphan", tenant_id=SCOPE["tenant_id"], user_id=SCOPE["user_id"], thread_id=SCOPE["thread_id"],
                      draft_id=offer["draft_id"], draft_revision=offer["draft_revision"], command_digest=offer["command_digest"],
                      confirmation_id=offer["confirmation_id"], client_request_id="orphan", actor_id="u001", actor_role="customer",
                  )
              assert store.get_grant("grant-orphan") is None


          def test_repository_reservation_requires_canonical_draft(tmp_path: Path) -> None:
              store = TransactionLifecycleStore(tmp_path / "reserve-orphan.db")
              offer = _offer()
              store.issue_grant(
                  grant_id="grant-orphan-reserve", tenant_id=SCOPE["tenant_id"], user_id=SCOPE["user_id"], thread_id=SCOPE["thread_id"],
                  draft_id=offer["draft_id"], draft_revision=offer["draft_revision"], command_digest=offer["command_digest"],
                  confirmation_id=offer["confirmation_id"], client_request_id="orphan-reserve", actor_id="u001", actor_role="customer",
              )
              result = store.reserve_grant_and_start_attempt(
                  grant_id="grant-orphan-reserve", attempt_id="attempt-orphan", tenant_id=SCOPE["tenant_id"], user_id=SCOPE["user_id"],
                  thread_id=SCOPE["thread_id"], draft_id=offer["draft_id"], draft_revision=offer["draft_revision"], action_id=offer["action_id"],
                  command_digest=offer["command_digest"], idempotency_key="idem-orphan", canonical_payload={"action_id": offer["action_id"]},
              )
              assert result["reserved"] is False
              assert result["created"] is False
              assert result["attempt"] == {}
              assert store.get_attempt("attempt-orphan") is None
          PY
      - name: Run complete-chain probes
        working-directory: services/agent-service
        env:
          PYTHONPATH: src
          APP_PROFILE: local
        run: .venv/bin/python -B -m pytest tests/_stage8_chain_probe.py -q
