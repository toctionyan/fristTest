name: stage3-authority-repair-roundtrip-carrier

on:
  push:
    branches:
      - fix/proof-authority-lifecycle-20260816

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/proof-authority-lifecycle-20260816
          fetch-depth: 0
      - name: Apply Stage 3 patch
        run: python .github/stage3_authority_repair_patch.py
      - name: Compile changed Python
        run: |
          python -m py_compile \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py \
            services/agent-service/tests/runtime/test_release47_dependency_repair_projection.py \
            skill-system/tests/test_semantic_dependency_repair_feedback.py
      - name: Commit Stage 3
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(semantic): carry mature dependency authority through repair"
          git push origin HEAD:fix/proof-authority-lifecycle-20260816
