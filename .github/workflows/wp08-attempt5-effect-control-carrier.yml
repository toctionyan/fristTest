name: wp08-attempt5-effect-control-carrier

"on":
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/wp08-attempt5-effect-control-carrier.yml
      - scripts/tmp_wp08_attempt5_effect_control_repair.py

permissions:
  contents: write

concurrency:
  group: wp08-attempt5-effect-control-carrier-${{ github.sha }}
  cancel-in-progress: false

jobs:
  validate-and-publish-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout carrier controls
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact Attempt 5 candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: 0da54e647a8b104ab1ce1d0da6c8a87dce6ca68e
          path: source
          fetch-depth: 0
          clean: true
          persist-credentials: true

      - name: Verify exact source identity
        run: |
          set -euo pipefail
          test "$(git -C source rev-parse HEAD)" = "0da54e647a8b104ab1ce1d0da6c8a87dce6ca68e"
          test -z "$(git -C source status --porcelain)"

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r source/deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Install locked Python validation environments
        run: |
          set -euo pipefail
          cd source/services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups

      - name: Apply bounded Attempt 5 semantic repair
        run: >-
          "${pythonLocation}/bin/python" -B
          control/scripts/tmp_wp08_attempt5_effect_control_repair.py
          patch --workspace source

      - name: Verify exact pre-baseline repair scope
        run: |
          set -euo pipefail
          git -C source diff --check
          EXPECTED=$(printf '%s\n' \
            services/agent-service/src/agent_core/lifecycle/goal_granularity.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            skill-system/tests/test_wp08_attempt5_effect_collision_and_control_reaudit.py | sort)
          ACTUAL=$({ git -C source diff --name-only; git -C source ls-files --others --exclude-standard; } | sort -u)
          test "$ACTUAL" = "$EXPECTED"

      - name: Run focused Attempt 5 positive and negative regressions
        env:
          PYTHONPATH: source/services/agent-service/src
        run: >-
          source/services/agent-service/.venv/bin/python -B -m pytest -q
          source/skill-system/tests/test_wp08_attempt5_effect_collision_and_control_reaudit.py
          source/skill-system/tests/test_wp08_attempt4_followup_repair.py
          source/skill-system/tests/test_wp08_attempt4_dependency_reference_repair.py
          source/skill-system/tests/test_wp08_attempt2_semantic_boundary_repair.py
          source/skill-system/tests/test_wp08_attempt1_requested_effect_reaudit.py
          source/services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py
          source/services/agent-service/tests/runtime/test_wp08_attempt7_final_authority_and_retry.py

      - name: Run complete standard Python suites
        run: >-
          source/services/agent-service/.venv/bin/python -B
          source/scripts/run_python_test_suites.py source --mode standard
          --junit-dir "${RUNNER_TEMP}/wp08-attempt5-standard/junit"
          --coverage-dir "${RUNNER_TEMP}/wp08-attempt5-standard/coverage"

      - name: Commit product repair and regressions
        working-directory: source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            services/agent-service/src/agent_core/lifecycle/goal_granularity.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            skill-system/tests/test_wp08_attempt5_effect_collision_and_control_reaudit.py
          git diff --cached --check
          git commit -m 'Harden effect collision and interaction-control semantic audits'
          git rev-parse HEAD > ../product-sha.txt

      - name: Refresh protected baseline for exact source changes
        run: |
          set -euo pipefail
          PRODUCT_SHA=$(cat product-sha.txt)
          "${pythonLocation}/bin/python" -B \
            control/scripts/tmp_wp08_attempt5_effect_control_repair.py \
            baseline --workspace source --product-sha "$PRODUCT_SHA"

      - name: Run complete Skill control plane
        run: >-
          source/services/agent-service/.venv/bin/python -B
          source/skill-system/controller/profile_runner.py skill-control-plane

      - name: Bind baseline and publish formal repair branch
        working-directory: source
        env:
          FORMAL_BRANCH: wp08-release-31474689970-attempt5-repair
        run: |
          set -euo pipefail
          git add skill-system/registry/product-source-baseline.json
          test "$(git diff --cached --name-only)" = "skill-system/registry/product-source-baseline.json"
          git diff --cached --check
          git commit -m 'Bind Attempt 5 repair to protected source baseline'
          test -z "$(git status --porcelain)"
          FINAL=$(git diff --name-only 0da54e647a8b104ab1ce1d0da6c8a87dce6ca68e..HEAD | sort)
          EXPECTED=$(printf '%s\n' \
            services/agent-service/src/agent_core/lifecycle/goal_granularity.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            skill-system/registry/product-source-baseline.json \
            skill-system/tests/test_wp08_attempt5_effect_collision_and_control_reaudit.py | sort)
          test "$FINAL" = "$EXPECTED"
          git push origin "HEAD:refs/heads/${FORMAL_BRANCH}"
