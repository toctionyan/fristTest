name: B28 Governed Bootstrap

"on":
  push:
    branches:
      - agent/b28-repository-onboarding

permissions:
  contents: write

concurrency:
  group: b28-governed-bootstrap
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable bootstrap commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          clean: true
          persist-credentials: true

      - name: Validate immutable B17j baseline
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/agent/b28-repository-onboarding"
          test "$(git rev-parse HEAD^)" = "b33e876eb0f9a6df3a9222dd4696c24230e0f8d9"
          command -v zstd >/dev/null
          test "$(find .b28-bootstrap -maxdepth 1 -type f -name 'part-*' | wc -l | tr -d ' ')" = "16"

      - name: Reconstruct and verify governed B28 snapshot
        shell: bash
        run: |
          set -euo pipefail
          tar --sort=name --mtime='@0' --owner=0 --group=0 --numeric-owner --format=gnu \
            --exclude='./.git' \
            --exclude='./.b28-bootstrap' \
            --exclude='./.github/workflows/b28-bootstrap.yml' \
            -cf /tmp/b17j-old.tar .
          echo "526e44071fe3e78f42af33baef52a2769daa59a1deb5bf1bdd5ec220bf2598ff  /tmp/b17j-old.tar" | sha256sum -c -

          cat .b28-bootstrap/part-* > /tmp/b28.patch.zst
          echo "f46344723a6fe12993bb07c81bc14d24be4ab0400508668cdda4d180bf136563  /tmp/b28.patch.zst" | sha256sum -c -

          zstd -q -d --patch-from=/tmp/b17j-old.tar /tmp/b28.patch.zst -o /tmp/b28-new.tar
          echo "f09d5e914e9f1c6bf90f663292b2503fc47a42a6dd3764aece67ec4472a740f0  /tmp/b28-new.tar" | sha256sum -c -

      - name: Replace B17j with verified B28 stable workspace
        shell: bash
        run: |
          set -euo pipefail
          git rm -rf .
          git clean -fdx
          tar -xf /tmp/b28-new.tar -C .

          if find . -type f -name '.env' -print -quit | grep -q .; then
            echo 'A real .env file was found in the governed snapshot.' >&2
            exit 1
          fi
          if find . -type d \( -name '.pytest_cache' -o -name '__pycache__' -o -name '.venv' -o -name 'venv' -o -name 'node_modules' \) -print -quit | grep -q .; then
            echo 'A generated dependency or cache directory was found.' >&2
            exit 1
          fi

          git add -A
          test -n "$(git status --short)"
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git commit -m 'Upgrade workspace to V20.17 B28'
          git push origin HEAD:agent/b28-repository-onboarding
