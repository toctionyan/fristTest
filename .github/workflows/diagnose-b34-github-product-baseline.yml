name: Diagnose B34 GitHub product baseline

on:
  push:
    branches:
      - agent/b34-final-publisher-20260804
    paths:
      - .github/workflows/diagnose-b34-github-product-baseline.yml
      - candidate-validation/b34-final-publisher/**

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    env:
      BASE_SHA: 5b8e9d71c596fefdc59766bc47773f750549e952
      OVERLAY_SHA: a4c771dc9ed99faa806d859c5017bb7dc5065d2417fe15ce99a0b6fd0a1663ff
      CORRECTION_SHA: 9c6d1d5f53681361fdf42ab47c88a48f0c6403c9b86f6204ca69c4a0129655da
      AUTHORITY_SHA: 3391d063b927267a3f975f8098637da10d66953256c6cd573921075ad0c01204
      LEDGER_BINDING_SHA: f668bb44687010f100fefbb569277e11b6693cc9ff1dd546cb658cfee322a81c

    steps:
      - name: Checkout immutable publisher payload
        uses: actions/checkout@v4
        with:
          ref: agent/b34-final-publisher-20260804
          fetch-depth: 0

      - name: Authenticate overlays
        run: |
          set -euo pipefail
          cat candidate-validation/b34-final-publisher/part-*.b64 > /tmp/base.b64
          base64 --decode /tmp/base.b64 > /tmp/base.tar.xz
          echo "${OVERLAY_SHA}  /tmp/base.tar.xz" | sha256sum --check --strict
          xz --test /tmp/base.tar.xz

          cat candidate-validation/b34-final-publisher/correction-part-*.b64 > /tmp/correction.b64
          base64 --decode /tmp/correction.b64 > /tmp/correction.tar.xz
          echo "${CORRECTION_SHA}  /tmp/correction.tar.xz" | sha256sum --check --strict
          xz --test /tmp/correction.tar.xz

          cat candidate-validation/b34-final-publisher/authority-small-part-*.b64 > /tmp/authority.b64
          base64 --decode /tmp/authority.b64 > /tmp/authority.tar.xz
          echo "${AUTHORITY_SHA}  /tmp/authority.tar.xz" | sha256sum --check --strict
          xz --test /tmp/authority.tar.xz

          cat candidate-validation/b34-final-publisher/ledger-binding-part-*.b64 > /tmp/ledger.b64
          base64 --decode /tmp/ledger.b64 > /tmp/ledger.tar.xz
          echo "${LEDGER_BINDING_SHA}  /tmp/ledger.tar.xz" | sha256sum --check --strict
          xz --test /tmp/ledger.tar.xz

      - name: Materialize exact final GitHub tree
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/b34-baseline-tree "${BASE_SHA}"
          tar -xJf /tmp/base.tar.xz -C /tmp/b34-baseline-tree
          tar -xJf /tmp/correction.tar.xz -C /tmp/b34-baseline-tree
          tar -xJf /tmp/authority.tar.xz -C /tmp/b34-baseline-tree
          tar -xJf /tmp/ledger.tar.xz -C /tmp/b34-baseline-tree
          rm -f \
            /tmp/b34-baseline-tree/services/agent-service/runtime/sqlite/app.db \
            /tmp/b34-baseline-tree/services/business-service/runtime/business-service/business.db

      - name: Generate diagnostic baseline candidate
        run: |
          set -euo pipefail
          cd /tmp/b34-baseline-tree
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import sys
          from pathlib import Path

          root = Path('.').resolve()
          controller = root / 'skill-system/controller'
          sys.path.insert(0, str(controller))
          import project_compatibility  # type: ignore

          files = project_compatibility.snapshot(root)
          payload = {
              'schema_version': 2,
              'generated_from': 'v20.17-b34-resilient-task-harness-github-authority-candidate',
              'source_release_sha256': '295dc5842c0ff230cb32e949579df791c8ba11d22c5830124a15c5ec9b639d08',
              'generated_at': '2026-08-04T12:30:00Z',
              'protected_roots': list(project_compatibility.PROTECTED_NAMES),
              'file_count': len(files),
              'files': files,
          }
          output = Path('/tmp/b34-github-product-source-baseline.json')
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          digest = hashlib.sha256(output.read_bytes()).hexdigest()
          print(json.dumps({'status': 'CANDIDATE_ONLY', 'file_count': len(files), 'sha256': digest}, indent=2))
          if len(files) != 547:
              raise SystemExit(f'expected 547 protected files, got {len(files)}')
          PY
          sha256sum /tmp/b34-github-product-source-baseline.json

      - name: Upload diagnostic baseline artifact
        uses: actions/upload-artifact@v4
        with:
          name: b34-github-product-baseline-${{ github.sha }}
          path: /tmp/b34-github-product-source-baseline.json
          if-no-files-found: error
          retention-days: 7
