name: Temporary Stage 8 Architecture Closure

"on":
  push:
    branches: [fix/proof-authority-lifecycle-20260816]

permissions:
  contents: write

jobs:
  repair:
    if: "${{ github.event.head_commit.message == 'chore: execute Stage 8 architecture closure v2' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Apply bounded architecture repair
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str, *, label: str) -> None:
              target = Path(path)
              text = target.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              target.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Persistence implementations must not import the transaction package:
          # the repository remains the transaction-lifecycle authority, while
          # these functions are pure mutation guards shared from a lower layer.
          source = Path('services/agent-service/src/agent_core/transaction/persistence_policy.py')
          target = Path('services/agent-service/src/agent_core/storage/transaction_policy.py')
          if not source.is_file():
              raise SystemExit('transaction persistence policy source missing')
          if target.exists():
              raise SystemExit('storage transaction policy target already exists')
          target.write_text(source.read_text(encoding='utf-8'), encoding='utf-8')
          source.unlink()

          for repository_path in (
              'services/agent-service/src/agent_core/persistence/action_lifecycle_store.py',
              'services/agent-service/src/agent_core/persistence/sqlalchemy_provider.py',
          ):
              replace_once(
                  repository_path,
                  'from agent_core.transaction.persistence_policy import ',
                  'from agent_core.storage.transaction_policy import ',
                  label=f'{repository_path} transaction policy dependency',
              )

          # Structured authority validation belongs with the structured submit
          # use case. AgentService keeps only a compatibility delegate; no
          # lifecycle fact or authorization authority is moved or duplicated.
          interaction_path = Path('services/agent-service/app/use_cases/interaction_submit.py')
          interaction = interaction_path.read_text(encoding='utf-8')
          import_anchor = 'from agent_core.transaction.availability import check_transaction_repository_available\n'
          if interaction.count(import_anchor) != 1:
              raise SystemExit('interaction submit import anchor mismatch')
          interaction = interaction.replace(
              import_anchor,
              import_anchor + 'from agent_core.transaction.active_draft import get_active_draft_id\n',
              1,
          )
          method_anchor = '    def authorize(self, request: ActionAuthorityRequest, *, include_debug: bool = False) -> ChatResponse:\n'
          if interaction.count(method_anchor) != 1:
              raise SystemExit('interaction submit method anchor mismatch')
          validator = '''    def validate_action_authority(self, graph: Any, request: ActionAuthorityRequest) -> str | None:\n        \"\"\"Read checkpoint + durable Draft and reject stale structured authority envelopes.\"\"\"\n        service = self._service\n        values = service._checkpoint_values(\n            graph,\n            thread_id=request.thread_id,\n            user_id=request.user_id,\n            tenant_id=request.tenant_id,\n        )\n        expected_handle = str(get_active_draft_id(values) or \"\")\n        if not expected_handle:\n            return \"no_pending_interaction\"\n        if request.offer_handle != expected_handle:\n            return \"offer_handle_mismatch\"\n        ledger = values.get(\"artifact_ledger\") or []\n        offer = next(\n            (item for item in ledger if isinstance(item, dict) and item.get(\"handle\") == expected_handle),\n            None,\n        )\n        if not offer or service._draft_state_for_validation(offer) != \"AWAITING_AUTHORIZATION\":\n            return \"offer_not_awaiting_authority\"\n        repository = getattr(service, \"transactions\", None)\n        get_durable = getattr(repository, \"get_draft_for_scope\", None)\n        if callable(get_durable):\n            durable = get_durable(\n                scope=TransactionScope(\n                    tenant_id=str(request.tenant_id or \"default\"),\n                    user_id=str(request.user_id),\n                    thread_id=str(request.thread_id),\n                ),\n                draft_id=expected_handle,\n            )\n            if durable is None:\n                return \"durable_draft_missing\"\n            if service._draft_state_for_validation(durable) != \"AWAITING_AUTHORIZATION\":\n                return \"durable_draft_not_awaiting_authority\"\n            if int(durable.get(\"draft_revision\") or 0) != int(offer.get(\"draft_revision\") or 0):\n                return \"durable_draft_revision_mismatch\"\n            durable_projection = durable.get(\"projection\") if isinstance(durable.get(\"projection\"), dict) else {}\n            if str(durable_projection.get(\"confirmation_id\") or \"\") != str(offer.get(\"confirmation_id\") or \"\"):\n                return \"durable_confirmation_id_mismatch\"\n            if int(durable_projection.get(\"confirmation_version\") or 0) != int(offer.get(\"confirmation_version\") or 0):\n                return \"durable_confirmation_version_mismatch\"\n        if str(offer.get(\"action_id\") or \"\") != request.action_id:\n            return \"action_id_mismatch\"\n        if str(offer.get(\"target_handle\") or \"\") != request.target_handle:\n            return \"target_handle_mismatch\"\n        if str(offer.get(\"confirmation_id\") or \"\") != request.confirmation_id:\n            return \"confirmation_id_mismatch\"\n        if int(offer.get(\"confirmation_version\") or 0) != int(request.confirmation_version):\n            return \"confirmation_version_mismatch\"\n        if int(offer.get(\"authority_revision\") or 0) != int(request.conversation_revision):\n            return \"conversation_revision_mismatch\"\n        if int(values.get(\"turn_index\") or 0) != int(request.conversation_revision):\n            return \"current_conversation_revision_mismatch\"\n        expected_type = \"ui_confirmed\" if request.decision == \"approved\" else \"ui_rejected\"\n        if request.authority_type != expected_type:\n            return \"authority_type_mismatch\"\n        return None\n\n'''
          interaction = interaction.replace(method_anchor, validator + method_anchor, 1)
          replace_call = '                stale_reason = service._validate_action_authority(graph, request)\n'
          if interaction.count(replace_call) != 1:
              raise SystemExit('interaction submit authority validation call mismatch')
          interaction = interaction.replace(
              replace_call,
              '                stale_reason = self.validate_action_authority(graph, request)\n',
              1,
          )
          interaction_path.write_text(interaction, encoding='utf-8')

          service_path = Path('services/agent-service/app/services/agent_service.py')
          service = service_path.read_text(encoding='utf-8')
          start = service.find('    def _validate_action_authority(')
          end = service.find('    def _validate_action_input(', start)
          if start < 0 or end < 0:
              raise SystemExit('AgentService authority validation block markers missing')
          delegate = '''    def _validate_action_authority(self, graph: Any, request: ActionAuthorityRequest) -> str | None:\n        \"\"\"Compatibility delegate; structured submission owns validation sequencing.\"\"\"\n        return self._interaction_submit_use_case().validate_action_authority(graph, request)\n\n'''
          service = service[:start] + delegate + service[end:]
          service_path.write_text(service, encoding='utf-8')

          offenders = []
          core = Path('services/agent-service/src/agent_core')
          for path in core.rglob('*.py'):
              if 'agent_core.transaction.persistence_policy' in path.read_text(encoding='utf-8'):
                  offenders.append(str(path))
          if offenders:
              raise SystemExit(f'forbidden persistence->transaction policy imports remain: {offenders}')
          if len(service_path.read_text(encoding='utf-8').splitlines()) > 700:
              raise SystemExit('AgentService still exceeds 700-line architecture boundary')
          PY
          git diff --check
      - name: Verify architecture closure before product tests
        run: |
          set -euo pipefail
          python -m unittest skill-system/tests/test_architecture_cycle_debt.py
          python architecture-skill/scripts/verify_convergence.py --workspace-root . >/tmp/architecture-convergence.json
          cat /tmp/architecture-convergence.json
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Run transaction and recovery regressions
        working-directory: services/agent-service
        env:
          PYTHONPATH: src
          APP_PROFILE: local
        run: >-
          .venv/bin/python -B -m pytest
          tests/transactions
          tests/context/test_transaction_commit_reference_continuity.py
          -m 'not integration'
          -q
      - name: Commit bounded product repair and remove executor
        run: |
          set -euo pipefail
          rm .github/workflows/stage8-architecture-closure.yml
          cat > /tmp/expected <<'EOF'
          .github/workflows/stage8-architecture-closure.yml
          services/agent-service/app/services/agent_service.py
          services/agent-service/app/use_cases/interaction_submit.py
          services/agent-service/src/agent_core/persistence/action_lifecycle_store.py
          services/agent-service/src/agent_core/persistence/sqlalchemy_provider.py
          services/agent-service/src/agent_core/storage/transaction_policy.py
          services/agent-service/src/agent_core/transaction/persistence_policy.py
          EOF
          sort -o /tmp/expected /tmp/expected
          { git diff --name-only; git ls-files --others --exclude-standard; } | sort -u > /tmp/actual
          diff -u /tmp/expected /tmp/actual
          git diff --check
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add -A -- \
            .github/workflows/stage8-architecture-closure.yml \
            services/agent-service/app/services/agent_service.py \
            services/agent-service/app/use_cases/interaction_submit.py \
            services/agent-service/src/agent_core/persistence/action_lifecycle_store.py \
            services/agent-service/src/agent_core/persistence/sqlalchemy_provider.py \
            services/agent-service/src/agent_core/storage/transaction_policy.py \
            services/agent-service/src/agent_core/transaction/persistence_policy.py
          git diff --cached --check
          git commit -m 'fix: restore one-way transaction persistence boundaries'
          echo "SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Refresh protected product-source baseline
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          root = Path('.').resolve()
          path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          roots = tuple(str(value) for value in payload['protected_roots'])
          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', *roots], cwd=root)
          tracked = sorted(item.decode() for item in raw.split(b'\0') if item)
          payload['generated_from'] = 'git:' + os.environ['SOURCE_SHA']
          payload['generated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          payload['file_count'] = len(tracked)
          payload['files'] = {p: hashlib.sha256((root / p).read_bytes()).hexdigest() for p in tracked}
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          print({'generated_from': payload['generated_from'], 'file_count': len(tracked)})
          PY
          python -m unittest skill-system/tests/test_product_source_baseline_binding.py
          git diff --check
          test "$(git diff --name-only | tr -d '\r')" = 'skill-system/registry/product-source-baseline.json'
      - name: Publish architecture closure and baseline
        run: |
          set -euo pipefail
          git add skill-system/registry/product-source-baseline.json
          git diff --cached --check
          git commit -m 'chore: refresh Stage 8 architecture-closure baseline'
          git push origin HEAD:fix/proof-authority-lifecycle-20260816
