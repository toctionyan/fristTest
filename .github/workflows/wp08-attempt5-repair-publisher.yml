name: wp08-attempt5-repair-publisher

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish-attempt5-repair:
    if: github.event.pull_request.head.ref == 'wp08-attempt5-repair-publisher-20260808'
    runs-on: ubuntu-24.04
    env:
      REPAIR_BRANCH: agent/wp08-attempt5-runtime-contract-repair-20260808
      REPAIR_HEAD: e52fdf8e36a2b7048f493c70671540f7ec7e8cfb
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: e52fdf8e36a2b7048f493c70671540f7ec7e8cfb
          fetch-depth: 1
          persist-credentials: true

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Verify repair branch authority
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$REPAIR_HEAD"
          REMOTE="$(git ls-remote origin refs/heads/$REPAIR_BRANCH | awk '{print $1}')"
          test "$REMOTE" = "$REPAIR_HEAD"

      - name: Apply exact attempt 5 repair
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B - <<'PY'
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: str, old: str, new: str) -> None:
              target = ROOT / path
              text = target.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"replacement_anchor_count:{path}:{count}")
              target.write_text(text.replace(old, new, 1), encoding="utf-8")

          recovery = "scripts/verify_managed_postgres_recovery.py"
          replace_once(
              recovery,
              '''def _input_values(interaction: dict[str, Any]) -> dict[str, str]:\n''',
              '''def _pending_interaction(\n    harness: ProductRuntimeHarness,\n    *,\n    token: str,\n    thread_id: str,\n    lifecycle: str,\n) -> tuple[dict, dict]:\n    payload = _call(\n        harness.agent_url,\n        f"/api/threads/{thread_id}/pending",\n        token=token,\n    )\n    return _interaction(payload, lifecycle)\n\n\ndef _input_values(interaction: dict[str, Any]) -> dict[str, str]:\n''',
          )
          replace_once(
              recovery,
              '''    form, form_control = _interaction(started, "collecting_input")\n''',
              '''    form, form_control = _pending_interaction(\n        harness, token=token, thread_id=thread_id, lifecycle="collecting_input"\n    )\n''',
          )
          replace_once(
              recovery,
              '''    _authority, authority_control = _interaction(input_result, "awaiting_authority")\n''',
              '''    _authority, authority_control = _pending_interaction(\n        harness, token=token, thread_id=thread_id, lifecycle="awaiting_authority"\n    )\n''',
          )

          managed = "scripts/run_managed_quality_integration.py"
          replace_once(
              managed,
              '''    def start(self) -> "ManagedPostgres":\n''',
              '''    def _host_database_ready(self) -> tuple[bool, str]:\n        try:\n            import psycopg\n        except ImportError as exc:\n            raise RuntimeError(\n                "managed integration requires psycopg for host PostgreSQL readiness"\n            ) from exc\n        safe_url = self.url.replace("postgresql+psycopg://", "postgresql://", 1)\n        try:\n            with psycopg.connect(\n                safe_url, autocommit=True, connect_timeout=3\n            ) as connection:\n                with connection.cursor() as cursor:\n                    cursor.execute("SELECT 1")\n                    row = cursor.fetchone()\n            return bool(row and int(row[0]) == 1), ""\n        except Exception as exc:\n            return False, exc.__class__.__name__\n\n    def start(self) -> "ManagedPostgres":\n''',
          )
          replace_once(
              managed,
              '''            if ready.returncode == 0:\n                return self\n            last_error = (ready.stderr or ready.stdout).strip()\n''',
              '''            if ready.returncode == 0:\n                host_ready, host_error = self._host_database_ready()\n                if host_ready:\n                    return self\n                last_error = f"host_postgres_session:{host_error}"\n            else:\n                last_error = (ready.stderr or ready.stdout).strip()\n''',
          )

          protocol = "services/agent-service/src/agent_core/lifecycle/protocol.py"
          replace_once(
              protocol,
              '''            "修改已有 Goal 或 Focus 时必须复制 ContextBundle 中当前 revision，并提供当前用户原话的连续 evidence_span；"\n''',
              '''            "修改已有 Goal 或 Focus 时必须复制 ContextBundle 中当前 revision，并提供当前用户原话的连续 evidence_span；"\n            "多 Goal 时，每个 Goal 的 evidence_span 必须是只覆盖该 Goal 的局部连续原文，不能把整句或兄弟 Goal 的文字重复复制给多个 Goal；每个证据片段必须能唯一归属到对应 Goal。"\n''',
          )

          semantic = "services/agent-service/scripts/verify_preprod_conversation_smoke.py"
          replace_once(
              semantic,
              '''            "不能把不支持分支吞掉，也不能用相似能力代替。evidence_span 必须来自用户原话。"\n            "同一当前轮中后续目标依赖前一目标时只用 depends_on；reference_expression 只用于已经在更早轮次向客户展示的历史结果，"\n''',
              '''            "不能把不支持分支吞掉，也不能用相似能力代替。evidence_span 必须来自用户原话。"\n            "多目标时，每个 Goal 的 evidence_span 必须只覆盖该 Goal 的局部连续原文，不能把整句或兄弟 Goal 的文字重复给多个 Goal。"\n            "同一当前轮中后续目标依赖前一目标时只用 depends_on；reference_expression 只用于已经在更早轮次向客户展示的历史结果，"\n''',
          )
          replace_once(
              semantic,
              '''        if len(matches) != 1:\n            raise RuntimeError(f"{case_id}: no unique model goal matches oracle span={evidence!r}, type={goal_type!r}")\n''',
              '''        if len(matches) != 1:\n            candidates = [\n                {\n                    "goal_id": str(row.get("goal_id") or ""),\n                    "evidence_span": str(row.get("evidence_span") or ""),\n                    "goal_type": str(row.get("goal_type") or ""),\n                }\n                for row in unmatched\n            ]\n            raise RuntimeError(\n                f"{case_id}: no unique model goal matches oracle span={evidence!r}, "\n                f"type={goal_type!r}, candidates={candidates!r}"\n            )\n''',
          )
          PY

          cat > skill-system/tests/test_wp08_attempt5_repair.py <<'PYTEST'
          from __future__ import annotations

          import sys
          from pathlib import Path

          import pytest

          ROOT = Path(__file__).resolve().parents[2]
          SCRIPTS = ROOT / "scripts"
          AGENT_ROOT = ROOT / "services" / "agent-service"
          for path in (SCRIPTS, AGENT_ROOT, AGENT_ROOT / "src"):
              if str(path) not in sys.path:
                  sys.path.insert(0, str(path))

          import psycopg
          import run_managed_quality_integration as managed
          import verify_managed_postgres_recovery as recovery


          def test_pending_interaction_reads_authoritative_live_control(monkeypatch: pytest.MonkeyPatch) -> None:
              class Harness:
                  agent_url = "http://agent.test"

              seen: list[str] = []

              def fake_call(base: str, path: str, **kwargs):
                  seen.append(path)
                  return {
                      "type": "interaction_required",
                      "interaction": {
                          "lifecycle": "collecting_input",
                          "control": {"offer_handle": "offer-1"},
                      },
                  }

              monkeypatch.setattr(recovery, "_call", fake_call)
              interaction, control = recovery._pending_interaction(
                  Harness(), token="token", thread_id="thread-1", lifecycle="collecting_input"
              )
              assert seen == ["/api/threads/thread-1/pending"]
              assert interaction["lifecycle"] == "collecting_input"
              assert control["offer_handle"] == "offer-1"


          def test_managed_postgres_requires_host_side_database_session(monkeypatch: pytest.MonkeyPatch) -> None:
              postgres = managed.ManagedPostgres()
              calls: list[tuple[str, str]] = []

              class Cursor:
                  def __enter__(self): return self
                  def __exit__(self, exc_type, exc, tb): return False
                  def execute(self, sql: str) -> None: calls.append(("execute", sql))
                  def fetchone(self): return (1,)

              class Connection:
                  def __enter__(self): return self
                  def __exit__(self, exc_type, exc, tb): return False
                  def cursor(self): return Cursor()

              def fake_connect(url: str, **kwargs):
                  calls.append(("connect", url))
                  assert url.startswith("postgresql://")
                  assert "+psycopg" not in url
                  assert kwargs["connect_timeout"] == 3
                  return Connection()

              monkeypatch.setattr(psycopg, "connect", fake_connect)
              ready, error = postgres._host_database_ready()
              assert ready is True
              assert error == ""
              assert ("execute", "SELECT 1") in calls


          def test_goal_contract_requires_unique_local_sibling_spans() -> None:
              protocol = (AGENT_ROOT / "src/agent_core/lifecycle/protocol.py").read_text(encoding="utf-8")
              semantic = (AGENT_ROOT / "scripts/verify_preprod_conversation_smoke.py").read_text(encoding="utf-8")
              assert "每个证据片段必须能唯一归属到对应 Goal" in protocol
              assert "不能把整句或兄弟 Goal 的文字重复给多个 Goal" in semantic
              assert "candidates={candidates!r}" in semantic
          PYTEST

          git diff --check
          "${pythonLocation}/bin/python" - <<'PY'
          import subprocess
          expected = {
              "scripts/verify_managed_postgres_recovery.py",
              "scripts/run_managed_quality_integration.py",
              "services/agent-service/src/agent_core/lifecycle/protocol.py",
              "services/agent-service/scripts/verify_preprod_conversation_smoke.py",
              "skill-system/tests/test_wp08_attempt5_repair.py",
          }
          rows = subprocess.check_output(["git", "status", "--porcelain=v1"], text=True).splitlines()
          actual = {row[3:] for row in rows if len(row) > 3}
          if actual != expected:
              raise SystemExit(f"unexpected_changed_paths:{sorted(actual)}")
          PY

      - name: Install locked Agent validation environment
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r deployment/ci/uv-requirements-linux-x86_64.txt
          cd services/agent-service
          uv sync --locked --all-groups

      - name: Run focused attempt 5 regressions
        shell: bash
        run: |
          set -euo pipefail
          services/agent-service/.venv/bin/python -m pytest -q skill-system/tests/test_wp08_attempt5_repair.py services/agent-service/tests/runtime/test_wp08_attempt4_graph_semantic_repair.py

      - name: Publish exact repair bytes
        shell: bash
        run: |
          set -euo pipefail
          REMOTE="$(git ls-remote origin refs/heads/$REPAIR_BRANCH | awk '{print $1}')"
          test "$REMOTE" = "$REPAIR_HEAD"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/verify_managed_postgres_recovery.py scripts/run_managed_quality_integration.py services/agent-service/src/agent_core/lifecycle/protocol.py services/agent-service/scripts/verify_preprod_conversation_smoke.py skill-system/tests/test_wp08_attempt5_repair.py
          git commit -m "WP-08 attempt 5: repair recovery, readiness and goal evidence contracts"
          git push origin HEAD:refs/heads/$REPAIR_BRANCH
