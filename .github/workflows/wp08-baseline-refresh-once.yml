name: wp08-baseline-refresh-once

on:
  push:
    branches:
      - fix/wp08-attempt7-semantic-capability-routing-20260813
    paths:
      - .github/workflows/wp08-baseline-refresh-once.yml

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Regenerate protected baseline
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(path.read_text(encoding='utf-8'))
          protected_roots = tuple(str(v) for v in payload.get('protected_roots') or ('services', 'web', 'contracts'))
          raw = subprocess.check_output(['git', 'ls-files', '-z', '--', *protected_roots], cwd=root)
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          payload['file_count'] = len(tracked)
          payload['files'] = {
              rel: hashlib.sha256((root / rel).read_bytes()).hexdigest()
              for rel in tracked
          }
          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()
          payload['generated_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          payload['generated_from'] = f'git:{head}'
          path.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY
      - name: Commit baseline and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git rm .github/workflows/wp08-baseline-refresh-once.yml
          git add skill-system/registry/product-source-baseline.json
          git commit -m 'Refresh WP08 Attempt7 repair product-source baseline'
          git push origin HEAD:fix/wp08-attempt7-semantic-capability-routing-20260813
