name: dependency-authority-v5-carrier

on:
  push:
    branches:
      - fix/proof-authority-lifecycle-20260816

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/proof-authority-lifecycle-20260816
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked agent environment
        run: cd services/agent-service && uv sync --locked --all-groups

      - name: Align control flow and historical regressions
        shell: bash
        run: |
          python - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          ROOT = Path.cwd()

          def replace_once(path: Path, old: str, new: str, label: str) -> None:
              text = path.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one marker, found {count}")
              path.write_text(text.replace(old, new, 1), encoding="utf-8")

          goal_planning = ROOT / "services/agent-service/src/agent_core/lifecycle/goal_planning.py"
          text = goal_planning.read_text(encoding="utf-8")
          text = text.replace("capability availability, tool order, business state", "capability availability, tool sequencing, business state")
          goal_planning.write_text(text, encoding="utf-8")
          replace_once(
              goal_planning,
              '''            last_indeterminate = GoalAlignmentVerdict(\n                verdict.verdict, verdict.evidence_spans, verdict.missing_spans, verdict.reason_code,\n                verdict.source, verdict.independent, {**verdict.details, "verifier_repair_attempted": attempt > 0},\n            )\n            if attempt == 0:\n''',
              '''            last_indeterminate = GoalAlignmentVerdict(\n                verdict.verdict, verdict.evidence_spans, verdict.missing_spans, verdict.reason_code,\n                verdict.source, verdict.independent, {**verdict.details, "verifier_repair_attempted": attempt > 0},\n            )\n            if attempt > 0:\n                # Additional loop capacity is reserved for explicit state transitions\n                # handled above (semantic adjudication -> dependency closure, etc.).\n                # A repeated malformed/ungrounded observation must fail closed here\n                # rather than silently consuming fourth/fifth/sixth generic retries.\n                return last_indeterminate\n            if attempt == 0:\n''',
              "bounded generic retry after explicit transitions",
          )

          attempt5 = ROOT / "services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py"
          replace_once(
              attempt5,
              '''        "agent_core.model_calls.invoke_model", side_effect=[false_positive, blind_independent]\n    ) as invoke:\n        verdict = ModelGoalAlignmentVerifier().verify(user_text=text, goals=goals, known_tools=set())\n    assert invoke.call_count == 2\n    assert verdict.exact\n    assert verdict.details["dependency_graph_match"] is True\n    assert verdict.details["verifier_repair_kind"] == "candidate_blind_dependency_reaudit"\n''',
              '''        "agent_core.model_calls.invoke_model", side_effect=[false_positive, blind_independent, blind_independent]\n    ) as invoke:\n        verdict = ModelGoalAlignmentVerifier().verify(user_text=text, goals=goals, known_tools=set())\n    assert invoke.call_count == 3\n    assert verdict.exact\n    assert verdict.details["dependency_graph_match"] is True\n    assert verdict.details["dependency_authority_state"] == "authoritative"\n    assert verdict.details["dependency_challenge_required"] is False\n    assert verdict.details["verifier_repair_kind"] == "candidate_blind_dependency_authority_closure"\n''',
              "attempt5 independent graph closure",
          )
          replace_once(
              attempt5,
              '''        side_effect=[false_positive, malformed_blind, repaired_blind_without_duplicate_evidence],\n    ) as invoke:\n        verdict = ModelGoalAlignmentVerifier().verify(user_text=text, goals=goals, known_tools=set())\n    assert invoke.call_count == 3\n    assert verdict.exact\n    assert verdict.evidence_spans == ("查一下鼠标订单", "帮我申请退款")\n    assert verdict.details["dependency_graph_match"] is True\n    assert verdict.details["dependency_proof_complete"] is True\n    assert verdict.details["verifier_repair_kind"] == "candidate_blind_dependency_format_repair"\n''',
              '''        side_effect=[\n            false_positive,\n            malformed_blind,\n            repaired_blind_without_duplicate_evidence,\n            repaired_blind_without_duplicate_evidence,\n        ],\n    ) as invoke:\n        verdict = ModelGoalAlignmentVerifier().verify(user_text=text, goals=goals, known_tools=set())\n    assert invoke.call_count == 4\n    assert verdict.exact\n    assert verdict.evidence_spans == ("查一下鼠标订单", "帮我申请退款")\n    assert verdict.details["dependency_graph_match"] is True\n    assert verdict.details["dependency_proof_complete"] is True\n    assert verdict.details["dependency_authority_state"] == "authoritative"\n    assert verdict.details["verifier_repair_kind"] == "candidate_blind_dependency_authority_closure"\n''',
              "attempt5 format repair then closure",
          )
          replace_once(
              attempt5,
              '''        "agent_core.model_calls.invoke_model", side_effect=[first, blind]\n    ) as invoke:\n        verdict = ModelGoalAlignmentVerifier().verify(user_text=text, goals=goals, known_tools=set())\n\n    assert invoke.call_count == 2\n''',
              '''        "agent_core.model_calls.invoke_model", side_effect=[first, blind, blind]\n    ) as invoke:\n        verdict = ModelGoalAlignmentVerifier().verify(user_text=text, goals=goals, known_tools=set())\n\n    assert invoke.call_count == 3\n''',
              "release43 closure call",
          )
          replace_once(
              attempt5,
              '''    assert verdict.details["dependency_mismatch_grounding"] == "machine_dependency_proof"\n    assert verdict.details["verifier_repair_kind"] == "candidate_blind_dependency_reaudit"\n\n    feedback = _alignment_repair_feedback(verdict)["independent_verifier_feedback"]\n''',
              '''    assert verdict.details["dependency_mismatch_grounding"] == "machine_dependency_proof"\n    assert verdict.details["dependency_authority_state"] == "authoritative"\n    assert verdict.details["dependency_challenge_required"] is False\n    assert verdict.details["verifier_repair_kind"] == "candidate_blind_dependency_authority_closure"\n\n    feedback = _alignment_repair_feedback(verdict)["independent_verifier_feedback"]\n''',
              "release43 mature repair authority",
          )

          attempt7 = ROOT / "services/agent-service/tests/runtime/test_wp08_attempt7_final_authority_and_retry.py"
          replace_once(
              attempt7,
              '''            "reason_code": "blind_shared_scope_independent",\n        }),\n    ]\n\n    with patch("agent_core.config.get_model", return_value=object()), patch(\n''',
              '''            "reason_code": "blind_shared_scope_independent",\n        }),\n    ]\n    responses.append(responses[1])  # explicit dependency-authority closure observation\n\n    with patch("agent_core.config.get_model", return_value=object()), patch(\n''',
              "attempt7 false edge closure response",
          )
          replace_once(
              attempt7,
              '''    assert invoke.call_count == 2\n    assert verdict.verdict == "incomplete"\n    assert verdict.reason_code == "goal_alignment_dependency_graph_mismatch"\n    assert verdict.missing_spans == ()\n    assert verdict.details["dependency_graph_match"] is False\n    assert verdict.details["dependency_edges"] == []\n    assert verdict.details["verifier_repair_kind"] == "candidate_blind_dependency_reaudit"\n''',
              '''    assert invoke.call_count == 3\n    assert verdict.verdict == "incomplete"\n    assert verdict.reason_code == "goal_alignment_dependency_graph_mismatch"\n    assert verdict.missing_spans == ()\n    assert verdict.details["dependency_graph_match"] is False\n    assert verdict.details["dependency_edges"] == []\n    assert verdict.details["dependency_authority_state"] == "authoritative"\n    assert verdict.details["verifier_repair_kind"] == "candidate_blind_dependency_authority_closure"\n''',
              "attempt7 false edge authority expectations",
          )
          marker = '''            "reason_code": "blind_true_result_reference",\n        }),\n    ]\n\n    with patch("agent_core.config.get_model", return_value=object()), patch(\n        "agent_core.model_calls.invoke_model", side_effect=responses\n    ):\n'''
          replacement = '''            "reason_code": "blind_true_result_reference",\n        }),\n    ]\n    responses.append(responses[1])  # explicit dependency-authority closure observation\n\n    with patch("agent_core.config.get_model", return_value=object()), patch(\n        "agent_core.model_calls.invoke_model", side_effect=responses\n    ) as invoke:\n'''
          # This marker appears only in the missing-edge test; the true-edge test uses named variables.
          replace_once(attempt7, marker, replacement, "attempt7 missing edge closure response")
          replace_once(
              attempt7,
              '''    assert verdict.verdict == "incomplete"\n    assert verdict.reason_code == "goal_alignment_dependency_graph_mismatch"\n    assert verdict.details["dependency_graph_match"] is False\n    assert verdict.details["dependency_edges"][0]["basis_span"] == "它"\n''',
              '''    assert invoke.call_count == 3\n    assert verdict.verdict == "incomplete"\n    assert verdict.reason_code == "goal_alignment_dependency_graph_mismatch"\n    assert verdict.details["dependency_graph_match"] is False\n    assert verdict.details["dependency_authority_state"] == "authoritative"\n    assert verdict.details["dependency_edges"][0]["basis_span"] == "它"\n''',
              "attempt7 missing edge authority expectations",
          )

          wp08 = ROOT / "skill-system/tests/test_wp08_final_product_closure_repair.py"
          replace_once(
              wp08,
              '''            "agent_core.model_calls.invoke_model", side_effect=[first, false_scope_claim, corrected]\n        ) as invoke:\n''',
              '''            "agent_core.model_calls.invoke_model", side_effect=[first, false_scope_claim, corrected, corrected]\n        ) as invoke:\n''',
              "wp08 scope correction closure response",
          )
          replace_once(
              wp08,
              '''        self.assertEqual(invoke.call_count, 3)\n        self.assertTrue(verdict.exact)\n        self.assertTrue(verdict.details["dependency_graph_match"])\n        self.assertEqual(verdict.details["dependency_edges"], [edge])\n        self.assertEqual(\n            verdict.details["verifier_repair_kind"],\n            "candidate_blind_dependency_scope_constraint_reaudit",\n        )\n        repair_message = invoke.call_args_list[2].kwargs["payload"][-1].content\n        self.assertIn("Object identity, member naming, ordinary target selection", repair_message)\n        self.assertIn("current-turn Goal result", repair_message)\n        self.assertIn("remain incomplete", repair_message)\n''',
              '''        self.assertEqual(invoke.call_count, 4)\n        self.assertTrue(verdict.exact)\n        self.assertTrue(verdict.details["dependency_graph_match"])\n        self.assertEqual(verdict.details["dependency_edges"], [edge])\n        self.assertEqual(verdict.details["dependency_authority_state"], "authoritative")\n        self.assertEqual(\n            verdict.details["verifier_repair_kind"],\n            "candidate_blind_dependency_authority_closure",\n        )\n        repair_message = invoke.call_args_list[2].kwargs["payload"][-1].content\n        self.assertIn("Object identity, member naming, ordinary target selection", repair_message)\n        self.assertIn("current-turn Goal result", repair_message)\n        self.assertIn("remain incomplete", repair_message)\n        closure_message = invoke.call_args_list[3].kwargs["payload"][-1].content\n        self.assertIn("complete/matching alone is not authority", closure_message)\n''',
              "wp08 scope correction authority expectations",
          )

          # Refresh all protected hashes after direct and carrier-driven edits.
          baseline_path = ROOT / "skill-system/registry/product-source-baseline.json"
          baseline = json.loads(baseline_path.read_text(encoding="utf-8"))
          files = dict(baseline.get("files") or {})
          for rel in list(files):
              candidate = ROOT / rel
              if candidate.is_file():
                  files[rel] = sha256(candidate.read_bytes()).hexdigest()
          baseline["files"] = dict(sorted(files.items()))
          baseline["file_count"] = len(files)
          baseline_path.write_text(
              json.dumps(baseline, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )

          carrier = ROOT / ".github/workflows/dependency-authority-v5-carrier.yml"
          carrier.unlink()
          PY

      - name: Compile changed Python
        run: |
          python -m py_compile \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py \
            services/agent-service/tests/runtime/test_wp08_attempt7_final_authority_and_retry.py \
            skill-system/tests/test_wp08_final_product_closure_repair.py

      - name: Commit alignment
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(semantic): migrate historical cases to authority lifecycle"
          git push origin HEAD:fix/proof-authority-lifecycle-20260816

      - name: Run focused historical and authority regressions
        shell: bash
        run: |
          cd services/agent-service
          export PYTHONPATH="$PWD/src"
          .venv/bin/python -B -m pytest -q -p no:cacheprovider \
            tests/runtime/test_dependency_proof_authority.py \
            tests/runtime/test_release47_dependency_repair_projection.py \
            tests/runtime/test_release52_dependency_independence_adjudication.py \
            tests/runtime/test_release53_blind_semantic_grounding_adjudication.py \
            tests/runtime/test_wp08_attempt5_dependency_authority.py \
            tests/runtime/test_wp08_attempt6_alignment_normalization.py \
            tests/runtime/test_wp08_attempt7_final_authority_and_retry.py \
            ../../skill-system/tests/test_semantic_dependency_repair_feedback.py \
            ../../skill-system/tests/test_wp08_final_product_closure_repair.py
