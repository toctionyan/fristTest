name: stage4k4-execute-bounded-composition-v2-once

on:
  push:
    branches:
      - feat/stage4k4-production-composition-disabled-20260814

permissions:
  contents: write

jobs:
  execute-validate-publish:
    if: github.repository == 'toctionyan/fristTest' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Stage4K4 branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: feat/stage4k4-production-composition-disabled-20260814

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt

      - name: Execute validate baseline and publish Stage4K4
        env:
          BASE_SHA: d6ba4b034bb677ddadc817f599dc3a536b976d12
          BRANCH: feat/stage4k4-production-composition-disabled-20260814
        run: |
          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import os
          import subprocess
          import sys
          import textwrap
          from datetime import datetime, timezone
          from pathlib import Path

          root = Path.cwd()
          base = os.environ['BASE_SHA']
          branch = os.environ['BRANCH']
          original_workflow = '.github/workflows/stage4k4-production-composition-finalize-once.yml'
          runner_workflow = '.github/workflows/stage4k4-execute-bounded-composition-v2-once.yml'
          expected_sources = {
              'services/agent-service/.env.example',
              'services/agent-service/app/services/agent_service.py',
              'services/agent-service/app/services/dependency_authority_composition.py',
              'services/agent-service/app/services/readiness_service.py',
              'services/agent-service/pyproject.toml',
              'services/agent-service/requirements.txt',
              'services/agent-service/src/agent_core/runtime/dependency_authority_control.py',
              'services/agent-service/src/agent_core/runtime/dependency_authority_persistent_control.py',
              'services/agent-service/src/agent_core/runtime/dependency_authority_signed_provider.py',
              'services/agent-service/tests/runtime/test_typed_goal_dependency_control_provider_contract.py',
              'services/agent-service/tests/runtime/test_typed_goal_dependency_persistent_control.py',
              'services/agent-service/tests/runtime/test_typed_goal_dependency_production_composition.py',
              'services/agent-service/tests/runtime/test_typed_goal_dependency_signed_provider.py',
              'services/agent-service/uv.lock',
          }

          def run(*args: str, cwd: Path | None = None) -> None:
              subprocess.run(list(args), cwd=cwd or root, check=True)

          run('git', 'merge-base', '--is-ancestor', base, 'HEAD')
          prestate = set(subprocess.check_output(
              ['git', 'diff', '--name-only', f'{base}..HEAD'], cwd=root, text=True
          ).splitlines())
          expected_prestate = {original_workflow, runner_workflow}
          if prestate != expected_prestate:
              raise SystemExit('unexpected_prestate:' + ','.join(sorted(prestate)))

          workflow_text = (root / original_workflow).read_text(encoding='utf-8')
          section = '      - name: Apply bounded Stage4K4 production-composition mutation\n'
          start_at = workflow_text.find(section)
          heredoc = "          python - <<'PY'\n"
          start = workflow_text.find(heredoc, start_at)
          end_marker = "\n          PY\n\n      - name: Refresh locked Agent dependency graph"
          end = workflow_text.find(end_marker, start)
          if start_at < 0 or start < 0 or end < 0:
              raise SystemExit('frozen_stage4k4_mutation_not_found')
          mutation = textwrap.dedent(workflow_text[start + len(heredoc):end])
          subprocess.run([sys.executable, '-'], cwd=root, input=mutation, text=True, check=True)

          test_path = root / 'services/agent-service/tests/runtime/test_typed_goal_dependency_production_composition.py'
          lines = test_path.read_text(encoding='utf-8').splitlines(keepends=True)
          needle = 'assert "signature" not in str(readiness)'
          matches = [index for index, line in enumerate(lines) if needle in line]
          if len(matches) != 1:
              raise SystemExit(f'expected_single_readiness_assertion:{len(matches)}')
          index = matches[0]
          indent = lines[index][: len(lines[index]) - len(lines[index].lstrip())]
          lines[index] = (
              f'{indent}assert "signature" not in readiness\n'
              f'{indent}assert readiness["signature_scheme"] == DEPENDENCY_AUTHORITY_ED25519_SIGNATURE_SCHEME\n'
          )
          test_path.write_text(''.join(lines), encoding='utf-8')

          agent_root = root / 'services/agent-service'
          run('uv', 'lock', cwd=agent_root)
          run('uv', 'sync', '--locked', '--all-groups', cwd=agent_root)
          run(
              str(agent_root / '.venv/bin/python'), '-B', '-m', 'pytest', '-q',
              'tests/runtime/test_typed_goal_dependency_production_composition.py',
              'tests/runtime/test_typed_goal_dependency_control_provider_contract.py',
              'tests/runtime/test_typed_goal_dependency_signed_provider.py',
              'tests/runtime/test_typed_goal_dependency_persistent_control.py',
              'tests/runtime/test_typed_goal_dependency_activation_ingress.py',
              'tests/runtime/test_pretool_execution_policy.py',
              cwd=agent_root,
          )

          changed = {
              raw[3:]
              for raw in subprocess.check_output(
                  ['git', 'status', '--short'], cwd=root, text=True
              ).splitlines()
              if raw.strip()
          }
          if changed != expected_sources:
              raise SystemExit('unexpected_stage4k4_source_delta:' + ','.join(sorted(changed)))
          run('git', 'diff', '--check')

          run('git', 'config', 'user.name', 'github-actions[bot]')
          run('git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com')
          run('git', 'add', '--', *sorted(expected_sources))
          run('git', 'diff', '--cached', '--check')
          run('git', 'commit', '-m', 'Stage4K4: wire persistent control behind default-disabled composition')
          source_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], cwd=root, text=True).strip()

          baseline_path = root / 'skill-system/registry/product-source-baseline.json'
          payload = json.loads(baseline_path.read_text(encoding='utf-8'))
          previous = {str(k): str(v) for k, v in (payload.get('files') or {}).items()}
          if int(payload.get('file_count') or 0) != 601 or len(previous) != 601:
              raise SystemExit(f"unexpected_previous_baseline:{payload.get('file_count')}/{len(previous)}")
          protected_roots = tuple(str(v) for v in payload.get('protected_roots') or ())
          if protected_roots != ('services', 'web', 'contracts'):
              raise SystemExit(f'unexpected_protected_roots:{protected_roots!r}')

          raw = subprocess.check_output(
              ['git', 'ls-files', '-z', '--', *protected_roots], cwd=root
          )
          tracked = sorted(item.decode('utf-8') for item in raw.split(b'\0') if item)
          current = {
              relative: hashlib.sha256((root / relative).read_bytes()).hexdigest()
              for relative in tracked
          }
          changed_existing = {
              path for path in set(current) & set(previous)
              if current[path] != previous[path]
          }
          added = set(current) - set(previous)
          removed = set(previous) - set(current)
          expected_existing = expected_sources & set(previous)
          expected_added = expected_sources - set(previous)
          if changed_existing != expected_existing:
              raise SystemExit('unexpected_changed_existing:' + ','.join(sorted(changed_existing)))
          if added != expected_added:
              raise SystemExit('unexpected_added:' + ','.join(sorted(added)))
          if removed:
              raise SystemExit('unexpected_removed:' + ','.join(sorted(removed)))
          if len(current) != 603 or len(expected_added) != 2:
              raise SystemExit(f'unexpected_protected_file_count:{len(current)}')

          payload['file_count'] = len(current)
          payload['files'] = dict(sorted(current.items()))
          payload['generated_at'] = datetime.now(timezone.utc).replace(
              microsecond=0
          ).isoformat().replace('+00:00', 'Z')
          payload['generated_from'] = 'git:' + source_sha
          baseline_path.write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + '\n',
              encoding='utf-8',
          )
          run(sys.executable, 'skill-system/tests/test_product_source_baseline_binding.py')
          run('git', 'add', 'skill-system/registry/product-source-baseline.json')
          run('git', 'diff', '--cached', '--check')
          run('git', 'commit', '-m', 'Refresh Stage4K4 production-composition protected baseline')
          run('git', 'push', 'origin', f'HEAD:{branch}')
          print(json.dumps({
              'status': 'PASS',
              'source_sha': source_sha,
              'published_sha': subprocess.check_output(
                  ['git', 'rev-parse', 'HEAD'], cwd=root, text=True
              ).strip(),
              'protected_file_count': len(current),
          }, indent=2))
          PY
