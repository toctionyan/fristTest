name: one-time-diagnose-latest-release-20260801-2050

"on":
  push:
    branches:
      - agent/diagnose-latest-release-20260801-2050
    paths:
      - .github/diagnostics/latest-release-trigger.txt

permissions:
  actions: read
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
      - name: Read latest release and repair workflow runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/diagnostics
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/release.yml/runs?per_page=10" > /tmp/release-runs.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=agent%2Fpreserve-real-model-failure-evidence&per_page=30" > /tmp/repair-runs.json
          release_id="$(jq -r '.workflow_runs[0].id // empty' /tmp/release-runs.json)"
          if [ -n "$release_id" ]; then
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${release_id}/jobs?per_page=100" > /tmp/release-jobs.json
          else
            printf '{"jobs":[]}' > /tmp/release-jobs.json
          fi
          jq -n \
            --argjson release_runs "$(jq '.workflow_runs' /tmp/release-runs.json)" \
            --argjson release_jobs "$(jq '.jobs' /tmp/release-jobs.json)" \
            --argjson repair_runs "$(jq '.workflow_runs' /tmp/repair-runs.json)" \
            '{release_runs:$release_runs,release_jobs:$release_jobs,repair_runs:$repair_runs}' \
            > .github/diagnostics/latest-release-run.json
      - name: Commit diagnostic result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/diagnostics/latest-release-run.json
          git commit -m "Record release and repair workflow state" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
