name: tmp-wp08-topology-fixture-repair

on:
  push:
    branches:
      - fix/wp08-single-authority-cutover-20260813

permissions:
  contents: write

jobs:
  validate-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/wp08-single-authority-cutover-20260813
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Apply canonical planner fixture repair
        run: python .github/tmp/wp08_topology_fixture_repair.py
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Re-run exact failed systemic gate surface
        run: >-
          cd services/agent-service && PYTHONPATH=src .venv/bin/python -m pytest
          tests/context/test_conversation_protocol.py
          tests/runtime/test_goal_evidence_satisfaction.py
          tests/context/test_scenario_topology.py
          tests/architecture/test_systemic_operational_closure.py -q
      - name: Re-run semantic authority and adversarial regressions
        run: >-
          cd services/agent-service && PYTHONPATH=src .venv/bin/python -m pytest
          tests/runtime/test_wp08_attempt3_single_authority_repairs.py
          tests/runtime/test_semantic_reference_binding.py
          tests/runtime/test_semantic_output_coverage.py
          tests/runtime/test_deterministic_target_compiler.py
          tests/runtime/test_execution_target_authority_cutover.py
          tests/runtime/test_goal_binding_counterexamples.py -q
      - name: Validate Skill control plane
        run: services/agent-service/.venv/bin/python -B skill-system/controller/profile_runner.py skill-control-plane
      - name: Publish validated fixture repair and remove temporary carrier
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/agent-service/tests/context/test_scenario_topology.py
          git add skill-system/registry/product-source-baseline.json
          git rm .github/tmp/wp08_topology_fixture_repair.py
          git rm .github/workflows/tmp-wp08-topology-fixture-repair.yml
          git diff --cached --check
          git commit -m "Update scripted planner fixture to canonical semantic output"
          git push origin HEAD:fix/wp08-single-authority-cutover-20260813
