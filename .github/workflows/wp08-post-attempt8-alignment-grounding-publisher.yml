name: wp08-post-attempt8-alignment-grounding-publisher

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  publish-stage1:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-post-attempt8-alignment-grounding-publisher-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BASE_SHA: 1ed0be9a2ad0965813142c532df3d13bb1b225e1
      FORMAL_BRANCH: agent/wp08-post-final-attempt8-alignment-grounding-repair-20260810
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Checkout carrier helpers
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: carrier
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout exact failed final Attempt-8 main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.BASE_SHA }}
          path: candidate
          fetch-depth: 1
          persist-credentials: true

      - name: Set up governed Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false

      - name: Verify exact repair authority and install locked Agent environment
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C candidate rev-parse HEAD)" = "$BASE_SHA"
          test "$(git -C candidate ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test -z "$(git -C candidate ls-remote origin refs/heads/$FORMAL_BRANCH | awk '{print $1}')"
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check --require-hashes --only-binary=:all: -r candidate/deployment/ci/uv-requirements-linux-x86_64.txt
          (cd candidate/services/agent-service && uv sync --locked --all-groups)

      - name: Apply bounded alignment grounding repair and focused regressions
        shell: bash
        run: |
          set -euo pipefail
          "${pythonLocation}/bin/python" -B carrier/.github/wp08-post-attempt8-alignment-grounding-fix.py
          "${pythonLocation}/bin/python" -B carrier/.github/wp08-post-attempt8-alignment-grounding-tests.py
          git -C candidate diff --check
          "${pythonLocation}/bin/python" -m py_compile \
            candidate/services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            candidate/services/agent-service/scripts/verify_preprod_conversation_smoke.py \
            candidate/skill-system/tests/test_wp08_post_final_attempt8_alignment_grounding.py
          cd candidate
          services/agent-service/.venv/bin/python -B -m pytest -q \
            skill-system/tests/test_wp08_post_final_attempt8_alignment_grounding.py \
            skill-system/tests/test_wp08_new_release_attempt4_repair.py \
            skill-system/tests/test_wp08_new_release_attempt5_semantic_boundary.py \
            skill-system/tests/test_wp08_attempt7_root_fixes.py
          cd services/agent-service
          PYTHONPATH="$PWD:$PWD/src" .venv/bin/python -B -m pytest -q \
            tests/runtime/test_b15b1_real_model_semantic_identity_boundary.py \
            tests/context/test_semantic_goal_coverage_suite_execution.py
          grep -F 'model_call_scope(max_calls=120, scope="preprod_semantic_goal_prototypes")' scripts/verify_preprod_conversation_smoke.py
          grep -F '{ timeout: 120_000 }' frontend/e2e/strong_context_journey.mjs

      - name: Prove exact Stage-1 delta
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          git add -N skill-system/tests/test_wp08_post_final_attempt8_alignment_grounding.py
          printf '%s\n' \
            services/agent-service/scripts/verify_preprod_conversation_smoke.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            skill-system/tests/test_wp08_post_final_attempt8_alignment_grounding.py | sort > /tmp/expected-stage1.txt
          git diff --name-only "$BASE_SHA" -- | sort > /tmp/actual-stage1.txt
          diff -u /tmp/expected-stage1.txt /tmp/actual-stage1.txt
          git diff --check "$BASE_SHA" --

      - name: Publish formal post-Attempt8 repair without authorizing a new ReleaseRun
        shell: bash
        run: |
          set -euo pipefail
          cd candidate
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$BASE_SHA"
          test -z "$(git ls-remote origin refs/heads/$FORMAL_BRANCH | awk '{print $1}')"
          git config user.name 'customer-agent-governance[bot]'
          git config user.email 'customer-agent-governance[bot]@users.noreply.github.com'
          git add \
            services/agent-service/scripts/verify_preprod_conversation_smoke.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            skill-system/tests/test_wp08_post_final_attempt8_alignment_grounding.py
          git diff --cached --check
          git commit -m 'Repair final Attempt 8 alignment grounding authority'
          git push origin HEAD:refs/heads/$FORMAL_BRANCH
          git rev-parse HEAD
