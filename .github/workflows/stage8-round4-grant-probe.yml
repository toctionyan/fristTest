name: Temporary Stage 8 Grant Lifecycle Authority Probe

"on":
  push:
    branches: [fix/proof-authority-lifecycle-20260816]

permissions:
  contents: read

jobs:
  stage8-grant-probe:
    if: "${{ github.event.head_commit.message == 'test: probe Stage 8 grant lifecycle authority' }}"
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Materialize Grant adversarial probes
        run: |
          cat > services/agent-service/tests/_stage8_grant_probe.py <<'PY'
          from __future__ import annotations

          from pathlib import Path

          from agent_core.ledger import offer_entry
          from agent_core.persistence.action_lifecycle_store import TransactionLifecycleStore
          from agent_core.transaction import transition_draft
          from agent_core.transaction.coordinator import issue_grant_for_authority, reserve_grant_and_start_attempt

          SCOPE = {"tenant_id": "tenant-a", "user_id": "u001", "thread_id": "stage8-grant"}


          def _offer() -> dict:
              row = offer_entry(
                  action_id="create_refund", operation="APPLY_REFUND",
                  target_handle="artifact:order:10002",
                  input_values={"reason": "质量问题", "expected_version": 1},
                  preview={"decision": "ALLOWED", "snapshot": {"version": 1}},
                  scope=SCOPE, turn=4, label="退款申请",
                  handle="draft:refund:stage8-grant",
              )
              row = transition_draft(row, "AWAITING_AUTHORIZATION")
              row.update({
                  "authority_protocol": "ui-authority@1",
                  "authority_requirement": "ui_action_authority",
                  "authority_revision": 4,
                  "confirmation_id": "confirm-stage8-grant",
                  "confirmation_version": 1,
              })
              return row


          def _state(store):
              return {
                  "current_tenant_id": SCOPE["tenant_id"],
                  "current_user_id": SCOPE["user_id"],
                  "current_thread_id": SCOPE["thread_id"],
                  "_transaction_repository": store,
              }


          def _start(store, *, client_id: str = "client-stage8-grant"):
              offer = _offer()
              state = _state(store)
              authority = issue_grant_for_authority(
                  state=state, offer=offer,
                  authority={
                      "actor_id": SCOPE["user_id"], "actor_role": "customer",
                      "client_request_id": client_id, "authority_type": "ui_confirmed",
                  },
              )
              reservation, started = reserve_grant_and_start_attempt(state=state, offer=offer, authority=authority)
              assert reservation["reserved"] is True and started["created"] is True
              return offer, state, authority, started["attempt"]


          def _success_receipt(store, offer, attempt, *, suffix: str = "ok"):
              attempt_id = str(attempt["attempt_id"])
              result = {"success": True, "data": {"refund_id": f"R-{suffix}"}}
              handle = f"h_receipt:{suffix}"
              receipt = store.record_receipt(
                  receipt_id=f"receipt-{suffix}", tenant_id=SCOPE["tenant_id"], user_id=SCOPE["user_id"],
                  thread_id=SCOPE["thread_id"], draft_id=offer["draft_id"], attempt_id=attempt_id,
                  receipt_handle=handle, receipt_state="SUCCESS", business_result=result,
                  business_resource_id=f"R-{suffix}",
              )
              store.transition_attempt(attempt_id, state="ACKED", business_result=result, receipt_handle=handle)
              return receipt


          def test_revoked_grant_cannot_be_consumed(tmp_path: Path) -> None:
              store = TransactionLifecycleStore(tmp_path / "revoked.db")
              offer = _offer()
              state = _state(store)
              authority = issue_grant_for_authority(
                  state=state, offer=offer,
                  authority={"actor_id": "u001", "actor_role": "customer", "client_request_id": "revoked", "authority_type": "ui_confirmed"},
              )
              grant_id = str(authority["grant_id"])
              store.revoke_grant(grant_id, reason="cancelled")
              assert store.get_grant(grant_id)["state"] == "REVOKED"
              store.consume_grant(grant_id, attempt_id="attempt-late", receipt_handle="h_receipt:late")
              grant = store.get_grant(grant_id)
              assert grant["state"] == "REVOKED"
              assert not grant.get("consumed_at")


          def test_issued_grant_cannot_skip_attempt_and_receipt(tmp_path: Path) -> None:
              store = TransactionLifecycleStore(tmp_path / "issued.db")
              offer = _offer()
              state = _state(store)
              authority = issue_grant_for_authority(
                  state=state, offer=offer,
                  authority={"actor_id": "u001", "actor_role": "customer", "client_request_id": "issued", "authority_type": "ui_confirmed"},
              )
              grant_id = str(authority["grant_id"])
              assert store.get_grant(grant_id)["state"] == "ISSUED"
              store.consume_grant(grant_id, attempt_id="attempt-never-created", receipt_handle="h_receipt:none")
              grant = store.get_grant(grant_id)
              assert grant["state"] == "ISSUED"
              assert not grant.get("consumed_at")


          def test_reserved_grant_requires_exact_acked_attempt_and_success_receipt(tmp_path: Path) -> None:
              store = TransactionLifecycleStore(tmp_path / "binding.db")
              offer, _state_value, authority, attempt = _start(store, client_id="binding")
              grant_id = str(authority["grant_id"])
              attempt_id = str(attempt["attempt_id"])
              assert store.get_grant(grant_id)["state"] == "RESERVED"

              store.consume_grant(grant_id, attempt_id="attempt-wrong", receipt_handle="h_receipt:wrong")
              assert store.get_grant(grant_id)["state"] == "RESERVED"

              receipt = _success_receipt(store, offer, attempt, suffix="binding")
              store.consume_grant(grant_id, attempt_id=attempt_id, receipt_handle="h_receipt:wrong")
              assert store.get_grant(grant_id)["state"] == "RESERVED"

              store.consume_grant(grant_id, attempt_id=attempt_id, receipt_handle=str(receipt["receipt_handle"]))
              grant = store.get_grant(grant_id)
              assert grant["state"] == "CONSUMED"
              assert grant["attempt_id"] == attempt_id
              assert grant["receipt_handle"] == receipt["receipt_handle"]


          def test_consumed_grant_is_idempotent_and_binding_immutable(tmp_path: Path) -> None:
              store = TransactionLifecycleStore(tmp_path / "consumed.db")
              offer, _state_value, authority, attempt = _start(store, client_id="consumed")
              receipt = _success_receipt(store, offer, attempt, suffix="consumed")
              grant_id = str(authority["grant_id"])
              attempt_id = str(attempt["attempt_id"])
              handle = str(receipt["receipt_handle"])
              store.consume_grant(grant_id, attempt_id=attempt_id, receipt_handle=handle)
              first = dict(store.get_grant(grant_id))
              store.consume_grant(grant_id, attempt_id=attempt_id, receipt_handle=handle)
              second = dict(store.get_grant(grant_id))
              assert second["state"] == "CONSUMED"
              assert second["attempt_id"] == first["attempt_id"] == attempt_id
              assert second["receipt_handle"] == first["receipt_handle"] == handle

              store.consume_grant(grant_id, attempt_id="attempt-other", receipt_handle="h_receipt:other")
              final = store.get_grant(grant_id)
              assert final["state"] == "CONSUMED"
              assert final["attempt_id"] == attempt_id
              assert final["receipt_handle"] == handle


          def test_reconciliation_style_success_can_consume_only_after_receipt_and_ack(tmp_path: Path) -> None:
              store = TransactionLifecycleStore(tmp_path / "ordering.db")
              offer, _state_value, authority, attempt = _start(store, client_id="ordering")
              grant_id = str(authority["grant_id"])
              attempt_id = str(attempt["attempt_id"])
              store.consume_grant(grant_id, attempt_id=attempt_id, receipt_handle="h_receipt:not-yet")
              assert store.get_grant(grant_id)["state"] == "RESERVED"
              receipt = _success_receipt(store, offer, attempt, suffix="ordering")
              store.consume_grant(grant_id, attempt_id=attempt_id, receipt_handle=str(receipt["receipt_handle"]))
              assert store.get_grant(grant_id)["state"] == "CONSUMED"
          PY
      - name: Run Grant lifecycle probes
        working-directory: services/agent-service
        env:
          PYTHONPATH: src
          APP_PROFILE: local
        run: .venv/bin/python -B -m pytest tests/_stage8_grant_probe.py -q
