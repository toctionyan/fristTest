name: temporary-zero-anaphora-target-repair-v2

on:
  push:
    branches:
      - fix/semantic-zero-anaphora-target-identity-20260815
    paths:
      - .github/zero-anaphora-target-repair-v2.trigger

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/semantic-zero-anaphora-target-identity-20260815
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
          check-latest: false
      - name: Patch shared-target semantic invariant
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"replacement_count:{path}:{count}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          protocol = "services/agent-service/src/agent_core/lifecycle/protocol.py"
          replace_once(
              protocol,
              "同一原话前文已明确对象或范围、后文真正省略重复对象（零指代）时继承该已明示范围，不依赖前一个 Goal 的执行结果；但后文若出现显式指代表达并指向前一个 Goal 尚未产生的本轮结果",
              "同一原话前文已明确对象或范围、后文真正省略重复对象（零指代）时继承该已明示范围，不依赖前一个 Goal 的执行结果；这种同轮继承不要求后一个 Goal 把前一个 Goal 的目标词复制进自己的局部 evidence_span，也不得把对象/成员名称伪装成 target_candidate.scope_constraints；局部 evidence_span 证明本 Goal 的业务效果，完整 USER_TEXT 中已明示的共享目标身份仍属于同轮语义上下文。只有真正缩小目标/结果人口的筛选、状态、阈值或比较才属于 scope_constraints；但后文若出现显式指代表达并指向前一个 Goal 尚未产生的本轮结果",
          )
          replace_once(
              protocol,
              "同一原话前文已明确业务对象或范围而后文真正省略重复对象（零指代）时，应继承该明示范围；这不是对前一个 Goal 执行结果的依赖。执行时若仍需一次读取把该描述解析成稳定 ID/artifact handle，那只是支持步骤，不能反向制造 depends_on。判断依赖必须做结果反事实：",
              "同一原话前文已明确业务对象或范围而后文真正省略重复对象（零指代）时，应继承该明示范围；这不是对前一个 Goal 执行结果的依赖。后一个 Goal 的 evidence_span 仍保持分支局部，不必重复前文目标身份；对象/成员名称属于目标身份而不是人口筛选，不能因为被零指代继承就要求写进 target_candidate.scope_constraints。执行时若仍需一次读取把该描述解析成稳定 ID/artifact handle，那只是支持步骤，不能反向制造 depends_on。判断依赖必须做结果反事实：",
          )

          planning = "services/agent-service/src/agent_core/lifecycle/goal_planning.py"
          replace_once(
              planning,
              '            "when a later outcome genuinely omits its repeated target but an earlier phrase in the same current user turn already names the reusable business object or scope, inherit that stated scope as zero-anaphora ellipsis; that shared scope is not a dependency on the earlier Goal result by itself, but this rule does not apply when the later outcome explicitly refers to the earlier current-turn result",\n',
              '            "when a later outcome genuinely omits its repeated target but an earlier phrase in the same current user turn already names the reusable business object or scope, inherit that stated scope as zero-anaphora ellipsis; that shared scope is not a dependency on the earlier Goal result by itself, but this rule does not apply when the later outcome explicitly refers to the earlier current-turn result",\n            "Goal evidence_span remains branch-local: a later independent Goal may inherit a same-turn target identity from the complete USER_TEXT without duplicating that earlier target phrase inside its own evidence_span or target_candidate.scope_constraints. Object/member identity is not a population-narrowing predicate, so never report an inherited identity phrase as missing target-scope-constraint coverage; only an actual filter, status predicate, threshold or comparison belongs in scope_constraints",\n',
          )
          replace_once(
              planning,
              '            "Mere object/topic/member naming is target identity, not automatically a scope constraint. Goal.condition is a "\n',
              '            "Mere object/topic/member naming is target identity, not automatically a scope constraint. This remains true for same-turn zero-anaphora: an identity stated in an earlier sibling phrase may be inherited by a later independent Goal from the complete USER_TEXT without duplication in that Goal local evidence_span or scope_constraints. Never report such inherited identity text as a target-scope-constraint missing span; only a real population-narrowing predicate belongs there. Goal.condition is a "\n',
          )
          replace_once(
              planning,
              '            "shared object/topic/scope and sequencing words alone never create a result dependency",\n            "use the result counterfactual for every pair:',
              '            "shared object/topic/scope and sequencing words alone never create a result dependency",\n            "same-turn zero-anaphora may inherit a target identity named in another local branch of the complete USER_TEXT; keep each Goal evidence_span local, do not require that identity to be duplicated into scope_constraints, and never classify object/member identity itself as target-scope-constraint coverage",\n            "use the result counterfactual for every pair:',
          )
          replace_once(
              planning,
              '                    "scope constraints. If a semantic-field mismatch exists, return verdict=incomplete and copy its smallest literal "\n',
              '                    "scope constraints. A same-turn target identity inherited by zero-anaphora from another local USER_TEXT branch is still target identity: do not demand it inside the later Goal evidence_span or scope_constraints, and never emit that identity phrase as a target-scope-constraint missing span. If a semantic-field mismatch exists, return verdict=incomplete and copy its smallest literal "\n',
          )

          smoke = "services/agent-service/scripts/verify_preprod_conversation_smoke.py"
          replace_once(
              smoke,
              '            "多目标时，每个 Goal 的 evidence_span 必须只覆盖该 Goal 的局部连续原文，不能把整句或兄弟 Goal 的文字重复给多个 Goal。"\n',
              '            "多目标时，每个 Goal 的 evidence_span 必须只覆盖该 Goal 的局部连续原文，不能把整句或兄弟 Goal 的文字重复给多个 Goal。局部 evidence_span 只证明该 Goal 的业务效果；若后续独立 Goal 以零指代继承同句前文已经明示的目标身份，不要求把前文目标词复制进后续 evidence_span，也不得把对象/成员身份伪装成 target_candidate.scope_constraints。只有真正缩小目标/结果人口的筛选、状态、阈值或比较才属于 scope_constraints；完整用户原话中的共享目标身份仍可直接作为同轮语义上下文。"\n',
          )

          dep_test = "services/agent-service/tests/runtime/test_semantic_dependency_counterfactual_contract.py"
          replace_once(
              dep_test,
              '    assert "再/然后/另外" in description\n',
              '    assert "再/然后/另外" in description\n    assert "evidence_span 仍保持分支局部" in description\n    assert "对象/成员名称属于目标身份而不是人口筛选" in description\n',
          )

          authority_test = "services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py"
          replace_once(
              authority_test,
              '    second_payload = str(invoke.call_args_list[1].kwargs["payload"])\n    assert \'"depends_on"\' not in second_payload\n',
              '    second_payload = str(invoke.call_args_list[1].kwargs["payload"])\n    assert \'"depends_on"\' not in second_payload\n    assert "same-turn zero-anaphora" in second_payload\n    assert "Never report such inherited identity text as a target-scope-constraint missing span" in second_payload\n',
          )
          replace_once(
              authority_test,
              '    assert verdict.details["verifier_repair_kind"] == "candidate_blind_dependency_format_repair"\n\n\ndef test_unproposed_refund_dependency_requires_candidate_blind_confirmation()',
              '    assert verdict.details["verifier_repair_kind"] == "candidate_blind_dependency_format_repair"\n    third_payload = str(invoke.call_args_list[2].kwargs["payload"])\n    assert "same-turn target identity inherited by zero-anaphora" in third_payload\n    assert "never emit that identity phrase as a target-scope-constraint missing span" in third_payload\n\n\ndef test_unproposed_refund_dependency_requires_candidate_blind_confirmation()',
          )

          trigger = Path(".github/release-trigger")
          trigger.write_text(
              "release_request: 2026-08-15T14:17:00+08:00\n"
              "provider: deepseek\n"
              "model: deepseek-v4-flash\n"
              "embedding_model: text-embedding-v4\n"
              "embedding_dimension: 1024\n"
              "reason: rerun protected release after zero-anaphora target-identity verifier repair\n",
              encoding="utf-8",
          )
          PY
      - name: Refresh protected product-source baseline via repo authority
        shell: bash
        run: |
          python3 -B scripts/refresh_product_source_baseline.py --workspace . --generated-from-sha "${GITHUB_SHA}"
      - name: Run focused semantic regressions
        shell: bash
        env:
          PYTHONPATH: services/agent-service/src
        run: |
          python3 -m pip install --disable-pip-version-check uv==0.11.29
          (cd services/agent-service && uv sync --locked --all-groups)
          services/agent-service/.venv/bin/python -B -m pytest -q -p no:cacheprovider \
            services/agent-service/tests/runtime/test_semantic_dependency_counterfactual_contract.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py
          python3 -B -m pytest -q -p no:cacheprovider skill-system/tests/test_product_source_baseline_binding.py
      - name: Publish governed repair commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/release-trigger \
            services/agent-service/src/agent_core/lifecycle/protocol.py \
            services/agent-service/src/agent_core/lifecycle/goal_planning.py \
            services/agent-service/scripts/verify_preprod_conversation_smoke.py \
            services/agent-service/tests/runtime/test_semantic_dependency_counterfactual_contract.py \
            services/agent-service/tests/runtime/test_wp08_attempt5_dependency_authority.py \
            skill-system/registry/product-source-baseline.json
          git diff --cached --quiet && { echo "no repair delta"; exit 1; }
          git commit -m "fix(semantic): preserve zero-anaphora target identity"
          git push origin HEAD:fix/semantic-zero-anaphora-target-identity-20260815
