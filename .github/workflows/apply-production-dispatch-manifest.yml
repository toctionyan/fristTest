name: Apply Production Dispatch Manifest

"on":
  pull_request:
    branches:
      - main
    paths:
      - scripts/apply_production_dispatch_manifest.py
      - .github/workflows/apply-production-dispatch-manifest.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Rebuild exact managed manifest
        run: "${pythonLocation}/bin/python -B scripts/apply_production_dispatch_manifest.py"
      - name: Commit clean protected dispatch tree
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Register protected production dispatch request boundary"
          git push origin HEAD:${{ github.head_ref }}
