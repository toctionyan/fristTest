name: wp08-attempt7-unsupported-frontier-carrier

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'wp08-attempt7-final-repair-20260810' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: wp08-attempt7-final-repair-20260810
          fetch-depth: 1
      - name: Apply unsupported-frontier classification fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runtime = Path('services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py')
          text = runtime.read_text()
          needle = '        if str(name) and str(name) not in TERMINAL_TOOL_NAMES\n'
          replacement = '''        if str(name)
                  and str(name) not in TERMINAL_TOOL_NAMES
                  and (
                      (contract := capability_registry.contract_for_tool(str(name))) is not None
                      and contract.execution_kind != "unsupported"
                  )
          '''
          if text.count(needle) != 1:
              raise SystemExit(f'runtime frontier condition count={text.count(needle)}')
          runtime.write_text(text.replace(needle, replacement, 1))

          test = Path('services/agent-service/tests/runtime/test_wp08_attempt7_final_repair.py')
          text = test.read_text()
          old = '''class _Registry:
              def contract_for_tool(self, _name: str):
                  return None
          '''
          new = '''class _Registry:
              def contract_for_tool(self, name: str):
                  if name == "report_unsupported_request":
                      return SimpleNamespace(execution_kind="unsupported")
                  if name == "get_order_details":
                      return SimpleNamespace(execution_kind="grounding_read")
                  return None
          '''
          if old not in text:
              raise SystemExit('test registry anchor not found')
          test.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff -- services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py services/agent-service/tests/runtime/test_wp08_attempt7_final_repair.py
          git add services/agent-service/src/agent_core/lifecycle/dialogue_runtime.py services/agent-service/tests/runtime/test_wp08_attempt7_final_repair.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: exclude unsupported reporter from workflow repair frontier'
          git push origin HEAD:wp08-attempt7-final-repair-20260810
