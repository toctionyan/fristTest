name: temporary-v20.18-scope-adjudication-repair

on:
  push:
    branches:
      - fix/v20.18-goal-scope-target-binding-20260813
    paths:
      - .github/workflows/tmp-v20.18-scope-adjudication-repair.yml

permissions:
  contents: write

jobs:
  apply-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/v20.18-goal-scope-target-binding-20260813
          fetch-depth: 1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12.13'
      - name: Apply repair
        run: python scripts/tmp_apply_v20_18_scope_repair.py
      - name: Syntax and diff checks
        run: |
          python -m py_compile services/agent-service/src/agent_core/lifecycle/protocol.py services/agent-service/src/agent_core/lifecycle/goal_planning.py skill-system/tests/test_v20_18_scope_identity_adjudication.py
          git diff --check
          git status --short
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Repair V20.18 scope identity semantic adjudication"
          git push origin HEAD:fix/v20.18-goal-scope-target-binding-20260813
