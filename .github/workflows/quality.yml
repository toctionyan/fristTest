name: quality

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  GH_REPO: ${{ github.repository }}

jobs:
  skill-control-plane:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Install locked Agent validation environment
        run: cd services/agent-service && uv sync --locked --all-groups
      - name: Validate Skill control plane
        run: |
          set -o pipefail
          services/agent-service/.venv/bin/python -B \
            skill-system/controller/profile_runner.py skill-control-plane \
            2>&1 | tee "${RUNNER_TEMP}/skill-control-plane.log"
      - name: Upload Skill control-plane evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: skill-control-plane-evidence
          path: ${{ runner.temp }}/skill-control-plane.log
          if-no-files-found: warn
      - name: Validate quality toolchain authority
        run: >-
          services/agent-service/.venv/bin/python -B scripts/quality_toolchain_contract.py
          --workspace-root . --static-only

  quality-static:
    needs: skill-control-plane
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - name: Create static quality target
        env:
          QUALITY_TARGET: ${{ github.workspace }}/.quality/targets/quality-target-static.md
        run: '"${pythonLocation}/bin/python" -B scripts/create_ci_quality_target.py --output "$QUALITY_TARGET" --ref "${{ github.sha }}" --workflow quality-static'
      - name: Run static quality gates
        env:
          QUALITY_EVIDENCE_DIR: ${{ runner.temp }}/quality-evidence/static
          QUALITY_TARGET: ${{ github.workspace }}/.quality/targets/quality-target-static.md
        run: '"${pythonLocation}/bin/python" -B scripts/quality_loop.py --mode static --target "$QUALITY_TARGET"'
      - name: Upload static evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-static-evidence
          path: |
            ${{ runner.temp }}/quality-evidence/static
            ${{ github.workspace }}/.quality/targets/quality-target-static.md
            ${{ github.workspace }}/.quality/targets/quality-target-static.claims.json

  quality-quick-execution:
    needs: quality-static
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Validate locked runtime toolchain
        env:
          QUALITY_TOOLCHAIN_RESULT: ${{ runner.temp }}/quality-toolchain-quality-quick.json
        run: >-
          "${pythonLocation}/bin/python" -B scripts/quality_toolchain_contract.py
          --workspace-root . --runtime-only --output "$QUALITY_TOOLCHAIN_RESULT"
      - name: Install locked Python environments
        run: |
          cd services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups
          cd ../agent-service/frontend && npm ci --ignore-scripts=false
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Create quick quality target
        env:
          QUALITY_TARGET: ${{ github.workspace }}/.quality/targets/quality-target-quick.md
        run: '"${pythonLocation}/bin/python" -B scripts/create_ci_quality_target.py --output "$QUALITY_TARGET" --ref "${{ github.sha }}" --workflow quality-quick --claims-source governance/claims/v20.6.2-project-quick-certification.json'
      - name: Run unit, contract and frontend gates
        env:
          QUALITY_EVIDENCE_DIR: ${{ runner.temp }}/quality-evidence/quick
          QUALITY_TARGET: ${{ github.workspace }}/.quality/targets/quality-target-quick.md
        run: services/agent-service/.venv/bin/python -B scripts/quality_loop.py --mode quick --target "$QUALITY_TARGET"
      - name: Upload quick evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-quick-evidence
          path: |
            ${{ runner.temp }}/quality-evidence/quick
            ${{ github.workspace }}/.quality/targets/quality-target-quick.md
            ${{ github.workspace }}/.quality/targets/quality-target-quick.claims.json
            ${{ runner.temp }}/quality-toolchain-quality-quick.json

  quality-quick-required-status:
    if: ${{ always() && github.event_name == 'pull_request' }}
    needs:
      - quality-static
      - quality-quick-execution
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    steps:
      - name: Publish stable quality-quick status for the exact PR head
        env:
          GH_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TEST_MERGE_SHA: ${{ github.sha }}
          STATIC_RESULT: ${{ needs.quality-static.result }}
          QUICK_RESULT: ${{ needs.quality-quick-execution.result }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          [[ "${PR_HEAD_REPOSITORY}" == "${GITHUB_REPOSITORY}" ]] || {
            echo "::error::stable required status is fail-closed for fork pull requests"
            exit 1
          }
          [[ "${PR_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${PR_BASE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${TEST_MERGE_SHA}" =~ ^[0-9a-f]{40}$ ]]

          gh api "repos/${GITHUB_REPOSITORY}/git/commits/${TEST_MERGE_SHA}" > merge-identity.json
          jq -e --arg base "${PR_BASE_SHA}" --arg head "${PR_HEAD_SHA}" '
            (.parents | length) == 2
            and .parents[0].sha == $base
            and .parents[1].sha == $head
          ' merge-identity.json >/dev/null

          state=failure
          description="quality-quick or merge provenance failed"
          if [[ "${STATIC_RESULT}" == "success" && "${QUICK_RESULT}" == "success" ]]; then
            state=success
            description="quality-quick passed on verified PR merge snapshot"
          fi

          jq -n \
            --arg state "${state}" \
            --arg context "quality-quick" \
            --arg description "${description}" \
            --arg target_url "${RUN_URL}" \
            '{state:$state,context:$context,description:$description,target_url:$target_url}' \
            > required-status-request.json
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/statuses/${PR_HEAD_SHA}" \
            --input required-status-request.json \
            > required-status-response.json
          jq -e --arg state "${state}" --arg sha "${PR_HEAD_SHA}" '
            .state == $state and .sha == $sha and .context == "quality-quick"
          ' required-status-response.json >/dev/null
          [[ "${state}" == "success" ]]

  quality-integration:
    if: github.event_name != 'pull_request'
    needs: quality-quick-execution
    runs-on: ubuntu-24.04
    services:
      pgvector:
        image: pgvector/pgvector@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          POSTGRES_DB: agent_test
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - name: Bootstrap locked uv
        run: >-
          "${pythonLocation}/bin/python" -m pip install --disable-pip-version-check
          --require-hashes --only-binary=:all:
          -r deployment/ci/uv-requirements-linux-x86_64.txt
      - name: Validate locked runtime toolchain
        env:
          QUALITY_TOOLCHAIN_RESULT: ${{ runner.temp }}/quality-toolchain-${{ github.job }}.json
        run: >-
          "${pythonLocation}/bin/python" -B scripts/quality_toolchain_contract.py
          --workspace-root . --runtime-only --output "$QUALITY_TOOLCHAIN_RESULT"
      - name: Install locked Python environments
        run: |
          cd services/agent-service && uv sync --locked --all-groups
          cd ../business-service && uv sync --locked --all-groups
          cd ../agent-service/frontend && npm ci --ignore-scripts=false
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Create integration quality target
        env:
          QUALITY_TARGET: ${{ github.workspace }}/.quality/targets/quality-target-integration.md
        run: '"${pythonLocation}/bin/python" -B scripts/create_ci_quality_target.py --output "$QUALITY_TARGET" --ref "${{ github.sha }}" --workflow quality-integration --claims-source governance/claims/v20.6.2-project-integration-certification.json'
      - name: Start deterministic model and both services
        env:
          APP_PROFILE: local
          PYTHONDONTWRITEBYTECODE: '1'
          OPENAI_API_KEY: deterministic-ci-key
          OPENAI_API_BASE: http://127.0.0.1:18081/v1
          OPENAI_MODEL: deterministic-ci-model
          BUSINESS_SERVICE_TOKEN: dev-service-token
          BUSINESS_REQUIRE_ACTOR_SIGNATURE: 'false'
          BUSINESS_SEED_DEMO_DATA: 'true'
          BUSINESS_SERVICE_RELOAD: 'false'
          AGENT_SERVICE_RELOAD: 'false'
          WEB_CONSOLE_DEV_LOGIN: 'true'
          AGENT_REQUIRE_AUTH: 'true'
          AGENT_AUTH_PROVIDER: dev_token
          RAG_BACKEND: local_sparse
          AGENT_DB_BACKEND: sqlite
          CHECKPOINT_BACKEND: sqlite
          SQLITE_DB_PATH: ${{ runner.temp }}/agent.db
          CHECKPOINT_DB_PATH: ${{ runner.temp }}/checkpoints.db
          BUSINESS_DB_PATH: ${{ runner.temp }}/business.db
        run: |
          services/agent-service/.venv/bin/python -m uvicorn tests.integration.model_stub:app --app-dir services/agent-service --host 127.0.0.1 --port 18081 > "${RUNNER_TEMP}/model-stub.log" 2>&1 &
          services/business-service/.venv/bin/python services/business-service/scripts/run_business_api.py > "${RUNNER_TEMP}/business.log" 2>&1 &
          services/agent-service/.venv/bin/python services/agent-service/scripts/run_api.py > "${RUNNER_TEMP}/agent.log" 2>&1 &
          for _ in $(seq 1 30); do curl --fail --silent http://127.0.0.1:9000/health && curl --fail --silent http://127.0.0.1:8000/health && exit 0; sleep 2; done
          exit 1
      - name: Run integration quality gates
        env:
          APP_PROFILE: local
          PYTHONDONTWRITEBYTECODE: '1'
          OPENAI_API_KEY: deterministic-ci-key
          OPENAI_API_BASE: http://127.0.0.1:18081/v1
          OPENAI_MODEL: deterministic-ci-model
          BUSINESS_SERVICE_BASE_URL: http://127.0.0.1:9000
          BUSINESS_SERVICE_TOKEN: dev-service-token
          AGENT_TEST_URL: http://127.0.0.1:8000
          BUSINESS_TEST_URL: http://127.0.0.1:9000
          PRODUCT_HTTP_SMOKE_EPHEMERAL_DATA: 'true'
          AGENT_TEST_POSTGRES_URL: postgresql+psycopg://agent:agent-test-password@127.0.0.1:5432/agent_test
          QUALITY_EVIDENCE_DIR: ${{ runner.temp }}/quality-evidence/integration
          QUALITY_TARGET: ${{ github.workspace }}/.quality/targets/quality-target-integration.md
        run: services/agent-service/.venv/bin/python -B scripts/quality_loop.py --mode integration --target "$QUALITY_TARGET"
      - name: Upload integration evidence and service logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-integration-evidence
          path: |
            ${{ runner.temp }}/quality-evidence/integration
            ${{ runner.temp }}/model-stub.log
            ${{ runner.temp }}/business.log
            ${{ runner.temp }}/agent.log
            ${{ github.workspace }}/.quality/targets/quality-target-integration.md
            ${{ github.workspace }}/.quality/targets/quality-target-integration.claims.json
            ${{ runner.temp }}/quality-toolchain-quality-integration.json

  governed-failure-stage1:
    if: >-
      ${{ always() && github.event_name == 'pull_request' &&
      (needs.skill-control-plane.result == 'failure' ||
      needs.quality-static.result == 'failure' ||
      needs.quality-quick-execution.result == 'failure') }}
    needs:
      - skill-control-plane
      - quality-static
      - quality-quick-execution
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Record direct quality failure receipt
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          SOURCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="[governed-ci-failure] run ${SOURCE_RUN_ID}"
          EXISTING=$(gh issue list --state all --search "${TITLE} in:title" \
            --json number --jq '.[0].number // empty')
          BODY=$(cat <<EOF
          The active Quality workflow reached its terminal governed Stage-1 handoff.

          - Stage: \`QUALITY_RUN_RECEIVED\`
          - Ingestion trigger: \`quality-in-run-stage1\`
          - Source workflow: \`quality\`
          - Source run: ${SOURCE_URL}
          - Run ID / attempt: \`${SOURCE_RUN_ID}/${SOURCE_RUN_ATTEMPT}\`
          - Head SHA: \`${SOURCE_SHA}\`
          - Ingestion classification: pending
          - Stage 2 started: \`false\`
          - Source changes: none
          - production_closed: false

          This receipt is created inside the already-active Quality workflow before trusted
          checkout, candidate checkout, artifact download, log parsing, or TaskRun ingestion.
          EOF
          )
          if [[ -n "${EXISTING}" ]]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
            ISSUE_NUMBER="${EXISTING}"
          else
            ISSUE_URL=$(gh issue create --title "${TITLE}" --body "${BODY}")
            ISSUE_NUMBER="${ISSUE_URL##*/}"
          fi
          [[ "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]]
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted Stage-1 control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Bind current failed Quality run
        id: source
        env:
          SOURCE_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          "${pythonLocation}/bin/python" -B control/scripts/github_quality_failure_event.py
          --event "$GITHUB_EVENT_PATH"
          --repository "$GITHUB_REPOSITORY"
          --run-id "${{ github.run_id }}"
          --run-attempt "${{ github.run_attempt }}"
          --workflow-url "$SOURCE_URL"
          --output incoming/source-event.json
          --github-output "$GITHUB_OUTPUT"

      - name: Checkout failed PR head as untrusted data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Download current-run artifacts as untrusted evidence
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: incoming/artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.run_id }}

      - name: Download completed Quality job logs as untrusted evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p incoming/logs
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/jobs?filter=latest&per_page=100" \
            --jq '.jobs[] | select(.status == "completed") | [.id, .name] | @tsv' \
            > incoming/completed-jobs.tsv
          while IFS=$'\t' read -r job_id job_name; do
            [[ "${job_id}" =~ ^[0-9]+$ ]] || continue
            safe_name=$(printf '%s' "${job_name}" | tr -cs 'A-Za-z0-9._-' '-')
            gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${job_id}/logs" \
              > "incoming/logs/${job_id}-${safe_name}.log" || true
          done < incoming/completed-jobs.tsv

      - name: Capture source PR changed-file metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR_NUMBER: ${{ steps.source.outputs.source_pr_number }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR_NUMBER}/files" \
            --jq '.[].filename' | jq -R -s 'split("\n")[:-1]' > incoming/changed-files.json

      - name: Ingest failure and create durable TaskRun
        id: ingest
        run: >-
          "${pythonLocation}/bin/python" -B control/scripts/github_failure_ingest_control_plane.py
          --event incoming/source-event.json
          --workspace candidate
          --artifacts incoming/artifacts
          --logs incoming/logs
          --changed-files incoming/changed-files.json
          --output incoming/failure-case.json
          --task-run incoming/task-run.json
          --github-output "$GITHUB_OUTPUT"

      - name: Upload direct Stage-1 evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-ci-quality-stage1-${{ github.run_id }}
          path: |
            incoming/source-event.json
            incoming/failure-case.json
            incoming/task-run.json
            incoming/changed-files.json
            incoming/completed-jobs.tsv
          retention-days: 30
          if-no-files-found: warn

      - name: Finalize direct Stage-1 issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.receipt.outputs.issue_number }}
          SOURCE_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ATTEMPT: ${{ github.run_attempt }}
          CLASSIFICATION: ${{ steps.ingest.outputs.classification }}
          REPAIR_ALLOWED: ${{ steps.ingest.outputs.repair_allowed }}
          FAILURE_SIGNATURE: ${{ steps.ingest.outputs.failure_signature }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Direct Quality Stage-1 ingestion completed.

          - Stage: \`QUALITY_RUN_INGESTED\`
          - Run ID / attempt: \`${SOURCE_RUN_ID}/${SOURCE_RUN_ATTEMPT}\`
          - Classification: \`${CLASSIFICATION}\`
          - Failure signature: \`${FAILURE_SIGNATURE}\`
          - Structurally eligible for later repair: \`${REPAIR_ALLOWED}\`
          - Stage 2 started by this job: \`false\`
          - Evidence artifact: \`governed-ci-quality-stage1-${SOURCE_RUN_ID}\`
          - Source changes: none
          - production_closed: false

          Stage 4A ends here. A separately governed Stage 4B handoff is required before any
          production Environment or model Secret can be accessed.
          EOF
          )
          gh issue comment "${ISSUE_NUMBER}" --body "${BODY}"

      - name: Mark direct Stage-1 pipeline failure
        if: ${{ failure() && steps.receipt.outputs.issue_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.receipt.outputs.issue_number }}
          SOURCE_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          gh issue comment "${ISSUE_NUMBER}" --body "Direct Quality Stage-1 ingestion stopped after receipt for run \`${SOURCE_RUN_ID}\`. Stage 2 remains disabled, source changes are none, and \`production_closed=false\`."
