name: governed-ci-failure-ingest

on:
  workflow_run:
    workflows:
      - quality
      - wp08-full-stack-certification
    types: [completed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read

env:
  GH_REPO: ${{ github.repository }}

concurrency:
  group: governed-ci-failure-${{ github.event_name }}-${{ github.event.workflow_run.id || github.event.comment.id }}
  cancel-in-progress: false

jobs:
  ingest:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion != 'success') || (github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.author_association == 'OWNER' && startsWith(github.event.comment.body, '/governed-repair-run ')) }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
      issues: write
      pull-requests: read
    steps:
      - name: Record workflow-run receipt
        if: ${{ github.event_name == 'workflow_run' }}
        id: receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          SOURCE_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          TITLE="[governed-ci-failure] run ${SOURCE_RUN_ID}"
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" \
            --json number --jq '.[0].number // empty')
          BODY=$(cat <<EOF
          GitHub emitted a failed workflow-run event and the governed bridge received it.

          - Stage: \`RECEIVED\`
          - Ingestion trigger: \`workflow_run\`
          - Source workflow: \`${SOURCE_WORKFLOW}\`
          - Source run: ${SOURCE_URL}
          - Run ID / attempt: \`${SOURCE_RUN_ID}/${SOURCE_RUN_ATTEMPT}\`
          - Conclusion: \`${SOURCE_CONCLUSION}\`
          - Head SHA: \`${SOURCE_SHA}\`
          - Ingestion classification: pending
          - Source changes: none
          - production_closed: false

          This receipt is written before checkout, artifact download, log parsing, or TaskRun creation.
          It proves event delivery independently from later ingestion success.
          EOF
          )
          if [[ -n "${EXISTING}" ]]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
            ISSUE_NUMBER="${EXISTING}"
          else
            ISSUE_URL=$(gh issue create --title "${TITLE}" --body "${BODY}")
            ISSUE_NUMBER="${ISSUE_URL##*/}"
          fi
          [[ "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]]
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted ingestion control plane
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: control
          fetch-depth: 1
          persist-credentials: false

      - name: Set up locked Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12.13'

      - name: Resolve and bind failed source run
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENT_ASSOCIATION: ${{ github.event.comment.author_association }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          if [[ "${EVENT_NAME}" == "workflow_run" ]]; then
            "${pythonLocation}/bin/python" - "$GITHUB_EVENT_PATH" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          event_path = Path(sys.argv[1])
          output_path = Path(sys.argv[2])
          event = json.loads(event_path.read_text(encoding="utf-8"))
          run = event.get("workflow_run")
          if not isinstance(run, dict):
              raise SystemExit("workflow_run event payload is missing")
          pull_requests = run.get("pull_requests") if isinstance(run.get("pull_requests"), list) else []
          first_pr = pull_requests[0] if pull_requests and isinstance(pull_requests[0], dict) else {}
          values = {
              "source_run_id": str(run.get("id") or ""),
              "source_run_attempt": str(run.get("run_attempt") or "1"),
              "source_pr_number": str(first_pr.get("number") or "0"),
              "head_sha": str(run.get("head_sha") or ""),
              "workflow_name": str(run.get("name") or ""),
              "source_conclusion": str(run.get("conclusion") or ""),
              "source_url": str(run.get("html_url") or ""),
              "trigger_mode": "workflow_run",
          }
          if not values["source_run_id"] or len(values["head_sha"]) != 40:
              raise SystemExit("workflow_run source identity is invalid")
          Path("incoming/source-event.json").write_text(
              json.dumps(event, ensure_ascii=False, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with output_path.open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  handle.write(f"{key}={value}\n")
          PY
          elif [[ "${EVENT_NAME}" == "issue_comment" ]]; then
            if [[ "${COMMENT_ASSOCIATION}" != "OWNER" ]]; then
              echo "Only a repository-owner comment may enter the recovery lane." >&2
              exit 1
            fi
            if [[ ! "${COMMENT_BODY}" =~ ^/governed-repair-run[[:space:]]+([1-9][0-9]*)[[:space:]]*$ ]]; then
              echo "Recovery command must be exactly: /governed-repair-run <numeric-run-id>" >&2
              exit 1
            fi
            SOURCE_RUN_ID="${BASH_REMATCH[1]}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" > incoming/source-run.json
            gh api "repos/${GITHUB_REPOSITORY}/pulls/${ISSUE_NUMBER}" > incoming/source-pr.json
            "${pythonLocation}/bin/python" -B control/scripts/github_failure_recovery_event.py \
              --comment "${COMMENT_BODY}" \
              --repository "${GITHUB_REPOSITORY}" \
              --issue-number "${ISSUE_NUMBER}" \
              --run-json incoming/source-run.json \
              --pr-json incoming/source-pr.json \
              --output incoming/source-event.json \
              --github-output "$GITHUB_OUTPUT"
            echo "trigger_mode=owner-comment-recovery" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported ingestion event: ${EVENT_NAME}" >&2
            exit 1
          fi

      - name: Record owner-recovery receipt
        if: ${{ github.event_name == 'issue_comment' }}
        id: recovery_receipt
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source_run_attempt }}
          SOURCE_WORKFLOW: ${{ steps.source.outputs.workflow_name }}
          SOURCE_CONCLUSION: ${{ steps.source.outputs.source_conclusion }}
          SOURCE_SHA: ${{ steps.source.outputs.head_sha }}
          SOURCE_URL: ${{ steps.source.outputs.source_url }}
        run: |
          set -euo pipefail
          TITLE="[governed-ci-failure] run ${SOURCE_RUN_ID}"
          EXISTING=$(gh issue list --state open --search "${TITLE} in:title" \
            --json number --jq '.[0].number // empty')
          BODY=$(cat <<EOF
          The repository owner authorized a bounded recovery of a missed workflow-run handoff.

          - Stage: \`RECEIVED\`
          - Ingestion trigger: \`owner-comment-recovery\`
          - Source workflow: \`${SOURCE_WORKFLOW}\`
          - Source run: ${SOURCE_URL}
          - Run ID / attempt: \`${SOURCE_RUN_ID}/${SOURCE_RUN_ATTEMPT}\`
          - Conclusion: \`${SOURCE_CONCLUSION}\`
          - Head SHA: \`${SOURCE_SHA}\`
          - Ingestion classification: pending
          - Source changes: none
          - production_closed: false

          The recovery binder verified the same repository, current open PR, exact current PR head,
          failed completed workflow, and exact numeric owner command before this receipt was written.
          EOF
          )
          if [[ -n "${EXISTING}" ]]; then
            gh issue comment "${EXISTING}" --body "${BODY}"
            ISSUE_NUMBER="${EXISTING}"
          else
            ISSUE_URL=$(gh issue create --title "${TITLE}" --body "${BODY}")
            ISSUE_NUMBER="${ISSUE_URL##*/}"
          fi
          [[ "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]]
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Select receipt issue
        id: issue
        env:
          WORKFLOW_RECEIPT: ${{ steps.receipt.outputs.issue_number }}
          RECOVERY_RECEIPT: ${{ steps.recovery_receipt.outputs.issue_number }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${WORKFLOW_RECEIPT:-${RECOVERY_RECEIPT:-}}"
          [[ "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]]
          echo "issue_number=${ISSUE_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Checkout failed source as untrusted data
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.source.outputs.head_sha }}
          path: candidate
          fetch-depth: 1
          persist-credentials: false

      - name: Download failed-run artifacts as untrusted evidence
        continue-on-error: true
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: incoming/artifacts
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.source.outputs.source_run_id }}

      - name: Download failed-run logs as untrusted evidence
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
        run: |
          set -euo pipefail
          mkdir -p incoming/logs
          if gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/logs" > incoming/logs.zip; then
            unzip -q incoming/logs.zip -d incoming/logs || true
          else
            rm -f incoming/logs.zip
          fi

      - name: Capture source PR changed-file metadata
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_PR_NUMBER: ${{ steps.source.outputs.source_pr_number }}
        run: |
          set -euo pipefail
          mkdir -p incoming
          if [[ -n "${SOURCE_PR_NUMBER}" && "${SOURCE_PR_NUMBER}" != "0" ]]; then
            gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${SOURCE_PR_NUMBER}/files" \
              --jq '.[].filename' | jq -R -s 'split("\n")[:-1]' > incoming/changed-files.json
          else
            printf '[]\n' > incoming/changed-files.json
          fi

      - name: Ingest failure and create durable TaskRun
        id: ingest
        run: >-
          "${pythonLocation}/bin/python" -B control/scripts/github_failure_ingest_control_plane.py
          --event incoming/source-event.json
          --workspace candidate
          --artifacts incoming/artifacts
          --logs incoming/logs
          --changed-files incoming/changed-files.json
          --output incoming/failure-case.json
          --task-run incoming/task-run.json
          --github-output "$GITHUB_OUTPUT"

      - name: Upload governed failure evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: governed-ci-failure-${{ steps.source.outputs.source_run_id }}
          path: |
            incoming/source-event.json
            incoming/failure-case.json
            incoming/task-run.json
            incoming/changed-files.json
          retention-days: 30
          if-no-files-found: error

      - name: Finalize governed failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_RUN_ATTEMPT: ${{ steps.source.outputs.source_run_attempt }}
          SOURCE_URL: ${{ steps.source.outputs.source_url }}
          TRIGGER_MODE: ${{ steps.source.outputs.trigger_mode }}
          CLASSIFICATION: ${{ steps.ingest.outputs.classification }}
          REPAIR_ALLOWED: ${{ steps.ingest.outputs.repair_allowed }}
          RECOVERY_DISPOSITION: ${{ steps.ingest.outputs.recovery_disposition }}
          HUMAN_REQUIRED: ${{ steps.ingest.outputs.human_required }}
          DIAGNOSTIC_ALLOWED: ${{ steps.ingest.outputs.diagnostic_allowed }}
          RETRY_ALLOWED: ${{ steps.ingest.outputs.retry_allowed }}
          FAILURE_SIGNATURE: ${{ steps.ingest.outputs.failure_signature }}
        run: |
          set -euo pipefail
          REMOTE_FALLBACK_ELIGIBLE="false"
          case "${RECOVERY_DISPOSITION}" in
            AUTO_REPAIR)
              NEXT_ACTION="AUTO_REPAIR_CONTINUATION"
              REMOTE_FALLBACK_ELIGIBLE="true"
              ;;
            AUTO_RETRY)
              NEXT_ACTION="AUTO_RETRY_PENDING"
              ;;
            AUTO_DIAGNOSE)
              NEXT_ACTION="READ_ONLY_DIAGNOSIS_REQUIRED"
              ;;
            WAIT_EXTERNAL)
              NEXT_ACTION="WAITING_EXTERNAL_RECOVERY"
              ;;
            HUMAN_REQUIRED)
              NEXT_ACTION="HUMAN_DECISION_REQUIRED"
              ;;
            *)
              if [[ "${REPAIR_ALLOWED}" == "true" ]]; then
                NEXT_ACTION="RETURN_TO_LOCAL_PATCH_OWNER"
                REMOTE_FALLBACK_ELIGIBLE="true"
              else
                NEXT_ACTION="HUMAN_DECISION_REQUIRED"
                HUMAN_REQUIRED="true"
              fi
              ;;
          esac
          BODY=$(cat <<EOF
          Stage-1 ingestion completed.

          - Stage: \`INGESTED\`
          - Ingestion trigger: \`${TRIGGER_MODE}\`
          - Source run: ${SOURCE_URL}
          - Run ID / attempt: \`${SOURCE_RUN_ID}/${SOURCE_RUN_ATTEMPT}\`
          - Classification: \`${CLASSIFICATION}\`
          - Failure signature: \`${FAILURE_SIGNATURE}\`
          - Recovery disposition: \`${RECOVERY_DISPOSITION:-UNKNOWN}\`
          - Human decision required now: \`${HUMAN_REQUIRED:-true}\`
          - Product/source automatic write eligible: \`${REPAIR_ALLOWED}\`
          - Read-only automatic diagnosis eligible: \`${DIAGNOSTIC_ALLOWED:-false}\`
          - Same-candidate automatic retry eligible: \`${RETRY_ALLOWED:-false}\`
          - Next action: \`${NEXT_ACTION}\`
          - Explicit remote Stage-2 fallback structurally eligible: \`${REMOTE_FALLBACK_ELIGIBLE}\`
          - Automatic remote Stage-2 dispatch: \`false\`
          - Evidence artifact: \`governed-ci-failure-${SOURCE_RUN_ID}\`
          - production_closed: false

          A failed attempt is recorded but does not automatically become a user interruption. Bounded
          repair/retry/diagnosis may continue only under the already-issued TaskRun authorities. Tests,
          acceptance, baseline/oracle changes, scope expansion, merge, deploy and production remain
          outside this Stage-1 authority. Human interaction is required only when the recovery policy
          explicitly reports \`HUMAN_REQUIRED\` or a later bounded recovery exhausts its budget.
          EOF
          )
          gh issue comment "${ISSUE_NUMBER}" --body "${BODY}"

      - name: Mark ingestion pipeline failure
        if: ${{ failure() && steps.issue.outputs.issue_number != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          SOURCE_URL: ${{ steps.source.outputs.source_url }}
        run: |
          set -euo pipefail
          BODY=$(cat <<EOF
          Stage-1 ingestion stopped after the receipt.

          - Stage: \`INGESTION_FAILED\`
          - Source run: ${SOURCE_URL}
          - Source Run ID: \`${SOURCE_RUN_ID}\`
          - Automatic repair authorized: false
          - Source changes: none
          - production_closed: false

          Inspect the governed-ci-failure-ingest job. The receipt proves the source identity was
          accepted, while this marker proves the failure occurred inside ingestion.
          EOF
          )
          gh issue comment "${ISSUE_NUMBER}" --body "${BODY}"

      - name: Publish ingestion summary
        if: always()
        env:
          CLASSIFICATION: ${{ steps.ingest.outputs.classification }}
          REPAIR_ALLOWED: ${{ steps.ingest.outputs.repair_allowed }}
          RECOVERY_DISPOSITION: ${{ steps.ingest.outputs.recovery_disposition }}
          HUMAN_REQUIRED: ${{ steps.ingest.outputs.human_required }}
          DIAGNOSTIC_ALLOWED: ${{ steps.ingest.outputs.diagnostic_allowed }}
          RETRY_ALLOWED: ${{ steps.ingest.outputs.retry_allowed }}
          SOURCE_RUN_ID: ${{ steps.source.outputs.source_run_id }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.issue_number }}
          TRIGGER_MODE: ${{ steps.source.outputs.trigger_mode }}
        run: |
          {
            echo "## Governed CI failure ingestion"
            echo
            echo "- Source Run ID: \`${SOURCE_RUN_ID}\`"
            echo "- Trigger mode: \`${TRIGGER_MODE}\`"
            echo "- Receipt issue: \`#${ISSUE_NUMBER}\`"
            echo "- Classification: \`${CLASSIFICATION:-not-produced}\`"
            echo "- Recovery disposition: \`${RECOVERY_DISPOSITION:-not-produced}\`"
            echo "- Human decision required now: \`${HUMAN_REQUIRED:-true}\`"
            echo "- Product/source automatic write eligibility: \`${REPAIR_ALLOWED:-false}\`"
            echo "- Read-only diagnosis eligibility: \`${DIAGNOSTIC_ALLOWED:-false}\`"
            echo "- Same-candidate retry eligibility: \`${RETRY_ALLOWED:-false}\`"
            echo "- Automatic remote Stage 2 dispatch: \`false\`"
            echo "- Source changes: none"
            echo "- production_closed: false"
          } >> "$GITHUB_STEP_SUMMARY"
