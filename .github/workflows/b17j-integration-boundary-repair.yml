name: B17j Integration Real Model Boundary Repair

on:
  push:
    branches:
      - agent/fix-integration-real-model-boundary
    paths:
      - scripts/b17j_fix_integration_real_model_boundary.py
      - .github/workflows/b17j-integration-boundary-repair.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.13'
      - name: Apply bounded profile repair
        id: apply
        shell: bash
        run: |
          if [ ! -f scripts/b17j_fix_integration_real_model_boundary.py ]; then
            echo "applied=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          "${pythonLocation}/bin/python" -B scripts/b17j_fix_integration_real_model_boundary.py
          echo "applied=true" >> "$GITHUB_OUTPUT"
      - name: Commit exact repaired tree
        if: steps.apply.outputs.applied == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add governance/quality-loop-policy.json \
                  services/agent-service/tests/architecture/test_quality_loop_governance.py \
                  PHASE_CANDIDATE_MANIFEST.json \
                  scripts/b17j_fix_integration_real_model_boundary.py
          git diff --cached --check
          git commit -m "Repair integration real-model gate boundary"
          git push origin HEAD:${{ github.ref_name }}
