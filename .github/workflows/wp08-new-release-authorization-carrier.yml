name: wp08-new-release-authorization-carrier

"on":
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  actions: write
  issues: read

concurrency:
  group: wp08-new-release-authorization-carrier
  cancel-in-progress: false

jobs:
  authorize-new-release-run:
    if: github.event.pull_request.head.ref == 'wp08-new-release-authorization-carrier-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      EXPECTED_MAIN_SHA: 30631197ce24ebd5fc2f2605fafdcb92b78becb2
      EXHAUSTED_ISSUE: '293'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact repaired main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ env.EXPECTED_MAIN_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify authorization preconditions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
          python - <<'PY'
          import json, os
          from urllib import request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          expected = os.environ['EXPECTED_MAIN_SHA']
          exhausted_issue = os.environ['EXHAUSTED_ISSUE']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(path):
              req = request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          issue = get(f'/issues/{exhausted_issue}')
          body = str(issue.get('body') or '')
          if '"attempt": 8' not in body or '"max_attempts": 8' not in body:
              raise SystemExit('historical ReleaseRun is not exhausted at 8/8')
          if '"status": "ATTEMPT_BUDGET_EXHAUSTED"' not in body:
              raise SystemExit('historical ReleaseRun is not terminal ATTEMPT_BUDGET_EXHAUSTED')
          if '"production_closed": false' not in body:
              raise SystemExit('historical ReleaseRun unexpectedly claims production closure')

          quality = get('/actions/workflows/quality.yml/runs?event=push&branch=main&per_page=50')
          matches = [r for r in quality.get('workflow_runs') or []
                     if str(r.get('head_sha') or '') == expected
                     and str(r.get('head_branch') or '') == 'main'
                     and str(r.get('status') or '') == 'completed'
                     and str(r.get('conclusion') or '') == 'success']
          if not matches:
              raise SystemExit('exact repaired main has no successful push Quality')
          print(json.dumps({'status':'PASS','main_sha':expected,'quality_run_id':max(matches,key=lambda r:int(r['id']))['id']}))
          PY

      - name: Dispatch a new protected-main ReleaseRun authorization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from urllib import request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
              'Content-Type': 'application/json',
          }
          payload = json.dumps({'ref':'main'}).encode('utf-8')
          req = request.Request(
              f'https://api.github.com/repos/{repo}/actions/workflows/wp08-release-coordinator.yml/dispatches',
              data=payload,
              headers=headers,
              method='POST',
          )
          with request.urlopen(req, timeout=30) as response:
              if response.status not in (200, 204):
                  raise SystemExit(f'coordinator dispatch returned {response.status}')
          print(json.dumps({'status':'DISPATCHED','workflow':'wp08-release-coordinator.yml','ref':'main'}))
          PY

      - name: Prove new ReleaseRun and Attempt 1 were created
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, time
          from urllib import parse, request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GITHUB_TOKEN']
          expected = os.environ['EXPECTED_MAIN_SHA']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': f'Bearer {token}',
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(path):
              req = request.Request(f'https://api.github.com/repos/{repo}{path}', headers=headers)
              with request.urlopen(req, timeout=30) as response:
                  return json.load(response)

          deadline = time.time() + 8 * 60
          last = None
          while time.time() < deadline:
              issues = get('/issues?state=open&per_page=100')
              candidates = []
              for issue in issues:
                  if 'pull_request' in issue:
                      continue
                  if not str(issue.get('title') or '').startswith('[WP08 Release] wp08-release-'):
                      continue
                  if int(issue.get('number') or 0) == int(os.environ['EXHAUSTED_ISSUE']):
                      continue
                  body = str(issue.get('body') or '')
                  if f'"authorized_initial_sha": "{expected}"' not in body:
                      continue
                  if f'"current_candidate_sha": "{expected}"' not in body:
                      continue
                  candidates.append(issue)
              if candidates:
                  issue = max(candidates, key=lambda row: int(row.get('number') or 0))
                  body = str(issue.get('body') or '')
                  last = {'issue_number': int(issue['number']), 'title': issue['title']}
                  if '"attempt": 1' not in body:
                      raise SystemExit('new ReleaseRun did not start at Attempt 1')
                  if '"max_attempts": 8' not in body:
                      raise SystemExit('new ReleaseRun has unexpected attempt budget')
                  if '"production_closed": false' not in body:
                      raise SystemExit('new ReleaseRun unexpectedly claims production closure')
                  if '"status": "CERTIFYING"' not in body:
                      raise SystemExit('new ReleaseRun did not reach CERTIFYING after exact-main Quality')
                  # Resolve the exact dispatched WP-08 run from the issue state.
                  marker = '"current_wp08_run_id": '
                  start = body.find(marker)
                  if start < 0:
                      raise SystemExit('new ReleaseRun has no current WP-08 run id')
                  start += len(marker)
                  end = body.find(',', start)
                  run_id = int(body[start:end].strip())
                  run = get(f'/actions/runs/{run_id}')
                  if str(run.get('name') or '') != 'wp08-full-stack-certification':
                      raise SystemExit('current run is not WP-08 certification')
                  if str(run.get('event') or '') != 'workflow_dispatch':
                      raise SystemExit('Attempt 1 was not workflow_dispatch authorized')
                  if str(run.get('head_branch') or '') != 'main' or str(run.get('head_sha') or '') != expected:
                      raise SystemExit('Attempt 1 is not bound to exact repaired main')
                  print(json.dumps({
                      'status':'PASS',
                      'new_release_issue':int(issue['number']),
                      'release_title':issue['title'],
                      'attempt':1,
                      'wp08_run_id':run_id,
                      'wp08_status':run.get('status'),
                      'candidate_sha':expected,
                  }, sort_keys=True))
                  break
              time.sleep(10)
          else:
              raise SystemExit('timed out waiting for new ReleaseRun/Attempt 1: ' + json.dumps(last))
          PY

      - name: Recheck main and historical ledger remained unchanged by carrier
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN_SHA"
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "$EXPECTED_MAIN_SHA"
