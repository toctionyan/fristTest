name: One Time Production Certification Dispatch

"on":
  push:
    branches:
      - agent/dispatch-production-8e3b3f6
    paths:
      - .github/workflows/one-time-production-dispatch.yml

permissions:
  actions: write
  contents: read
  issues: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      EXPECTED_MAIN_SHA: 8e3b3f6c608b6a5f00eae7e96b3e2589965962b8
    steps:
      - name: Dispatch protected production certification on exact main
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["REPOSITORY"]
          token = os.environ["GH_TOKEN"]
          expected_sha = os.environ["EXPECTED_MAIN_SHA"]
          api = f"https://api.github.com/repos/{repo}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "one-time-production-certification-dispatch",
          }

          def request(method: str, url: str, payload=None):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = response.read()
                      return response.status, json.loads(body) if body else None
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  return exc.code, body

          def comment(body: str) -> None:
              status, response = request("POST", f"{api}/issues/7/comments", {"body": body})
              if status != 201:
                  print(f"warning: failed to comment on PR #7: HTTP {status}: {response}")

          status, ref_payload = request("GET", f"{api}/git/ref/heads/main")
          if status != 200 or not isinstance(ref_payload, dict):
              comment(f"AUTOMATED_PRODUCTION_DISPATCH_FAILED expected_main_sha=`{expected_sha}` reason=main_ref_unavailable http_status={status}")
              raise SystemExit(f"failed to resolve main ref: HTTP {status}")

          clean_sha = str(((ref_payload.get("object") or {}).get("sha") or ""))
          if clean_sha != expected_sha:
              comment(
                  "AUTOMATED_PRODUCTION_DISPATCH_FAILED\n\n"
                  f"- expected_main_sha: `{expected_sha}`\n"
                  f"- actual_main_sha: `{clean_sha}`\n"
                  "- reason: main moved; refusing to certify an unreviewed commit"
              )
              raise SystemExit(f"main moved: expected {expected_sha}, got {clean_sha}")

          dispatch_payload = {
              "ref": "main",
              "inputs": {
                  "provider": "deepseek",
                  "model": "deepseek-v4-flash",
                  "embedding_model": "text-embedding-v4",
                  "embedding_dimension": "1024",
              },
          }
          status, body = request(
              "POST",
              f"{api}/actions/workflows/release.yml/dispatches",
              dispatch_payload,
          )
          if status != 204:
              comment(
                  "AUTOMATED_PRODUCTION_DISPATCH_FAILED\n\n"
                  f"- clean_main_sha: `{clean_sha}`\n"
                  f"- http_status: `{status}`\n"
                  "- reason: workflow_dispatch request rejected"
              )
              raise SystemExit(f"workflow dispatch failed: HTTP {status}: {body}")

          run = None
          for _ in range(90):
              query = urllib.parse.urlencode({
                  "event": "workflow_dispatch",
                  "branch": "main",
                  "per_page": 20,
              })
              status, payload = request(
                  "GET",
                  f"{api}/actions/workflows/release.yml/runs?{query}",
              )
              if status == 200 and isinstance(payload, dict):
                  for candidate in payload.get("workflow_runs") or []:
                      if str(candidate.get("head_sha") or "") == clean_sha:
                          run = candidate
                          break
              if run is not None:
                  break
              time.sleep(2)

          if run is None:
              comment(
                  "AUTOMATED_PRODUCTION_DISPATCH_PENDING\n\n"
                  f"- clean_main_sha: `{clean_sha}`\n"
                  "- dispatch was accepted, but the matching Run ID was not observed before timeout"
              )
              raise SystemExit("dispatch accepted but matching run was not observed")

          run_id = int(run["id"])
          run_url = str(run.get("html_url") or f"https://github.com/{repo}/actions/runs/{run_id}")
          comment(
              "AUTOMATED_PRODUCTION_DISPATCH_SUCCESS\n\n"
              f"- clean_main_sha: `{clean_sha}`\n"
              f"- production_run_id: `{run_id}`\n"
              f"- run: {run_url}"
          )
          print(json.dumps({
              "status": "DISPATCHED",
              "clean_main_sha": clean_sha,
              "run_id": run_id,
              "run_url": run_url,
          }))
          PY
